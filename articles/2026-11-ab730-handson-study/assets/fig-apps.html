<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1660px;background:#fff;font-family:'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif;color:#1f2937}
.wrap{margin:8px;padding:30px 34px 30px;border:3px solid #7c3aed33;border-radius:26px;background:linear-gradient(180deg,#fff,#faf8ff)}
h1{font-size:36px;font-weight:800;color:#7c3aed;display:flex;align-items:center;gap:14px;line-height:1.35;margin-bottom:6px}
h1:before{content:"";flex:none;width:10px;height:40px;border-radius:5px;background:#7c3aed}
.lead{font-size:25px;color:#475569;margin:0 0 22px 24px;line-height:1.6}
.band{border:3px solid #7c3aed;border-radius:24px;background:#fff;padding:20px 22px 24px;position:relative}
.bandt{display:inline-flex;align-items:center;gap:12px;font-size:27px;font-weight:800;color:#fff;background:#7c3aed;border-radius:999px;padding:6px 24px 6px 10px;margin-bottom:18px}
.bandt img{width:46px;height:46px;background:#fff;border-radius:50%;padding:4px}
.row{display:flex;align-items:stretch;justify-content:space-between}
.nd{flex:1;min-width:0;background:#fff;border:2.5px solid #e2e8f0;border-radius:20px;padding:16px 14px 18px;text-align:center;box-shadow:0 4px 14px rgba(15,23,42,.07)}
.nd.hl{border-color:#7c3aed}
.num{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#7c3aed;color:#fff;font-size:27px;font-weight:800;margin-bottom:8px}
.nd img.ic{width:84px;height:84px;display:block;margin:0 auto 8px}
.nm{font-size:27px;font-weight:800;line-height:1.35}
.ac{white-space:nowrap;font-size:21px;color:#334155;line-height:1.5;margin-top:8px;background:#f1f5f9;border-radius:12px;padding:8px 8px}
.tx{white-space:nowrap;font-size:23px;color:#475569;line-height:1.55;margin-top:8px}
.ar{flex:none;width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px}
.ar .lb{white-space:nowrap;font-size:21px;font-weight:800;color:#7c3aed;text-align:center;line-height:1.35;margin-bottom:6px;min-height:58px;display:flex;align-items:flex-end}
.ar svg{width:100%;height:26px;display:block}
.ar line{stroke:#7c3aed;stroke-width:5}
.ar polygon{fill:#7c3aed}
.below{display:flex;justify-content:space-between;margin-top:0}
.bl{flex:1;display:flex;flex-direction:column;align-items:center}
.gap{flex:none;width:150px}
.stem{width:4px;height:30px;background:repeating-linear-gradient(180deg,#94a3b8 0 6px,transparent 6px 11px)}
.att{display:flex;align-items:center;gap:12px;background:#f8fafc;border:2.5px dashed #cbd5e1;border-radius:18px;padding:12px 14px;width:100%;text-align:left}
.att img{flex:none;width:56px;height:56px}
.att b{white-space:nowrap;display:block;font-size:22px;line-height:1.35}
.att span{white-space:nowrap;display:block;font-size:19px;color:#64748b;line-height:1.45}
.notes{margin-top:22px;padding:16px 20px;background:#f1f5f9;border-radius:18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.notes b{font-size:24px;color:#0f172a;margin-right:6px}
.chip{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #cbd5e1;border-radius:999px;padding:6px 18px 6px 10px;font-size:23px;font-weight:700}
.chip img{width:38px;height:38px}
.chip.t{padding-left:18px}

.lanes{display:flex;flex-direction:column;gap:22px}
.lane{display:flex;align-items:stretch;background:#f8fafc;border:2px solid #e2e8f0;border-radius:22px;padding:16px 16px}
.lane.ac{background:#7c3aed0a;border-color:#7c3aed66}
.lane.ng{background:#f8fafc;border-style:dashed}
.ll{flex:none;width:190px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding-right:12px}
.ll b{font-size:25px;line-height:1.35;color:#0f172a}
.ll span{font-size:19px;color:#64748b;line-height:1.4}
.ll .tg{font-size:18px;font-weight:800;color:#fff;background:#7c3aed;border-radius:999px;padding:2px 14px}
.lane.ng .ll .tg{background:#94a3b8}
.nd2{flex:1;min-width:0;background:#fff;border:2.5px solid #e2e8f0;border-radius:18px;padding:12px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(15,23,42,.06)}
.nd2.hl{border-color:#7c3aed;border-width:3px}
.nd2.ok{border-color:#16a34a;border-width:3px;background:#f0fdf4}
.nd2.bad{border-color:#cbd5e1;border-style:dashed;background:#f8fafc;color:#64748b}
.nd2 .ics{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.nd2 .ics img{width:50px;height:50px}
.nd2 .ics .tx{height:50px;display:flex;align-items:center;font-size:20px;font-weight:900;color:#fff;background:#334155;border-radius:12px;padding:0 12px}
.nd2 .t{font-size:23px;font-weight:800;line-height:1.35;white-space:nowrap}
.nd2 .s{font-size:19px;color:#475569;line-height:1.45;margin-top:5px}
.nd2 .ch{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.nd2 .ch i{font-style:normal;font-size:17px;font-weight:700;background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:999px;padding:2px 10px;white-space:nowrap}
.ar3{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px}
.ar3 .lb{font-size:17px;font-weight:800;color:#7c3aed;text-align:center;line-height:1.3;margin-bottom:4px;white-space:nowrap}
.ar3 svg{width:70px;height:24px}
.ar3 line{stroke:#7c3aed;stroke-width:5}
.ar3 polygon{fill:#7c3aed}
.lane.ng .ar3 line{stroke:#94a3b8}
.lane.ng .ar3 polygon{fill:#94a3b8}
.lane.ng .ar3 .lb{color:#64748b}
.foot{margin-top:20px;font-size:23px;font-weight:800;color:#0f172a;background:#fff;border:2.5px solid #7c3aed;border-radius:18px;padding:12px 20px;text-align:center}
.foot em{font-style:normal;color:#7c3aed}
