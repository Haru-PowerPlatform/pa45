<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語テスト｜BlueSky 実力テスト対策（はるき）</title>
<style>
  :root{
    --bg:#0f1226; --card:#1b2040; --card2:#232a52; --line:#33407a;
    --txt:#eef1ff; --sub:#aab3e6; --accent:#5b8cff; --good:#27c08a; --bad:#ff6b7d;
    --warn:#ffce5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(160deg,#0f1226,#161a38 60%,#1a1330);
    color:var(--txt);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    line-height:1.6;min-height:100vh;padding:14px 12px 60px;
  }
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:1.18rem;margin:.2em 0 .1em;letter-spacing:.02em}
  .lead{color:var(--sub);font-size:.82rem;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode-btn{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 10px;color:var(--txt);text-align:left;cursor:pointer;transition:.15s;font-size:.92rem}
  .mode-btn:hover{border-color:var(--accent)}
  .mode-btn.on{border-color:var(--accent);background:#2b367a;box-shadow:0 0 0 2px rgba(91,140,255,.35) inset}
  .mode-btn b{display:block;font-size:1rem;margin-bottom:2px}
  .mode-btn span{color:var(--sub);font-size:.76rem}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  label.chk{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}
  select,input[type=text]{font-size:1rem;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  select{appearance:none}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer}
  .btn.sub{background:var(--card2);border:1px solid var(--line);color:var(--txt);font-weight:600}
  .btn.wide{width:100%}
  .hide{display:none!important}
  /* quiz */
  .meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.8rem;margin-bottom:10px}
  .bar{height:8px;border-radius:6px;background:#2a325f;overflow:hidden;margin-bottom:14px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#5b8cff,#27c08a);width:0%}
  .q-word{font-size:2.1rem;font-weight:800;text-align:center;margin:14px 0 4px;word-break:break-word}
  .q-sub{text-align:center;color:var(--sub);font-size:.86rem;margin-bottom:6px}
  .q-tag{display:inline-block;font-size:.72rem;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .q-word.say{cursor:pointer}
  .q-word.say::after{content:" 🔊";font-size:1.2rem}
  .speak-btn{background:var(--card2);border:1px solid var(--line);color:var(--accent);border-radius:999px;padding:7px 18px;font-size:.86rem;cursor:pointer;font-weight:600;margin:2px auto 4px;display:block}
  .speak-btn:active{transform:scale(.97)}
  .ans-box.say{cursor:pointer}
  .ans-box{text-align:center;font-size:1.5rem;font-weight:800;color:var(--good);min-height:1.6em;margin:10px 0}
  .ans-box small{display:block;font-size:.95rem;color:var(--sub);font-weight:500;margin-top:4px}
  .inp-grid{display:grid;gap:10px;margin:12px 0}
  .inp-grid label{font-size:.78rem;color:var(--sub);display:block;margin-bottom:3px}
  .judge{font-weight:800;text-align:center;font-size:1.05rem;margin:6px 0}
  .judge.ok{color:var(--good)} .judge.ng{color:var(--bad)}
  .actions{display:flex;gap:10px;margin-top:6px}
  .actions .btn{flex:1}
  .grade{display:flex;gap:10px;margin-top:6px}
  .grade .btn{flex:1}
  .btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
  .done{text-align:center;padding:20px 6px}
  .done .big{font-size:2.6rem;font-weight:900;margin:.1em 0}
  .small{font-size:.78rem;color:var(--sub)}
  .foot{text-align:center;color:var(--sub);font-size:.74rem;margin-top:20px}
  .pill{font-size:.74rem;color:var(--sub)}
  a.link{color:var(--accent)}
  .count-x{color:var(--bad);font-weight:700}
  kbd{background:#000;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>📘 英単語テスト <span class="pill">BlueSky 実力テスト対策</span></h1>
  <p class="lead">6/18 実力テスト・英語は単語がメイン。原形→意味、意味→英語、不規則動詞の3モード。間違えた単語は自動で記録されるよ。</p>

  <!-- セットアップ -->
  <div class="card" id="setup">
    <div class="modes" id="modes">
      <button class="mode-btn on" data-mode="e2j"><b>英 → 日</b><span>単語を見て意味を答える（自己採点）</span></button>
      <button class="mode-btn" data-mode="j2e"><b>日 → 英</b><span>意味を見て英語を入力（自動判定）</span></button>
      <button class="mode-btn" data-mode="verb"><b>不規則動詞</b><span>原形→過去形・過去分詞を入力</span></button>
      <button class="mode-btn" data-mode="review"><b>苦手だけ</b><span>×がついた単語だけ復習</span></button>
    </div>

    <div style="margin-top:14px" id="rangeWrap">
      <label class="small" for="range" style="display:block;margin-bottom:6px">出題範囲</label>
      <select id="range"></select>
    </div>

    <div class="row" style="margin-top:12px">
      <label class="chk"><input type="checkbox" id="shuffle" checked> シャッフル出題</label>
      <span class="pill" id="poolInfo"></span>
    </div>

    <div style="margin-top:16px">
      <button class="btn wide" id="startBtn">スタート ▶</button>
    </div>
  </div>

  <!-- クイズ -->
  <div class="card hide" id="quiz">
    <div class="meta">
      <span id="progressTxt">0 / 0</span>
      <span>正解 <b id="okCount">0</b>　<span class="count-x">× <b id="ngCount">0</b></span></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>

    <div class="q-word" id="qWord">—</div>
    <div class="q-sub" id="qSub"></div>
    <button class="speak-btn hide" id="speakBtn">🔊 発音を聞く</button>

    <!-- 入力モード -->
    <div id="inputArea" class="hide">
      <div class="inp-grid" id="inpGrid"></div>
      <div class="actions">
        <button class="btn" id="checkBtn">答え合わせ</button>
        <button class="btn sub" id="skipBtn" style="flex:0 0 auto">パス</button>
      </div>
    </div>

    <!-- 自己採点モード -->
    <div id="revealArea" class="hide">
      <div class="actions">
        <button class="btn wide" id="showBtn">答えを見る 👀</button>
      </div>
    </div>

    <div class="judge hide" id="judge"></div>
    <div class="ans-box hide" id="ansBox"></div>

    <div class="grade hide" id="gradeArea">
      <button class="btn bad" data-g="ng">できなかった ✕</button>
      <button class="btn good" data-g="ok">できた ◯</button>
    </div>
    <div class="actions hide" id="nextArea">
      <button class="btn wide" id="nextBtn">次へ ▶</button>
    </div>

    <div style="margin-top:14px;text-align:center">
      <button class="btn sub" id="quitBtn" style="padding:8px 14px;font-size:.85rem">やめて最初に戻る</button>
    </div>
  </div>

  <!-- 結果 -->
  <div class="card hide" id="result">
    <div class="done">
      <div class="small">おつかれさま！</div>
      <div class="big" id="scorePct">0%</div>
      <div id="scoreTxt" class="small"></div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-direction:column">
        <button class="btn wide" id="againWrongBtn">間違えた単語だけ もう一度 ✕</button>
        <button class="btn sub wide" id="againAllBtn">同じ範囲を もう一度</button>
        <button class="btn sub wide" id="homeBtn">最初の画面へ</button>
      </div>
    </div>
  </div>

  <div class="foot">
    進捗・苦手リストはこの端末（ブラウザ）に保存されます。<br>
    覚える単語・不規則動詞の元データ：BlueSky 単語集（番号 0201〜0608）
  </div>
</div>

/* ===== 状態 ===== */
const $ = id => document.getElementById(id);
const LS_WRONG = "haruki_engvocab_wrong_v1";
let mode = "e2j";
let queue = [];      // 出題リスト（WORDS要素の配列）
let idx = 0;
let okN = 0, ngN = 0;
let answered = false;
let currentWord = "";

/* 発音（Web Speech API・ブラウザ内蔵音声／APIキー不要） */
function speak(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    const t = String(text).replace(/^Mt\.$/,'mount').replace(/\./g,'');
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US"; u.rate = 0.9;
    const vs = window.speechSynthesis.getVoices();
    const en = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang));
    if(en) u.voice = en;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// 一部ブラウザは voices が非同期で読み込まれる
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>window.speechSynthesis.getVoices(); }

function getWrongSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(LS_WRONG)||"[]")); }catch(e){ return new Set(); }
}
function saveWrongSet(set){ localStorage.setItem(LS_WRONG, JSON.stringify([...set])); }
function markWrong(w, isWrong){
  const set = getWrongSet();
  if(isWrong) set.add(w); else set.delete(w);
  saveWrongSet(set);
}

/* ===== セットアップ画面 ===== */
function buildRangeOptions(){
  const sel = $("range");
  sel.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = "all"; optAll.textContent = "全範囲（約"+WORDS.length+"語）";
  sel.appendChild(optAll);
  SECTIONS.forEach((name,i)=>{
    const n = WORDS.filter(x=>x.s===i).length;
    const o = document.createElement("option");
    o.value = String(i); o.textContent = (i+1)+". "+name+"（"+n+"語）";
    sel.appendChild(o);
  });
}

function updatePoolInfo(){
  const pool = currentPool();
  let txt = pool.length + " 語";
  if(mode==="verb") txt = pool.length + " 個の不規則動詞";
  $("poolInfo").textContent = "出題数：" + txt;
}

function currentPool(){
  let pool = WORDS.slice();
  if(mode==="verb"){
    pool = pool.filter(x=>x.v);
  } else if(mode==="review"){
    const set = getWrongSet();
    pool = pool.filter(x=>set.has(x.w));
  } else {
    const r = $("range").value;
    if(r!=="all") pool = pool.filter(x=>x.s===Number(r));
  }
  return pool;
}

function setMode(m){
  mode = m;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
  // 範囲セレクトは 英→日 / 日→英 のときだけ意味がある
  $("rangeWrap").style.display = (m==="e2j"||m==="j2e") ? "" : "none";
  updatePoolInfo();
}

/* ===== クイズ進行 ===== */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(customQueue){
  let pool = customQueue || currentPool();
  if(pool.length===0){
    if(mode==="review"){ alert("間違えた単語はまだありません。まずは英→日や日→英でテストしてみよう！"); return; }
    alert("出題できる単語がありません。"); return;
  }
  queue = pool.slice();
  if($("shuffle").checked || customQueue) shuffle(queue);
  idx=0; okN=0; ngN=0;
  $("setup").classList.add("hide");
  $("result").classList.add("hide");
  $("quiz").classList.remove("hide");
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const item = queue[idx];
  // メタ
  $("progressTxt").textContent = (idx+1)+" / "+queue.length;
  $("okCount").textContent = okN;
  $("ngCount").textContent = ngN;
  $("barFill").style.width = Math.round(idx/queue.length*100)+"%";
  // リセット
  $("judge").className="judge hide"; $("judge").textContent="";
  $("ansBox").className="ans-box hide"; $("ansBox").innerHTML="";
  $("gradeArea").classList.add("hide");
  $("nextArea").classList.add("hide");
  $("inputArea").classList.add("hide");
  $("revealArea").classList.add("hide");

  if(mode==="e2j"){
    // 英→日：単語を見せて、答え（意味）を自己採点
    $("qWord").textContent = item.w;
    $("qSub").innerHTML = "意味を思い出そう" + (item.v?'<span class="q-tag">不規則動詞</span>':"");
    $("revealArea").classList.remove("hide");
  } else if(mode==="j2e"){
    // 日→英：意味を見せて英語を入力
    $("qWord").style.fontSize="1.5rem";
    $("qWord").textContent = item.m;
    $("qSub").innerHTML = "英語で入力" + (item.v?'<span class="q-tag">不規則動詞</span>':"");
    buildInputs([{key:"w",label:"英語",ph:"例：apple"}]);
    $("inputArea").classList.remove("hide");
  } else if(mode==="verb"){
    $("qWord").style.fontSize="2.1rem";
    $("qWord").textContent = item.w;
    $("qSub").textContent = "意味：" + item.m;
    buildInputs([
      {key:"p",label:"過去形",ph:"過去形を入力"},
      {key:"pp",label:"過去分詞",ph:"過去分詞を入力"}
    ]);
    $("inputArea").classList.remove("hide");
  } else if(mode==="review"){
    // 苦手：英→日と同じ自己採点方式
    $("qWord").textContent = item.w;
    $("qSub").innerHTML = "意味を思い出そう" + (item.v?'<span class="q-tag">不規則動詞</span>':"");
    $("revealArea").classList.remove("hide");
  }
  // 英→日のときフォントを戻す
  if(mode==="e2j"||mode==="verb"||mode==="review") $("qWord").style.fontSize="2.1rem";

  // 発音ボタン：英語が表示されているモードでは最初から、日→英は答え合わせ後に出す
  currentWord = item.w;
  const englishShown = (mode!=="j2e");
  const qw = $("qWord");
  qw.classList.toggle("say", englishShown);
  qw.onclick = englishShown ? (()=>speak(currentWord)) : null;
  $("speakBtn").classList.toggle("hide", !englishShown);
}

function buildInputs(fields){
  const g = $("inpGrid"); g.innerHTML="";
  fields.forEach((f,i)=>{
    const wrap=document.createElement("div");
    wrap.innerHTML = '<label>'+f.label+'</label><input type="text" autocapitalize="off" autocomplete="off" spellcheck="false" data-key="'+f.key+'" placeholder="'+f.ph+'">';
    g.appendChild(wrap);
  });
  const first = g.querySelector("input");
  if(first) setTimeout(()=>first.focus(), 30);
  // Enterで答え合わせ
  g.querySelectorAll("input").forEach((inp,i,arr)=>{
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        if(i<arr.length-1){ arr[i+1].focus(); }
        else { e.preventDefault(); doCheck(); }
      }
    });
  });
}

function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/\.$/,""); }

// 「got / gotten」のように複数許容を判定
function matchAns(input, correct){
  const i = norm(input);
  const parts = correct.split("/").map(x=>norm(x));
  return parts.includes(i);
}

function doCheck(){
  if(answered) return;
  const item = queue[idx];
  const inputs = [...$("inpGrid").querySelectorAll("input")];
  let allOk = true;
  let ansHtml = "";
  if(mode==="j2e"){
    const v = inputs[0].value;
    // 単語に「/」区切りは無いので完全一致（大小無視）
    const ok = norm(v)===norm(item.w) || matchAns(v,item.w);
    allOk = ok;
    ansHtml = '<span>'+item.w+'</span><small>'+item.m+'</small>';
  } else if(mode==="verb"){
    const okP = matchAns(inputs[0].value, item.v[0]);
    const okPP = matchAns(inputs[1].value, item.v[1]);
    allOk = okP && okPP;
    ansHtml = '<span>'+item.w+' － '+item.v[0]+' － '+item.v[1]+'</span><small>'+item.m+'</small>';
  }
  finishJudge(allOk, ansHtml, item);
}

function finishJudge(isOk, ansHtml, item){
  answered=true;
  const j=$("judge");
  j.className = "judge " + (isOk?"ok":"ng");
  j.textContent = isOk ? "◯ 正解！" : "✕ おしい！もう一度覚えよう";
  j.classList.remove("hide");
  const a=$("ansBox");
  a.innerHTML = ansHtml;
  a.classList.remove("hide");
  if(isOk){ okN++; } else { ngN++; }
  markWrong(item.w, !isOk);
  $("okCount").textContent=okN; $("ngCount").textContent=ngN;
  $("nextArea").classList.remove("hide");
  $("inputArea").classList.add("hide");
  // 答え合わせ後：英単語を発音できるように
  $("speakBtn").classList.remove("hide");
  const a2=$("ansBox"); a2.classList.add("say"); a2.onclick=()=>speak(item.w);
  speak(item.w);
  $("nextBtn").focus();
}

/* 自己採点（英→日 / 苦手）：答えを見る → できた/できなかった */
function showAnswer(){
  const item = queue[idx];
  let extra = item.v ? '<small>'+item.w+' － '+item.v[0]+' － '+item.v[1]+'（不規則）</small>' : '';
  $("ansBox").innerHTML = '<span>'+item.m+'</span>'+extra;
  $("ansBox").classList.remove("hide");
  $("revealArea").classList.add("hide");
  $("gradeArea").classList.remove("hide");
  speak(item.w);
}

function grade(isOk){
  const item = queue[idx];
  answered=true;
  if(isOk) okN++; else ngN++;
  markWrong(item.w, !isOk);
  $("okCount").textContent=okN; $("ngCount").textContent=ngN;
  $("gradeArea").classList.add("hide");
  next();
}

function next(){
  idx++;
  if(idx>=queue.length){ showResult(); return; }
  renderQuestion();
}

function showResult(){
  $("quiz").classList.add("hide");
  $("result").classList.remove("hide");
  const total = okN+ngN;
  const pct = total? Math.round(okN/total*100):0;
  $("scorePct").textContent = pct+"%";
  $("scorePct").style.color = pct>=80?"var(--good)": pct>=50?"var(--warn)":"var(--bad)";
  let msg = "正解 "+okN+" ／ "+total+"問　（× "+ngN+"）";
  if(pct>=90) msg += "<br>すごい！ほぼ完璧 🎉";
  else if(pct>=70) msg += "<br>いい感じ！×だけ繰り返そう 💪";
  else msg += "<br>×がついた単語を『苦手だけ』で潰そう 🔁";
  $("scoreTxt").innerHTML = msg;
  // 間違えた単語が無ければボタンを隠す
  $("againWrongBtn").style.display = ngN>0 ? "" : "none";
}

/* ===== イベント ===== */
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.addEventListener("click",()=>setMode(b.dataset.mode));
});
$("range").addEventListener("change", updatePoolInfo);
$("speakBtn").addEventListener("click", ()=>speak(currentWord));
$("startBtn").addEventListener("click", ()=>startQuiz());
$("checkBtn").addEventListener("click", doCheck);
$("skipBtn").addEventListener("click", ()=>{ // パス＝×扱い
  if(answered) return;
  const item=queue[idx];
  let ansHtml = mode==="verb"
    ? '<span>'+item.w+' － '+item.v[0]+' － '+item.v[1]+'</span><small>'+item.m+'</small>'
    : '<span>'+item.w+'</span><small>'+item.m+'</small>';
  finishJudge(false, ansHtml, item);
});
$("showBtn").addEventListener("click", showAnswer);
$("gradeArea").querySelectorAll("button").forEach(b=>{
  b.addEventListener("click",()=>grade(b.dataset.g==="ok"));
});
$("nextBtn").addEventListener("click", next);
$("quitBtn").addEventListener("click", ()=>{ $("quiz").classList.add("hide"); $("setup").classList.remove("hide"); updatePoolInfo(); });
$("againWrongBtn").addEventListener("click", ()=>{
  const wrongItems = queue.filter(it=>getWrongSet().has(it.w));
  if(wrongItems.length===0){ alert("間違えた単語はありません！"); return; }
  startQuiz(wrongItems);
});
$("againAllBtn").addEventListener("click", ()=>startQuiz(queue.slice()));
$("homeBtn").addEventListener("click", ()=>{ $("result").classList.add("hide"); $("setup").classList.remove("hide"); updatePoolInfo(); });

/* 初期化 */
buildRangeOptions();
setMode("e2j");
updatePoolInfo();
</script>
