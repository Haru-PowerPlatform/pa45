<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="twitter:title" content="PA45 第20回 参加者アンケート結果 — アダプティブカードの作り方">

  <meta name="twitter:image" content="https://haru-powerplatform.github.io/pa45/assets/ogp/og-survey.png">
  <link rel="canonical" href="https://haru-powerplatform.github.io/pa45/achievements/vol-20-survey.html">

  <style>
    .sv-hero{background:linear-gradient(135deg,#0a2a4d 0%,#14528f 55%,#2a7dd4 100%);color:#fff;padding:44px 0 40px;}
    .sv-eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.15);
      border:1px solid rgba(255,255,255,.3);padding:5px 14px;border-radius:999px;margin-bottom:16px;}
    .sv-eyebrow b{color:#ffe9a8;}
    .sv-h1{font-size:clamp(24px,4.5vw,34px);font-weight:900;line-height:1.3;letter-spacing:-.01em;}
    .sv-h1 small{display:block;font-size:16px;font-weight:600;color:#c9f7e2;margin-top:8px;}
    .sv-meta{font-size:13px;color:#bff3da;margin-top:14px;}
    .sv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px;}
    .sv-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:16px 14px;text-align:center;}
    .sv-stat .n{font-size:34px;font-weight:900;line-height:1;}
    .sv-stat .n span{font-size:18px;}
    .sv-stat .l{font-size:12px;font-weight:600;color:#bff3da;margin-top:8px;}
    .sv-card{background:var(--c-surface);border-radius:var(--radius-md);padding:18px 20px;box-shadow:var(--shadow-card);margin-bottom:14px;}
    .sv-q{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--c-text);}
    .sv-bar{height:26px;border-radius:8px;overflow:hidden;display:flex;background:#eef2f5;margin-bottom:10px;}
    .sv-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}
    .sv-legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--c-muted);}
    .sv-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle;}
    .sv-cando{list-style:none;padding:0;margin:0;}
    .sv-cando li{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--c-border);}
    .sv-cando li:last-child{border-bottom:none;}
    .sv-cando .cd-bar{flex:1;height:8px;background:#e6f4ee;border-radius:4px;overflow:hidden;}
    .sv-cando .cd-bar span{display:block;height:100%;background:#2a7dd4;}
    .sv-cando .cd-n{font-size:12px;color:var(--c-hint);width:44px;text-align:right;}
    .sv-cando .cd-l{width:min(48%,240px);font-weight:600;color:var(--c-text);}
    .voice-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .voice-card2{background:var(--c-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);
      padding:16px 18px;font-size:13px;line-height:1.7;color:var(--c-text);border-left:3px solid #2a7dd4;white-space:pre-wrap;}
    @media(max-width:640px){.voice-grid2{grid-template-columns:1fr;}.sv-stats{grid-template-columns:1fr;}.sv-cando .cd-l{width:auto;}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../" class="logo">PA45</a>
      <nav class="header-nav"><a href="../sessions/">Sessions</a><a href="../achievements/">活動の記録</a></nav>
    </div>
  </header>

  <section class="sv-hero">
    <div class="container">
      <span class="sv-eyebrow">PA45 <b>第20回</b> ｜ 参加者アンケート結果 📊</span>
      <h1 class="sv-h1">アダプティブカードの作り方<small>そっけない通知を、リッチカードに</small></h1>
      <div class="sv-meta" id="sv-meta">2026-07-23 開催 · 読み込み中…</div>
      <div class="sv-stats" id="sv-stats"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="sv-body"><p style="color:var(--c-muted);">アンケート結果を読み込み中です…</p></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;">
        <a href="../slides/vol-20/" class="btn-slide" style="display:inline-block;">📄 第20回の解説スライドを見る →</a>
        <a href="https://powerautomate-create.connpass.com/" target="_blank" rel="noopener" class="btn-slide-blog" style="display:inline-block;">📅 次回の開催をチェック →</a>
      </div>
    </div>
  </section>

  <footer class="site-footer"><div class="container"><p style="font-size:12px;color:var(--c-hint);text-align:center;padding:20px 0;">PA45 — Power Automateを45分で学ぶ初心者向けコミュニティ ／ 主催 Haru</p></div></footer>

  <script>
    const U_KEYS = [["とても理解できた","#0b7a4b"],["理解できた","#3aa876"],["普通","#9bd3b8"],["少し難しかった","#f0b884"],["難しかった","#e08060"]];
    const F_KEYS = [["役立ちそう","#0b7a4b"],["少し役立ちそう","#9bd3b8"],["まだイメージがついていない","#e08060"]];
    function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
    function stackBar(pcts, keys){
      let seg = keys.map(([k,c])=>{
        const p = pcts[k]||0;
        return p>0 ? `<div class="sv-seg" style="width:${p}%;background:${c};" title="${k} ${p}%">${p>=8?p+'%':''}</div>` : '';
      }).join('');
      let legend = keys.filter(([k])=> (pcts[k]||0)>0).map(([k,c])=>`<span><i style="background:${c}"></i>${esc(k)} ${pcts[k]}%</span>`).join('');
      return `<div class="sv-bar">${seg}</div><div class="sv-legend">${legend}</div>`;
    }
    (async function(){
      let d;
      for(const u of ["../data/surveys/vol-20.json","/pa45/data/surveys/vol-20.json"]){
        try{ const r=await fetch(u); if(r.ok){ d=await r.json(); break; } }catch(e){}
      }
      if(!d){ document.getElementById('sv-body').innerHTML='<p>結果の読み込みに失敗しました。</p>'; return; }
      document.getElementById('sv-meta').textContent = `2026-07-23 開催 · ${d.total_responses}名回答 · テーマ「アダプティブカードの作り方」`;
      document.getElementById('sv-stats').innerHTML =
        `<div class="sv-stat"><div class="n">${d.understanding_pct}<span>%</span></div><div class="l">内容が理解できた</div></div>`+
        `<div class="sv-stat"><div class="n">${d.usefulness_pct}<span>%</span></div><div class="l">業務に役立ちそう</div></div>`+
        `<div class="sv-stat"><div class="n">${d.total_responses}<span>名</span></div><div class="l">アンケート回答</div></div>`;

      // can_do
      const cdMax = Math.max(1, ...Object.values(d.can_do||{}));
      const cdHtml = Object.entries(d.can_do||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
        `<li><span class="cd-l">${esc(k)}</span><span class="cd-bar"><span style="width:${Math.round(v/cdMax*100)}%"></span></span><span class="cd-n">${v}人</span></li>`).join('');

      const voices = (d.comments||[]).map(c=>`<div class="voice-card2">${esc(c)}</div>`).join('');

      document.getElementById('sv-body').innerHTML =
        `<p class="section-label">受講者アンケート結果（第20回のみ）</p>`+
        `<div class="sv-card"><div class="sv-q">📘 内容は理解しやすかったですか？（理解度スコア ${d.understanding_pct}%）</div>${stackBar(d.understanding_pcts,U_KEYS)}</div>`+
        `<div class="sv-card"><div class="sv-q">🎯 学びは業務・生活に役立ちそうですか？（役立ちスコア ${d.usefulness_pct}%）</div>${stackBar(d.usefulness_pcts,F_KEYS)}</div>`+
        `<div class="sv-card"><div class="sv-q">✅ 今日できるようになったこと（複数選択）</div><ul class="sv-cando">${cdHtml}</ul></div>`+
        `<p class="section-label" style="margin-top:26px;">💬 参加者の声（全${(d.comments||[]).length}件）</p>`+
        `<div class="voice-grid2">${voices}</div>`;
    })();
  </script>
</body>
</html>
