<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- OGP / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PA45 — Power Automate 45">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://haru-powerplatform.github.io/pa45/achievements/survey.html">
  <meta property="og:title" content="PA45 受講者アンケート結果 — 全回まとめ">
  <meta property="og:description" content="PA45 全回の受講者アンケート結果。理解度・役立ち度・参加者の声を回ごとに公開しています。">
  <meta property="og:image" content="https://haru-powerplatform.github.io/pa45/assets/ogp/pa45-vol19-survey-ogp.png">

  <meta name="twitter:title" content="PA45 受講者アンケート結果 — 全回まとめ">
  <meta name="twitter:description" content="PA45 全回の受講者アンケート結果。理解度・役立ち度・参加者の声を回ごとに公開しています。">
  <meta name="twitter:image" content="https://haru-powerplatform.github.io/pa45/assets/ogp/pa45-vol19-survey-ogp.png">
  <link rel="canonical" href="https://haru-powerplatform.github.io/pa45/achievements/survey.html">

<style>
  :root{
    --bg:#f4f7fb; --surface:#ffffff; --text:#15202b; --muted:#5b6b7b; --hint:#93a1b0;
    --border:#e3e9f0; --blue:#2a7dd4; --blue-deep:#14528f; --green:#0e9f6e; --green-deep:#0b7a4b;
    --amber:#f4c04e; --radius:18px;
    --shadow:0 2px 10px rgba(20,50,90,.06);
    --shadow-hover:0 10px 30px rgba(20,50,90,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;}
  a{text-decoration:none;color:inherit;}
  .container{max-width:960px;margin:0 auto;padding:0 20px;}

  /* ===== header ===== */
  .top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);}
  .top-inner{display:flex;align-items:center;justify-content:space-between;height:54px;}
  .logo{font-weight:900;font-size:18px;letter-spacing:.02em;}
  .logo span{color:var(--blue);}
  .top-nav{display:flex;gap:18px;font-size:13px;font-weight:600;color:var(--muted);}
  .top-nav a:hover{color:var(--blue);}

  /* ===== hero ===== */
  .hero{position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(130deg,#0c2b52 0%,#14528f 45%,#2a7dd4 100%);}
  .hero::before,.hero::after{content:'';position:absolute;border-radius:50%;filter:blur(10px);opacity:.15;background:#9cc4f5;}
  .hero::before{width:480px;height:480px;right:-140px;top:-200px;}
  .hero::after{width:340px;height:340px;left:-120px;bottom:-160px;}
  .hero-inner{position:relative;z-index:2;padding:58px 0 54px;}
  .hero-eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
    padding:5px 16px;border-radius:999px;margin-bottom:18px;}
  .hero h1{font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1.25;letter-spacing:-.01em;}
  .hero p.lead{font-size:14px;color:#cfe2f8;margin-top:12px;max-width:560px;}
  .hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px;}
  .hstat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
    border-radius:16px;padding:16px 12px;text-align:center;backdrop-filter:blur(3px);}
  .hstat .n{font-size:clamp(24px,4vw,36px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .hstat .n small{font-size:.55em;font-weight:700;}
  .hstat .l{font-size:11px;font-weight:600;color:#bcd6f5;margin-top:8px;}

  /* ===== vol chips nav ===== */
  .chips-wrap{position:sticky;top:54px;z-index:40;background:rgba(244,247,251,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:6px 14px;cursor:pointer;transition:all .18s;}
  .chip:hover{color:var(--blue);border-color:var(--blue);}
  .chip.hot{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* ===== vol section ===== */
  .vol{margin:34px 0;opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease;}
  .vol.in{opacity:1;transform:none;}
  .vol-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;transition:box-shadow .25s;}
  .vol-card:hover{box-shadow:var(--shadow-hover);}
  .vol-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:20px 26px 16px;border-bottom:1px solid var(--border);}
  .vol-pill{font-size:13px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--blue-deep),var(--blue));
    padding:5px 15px;border-radius:999px;letter-spacing:.03em;flex-shrink:0;}
  .vol.latest .vol-pill{background:linear-gradient(135deg,var(--green-deep),var(--green));}
  .vol-theme{font-size:16px;font-weight:800;flex:1;min-width:200px;}
  .vol-date{font-size:12px;color:var(--hint);font-family:"DM Mono",monospace;}
  .vol-badge-latest{font-size:10px;font-weight:800;color:var(--green-deep);background:#e2f7ee;
    border:1px solid #b5e8d2;padding:2px 10px;border-radius:999px;letter-spacing:.06em;}
  .vol-body{padding:20px 26px 24px;}

  .score-row{display:grid;grid-template-columns:150px 1fr;gap:8px 18px;align-items:center;margin-bottom:16px;}
  .score-label{font-size:13px;font-weight:700;color:var(--muted);}
  .score-label .pct{display:block;font-size:22px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;}
  .bar{height:30px;border-radius:9px;overflow:hidden;display:flex;background:#edf1f6;}
  .seg{height:100%;width:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;
    transition:width 1.1s cubic-bezier(.25,.8,.3,1);}
  .legend{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--muted);margin-top:-6px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  .cando{margin-top:6px;border-top:1px dashed var(--border);padding-top:14px;}
  .cando-title{font-size:12px;font-weight:800;color:var(--hint);letter-spacing:.06em;margin-bottom:10px;}
  .cd-row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 42px;gap:12px;align-items:center;
    font-size:12.5px;padding:4px 0;}
  .cd-l{font-weight:600;color:var(--text);}
  .cd-bar{height:9px;background:#edf1f6;border-radius:5px;overflow:hidden;}
  .cd-bar span{display:block;height:100%;width:0;border-radius:5px;
    background:linear-gradient(90deg,var(--blue),#6fb1ee);transition:width 1s cubic-bezier(.25,.8,.3,1);}
  .vol.latest .cd-bar span{background:linear-gradient(90deg,var(--green),#57cfa2);}
  .cd-n{font-size:11.5px;color:var(--hint);text-align:right;font-variant-numeric:tabular-nums;}

  .voices-toggle{margin-top:18px;display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;user-select:none;
    background:none;border:none;font-family:inherit;}
  .voices-toggle:hover{text-decoration:underline;}
  .voices-toggle .arw{transition:transform .25s;display:inline-block;}
  .voices-toggle.open .arw{transform:rotate(90deg);}
  .voices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;
    max-height:0;overflow:hidden;transition:max-height .5s ease;}
  .voices.open{max-height:4000px;}
  .voice{background:#f7fafd;border-left:3px solid var(--blue);border-radius:10px;
    padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--text);white-space:pre-wrap;}
  .vol.latest .voice{border-left-color:var(--green);background:#f4fbf8;}

  .foot{padding:44px 0 60px;text-align:center;}
  .foot .cta{display:inline-block;font-size:14px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--blue-deep),var(--blue));
    padding:13px 30px;border-radius:12px;transition:transform .15s, box-shadow .2s;box-shadow:var(--shadow);}
  .foot .cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
  .foot p{font-size:12px;color:var(--hint);margin-top:16px;}

  @media(max-width:640px){
    .hero-stats{grid-template-columns:repeat(2,1fr);}
    .score-row{grid-template-columns:1fr;gap:6px;}
    .legend{grid-column:1;}
    .voices{grid-template-columns:1fr;}
    .cd-row{grid-template-columns:1fr;gap:4px;}
    .cd-n{text-align:left;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="container top-inner">
    <a href="../" class="logo">PA<span>45</span></a>
    <nav class="top-nav">
      <a href="../sessions/">参加する</a>
      <a href="../achievements/">活動</a>
      <a href="../achievements/survey.html" style="color:var(--blue);">アンケート</a>
      <a href="../about/">About</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container hero-inner">
    <span class="hero-eyebrow">📊 SURVEY RESULTS</span>
    <h1>受講者アンケート結果</h1>
    <p class="lead">PA45 全回のアンケート結果を、回ごとにまとめて公開しています。理解度・役立ち度のスコアと、参加者の声（原文）を掲載しています。</p>
    <div class="hero-stats">
      <div class="hstat"><div class="n" data-count id="st-vols">0</div><div class="l">開催回数（集計済み）</div></div>
      <div class="hstat"><div class="n" data-count id="st-resp">0</div><div class="l">アンケート回答数</div></div>
      <div class="hstat"><div class="n"><span data-count id="st-und">0</span><small>%</small></div><div class="l">平均理解度</div></div>
      <div class="hstat"><div class="n"><span data-count id="st-use">0</span><small>%</small></div><div class="l">平均役立ち度</div></div>
    </div>
  </div>
</section>

<div class="chips-wrap"><div class="container"><div class="chips" id="chips"></div></div></div>

<main class="container" id="list"></main>

<div class="foot">
  <a class="cta" href="https://powerautomate-create.connpass.com/" target="_blank" rel="noopener">📅 次回のPA45に参加する →</a>
  <p>PA45 — Power Automate を45分で学ぶ、初心者向けオンラインハンズオン ／ 主催 Haru</p>
</div>

<script>
const THEMES = {
  1:"変数の初期化", 2:"Set variable（変数を操作しよう）", 3:"条件分岐", 4:"Apply to each",
  5:"基礎固めWeek", 6:"Formsで自動お礼メール", 7:"FormsからSharePoint登録",
  8:"承認フロー（Approvals）", 9:"SharePoint更新をTeams通知", 10:"総復習回",
  11:"失敗しないフロー設計", 12:"式アレルギー卒業", 13:"Try-Catch",
  14:"JSONの読み方", 15:"共有フォルダ監視→自動メール通知",
  16:"Copilotと作るPower Automate", 17:"期限の見張り番",
  18:"承認エスカレーション", 19:"自動化の成果を“見える化”（効率化効果の見える化）"
};
const U_KEYS=[["とても理解できた","#0f6cbd"],["理解できた","#4f97dd"],["普通","#a9c9ec"],["少し難しかった","#f0b884"],["難しかった","#e08060"]];
const F_KEYS=[["役立ちそう","#0f6cbd"],["少し役立ちそう","#a9c9ec"],["まだイメージがついていない","#e08060"]];
const G_U=[["とても理解できた","#0b7a4b"],["理解できた","#3aa876"],["普通","#a8dcc4"],["少し難しかった","#f0b884"],["難しかった","#e08060"]];
const G_F=[["役立ちそう","#0b7a4b"],["少し役立ちそう","#a8dcc4"],["まだイメージがついていない","#e08060"]];
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function stackBar(pcts,keys){
  const segs=keys.map(([k,c])=>{
    const p=pcts?.[k]||0;
    return p>0?`<div class="seg" data-w="${p}" style="background:${c}" title="${k} ${p}%">${p>=10?p+'%':''}</div>`:'';
  }).join('');
  const leg=keys.filter(([k])=> (pcts?.[k]||0)>0)
    .map(([k,c])=>`<span><i style="background:${c}"></i>${esc(k)} ${pcts[k]}%</span>`).join('');
  return {bar:`<div class="bar">${segs}</div>`, leg:`<div class="legend">${leg}</div>`};
}

async function load(){
  const jobs=[];
  for(let v=1;v<=40;v++){
    const pad=String(v).padStart(2,'0');
    jobs.push(fetch(`../data/surveys/vol-${pad}.json`).then(r=>r.ok?r.json():null).catch(()=>null));
  }
  const all=(await Promise.all(jobs)).filter(Boolean).sort((a,b)=>b.vol-a.vol); // 新しい順
  if(!all.length){document.getElementById('list').innerHTML='<p style="padding:40px 0;color:var(--muted)">読み込みに失敗しました。</p>';return;}

  // hero stats
  const totalResp=all.reduce((s,d)=>s+(d.total_responses||0),0);
  const avgU=(all.reduce((s,d)=>s+(d.understanding_pct||0),0)/all.length).toFixed(1);
  const avgF=(all.reduce((s,d)=>s+(d.usefulness_pct||0),0)/all.length).toFixed(1);
  setCount('st-vols',all.length); setCount('st-resp',totalResp);
  setCount('st-und',parseFloat(avgU),1); setCount('st-use',parseFloat(avgF),1);

  // chips
  document.getElementById('chips').innerHTML =
    all.map(d=>`<a class="chip" href="#vol-${d.vol}" data-vol="${d.vol}">第${d.vol}回</a>`).join('');

  // sections
  const latest=all[0].vol;
  document.getElementById('list').innerHTML = all.map(d=>{
    const isLatest=d.vol===latest;
    const u=stackBar(d.understanding_pcts,isLatest?G_U:U_KEYS);
    const f=stackBar(d.usefulness_pcts,isLatest?G_F:F_KEYS);
    const cdMax=Math.max(1,...Object.values(d.can_do||{}));
    const cd=Object.entries(d.can_do||{}).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>
      `<div class="cd-row"><span class="cd-l">${esc(k)}</span><span class="cd-bar"><span data-w="${Math.round(v/cdMax*100)}"></span></span><span class="cd-n">${v}人</span></div>`).join('');
    const voices=(d.comments||[]).map(c=>`<div class="voice">${esc(c)}</div>`).join('');
    const nv=(d.comments||[]).length;
    return `
    <section class="vol ${isLatest?'latest':''}" id="vol-${d.vol}">
      <div class="vol-card">
        <div class="vol-head">
          <span class="vol-pill">Vol.${d.vol}</span>
          <span class="vol-theme">${esc(THEMES[d.vol]||'')}</span>
          ${isLatest?'<span class="vol-badge-latest">LATEST</span>':''}
          <span class="vol-date">${esc(d.date||'')} · ${d.total_responses}名回答</span>
        </div>
        <div class="vol-body">
          <div class="score-row">
            <div class="score-label">内容が理解できた<span class="pct">${d.understanding_pct}%</span></div>
            ${u.bar}${u.leg}
          </div>
          <div class="score-row">
            <div class="score-label">業務に役立ちそう<span class="pct">${d.usefulness_pct}%</span></div>
            ${f.bar}${f.leg}
          </div>
          ${cd?`<div class="cando"><div class="cando-title">✅ できるようになったこと（上位）</div>${cd}</div>`:''}
          ${nv?`<button class="voices-toggle" onclick="tgl(this)"><span class="arw">▶</span> 参加者の声を読む（全${nv}件）</button>
          <div class="voices">${voices}</div>`:''}
        </div>
      </div>
    </section>`;
  }).join('');

  // animations（scrollベース：IntersectionObserverが効かない環境でも確実に表示）
  function revealSection(sec){
    if(sec.classList.contains('in'))return;
    sec.classList.add('in');
    sec.querySelectorAll('.seg,[data-w]').forEach(el=>{
      const w=el.getAttribute('data-w'); if(w!=null) setTimeout(()=>el.style.width=w+'%',60);
    });
  }
  function onScroll(){
    const vh=window.innerHeight;
    let currentVol=null;
    document.querySelectorAll('.vol').forEach(sec=>{
      const r=sec.getBoundingClientRect();
      if(r.top < vh*0.88 && r.bottom > 0) revealSection(sec);
      if(r.top < vh*0.4 && r.bottom > vh*0.25) currentVol=sec.id.replace('vol-','');
    });
    if(currentVol){
      document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hot',c.dataset.vol==currentVol));
    }
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll);
  onScroll(); // 初期表示分
  setTimeout(()=>{document.querySelectorAll('.vol').forEach(revealSection);},4000); // 保険：4秒後に全表示

  // deep link (#vol-19) → 開いた状態でスクロール
  if(location.hash){
    const t=document.querySelector(location.hash);
    if(t){setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'start'}),350);}
  }
}
function tgl(btn){
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}
function setCount(id,target,dec=0){
  const el=document.getElementById(id);
  const dur=1300, t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(dec);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(()=>{el.textContent=target.toFixed(dec);},dur+150); // 非表示タブ等でrAFが止まっても最終値を保証
}
load();
</script>
</body>
</html>
