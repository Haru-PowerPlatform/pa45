<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA45 Badge Preview</title>
<style>
  body{margin:0;font-family:"Segoe UI","Noto Sans JP",sans-serif;background:#f1f5f9;
       display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px 16px;color:#0f172a}
  h1{font-size:18px;margin:0 0 4px}
  .row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.12);text-align:center}
  .card img{width:340px;height:340px;display:block}
  .label{margin-top:10px;font-size:14px;font-weight:600;color:#334155}
  .sub{font-size:12px;color:#64748b}
  /* メール内での実際の見え方（小さめ） */
  .mail{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;max-width:300px}
  .mail img{width:180px;height:180px}
</style>
</head>
<body>
  <h1>PA45 Vol.15 参加バッジ プレビュー</h1>
  <div class="row">
    <div class="card">
      <img src="session-015/badge.png?v=1" alt="Vol.15 badge">
      <div class="label">実寸に近い表示（340px）</div>
      <div class="sub">FOLDER WATCH MAIL / VOL.15 · 2026-06-18</div>
    </div>
    <div class="card mail">
      <img src="session-015/badge.png?v=1" alt="Vol.15 badge in mail">
      <div class="label">メール本文での見え方（約180px）</div>
      <div class="sub">添付＋本文表示イメージ</div>
    </div>
  </div>
</body>
</html>
