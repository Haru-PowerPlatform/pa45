<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.72-2 送りっぱなし追跡フローの作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B; --spo:#0F6CBD; --spo-dark:#0A4F8A;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.36;padding-right:100px;}
  .concl .txt b{color:var(--orange);}

  /* 2フロー構成 */
  .flows{flex:1 1 auto;margin:11px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0;}
  .fcol{display:flex;flex-direction:column;min-height:0;}
  .fhd{font-weight:900;font-size:21px;color:#fff;border-radius:12px 12px 0 0;padding:9px 14px;display:flex;align-items:center;gap:10px;}
  .fcol.a .fhd{background:linear-gradient(90deg,#1D4ED8,#3B82F6);}
  .fcol.b .fhd{background:linear-gradient(90deg,#B45309,#EA580C);}
  .fhd .fi{flex:0 0 auto;font-size:26px;}
  .fhd small{margin-left:auto;font-size:14.5px;font-weight:800;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 11px;white-space:nowrap;}
  .fbody{flex:1;border:2px solid;border-top:none;border-radius:0 0 12px 12px;padding:11px 12px;display:flex;flex-direction:column;gap:9px;min-height:0;}
  .fcol.a .fbody{border-color:#BFDBFE;background:#F7FAFF;}
  .fcol.b .fbody{border-color:#FDBA74;background:#FFFBF5;}

  .act{flex:1;background:#fff;border:1px solid #E1E7EF;border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 6px rgba(0,0,0,.06);min-height:0;}
  .act .ai{flex:0 0 auto;width:54px;height:54px;border-radius:10px;background:#F3F6FB;display:flex;align-items:center;justify-content:center;}
  .act .ai img{width:38px;height:38px;object-fit:contain;}
  .act .ai .em{font-size:34px;}
  .act .ac{flex:1;min-width:0;}
  .act .an{font-weight:900;font-size:19px;color:#243B58;line-height:1.25;}
  .act .an .sn{display:inline-flex;width:26px;height:26px;border-radius:50%;color:#fff;font-size:15px;font-weight:900;align-items:center;justify-content:center;margin-right:7px;vertical-align:-3px;}
  .fcol.a .an .sn{background:#2563EB;} .fcol.b .an .sn{background:#EA580C;}
  .act .ad{font-size:15.5px;font-weight:800;color:var(--weak);margin-top:4px;line-height:1.45;}
  .act .ad code{font-family:'Roboto Mono',monospace;font-size:14.5px;color:#0B3A8F;background:#EFF6FF;border-radius:5px;padding:1px 6px;}
  .fnote{flex:0 0 auto;font-size:15px;font-weight:800;line-height:1.4;border-radius:9px;padding:8px 11px;}
  .fcol.a .fnote{background:#EFF6FF;border:1px dashed #93C5FD;color:#1E40AF;}
  .fcol.b .fnote{background:#FFF7ED;border:1px dashed #FDBA74;color:#9A3412;}
  .fnote b{color:inherit;}
  .board{flex:0 0 auto;background:#fff;border:1px solid #DCE7F5;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .board .bh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15.5px;color:#0A4F8A;background:#EFF5FC;padding:6px 11px;border-bottom:1px solid #DCE7F5;}
  .board .bh img{width:22px;height:22px;object-fit:contain;}
  .board .brow{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:16px;font-weight:800;color:#243B58;border-bottom:1px solid #F1F5FB;}
  .board .brow:last-child{border-bottom:none;}
  .board .bc1{flex:1;} .board .bc2{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--weak);}
  .board .bc3{font-size:13.5px;font-weight:900;border-radius:999px;padding:2px 10px;}
  .board .bc3.wait{background:#FEE2E2;color:#991B1B;} .board .bc3.done{background:#DCFCE7;color:#166534;}
  .bmascot{position:absolute;right:-8px;bottom:64px;height:104px;z-index:20;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));}
  .fcol.b{position:relative;}

  .warn{flex:0 0 auto;margin:10px 16px 18px;background:#FFF7ED;border:2px solid #FDBA74;border-radius:12px;padding:9px 16px;display:flex;align-items:center;gap:16px;}
  .warn .wt{flex:0 0 auto;font-weight:900;font-size:17px;color:#9A3412;}
  .warn .wl{display:flex;gap:22px;flex-wrap:wrap;font-size:15.5px;font-weight:800;color:#7C2D12;line-height:1.35;}
  .warn code{font-family:'Roboto Mono',monospace;font-size:14px;background:#fff;border:1px solid #FDBA74;border-radius:5px;padding:1px 6px;}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgBulb='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>';

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.72-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方｜<span class="hl">“登録する”フローと“見張る”フローの2本立て</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgBulb}</div>
    <div class="txt">台帳（SharePointリスト）を1つ用意して、<b>登録する側</b>と<b>見張る側</b>の2つのフローではさむだけ。全部<b>標準コネクタ</b>です。</div>
  </div>

  <div class="flows">
    <div class="fcol a">
      <div class="fhd"><span class="fi">📮</span>フロー①　追跡ボードに登録<small>ボタンで起動</small></div>
      <div class="fbody">
        <div class="act">
          <div class="ai"><span class="em">👆</span></div>
          <div class="ac"><div class="an"><span class="sn">1</span>手動でフローをトリガー</div>
          <div class="ad">送信のあと、スマホやPCの<b>ボタンから起動</b>。宛先と件名を入力。</div></div>
        </div>
        <div class="act">
          <div class="ai"><img src="${A}icons/pa_sharepoint.png" alt=""></div>
          <div class="ac"><div class="an"><span class="sn">2</span>項目の作成</div>
          <div class="ad">追跡ボードに1行。<code>宛先／件名／送信日／返信済=いいえ</code></div></div>
        </div>
        <div class="board">
          <div class="bh"><img src="${A}icons/pa_sharepoint.png" alt="">追跡ボード（できあがり）</div>
          <div class="brow"><span class="bc1">A社 見積</span><span class="bc2">7/24</span><span class="bc3 wait">未返信</span></div>
          <div class="brow"><span class="bc1">B社 日程</span><span class="bc2">7/25</span><span class="bc3 done">返信済</span></div>
        </div>
        <div class="fnote">💡 会話IDも保存しておくと、返信が来た時に照合して自動で閉じられます。</div>
      </div>
    </div>

    <div class="fcol b">
      <div class="fhd"><span class="fi">👀</span>フロー②　3日たった行を催促<small>毎朝スケジュール</small></div>
      <div class="fbody">
        <div class="act">
          <div class="ai"><img src="${A}icons/pa_schedule.png" alt=""></div>
          <div class="ac"><div class="an"><span class="sn">1</span>繰り返し（毎朝9時）</div>
          <div class="ad">タイムゾーンは東京。営業日だけにしても◎。</div></div>
        </div>
        <div class="act">
          <div class="ai"><img src="${A}icons/pa_sharepoint.png" alt=""></div>
          <div class="ac"><div class="an"><span class="sn">2</span>複数の項目の取得</div>
          <div class="ad">フィルターで <code>返信済 eq いいえ</code> かつ <code>送信日 lt 3日前</code></div></div>
        </div>
        <div class="act">
          <div class="ai"><img src="${A}icons/pa_outlook.png" alt=""></div>
          <div class="ac"><div class="an"><span class="sn">3</span>メールの送信（宛先＝自分）</div>
          <div class="ad">「まだ返信ないよ」を自分あてに。相手には送らない。</div></div>
        </div>
        <img class="bmascot" src="${A}chara/chara_guts.png" alt="">
      </div>
    </div>
  </div>

  <div class="warn">
    <span class="wt">⚠ 使う前に確認</span>
    <span class="wl">
      <span>日付比較のフィルターは <code>送信日 lt '@{addDays(utcNow(),-3)}'</code></span>
      <span>返信の自動判定はクセあり→まず<b>手動で閉じる</b>運用でもOK</span>
    </span>
  </div>
  <div class="src">出典：Microsoft Learn（Office 365 Outlook／SharePoint／スケジュール）／全て標準コネクタ・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
