<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.73-2 Excel毎週集計 自動化の作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --orange:#EA580C; --red:#DC2626; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
    --xl:#107C41; --xl-dark:#0B5C30;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .logos{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .logos .ll{height:48px;width:48px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .logos .plus{color:#fff;font-weight:900;font-size:24px;text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1;}
  .title-text{color:#fff;font-weight:900;font-size:29px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:#EFF6FF;border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:16px;border-radius:9px;padding:8px 14px;white-space:nowrap;box-shadow:0 3px 6px rgba(0,0,0,.24);}
  .concl .chip svg{width:17px;height:17px;flex:0 0 auto;}
  .concl .txt{font-weight:800;font-size:17px;color:var(--blue-dark);line-height:1.32;padding-right:96px;}
  .concl .txt b{color:var(--orange);}
  .concl .txt .g{color:var(--xl-dark);}

  .cols{flex:1 1 auto;margin:11px 15px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .carrow{flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;}
  .carrow svg{width:28px;height:28px;}
  .colcard{flex:1;background:#fff;border:1.5px solid #C9D2E0;border-radius:13px;box-shadow:0 5px 13px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;}
  .cnum{position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;border:2.5px solid #fff;}
  .ch{display:flex;align-items:center;gap:11px;padding:8px 32px 8px 12px;min-height:54px;background:#fff;border-bottom:1px solid #EDEFF2;position:relative;}
  .ch .sq{flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid #EAECEF;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .ch .sq img{width:30px;height:30px;object-fit:contain;}
  .ch .sq.real{background:none;border:none;}
  .ch .sq.real img{width:40px;height:40px;object-fit:cover;border-radius:8px;}
  .ch .nm{flex:1;font-weight:900;font-size:14.5px;color:var(--ink);line-height:1.16;}
  .ch .nm small{display:block;font-weight:700;font-size:11.5px;color:var(--weak);margin-top:2px;}
  .ch .nm small.xls{color:var(--xl-dark);font-weight:900;}
  .ch .dots{position:absolute;right:11px;top:10px;color:#9AA3AF;font-size:19px;font-weight:900;line-height:1;}

  .cp{flex:1;font-family:'Segoe UI','Noto Sans JP',sans-serif;padding:0 11px 6px;display:flex;flex-direction:column;gap:0;}
  .tabs{display:flex;align-items:center;gap:13px;padding:0 2px;border-bottom:1px solid #E5E7EB;}
  .tabs span{font-size:12px;font-weight:700;color:#605E5C;padding:5px 1px;white-space:nowrap;}
  .tabs span.on{color:var(--blue);font-weight:800;box-shadow:inset 0 -2.5px 0 var(--blue);}
  .ptop{flex:0 0 226px;display:flex;flex-direction:column;gap:5px;overflow:hidden;background:#fff;padding:6px 2px 4px;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .l{font-size:13px;color:#605E5C;font-weight:800;line-height:1.2;}
  .fld .l .req{color:#D13438;margin-left:1px;}
  .fld .v{border:1px solid #D1D1D1;border-radius:6px;padding:4px 10px;font-size:13px;color:#242424;background:#fff;display:flex;align-items:center;gap:8px;font-weight:700;}
  .fld .v .cr{margin-left:auto;flex:0 0 auto;color:#605E5C;font-weight:900;font-size:11px;}
  .note{font-size:12px;color:#8A8886;font-weight:700;line-height:1.3;}

  /* Excel「操作を記録する」パネル再現 */
  .rec{flex:0 0 226px;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #E1DFDD;border-radius:8px;margin-top:8px;}
  .rec .rh{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 11px 4px;}
  .rec .rh b{font-size:15.5px;font-weight:900;color:#242424;}
  .rec .rh .x{color:#605E5C;font-size:14px;font-weight:700;}
  .rec .rbtns{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:5px 11px 8px;border-bottom:1px solid #EDEBE9;}
  .rec .rb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#242424;}
  .rec .rb .dotr{width:13px;height:13px;border-radius:50%;border:2.5px solid #D13438;display:flex;align-items:center;justify-content:center;}
  .rec .rb .dotr::after{content:"";width:5.5px;height:5.5px;border-radius:50%;background:#D13438;}
  .rec .rb .sqp{width:11px;height:11px;background:#E3008C;border-radius:2px;}
  .rec .rb .rs{font-size:14px;color:#242424;font-weight:900;}
  .rec .rlab{flex:0 0 auto;font-size:12.5px;font-weight:900;color:#605E5C;padding:6px 11px 3px;}
  .rec .rrow{flex:1;display:flex;align-items:center;font-size:13px;font-weight:700;color:#242424;background:#FAF9F8;border-bottom:1px solid #F0EEEC;margin:0 8px;padding:0 9px;border-radius:4px;min-height:0;line-height:1.2;}
  .rec .rcopy{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:800;color:#242424;padding:7px 0 8px;}
  .rec .rcopy svg{width:14px;height:14px;}

  .suppl{flex:1;display:flex;align-items:center;gap:10px;background:#EAF6EF;border:1.5px dashed #9CD4B2;border-radius:10px;padding:8px 12px;margin-top:5px;min-height:0;}
  .suppl .si{flex:0 0 auto;font-size:23px;line-height:1;}
  .suppl .st{font-size:12.5px;font-weight:800;color:var(--xl-dark);line-height:1.4;}
  .suppl .st b{color:#0B7A3E;}

  .howsteps{flex:1;margin-top:7px;background:linear-gradient(180deg,#EEF6FF,#E3EFFB);border:1px solid #C7DDF3;border-radius:10px;padding:7px 12px;display:flex;flex-direction:column;gap:5px;}
  .howsteps .hh{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:900;color:#0A4B86;}
  .howsteps .hh::before{content:"";width:5px;height:15px;border-radius:2px;background:var(--blue);}
  .howsteps ol{list-style:none;display:flex;flex-direction:column;justify-content:space-evenly;flex:1;gap:4px;}
  .howsteps li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;font-weight:700;color:#294056;line-height:1.28;}
  .howsteps li .sn{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .howsteps li b{color:var(--blue-dark);}
  .howsteps li.xls{color:var(--xl-dark);} .howsteps li.xls .sn{background:var(--xl);} .howsteps li.xls b{color:var(--xl-dark);}
  .howsteps li.grn{color:#0B5E37;} .howsteps li.grn .sn{background:#16A34A;} .howsteps li.grn b{color:#0B5E37;}

  .pitfall{flex:0 0 auto;margin:9px 15px 11px;background:linear-gradient(180deg,#FFF7ED,#FFEFD9);border:2px solid #FDBA74;border-radius:13px;padding:9px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 6px rgba(0,0,0,.07);position:relative;}
  .pitfall .pl{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FB923C,#EA580C);color:#fff;font-weight:900;font-size:15px;border-radius:9px;padding:8px 13px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .pitfall .pl svg{width:17px;height:17px;}
  .pitfall .px{flex:1;font-weight:800;font-size:13px;color:#7C2D12;line-height:1.36;padding-right:104px;}
  .pitfall .px b{color:var(--orange);} .pitfall .px .xg{color:var(--xl-dark);}
  .pitfall .px code{font-family:'Courier New',monospace;background:#fff;border:1px solid #F0C89B;border-radius:5px;padding:1px 6px;color:#9A3412;font-weight:800;}
  .pit-chara{position:absolute;right:12px;bottom:-2px;height:104px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.73-2</div>
    <div class="logos"><img class="ll" src="${A}icons/pa_logo.png" alt=""><span class="plus">＋</span><img class="ll" src="${A}icons/pa_excel.png" alt=""></div>
    <div class="title-text">作り方｜<span class="hl">Excel毎週集計を“無人化”する3ステップ</span></div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}カギは③</div>
    <div class="txt"><b>①Excelでいつもの集計を1回記録 →②毎週月曜にフローが起動 →③スクリプトを自動実行。</b><br>カギは③＝Excel Online (Business) の<span class="g">「スクリプトの実行」</span>。標準コネクタ＝<b>追加費用なし</b>です。</div>
  </div>

  <div class="cols">
    <div class="col">
      <div class="cnum">1</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_excel.png" alt=""></span><span class="nm">操作の記録<small class="xls">Excel「自動化」タブ（準備は1回だけ）</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="rec">
            <div class="rh"><b>操作を記録する</b><span class="x">✕</span></div>
            <div class="rbtns">
              <span class="rb"><span class="dotr"></span>記録</span>
              <span class="rb"><span class="rs">⟲</span>再起動</span>
              <span class="rb"><span class="sqp"></span>停止</span>
            </div>
            <div class="rlab">記録された操作</div>
            <div class="rrow">A2:F200 を「日付」で並べ替え</div>
            <div class="rrow">E:E で幅を 70.5 に設定</div>
            <div class="rrow">A1:F1 に罫線を適用</div>
            <div class="rcopy">${svg('copy')}コードとしてコピー</div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順（Excel側）</div>
            <ol>
              <li class="xls"><span class="sn">1</span><span>Excelの<b>「自動化」タブ→操作の記録</b></span></li>
              <li class="xls"><span class="sn">2</span><span>いつもの集計操作をして<b>停止</b></span></li>
              <li class="grn"><span class="sn">3</span><span>名前を付けて保存（例：<b>週次集計</b>）</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">2</div>
      <div class="colcard">
        <div class="ch"><span class="sq real"><img src="${A}icons/pa_schedule.png" alt=""></span><span class="nm">繰り返し<small>スケジュール（トリガー）</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="tabs"><span class="on">パラメーター</span><span>設定</span></div>
          <div class="ptop">
            <div class="fld"><span class="l">間隔・頻度 <span class="req">*</span></span><span class="v">1・週<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">設定曜日</span><span class="v">月曜日<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">設定時刻（時）</span><span class="v">7<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">タイムゾーン</span><span class="v">(UTC+09:00) 大阪、札幌、東京<span class="cr">▾</span></span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>トリガーに<b>「繰り返し」</b></span></li>
              <li><span class="sn">2</span><span>頻度=<b>週</b>・曜日=<b>月曜日</b>・時刻=<b>7</b></span></li>
              <li><span class="sn">3</span><span>タイムゾーンは<b>東京</b>を指定</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">3</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_excel.png" alt=""></span><span class="nm">スクリプトの実行<small class="xls">Excel Online (Business)（標準）</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="tabs"><span class="on">パラメーター</span><span>設定</span><span>コード ビュー</span><span>テスト</span></div>
          <div class="ptop">
            <div class="fld"><span class="l">場所 <span class="req">*</span></span><span class="v">OneDrive for Business<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">ドキュメント ライブラリ <span class="req">*</span></span><span class="v">OneDrive<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">ファイル <span class="req">*</span></span><span class="v">/売上データ.xlsx<span class="cr">📄</span></span></div>
            <div class="fld"><span class="l">スクリプト <span class="req">*</span></span><span class="v">週次集計<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l note">☁ ブックを閉じていてもクラウド側で実行</span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span><b>「スクリプトの実行」</b>を追加</span></li>
              <li class="xls"><span class="sn">2</span><span>ファイルと<b>保存したスクリプト</b>を選ぶ</span></li>
              <li class="grn"><span class="sn">3</span><span>保存すれば<b>毎週月曜、勝手に集計</b></span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="pitfall">
    <div class="pl">${svg('warn')}使う前に確認</div>
    <div class="px">コネクタは標準でも、Office スクリプト自体は<span class="xg"><b>M365 一般法人向けライセンスが対象</b></span>（家庭向けプランは対象外／E1・F3はフローからの実行OK・Excel側の連携ボタンのみ不可）。スクリプトから外部サイトへの<code>fetch</code>は不可／実行は<code>120秒</code>以内・<code>1日1,600回</code>まで／シートは<b>名前で指定</b>（アクティブシート頼みは失敗のもと）。</div>
    <img class="pit-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="src">出典：Microsoft Learn（Office スクリプト／Excel Online (Business) コネクタ）　※アクション名・仕様は2026-07時点</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
