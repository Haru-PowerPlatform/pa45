<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.132-3 取引先との会議の前に、メールと資料の要点を1画面で読む（やり方）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型B：流れ3列（作り方）。各列＝情景SVG＋実画面モック＋補足 */
  .vol-logo.cpl{display:flex;align-items:center;justify-content:center;padding:6px;}
  .vol-logo.cpl svg,.ask-ic svg{width:100%;height:100%;}
  .scene{height:96px;}
  .scene .chara{height:112px;bottom:-14px;}
  .inp{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #6366F1;border-radius:10px;padding:5px 9px;
    font-size:17px;font-weight:900;color:var(--navy);}
  .inp .sl{font-family:'Roboto Mono',monospace;font-size:20px;color:#4F46E5;}
  .inp .cur{width:2px;height:20px;background:#4F46E5;}
  .pop{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid #C7D2FE;border-radius:10px;overflow:hidden;box-shadow:0 5px 12px rgba(60,40,140,.14);}
  .tabs{flex:0 0 auto;display:flex;gap:3px;padding:5px 6px 0;border-bottom:1.5px solid #E5E7EB;font-size:14px;font-weight:900;color:#6B7280;flex-wrap:nowrap;}
  .tabs span{padding:3px 6px 4px;white-space:nowrap;}
  .tabs .on{color:#4338CA;border-bottom:3px solid #4F46E5;}
  .mr{flex:1;display:flex;align-items:center;gap:8px;padding:0 9px;border-bottom:1px solid #F1F5F9;font-size:15.5px;font-weight:700;color:#1F2937;}
  .mr svg{width:22px;height:22px;flex:0 0 auto;color:#6366F1;}
  .mr .t{font-family:'Roboto Mono',monospace;font-size:14px;color:#6B7280;flex:0 0 auto;}
  .mr.on{background:#EEF2FF;font-weight:900;color:#3730A3;}
  .mr.on::after{content:"✓";margin-left:auto;color:#16A34A;font-weight:900;}
  .pr{flex:1;min-height:0;background:#fff;border:2px solid #C7D2FE;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;
    box-shadow:0 5px 12px rgba(60,40,140,.14);}
  .pr .mt{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.8px solid #6366F1;border-radius:7px;padding:0 8px;
    font-weight:900;color:#3730A3;font-size:15.5px;}
  .pr .mt svg{width:17px;height:17px;}
  .pr .tx{font-size:17px;font-weight:900;color:var(--navy);line-height:1.5;}
  .pr .tx .add{background:#FEF3C7;border-radius:4px;padding:0 3px;}
  .copy{margin-top:auto;align-self:flex-end;display:flex;align-items:center;gap:6px;background:#4F46E5;color:#fff;font-size:14.5px;font-weight:900;border-radius:8px;padding:3px 11px;}
  .copy svg{width:17px;height:17px;}
  .ex{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:14px;font-weight:900;color:#92400E;}
  .ex span{background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:999px;padding:1px 9px;}
  .an{flex:0 0 auto;background:#F0F6FF;border:1.5px solid #C9DCF7;border-radius:10px;padding:6px 10px;font-size:15.5px;font-weight:700;color:#1F2937;line-height:1.4;}
  .an b{color:#B91C1C;}
  .rf{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;border-radius:5px;background:#4F46E5;color:#fff;
    font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;margin-left:4px;vertical-align:1px;box-shadow:0 0 0 3px #C7D2FE;}
  .ml{flex:1;min-height:0;background:#fff;border:2px solid #A9C6F5;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 12px rgba(20,40,90,.14);position:relative;}
  .ml::before{content:"";position:absolute;left:28px;top:-11px;border:9px solid transparent;border-bottom-color:#A9C6F5;}
  .mlh{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:3px 10px;background:#F2F7FD;border-bottom:1.5px solid #E2EAF5;font-size:15.5px;font-weight:900;color:var(--navy);}
  .mlh img{width:26px;height:26px;}
  .mlb{flex:1;padding:3px 10px;display:flex;flex-direction:column;gap:1px;font-size:15.5px;font-weight:700;color:#1F2937;line-height:1.4;}
  .mlb .fr{font-size:14px;color:#6B7280;font-weight:900;}
  .att{margin-top:auto;display:flex;align-items:center;gap:7px;border:1.5px solid #D1D5DB;border-radius:8px;padding:3px 8px;font-size:15px;font-weight:900;color:#1F2937;}
  .att .fx{width:24px;height:24px;border-radius:4px;background:#107C41;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:'Roboto Mono',monospace;}
  .att .sz{margin-left:auto;font-size:13.5px;color:#6B7280;}
  .mlb mark{background:#FEF08A;padding:0 2px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.2"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>'};
const spark=(id)=>`<svg viewBox="0 0 32 32"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2F7CF6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
  <path d="M16 2c1.4 7.2 6.8 12.6 14 14-7.2 1.4-12.6 6.8-14 14-1.4-7.2-6.8-12.6-14-14C9.2 14.6 14.6 9.2 16 2z" fill="url(#${id})"/>
  <path d="M26 2.5c.4 2 1.5 3.1 3.5 3.5-2 .4-3.1 1.5-3.5 3.5-.4-2-1.5-3.1-3.5-3.5 2-.4 3.1-1.5 3.5-3.5z" fill="#F59E0B"/></svg>`;

/* 情景①：キーボードの「/」キーを押す → 予定表 */
const s1=`<svg viewBox="0 0 388 96"><defs>
  <linearGradient id="k1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DDE3EC"/></linearGradient>
  <linearGradient id="k2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#C7D2FE"/></linearGradient></defs>
  <rect x="14" y="20" width="196" height="64" rx="9" fill="#94A3B8"/>
  ${[0,1,2,3].map(i=>`<rect x="${22+i*46}" y="27" width="40" height="22" rx="4" fill="url(#k1)" stroke="#CBD5E1"/>`).join('')}
  ${[0,1,2].map(i=>`<rect x="${22+i*46}" y="55" width="40" height="22" rx="4" fill="url(#k1)" stroke="#CBD5E1"/>`).join('')}
  <rect x="160" y="46" width="44" height="34" rx="5" fill="#000" opacity=".15"/>
  <rect x="157" y="42" width="44" height="34" rx="5" fill="url(#k2)" stroke="#6366F1" stroke-width="2.5"/>
  <text x="179" y="68" font-size="24" font-weight="900" fill="#4338CA" text-anchor="middle" font-family="Roboto Mono">/</text>
  <path d="M214 54h34" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/><path d="M242 46l10 8-10 8" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="16" width="70" height="66" rx="8" fill="#000" opacity=".12"/>
  <rect x="258" y="12" width="70" height="66" rx="8" fill="#fff" stroke="#A5B4FC" stroke-width="2"/>
  <rect x="258" y="12" width="70" height="17" rx="8" fill="#6366F1"/><rect x="258" y="22" width="70" height="7" fill="#6366F1"/>
  <text x="293" y="66" font-size="30" font-weight="900" fill="#3730A3" text-anchor="middle" font-family="Roboto Mono">14</text>
  </svg>`;
/* 情景②：頼み方メモをコピー → 貼り付け */
const s2=`<svg viewBox="0 0 388 96"><defs><linearGradient id="n1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBEB"/><stop offset="1" stop-color="#FDE68A"/></linearGradient></defs>
  <g transform="rotate(-4 80 50)"><rect x="34" y="14" width="96" height="72" rx="5" fill="#000" opacity=".12"/>
  <rect x="30" y="10" width="96" height="72" rx="5" fill="url(#n1)" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M42 30h70M42 44h70M42 58h50" stroke="#B45309" stroke-width="3.5" stroke-linecap="round" opacity=".6"/></g>
  <path d="M146 50h52" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M196 41l11 9-11 9" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="224" y="26" width="140" height="48" rx="10" fill="#000" opacity=".1"/>
  <rect x="220" y="22" width="140" height="48" rx="10" fill="#fff" stroke="#6366F1" stroke-width="2.5"/>
  <path d="M234 40h80M234 54h56" stroke="#A5B4FC" stroke-width="4" stroke-linecap="round"/>
  <circle cx="340" cy="46" r="11" fill="#4F46E5"/><path d="M335 46h9M340 41l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
/* 情景③：虫めがねで元のメールを確かめる */
const s3=`<svg viewBox="0 0 388 96"><defs><linearGradient id="e1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E8EBF1"/></linearGradient>
  <radialGradient id="gl" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#E0F2FE" stop-opacity=".9"/><stop offset="1" stop-color="#BAE6FD" stop-opacity=".5"/></radialGradient></defs>
  <rect x="40" y="22" width="100" height="64" rx="5" fill="#000" opacity=".12"/>
  <rect x="36" y="18" width="100" height="64" rx="5" fill="url(#e1)" stroke="#C9CED8"/>
  <path d="M38 21l48 32 48-32" fill="none" stroke="#B4BAC6" stroke-width="2"/>
  <rect x="112" y="24" width="16" height="18" rx="2" fill="#F87171"/>
  <circle cx="122" cy="48" r="28" fill="url(#gl)" stroke="#334155" stroke-width="6"/>
  <path d="M142 68l20 20" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <rect x="186" y="30" width="34" height="26" rx="6" fill="#4F46E5"/><text x="203" y="49" font-size="17" font-weight="900" fill="#fff" text-anchor="middle" font-family="Roboto Mono">1</text>
  <circle cx="246" cy="44" r="15" fill="#16A34A"/><path d="M238 44l6 6 11-12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.132-3</div>
    <div class="vol-logo cpl">${spark('t1')}</div>
    <div class="title-text">やり方は3つだけ。<span class="hl">「/」で会議を選んで、1文で頼む</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw('<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',2.2)}</div>
    <div class="txt">会議を<b>「/」で指定</b>すると、Copilot がその会議に関係するメールとファイルを拾ってきます。<br>キーワードで探す必要はありません</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>「/」を打って会議を選ぶ</div>
      <div class="scene">${s1}</div>
      <div class="body">
        <div class="inp"><span class="sl">/</span><span class="cur"></span><span style="color:#9CA3AF;font-weight:700;font-size:15.5px">みどり</span></div>
        <div class="pop">
          <div class="tabs"><span>People</span><span>ファイル</span><span class="on">会議</span><span>メール</span></div>
          <div class="mr on">${svgw(P.cal,2.2)}みどり精機 定例<span class="t">今日 14:00</span></div>
          <div class="mr">${svgw(P.cal,2.2)}みどり精機 見積の件<span class="t">10/2</span></div>
          <div class="mr">${svgw(P.cal,2.2)}部内ミーティング<span class="t">明日 10:00</span></div>
        </div>
      </div>
      <div class="cap">会議のタイトルや主催者、<br>直近の予定から候補が出ます</div>
    </div>

    <div class="col neutral">
      <div class="ch2"><span class="n">2</span>頼み方を1文で打つ</div>
      <div class="scene">${s2}<img class="chara" src="${A}chara/chara_laptop.png" alt=""></div>
      <div class="body">
        <div class="pr">
          <span class="mt">${svgw(P.cal,2.2)}みどり精機 定例</span>
          <div class="tx">この会議の準備のために、<br>関連するメールとファイルの<br>要点をまとめて。<br><span class="add">まだ決まっていないことも分けて</span></div>
          <span class="copy">${svgw(P.copy,2.2)}メモに保存して使い回す</span>
        </div>
        <div class="ex">足すと便利<span>相手からの質問</span><span>期限つきの約束</span></div>
      </div>
      <div class="cap">黄色の部分を足すと、<br><b>会議で決めること</b>まで出ます</div>
    </div>

    <div class="col neutral">
      <div class="ch2"><span class="n">3</span>番号から元のメールを開く</div>
      <div class="scene">${s3}</div>
      <div class="body">
        <div class="an">納期を<b>11/27</b>に延ばしたい相談<span class="rf">1</span></div>
        <div class="ml">
          <div class="mlh"><img src="${A}icons/pa_outlook.png" alt="">RE: RE: 11月分の件</div>
          <div class="mlb"><span class="fr">佐藤 花子（みどり精機）10/10</span>
            <div>納期を<mark>11/27</mark>までお延ばし<br>いただけないでしょうか。</div>
            <div class="att"><span class="fx">X</span>出荷計画_11月.xlsx<span class="sz">48 KB</span></div></div>
        </div>
      </div>
      <div class="cap">日付と金額は、<br><b>元のメールで確かめてから</b>話します</div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <div class="ws"><span>使う前に確認</span><span>Microsoft 365 Copilot のライセンスが必要</span><span>右上の Work IQ をオン</span>
      <span>見られるのは自分が開けるメールとファイルだけ</span><span>ライセンスなしの Copilot Chat は「/」でファイルのみ</span></div>
  </div>
  <div class="src">出典：Microsoft サポート「Microsoft Copilot で特定のファイルなどを参照する」／会社名・人名・内容は架空の例</div>
`;
</script>
</body>
</html>
