<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.49-1 フローが作れなくても大丈夫｜Copilotに聞いてそのまま作る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --cop-grad:linear-gradient(120deg,#7C3AED,#C026D3 55%,#EC4899);
    --orange:#EA580C; --amber:#D97706; --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:28px;line-height:1.16;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:144px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:9px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:18px;color:var(--blue-dark);line-height:1.36;padding-right:96px;}
  .concl .txt b{color:var(--orange);}

  .tatoe{margin:8px 16px 0;background:linear-gradient(180deg,#FFFBEB,#FEF3C7);border:1.5px solid #FAD77A;border-radius:11px;display:flex;align-items:center;gap:11px;padding:8px 15px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .tatoe .ti{flex:0 0 auto;width:25px;height:25px;color:var(--amber);}
  .tatoe .tt{font-weight:800;font-size:16px;color:#7A4A12;line-height:1.34;}
  .tatoe .tt b{color:var(--cop-dark);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;align-items:stretch;gap:0;min-height:0;}

  /* 左：Copilotチャット */
  .lzone{flex:0 0 424px;display:flex;flex-direction:column;min-height:0;}
  .zhd{font-weight:900;font-size:18px;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:8px;}
  .zhd .b{flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .zhd.l1 .b{background:var(--cop);} .zhd.l2 .b{background:#2563EB;}
  .zhd .tag{margin-left:auto;font-weight:900;font-size:13px;color:#fff;border-radius:999px;padding:4px 12px;}
  .zhd.l1 .tag{background:var(--cop);} .zhd.l2 .tag{background:#16A34A;}

  .chatw{flex:1;background:#fff;border:1.5px solid #D8CBEF;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.14);overflow:hidden;font-family:'Segoe UI','Noto Sans JP',sans-serif;display:flex;flex-direction:column;min-height:0;}
  .chat-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--cop-grad);}
  .chat-h .bloom{width:24px;height:24px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;color:var(--cop);}
  .chat-h span{font-weight:800;font-size:14.5px;color:#fff;}
  .chat-b{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:13px 14px;background:#FBFAFE;}
  .bub{max-width:92%;border-radius:13px;padding:10px 13px;font-size:14.5px;line-height:1.44;font-weight:700;}
  .bub.me{align-self:flex-end;background:#EDE9FE;border:1.5px solid #C4B5FD;color:#3B3172;border-bottom-right-radius:4px;}
  .bub.me b{color:var(--cop-dark);}
  .bub.ai{align-self:flex-start;background:#fff;border:1.5px solid #E4E1EC;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.06);}
  .bub.ai .aih{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
  .bub.ai .aih .bloom{width:20px;height:20px;border-radius:6px;background:var(--cop-grad);display:flex;align-items:center;justify-content:center;padding:3.5px;color:#fff;}
  .bub.ai .aih span{font-weight:900;font-size:13px;color:var(--cop-dark);}
  .bub.ai .quote{color:#333;}
  .bub.ai .quote b{color:var(--cop-dark);}
  .typing{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#8B7FB8;padding-left:4px;}

  /* 中：レシピエンジン */
  .mzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;position:relative;}
  .mzbig{font-weight:900;font-size:24px;color:var(--ink);text-align:center;line-height:1.28;}
  .mzbig b{color:var(--cop-dark);}
  .engine{width:100%;max-width:302px;background:linear-gradient(180deg,#F6F1FE,#EDE4FC);border:2.5px solid var(--cop);border-radius:16px;padding:14px 16px 15px;box-shadow:0 6px 14px rgba(124,58,237,.22),inset 0 1px 0 rgba(255,255,255,.7);margin:13px 0;}
  .eng-top{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:var(--cop-dark);padding-bottom:10px;margin-bottom:10px;border-bottom:2px dashed #CDB6F2;}
  .eng-top .bloom{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--cop-grad);display:flex;align-items:center;justify-content:center;padding:5px;color:#fff;}
  .eng-li{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px;color:#43307A;padding:6px 0;line-height:1.3;}
  .eng-li .sn{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--cop);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .eng-li b{color:var(--cop-dark);}
  .bigarrow{width:58px;height:58px;color:var(--cop);margin:2px 0 11px;}
  .autobadge{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:17.5px;border-radius:999px;padding:11px 19px;box-shadow:0 4px 9px rgba(234,88,12,.42);text-align:center;}
  .autobadge svg{width:20px;height:20px;flex:0 0 auto;}
  .mzmascot{position:absolute;right:-8px;bottom:-6px;height:104px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));z-index:30;}

  /* 右：できたフロー */
  .rzone{flex:0 0 400px;display:flex;flex-direction:column;min-height:0;}
  .flow{flex:1;background:#fff;border:1.5px solid #C9D2E0;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.14);overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .flow-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(90deg,#1D4ED8,#3B82F6);}
  .flow-h img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:6px;padding:3px;}
  .flow-h span{font-weight:800;font-size:14.5px;color:#fff;}
  .flow-b{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:stretch;padding:11px 18px;background:#F8FAFD;}
  .acard{background:#fff;border:1.5px solid #D7DEE9;border-radius:11px;box-shadow:0 3px 7px rgba(0,0,0,.09);display:flex;align-items:center;gap:11px;padding:10px 13px;}
  .acard img{flex:0 0 auto;width:32px;height:32px;object-fit:contain;}
  .acard .an{font-weight:900;font-size:15.5px;color:var(--ink);line-height:1.22;}
  .acard .an small{display:block;font-weight:700;font-size:11.5px;color:var(--weak);margin-top:1px;}
  .acard .dots{margin-left:auto;color:#9AA3AF;font-size:17px;font-weight:900;}
  .conn{align-self:center;display:flex;flex-direction:column;align-items:center;height:26px;}
  .conn .l{width:2px;flex:1;background:#B9C4D6;}
  .conn .p{width:16px;height:16px;border-radius:50%;background:#2563EB;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1;margin:1px 0;}
  .donebadge{align-self:center;margin-top:11px;display:inline-flex;align-items:center;gap:8px;background:#ECFDF3;border:2px solid #6EE7A0;border-radius:999px;padding:8px 16px;font-weight:900;font-size:15px;color:#0B5E37;}
  .donebadge svg{width:18px;height:18px;flex:0 0 auto;}

  .next{flex:0 0 auto;margin:10px 16px 12px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:12px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:18.5px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:25px;height:25px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 spark:'<path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7L12 2z"/>',
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 chat:'<path d="M21 11.5a8 8 0 0 1-11.6 7.1L3 21l2.4-6.4A8 8 0 1 1 21 11.5z"/>',
 check:'<path d="M20 6 9 17l-5-5"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.49-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">フローが作れなくても大丈夫！<span class="hl">Copilotに聞いて、そのまま作る</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">作り方が分からないフローは、<b>M365 Copilotチャットに日本語で聞く</b>のが最短。<br>やりたいことを書くだけで<b>手順①〜⑧の“レシピ”</b>が返ってくる。あとはそのとおり組むだけ。</div>
  </div>

  <div class="tatoe">
    <span class="ti">${svg('spark')}</span>
    <span class="tt">たとえるなら…いつでも隣にいる<b>“詳しい先輩”</b>。「これ作りたい」と言えば、作り方を最初から最後まで書いて渡してくれる。</span>
  </div>

  <div class="stage">
    <div class="lzone">
      <div class="zhd l1"><span class="b">1</span>日本語で聞くだけ<span class="tag">コピペOK</span></div>
      <div class="chatw">
        <div class="chat-h"><span class="bloom">${svg('spark')}</span><span>M365 Copilot チャット</span></div>
        <div class="chat-b">
          <div class="bub me">Power Automateで、<b>メールに添付ファイルが届いたらOneDriveに自動保存</b>するフローを作りたいです。<b>初心者なので、作る手順をわかりやすく</b>教えてください。</div>
          <div class="bub ai">
            <div class="aih"><span class="bloom">${svg('spark')}</span><span>Copilot</span></div>
            <div class="quote">はい、初心者の方向けにできるだけ簡単に説明します。<br>「<b>メール受信 → 添付ファイルを取得 → OneDriveへ保存</b>」という流れで作ります。<br><b>手順①</b> Power Automateを開く…</div>
          </div>
          <div class="typing">${'●'.repeat(3)}　手順⑧まで続く</div>
        </div>
      </div>
    </div>

    <div class="mzone">
      <div class="mzbig">数秒で<br><b>“レシピ”が届く</b></div>
      <div class="engine">
        <div class="eng-top"><span class="bloom">${svg('spark')}</span>返ってきた回答</div>
        <div class="eng-li"><span class="sn">1</span><span>作る手順が<b>①〜⑧で全部</b></span></div>
        <div class="eng-li"><span class="sn">2</span><span>つまずく<b>設定も先回り</b></span></div>
        <div class="eng-li"><span class="sn">3</span><span><b>エラー対策</b>まで書いてある</span></div>
      </div>
      <span class="bigarrow">${svg('arrow')}</span>
      <div class="autobadge">${svg('check')}そのとおり作るだけ！</div>
      <img class="mzmascot" src="${A}chara/chara_guts.png" alt="">
    </div>

    <div class="rzone">
      <div class="zhd l2"><span class="b">2</span>できあがったフロー<span class="tag">完成</span></div>
      <div class="flow">
        <div class="flow-h"><img src="${A}icons/pa_logo.png" alt=""><span>メール添付を自動でOneDriveへ</span></div>
        <div class="flow-b">
          <div class="acard"><img src="${A}icons/pa_outlook.png" alt=""><span class="an">新しいメールが届いたとき (V3)<small>Office 365 Outlook</small></span><span class="dots">⋮</span></div>
          <div class="conn"><span class="l"></span><span class="p">＋</span><span class="l"></span></div>
          <div class="acard"><img src="${A}icons/pa_control.png" alt=""><span class="an">Apply to each<small>添付ファイルごとに繰り返す</small></span><span class="dots">⋮</span></div>
          <div class="conn"><span class="l"></span><span class="p">＋</span><span class="l"></span></div>
          <div class="acard"><img src="${A}icons/pa_onedrive.png" alt=""><span class="an">ファイルの作成<small>OneDrive for Business</small></span><span class="dots">⋮</span></div>
          <div class="donebadge">${svg('check')}あの“魔法の箱”が自分で作れた！</div>
        </div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>注意：答えは<b>英語のアクション名</b>で返ってくることも。<b>日本語画面への読み替え</b>は2枚目で解説！</div>
  <div class="src">出典：Microsoft 365 Copilot 実機／Microsoft Learn</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
