<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.2-1 遅れて入ったTeams会議で、ここまでの話をCopilotに聞いて追いつく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  /* 型D：会話スレッド（会議の画面 ↔ 自分にだけ見える Copilot とのやり取り）*/
  .stage{gap:12px;}
  .left{flex:0 0 520px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .lh{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;color:var(--navy);}
  .lh .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;background:linear-gradient(180deg,#14B8A6,#0F766E);box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .lh .tm{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:20px;font-weight:700;color:#fff;background:#1F2937;border-radius:8px;padding:2px 10px;}

  /* 会議の画面 */
  .meet{flex:1;min-height:0;display:flex;flex-direction:column;background:#1F1F1F;border-radius:12px;overflow:hidden;position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,.25);}
  .meet .mh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 12px;background:#292929;color:#fff;font-size:15.5px;font-weight:700;}
  .meet .mh .rec{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#FCA5A5;}
  .meet .mh .rec i{width:10px;height:10px;border-radius:50%;background:#EF4444;display:inline-block;}
  .meet .mh .cp{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;color:#242424;border-radius:6px;padding:3px 10px;font-size:15px;font-weight:800;
    box-shadow:0 0 0 3px #F59E0B;}
  .meet .mh .cp i{width:24px;height:24px;border-radius:0;background:url(../../pptx/_assets/icons/ms/copilot.png) center/contain no-repeat;display:inline-block;}
  .tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1.2fr;gap:6px;padding:8px;}
  .tile{border-radius:8px;background:#3A3A3A;position:relative;display:flex;align-items:center;justify-content:center;}
  .tile .av{width:54px;height:54px;border-radius:50%;color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .tile .nm{position:absolute;left:8px;bottom:6px;font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:5px;padding:1px 7px;}
  .tile.spk{box-shadow:inset 0 0 0 3px #7F85F5;}
  .tile.me{background:#2E3B3A;}
  .tile.me .chara{position:absolute;bottom:0;right:8px;height:112px;}
  /* 遅れて入ったときの通知 */
  .toast{grid-column:span 2;align-self:center;background:#fff;border-radius:11px;padding:9px 14px;
    box-shadow:0 10px 26px rgba(0,0,0,.45);font-family:"Noto Sans JP",sans-serif;z-index:3;border:3px solid #F59E0B;}
  .toast .t1{font-size:15px;font-weight:900;color:#92400E;margin-bottom:5px;}
  .toast .t2{font-size:16px;font-weight:700;color:#1B2A44;line-height:1.38;margin-bottom:8px;}
  .toast .btn{display:inline-block;background:#5B5FC7;color:#fff;font-family:"Segoe UI","Noto Sans JP",sans-serif;font-size:16px;font-weight:700;border-radius:6px;padding:5px 16px;}
  .lcap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.35;border-radius:9px;padding:7px 11px;color:var(--mc-dark);background:#D5F3EE;}
  .lcap b{color:var(--orange);}

  /* 右：自分にだけ見える Copilot */
  .priv{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid var(--mc-line);border-radius:12px;overflow:hidden;
    box-shadow:0 4px 12px rgba(15,60,55,.14);}
  .priv .pv{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:16px;font-weight:700;}
  .priv .pv .dot{width:28px;height:28px;background:url(../../pptx/_assets/icons/ms/copilot.png) center/contain no-repeat;}
  .priv .pv .only{margin-left:6px;font-family:"Noto Sans JP",sans-serif;font-size:13.5px;font-weight:900;color:var(--mc-dark);background:#CCFBF1;border-radius:999px;padding:1px 9px;}
  .th{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:9px 12px;font-family:"Noto Sans JP",sans-serif;}
  .q{align-self:flex-end;max-width:90%;background:#E8EBFA;border:1.5px solid #C5CAF2;border-radius:12px 12px 3px 12px;padding:6px 12px;
    font-size:15.5px;font-weight:700;color:#1B2A44;line-height:1.4;}
  .q .src2{display:block;font-size:12.5px;font-weight:900;color:#5B5FC7;}
  .a{background:#F7FBFA;border:1.5px solid #A7E3D8;border-radius:12px 12px 12px 3px;padding:6px 12px;}
  .a.sum{flex:1.25;min-height:0;display:flex;flex-direction:column;}
  .a.dif{flex:1;min-height:0;display:flex;flex-direction:column;}
  .a .ah{font-size:14px;font-weight:900;color:var(--mc);margin-bottom:2px;}
  .row{flex:1;display:flex;align-items:center;gap:9px;border-bottom:1.2px dashed #DDE7E5;}
  .row:last-child{border-bottom:none;}
  .row .tg{flex:0 0 76px;text-align:center;font-size:13.5px;font-weight:900;border-radius:6px;padding:2px 0;color:#fff;background:var(--mc);}
  .row .tg.w{background:#D97706;} .row .tg.p{background:#6366F1;}
  .row .tx{flex:1;font-size:16px;font-weight:700;color:#1B2A44;line-height:1.3;}
  .row .tx b{color:#B91C1C;}
  .bot{flex:0 0 auto;display:flex;gap:8px;}
  .bot .metric{flex:1;}
  .metric .mv{font-size:23px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills">
      <div class="vol-pill"><small>M365 Copilot</small>Vol.2-1</div>
      <div class="lic-pill paid">M365 Copilot ライセンスが要る</div>
    </div>
    <div class="title-text">遅れて入ったTeams会議で、<span class="hl">ここまでの話を<br>Copilotに聞いて</span>追いつく</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/teams.svg" alt=""><span class="pl">＋</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_surprise.png" alt="">
  </div>

  <div class="concl">
    <div class="chip app"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:34px;height:34px"></div>
    <div class="txt">開始から5分以上たって入ると、<b>Copilot から通知</b>が届きます。［Copilot を開く］で、<br>ここまでの要約が画面の右に出ます。やり取りは<b>自分にしか見えません</b></div>
  </div>

  <div class="stage">
    <div class="left">
      <div class="lh"><span class="n">1</span>12分遅れて会議に入る<span class="tm">10:12</span></div>
      <div class="meet seg">
        <div class="mh"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:26px;height:26px">展示会の出展計画（定例）<span class="rec"><i></i>文字起こし中</span><span class="cp"><i></i>Copilot</span></div>
        <div class="tiles">
          <div class="tile spk"><span class="av" style="background:#C2410C">佐</span><span class="nm">佐藤 花子</span></div>
          <div class="tile"><span class="av" style="background:#0E7490">山</span><span class="nm">山田 太郎</span></div>
          <div class="tile"><span class="av" style="background:#6D28D9">鈴</span><span class="nm">鈴木 一郎</span></div>
          <div class="tile me"><img class="chara" src="${A}chara/chara_trouble.png" alt=""><span class="nm">自分</span></div>
        <div class="toast">
          <div class="t1">5分以上遅れて入ると届く通知</div>
          <div class="t2">通知の中のボタンを押すと、<br>ここまでの要約が右に出る</div>
          <span class="btn">Copilot を開く</span>
        </div>
        </div>
      </div>
      <div class="lcap">隣の人に小声で聞かずに、<br>自分の画面だけで話の流れに追いつける</div>
    </div>

    <div class="right">
      <div class="lh"><span class="n">2</span>自分だけの Copilot に聞く</div>
      <div class="priv seg">
        <div class="pv"><span class="dot"></span>Copilot<span class="only">自分にだけ表示</span><span class="repro">画面は説明用の再現</span></div>
        <div class="th">
          <div class="a sum">
            <div class="ah"><img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:24px;height:24px"> ここまでの要約（10:00〜10:12）</div>
            <div class="row"><span class="tg">方向</span><span class="tx">出展は年2回から<b>春の1回</b>に絞る案が中心</span></div>
            <div class="row"><span class="tg w">待ち</span><span class="tx">ブースの費用は、鈴木さんが見積もり待ち</span></div>
            <div class="row"><span class="tg p">未定</span><span class="tx">当日の説明員の人数は、まだ決まっていない</span></div>
          </div>
          <div class="q"><span class="src2">続けて聞く（公式の例文）</span>このテーマについて私たちの意見が異なる点はどこでしょうか?</div>
          <div class="a dif">
            <div class="ah">意見が分かれている点</div>
            <div class="row"><span class="tg">佐藤さん</span><span class="tx">春の1回に予算を集める</span></div>
            <div class="row"><span class="tg w">山田さん</span><span class="tx">秋も小さく出て、名刺を集めたい</span></div>
          </div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">ここまでの</span><span class="mv">12分の話</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">要点3行＋対立点</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>会議中・会議後に開く場所と、会議の後も聞くための条件。<b>早見表は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft サポート「Teams で Microsoft Copilot を使用して会議に追いつく」／Microsoft Learn「Teams の会議やイベントで Microsoft Copilot を管理する」／会議名・人名は架空</div>
`;
</script>
</body>
</html>
