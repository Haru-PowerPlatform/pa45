<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.126-2 問い合わせの急ぎ度判定の作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:6px;padding:7px 9px;}
  .cardh{font-size:15px;}
  .col.ai{background:#F7F3FF;border:2.5px solid #C9B4F4;}
  .col.ai .ch2{color:#5B21B6;}
  .col.ai .ch2 .n{background:linear-gradient(180deg,#A78BFA,#6D28D9);}
  .col.ai .card{border-color:#C9B4F4;}
  .col.ai .cardh{background:#EDE4FF;border-bottom-color:#D8C9FA;color:#5B21B6;}
  .col.ai .cap{background:#E4D8FA;color:#5B21B6;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:4px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.3;}
  .fld .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .outs{display:flex;flex-wrap:wrap;gap:5px;}
  .pr{background:#fff;border:2px solid #C9B4F4;border-radius:8px;padding:5px 9px;font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.36;}
  .pr .k{display:block;font-size:14px;font-weight:900;color:#7C3AED;margin-bottom:1px;}
  .pr b{color:#B91C1C;}
  .ex{display:flex;align-items:center;gap:7px;background:#F3EEFF;border:1.5px dashed #B79CF0;border-radius:8px;padding:4px 9px;font-size:15px;font-weight:900;color:#5B21B6;}
  .ex .v{font-family:'Roboto Mono','Noto Sans JP',monospace;color:#B91C1C;}
  .cond{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#F7F9FC;border:1.5px solid #E2EAF5;
    border-radius:8px;padding:6px 8px;font-size:15px;font-weight:900;color:var(--navy);}
  .cond .op{background:#fff;border:1.4px solid #C7D6EE;border-radius:5px;padding:1px 7px;}
  .br{display:flex;gap:6px;flex:1;min-height:0;}
  .br .bx{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;border-radius:8px;padding:6px 8px;font-size:15px;font-weight:900;line-height:1.3;}
  .br .bx.y{background:#ECFDF5;border:1.8px solid #7FCEA9;color:#065F46;}
  .br .bx.n{background:#F8FAFC;border:1.8px solid #CBD5E1;color:#475569;}
  .br .bx .bl{font-size:14px;}
  .br .bx .ac{display:flex;align-items:center;gap:5px;}
  .br .bx img{width:24px;height:24px;object-fit:contain;flex:0 0 auto;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SPARK='<path d="M0 -13l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/><path d="M8.5 4.5l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z"/>';
const SH=(id,c)=>`<filter id="${id}" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="${c||'#1B2A44'}" flood-opacity=".22"/></filter>`;
const ENV=(x,y,s,c)=>`<g transform="translate(${x},${y}) scale(${s})" filter="url(#f)"><rect width="56" height="38" rx="4" fill="#fff" stroke="${c||'#7FA6D6'}" stroke-width="2"/>
  <path d="M0 3 L28 23 L56 3" fill="none" stroke="${c||'#7FA6D6'}" stroke-width="2"/></g>`;

/* ① info@ に届く */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f')}</defs>
  <rect width="388" height="100" fill="#EDF3FA"/>
  ${ENV(14,10,1)}${ENV(30,46,1)}${ENV(80,22,1,'#DC2626')}
  <path d="M146 50 H 174" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M168 44 l8 6 l-8 6" fill="none" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#f)"><rect x="180" y="18" width="122" height="64" rx="9" fill="#fff" stroke="#0F6CBD" stroke-width="2.4"/>
    <text x="241" y="45" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#0F6CBD" text-anchor="middle">info@</text>
    <text x="241" y="66" font-family="Noto Sans JP" font-size="11.5" font-weight="900" fill="#64748B" text-anchor="middle">共有メールボックス</text></g>
  <g filter="url(#f)"><rect x="306" y="30" width="72" height="40" rx="9" fill="#fff" stroke="#2563EB" stroke-width="2.4"/>
    <text x="342" y="56" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#1E40AF" text-anchor="middle">⚡ 起動</text></g>
</svg>`;

/* ② AIが 高・中・低 を付ける */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f','#3B2A66')}<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs>
  <rect width="388" height="100" fill="#F3EEFF"/>
  <g filter="url(#f)"><rect x="14" y="12" width="110" height="76" rx="6" fill="#fff" stroke="#B79CF0" stroke-width="2"/>
    <rect x="24" y="24" width="88" height="4" rx="2" fill="#D9CCF6"/><rect x="24" y="34" width="60" height="4" rx="2" fill="#D9CCF6"/>
    <rect x="22" y="44" width="70" height="12" rx="3" fill="#FECACA"/><text x="57" y="53.5" font-family="Noto Sans JP" font-size="9.5" font-weight="900" fill="#991B1B" text-anchor="middle">取引の見直し</text>
    <rect x="24" y="64" width="80" height="4" rx="2" fill="#D9CCF6"/><rect x="24" y="74" width="50" height="4" rx="2" fill="#D9CCF6"/></g>
  <path d="M132 50 H 156" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <g filter="url(#f)"><circle cx="182" cy="50" r="24" fill="url(#g2)"/><g transform="translate(182,50)" fill="#fff">${SPARK}</g></g>
  <path d="M208 50 H 230" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M224 44 l8 6 l-8 6" fill="none" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  ${[['高','#DC2626','#fff',8],['中','#FDE68A','#78350F',38],['低','#E5E7EB','#475569',68]].map(([t,bg,fg,y])=>
    `<g filter="url(#f)"><rect x="242" y="${y}" width="${t=='高'?136:60}" height="26" rx="7" fill="${bg}"/>
     <text x="${t=='高'?256:272}" y="${y+18}" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="${fg}" ${t=='高'?'':'text-anchor="middle"'}>${t=='高'?'高｜理由つき':t}</text></g>`).join('')}
</svg>`;

/* ③ 高だけチャネルへ */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f','#0B5136')}<linearGradient id="tm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B83EB"/><stop offset="1" stop-color="#4B53BC"/></linearGradient></defs>
  <rect width="388" height="100" fill="#DCF3E7"/>
  <g filter="url(#f)"><path d="M70 10 l50 40 l-50 40 l-50 -40 z" fill="#fff" stroke="#0B6A4F" stroke-width="2.4"/>
    <text x="70" y="47" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#0B5136" text-anchor="middle">判定が</text>
    <text x="70" y="64" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#0B5136" text-anchor="middle">「高」？</text></g>
  <path d="M122 44 C 150 22, 170 22, 196 24" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M122 56 C 150 78, 170 78, 196 76" stroke="#94A3B8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g filter="url(#f)"><rect x="200" y="6" width="178" height="36" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    <rect x="208" y="12" width="24" height="24" rx="6" fill="url(#tm)"/><text x="220" y="29" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">T</text>
    <text x="240" y="30" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#065F46">はい → チャネルへ</text></g>
  <g filter="url(#f)"><rect x="200" y="58" width="178" height="36" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.4"/>
    <text x="289" y="81" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#475569" text-anchor="middle">いいえ → 何もしない</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.126-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（届く → AIが判定 → 「高」だけ通知）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">AIには<b>「高・中・低」の1文字＋理由</b>で答えさせるのがコツ。<br>先頭の1文字だけ見れば分岐できるので、条件がかんたんになります</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>info@に届いたら起動</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_outlook.png" alt="">新しいメールが共有メールボックスに届いたとき (V2)</div>
        <div class="cardb">
          <div class="fld"><span class="fl">元のメールボックスのアドレス</span><span class="fi hot">info@contoso.co.jp</span></div>
          <div class="fld"><span class="fl">あとで使う値</span>
            <span class="outs"><span class="dyn">件名</span><span class="dyn">差出人</span><span class="dyn">本文</span><span class="dyn">受信日時</span></span></div>
          <div class="fld"><span class="fl">AIに渡すのは</span><span class="fi">本文だけ（件名・差出人は通知に使う）</span></div>
        </div>
      </div></div>
      <div class="cap">共有メールボックスへの<b>アクセス権</b>が要る</div>
    </div>

    <div class="col ai">
      <div class="ch2"><span class="n">2</span>AIに急ぎ度を判定させる</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_logo.png" alt="">プロンプトの実行</div>
        <div class="cardb">
          <div class="pr"><span class="k">指示（1回だけ書く）</span>
            急ぎ度を<b>高・中・低</b>の1文字で答え、｜のあとに理由を1行で。怒り・期限の指定・取引の見直しは高。</div>
          <div class="fld"><span class="fl">入力（問い合わせ）</span><span class="fi hot"><span class="dyn">本文</span></span></div>
          <div class="ex">返ってくる例 <span class="v">高｜期限の指定と取引見直しの言及</span></div>
        </div>
      </div></div>
      <div class="cap">判定の基準は、<b>自社の言葉で</b>書き足していく</div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>「高」だけ知らせる</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_condition.png" alt="">条件</div>
        <div class="cardb">
          <div class="cond"><span class="dyn">テキスト</span><span class="op">次の値で始まる</span><span class="op">高</span></div>
          <div class="br">
            <div class="bx y"><span class="bl">はい</span><span class="ac"><img src="${A}icons/pa_teams.png" alt="">チャネルに投稿</span>
              <span>件名・差出人・<br>AIの理由を載せる</span></div>
            <div class="bx n"><span class="bl">いいえ</span><span>何もしない<br>（受信トレイで<br>いつもどおり）</span></div>
          </div>
        </div>
      </div></div>
      <div class="cap">投稿は<b>チャットまたはチャネルでメッセージを投稿する</b></div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>1通ごとにAI Builderのクレジットを消費</span><span>2026/11/1以降はCopilotクレジットへ</span>
      <span>判定は補助。返信の判断は人</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Power Automate でプロンプトを使用する」「Office 365 Outlook コネクタ」「ライセンスとAI Builder クレジット」／アドレス・名称は架空</div>
`;
</script>
</body>
</html>
