<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.88-1 消したフローは21日以内なら戻せる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C; --pa:#0B59C7;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:18.5px;color:var(--blue-dark);line-height:1.3;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:13px;min-height:0;}

  /* 左：事故あるある */
  .fear{flex:.9;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#FCF6F6,#FBECEC);border:2.5px solid #F0B4B4;border-radius:14px;padding:11px 12px;box-shadow:0 5px 13px rgba(0,0,0,.1);gap:8px;}
  .fh{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;color:var(--red-dark);}
  .fh .face{font-size:28px;}
  .deleted{flex:0 0 auto;background:#fff;border:2px solid #E5C4C4;border-radius:11px;padding:9px 12px;display:flex;align-items:center;gap:11px;position:relative;}
  .deleted .fi{width:38px;height:38px;border-radius:9px;background:#EEF2F8;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .deleted .fi img{width:30px;height:30px;filter:grayscale(.6);}
  .deleted .fn{font-size:17px;font-weight:900;color:#94A3B8;text-decoration:line-through;}
  .deleted .stamp{margin-left:auto;transform:rotate(-6deg);font-size:14px;font-weight:900;color:#fff;background:var(--red);border-radius:7px;padding:4px 10px;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .acc{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;}
  .acc .a{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid #F0CCCC;border-radius:9px;padding:7px 11px;font-size:14.5px;font-weight:800;color:#7A2C2C;min-height:0;}
  .acc .a .e{font-size:20px;flex:0 0 auto;}
  .oldway{flex:0 0 auto;background:#FFF;border:1.5px dashed #E0A9A9;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:800;color:#9A5B5B;line-height:1.4;}
  .oldway b{color:var(--red-dark);}

  /* 右：復元ポータル */
  .restore{flex:1.15;display:flex;flex-direction:column;min-height:0;background:#fff;border:2.5px solid #9EC3EE;border-radius:14px;box-shadow:0 8px 20px rgba(11,89,199,.14);overflow:hidden;}
  .rsh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(90deg,#0B59C7,#2563EB);color:#fff;}
  .rsh .di{width:30px;height:30px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .rsh .di img{width:24px;height:24px;}
  .rsh .nm{font-weight:900;font-size:17px;}
  .rsh .newtag{margin-left:auto;font-size:12.5px;font-weight:900;color:#0B59C7;background:#FFE08A;border-radius:7px;padding:3px 10px;}
  .rsb{flex:1;padding:11px 13px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .flowcard{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:#F5F9FF;border:2px solid #B8D6F5;border-radius:11px;padding:10px 13px;}
  .flowcard .fi{width:42px;height:42px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .flowcard .fi img{width:34px;height:34px;}
  .flowcard .ft{min-width:0;display:flex;flex-direction:column;}
  .flowcard .fn{font-size:18px;font-weight:900;color:#243B58;line-height:1.2;}
  .flowcard .fm{font-size:13px;font-weight:800;color:var(--weak);margin-top:2px;}
  .flowcard .btn{margin-left:auto;flex:0 0 auto;background:linear-gradient(180deg,#22C55E,#15803D);color:#fff;font-size:17px;font-weight:900;border-radius:10px;padding:10px 18px;box-shadow:0 4px 0 #0E5B2C,0 6px 9px rgba(0,0,0,.2);}
  .who{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:#F1F5FB;border:1.5px solid #D6E2F0;border-radius:10px;padding:8px 12px;}
  .who .wl{font-size:14px;font-weight:900;color:#0A4F8A;flex:0 0 auto;}
  .who .chip2{font-size:13.5px;font-weight:900;color:#0A4F8A;background:#DBEBFB;border:1.5px solid #A9CDF0;border-radius:8px;padding:4px 10px;}
  .vs{flex:1;display:flex;gap:8px;min-height:0;}
  .vsc{flex:1;border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-height:0;}
  .vsc.old{background:#F8FAFC;border:1.5px dashed #C7D2DE;}
  .vsc.new{background:#ECFDF5;border:2px solid #7EDCAD;}
  .vsc .vh{font-size:13.5px;font-weight:900;}
  .vsc.old .vh{color:#64748B;} .vsc.new .vh{color:var(--green-dark);}
  .vsc .vi{font-size:13.5px;font-weight:800;line-height:1.35;}
  .vsc.old .vi{color:#7C8794;} .vsc.new .vi{color:#0F7A48;}
  .vsc.new .big2{font-size:17px;font-weight:900;color:#15803D;}

  /* 下：21日タイムライン */
  .tl{flex:0 0 118px;margin:9px 16px 0;background:#fff;border:2px solid #D6DEEA;border-radius:13px;box-shadow:0 4px 10px rgba(0,0,0,.08);padding:4px 10px 0;overflow:hidden;}
  .tl svg{width:100%;height:100%;display:block;}

  .next{flex:0 0 auto;margin:8px 16px 13px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:25px;height:25px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// 21日タイムラインSVG
const timeline=`<svg viewBox="0 0 1200 112" preserveAspectRatio="none">
  <defs>
    <linearGradient id="gz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="rz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F87171"/><stop offset="1" stop-color="#DC2626"/></linearGradient>
  </defs>
  <rect x="40" y="52" width="780" height="20" rx="10" fill="url(#gz)"/>
  <rect x="828" y="52" width="332" height="20" rx="10" fill="url(#rz)" opacity=".85"/>
  <text x="430" y="66.5" text-anchor="middle" fill="#fff" font-weight="900" font-size="15" font-family="Noto Sans JP">✅ 復元できる期間（21日間）</text>
  <text x="994" y="66.5" text-anchor="middle" fill="#fff" font-weight="900" font-size="15" font-family="Noto Sans JP">❌ 完全に削除・復元不可</text>
  <g font-family="Noto Sans JP" font-weight="900">
    <g><circle cx="40" cy="62" r="15" fill="#fff" stroke="#DC2626" stroke-width="3"/><text x="40" y="67" text-anchor="middle" font-size="14">🗑️</text><text x="40" y="30" text-anchor="middle" font-size="14.5" fill="#991B1B">削除した日</text></g>
    <g><line x1="330" y1="40" x2="330" y2="84" stroke="#0B59C7" stroke-width="3" stroke-dasharray="4 4"/><rect x="270" y="86" width="120" height="24" rx="8" fill="#0B59C7"/><text x="330" y="103" text-anchor="middle" font-size="14" fill="#fff">今日＝残り18日</text><text x="330" y="30" text-anchor="middle" font-size="14" fill="#0B59C7">まだ間に合う！</text></g>
    <g><line x1="820" y1="34" x2="820" y2="84" stroke="#B45309" stroke-width="3"/><text x="820" y="26" text-anchor="middle" font-size="15" fill="#B45309">🚩 21日目＝期限</text></g>
    <g opacity=".8"><text x="1105" y="30" text-anchor="middle" font-size="14" fill="#991B1B">👻 もう戻らない</text></g>
  </g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.88-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">間違えて消したフロー｜<span class="hl">実は“21日以内”なら自分で戻せる</span></div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">「消したフローはもう戻らない」は誤解。<b>削除から21日以内</b>なら、管理者に頼らず<b>自分でポータルから復元</b>できます（2026年7月〜）。</div>
  </div>

  <div class="stage">
    <div class="fear">
      <div class="fh"><span class="face">😱</span>“うっかり削除”は誰にでも起きる</div>
      <div class="deleted"><span class="fi"><img src="${A}icons/pa_logo.png" alt=""></span><span class="fn">請求書リマインド</span><span class="stamp">削除済み</span></div>
      <div class="acc">
        <div class="a"><span class="e">🧹</span>フロー整理中に、本番用をうっかり削除</div>
        <div class="a"><span class="e">🧪</span>「テスト用」と間違えて本物を消した</div>
        <div class="a"><span class="e">👋</span>異動・退職者のフローを掃除して事故</div>
      </div>
      <div class="oldway">これまでは <b>PowerShell</b>・管理コネクタ・<b>サポート依頼</b>でしか戻せなかった…</div>
    </div>

    <div class="restore">
      <div class="rsh"><span class="di"><img src="${A}icons/pa_logo.png" alt=""></span><span class="nm">削除済みのフロー（ポータル）</span><span class="newtag">2026年7月 新機能</span></div>
      <div class="rsb">
        <div class="flowcard">
          <span class="fi"><img src="${A}icons/pa_logo.png" alt=""></span>
          <span class="ft"><span class="fn">請求書リマインド</span><span class="fm">3日前に削除 ・ あなたが所有者</span></span>
          <span class="btn">↩ 復元する</span>
        </div>
        <div class="who"><span class="wl">復元できる人</span><span class="chip2">所有者</span><span class="chip2">共同所有者</span><span class="chip2">環境管理者</span></div>
        <div class="vs">
          <div class="vsc old"><span class="vh">これまで</span><span class="vi">・PowerShell コマンド<br>・管理コネクタで自作<br>・サポートに依頼して待つ</span></div>
          <div class="vsc new"><span class="vh">これから</span><span class="big2">ボタン1つで復元</span><span class="vi">管理者に頼らず自己解決。<br>日本語の解説記事はまだ僅か＝<br>知っているだけで頼られる</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tl">${timeline}</div>

  <div class="next"><span class="na">${svg('arrow')}</span>ポータルの<b>どこから復元する?</b> 手順と“消さない備え”は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（削除したフローの復元・2026年7月GA）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
