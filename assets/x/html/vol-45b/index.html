<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.45-2 Teamsのスタンプでナレッジ収集｜作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --spo:#0F6CBD; --spo-dark:#0A4F8A; --teams:#5B5FC7; --teams-dark:#4347A8;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:32px;line-height:1.12;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:140px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:17.5px;color:var(--blue-dark);line-height:1.32;padding-right:92px;}
  .concl .txt b{color:var(--orange);}

  .cols{flex:1 1 auto;margin:11px 15px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .carrow{flex:0 0 32px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;}
  .carrow svg{width:30px;height:30px;}
  .colcard{flex:1;background:#fff;border:1.5px solid #C9D2E0;border-radius:13px;box-shadow:0 5px 13px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;}
  .cnum{position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;border:2.5px solid #fff;}
  .ch{display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:56px;background:linear-gradient(180deg,#F7F9FC,#ECF0F6);border-bottom:1px solid #E1E6EF;}
  .ch .sq{flex:0 0 auto;width:42px;height:42px;border-radius:9px;background:#fff;border:1px solid #E1E6EF;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1);}
  .ch .sq img{width:30px;height:30px;object-fit:contain;}
  .ch .sq svg{width:27px;height:27px;color:#5B5FC7;}
  .ch .nm{font-weight:900;font-size:16.5px;color:var(--ink);line-height:1.16;}
  .ch .nm small{display:block;font-weight:700;font-size:12px;color:var(--weak);margin-top:2px;}

  .cp{flex:1;font-family:'Segoe UI','Noto Sans JP',sans-serif;padding:9px 12px 9px;display:flex;flex-direction:column;gap:9px;}
  .ptop{flex:0 0 236px;display:flex;flex-direction:column;gap:8px;overflow:hidden;background:#F3F6FB;border:1px solid #DCE4F0;border-radius:10px;padding:9px 11px;margin-top:2px;}
  .sect{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:900;color:#5A6B85;}
  .sect::before{content:"";width:5px;height:15px;border-radius:2px;background:#8FA0BC;}
  .fld{display:flex;flex-direction:column;gap:4px;}
  .fld .l{font-size:14px;color:#605E5C;font-weight:800;line-height:1.2;}
  .fld .l .req{color:#D13438;margin-left:1px;}
  .fld .v{border:1px solid #D1D1D1;border-radius:6px;padding:8px 10px;font-size:15px;color:#242424;background:#fff;display:flex;align-items:center;gap:9px;}
  .fld .v .cr{margin-left:auto;flex:0 0 auto;color:#605E5C;font-weight:900;font-size:11px;}
  .fld .v .em{font-size:18px;}
  .dyn{display:inline-flex;align-items:center;gap:7px;background:#EAF1FE;border:1.5px solid #BBD0EE;border-radius:6px;padding:7px 11px;font-size:15.5px;font-weight:800;color:#1E40AF;align-self:flex-start;}
  .dyn svg{width:16px;height:16px;}

  /* Teams ミニ投稿（列3） */
  .miniteams{background:#fff;border:1px solid #E1E1ED;border-radius:11px;box-shadow:0 3px 8px rgba(0,0,0,.12);overflow:hidden;margin-top:2px;}
  .mt-h{display:flex;align-items:center;gap:7px;padding:7px 11px;background:linear-gradient(90deg,#4347A8,#5B5FC7);}
  .mt-h svg{width:15px;height:15px;color:#fff;}
  .mt-h span{font-weight:800;font-size:12px;color:#fff;}
  .mt-msg{display:flex;gap:9px;padding:11px 11px 8px;}
  .mt-av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#C7D7EE;color:#274B7A;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .mt-b{flex:1;font-size:13px;color:#242424;line-height:1.4;font-weight:600;}
  .mt-b .nm{font-weight:800;font-size:12.5px;}
  .mt-react{margin:0 11px 11px 50px;}
  .mt-pill{display:inline-flex;align-items:center;gap:6px;background:#EEF0FB;border:2px solid #5B5FC7;border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px;color:#3B3F9A;position:relative;}
  .mt-pill .em{font-size:16px;}
  .mt-hand{position:absolute;right:-8px;bottom:-14px;width:30px;height:30px;}

  .howsteps{flex:1;margin-top:0;background:linear-gradient(180deg,#F5F8FD,#EEF3FA);border:1px solid #D7E1F0;border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;}
  .howsteps .hh{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:900;color:#2B3A52;}
  .howsteps .hh::before{content:"";width:5px;height:16px;border-radius:2px;background:#2563EB;}
  .howsteps ol{list-style:none;display:flex;flex-direction:column;justify-content:space-evenly;flex:1;gap:8px;}
  .howsteps li{display:flex;gap:10px;align-items:flex-start;font-size:16px;font-weight:700;color:#2F3E57;line-height:1.3;}
  .howsteps li .sn{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:#2563EB;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .howsteps li b{color:#1E40AF;}
  .howsteps li.key{color:#0B5E37;} .howsteps li.key .sn{background:#16A34A;} .howsteps li.key b{color:#0B5E37;}

  .pitfall{flex:0 0 auto;margin:9px 15px 11px;background:linear-gradient(180deg,#FFF7ED,#FFEFD9);border:2px solid #FDBA74;border-radius:13px;padding:9px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 6px rgba(0,0,0,.07);position:relative;}
  .pitfall .pl{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FB923C,#EA580C);color:#fff;font-weight:900;font-size:15px;border-radius:9px;padding:8px 13px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .pitfall .pl svg{width:17px;height:17px;}
  .pitfall .px{flex:1;font-weight:800;font-size:15.5px;color:#7C2D12;line-height:1.34;padding-right:100px;}
  .pitfall .px b{color:var(--orange);}
  .pit-chara{position:absolute;right:12px;bottom:-2px;height:100px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 teams:'<path d="M3 6h12v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M15 9h5v6a3 3 0 0 1-3 3"/><circle cx="17.5" cy="5" r="2"/>',
 zap:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>',
 hand:'<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 11V6.5a1.5 1.5 0 0 1 3 0V13c0 3.5-2 7-6 7s-5-2.5-6.5-4.5L4 12.5a1.5 1.5 0 0 1 2.5-1.7L9 13"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.45-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方｜<span class="hl">絵文字リアクションで“ナレッジ箱”に自動収集</span></div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">作るのは3ステップ。コツは①の<b>追跡する絵文字</b>に好きな1つ（👍😄❤️など）を指定し、②で⚡<b>メッセージのリンク</b>を差し込むこと。その絵文字を押した投稿が<b>リンクで記録</b>される。</div>
  </div>

  <div class="cols">
    <div class="col">
      <div class="cnum">1</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_teams.png" alt=""></span><span class="nm">チャットでメッセージに応答があったとき<small>Microsoft Teams</small></span></div>
        <div class="cp">
          <div class="ptop">
            <div class="sect">実際の設定画面</div>
            <div class="fld"><span class="l">追跡する絵文字 <span class="req">*</span></span><span class="v"><span class="em">👍</span><span>サムズアップ</span><span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">メッセージの種類 <span class="req">*</span></span><span class="v"><span>グループ チャット</span><span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">トリガー頻度 <span class="req">*</span></span><span class="v"><span>すべての応答</span><span class="cr">▾</span></span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>トリガー「<b>応答があったとき</b>」を選ぶ</span></li>
              <li class="key"><span class="sn">2</span><span>追跡する絵文字に<b>好きな1つ</b>（例:👍）</span></li>
              <li><span class="sn">3</span><span>メッセージの種類・頻度を選ぶ</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">2</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_sharepoint.png" alt=""></span><span class="nm">項目の作成<small>SharePoint ／ ナレッジ箱に記録</small></span></div>
        <div class="cp">
          <div class="ptop">
            <div class="sect">実際の設定画面</div>
            <div class="fld"><span class="l">リスト名 <span class="req">*</span></span><span class="v"><span>ナレッジ箱</span><span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">内容</span><span class="dyn">${svg('zap')}メッセージのリンク</span></div>
            <div class="fld"><span class="l" style="color:#8A8886;">＋ 押した絵文字・収集日も記録できる</span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>＋ →「<b>SharePoint</b>」→「項目の作成」</span></li>
              <li><span class="sn">2</span><span>リスト名＝<b>ナレッジ箱</b></span></li>
              <li class="key"><span class="sn">3</span><span>内容に⚡<b>メッセージのリンク</b></span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">3</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_teams.png" alt=""></span><span class="nm">使い方<small>Teams でリアクションを押すだけ</small></span></div>
        <div class="cp">
          <div class="ptop">
            <div class="sect">実際のTeams画面</div>
            <div class="miniteams">
              <div class="mt-h"><img src="${A}icons/pa_teams.png" alt="" style="width:15px;height:15px;object-fit:contain;background:#fff;border-radius:3px;padding:1px"><span>業務改善 グループ チャット</span></div>
              <div class="mt-msg">
                <span class="mt-av">YT</span>
                <span class="mt-b"><span class="nm">山田 太郎</span><br>経費精算をスマホのボタンで記録するコツ、まとめたよ→</span>
              </div>
              <div class="mt-react">
                <span class="mt-pill"><span class="em">👍</span>1
                  <svg class="mt-hand" viewBox="0 0 24 24" fill="#FFD54A" stroke="#7A4A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICON.hand}</svg>
                </span>
              </div>
            </div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>残したい投稿にカーソルを当てる</span></li>
              <li class="key"><span class="sn">2</span><span>決めた<b>絵文字リアクション</b>を付ける</span></li>
              <li><span class="sn">3</span><span>自動でナレッジ箱に保存される</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="pitfall">
    <div class="pl">${svg('warn')}つまずき注意</div>
    <div class="px">トリガーの出力に<b>本文そのものは無い</b>→“メッセージへのリンク”を保存（本文が要るなら<b>「メッセージの詳細を取得」</b>を足す）。反応の時刻は取得不可。全部<b>標準・無料</b>。</div>
    <img class="pit-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
  <div class="src">出典：Microsoft Learn</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
