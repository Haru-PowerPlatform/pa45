<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.62-1 フォルダに入れるだけで自動リネーム＆自動仕分け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB;--blue-dark:#1E40AF;--green:#16A34A;--green-dark:#0B5E37;
    --ink:#1F2937;--gray:#374151;--weak:#6B7280;--orange:#EA580C;--red:#DC2626;--od:#0364B8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}

  .titlebar{height:86px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:14px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .logos{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .logos .ll{height:47px;width:47px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .logos .plus{color:#fff;font-weight:900;font-size:23px;text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1;}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:#EFF6FF;border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:9px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 3px 6px rgba(0,0,0,.26);}
  .concl .txt{font-weight:800;font-size:17.5px;color:var(--blue-dark);line-height:1.34;padding-right:96px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .pan{flex:1;position:relative;border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;min-height:0;box-shadow:0 5px 13px rgba(0,0,0,.11),inset 0 1px 0 rgba(255,255,255,.7);}
  .pan.before{background:linear-gradient(165deg,#FFF3EF,#FCE1DA);border:2.5px solid #EE9B84;}
  .pan.after{background:linear-gradient(165deg,#EDFBF3,#D6F2E1);border:2.5px solid #63C48C;}
  .phd{align-self:flex-start;display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;border-radius:11px;padding:7px 15px;color:#fff;box-shadow:0 3px 7px rgba(0,0,0,.2);margin-bottom:9px;}
  .phd.bad{background:linear-gradient(180deg,#F0724F,#D6402A);}
  .phd.good{background:linear-gradient(180deg,#2BD06A,#16A34A);}

  /* ファイルエクスプローラー風 */
  .win{flex:1;background:#fff;border:1.5px solid #C9D2DE;border-radius:11px;box-shadow:0 4px 11px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;font-family:'Segoe UI','Noto Sans JP',sans-serif;min-height:0;}
  .wbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#F7F9FB,#EEF1F5);border-bottom:1px solid #DDE3EA;}
  .wbar .fold{font-size:14px;font-weight:800;color:#243B53;}
  .wbar .cnt{margin-left:auto;font-size:12px;font-weight:700;color:#8A97A8;}
  .chead{display:flex;font-size:11.5px;font-weight:800;color:#7A8699;background:#F4F6F9;border-bottom:1px solid #E4E9EF;padding:5px 12px;}
  .chead .c1{flex:1;} .chead .c2{flex:0 0 96px;}
  .frow{display:flex;align-items:center;font-size:14px;color:#2b3440;font-weight:600;padding:7px 12px;border-bottom:1px solid #F1F3F6;}
  .frow .fn{flex:1;display:flex;align-items:center;gap:9px;}
  .frow .fn .fi{font-size:17px;}
  .frow .ty{flex:0 0 96px;font-size:12px;color:#98A2B3;font-weight:700;}
  .frow.messy .nm{color:#6B7280;}
  .badnote{flex:0 0 auto;margin-top:9px;background:#FDEAE3;border:1.5px solid #F3B7A4;border-radius:10px;padding:7px 12px;font-size:14.5px;font-weight:900;color:#B0361B;display:flex;align-items:center;gap:8px;}

  /* After: フォルダツリー */
  .tree{flex:1;background:#fff;border:1.5px solid #B7E0C7;border-radius:11px;box-shadow:0 4px 11px rgba(22,163,74,.15);overflow:hidden;display:flex;flex-direction:column;font-family:'Segoe UI','Noto Sans JP',sans-serif;min-height:0;}
  .tree .wbar{background:linear-gradient(180deg,#F1FBF5,#E4F6EC);border-bottom:1px solid #C4E9D2;}
  .tree .wbar .fold{color:#0B5E37;}
  .tnodes{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:5px 10px;gap:3px;}
  .tnode{display:flex;flex-direction:column;gap:3px;}
  .tfolder{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;color:#0B5E37;}
  .tfolder .fi{font-size:17px;}
  .tfolder .tag{margin-left:auto;font-size:10.5px;font-weight:900;color:#0B6A0B;background:#DCF7E5;border:1px solid #A6E1BC;border-radius:999px;padding:1px 9px;}
  .tfile{margin-left:22px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#2b3440;background:#F4FBF6;border:1px solid #CDEBD8;border-radius:7px;padding:4px 10px;}
  .tfile .fi{font-size:15px;}
  .tfile .dt{color:#0E7A3B;font-weight:900;}
  .goodnote{flex:0 0 auto;margin-top:9px;background:#DCF7E5;border:1.5px solid #8FD9AC;border-radius:10px;padding:7px 12px;font-size:14.5px;font-weight:900;color:#0B5E37;display:flex;align-items:center;gap:8px;}

  /* 中央エンジン */
  .mid{flex:0 0 118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;}
  .engine{width:80px;height:80px;border-radius:22px;background:linear-gradient(180deg,#EAF2FF,#D6E6FF);border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 15px rgba(37,99,235,.3),inset 0 1px 0 rgba(255,255,255,.8);}
  .engine img{width:50px;height:50px;object-fit:contain;}
  .marrow{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(234,88,12,.42);}
  .mlbl{font-size:13px;font-weight:900;color:#B45309;text-align:center;line-height:1.25;background:#FFF3D9;border:1.5px solid #F3CE7E;border-radius:9px;padding:5px 9px;}

  .uses{flex:0 0 auto;margin:11px 16px 12px;display:flex;align-items:stretch;gap:9px;}
  .ulabel{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#4A85FF,#2563EB);color:#fff;font-weight:900;font-size:14px;border-radius:11px;padding:0 15px;text-align:center;line-height:1.25;box-shadow:0 3px 8px rgba(37,99,235,.3);}
  .uc{flex:1;background:#F8F9FA;border:2px solid #D3DDEC;border-radius:11px;padding:8px 12px;box-shadow:0 2px 6px rgba(0,0,0,.07);display:flex;align-items:center;gap:10px;}
  .uc .em{font-size:22px;flex:0 0 auto;}
  .uc .ut{font-size:14.5px;font-weight:800;color:#33405a;line-height:1.28;}
  .uc .ut b{color:var(--blue-dark);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.62-1</div>
    <div class="logos"><img class="ll" src="${A}icons/pa_logo.png" alt=""><span class="plus">＋</span><img class="ll" src="${A}icons/pa_onedrive.png" alt=""></div>
    <div class="title-text">フォルダに入れるだけで<span class="hl">“自動リネーム＆自動仕分け”</span></div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">🗂️</div>
    <div class="txt">「とりあえずダウンロード」で散らかるフォルダ。ファイルを<b>“放り込むだけ”</b>で、名前が整って正しい場所へ。<br>そんな<b>“勝手に片づく引き出し”</b>を、Power Automateで自作できます。</div>
  </div>

  <div class="stage">
    <div class="pan before">
      <div class="phd bad">😵 いま：ぐちゃぐちゃの受信箱</div>
      <div class="win">
        <div class="wbar"><span class="fold">📁 _受信箱</span><span class="cnt">7個の項目</span></div>
        <div class="chead"><span class="c1">名前</span><span class="c2">種類</span></div>
        <div class="frow"><span class="fn"><span class="fi">📄</span><span class="nm">見積.pdf</span></span><span class="ty">PDF</span></div>
        <div class="frow"><span class="fn"><span class="fi">🖼️</span><span class="nm">IMG_4821.jpg</span></span><span class="ty">画像</span></div>
        <div class="frow"><span class="fn"><span class="fi">📊</span><span class="nm">名称未設定(3).xlsx</span></span><span class="ty">Excel</span></div>
        <div class="frow"><span class="fn"><span class="fi">📄</span><span class="nm">スキャン_001.pdf</span></span><span class="ty">PDF</span></div>
        <div class="frow"><span class="fn"><span class="fi">📝</span><span class="nm">document(2).docx</span></span><span class="ty">Word</span></div>
        <div class="frow"><span class="fn"><span class="fi">📄</span><span class="nm">20240401_請求.pdf</span></span><span class="ty">PDF</span></div>
        <div class="frow"><span class="fn"><span class="fi">🖼️</span><span class="nm">Screenshot_2026-07-09.png</span></span><span class="ty">画像</span></div>
      </div>
      <div class="badnote">😩 名前バラバラ・置き場所バラバラで、後から探せない</div>
    </div>

    <div class="mid">
      <div class="engine"><img src="${A}icons/pa_onedrive.png" alt=""></div>
      <div class="marrow">→</div>
      <div class="mlbl">入れた瞬間に<br>自動で整理</div>
    </div>

    <div class="pan after">
      <div class="phd good">✨ 自動で：名前も置き場所もそろう</div>
      <div class="tree">
        <div class="wbar"><span class="fold">📁 整理済み</span><span class="cnt">自動仕分け</span></div>
        <div class="tnodes">
          <div class="tnode"><div class="tfolder"><span class="fi">📁</span>見積<span class="tag">自動</span></div><div class="tfile"><span class="fi">📄</span><span class="dt">2026-07-10</span>_見積_ABC商事.pdf</div></div>
          <div class="tnode"><div class="tfolder"><span class="fi">📁</span>請求書<span class="tag">自動</span></div><div class="tfile"><span class="fi">📄</span><span class="dt">2026-07-10</span>_請求書_XYZ社.pdf</div></div>
          <div class="tnode"><div class="tfolder"><span class="fi">📁</span>画像<span class="tag">自動</span></div><div class="tfile"><span class="fi">🖼️</span><span class="dt">2026-07-10</span>_現場写真.jpg</div></div>
        </div>
      </div>
      <div class="goodnote">🙌 名前は“日付＋種別＋中身”で統一、フォルダも自動振り分け</div>
    </div>
  </div>

  <div class="uses">
    <div class="ulabel">こんな<br>“あるある”<br>に効く</div>
    <div class="uc"><span class="em">🧾</span><span class="ut">経費の<b>レシート・領収書</b></span></div>
    <div class="uc"><span class="em">📷</span><span class="ut">現場・商品の<b>写真</b></span></div>
    <div class="uc"><span class="em">📑</span><span class="ut">契約書・<b>申請書・スキャンPDF</b></span></div>
  </div>
  <div class="src">出典：Power Automate 実機（PA45 Demo）／Microsoft Learn　※作り方は2枚目</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
