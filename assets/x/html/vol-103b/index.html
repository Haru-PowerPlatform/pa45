<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.103-2 足す1行と、その意味</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:11px;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;background:#F8FAFC;border:2.5px solid #DCE3EE;border-radius:14px;padding:8px 10px 9px;}
  .col.hot{border-color:var(--violet);background:#F9F5FE;box-shadow:0 5px 12px rgba(124,58,237,.14);}
  .col.fin{border-color:#7FCEA9;background:var(--green-bg);}
  .ch2{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:19.5px;color:#1B2A44;line-height:1.18;}
  .ch2 .n{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .col.hot .ch2 .n{background:linear-gradient(180deg,#8B5CF6,#7C3AED);}
  .col.fin .ch2 .n{background:linear-gradient(180deg,#34D399,#16A34A);}
  .cbody{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;}
  .cap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.32;border-radius:9px;padding:7px 10px;color:#334155;background:#E7EEF7;}
  .col.hot .cap{color:#5B21B6;background:#EEE4FC;}
  .col.fin .cap{color:var(--green-dark);background:#CFEFE0;}
  .cap b{color:var(--orange);}

  .fig{flex:0 0 auto;height:96px;border-radius:10px;position:relative;overflow:hidden;background:#EDF3FA;}
  .col.hot .fig{background:#F1E9FD;}
  .col.fin .fig{background:#DCF3E7;}
  .fig svg{position:absolute;inset:0;width:100%;height:100%;}

  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #C7D6EE;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .col.hot .card{border-color:#D6C7EF;box-shadow:0 5px 12px rgba(124,58,237,.18);}
  .cardh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 11px;font-weight:900;font-size:16px;color:#1B2A44;background:#F2F7FD;border-bottom:1.5px solid #E2EAF5;}
  .col.hot .cardh{background:linear-gradient(90deg,#5B21B6,#7C3AED);color:#fff;border-bottom:none;}
  .cardh .ci{width:28px;height:28px;flex:0 0 auto;}
  .cardb{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .k{font-size:14px;font-weight:900;color:var(--weak);}
  .fld .v{background:#F7F9FC;border:1.5px solid #D9E1EC;border-radius:7px;padding:5px 8px;font-size:15px;font-weight:900;color:#243B58;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.28;}
  .fld .v.hot{background:#F5EFFE;border-color:#B79BEE;box-shadow:0 0 0 2px #EDE4FB;}
  .dynp{display:inline-flex;align-items:center;gap:3px;background:#EAF2FF;border:1.5px solid #9DC1F5;border-radius:6px;padding:0 7px;font-size:14px;color:#0B3A8F;font-weight:900;}
  .dynp::before{content:"⚡";font-size:13px;}
  .code{background:#1E293B;border-radius:8px;padding:7px 9px;font-family:'Roboto Mono',monospace;font-size:13.8px;font-weight:700;color:#93C5FD;line-height:1.4;word-break:break-all;}
  .code .y{color:#FDE68A;} .code .r{color:#FCA5A5;}

  .kv{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .kvi{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--green);border-radius:9px;padding:6px 10px;min-height:0;}
  .kvi .t{font-size:15.5px;font-weight:900;color:var(--green-dark);line-height:1.22;}
  .kvi .d{font-size:14px;font-weight:800;color:#5B6472;line-height:1.3;}

  .warn{flex:0 0 auto;margin:9px 16px 0;display:flex;align-items:center;gap:12px;background:#FFFBEB;border:2.5px solid #FCD34D;border-radius:12px;padding:8px 14px;}
  .warn .wt{flex:0 0 auto;font-size:14.5px;font-weight:900;color:#B45309;}
  .warn .wl{flex:1;display:flex;gap:8px;}
  .warn .wl span{flex:1;font-size:14.5px;font-weight:900;color:#92400E;background:#fff;border:1.5px solid #F6D08A;border-radius:8px;padding:6px 9px;line-height:1.3;}
  .warn .wl code{font-family:'Roboto Mono',monospace;font-size:13.5px;color:#B45309;}

  .next{flex:0 0 auto;margin:8px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:8px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>'
};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ① 表 → CSV文字列 */
const fig1=`<svg viewBox="0 0 320 112" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="c1" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#1B2A44" flood-opacity=".2"/></filter>
    <marker id="mk1" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#2563EB"/></marker>
  </defs>
  <g transform="translate(10,16)" filter="url(#c1)">
    <rect x="0" y="0" width="112" height="78" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2.6"/>
    <rect x="0" y="0" width="112" height="20" rx="8" fill="#2563EB"/><rect x="0" y="14" width="112" height="6" fill="#2563EB"/>
    ${Array.from({length:3},(_,i)=>`<g><line x1="12" y1="${34+i*15}" x2="50" y2="${34+i*15}" stroke="#C3D6F2" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="${34+i*15}" x2="100" y2="${34+i*15}" stroke="#C3D6F2" stroke-width="5" stroke-linecap="round"/></g>`).join('')}
  </g>
  <path d="M132 55 H 162" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" marker-end="url(#mk1)"/>
  <g transform="translate(174,18)" filter="url(#c1)">
    <rect x="0" y="0" width="134" height="74" rx="8" fill="#1E293B"/>
    <text x="12" y="26" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#93C5FD">日付,担当,金額</text>
    <text x="12" y="46" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#93C5FD">08/16,佐藤,12000</text>
    <text x="12" y="66" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#93C5FD">08/16,田中,8400</text>
  </g>
</svg>`;

/* ② ファイルの先頭にBOMを連結 */
const fig2=`<svg viewBox="0 0 320 112" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="c2" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#2A1450" flood-opacity=".2"/></filter></defs>
  <g transform="translate(14,30)" filter="url(#c2)">
    <rect x="0" y="0" width="60" height="52" rx="9" fill="#7C3AED"/>
    <text x="30" y="24" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">目印</text>
    <text x="30" y="42" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#E9DDFB" text-anchor="middle">3バイト</text>
  </g>
  <text x="88" y="62" font-family="Noto Sans JP" font-size="26" font-weight="900" fill="#5B21B6" text-anchor="middle">＋</text>
  <g transform="translate(108,30)" filter="url(#c2)">
    <rect x="0" y="0" width="80" height="52" rx="9" fill="#fff" stroke="#7C3AED" stroke-width="2.6"/>
    <text x="40" y="33" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#5B21B6" text-anchor="middle">CSVの中身</text>
  </g>
  <text x="202" y="62" font-family="Noto Sans JP" font-size="24" font-weight="900" fill="#5B21B6" text-anchor="middle">＝</text>
  <g transform="translate(220,22)" filter="url(#c2)">
    <path d="M0 0 h56 l22 22 v46 a6 6 0 0 1-6 6 H6 a6 6 0 0 1-6-6 V6 a6 6 0 0 1 6-6z" fill="#EAF9F1" stroke="#16A34A" stroke-width="2.8"/>
    <path d="M56 0 v22 h22" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linejoin="round"/>
    <text x="39" y="48" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#0B5136" text-anchor="middle">読める</text>
    <text x="39" y="64" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#0B5136" text-anchor="middle">CSV</text>
  </g>
</svg>`;

/* ③ BOMの中身＝先頭3バイト */
const fig3=`<svg viewBox="0 0 320 112" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="c3" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#0B3B24" flood-opacity=".2"/></filter></defs>
  <text x="160" y="22" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#0B5136" text-anchor="middle">ファイルの先頭</text>
  <g transform="translate(16,34)" filter="url(#c3)">
    ${['EF','BB','BF'].map((h,i)=>`<g transform="translate(${i*62},0)"><rect x="0" y="0" width="56" height="42" rx="8" fill="#16A34A"/><text x="28" y="28" font-family="Roboto Mono" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">${h}</text></g>`).join('')}
  </g>
  <text x="109" y="100" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#0B5136" text-anchor="middle">これがUTF-8の目印</text>
  <g transform="translate(216,34)" filter="url(#c3)">
    ${Array.from({length:4},(_,i)=>`<rect x="${i*22}" y="0" width="18" height="42" rx="6" fill="#CFEFE0"/>`).join('')}
  </g>
  <text x="262" y="100" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#5B6472" text-anchor="middle">この先が中身</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.103-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">足す<span class="hl">1行</span>と、その意味</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('table')}</div>
    <div class="txt">直すのは<b>ファイルを作るところ</b>。CSVの作り方は変えず、<b>中身の前に目印を足す</b>だけです。</div>
  </div>

  <div class="stage">
    <div class="col">
      <div class="ch2"><span class="n">1</span>CSVを作る（いつも通り）</div>
      <div class="fig">${fig1}</div>
      <div class="cbody">
        <div class="card">
          <div class="cardh"><span class="ci">${svg('table',2.2)}</span>CSV テーブルの作成</div>
          <div class="cardb">
            <div class="fld"><span class="k">開始</span><span class="v"><span class="dynp">取得した一覧</span></span></div>
            <div class="fld"><span class="k">列</span><span class="v">自動</span></div>
          </div>
        </div>
      </div>
      <div class="cap">ここは<b>今までと同じ</b>。触りません。</div>
    </div>

    <div class="col hot">
      <div class="ch2"><span class="n">2</span>ここに1行足す</div>
      <div class="fig">${fig2}</div>
      <div class="cbody">
        <div class="card">
          <div class="cardh"><span class="ci">${svg('save',2.2)}</span>ファイルの作成</div>
          <div class="cardb">
            <div class="fld"><span class="k">ファイル名</span><span class="v">売上一覧.csv</span></div>
            <div class="fld"><span class="k">ファイル コンテンツ</span></div>
            <div class="code"><span class="y">concat</span>(<span class="y">decodeUriComponent</span>(<span class="r">'%EF%BB%BF'</span>),<br>&nbsp;&nbsp;body(<span class="r">'CSV_テーブルの作成'</span>))</div>
          </div>
        </div>
      </div>
      <div class="cap">中身を入れていた欄を、<b>この式に置き換える</b>だけ。</div>
    </div>

    <div class="col fin">
      <div class="ch2"><span class="n">3</span>足しているもの</div>
      <div class="fig">${fig3}</div>
      <div class="cbody">
        <div class="kv">
          <div class="kvi"><span class="t">中身は1文字も変わらない</span><span class="d">先頭に3バイトの目印が付くだけ</span></div>
          <div class="kvi"><span class="t">メール添付でも同じ</span><span class="d">添付ファイルの中身にも同じ式が使える</span></div>
          <div class="kvi"><span class="t">相手の手元でも読める</span><span class="d">開き直しや保存し直しが要らなくなる</span></div>
        </div>
      </div>
      <div class="cap">目印が付くと、Excelが<b>自分で正しく判断</b>してくれます。</div>
    </div>
  </div>

  <div class="warn">
    <div class="wt">使う前に確認</div>
    <div class="wl">
      <span>式の中のアクション名は<b>空白を <code>_</code> に</b>置き換えます</span>
      <span>アクション名を後で変えたら、<b>式の中も直す</b>必要があります</span>
      <span>これは<b>公式ドキュメント外</b>の定番の対処です（動作は要確認）</span>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>CSVを人に渡すフローがあるなら、<b>今日つけておく</b>と親切です！</div>
  <div class="src">出典：Microsoft Learn「Power Automate でデータ操作を使用する」（CSV テーブルの作成）／BOM付与の対処は Japan Dynamics CRM &amp; Power Platform Support Blog ほか／画面は再現</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
