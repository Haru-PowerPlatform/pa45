<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.105-1 見に行かなくても、更新だけ届く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#065F46;
    --red:#DC2626; --red-bg:#FEF2F2; --red-dark:#991B1B;
    --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#F0A83A,#EA580C);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:11px;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;background:#F8FAFC;border:2.5px solid #DCE3EE;border-radius:14px;padding:8px 10px 9px;}
  .col.c2{border-color:#F0C868;background:#FFFCF2;}
  .col.c3{border-color:#7FCEA9;background:var(--green-bg);}
  .ch2{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;color:#1B2A44;line-height:1.16;}
  .col.c2 .ch2{color:#8A5A00;}
  .col.c3 .ch2{color:var(--green-dark);}
  .ch2 .n{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .col.c2 .ch2 .n{background:linear-gradient(180deg,#F0B23A,#D97706);}
  .col.c3 .ch2 .n{background:linear-gradient(180deg,#34D399,#16A34A);}

  .scene{flex:0 0 auto;height:128px;border-radius:11px;position:relative;overflow:hidden;background:#EDF3FA;}
  .col.c2 .scene{background:#FDF6E3;}
  .col.c3 .scene{background:#DCF3E7;}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;}
  .scene .chara{position:absolute;right:4px;bottom:0;height:114px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .body{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;}
  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #C7D6EE;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .col.c2 .card{border-color:#F0C868;}
  .col.c3 .card{border-color:#7FCEA9;}
  .cardh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 10px;font-weight:900;font-size:15.5px;color:#1B2A44;background:#F2F7FD;border-bottom:1.5px solid #E2EAF5;}
  .col.c2 .cardh{background:#FDF0D5;border-bottom-color:#EBD3A4;color:#8A5A00;}
  .col.c3 .cardh{background:#EAF9F1;border-bottom-color:#BFE7D3;color:var(--green-dark);}
  .cardh img{width:26px;height:26px;object-fit:contain;flex:0 0 auto;}
  .cardh .ci{width:26px;height:26px;flex:0 0 auto;}
  .cardb{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;}
  .url{background:#F7F9FC;border:1.5px solid #D9E1EC;border-radius:7px;padding:6px 9px;font-family:'Roboto Mono',monospace;font-size:13.8px;font-weight:700;color:#0B3A8F;word-break:break-all;line-height:1.35;}
  .item{display:flex;flex-direction:column;gap:2px;background:#F8FAFC;border-left:5px solid #D97706;border-radius:6px;padding:5px 9px;}
  .item .t{font-size:15px;font-weight:900;color:#243B58;line-height:1.24;}
  .item .d{font-size:13.8px;font-weight:800;color:var(--weak);}
  .item.hit{background:#FFF7E6;border-left-color:#EA580C;}
  .msg{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0;}
  .msg .ttl{font-size:16px;font-weight:900;color:#1B2A44;line-height:1.24;}
  .msg .ln{font-size:14.5px;font-weight:800;color:#475569;line-height:1.3;}
  .msg .lk{margin-top:auto;font-size:14.5px;font-weight:900;color:#1E40AF;background:#EAF2FF;border:1.5px solid #9DC1F5;border-radius:7px;padding:5px 9px;}
  .cap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.32;border-radius:9px;padding:7px 10px;color:#334155;background:#E7EEF7;}
  .col.c2 .cap{color:#8A5A00;background:#FDF0D5;}
  .col.c3 .cap{color:var(--green-dark);background:#CFEFE0;}
  .cap b{color:var(--orange);}

  .next{flex:0 0 auto;margin:9px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',rss:'<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.6" fill="currentColor"/>',filter:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>'};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ① 見に行く日々 → URLを1回貼るだけ */
const sc1=`<svg viewBox="0 0 300 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="s1a" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <g transform="translate(12,14)" filter="url(#s1a)">
    <rect x="0" y="0" width="150" height="94" rx="9" fill="#fff" stroke="#2563EB" stroke-width="2.6"/>
    <rect x="0" y="0" width="150" height="22" rx="9" fill="#DCE7F7"/><rect x="0" y="14" width="150" height="8" fill="#DCE7F7"/>
    <circle cx="12" cy="11" r="3.6" fill="#9AB4DA"/><circle cx="24" cy="11" r="3.6" fill="#9AB4DA"/>
    <rect x="12" y="32" width="126" height="10" rx="4" fill="#C3D6F2"/>
    <rect x="12" y="50" width="98" height="8" rx="4" fill="#E1E9F4"/>
    <rect x="12" y="64" width="112" height="8" rx="4" fill="#E1E9F4"/>
    <rect x="12" y="78" width="80" height="8" rx="4" fill="#E1E9F4"/>
  </g>
  <g transform="translate(186,36)" filter="url(#s1a)">
    <circle cx="30" cy="30" r="30" fill="#EA580C"/>
    <g transform="translate(14,14)" stroke="#fff" stroke-width="4.4" fill="none" stroke-linecap="round">
      <path d="M0 14a18 18 0 0 1 18 18"/><path d="M0 4a28 28 0 0 1 28 28"/>
    </g>
    <circle cx="20" cy="42" r="4.4" fill="#fff"/>
  </g>
  <text x="216" y="118" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#9A3412" text-anchor="middle">RSS</text>
</svg>`;

/* ② 新着が出た瞬間に起動 */
const sc2=`<svg viewBox="0 0 300 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="s2a" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#4A3410" flood-opacity=".22"/></filter>
    <marker id="mk105" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#D97706"/></marker>
  </defs>
  ${Array.from({length:3},(_,i)=>`<g transform="translate(10,${8+i*38})" filter="url(#s2a)"><rect x="0" y="0" width="112" height="30" rx="7" fill="#fff" stroke="${i===0?'#EA580C':'#D9C08A'}" stroke-width="${i===0?'3':'2.2'}"/><rect x="9" y="9" width="60" height="6" rx="3" fill="${i===0?'#F0B23A':'#EADFC4'}"/><rect x="9" y="19" width="86" height="5" rx="2.5" fill="#EFE6D2"/></g>`).join('')}
  <g transform="translate(96,6)"><rect x="0" y="0" width="46" height="20" rx="10" fill="#EA580C"/><text x="23" y="15" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">新着</text></g>
  <path d="M132 62 H 168" stroke="#D97706" stroke-width="5" stroke-linecap="round" marker-end="url(#mk105)"/>
  <g transform="translate(182,32)" filter="url(#s2a)">
    <rect x="0" y="0" width="100" height="60" rx="10" fill="#fff" stroke="#D97706" stroke-width="2.8"/>
    <path d="M52 12 L36 36 h14 l-4 16 L64 28 H50 z" fill="#F0B23A"/>
    <text x="50" y="76" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#8A5A00" text-anchor="middle">フローが起動</text>
  </g>
</svg>`;

/* ③ キーワードで絞ってTeamsへ */
const sc3=`<svg viewBox="0 0 300 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="s3a" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#0B3B24" flood-opacity=".2"/></filter>
    <marker id="mk105b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#16A34A"/></marker>
  </defs>
  ${Array.from({length:4},(_,i)=>`<rect x="8" y="${16+i*24}" width="52" height="14" rx="4" fill="${i===1?'#16A34A':'#C6DECF'}"/>`).join('')}
  <path d="M74 24 L118 44 L118 60 L74 80 Z" fill="#EAF9F1" stroke="#16A34A" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="96" y="57" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#0B5136" text-anchor="middle">絞る</text>
  <path d="M126 52 H 154" stroke="#16A34A" stroke-width="5" stroke-linecap="round" marker-end="url(#mk105b)"/>
  <g transform="translate(168,20)" filter="url(#s3a)">
    <rect x="0" y="0" width="112" height="60" rx="10" fill="#F0F2FB" stroke="#5B5FC7" stroke-width="2.6"/>
    <circle cx="20" cy="20" r="8" fill="#5B5FC7"/>
    <line x1="36" y1="18" x2="98" y2="18" stroke="#B9BDE8" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="40" x2="98" y2="40" stroke="#B9BDE8" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 60 L22 74 L38 60 Z" fill="#F0F2FB" stroke="#5B5FC7" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
  <text x="224" y="112" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#0B5136" text-anchor="middle">担当チャネルへ</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.105-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">見に行かなくても、<span class="hl">サイトの更新だけ届く</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('rss')}</div>
    <div class="txt">官公庁や業界団体のページを、毎朝見に行っていませんか。<b>URLを1回貼るだけ</b>で、更新の方から届きます。</div>
  </div>

  <div class="stage">
    <div class="col">
      <div class="ch2"><span class="n">1</span>URLを1回貼る</div>
      <div class="scene">${sc1}<img class="chara" src="${A}chara/chara_point.png" alt=""></div>
      <div class="body">
        <div class="card">
          <div class="cardh"><span class="ci">${svg('rss',2.4)}</span>RSS フィードの URL</div>
          <div class="cardb">
            <div class="url">https://www.example.go.jp/<br>news/index.rss</div>
            <div class="item"><span class="t">見張りたいページ</span><span class="d">官公庁・業界団体・社外ブログ</span></div>
            <div class="item"><span class="t">RSSの探し方</span><span class="d">ページ内の「RSS」リンクを探す</span></div>
          </div>
        </div>
      </div>
      <div class="cap">準備は<b>これだけ</b>。アカウントの接続も要りません。</div>
    </div>

    <div class="col c2">
      <div class="ch2"><span class="n">2</span>出た瞬間に起動</div>
      <div class="scene">${sc2}</div>
      <div class="body">
        <div class="card">
          <div class="cardh"><span class="ci">${svg('rss',2.4)}</span>新しく出た記事</div>
          <div class="cardb">
            <div class="item hit"><span class="t">制度改正のお知らせ</span><span class="d">2026/08/16 10:00 公開</span></div>
            <div class="item"><span class="t">窓口の受付時間について</span><span class="d">2026/08/15 公開</span></div>
            <div class="item"><span class="t">採用情報を更新しました</span><span class="d">2026/08/14 公開</span></div>
          </div>
        </div>
      </div>
      <div class="cap">こちらから<b>見に行く必要がありません</b>。</div>
    </div>

    <div class="col c3">
      <div class="ch2"><span class="n">3</span>絞って届ける</div>
      <div class="scene">${sc3}</div>
      <div class="body">
        <div class="card">
          <div class="cardh"><img src="${A}icons/pa_teams.png" alt="">法務チャネル</div>
          <div class="cardb">
            <div class="msg">
              <div class="ttl">制度改正のお知らせ</div>
              <div class="ln">2026/08/16 10:00 公開</div>
              <div class="ln">「改正」を含む記事だけ流しています。<br>本文は流さず、見出しとリンクだけ。</div>
              <div class="lk">元の記事を開く</div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap">全部流すと読まれません。<b>キーワードで絞る</b>のがコツ。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>使うのは<b>トリガー1つとアクション1つ</b>。作り方と落とし穴は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn「RSS」コネクタ リファレンス（Power Automate では Standard）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
