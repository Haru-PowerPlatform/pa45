<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.186-4 Excel 台帳をリストへ移す3か所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .msi{flex:0 0 auto;object-fit:contain;}
  .repro{font-size:12.5px;font-weight:700;color:#8A8886;margin-left:auto;white-space:nowrap;}
  .col.info .scene{background:#E3EDFB;}
  .scene{height:100px;}
  .vs{line-height:1.1;}
  .cardb{gap:0;padding:4px 9px;}
  .row{flex:1;min-height:0;display:flex;align-items:center;gap:8px;border-bottom:1.2px solid #EDEBE9;font-size:15.5px;font-weight:700;color:#1B2A44;line-height:1.25;}
  .row:last-child{border-bottom:none;}
  .row .k{flex:0 0 92px;font-weight:900;}
  .ty{font-size:14px;font-weight:900;color:#035E61;background:#E6F4F4;border:1.5px solid #7CC7C9;border-radius:5px;padding:0 6px;white-space:nowrap;}
  .sw{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1px;border-bottom:1.2px solid #EDEBE9;}
  .sw:last-child{border-bottom:none;}
  .sw .o{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#9CA3AF;text-decoration:line-through;}
  .sw .n{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#1B2A44;}
  .sw .n::before{content:"→";color:#16A34A;font-weight:900;}
  .tc{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;border:1.8px solid #C7D6EE;border-radius:8px;padding:4px 8px;margin:3px 0;}
  .tc .t{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:900;color:#1B2A44;}
  .tc .f{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#4B5563;}
  .tc .f .in{flex:1;border:1.5px solid #9CA3AF;border-radius:5px;padding:0 7px;color:#1B2A44;font-weight:700;white-space:nowrap;overflow:hidden;}
  .tc.old{opacity:.55;border-style:dashed;}
  .vs{flex:0 0 auto;text-align:center;font-size:15px;font-weight:900;color:#16A34A;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'};
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const PA=(w)=>`<img class="msi" src="${A}icons/pa_logo.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const CH=(e,h)=>`<img class="chara" src="${A}chara/chara_${e}.png" alt="" style="height:${h||112}px">`;
const sheet=(x,y,c,t)=>`<g transform="translate(${x},${y})"><rect x="5" y="5" width="120" height="78" rx="6" fill="#000" opacity=".10"/><rect width="120" height="78" rx="6" fill="#fff" stroke="${c}" stroke-width="2"/><rect width="120" height="15" rx="6" fill="${c}"/><text x="8" y="11.5" font-size="10" font-weight="900" fill="#fff">${t}</text>${[25,37,49,61].map(yy=>`<rect x="8" y="${yy}" width="104" height="7" rx="2" fill="${c}" opacity=".22"/>`).join('')}</g>`;
const sc1=`<svg viewBox="0 0 385 100" preserveAspectRatio="xMidYMid slice">${sheet(14,10,'#217346','台帳.xlsx')}
 <path d="M144 50h46" stroke="#2563EB" stroke-width="4" stroke-dasharray="7 5"/><path d="M186 40l12 10-12 10" fill="none" stroke="#2563EB" stroke-width="4"/>
 ${sheet(206,10,'#038387','備品貸出（リスト）')}</svg>`;
const card=(x,y,t,c,w=96)=>`<g transform="translate(${x},${y})"><rect x="3" y="3" width="${w}" height="24" rx="5" fill="#000" opacity=".10"/><rect width="${w}" height="24" rx="5" fill="#fff" stroke="${c}" stroke-width="2"/><rect width="6" height="24" rx="2" fill="${c}"/><text x="12" y="16" font-size="10.5" font-weight="900" fill="#1B2A44">${t}</text></g>`;
const sc2=`<svg viewBox="0 0 385 100" preserveAspectRatio="xMidYMid slice">
 ${card(14,8,'表に行を追加','#217346')}${card(14,38,'一覧表示','#217346')}${card(14,68,'行の更新','#217346')}
 ${[20,50,80].map(y=>`<path d="M118 ${y}h40" stroke="#16A34A" stroke-width="3"/><path d="M154 ${y-6}l8 6-8 6" fill="none" stroke="#16A34A" stroke-width="3"/>`).join('')}
 ${card(170,8,'項目の作成','#038387',124)}${card(170,38,'複数の項目の取得','#038387',124)}${card(170,68,'項目の更新','#038387',124)}</svg>`;
const sc3=`<svg viewBox="0 0 385 100" preserveAspectRatio="xMidYMid slice">
 <g transform="translate(14,14)"><circle cx="34" cy="36" r="32" fill="#fff" stroke="#9CA3AF" stroke-width="3"/><path d="M34 14v22l14 9" stroke="#9CA3AF" stroke-width="4" fill="none" stroke-linecap="round"/><text x="2" y="84" font-size="11" font-weight="900" fill="#6B7280">毎朝 全件を読む</text></g>
 <path d="M100 50h44" stroke="#16A34A" stroke-width="4" stroke-dasharray="7 5"/><path d="M140 40l12 10-12 10" fill="none" stroke="#16A34A" stroke-width="4"/>
 <g transform="translate(162,20)"><rect x="4" y="4" width="70" height="56" rx="6" fill="#000" opacity=".10"/><rect width="70" height="56" rx="6" fill="#fff" stroke="#038387" stroke-width="2"/><rect x="6" y="36" width="58" height="14" rx="3" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/><text x="12" y="47" font-size="10" font-weight="900" fill="#065F46">＋ 1件</text>
 <path d="M90 6l-9 18h9l-5 16 14-21h-9l5-13z" fill="#FACC15" stroke="#B45309" stroke-width="1.3"/></g>
 <text x="160" y="94" font-size="11" font-weight="900" fill="#065F46">増えた1件だけで動く</text></svg>`;
const sc3c=1;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.186-4</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">Excel 台帳をリストへ移すときは、<br><span class="hl">フローの3か所</span>を差し替える</div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">流れ（何を読んで、誰に送るか）はそのまま使えます。<br>変えるのは<b>置き場所・Excel のアクション・動き出すきっかけ</b>の3つです</div>
  </div>
  <div class="stage">
    <div class="col info">
      <div class="ch2"><span class="n">1</span>リストを作り、<br>列を台帳とそろえる</div>
      <div class="scene">${sc1}</div>
      <div class="card">
        <div class="cardh">${MS('lists.svg',28)}備品貸出 の列<span class="repro">再現</span></div>
        <div class="cardb">
          <div class="row"><span class="k">備品</span><span class="ty">1 行テキスト</span></div>
          <div class="row"><span class="k">借りた人</span><span class="ty">ユーザー</span></div>
          <div class="row"><span class="k">状態</span><span class="ty">選択肢</span>貸出中／返却済み</div>
          <div class="row"><span class="k">返却期限</span><span class="ty">日付と時刻</span></div>
        </div>
      </div>
      <div class="cap">ID は自動で振られるので、<br>キー列を自分で作る必要はありません</div>
    </div>
    <div class="col info">
      <div class="ch2"><span class="n">2</span>Excel のアクションを<br>リストのものに替える</div>
      <div class="scene">${sc2}</div>
      <div class="card">
        <div class="cardh">${PA(26)}差し替える3つ<span class="repro">再現</span></div>
        <div class="cardb">
          <div class="sw"><div class="o">${MS('excel.svg',22)}表に行を追加</div><div class="n">${MS('sharepoint.svg',22)}項目の作成</div></div>
          <div class="sw"><div class="o">${MS('excel.svg',22)}表内に存在する行を一覧表示</div><div class="n">${MS('sharepoint.svg',22)}複数の項目の取得</div></div>
          <div class="sw"><div class="o">${MS('excel.svg',22)}行の更新</div><div class="n">${MS('sharepoint.svg',22)}項目の更新（ID を指定）</div></div>
        </div>
      </div>
      <div class="cap">後ろのアクションの動的コンテンツは、<br>新しいアクションの出力から<b>選び直す</b></div>
    </div>
    <div class="col good">
      <div class="ch2"><span class="n">3</span>動き出すきっかけを<br>1件ごとにする</div>
      <div class="scene">${sc3}${CH('confident',100)}</div>
      <div class="card">
        <div class="cardh">${MS('sharepoint.svg',28)}トリガー<span class="repro">再現</span></div>
        <div class="cardb" style="padding:4px 9px;gap:2px;">
          <div class="tc old"><div class="t">${PA(22)}繰り返し<span style="font-size:15px;font-weight:700;color:#6B7280">　毎日 9:00 に全件</span></div></div>
          <div class="vs">↓ 置き換える</div>
          <div class="tc"><div class="t">${MS('sharepoint.svg',22)}項目が作成されたとき</div>
            <div class="f">サイトのアドレス<span class="in">備品管理</span></div>
            <div class="f">リスト名<span class="in">備品貸出</span></div></div>
        </div>
      </div>
      <div class="cap">返却期限のチェックのように毎朝見る仕事は<br>「繰り返し」のまま、読む先だけ替えます</div>
    </div>
  </div>
  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <div class="ws"><span>使う前に確認</span><span>移す前に Excel の台帳を別名で残しておく</span><span>リストの「複数の項目の取得」は既定100件。上位カウントを入れる</span></div>
  </div>
  <div class="src">出典：Microsoft Learn「SharePoint コネクタ」「Excel Online (Business) コネクタ」「アイテムの取得とファイルの取得の操作」／アクション名は Power Automate の日本語画面の表記／画面は説明用の再現</div>
`;
</script>
</body>
</html>
