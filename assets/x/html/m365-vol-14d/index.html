<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.14-4 覚えておいてと見直し方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  .stage{gap:10px;}
  .thread{flex:0 0 640px;display:flex;flex-direction:column;gap:6px;}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--mc-line);border-radius:10px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .win .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;color:#242424;}
  .win .wh .dt{font-family:"Noto Sans JP",sans-serif;font-size:14.5px;font-weight:900;color:#fff;background:var(--mc-dark);border-radius:999px;padding:1px 10px;}
  .win .wb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:5px;padding:6px 10px;}
  .mg{display:flex;gap:9px;align-items:flex-start;}
  .mg .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;background:#2563EB;}
  .mg.bot .av{background:#fff;border:1.5px solid #CDEDE7;}
  .mg .bb{flex:1;background:#F4F6FA;border-radius:10px;padding:5px 10px;}
  .mg .tx{font-size:16px;font-weight:700;color:#1B2A44;line-height:1.38;}
  .mg .tx b{color:#B91C1C;}
  .mg.bot .bb{background:var(--mc-bg);border:1.5px solid var(--mc-line);}
  .notice{align-self:center;display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:900;color:#065F46;background:#D1FAE5;border:1.5px solid #6EE7B7;border-radius:999px;padding:2px 14px;}
  .notice svg{width:20px;height:20px;color:#16A34A;}
  .sec{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;}
  .sec span{font-size:15.5px;font-weight:900;border-radius:6px;padding:1px 9px;color:#fff;}
  .gap{flex:0 0 34px;position:relative;display:flex;align-items:center;justify-content:center;}
  .gap svg{position:absolute;inset:0;width:100%;height:100%;}
  .gap .gt{position:relative;z-index:2;font-size:16px;font-weight:900;color:var(--mc-dark);background:#fff;border:2px solid var(--mc-line);border-radius:999px;padding:1px 14px;}
  .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:8px 10px 9px;background:var(--mc-bg);border:2.5px solid var(--mc-line);position:relative;}
  .side .sh{flex:0 0 auto;font-size:22px;font-weight:900;color:var(--mc-dark);}
  .mem{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--mc);border-radius:10px;overflow:hidden;font-family:"Segoe UI","Noto Sans JP",sans-serif;color:#242424;}
  .mem .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;}
  .mem .path{flex:0 0 auto;font-family:"Noto Sans JP",sans-serif;font-size:15px;font-weight:900;color:#134E4A;background:#E6F6F3;padding:3px 10px;border-bottom:1px solid #CDEDE7;line-height:1.3;}
  .mem .rows{flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 10px;}
  .mr{flex:1;min-height:0;display:flex;align-items:center;gap:8px;border-bottom:1.2px dashed #E5E7EB;font-size:15.5px;font-weight:700;color:#1B2A44;line-height:1.28;}
  .mr:last-child{border-bottom:none;}
  .mr .t{flex:1;min-width:0;}
  .mr.old .t{color:#9CA3AF;text-decoration:line-through;}
  .mr .del{flex:0 0 auto;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#6B7280;border:1.5px solid #D1D1D1;}
  .mr.old .del{color:#fff;background:#DC2626;border-color:#DC2626;}
  .mr .del svg{width:18px;height:18px;}
  .mem .fr{flex:0 0 auto;display:flex;justify-content:flex-end;padding:4px 10px 6px;}
  .mem .fr span{font-size:15.5px;font-weight:700;color:#B91C1C;border:1.5px solid #F0AEAE;border-radius:6px;padding:2px 12px;background:#fff;}
  .facts{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding-right:96px;}
  .fact{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--mc-line);border-radius:10px;padding:3px 9px;font-size:15.5px;font-weight:900;color:#1B2A44;line-height:1.3;}
  .fact .fg{flex:0 0 44px;height:34px;}
  .fact .fg svg{width:44px;height:34px;display:block;}
  .fact b{color:var(--orange);}
  .side .chara{position:absolute;right:2px;bottom:0;height:116px;z-index:3;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}
  .warnbar .ws{font-size:15.5px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={ok:'<path d="M5 12l5 5 9-10"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
// ミニ図解：チャットを消してもメモは残る／スイッチを切っても残る
const FG1=`<svg viewBox="0 0 44 34" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="6" width="20" height="16" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/><path d="M5 9l14 10M19 9L5 19" stroke="#DC2626" stroke-width="2.400" stroke-linecap="round"/><rect x="24" y="4" width="18" height="24" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.600"/><rect x="27" y="9" width="12" height="3" rx="1.500" fill="#0F766E"/><rect x="27" y="15" width="10" height="3" rx="1.500" fill="#0F766E"/><rect x="27" y="21" width="12" height="3" rx="1.500" fill="#0F766E"/></svg>`;
const FG2=`<svg viewBox="0 0 44 34" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="10" width="22" height="13" rx="6.500" fill="#CBD5E1"/><circle cx="8" cy="16.500" r="5" fill="#fff"/><rect x="24" y="4" width="18" height="24" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.600"/><rect x="27" y="9" width="12" height="3" rx="1.500" fill="#0F766E"/><rect x="27" y="15" width="10" height="3" rx="1.500" fill="#0F766E"/><rect x="27" y="21" width="12" height="3" rx="1.500" fill="#0F766E"/></svg>`;
// 2つの会話のあいだ：日をまたぐ点線
const GAP=`<svg viewBox="0 0 640 34" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 17H620" stroke="#7DD3C4" stroke-width="2.500" stroke-dasharray="7 6"/></svg>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.14-4</div><div class="lic-pill free">無料の Copilot Chat でできる</div></div>
    <div class="title-text">会話の中で<span class="hl">覚えておいて</span>と頼み、<br>覚えた中身は設定で見直す</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">入力欄で覚えておいてと頼むと<b>「保存済みメモリ」</b>に入り、「メモリが更新」の通知が出ます。<br>見直しと削除は<b>「個人用設定」→「保存されたメモリの管理」</b></div>
  </div>
  <div class="stage">
    <div class="thread">
      <div class="win">
        <div class="wh">${CPI(22)}Copilot Chat<span class="dt">11/19（木）</span><span class="repro">画面は説明用の再現</span></div>
        <div class="wb">
          <div class="mg"><span class="av">自</span><div class="bb"><div class="tx">会議メモは<b>決まったこと・宿題・期限</b>の3つに分けて書く、と<b>覚えておいて</b></div></div></div>
          <div class="notice">${svgw(P.ok,3)}メモリが更新</div>
          <div class="mg bot"><span class="av">${CPI(26)}</span><div class="bb"><div class="tx">会議メモはこの3つに分けて書きます</div></div></div>
        </div>
      </div>
      <div class="gap">${GAP}<span class="gt">5日後・別の会話</span></div>
      <div class="win">
        <div class="wh">${CPI(22)}Copilot Chat<span class="dt">11/24（火）</span><span class="repro">画面は説明用の再現</span></div>
        <div class="wb">
          <div class="mg"><span class="av">自</span><div class="bb"><div class="tx">今日の定例のメモを整えて</div></div></div>
          <div class="mg bot"><span class="av">${CPI(26)}</span><div class="bb"><div class="tx">定例（11/24）のメモです<div class="sec"><span style="background:#0F766E">決まったこと</span><span style="background:#EA580C">宿題</span><span style="background:#2563EB">期限</span></div></div></div></div>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="sh">見直しと消し方</div>
      <div class="mem">
        <div class="wh">${CPI(22)}保存されたメモリ<span class="repro">画面は説明用の再現</span></div>
        <div class="path">右上の「…」→「Chat 設定」→「個人用設定」<br>→「保存されたメモリの管理」</div>
        <div class="rows">
          <div class="mr"><span class="t">会議メモは決まったこと・宿題・期限の3つに分ける</span><span class="del">${svgw(P.trash,2.2)}</span></div>
          <div class="mr"><span class="t">報告には PowerPoint より Excel を使う</span><span class="del">${svgw(P.trash,2.2)}</span></div>
          <div class="mr old"><span class="t">4月から新人研修の担当（もう終わった）</span><span class="del">${svgw(P.trash,2.2)}</span></div>
        </div>
        <div class="fr"><span>すべてのメモリを削除</span></div>
      </div>
      <div class="facts">
        <div class="fact"><span class="fg">${FG1}</span><span>チャットを消しても、<b>メモリは残る</b></span></div>
        <div class="fact"><span class="fg">${FG2}</span><span>スイッチを切っても、<b>中身は残る</b></span></div>
      </div>
      <img class="chara" src="${A}chara/chara_point.png" alt="">
    </div>
  </div>
  <div class="warnbar">
    <span class="wl">使う前に確認</span>
    <div class="ws"><span>部署や担当が変わったら、古いメモリとカスタム指示を消す</span><span>管理者がオフにしている組織では使えない（プレビュー中の機能）</span></div>
  </div>
  <div class="src">出典：Microsoft サポート「Microsoft Copilot で Copilot メモリを管理する」／Microsoft Learn「Copilot の個人用設定とメモリを管理する」／会話は作例・画面は説明用の再現（実画面は未確認）</div>
`;
</script>
</body>
</html>
