<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.130-2 督促メールの下書きの作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:5px;padding:7px 9px;}
  .cardh{font-size:15px;}
  .col.am{background:#FFFBEB;border:2.5px solid #FCD34D;}
  .col.am .ch2{color:#92400E;}
  .col.am .ch2 .n{background:linear-gradient(180deg,#FBBF24,#D97706);}
  .col.am .card{border-color:#FCD34D;}
  .col.am .cardh{background:#FEF3C7;border-bottom-color:#FDE68A;color:#92400E;}
  .col.am .cap{background:#FDE68A;color:#78350F;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fi{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:3px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.3;}
  .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .fi .k{font-size:14px;color:#475569;}
  .fi.code{font-family:'Roboto Mono',monospace;color:#1E40AF;}
  .cl{display:flex;align-items:center;gap:8px;background:#F7F9FC;border:1.5px solid #E2EAF5;border-radius:7px;padding:3px 9px;font-size:15.5px;font-weight:900;color:var(--navy);}
  .cl .ty{margin-left:auto;font-size:13.5px;color:#475569;background:#fff;border:1.4px solid #C7D6EE;border-radius:5px;padding:0 7px;}
  .cl.hot{background:#FFF7ED;border-color:#FDBA74;}
  .cl .in{font-family:'Roboto Mono',monospace;font-size:13.5px;color:#9A3412;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.3;}
  .tpl{background:#fff;border:2px solid #B9C7DC;border-radius:8px;padding:5px 9px;font-size:15px;font-weight:700;color:var(--navy);line-height:1.42;}
  .tpl .k{display:block;font-size:14px;font-weight:900;color:#475569;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SH=(id,c)=>`<filter id="${id}" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="${c||'#1B2A44'}" flood-opacity=".22"/></filter>`;

/* ① 台帳の列 */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f')}</defs><rect width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#f)"><rect x="14" y="10" width="360" height="80" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2"/>
    <rect x="14" y="10" width="360" height="20" rx="8" fill="#036C70"/><rect x="14" y="22" width="360" height="8" fill="#036C70"/>
    ${[['取引先',24],['請求額',130],['支払期限',200],['状態',280],['メール',326]].map(([t,x])=>`<text x="${x}" y="24.5" font-family="Noto Sans JP" font-size="11.5" font-weight="900" fill="#fff">${t}</text>`).join('')}
    ${[0,1,2].map(i=>`<rect x="24" y="${38+i*17}" width="90" height="6" rx="3" fill="#CBD5E1"/><rect x="130" y="${38+i*17}" width="50" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="200" y="${38+i*17}" width="50" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="276" y="${35+i*17}" width="40" height="12" rx="4" fill="${i==1?'#DC2626':'#DCFCE7'}"/>
      <rect x="326" y="${38+i*17}" width="40" height="6" rx="3" fill="#CBD5E1"/>`).join('')}</g>
</svg>`;

/* ② 毎朝9時、期限切れ×未入金だけ */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f','#78350F')}</defs><rect width="388" height="100" fill="#FEF3C7"/>
  ${[0,1,2,3,4,5].map(i=>{const red=(i==1||i==3);return `<g filter="url(#f)"><rect x="${14+(i%3)*44}" y="${14+Math.floor(i/3)*40}" width="36" height="30" rx="5" fill="${red?'#FEE2E2':'#fff'}" stroke="${red?'#DC2626':'#CBD5E1'}" stroke-width="2"/>
    <rect x="${20+(i%3)*44}" y="${22+Math.floor(i/3)*40}" width="24" height="4" rx="2" fill="${red?'#F87171':'#E2E8F0'}"/></g>`}).join('')}
  <g filter="url(#f)"><path d="M150 18 h70 l-24 32 v26 l-22 -8 v-18 z" fill="#fff" stroke="#D97706" stroke-width="2.4"/></g>
  <path d="M232 50 H 258" stroke="#D97706" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M252 44 l8 6 l-8 6" fill="none" stroke="#D97706" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  ${[0,1].map(i=>`<g filter="url(#f)"><rect x="272" y="${18+i*36}" width="104" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="324" y="${37+i*36}" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#991B1B" text-anchor="middle">未入金 ${['鈴木運輸','高橋工業'][i]}</text></g>`).join('')}
</svg>`;

/* ③ 下書きフォルダーに並ぶ */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f','#0B5136')}</defs><rect width="388" height="100" fill="#DCF3E7"/>
  ${[0,1].map(i=>`<g filter="url(#f)"><rect x="${20+i*22}" y="${16+i*14}" width="100" height="62" rx="5" fill="#fff" stroke="#0F6CBD" stroke-width="2"/>
    <path d="M${20+i*22} ${20+i*14} L${70+i*22} ${50+i*14} L${120+i*22} ${20+i*14}" fill="none" stroke="#0F6CBD" stroke-width="2"/></g>`).join('')}
  <path d="M176 50 H 204" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M198 44 l8 6 l-8 6" fill="none" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#f)"><rect x="216" y="14" width="160" height="72" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    <text x="296" y="38" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#065F46" text-anchor="middle">下書きフォルダー</text>
    <text x="296" y="60" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#334155" text-anchor="middle">見て、直して、送る</text>
    <text x="296" y="78" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#64748B" text-anchor="middle">（自動では送らない）</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.130-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（台帳 → 期限切れだけ拾う → 下書きにする）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">送信ではなく<b>「メール メッセージを下書きする」</b>を使うのがコツ。<br>入金と行き違うこともあるので、最後のひと押しは担当が決めます</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>入金台帳を用意する</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_sharepoint.png" alt="">SharePoint リスト「入金台帳」</div>
        <div class="cardb">
          <div class="cl">取引先<span class="ty">1行テキスト</span></div>
          <div class="cl">請求額<span class="ty">数値</span></div>
          <div class="cl hot">支払期限 <span class="in">DueDate</span><span class="ty">日付のみ</span></div>
          <div class="cl hot">状態 <span class="in">Status</span><span class="ty">選択肢</span></div>
          <div class="cl">経理担当のメール<span class="ty">1行テキスト</span></div>
        </div>
      </div></div>
      <div class="cap">入金を確認したら、状態を<b>入金済み</b>にする</div>
    </div>

    <div class="col am">
      <div class="ch2"><span class="n">2</span>期限切れだけ拾う</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_schedule.png" alt="">繰り返し　平日 9時（大阪、札幌、東京）</div>
        <div class="cardb">
          <div class="fld"><span class="fl">複数の項目の取得 ＞ フィルター クエリ</span>
            <span class="fi code hot">Status eq '未入金'<br>and DueDate lt '<span class="dyn">今日</span>'</span></div>
          <div class="fld"><span class="fl">「今日」は「作成」アクションでこの式</span>
            <span class="fi code">formatDateTime(convertFromUtc(<br>utcNow(),'Tokyo Standard Time'),<br>'yyyy-MM-dd')</span></div>
        </div>
      </div></div>
      <div class="cap">期限<b>当日</b>は含めない（lt＝より前）</div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>相手ごとに下書き</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_outlook.png" alt="">メール メッセージを下書きする</div>
        <div class="cardb">
          <div class="fi"><span class="k">宛先</span><span class="dyn">経理担当のメール</span></div>
          <div class="fi"><span class="k">件名</span>【ご確認のお願い】<span class="dyn">請求額</span>円のお支払い</div>
          <div class="tpl"><span class="k">本文（ひな形）</span><span class="dyn">支払期限</span>がお支払期限のご請求について、本日時点で入金の確認ができておりません。行き違いの際はご容赦ください。</div>
        </div>
      </div></div>
      <div class="cap">取れた行の数だけ、<b>自動でくり返して</b>作られる</div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>すべて標準コネクタ（追加料金なし）</span><span>台帳の状態が古いと、払った相手にも下書きができる</span>
      <span>毎朝作られるので、送ったら状態を「督促済み」に</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Office 365 Outlook コネクタ」「SharePoint コネクタ」「繰り返しトリガー」「式関数のリファレンス」／名称は架空</div>
`;
</script>
</body>
</html>
