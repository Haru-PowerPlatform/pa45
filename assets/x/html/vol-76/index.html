<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.76-1 全部取ってから選ぶのをやめる（フィルタークエリ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C; --spo:#0F6CBD; --spo-dark:#0A4F8A;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.36;padding-right:100px;}
  .concl .txt b{color:var(--orange);}

  .cols{flex:1 1 auto;margin:11px 16px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;min-height:0;}
  .col{display:flex;flex-direction:column;min-height:0;gap:7px;}
  .ch{font-weight:900;font-size:21px;color:var(--ink);display:flex;align-items:flex-start;gap:9px;line-height:1.2;letter-spacing:-.01em;}
  .ch .n{flex:0 0 auto;width:31px;height:31px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .cap{font-size:14.5px;font-weight:800;color:var(--gray);line-height:1.45;background:#F8F9FA;border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:7px 10px;}
  .cap b{color:var(--blue-dark);}
  .col.rel .cap{padding-right:76px;}

  .mock{flex:1;background:#fff;border:1px solid #D7DEE8;border-radius:11px;box-shadow:0 5px 13px rgba(0,0,0,.14);overflow:hidden;font-family:'Segoe UI','Noto Sans JP',sans-serif;display:flex;flex-direction:column;min-height:0;}
  .mh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 11px;background:#F3F6FB;border-bottom:1px solid #E3E9F1;}
  .mh img{width:18px;height:18px;object-fit:contain;}
  .mh span{font-weight:800;font-size:13.5px;color:#243B58;}
  .mb{flex:1;padding:10px 11px;display:flex;flex-direction:column;gap:8px;min-height:0;}

  /* ①URLバー */
  .urlbar{background:#F1F5F9;border:1.5px solid #CBD5E1;border-radius:8px;padding:7px 9px;font-family:'Roboto Mono',monospace;font-size:12px;color:#475569;word-break:break-all;line-height:1.45;}
  .urlbar b{background:#FEF08A;color:#854D0E;border-radius:3px;padding:1px 3px;}
  .kv{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:800;}
  .kv .k{flex:0 0 68px;color:var(--weak);}
  .kv .v{flex:1;font-family:'Roboto Mono',monospace;color:#0B3A8F;background:#EFF6FF;border-radius:6px;padding:4px 7px;font-size:13px;word-break:break-all;}
  .warnmini{font-size:13px;font-weight:800;color:#9A3412;background:#FFF7ED;border:1px solid #FDBA74;border-radius:7px;padding:6px 8px;line-height:1.4;}

  /* ②フィルター入力 */
  .fld{border:1px solid #DCE3EC;border-radius:8px;overflow:hidden;}
  .fld .fl{font-size:12px;font-weight:800;color:#64748B;background:#F8FAFC;padding:4px 8px;border-bottom:1px solid #E8EDF3;}
  .fld .fi{font-size:13.5px;font-weight:700;color:#243B58;padding:7px 9px;}
  .fld.hot{border:2px solid var(--blue);box-shadow:0 2px 7px rgba(37,99,235,.2);}
  .fld.hot .fi{font-family:'Roboto Mono',monospace;font-size:13px;color:#0B3A8F;word-break:break-all;line-height:1.45;}

  /* ③結果 */
  .cnt{display:flex;align-items:center;gap:9px;}
  .cnt .big{font-weight:900;font-size:29px;line-height:1;}
  .cnt .lb{font-size:13px;font-weight:800;color:var(--weak);line-height:1.25;}
  .cnt.ng .big{color:var(--red);} .cnt.ok .big{color:var(--green);}
  .arrowdown{align-self:center;width:26px;height:26px;color:var(--blue);}
  .rows{flex:1;display:flex;flex-direction:column;border:1px solid #E8EDF3;border-radius:8px;overflow:hidden;min-height:0;}
  .rw{flex:1;display:flex;align-items:center;gap:7px;padding:0 9px;font-size:13px;font-weight:700;color:#243B58;border-bottom:1px solid #F1F4F8;min-height:0;}
  .rw:last-child{border-bottom:none;}
  .rw .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--green);}
  .rw .dt{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:12px;color:var(--weak);}

  .cmascot{position:absolute;right:2px;bottom:0;height:84px;z-index:30;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));}
  .col.rel{position:relative;}

  .next{flex:0 0 auto;margin:10px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:12px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.76-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">全部取ってから選ぶのをやめる｜<span class="hl">SharePointは“絞ってから”取る</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">「複数の項目の取得」は<b>既定で100件</b>しか返しません。ループの中で選り分けるより、<b>フィルター クエリ</b>で最初から絞るほうが速くて安全です。</div>
  </div>

  <div class="cols">
    <div class="col">
      <div class="ch"><span class="n">1</span>列の“内部名”を調べる</div>
      <div class="mock">
        <div class="mh"><img src="${A}icons/pa_sharepoint.png" alt=""><span>リストの設定 － 列</span></div>
        <div class="mb">
          <div class="urlbar">…/FldEdit.aspx?List={…}&amp;<b>Field=Start_x0020_Date</b></div>
          <div class="kv"><span class="k">表示名</span><span class="v">開始 日付</span></div>
          <div class="kv"><span class="k">内部名</span><span class="v">Start_x0020_Date</span></div>
          <div class="warnmini">⚠ 画面の表示名では動きません。スペースは <b>_x0020_</b> に化けます。</div>
          <div class="kv"><span class="k">日本語名</span><span class="v">_x65e5__x4ed8_</span></div>
          <div class="warnmini" style="background:#EFF6FF;border-color:#93C5FD;color:#1E40AF;">💡 日本語で作った列は記号の羅列になります。<b>あとから列名を英語に変えても内部名は変わりません</b>。作るときに英語にしておくと楽です。</div>
        </div>
      </div>
      <div class="cap">列名をクリックし、<b>URLの「Field=」の後ろ</b>を見ます。これがクエリに書く名前です。</div>
    </div>

    <div class="col">
      <div class="ch"><span class="n">2</span>フィルター クエリに書く</div>
      <div class="mock">
        <div class="mh"><img src="${A}icons/pa_sharepoint.png" alt=""><span>複数の項目の取得 － 詳細設定</span></div>
        <div class="mb">
          <div class="fld"><div class="fl">サイトのアドレス</div><div class="fi">営業部サイト</div></div>
          <div class="fld"><div class="fl">リスト名</div><div class="fi">案件管理</div></div>
          <div class="fld hot"><div class="fl">フィルター クエリ</div><div class="fi">Status eq '未完了' and Start_x0020_Date le '@{utcNow()}'</div></div>
          <div class="fld"><div class="fl">上位カウント</div><div class="fi">100</div></div>
        </div>
      </div>
      <div class="cap"><b>列名 演算子 値</b> の順で書くだけ。文字列は<b>シングルクォート</b>で囲みます。</div>
    </div>

    <div class="col rel">
      <div class="ch"><span class="n">3</span>必要な分だけ返ってくる</div>
      <div class="mock">
        <div class="mh"><img src="${A}icons/pa_logo.png" alt=""><span>実行結果</span></div>
        <div class="mb">
          <div class="cnt ng"><span class="big">100</span><span class="lb">件ぜんぶ取ってから<br>ループで選り分け</span></div>
          <span class="arrowdown">${svg('down')}</span>
          <div class="cnt ok"><span class="big">12</span><span class="lb">件だけ返ってくる</span></div>
          <div class="rows">
            <div class="rw"><span class="dot"></span>A社 見積提出<span class="dt">07/24</span></div>
            <div class="rw"><span class="dot"></span>B社 訪問<span class="dt">07/25</span></div>
            <div class="rw"><span class="dot"></span>C社 契約更新<span class="dt">07/28</span></div>
          </div>
        </div>
      </div>
      <div class="cap">ループの回数が減るので<b>速くなり、実行回数の節約</b>にもなります。</div>
      <img class="cmascot" src="${A}chara/chara_guts.png" alt="">
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>等しい・含む・日付・並べ替え…<b>そのまま使えるクエリ文</b>と<b>5000件の壁</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（アイテムの取得とファイルの取得アクションの詳細な分析）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
