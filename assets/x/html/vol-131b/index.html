<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.131-2 締切リマインドの作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:5px;padding:7px 9px;}
  .cardh{font-size:15px;}
  .col.am{background:#FFFBEB;border:2.5px solid #FCD34D;}
  .col.am .ch2{color:#92400E;}
  .col.am .ch2 .n{background:linear-gradient(180deg,#FBBF24,#D97706);}
  .col.am .card{border-color:#FCD34D;}
  .col.am .cardh{background:#FEF3C7;border-bottom-color:#FDE68A;color:#92400E;}
  .col.am .cap{background:#FDE68A;color:#78350F;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fi{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:3px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.32;}
  .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .fi .k{font-size:14px;color:#475569;}
  .fi.code{font-family:'Roboto Mono',monospace;color:#1E40AF;}
  .cl{display:flex;align-items:center;gap:8px;background:#F7F9FC;border:1.5px solid #E2EAF5;border-radius:7px;padding:3px 9px;font-size:15.5px;font-weight:900;color:var(--navy);}
  .cl .ty{margin-left:auto;font-size:13.5px;color:#475569;background:#fff;border:1.4px solid #C7D6EE;border-radius:5px;padding:0 7px;}
  .cl.hot{background:#FFF7ED;border-color:#FDBA74;}
  .cl .in{font-family:'Roboto Mono',monospace;font-size:13.5px;color:#9A3412;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.3;}
  .sub{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900;color:#334155;}
  .sub img{width:24px;height:24px;object-fit:contain;flex:0 0 auto;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SH=(id,c)=>`<filter id="${id}" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="${c||'#1B2A44'}" flood-opacity=".22"/></filter>`;

/* ① 年に1回、締切を並べる */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f')}</defs><rect width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#f)"><rect x="16" y="8" width="356" height="84" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2"/>
    <rect x="16" y="8" width="356" height="20" rx="8" fill="#036C70"/><rect x="16" y="20" width="356" height="8" fill="#036C70"/>
    <text x="28" y="22.5" font-family="Noto Sans JP" font-size="11.5" font-weight="900" fill="#fff">対象</text>
    <text x="150" y="22.5" font-family="Noto Sans JP" font-size="11.5" font-weight="900" fill="#fff">締切日時</text>
    ${[['10月分','2026/11/25 17:00'],['11月分','2026/12/23 17:00'],['12月分','2027/01/25 17:00']].map(([a,b],i)=>
      `<text x="28" y="${44+i*18}" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#334155">${a}</text>
       <text x="150" y="${44+i*18}" font-family="Roboto Mono" font-size="12.5" font-weight="700" fill="#334155">${b}</text>`).join('')}</g>
</svg>`;

/* ② 毎朝：今日＋7日／今日＋1日 と一致する行を探す */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f','#78350F')}</defs><rect width="388" height="100" fill="#FEF3C7"/>
  <g filter="url(#f)"><rect x="14" y="22" width="80" height="56" rx="9" fill="#fff" stroke="#D97706" stroke-width="2.4"/>
    <text x="54" y="44" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#92400E" text-anchor="middle">今日</text>
    <text x="54" y="66" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">11/18</text></g>
  <path d="M100 40 C 130 18, 160 16, 196 20" stroke="#D97706" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M100 60 C 130 82, 160 84, 196 80" stroke="#94A3B8" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <text x="148" y="14" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#B45309" text-anchor="middle">＋7日</text>
  <text x="148" y="96" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#64748B" text-anchor="middle">＋1日</text>
  <g filter="url(#f)"><rect x="200" y="4" width="178" height="34" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    <text x="212" y="26" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#065F46">11/25 締切あり → 送る</text></g>
  <g filter="url(#f)"><rect x="200" y="62" width="178" height="34" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.4"/>
    <text x="212" y="84" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#64748B">11/19 なし → 何もしない</text></g>
</svg>`;

/* ③ 全社チャネルへ */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f','#0B5136')}<linearGradient id="tm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B83EB"/><stop offset="1" stop-color="#4B53BC"/></linearGradient></defs>
  <rect width="388" height="100" fill="#DCF3E7"/>
  <g filter="url(#f)"><rect x="16" y="18" width="170" height="64" rx="9" fill="#fff" stroke="#5B5FC7" stroke-width="2.2"/>
    <rect x="26" y="28" width="26" height="26" rx="7" fill="url(#tm)"/><text x="39" y="46" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">T</text>
    <text x="62" y="44" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#4B53BC">全社 ＞ お知らせ</text>
    <rect x="62" y="56" width="110" height="6" rx="3" fill="#D8C9FA"/><rect x="62" y="68" width="80" height="6" rx="3" fill="#D8C9FA"/></g>
  <path d="M196 50 H 222" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M216 44 l8 6 l-8 6" fill="none" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  ${[0,1,2,3,4,5,6,7].map(i=>`<g transform="translate(${236+(i%4)*36},${16+Math.floor(i/4)*40})"><circle cx="12" cy="9" r="8" fill="#34D399"/><path d="M0 34 q12 -20 24 0 z" fill="#34D399"/></g>`).join('')}
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.131-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（締切リスト → 毎朝照らす → チャネルに投稿）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">フローは毎朝動き、<b>「7日後」か「明日」が締切日の行</b>があるときだけ投稿します。<br>締切が月ごとにずれても、リストの日付を直すだけで追いつきます</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>締切リストを作る</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_sharepoint.png" alt="">SharePoint リスト「経費精算の締切」</div>
        <div class="cardb">
          <div class="cl">対象（10月分 など）<span class="ty">1行テキスト</span></div>
          <div class="cl hot">締切日 <span class="in">Deadline</span><span class="ty">日付のみ</span></div>
          <div class="cl">締切時刻（17:00）<span class="ty">1行テキスト</span></div>
          <div class="note">年末に1年分をまとめて入れておく</div>
        </div>
      </div></div>
      <div class="cap">祝日や年末年始は、<b>人が日付を決めて</b>入れる</div>
    </div>

    <div class="col am">
      <div class="ch2"><span class="n">2</span>毎朝、締切を照らし合わせる</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_schedule.png" alt="">繰り返し　毎日 8:30（大阪、札幌、東京）</div>
        <div class="cardb">
          <div class="sub"><img src="${A}icons/pa_sharepoint.png" alt="">複数の項目の取得 ＞ フィルター クエリ</div>
          <div class="fi code hot" style="display:block;white-space:nowrap">Deadline eq '<span class="dyn">7日後</span>'<br>or Deadline eq '<span class="dyn">明日</span>'</div>
          <div class="fld"><span class="fl">7日後の式（明日は7を1に）</span>
            <span class="fi code" style="display:block;white-space:nowrap">addDays(convertFromUtc(utcNow(),<br>'Tokyo Standard Time'),<br>7,'yyyy-MM-dd')</span></div>
        </div>
      </div></div>
      <div class="cap">行が0件の日は、<b>何も投稿されない</b></div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>全社のチャネルに投稿</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_teams.png" alt="">チャットまたはチャネルで<br>メッセージを投稿する</div>
        <div class="cardb">
          <div class="fi"><span class="k">投稿者</span>フロー ボット</div>
          <div class="fi"><span class="k">投稿先</span>チャネル（全社 ＞ お知らせ）</div>
          <div class="fi hot"><span class="k">メッセージ</span><span class="dyn">対象</span>の締切は<span class="dyn">締切日</span><span class="dyn">締切時刻</span>です</div>
          <div class="note">明日の分は、見出しを「明日です」に変える</div>
        </div>
      </div></div>
      <div class="cap">メールで送るなら<b>メールの送信 (V2)</b>に差し替え</div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>すべて標準コネクタ（追加料金なし）</span><span>utcNow()はUTC。日本時間に直してから足す</span>
      <span>リストが空になる前に、翌年分を入れる</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「繰り返しトリガー」「SharePoint コネクタ」「Microsoft Teams コネクタ」「式関数のリファレンス」／名称は架空</div>
`;
</script>
</body>
</html>
