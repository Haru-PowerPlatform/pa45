<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>html,body{margin:0;padding:0;background:transparent;}#i{display:block;}</style>
</head><body>
<svg id="i" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- front (bottom-left): lime-green(top-left) -> teal -> blue(bottom) -->
    <linearGradient id="gFront" x1="110" y1="232" x2="250" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ADEE6B"/>
      <stop offset=".34" stop-color="#46D2D6"/>
      <stop offset=".68" stop-color="#39A6F1"/>
      <stop offset="1" stop-color="#3E82F5"/>
    </linearGradient>
    <!-- middle: cream-peach -> orange -->
    <linearGradient id="gMid" x1="168" y1="158" x2="346" y2="346" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE0B0"/>
      <stop offset=".5" stop-color="#F8B26A"/>
      <stop offset="1" stop-color="#F0903C"/>
    </linearGradient>
    <!-- back (top-right): pink -> purple -> blue -->
    <linearGradient id="gBack" x1="232" y1="92" x2="430" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F75FC5"/>
      <stop offset=".5" stop-color="#AF42E8"/>
      <stop offset="1" stop-color="#5E55E6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".60"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#9aa3b0" flood-opacity=".30"/>
    </filter>
  </defs>

  <!-- back card (top-right) -->
  <g filter="url(#sh)">
    <rect x="232" y="86" width="208" height="208" rx="60" fill="url(#gBack)" opacity=".96"/>
    <rect x="232" y="86" width="208" height="208" rx="60" fill="url(#gloss)"/>
    <rect x="233" y="87" width="206" height="206" rx="59" fill="none" stroke="#ffffff" stroke-opacity=".30" stroke-width="1.6"/>
  </g>
  <!-- middle card -->
  <g filter="url(#sh)">
    <rect x="160" y="152" width="200" height="200" rx="58" fill="url(#gMid)" opacity=".82"/>
    <rect x="160" y="152" width="200" height="200" rx="58" fill="url(#gloss)"/>
    <rect x="161" y="153" width="198" height="198" rx="57" fill="none" stroke="#ffffff" stroke-opacity=".34" stroke-width="1.6"/>
  </g>
  <!-- front card (bottom-left) -->
  <g filter="url(#sh)">
    <rect x="86" y="218" width="210" height="210" rx="60" fill="url(#gFront)" opacity=".90"/>
    <rect x="86" y="218" width="210" height="210" rx="60" fill="url(#gloss)"/>
    <rect x="87" y="219" width="208" height="208" rx="59" fill="none" stroke="#ffffff" stroke-opacity=".40" stroke-width="1.8"/>
  </g>
</svg>
</body></html>
