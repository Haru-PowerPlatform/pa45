<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.114-2 そのまま貼れる10個</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:11px;}
  .left{flex:0 0 372px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .right{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;}

  .mock{flex:0 0 auto;background:#fff;border:2.5px solid var(--blue-line);border-radius:12px;overflow:hidden;
    box-shadow:0 4px 10px rgba(20,40,90,.14);}
  .mock .mh{display:flex;align-items:center;gap:9px;padding:7px 10px;background:#F2F7FD;border-bottom:1.5px solid #E2EAF5;}
  .mock .mh img{width:26px;height:26px;object-fit:contain;flex:0 0 auto;}
  .mock .mh .mn{font-size:16px;font-weight:900;color:var(--navy);}
  .mock .mb{padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
  .tabs{display:flex;gap:0;border-bottom:2px solid #DDE5F0;}
  .tabs .tb{padding:5px 14px;font-size:15px;font-weight:900;color:#64748B;border-bottom:3px solid transparent;margin-bottom:-2px;}
  .tabs .tb.on{color:var(--blue-dark);border-bottom-color:var(--blue);}
  .expr{background:#1E293B;border-radius:8px;padding:7px 10px;font-family:'Roboto Mono',monospace;font-size:15.5px;
    font-weight:700;color:#93C5FD;line-height:1.34;}
  .expr .g{color:#86EFAC;} .expr .y{color:#FDE68A;}
  .sugg{background:#fff;border:1.8px solid #B9C7DC;border-radius:7px;overflow:hidden;}
  .sugg .sr{display:flex;align-items:center;gap:8px;padding:4px 9px;font-family:'Roboto Mono',monospace;font-size:14.5px;
    font-weight:700;color:#334155;border-bottom:1px solid #EEF2F8;}
  .sugg .sr:last-child{border-bottom:none;}
  .sugg .sr.on{background:#EAF1FE;color:var(--blue-dark);}
  .sugg .sr .fx{flex:0 0 auto;width:18px;height:18px;border-radius:4px;background:#2563EB;color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-weight:900;}

  .sc{flex:1;min-height:0;border-radius:12px;overflow:hidden;position:relative;background:#EDF3FA;}
  .sc svg{position:absolute;inset:0;width:100%;height:100%;}
  .sc .chara{position:absolute;right:2px;bottom:0;height:104px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .th2{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#1E40AF,#2563EB);color:#fff;
    border-radius:9px;padding:6px 12px;font-size:17px;font-weight:900;}
  .th2 .c1{flex:0 0 258px;} .th2 .c2{flex:1;}
  .tbl2{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;}
  .tr2{flex:1;min-height:0;display:flex;align-items:center;gap:9px;background:#fff;border:1.8px solid #DDE5F0;
    border-radius:8px;padding:3px 12px;box-shadow:0 2px 4px rgba(20,40,90,.07);}
  .tr2 .k{flex:0 0 258px;font-size:17px;font-weight:900;color:var(--navy);line-height:1.2;}
  .tr2 .v{flex:1;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:var(--blue-dark);
    background:#EAF1FE;border-radius:6px;padding:3px 9px;line-height:1.22;}
  .tr2.hot{border-color:#FDBA74;background:#FFFBF5;}
  .tr2.hot .v{background:#FFEDD5;color:#9A3412;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};

/* 情景：打つと候補が出て、選んで貼るだけ */
const sc=`<svg viewBox="0 0 372 240" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="h1" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="372" height="240" fill="#EDF3FA"/>
  <text x="14" y="24" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#1E40AF">覚えるのではなく、貼る</text>
  <g filter="url(#h1)"><rect x="14" y="40" width="132" height="46" rx="9" fill="#fff" stroke="#B9C7DC" stroke-width="2"/>
    <text x="80" y="69" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#475569" text-anchor="middle">やりたいこと</text></g>
  <path d="M152 63 H 180" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M174 57 l8 6 l-8 6" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#h1)"><rect x="188" y="38" width="170" height="50" rx="9" fill="#EAF1FE" stroke="#2563EB" stroke-width="2.4"/>
    <text x="273" y="69" font-family="Roboto Mono" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">この10個から選ぶ</text></g>
  <g filter="url(#h1)"><rect x="14" y="112" width="230" height="106" rx="9" fill="#1E293B"/>
    <text x="28" y="142" font-family="Roboto Mono" font-size="15" font-weight="700" fill="#93C5FD">coalesce(</text>
    <rect x="28" y="154" width="200" height="20" rx="4" fill="#334155"/>
    <text x="36" y="169" font-family="Roboto Mono" font-size="12" font-weight="700" fill="#86EFAC">担当者, '未設定'</text>
    <text x="28" y="200" font-family="Roboto Mono" font-size="15" font-weight="700" fill="#93C5FD">)</text></g>
  <text x="14" y="236" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#0B5136">貼って、名前を差し替えるだけ</text>
</svg>`;

const tr=(k,v,hot)=>`<div class="tr2${hot?' hot':''}"><span class="k">${k}</span><span class="v">${v}</span></div>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.114-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">まず<span class="hl">この10個</span>（やりたいこと → 書き方）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">書く場所は<b>アクションの入力欄 → 「式」タブ</b>。打つと候補が出るので、選んで貼るだけです</div>
  </div>

  <div class="stage">
    <div class="left">
      <div class="mock">
        <div class="mh"><img src="${A}icons/pa_logo.png" alt=""><span class="mn">入力欄をクリックすると</span></div>
        <div class="mb">
          <div class="tabs"><span class="tb">動的なコンテンツ</span><span class="tb on">式</span></div>
          <div class="expr">coalesce(<span class="g">担当者</span>,<span class="y">'未設定'</span>)</div>
          <div class="sugg">
            <div class="sr on"><span class="fx">fx</span>coalesce</div>
            <div class="sr"><span class="fx">fx</span>concat</div>
            <div class="sr"><span class="fx">fx</span>contains</div>
          </div>
        </div>
      </div>
      <div class="sc">${sc}<img class="chara" src="${A}chara/chara_guts.png" alt=""></div>
    </div>

    <div class="right">
      <div class="th2"><span class="c1">やりたいこと</span><span class="c2">書き方（そのまま貼れます）</span></div>
      <div class="tbl2">
        ${tr('空欄なら代わりを入れる',"coalesce(担当者,'未設定')")}
        ${tr('空かどうかで分ける','empty(担当者)')}
        ${tr('同じ文字かを見る',"equals(状態,'承認')")}
        ${tr('文字をつなげる',"concat(案件名,'_',番号)")}
        ${tr('日付を読める形にする',"formatDateTime(日付,'yyyy/MM/dd')",1)}
        ${tr('3日後・3日前を出す','addDays(日付,3)',1)}
        ${tr('先頭5文字だけ取る','substring(伝票番号,0,5)')}
        ${tr('1行を1件ずつに分ける',"split(宛先,';')")}
        ${tr('配列をカンマ区切りに戻す',"join(担当リスト,', ')")}
        ${tr('いらない文字を消す',"replace(氏名,'　','')")}
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>ここまでで日常はだいたい足ります。<b>つまずきやすい3つは3枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「ワークフロー式関数」「日付と時刻の変換」</div>
`;
</script>
</body>
</html>
