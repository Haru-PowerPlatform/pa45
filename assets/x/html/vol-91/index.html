<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.91-1 会議が終わる5分前に決定を1つ回収</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46; --green-bg:#F0FDF4;
    --red:#DC2626; --orange:#EA580C; --ol:#0F6CBD; --teams:#5059C9;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:156px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.32;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;align-items:stretch;gap:12px;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:14px;padding:10px 11px 11px;position:relative;}
  .col.c1{background:#F5F8FD;border:1.5px solid #DCE7F5;}
  .col.c2{flex:1.16;background:#F3F6FF;border:2px solid #C7D6F5;}
  .col.c3{background:#F2FBF5;border:1.5px solid #CFEBD8;}
  .ch{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;color:#243B58;line-height:1.12;margin-bottom:7px;}
  .ch .no{flex:0 0 auto;width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .c1 .no{background:linear-gradient(180deg,#60A5FA,#3B82F6);}
  .c2 .no{background:linear-gradient(180deg,#818CF8,#5059C9);}
  .c3 .no{background:linear-gradient(180deg,#4ADE80,#16A34A);}

  .scene{flex:0 0 auto;height:104px;border-radius:11px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.05);position:relative;overflow:hidden;margin-bottom:9px;}
  .scene svg{display:block;width:100%;height:100%;}
  .scene .mini{position:absolute;right:6px;bottom:-4px;height:92px;z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));}

  .body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;gap:8px;}
  .cap{flex:0 0 auto;margin-top:auto;font-weight:800;font-size:15.5px;line-height:1.34;color:#334155;background:rgba(255,255,255,.72);border-radius:9px;padding:8px 11px;}
  .cap b{color:var(--orange);}
  .c2 .cap{background:#FFF7ED;border:1.5px solid #FCD9A8;color:#7C3A0B;font-size:16px;}
  .c2 .cap .k{color:#C2410C;}

  /* ①エンジン行 */
  .engine{flex:0 0 auto;background:#fff;border:1.5px solid #DCE7F5;border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px;}
  .erow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;color:#334155;}
  .erow .eic{flex:0 0 auto;width:27px;height:27px;object-fit:contain;}
  .erow .estep{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:#EEF2F7;color:#475569;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .erow b{color:var(--blue-dark);}

  /* ②Teamsカード */
  .tcard{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #E1E4EA;border-radius:12px;box-shadow:0 4px 12px rgba(30,40,90,.12);overflow:hidden;}
  .tc-bar{flex:0 0 auto;height:5px;background:var(--teams);}
  .tc-in{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:9px 11px 10px;gap:7px;}
  .tc-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .tc-hd .bot{width:30px;height:30px;border-radius:7px;object-fit:contain;background:#fff;}
  .tc-hd .who{font-weight:900;font-size:13.5px;color:#242424;line-height:1.1;}
  .tc-hd .who span{font-weight:700;color:#8A8F98;font-size:11.5px;}
  .tc-hd .flowtag{margin-left:auto;font-size:10.5px;font-weight:900;color:#3B4AB8;background:#E8EBFC;border-radius:6px;padding:3px 7px;}
  .tc-q{flex:0 0 auto;font-weight:900;font-size:14.5px;color:#1F2937;line-height:1.28;}
  .fld{flex:0 0 auto;}
  .fld .fl{font-size:12.5px;font-weight:800;color:#5B6270;margin-bottom:3px;}
  .fld .fin{background:#F7F8FA;border:1.5px solid #D6DAE1;border-radius:7px;padding:7px 9px;font-size:13.5px;font-weight:700;color:#9AA1AC;display:flex;align-items:center;}
  .fld .fsel{background:#fff;border:2px solid var(--teams);border-radius:7px;padding:7px 9px;font-size:13.5px;font-weight:900;color:#242424;display:flex;align-items:center;gap:7px;box-shadow:0 0 0 3px rgba(80,89,201,.12);}
  .fld .fsel .av{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#10B981;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .fld .fsel .cv{margin-left:auto;color:var(--teams);font-weight:900;font-size:15px;}
  .fld .autochip{margin-left:7px;font-size:10px;font-weight:900;color:#C2410C;background:#FFEDD5;border-radius:5px;padding:2px 6px;vertical-align:1px;}
  .tc-btn{flex:0 0 auto;margin-top:2px;background:var(--teams);color:#fff;font-weight:900;font-size:14px;text-align:center;border-radius:8px;padding:9px;box-shadow:0 3px 7px rgba(80,89,201,.35);}

  /* ③台帳 */
  .ledger{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #D9EAE0;border-radius:11px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.07);}
  .lg-hd{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#ECFBF1;border-bottom:1px solid #D9EAE0;font-weight:900;font-size:13px;color:#15803D;}
  .lg-hd img{width:22px;height:22px;object-fit:contain;}
  .ltab{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
  .ltab .lr{flex:1;display:grid;grid-template-columns:1.15fr 1.7fr .95fr;gap:0;align-items:center;border-bottom:1px solid #EEF2F0;min-height:0;}
  .ltab .lr:last-child{border-bottom:none;}
  .ltab .lr.hd{flex:0 0 auto;background:#F4F7F5;color:#5B6270;font-weight:900;font-size:11.5px;}
  .ltab .lr .cell{padding:6px 9px;font-size:13px;font-weight:800;color:#334155;line-height:1.2;}
  .ltab .lr.new{background:#DCFCE7;}
  .ltab .lr.new .cell{color:#14532D;}
  .newbadge{position:absolute;right:8px;top:7px;font-size:10.5px;font-weight:900;color:#fff;background:var(--green);border-radius:6px;padding:3px 8px;box-shadow:0 2px 4px rgba(0,0,0,.2);}

  .foot{flex:0 0 auto;margin:9px 16px 0;display:flex;align-items:center;gap:10px;}
  .foot .fl{flex:0 0 auto;font-weight:900;font-size:14.5px;color:var(--weak);}
  .foot .tags{flex:1;display:flex;gap:8px;}
  .foot .tag{flex:1;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 4px;font-weight:900;font-size:15px;color:#334155;box-shadow:0 1px 3px rgba(0,0,0,.05);}

  .next{flex:0 0 auto;margin:9px 16px 12px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:10px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:9.5px;color:#AEB6C2;font-weight:700;z-index:3;padding-right:16px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// ① 情景：終わりかけの会議を見張る（時計＋会議画面＋あと5分）
const scene1=`<svg viewBox="0 0 300 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="16" y="20" width="120" height="70" rx="9" fill="#E7EEFB" stroke="#B9CBEC" stroke-width="2"/>
  <rect x="26" y="30" width="46" height="30" rx="5" fill="#5B6EE1"/><rect x="80" y="30" width="46" height="30" rx="5" fill="#7C8AE6"/>
  <rect x="26" y="66" width="46" height="16" rx="4" fill="#9FB0EC"/><rect x="80" y="66" width="46" height="16" rx="4" fill="#9FB0EC"/>
  <circle cx="212" cy="52" r="34" fill="#fff" stroke="#2563EB" stroke-width="4"/>
  <line x1="212" y1="52" x2="212" y2="30" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
  <line x1="212" y1="52" x2="230" y2="60" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="212" cy="52" r="4" fill="#1E3A8A"/>
  <rect x="176" y="83" width="72" height="20" rx="10" fill="#FEE2E2"/>
  <text x="212" y="97" text-anchor="middle" font-family="Noto Sans JP" font-weight="900" font-size="13" fill="#DC2626">あと5分</text>
</svg>`;
// ② 情景：カードに入力（カーソル＋吹き出し）
const scene2=`<svg viewBox="0 0 300 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="16" width="150" height="74" rx="10" fill="#fff" stroke="#5059C9" stroke-width="2.5"/>
  <rect x="30" y="16" width="150" height="10" rx="5" fill="#5059C9"/>
  <rect x="42" y="36" width="126" height="12" rx="4" fill="#E1E4F5"/>
  <rect x="42" y="55" width="92" height="16" rx="5" fill="#F1F2FA" stroke="#C7CBE8"/>
  <path d="M150 74 l0 22 l7 -7 l5 11 l6 -3 l-5 -11 l10 0 z" fill="#1F2937"/>
  <circle cx="238" cy="40" r="24" fill="#EEF0FF" stroke="#5059C9" stroke-width="2"/>
  <text x="238" y="47" text-anchor="middle" font-family="Noto Sans JP" font-weight="900" font-size="20" fill="#5059C9">✎</text>
</svg>`;
// ③ 情景：台帳に残る（本＋チェック＋追記矢印）
const scene3=`<svg viewBox="0 0 300 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="150" y="20" width="118" height="72" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="150" y1="40" x2="268" y2="40" stroke="#CDE9D6" stroke-width="2"/>
  <line x1="150" y1="58" x2="268" y2="58" stroke="#CDE9D6" stroke-width="2"/>
  <line x1="150" y1="76" x2="268" y2="76" stroke="#CDE9D6" stroke-width="2"/>
  <line x1="190" y1="20" x2="190" y2="92" stroke="#CDE9D6" stroke-width="2"/>
  <rect x="152" y="60" width="114" height="16" fill="#DCFCE7"/>
  <path d="M60 40 h60 M110 30 l14 10 l-14 10" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="42" cy="40" r="20" fill="#DCFCE7"/><path d="M34 40 l6 6 l11 -12" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.91-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">会議、やりっぱなしにしない｜<span class="hl">終わる5分前にTeamsが“決定”を1つ回収</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">「じゃあそれで」で解散した会議、翌日には中身をもう覚えてない…。<b>終わる5分前</b>に、決定を<b>1つだけ</b>その場で残せます。</div>
  </div>

  <div class="stage">
    <div class="col c1">
      <div class="ch"><span class="no">1</span>終わりかけの会議を見張る</div>
      <div class="scene">${scene1}<img class="mini" src="${A}chara/chara_point.png" alt=""></div>
      <div class="body">
        <div class="engine">
          <div class="erow"><span class="estep">A</span><img class="eic" src="${A}icons/pa_schedule.png">5分ごとに予定表をのぞく</div>
          <div class="erow"><span class="estep">B</span><img class="eic" src="${A}icons/pa_outlook.png"><b>まもなく終わる会議</b>だけ拾う</div>
          <div class="erow"><span class="estep">C</span><img class="eic" src="${A}icons/pa_outlook.png">その会議の<b>参加者</b>も一緒に取得</div>
        </div>
        <div class="cap">終了5分前の会議を、フローが<b>自動で見つける</b>。招集も予約もいらない。</div>
      </div>
    </div>

    <div class="col c2">
      <div class="ch"><span class="no">2</span>その場で決定を1つ入力</div>
      <div class="body">
        <div class="tcard">
          <div class="tc-bar"></div>
          <div class="tc-in">
            <div class="tc-hd"><img class="bot" src="${A}icons/pa_teams.png"><div class="who">Power Automate<br><span>フローボット・14:55</span></div><div class="flowtag">⚡自動</div></div>
            <div class="tc-q">週次定例、まもなく終了。<br>今日の“決定”を1つ残しませんか？</div>
            <div class="fld"><div class="fl">決定事項</div><div class="fin">例：新レイアウトはA案で進める</div></div>
            <div class="fld"><div class="fl">次にやる人<span class="autochip">▼参加者から自動</span></div><div class="fsel"><span class="av">佐</span>佐藤さん<span class="cv">▾</span></div></div>
            <div class="tc-btn">記録する</div>
          </div>
        </div>
        <div class="cap">一工夫＝<span class="k">「次にやる人」がこの会議の参加者から自動で選べる</span>。名前を打ち直さない。</div>
      </div>
    </div>

    <div class="col c3">
      <div class="ch"><span class="no">3</span>決定が台帳に残る</div>
      <div class="scene">${scene3}<img class="mini" src="${A}chara/chara_guts.png" alt=""></div>
      <div class="body">
        <div class="ledger">
          <div class="newbadge">＋自動で追加</div>
          <div class="lg-hd"><img src="${A}icons/pa_sharepoint.png">決定事項 台帳</div>
          <div class="ltab">
            <div class="lr hd"><div class="cell">会議</div><div class="cell">決定事項</div><div class="cell">担当</div></div>
            <div class="lr"><div class="cell">企画定例</div><div class="cell">予算は据え置き</div><div class="cell">田中</div></div>
            <div class="lr"><div class="cell">開発MTG</div><div class="cell">来週リリース</div><div class="cell">鈴木</div></div>
            <div class="lr new"><div class="cell">週次定例</div><div class="cell">A案で進める</div><div class="cell">佐藤</div></div>
          </div>
        </div>
        <div class="cap">日時・会議名つきで残るから、<b>“言った言わない”が消える</b>。</div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="fl">こんな会議に効く▶</div>
    <div class="tags"><div class="tag">週次定例</div><div class="tag">プロジェクト会議</div><div class="tag">部会・課会</div><div class="tag">1on1</div></div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>終了5分前トリガーと<b>参加者ドロップダウン</b>の<b>作り方</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（スケジュール／Office 365 Outlook「イベントの取得 (V4)」／Teams「アダプティブ カードを投稿して応答を待機する」／SharePoint「項目の作成」）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
