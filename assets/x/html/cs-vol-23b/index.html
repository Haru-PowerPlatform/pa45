<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.23-2 覚えること・覚えないこと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;}
  .pane{min-height:0;display:flex;flex-direction:column;border-radius:14px;padding:9px 12px 11px;box-shadow:0 6px 14px rgba(0,0,0,.12);}
  .pY{flex:1.55;background:var(--cs-bg);border:2px solid var(--cs-line);}
  .pN{flex:1;background:var(--red-bg);border:2px solid var(--red-line);}
  .ph{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-bottom:7px;}
  .ph .tag{font-size:15px;font-weight:900;color:#fff;border-radius:8px;padding:3px 11px;}
  .pY .tag{background:var(--cs);} .pN .tag{background:var(--red);}
  .ph .h{font-size:23px;font-weight:900;color:var(--navy);}
  .cards{flex:1;min-height:0;display:grid;gap:8px;}
  .pY .cards{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);}
  .pN .cards{grid-template-rows:repeat(4,1fr);}
  .cd{min-height:0;display:flex;align-items:center;gap:10px;background:#fff;border-radius:11px;padding:6px 11px;border:1.8px solid #DDD6FE;}
  .pN .cd{border-color:#FECACA;}
  .cd svg{flex:0 0 66px;width:66px;height:54px;}
  .cd .t{font-size:17.5px;font-weight:900;color:var(--navy);line-height:1.28;}
  .cd .t small{display:block;font-size:14px;font-weight:700;color:#4B5563;line-height:1.38;}
  .cd .ex{display:inline-block;margin-top:2px;font-size:13.5px;font-weight:800;color:#5B21B6;background:#F5F3FF;border-radius:6px;padding:0 7px;}
  .cd.wide{grid-column:1 / span 2;}
  .pN .cd .t{color:#7F1D1D;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const T=(x,y,s,t,c='#1B2A44',w=800,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${s}" font-weight="${w}" fill="${c}" font-family="Noto Sans JP">${t}</text>`;
const I={
 me:`<svg viewBox="0 0 66 54"><rect x="4" y="6" width="58" height="42" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="2"/><circle cx="20" cy="22" r="7" fill="#A78BFA"/><path d="M10 40 q10 -14 20 0z" fill="#A78BFA"/><rect x="34" y="16" width="22" height="4" rx="2" fill="#C4B5FD"/><rect x="34" y="25" width="18" height="4" rx="2" fill="#C4B5FD"/><rect x="34" y="34" width="20" height="4" rx="2" fill="#C4B5FD"/></svg>`,
 fix:`<svg viewBox="0 0 66 54"><rect x="4" y="8" width="58" height="38" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/>${T(20,32,12,'税込','#9CA3AF',800)}<path d="M8 28 H32" stroke="#DC2626" stroke-width="2.5"/>${T(48,32,13,'税抜','#16A34A',900)}<path d="M34 28 l4 -3 v6z" fill="#16A34A"/></svg>`,
 work:`<svg viewBox="0 0 66 54"><rect x="4" y="22" width="58" height="12" rx="6" fill="#EDE9FE"/><rect x="4" y="22" width="38" height="12" rx="6" fill="#7C3AED"/>${T(33,16,11.5,'BID-105','#5B21B6',900)}${T(33,48,11,'承認待ち','#92400E',800)}</svg>`,
 where:`<svg viewBox="0 0 66 54"><path d="M33 4 c-11 0 -18 8 -18 17 c0 13 18 29 18 29 s18 -16 18 -29 c0 -9 -7 -17 -18 -17z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><image href="${A}icons/ms/sharepoint.svg" x="23" y="11" width="20" height="20"/></svg>`,
 log:`<svg viewBox="0 0 66 54"><rect x="6" y="6" width="54" height="42" rx="5" fill="#fff" stroke="#7C3AED" stroke-width="2"/><rect x="6" y="6" width="54" height="11" rx="5" fill="#7C3AED"/>${[0,1,2].map(i=>`${T(16,29+i*8.5,7.5,'11/'+(18+i*2),'#5B21B6',900)}<rect x="27" y="${24+i*8.5}" width="${26-i*4}" height="4" rx="2" fill="#C4B5FD"/>`).join('')}</svg>`,
 key:`<svg viewBox="0 0 66 54"><circle cx="20" cy="27" r="11" fill="none" stroke="#B91C1C" stroke-width="4"/><path d="M31 27 H58 M50 27 v8 M56 27 v6" stroke="#B91C1C" stroke-width="4"/><path d="M6 48 L60 6" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/></svg>`,
 card:`<svg viewBox="0 0 66 54"><rect x="6" y="10" width="54" height="34" rx="5" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><rect x="6" y="17" width="54" height="7" fill="#B91C1C"/><rect x="12" y="32" width="26" height="4" fill="#FCA5A5"/><path d="M6 48 L60 6" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/></svg>`,
 sec:`<svg viewBox="0 0 66 54"><rect x="10" y="6" width="40" height="44" rx="4" fill="#fff" stroke="#B91C1C" stroke-width="2"/><rect x="16" y="14" width="28" height="4" fill="#FCA5A5"/><rect x="16" y="22" width="22" height="4" fill="#FCA5A5"/><rect x="26" y="28" width="34" height="14" rx="3" fill="#DC2626"/>${T(43,39,9.5,'社外秘','#fff',900)}</svg>`,
 once:`<svg viewBox="0 0 66 54"><rect x="6" y="8" width="44" height="28" rx="8" fill="#fff" stroke="#B91C1C" stroke-width="2"/>${T(28,27,10.5,'今だけ','#B91C1C',900)}<path d="M28 36 l-6 8 l10 -8" fill="#fff" stroke="#B91C1C" stroke-width="2"/><circle cx="52" cy="40" r="9" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3 3"/></svg>`};

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.23</div>
    <div class="part-pill">中身 <b>(2/4)</b></div>
    <div class="title-text">覚えるのは<span class="q">"仕事の前提"</span>。<br>パスワードや社外秘は覚えない</div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/agent.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_smile_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">中身</div>
    <div class="txt">メモリに残るのは<b>短い平文のメモ</b>で、会話の全記録ではない。<br>
      頼んで覚えさせることも、AIが<em>自分で残す</em>こともある。</div>
  </div>

  <div class="body">
    <div class="pane pY">
      <div class="ph"><span class="tag">覚える</span><span class="h">5つの種類（公式）</span></div>
      <div class="cards">
        <div class="cd">${I.me}<span class="t">あなたのこと<small>役割・得意分野・好み</small><span class="ex">関西担当／表で見せる</span></span></div>
        <div class="cd">${I.fix}<span class="t">訂正<small>直した内容と、その理由</small><span class="ex">金額は税抜で</span></span></div>
        <div class="cd">${I.work}<span class="t">進めている仕事<small>目的・条件・進み具合</small><span class="ex">見積の比較は承認待ち</span></span></div>
        <div class="cd">${I.where}<span class="t">情報のありか<small>どこを見ればいいか</small><span class="ex">単価表は営業サイト</span></span></div>
        <div class="cd wide">${I.log}<span class="t">日付つきの記録<small>続いている出来事を日付ごとに</small><span class="ex">11/18 見積受領 → 11/20 修正版 → 11/22 承認依頼</span></span></div>
      </div>
    </div>
    <div class="pane pN">
      <div class="ph"><span class="tag">覚えない</span><span class="h">残さないもの</span></div>
      <div class="cards">
        <div class="cd">${I.key}<span class="t">パスワード・認証情報<small>トークンも含む</small></span></div>
        <div class="cd">${I.card}<span class="t">他人の個人情報<small>番号・カード番号・住所</small></span></div>
        <div class="cd">${I.sec}<span class="t">機密情報<small>ほかの人の内容も残さない</small></span></div>
        <div class="cd">${I.once}<span class="t">その場かぎりの話<small>この会話でしか使わないこと</small></span></div>
      </div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">決まりごと（公式）</div>
      <div class="grid">
        <div class="fc"><div class="ft">指示ではなく背景</div><div class="fd">メモは答えの参考。<br>命令としては扱わない</div></div>
        <div class="fc"><div class="ft">権限は増えない</div><div class="fd">覚えても、見られない<br>資料は見られない</div></div>
        <div class="fc"><div class="ft">必ず残るとは限らない</div><div class="fd">頼んでも保存されない<br>ことがある</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">「覚えない」は<b>ふるいではなく目安</b>。<br>社外秘はそもそも話さない。</div>
    </div>
    <div class="src">出典：Microsoft Learn（エージェントのメモリの概要／エージェントが記憶する内容）／例は説明用の再現</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_think_g.png" alt="">
`;
</script>
</body>
</html>
