<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.27-3 New email トリガーの設定画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;}
  .mock{flex:1.62;min-width:0;min-height:0;display:flex;flex-direction:column;}
  .mock .wh{font-size:17px;padding:8px 14px;}
  .mock .wh img{width:28px;height:28px;}
  .mock .wh .x{margin-left:auto;color:#6B7280;font-weight:600;}
  .mock .wb{flex:1;min-height:0;display:flex;gap:14px;padding:10px 14px 12px;}
  .mc{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .sec{position:relative;border:1.5px solid #E1DFDD;border-radius:8px;padding:7px 10px 8px;background:#fff;}
  .sec.hl{border:2.4px solid #7C3AED;background:#FBFAFF;}
  .sh{font-size:15.5px;font-weight:800;color:#242424;margin-bottom:5px;}
  .sh small{font-weight:600;color:#6B7280;font-size:13.5px;}
  .conn{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;}
  .conn img{width:28px;height:28px;}
  .ok{margin-left:auto;width:24px;height:24px;border-radius:50%;background:#16A34A;display:flex;align-items:center;justify-content:center;}
  .ta{border:1.5px solid #C8C6C4;border-radius:5px;padding:6px 9px;font-size:15.5px;font-weight:600;line-height:1.45;color:#242424;min-height:96px;}
  .orow{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;padding:2px 0;border-bottom:1px solid #F3F2F1;}
  .orow:last-child{border-bottom:none;}
  .orow .k{flex:0 0 76px;color:#242424;font-weight:700;}
  .orow .v{flex:1;min-width:0;border:1.4px solid #C8C6C4;border-radius:5px;padding:2px 8px;color:#6B7280;font-size:15px;}
  .orow .v.f{color:#242424;}
  .tg{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:13px;color:#6B7280;font-weight:600;}
  .tg i{display:block;width:34px;height:18px;border-radius:9px;background:#0F6CBD;position:relative;}
  .tg i::after{content:"";position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;}
  .adv{font-size:15.5px;font-weight:700;color:#0F6CBD;padding:2px 2px;}
  .rad{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;padding:3px 0;}
  .rad i{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:2px solid #8A8886;position:relative;}
  .rad.on i{border-color:#0F6CBD;} .rad.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0F6CBD;}
  .rad small{font-size:13px;color:#6B7280;font-weight:600;}
  .btns{margin-top:auto;display:flex;gap:8px;justify-content:flex-end;}
  .btns span{font-size:15.5px;font-weight:700;border-radius:5px;padding:5px 16px;border:1.4px solid #8A8886;}
  .btns .p{background:#0F6CBD;border-color:#0F6CBD;color:#fff;}
  .nb{position:absolute;top:-12px;right:-10px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;
    font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);font-family:"Noto Sans JP";}
  .notes{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .nt{flex:1;min-height:0;display:flex;align-items:center;gap:10px;background:var(--cs-bg);border:2px solid var(--cs-line);border-radius:12px;padding:6px 10px;}
  .nt.key{background:#FFFBEB;border-color:#F59E0B;}
  .nt .n{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .nt .t{flex:1;min-width:0;font-size:18px;font-weight:900;color:var(--navy);line-height:1.25;}
  .nt .t small{display:block;font-size:15px;font-weight:700;color:#4B5563;line-height:1.38;margin-top:2px;}
  .nt svg{flex:0 0 74px;width:74px;height:56px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const T=(x,y,s,t,c='#1B2A44',w=800,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${s}" font-weight="${w}" fill="${c}" font-family="Noto Sans JP">${t}</text>`;
const CK='<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none"/></svg>';
const M1=`<svg viewBox="0 0 74 56"><circle cx="20" cy="28" r="15" fill="#16A34A"/><path d="M12 28 l6 6 l10 -12" stroke="#fff" stroke-width="3.4" fill="none"/>
  <path d="M54 14 L70 42 H38z" fill="#FCD34D" stroke="#B45309" stroke-width="2"/>${T(54,39,15,'!','#92400E',900)}</svg>`;
const M2=`<svg viewBox="0 0 74 56"><rect x="2" y="4" width="34" height="20" rx="5" fill="#fff" stroke="#0F6CBD" stroke-width="1.8"/>${T(19,19,10,'メール','#0F6CBD',800)}
  <rect x="2" y="32" width="34" height="20" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/>${T(19,47,10,'毎朝','#4B5563',800)}
  <path d="M38 14 H46 M38 42 H46" stroke="#7C3AED" stroke-width="2"/>
  <rect x="47" y="4" width="25" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B"/><rect x="47" y="32" width="25" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
  <path d="M51 11 h17 M51 17 h12 M51 39 h17 M51 45 h12" stroke="#B45309" stroke-width="1.6"/></svg>`;
const M3=`<svg viewBox="0 0 74 56"><path d="M4 14 h14 l4 5 h22 v28 h-40z" fill="#FDE68A" stroke="#B45309" stroke-width="1.6"/>${T(24,39,10,'受信','#92400E',900)}
  <rect x="50" y="20" width="22" height="13" rx="6.5" fill="#0F6CBD"/><circle cx="65" cy="26.5" r="4.5" fill="#fff"/>
  <circle cx="61" cy="44" r="6" fill="#C4B5FD"/><path d="M52 56 a9 7 0 0 1 18 0" fill="#C4B5FD"/></svg>`;
const M4=`<svg viewBox="0 0 74 56"><rect x="2" y="3" width="30" height="14" rx="4" fill="#EDE9FE" stroke="#7C3AED"/><rect x="2" y="21" width="30" height="14" rx="4" fill="#EDE9FE" stroke="#7C3AED"/><rect x="2" y="39" width="30" height="14" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
  ${T(17,14,9,'1通目','#5B21B6',800)}${T(17,32,9,'2通目','#5B21B6',800)}${T(17,50,9,'3通目','#5B21B6',800)}
  <rect x="42" y="3" width="30" height="50" rx="5" fill="#fff" stroke="#9CA3AF" stroke-dasharray="3 2"/>
  <rect x="46" y="8" width="22" height="7" rx="3" fill="#D1D5DB"/><rect x="46" y="20" width="22" height="7" rx="3" fill="#D1D5DB"/><rect x="46" y="32" width="22" height="7" rx="3" fill="#D1D5DB"/><rect x="46" y="44" width="16" height="5" rx="2" fill="#D1D5DB"/></svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.27</div>
    <div class="part-pill">設定画面 <b>(3/4)</b></div>
    <div class="title-text">メールのトリガーで<br><span class="q">決めるのは4か所</span></div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/outlook.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_think_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">要点</div>
    <div class="txt">接続・追加の指示・どのメールで動くか・実行先の4つ。<b>実行先の既定は Same session</b>。<br>
      見積依頼のように1通ずつ別件なら、<em>New chat each run に切り替える</em>。</div>
  </div>

  <div class="body">
    <div class="mock win seg">
      <div class="wh"><img src="${A}icons/ms/outlook.svg" alt="">New email<span class="x">✕</span></div>
      <div class="wb">
        <div class="mc">
          <div class="sec"><span class="nb">1</span><div class="sh">Connection</div>
            <div class="conn"><img src="${A}icons/ms/outlook.svg" alt="">Office 365 Outlook・佐藤 美咲<span class="ok">${CK}</span></div></div>
          <div class="sec"><span class="nb">2</span><div class="sh">Instructions <small>(optional)</small></div>
            <div class="ta">件名か本文に「見積」がある<br>メールだけ扱う。それ以外は<br>何もしない。急ぎかどうかも<br>書き添える。</div></div>
          <div class="sec"><div class="sh">Advanced parameters</div><div class="adv">⌄ Show all</div></div>
        </div>
        <div class="mc">
          <div class="sec"><span class="nb">3</span><div class="sh">Trigger options <small>Editable by user</small></div>
            <div class="orow"><span class="k">Folder</span><span class="v f">Inbox</span><span class="tg"><i></i></span></div>
            <div class="orow"><span class="k">To</span><span class="v">（指定なし）</span><span class="tg"><i></i></span></div>
            <div class="orow"><span class="k">CC</span><span class="v">（指定なし）</span><span class="tg"><i></i></span></div>
            <div class="orow"><span class="k">To or CC</span><span class="v">（指定なし）</span><span class="tg"><i></i></span></div></div>
          <div class="sec hl"><span class="nb">4</span><div class="sh">Runs in</div>
            <div class="rad on"><i></i>New chat each run</div>
            <div class="rad"><i></i>Same session <small>（既定）</small></div></div>
          <div class="btns"><span>Cancel</span><span class="p">Add trigger</span></div>
        </div>
      </div>
    </div>
    <div class="notes">
      <div class="nt"><span class="n">1</span><span class="t">緑のチェックを確認<small>出ないときは、アカウントを<br>選び直すか新しい接続を作る</small></span>${M1}</div>
      <div class="nt"><span class="n">2</span><span class="t">このトリガーだけの指示<small>トリガーが複数あるとき<br>それぞれの動きを分けられる</small></span>${M2}</div>
      <div class="nt"><span class="n">3</span><span class="t">どのメールで動くか<small>共有先で変えてよい項目だけ<br>Editable by user をオン</small></span>${M3}</div>
      <div class="nt key"><span class="n">4</span><span class="t">1通ずつなら New chat<small>Same session は前の続き。<br>変更は発行してから効く</small></span>${M4}</div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">画面の外で決まっていること（公式）</div>
      <div class="grid">
        <div class="fc"><div class="ft">接続の確認が不要</div><div class="fd">Recurrence や<br>Teams などのトリガー</div></div>
        <div class="fc"><div class="ft">実行先ごとに会話</div><div class="fd">Same session は<br>トリガーごとに1つ</div></div>
        <div class="fc"><div class="ft">押したら終わりではない</div><div class="fd">Add trigger のあと<br>テストと発行が要る</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">プレビュー機能。<b>実画面は未確認</b>で、<br>Learn の説明と画像の説明文から再現。</div>
    </div>
    <div class="src">出典：Microsoft Learn（エージェントにトリガーを追加する（Microsoft Copilot）（プレビュー））／画面は説明用の再現・名前は架空</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_confident_g.png" alt="">
`;
</script>
</body>
</html>
