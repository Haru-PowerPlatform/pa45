<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.14-1 作っただけではつながらない。境目は「発行」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:11px;}
  .koma{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;border-radius:13px;padding:9px 11px 11px;
    background:#F8F9FA;border:2px solid var(--cs-bg2);box-shadow:0 5px 12px rgba(0,0,0,.11);position:relative;}
  .koma.k2{background:var(--cs-bg);border-color:var(--cs-line);}
  .koma.k3{background:var(--green-bg);border-color:var(--green-line);}
  .koma.k4{background:#FFF7ED;border-color:#FDBA74;}
  .kt2{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .kt2 .no6{flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:#94A3B8;color:#fff;font-size:15px;
    font-weight:900;display:flex;align-items:center;justify-content:center;}
  .koma.k2 .kt2 .no6{background:var(--cs);} .koma.k3 .kt2 .no6{background:var(--green);}
  .koma.k4 .kt2 .no6{background:var(--orange);}
  .kt2 .kh{flex:1;font-size:19px;font-weight:900;color:var(--navy);line-height:1.16;}
  .koma.k2 .kt2 .kh{color:var(--cs-dark);} .koma.k3 .kt2 .kh{color:var(--green-dark);}
  .koma.k4 .kt2 .kh{color:#9A3412;}
  .ks2{flex:1;min-height:0;border-radius:10px;overflow:hidden;position:relative;background:#fff;}
  .ks2 svg{position:absolute;inset:0;width:100%;height:100%;}
  .kc2{flex:0 0 auto;font-size:14.5px;font-weight:900;line-height:1.32;border-radius:9px;padding:6px 10px;
    background:#E9ECF2;color:#334155;}
  .koma.k2 .kc2{background:var(--cs-bg2);color:var(--cs-dark);}
  .koma.k3 .kc2{background:#CFEFE0;color:var(--green-dark);}
  .koma.k4 .kc2{background:#FFEDD5;color:#9A3412;}
  .kc2 b{color:var(--cs);}
  .koma.k4 .kc2 b{color:#DC2626;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const VB='0 0 277 299';

/* ① 作る（下書き） */
const k1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="s1" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="277" height="299" fill="#F3F4F7"/>
  <g filter="url(#s1)"><rect x="22" y="30" width="234" height="176" rx="10" fill="#fff" stroke="#C8C6C4" stroke-width="2.4"
    stroke-dasharray="9 7"/>
    <rect x="42" y="54" width="132" height="11" rx="5.5" fill="#DDE1E8"/>
    <rect x="42" y="84" width="178" height="8" rx="4" fill="#EDEFF3"/>
    <rect x="42" y="106" width="150" height="8" rx="4" fill="#EDEFF3"/>
    <rect x="42" y="128" width="166" height="8" rx="4" fill="#EDEFF3"/>
    <rect x="42" y="158" width="108" height="20" rx="10" fill="#EDEFF3"/></g>
  <g filter="url(#s1)"><rect x="150" y="226" width="106" height="30" rx="15" fill="#EDEBE9" stroke="#C8C6C4" stroke-width="1.8"/>
    <text x="203" y="247" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#A19F9D" text-anchor="middle">下書き</text></g>
  <text x="22" y="248" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#64748B">まだ誰にも</text>
  <text x="22" y="270" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#64748B">見えない</text>
</svg>`;

/* ② 発行する */
const k2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#5B21B6"/></linearGradient>
    <filter id="s2" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B2A66" flood-opacity=".26"/></filter>
  </defs>
  <rect x="0" y="0" width="277" height="299" fill="#F5F3FF"/>
  <g filter="url(#s2)"><rect x="20" y="26" width="238" height="150" rx="10" fill="#fff" stroke="#B79CF0" stroke-width="2.2"/>
    <rect x="38" y="48" width="128" height="11" rx="5.5" fill="#DDD3F7"/>
    <rect x="38" y="76" width="182" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="38" y="98" width="150" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="38" y="120" width="168" height="8" rx="4" fill="#EDE9FE"/></g>
  <g filter="url(#s2)"><rect x="138" y="210" width="120" height="40" rx="7" fill="url(#pg)"/>
    <text x="198" y="236" font-family="Noto Sans JP" font-size="17" font-weight="900" fill="#fff" text-anchor="middle">Publish</text></g>
  <g><circle cx="90" cy="230" r="20" fill="none" stroke="#7C3AED" stroke-width="4"/>
    <path d="M90 220 v12 M90 238 v.01" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/></g>
  <text x="20" y="278" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#5B21B6">右下まで押し切る</text>
</svg>`;

/* ③ つながる */
const k3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="s3" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B5136" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="277" height="299" fill="#ECFDF5"/>
  <g filter="url(#s3)"><circle cx="60" cy="150" r="34" fill="#16A34A"/>
    <path d="M46 150.5 l10 10 L78 138" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M98 122 C 128 100, 140 84, 156 74" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M98 150 H 156" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
  <path d="M98 178 C 128 200, 140 216, 156 226" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  ${[['道具として選べる',56],['取り次ぎ先に出る',132],['Teamsに置ける',208]].map(([t,y])=>
    `<g filter="url(#s3)"><rect x="160" y="${y}" width="104" height="38" rx="9" fill="#fff" stroke="#7FCEA9" stroke-width="2.2"/>
      <text x="212" y="${+y+24}" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#0B5136" text-anchor="middle">${t}</text></g>`).join('')}
</svg>`;

/* ④ 数え始める */
const k4=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="s4" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7A4E06" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="277" height="299" fill="#FFF7ED"/>
  <g filter="url(#s4)"><rect x="18" y="26" width="242" height="248" rx="10" fill="#fff" stroke="#FDBA74" stroke-width="2.2"/>
    <text x="34" y="50" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#9A3412">Monitor</text>
    <path d="M34 236 H 244" stroke="#EDD5BC" stroke-width="2.4"/>
    ${[0,1,2,3,4,5].map(i=>`<rect x="${44+i*34}" y="${236-[3,3,26,58,102,146][i]}" width="24"
      height="${[3,3,26,58,102,146][i]}" rx="4" fill="${i<2?'#EDD5BC':'#EA580C'}"/>`).join('')}
    <path d="M44 222 H 112" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="6 5"/>
    <text x="78" y="214" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#DC2626" text-anchor="middle">公開前は0</text>
    <text x="196" y="94" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#9A3412" text-anchor="middle">公開後に</text>
    <text x="196" y="114" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#9A3412" text-anchor="middle">数え始める</text>
    <text x="139" y="264" font-family="Noto Sans JP" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">期間の設定でも0に見える</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.14</div>
    <div class="part-pill">前編 <b>(1/2)</b></div>
    <div class="title-text">作っただけではつながらない。<br>境目は「発行」<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_confident_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">下書きのままだと、<b>他のしくみから一切選べません</b>。<br>
      発行して初めて、<em>道具・取り次ぎ・チャネルの一覧に出てきます</em>。</div>
  </div>

  <div class="body">
    <div class="koma">
      <div class="kt2"><span class="no6">1</span><span class="kh">作る</span></div>
      <div class="ks2">${k1}</div>
      <div class="kc2">できあがっても、まだ下書き</div>
    </div>
    <div class="koma k2">
      <div class="kt2"><span class="no6">2</span><span class="kh">発行する</span></div>
      <div class="ks2">${k2}</div>
      <div class="kc2">右下の <b>Publish</b> まで押し切る</div>
    </div>
    <div class="koma k3">
      <div class="kt2"><span class="no6">3</span><span class="kh">つながる</span></div>
      <div class="ks2">${k3}</div>
      <div class="kc2">ほかの画面の一覧に出てくる</div>
    </div>
    <div class="koma k4">
      <div class="kt2"><span class="no6">4</span><span class="kh">数え始める</span></div>
      <div class="ks2">${k4}</div>
      <div class="kc2">Monitorは<b>公開して使われた分</b>だけ</div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">発行するまでできないこと</div>
      <div class="grid">
        <div class="fc"><div class="ft">① 道具にできない</div><div class="fd">未発行のフローは、薄く表示されて押せない</div></div>
        <div class="fc"><div class="ft">② 取り次げない</div><div class="fd">接続先の一覧に「まだ下書き」と出て選べない</div></div>
        <div class="fc"><div class="ft">③ チャネルに出せない</div><div class="fd">1回も発行していないと、チャネルの追加そのものができない</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 数字が0のとき</div>
      <div class="txt">Monitorが全部0でも、壊れているとは限りません。<br>
        <b>公開して使われていない</b>だけのことがあります。</div>
    </div>
    <div class="src">出典：Microsoft Learn（発行）＋PA45 Demo環境での実機／画面は説明用の再現です</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_guts_g.png" alt="">
`;
</script>
</body>
</html>
