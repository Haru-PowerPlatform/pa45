<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.151-1 スライドのQRで答えると、回答がその場で会場のTeamsに流れる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型C：主役モック"どーん"（会場スクリーンに投影中のTeamsチャネルが主役）*/
  .stage{gap:10px;}
  .lft{flex:0 0 372px;min-height:0;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:7px 9px 9px;
    background:#EFFAF8;border:2.5px solid #99DCD3;}
  .lh{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900;color:#0F5F59;line-height:1.15;white-space:nowrap;}
  .lh .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#0F766E;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;}
  .qrs{flex:0 0 122px;position:relative;border-radius:10px;overflow:hidden;}
  .qrs svg{position:absolute;inset:0;width:100%;height:100%;}
  .ph2{flex:1;min-height:0;display:flex;gap:8px;}
  .phone{flex:0 0 196px;background:#1F2937;border-radius:22px;padding:7px 6px 8px;display:flex;flex-direction:column;
    box-shadow:0 6px 14px rgba(15,61,56,.35),inset 0 0 0 2px #374151;}
  .scr{flex:1;min-height:0;background:#fff;border-radius:13px;overflow:hidden;display:flex;flex-direction:column;}
  .fh{flex:0 0 auto;background:linear-gradient(90deg,#03787C,#0B9A8F);color:#fff;font-size:15.5px;font-weight:900;padding:4px 9px;line-height:1.25;}
  .fb{flex:1;min-height:0;padding:4px 8px 6px;display:flex;flex-direction:column;gap:3px;}
  .fq{font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.25;}
  .fin{border-bottom:2px solid #0F766E;font-size:15.5px;font-weight:700;color:#334155;padding:0 2px;}
  .cb{display:flex;align-items:center;gap:6px;font-size:15.5px;font-weight:700;color:#334155;line-height:1.25;white-space:nowrap;}
  .cb i{flex:0 0 auto;width:18px;height:18px;border:2px solid #94A3B8;border-radius:4px;display:flex;align-items:center;justify-content:center;}
  .cb.on{color:#0F5F59;font-weight:900;background:#DDF4F0;border-radius:6px;margin:0 -3px;padding:1px 3px;}
  .cb.on i{background:#0F766E;border-color:#0F766E;}
  .cb.on i svg{width:13px;height:13px;color:#fff;}
  .send{margin-top:auto;text-align:center;background:#0F766E;color:#fff;border-radius:7px;padding:4px;font-size:15.5px;font-weight:900;
    box-shadow:0 0 0 3px #99F6E4;}
  .tapc{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;}
  .tapc .tp{font-size:16px;font-weight:900;color:#0F5F59;line-height:1.35;background:#fff;border:2px solid #99DCD3;border-radius:9px;padding:6px 8px;}
  .tapc .tp b{color:var(--orange);}
  .tapc .tm{align-self:flex-start;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:#fff;background:#1B2A44;border-radius:7px;padding:2px 9px;}
  /* 中央のエンジン */
  .eng{flex:0 0 104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .eng img.pa{width:66px;height:66px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 4px 10px rgba(30,58,138,.28);}
  .eng .pill{font-size:15.5px;font-weight:900;color:#fff;background:#2563EB;border-radius:999px;padding:3px 11px;white-space:nowrap;}
  .eng .lb{font-size:15.5px;font-weight:900;color:var(--blue-dark);text-align:center;line-height:1.35;}
  .eng .ar{width:100px;height:30px;}
  /* 右：会場スクリーン */
  .room{flex:1;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;border-radius:14px;padding:8px 10px 10px;
    background:linear-gradient(180deg,#334155,#1E293B);box-shadow:0 6px 16px rgba(15,23,42,.35);}
  .room .rl{flex:0 0 auto;display:flex;align-items:center;gap:8px;color:#E2E8F0;font-size:16px;font-weight:900;margin-bottom:6px;}
  .room .rl .live{background:#DC2626;color:#fff;border-radius:6px;padding:1px 8px;font-size:14.5px;}
  .room .rl .pj{width:30px;height:24px;}
  .tm2{flex:1;min-height:0;display:flex;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #F8FAFC,0 0 30px rgba(255,255,255,.18);}
  .rail{flex:0 0 46px;background:#EBEBF5;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px;}
  .rail span{width:26px;height:26px;border-radius:7px;background:#C5C6E8;}
  .rail span.on{background:#5B5FC7;}
  .chn{flex:1;min-width:0;display:flex;flex-direction:column;}
  .chh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1.5px solid #E5E7EB;}
  .chh img{width:28px;height:28px;}
  .chh .t{font-size:18px;font-weight:900;color:#1F2937;}
  .chh .t small{font-size:15.5px;color:#64748B;font-weight:700;margin-left:4px;}
  .chh .tab{margin-left:auto;font-size:15px;font-weight:900;color:#5B5FC7;border-bottom:3px solid #5B5FC7;padding:0 4px 2px;}
  .feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:8px 12px 8px;background:#F5F5F5;}
  .post{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 10px;}
  .post .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#fff;border:1.5px solid #E2E8F0;padding:4px;}
  .post .pb{flex:1;min-width:0;}
  .post .meta{display:flex;align-items:baseline;gap:8px;font-size:14.5px;font-weight:900;color:#475569;}
  .post .meta .tt{font-family:'Roboto Mono',monospace;font-weight:700;color:#94A3B8;}
  .post .tx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:19px;font-weight:900;color:#1F2937;line-height:1.3;}
  .post .tx .who{color:#1F2937;}
  .post .tx .ck{display:inline-flex;align-items:center;gap:5px;background:#EEF0FF;border:1.5px solid #B4B8F0;color:#3B3FA0;border-radius:7px;padding:0 9px;font-size:18px;}
  .post .tx .ck svg{width:16px;height:16px;}
  .post.old{opacity:.86;}
  .post.nw{border:2.5px solid #16A34A;background:#F0FDF4;box-shadow:0 0 0 4px rgba(22,163,74,.16),0 6px 14px rgba(22,101,52,.18);transform:translateX(-4px);}
  .post.nw .tx{font-size:21px;}
  .nwb{flex:0 0 auto;align-self:center;display:flex;align-items:center;gap:4px;background:#16A34A;color:#fff;border-radius:999px;padding:2px 10px;font-size:15px;font-weight:900;white-space:nowrap;}
  .cmp{flex:0 0 auto;margin:0 12px 8px;border:1.5px solid #E2E8F0;border-radius:7px;padding:5px 10px;font-size:15px;font-weight:700;color:#94A3B8;background:#fff;padding-right:130px;}
  .room .ch{position:absolute;right:-8px;bottom:-6px;height:122px;z-index:6;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));}
  .bot{flex:0 0 auto;margin:8px 16px 0;display:flex;gap:10px;align-items:stretch;}
  .bot .uses{flex:1;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:5px 10px;}
  .metric .mv{font-size:22px;}
  .next{margin-top:8px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};
const SH=(id,c)=>`<filter id="${id}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="${c||'#1B2A44'}" flood-opacity=".28"/></filter>`;

/* QRコード（見た目だけの模様。決まった並びで描く）*/
const QR=(x,y,s)=>{const n=21,c=s/n;let r='';let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const fin=(i,j)=>(i<7&&j<7)||(i<7&&j>=n-7)||(i>=n-7&&j<7);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(fin(i,j))continue;if(rnd()<.47)r+=`<rect x="${x+j*c}" y="${y+i*c}" width="${c+.2}" height="${c+.2}" fill="#111827"/>`;}
  const F=(fx,fy)=>`<rect x="${fx}" y="${fy}" width="${7*c}" height="${7*c}" fill="#111827"/><rect x="${fx+c}" y="${fy+c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${fx+2*c}" y="${fy+2*c}" width="${3*c}" height="${3*c}" fill="#111827"/>`;
  return `<rect x="${x-c}" y="${y-c}" width="${s+2*c}" height="${s+2*c}" fill="#fff"/>${r}${F(x,y)}${F(x+(n-7)*c,y)}${F(x,y+(n-7)*c)}`;};

/* ① 会場のスライドに出たQRをスマホで読む */
const s1=`<svg viewBox="0 0 350 122" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('f1','#0F3D38')}<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE9E4"/><stop offset="1" stop-color="#B6DDD6"/></linearGradient></defs>
  <rect width="350" height="122" fill="url(#wall)"/>
  <g filter="url(#f1)"><rect x="10" y="6" width="222" height="110" rx="5" fill="#fff" stroke="#94A3B8" stroke-width="2"/>
    <rect x="10" y="6" width="222" height="20" rx="5" fill="#2563EB"/><rect x="10" y="20" width="222" height="6" fill="#2563EB"/>
    <text x="20" y="21" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#fff">アンケートにご協力ください</text>
    <text x="20" y="46" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#1F2937">使ってみたい</text>
    <text x="20" y="64" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#1F2937">フローは？</text>
    <text x="20" y="88" font-family="Noto Sans JP" font-size="11.5" font-weight="700" fill="#475569">スマホで読み取り</text>
    <text x="20" y="104" font-family="Noto Sans JP" font-size="11.5" font-weight="700" fill="#475569">チェックして送信</text>
    ${QR(140,34,72)}</g>
  <g filter="url(#f1)" transform="rotate(8 292 70)"><rect x="252" y="12" width="80" height="112" rx="12" fill="#1F2937"/>
    <rect x="258" y="22" width="68" height="86" rx="4" fill="#0F172A"/>
    ${QR(273,36,38)}
    ${[[268,30],[316,30],[268,84],[316,84]].map((p,i)=>`<path d="M${p[0]} ${p[1]+(i<2?9:-9)} V ${p[1]} H ${p[0]+(i%2?-9:9)}" stroke="#FDE68A" stroke-width="3" fill="none"/>`).join('')}
    <rect x="266" y="90" width="52" height="12" rx="6" fill="#0F766E"/><text x="292" y="99" font-family="Noto Sans JP" font-size="8.5" font-weight="900" fill="#fff" text-anchor="middle">フォームを開く</text></g>
  <path d="M232 64 Q 243 58 254 64" stroke="#0F766E" stroke-width="2.4" stroke-dasharray="4 3" fill="none"/>
</svg>`;

const ck=svgw(P.check,3.4);
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.151-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">スライドのQRから答えると、<br><span class="hl">回答がその場で会場のTeams画面に流れる</span></div>
    <img class="title-chara" src="${A}chara/chara_surprise.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">参加者はスマホのFormsで<b>チェックを入れて送信するだけ</b>。<br>フローが1件ずつ発表用チャネルに投稿し、投影中の画面に流れるので<b>挙手も集計も要らない</b></div>
  </div>

  <div class="stage">
    <div class="lft">
      <div class="lh"><span class="n">1</span>スライドのQRを読む</div>
      <div class="qrs">${s1}</div>
      <div class="lh"><span class="n">2</span>チェックして送信</div>
      <div class="ph2">
        <div class="phone"><div class="scr">
          <div class="fh">勉強会アンケート</div>
          <div class="fb">
            <div class="fq">1. 表示名</div>
            <div class="fin">山田</div>
            <div class="fq">2. 使ってみたいもの</div>
            <div class="cb on"><i>${ck}</i>承認フロー</div>
            <div class="cb"><i></i>経費精算</div>
            <div class="send">送信</div>
          </div>
        </div></div>
        <div class="tapc">
          <span class="tm">14:05:12</span>
          <div class="tp">会場の席から<br><b>スマホだけ</b>で<br>回答できる</div>
          <div class="tp">QRを読むと<br><b>フォームが開く</b></div>
        </div>
      </div>
    </div>

    <div class="eng">
      <img class="pa" src="${A}icons/pa_logo.png" alt="">
      <span class="pill">⚡ 自動で投稿</span>
      <svg class="ar" viewBox="0 0 100 30"><path d="M4 15 H 84" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><path d="M76 5 l14 10 l-14 10" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="lb">回答1件ごとに<br>チャネルへ<br>1投稿</div>
    </div>

    <div class="room">
      <div class="rl"><svg class="pj" viewBox="0 0 30 24"><rect x="2" y="7" width="26" height="13" rx="3" fill="#CBD5E1"/><circle cx="20" cy="13.5" r="4.2" fill="#1E293B"/><circle cx="20" cy="13.5" r="2" fill="#93C5FD"/><rect x="5" y="10" width="8" height="2.4" rx="1" fill="#64748B"/></svg>会場スクリーン<span class="live">● 投影中</span></div>
      <div class="tm2">
        <div class="rail"><span></span><span class="on"></span><span></span><span></span></div>
        <div class="chn">
          <div class="chh"><img src="${A}icons/ms/teams.svg" alt=""><span class="t">勉強会ライブ<small>＞ 会場スクリーン</small></span><span class="tab">投稿</span></div>
          <div class="feed">
            <div class="post old"><img class="av" src="${A}icons/pa_logo.png" alt=""><div class="pb"><div class="meta">Flow ボット<span class="tt">14:04</span></div>
              <div class="tx"><span class="who">佐藤さん</span><span class="ck">${ck}会議の議事録</span></div></div></div>
            <div class="post old"><img class="av" src="${A}icons/pa_logo.png" alt=""><div class="pb"><div class="meta">Flow ボット<span class="tt">14:04</span></div>
              <div class="tx"><span class="who">鈴木さん</span><span class="ck">${ck}経費精算</span></div></div></div>
            <div class="post"><img class="av" src="${A}icons/pa_logo.png" alt=""><div class="pb"><div class="meta">Flow ボット<span class="tt">14:05</span></div>
              <div class="tx"><span class="who">田中さん</span><span class="ck">${ck}承認フロー</span></div></div></div>
            <div class="post nw"><img class="av" src="${A}icons/pa_logo.png" alt=""><div class="pb"><div class="meta">Flow ボット<span class="tt">14:05</span><span class="nwb">⚡ いま届いた</span></div>
              <div class="tx"><span class="who">山田さん</span><span class="ck">${ck}承認フロー</span></div></div></div>
          </div>
          <div class="cmp">新しい投稿を開始する</div>
        </div>
      </div>
      <img class="ch chara" src="${A}chara/chara_smile.png" alt="">
    </div>
  </div>

  <div class="bot">
    <div class="metric"><span class="ml">会場の声を集める手間</span><span class="mv">挙手して数える</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">QRを1つ映す</span></div>
    <div class="uses"><span class="ul">誰に刺さる</span><span class="u">勉強会・コミュニティ運営</span><span class="u">社内研修の講師</span><span class="u">全社説明会の事務局</span></div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>Forms ＋ Teams の標準コネクタだけで作れます。<b>作り方は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「Microsoft Forms コネクタ」「Microsoft Teams コネクタ」／人名・回答は架空の例</div>
`;
</script>
</body>
</html>
