<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.9-2 出てきたものは検品する</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:13px;}
  .panel{padding:10px 13px 12px;}
  .qmark{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--red-line);
    border-radius:10px;padding:8px 12px;margin-bottom:8px;}
  .qmark .qq2{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;
    font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .qmark .qt2{flex:1;font-size:17.5px;font-weight:900;color:var(--red-dark);line-height:1.24;}

  .xls{flex:0 0 auto;display:flex;flex-direction:column;border:1px solid #D1D1D1;background:#fff;}
  .xls .row{display:flex;border-bottom:1px solid #E1DFDD;}
  .xls .row:last-child{border-bottom:none;}
  .xls .row.hd{background:#217346;color:#fff;font-weight:900;}
  .xls .c{flex:1;padding:3px 7px;font-size:13px;font-weight:700;border-right:1px solid #E1DFDD;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .xls .c:last-child{border-right:none;}
  .xls .c.n{flex:0 0 38px;text-align:center;color:#5B21B6;}
  .xls .row.hd .c.n{color:#fff;}
  .xls .row.mark{background:#FFF3CD;}
  .cnt3{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:#FFECEC;border:2px solid var(--red);
    border-radius:9px;padding:7px 11px;margin-top:8px;font-size:16px;font-weight:900;color:var(--red-dark);}
  .cnt3 b{font-size:22px;color:var(--red);}
  .why{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .src2{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--cs-line);
    border-radius:10px;overflow:hidden;}
  .src2 .sh2{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--cs-bg2);
    border-bottom:1px solid var(--cs-line);font-size:14.5px;font-weight:900;color:var(--cs-dark);}
  .src2 .sh2 .num2{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--cs);color:#fff;
    font-size:13px;display:flex;align-items:center;justify-content:center;}
  .src2 .sb2{flex:1;min-height:0;padding:7px 10px;font-family:'Roboto Mono',monospace;font-size:13.5px;
    font-weight:700;color:#334155;line-height:1.5;}
  .src2 .hl2{background:#FDE68A;color:#7A4E06;border-radius:3px;padding:0 3px;}
  .ans{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#EAF9F1;border:2px solid var(--green);
    border-radius:10px;padding:8px 12px;}
  .ans .ai4{flex:0 0 auto;width:34px;height:34px;border-radius:9px;padding:5px;
    background:linear-gradient(120deg,#7C3AED,#C026D3 55%,#EC4899);display:flex;align-items:center;justify-content:center;}
  .ans .at2{flex:1;font-size:17px;font-weight:900;color:var(--green-dark);line-height:1.26;}
  .ans .at2 b{color:var(--cs);}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const SPARK=`<svg viewBox="0 0 24 24" fill="#fff" style="width:100%;height:100%" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2.2l1.9 5.1 5.1 1.9-5.1 1.9L12 16.2l-1.9-5.1L5 9.2l5.1-1.9z"/>
  <path d="M18.6 14.6l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.9</div>
    <div class="part-pill">後編 <b>(2/2)</b></div>
    <div class="title-text">出てきたものは、検品する<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_think_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">生成物が古かったのは<b>AIの作り話ではありません</b>。<br>
      <em>指示文とナレッジが古いまま</em>で、AIはそれを素直に反映しただけでした。</div>
  </div>

  <div class="body">
    <div class="panel p-ng">
      <div class="qmark"><span class="qq2">?</span>
        <span class="qt2">AIが勝手に、古い数字を書いた？</span></div>
      <div class="dlabel"><span class="dot"></span>できあがった Excel</div>
      <div class="xls seg">
        <div class="row hd"><span class="c n">回</span><span class="c">テーマ</span></div>
        <div class="row"><span class="c n">12</span><span class="c">アダプティブカード</span></div>
        <div class="row"><span class="c n">13</span><span class="c">条件で分ける</span></div>
        <div class="row mark"><span class="c n">14</span><span class="c">Excelマクロを置きかえる</span></div>
      </div>
      <div class="cnt3">最終行が <b>14</b> で止まっている</div>
      <div class="dlabel" style="margin-top:10px;"><span class="dot"></span>そのとき実際は</div>
      <div class="cnt3" style="background:#EAF9F1;border-color:var(--green);color:var(--green-dark);">
        開催は <b style="color:var(--green)">24</b> 回まで進んでいた</div>
    </div>

    <div class="panel p-cs">
      <div class="dlabel"><span class="dot"></span>原因は、AIの外側に2か所あった</div>
      <div class="why">
        <div class="src2">
          <div class="sh2"><span class="num2">1</span>エージェントの Instructions（1行目）</div>
          <div class="sb2 seg">あなたは PA45（毎週45分のハンズオン、<span class="hl2">全14回</span>）の
            案内係です。参加者からの質問に、資料をもとに答えてください。</div>
        </div>
        <div class="src2">
          <div class="sh2"><span class="num2">2</span>ナレッジに入れた copasta45-knowledge.txt</div>
          <div class="sb2 seg">■ 開催実績<br>
            第1回 … 第<span class="hl2">14</span>回（ここで更新が止まっている）</div>
        </div>
        <div class="ans"><span class="ai4">${SPARK}</span>
          <span class="at2">AIは<b>渡されたとおりに</b>作っただけ。<br>直すのは指示文とナレッジのほう</span></div>
      </div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">検品のしかた（毎回この3つ）</div>
      <div class="grid">
        <div class="fc"><div class="ft">① 数字を数える</div><div class="fd">件数・合計・最終行が、いまの実態と合っているか</div></div>
        <div class="fc"><div class="ft">② 出どころを疑う</div><div class="fd">おかしければ、指示文とナレッジの中身を先に見る</div></div>
        <div class="fc"><div class="ft">③ 直したら作り直す</div><div class="fd">元を直してから、もう一度同じ依頼で出させる</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ ナレッジの更新で注意</div>
      <div class="txt">同じ名前で入れ直しても<b>上書きされません</b>。<br>
        古いファイルを<b>削除してから</b>入れ直します。</div>
    </div>
    <div class="src">出典：PA45 Demo環境での実機／画面は説明用の再現です</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_point_g.png" alt="">
`;
</script>
</body>
</html>
