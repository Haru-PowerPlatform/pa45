<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.51-2 検品3点の実画面｜どこを見て何を直すか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:30px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:140px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:17.5px;color:var(--blue-dark);line-height:1.32;padding-right:92px;}
  .concl .txt b{color:var(--orange);}

  .cols{flex:1 1 auto;margin:11px 15px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .carrow{flex:0 0 32px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;}
  .carrow svg{width:30px;height:30px;}
  .colcard{flex:1;background:#fff;border:1.5px solid #C9D2E0;border-radius:13px;box-shadow:0 5px 13px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;}
  .cnum{position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;border:2.5px solid #fff;}
  .ch{display:flex;align-items:center;gap:11px;padding:10px 34px 10px 13px;min-height:60px;background:#fff;border-bottom:1px solid #EDEFF2;position:relative;}
  .ch .sq{flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid #EAECEF;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .ch .sq img{width:28px;height:28px;object-fit:contain;}
  .ch .nm{flex:1;font-weight:900;font-size:15.5px;color:var(--ink);line-height:1.18;}
  .ch .nm small{display:block;font-weight:700;font-size:11.5px;color:var(--weak);margin-top:2px;}
  .ch .dots{position:absolute;right:12px;top:11px;color:#9AA3AF;font-size:19px;font-weight:900;line-height:1;}

  .cp{flex:1;font-family:'Segoe UI','Noto Sans JP',sans-serif;padding:0 12px 9px;display:flex;flex-direction:column;gap:0;}
  .ptop{flex:0 0 248px;display:flex;flex-direction:column;gap:6px;overflow:hidden;background:#fff;padding:8px 2px 4px;}
  .sect{font-size:13px;font-weight:900;color:#5A6B85;display:flex;align-items:center;gap:6px;}
  .sect::before{content:"";width:5px;height:14px;border-radius:2px;background:#8FA0BC;}
  .fld{display:flex;flex-direction:column;gap:3px;}
  .fld .l{font-size:13px;color:#605E5C;font-weight:800;line-height:1.2;}
  .fld .l .req{color:#D13438;margin-left:1px;}
  .fld .v{border:1px solid #D1D1D1;border-radius:6px;padding:6px 10px;font-size:14px;color:#242424;background:#fff;display:flex;align-items:center;gap:9px;font-weight:700;}
  .fld .v.ph{color:#A19F9D;font-weight:600;}
  .fld .v .cr{margin-left:auto;flex:0 0 auto;color:#605E5C;font-weight:900;font-size:11px;}
  .fld .v.err{border:1.5px solid #D13438;background:#FDF3F4;}
  .alert{font-size:12.5px;font-weight:800;color:#D13438;}
  .dyn{display:inline-flex;align-items:center;gap:7px;background:#EAF1FE;border:1.5px solid #BBD0EE;border-radius:6px;padding:6px 11px;font-size:14px;font-weight:800;color:#1E40AF;align-self:flex-start;}
  .dyn svg{width:14px;height:14px;flex:0 0 auto;}
  .okpill{display:inline-flex;align-items:center;gap:6px;background:#ECFDF3;border:1.5px solid #86E0AC;border-radius:999px;padding:4px 11px;font-weight:900;font-size:12.5px;color:#0B5E37;align-self:flex-start;}
  .okpill img{width:15px;height:15px;}

  /* フローチェッカー風 */
  .fc-banner{background:#FDF3F4;border:1.5px solid #E8B4B9;border-radius:7px;padding:7px 10px;font-size:12.5px;font-weight:800;color:#8E2033;line-height:1.35;}
  .fc-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:900;color:#242424;padding-bottom:4px;border-bottom:1px solid #E5E7EB;}
  .fc-h .cnt{margin-left:auto;font-size:12px;color:#8E2033;background:#FBE4E9;border-radius:999px;padding:1px 9px;font-weight:900;}
  .fc-item{display:flex;flex-direction:column;gap:2px;background:#FAFAFB;border:1px solid #E5E7EB;border-radius:7px;padding:6px 9px;}
  .fc-item .t1{font-size:12px;font-weight:900;color:#605E5C;}
  .fc-item .t2{font-size:13.5px;font-weight:800;color:#242424;}
  .fc-item .t3{font-size:12.5px;font-weight:800;color:#D13438;}
  .fc-item .open{font-size:12.5px;font-weight:900;color:#2563EB;}

  .howsteps{flex:1;margin-top:7px;background:linear-gradient(180deg,#F5F8FD,#EEF3FA);border:1px solid #D7E1F0;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:6px;}
  .howsteps .hh{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:900;color:#2B3A52;}
  .howsteps .hh::before{content:"";width:5px;height:15px;border-radius:2px;background:#2563EB;}
  .howsteps ol{list-style:none;display:flex;flex-direction:column;justify-content:space-evenly;flex:1;gap:5px;}
  .howsteps li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;font-weight:700;color:#2F3E57;line-height:1.28;}
  .howsteps li .sn{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:#2563EB;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .howsteps li b{color:#1E40AF;}
  .howsteps li.key{color:#0B5E37;} .howsteps li.key .sn{background:#16A34A;} .howsteps li.key b{color:#0B5E37;}

  .pitfall{flex:0 0 auto;margin:9px 15px 11px;background:linear-gradient(180deg,#FFF7ED,#FFEFD9);border:2px solid #FDBA74;border-radius:13px;padding:9px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 6px rgba(0,0,0,.07);position:relative;}
  .pitfall .pl{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FB923C,#EA580C);color:#fff;font-weight:900;font-size:15px;border-radius:9px;padding:8px 13px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .pitfall .pl svg{width:17px;height:17px;}
  .pitfall .px{flex:1;font-weight:800;font-size:15px;color:#7C2D12;line-height:1.36;padding-right:100px;}
  .pitfall .px b{color:var(--orange);}
  .pit-chara{position:absolute;right:12px;bottom:-2px;height:100px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 zap:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.51-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">検品3点の実画面｜<span class="hl">どこを見て、何を直すか</span></div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">味見の順番は<b>①トリガーの詳細設定→②空欄→③保存して フロー チェッカー</b>。<br>ぜんぶ実画面のこの場所を見るだけ。慣れれば<b>1分で終わる</b>検品です。</div>
  </div>

  <div class="cols">
    <div class="col">
      <div class="cnum">1</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_outlook.png" alt=""></span><span class="nm">新しいメールが届いたとき (V3)<small>トリガーの詳細パラメーターを確認</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="ptop">
            <div class="sect">詳細パラメーター（2/9 を表示しています）</div>
            <div class="fld"><span class="l">添付ファイルを含める</span><span class="v">はい<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">添付ファイル付きのみ</span><span class="v">はい<span class="cr">▾</span></span></div>
            <div class="okpill"><img src="${A}icons/icon_check_green.png" alt="">2つとも「はい」ならOK</div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>トリガーのカードを<b>クリック</b></span></li>
              <li class="key"><span class="sn">2</span><span><b>詳細パラメーター</b>の2つが「はい」か</span></li>
              <li><span class="sn">3</span><span>「いいえ」なら<b>▾で切り替え</b></span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">2</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_onedrive.png" alt=""></span><span class="nm">ファイルの作成<small>空欄＝人が決める欄。⚡はAIが配線済み</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="ptop">
            <div class="fld"><span class="l">フォルダーのパス <span class="req">*</span></span><span class="v ph err">フォルダーの一意のパス。</span></div>
            <div class="alert">'フォルダーのパス' は必須です。</div>
            <div class="fld"><span class="l">ファイル名</span><span class="dyn">${svg('zap')}名前</span></div>
            <div class="fld"><span class="l">ファイル コンテンツ</span><span class="dyn">${svg('zap')}コンテンツのバイト数</span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li class="key"><span class="sn">1</span><span>赤い欄＝<b>保存先が空</b>のサイン</span></li>
              <li><span class="sn">2</span><span>📁から<b>保存先フォルダーを選ぶ</b></span></li>
              <li><span class="sn">3</span><span>⚡トークンは<b>欄と中身の対応</b>を見る</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">3</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_logo.png" alt=""></span><span class="nm">保存 → フロー チェッカー<small>最後の検品係に見てもらう</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="ptop">
            <div class="fc-banner">'ファイルの作成' のパラメーターが無効です。エラー: 'フォルダーのパス' は必須です。</div>
            <div class="fc-h">フロー チェッカー<span class="cnt">エラー (1)・警告 (0)</span></div>
            <div class="fc-item"><span class="t1">操作エラー</span><span class="t2">ファイルの作成</span><span class="t3">'フォルダーのパス' は必須です。</span><span class="open">操作を開く</span></div>
            <div class="okpill"><img src="${A}icons/icon_check_green.png" alt="">エラー0になったら動かしてOK</div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>右上の<b>保存</b>を押す</span></li>
              <li class="key"><span class="sn">2</span><span>エラーが出たら<b>「操作を開く」</b>で直行</span></li>
              <li><span class="sn">3</span><span>直して再保存→<b>エラー0を確認</b></span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="pitfall">
    <div class="pl">${svg('warn')}つまずき注意</div>
    <div class="px">フロー チェッカーが見るのは<b>「保存できるか」まで</b>。宛先の間違いや保存先の場所ちがいは検出できない→<b>テスト実行して結果を1回見る</b>のが本当の仕上げ。</div>
    <img class="pit-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="src">出典：Power Automate 実機（PA45 Demo）／Microsoft Learn</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
