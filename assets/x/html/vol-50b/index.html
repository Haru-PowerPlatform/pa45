<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.50-2 そのまま使える“頼み方テンプレ”4選</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --enji:#A4283C; --enji-dark:#6E1628;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:30px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:140px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-20px;height:112px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .grid{flex:1 1 auto;margin:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:11px;min-height:0;}
  .tcard{border-radius:14px;background:#F8F9FA;border:2px solid;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.75);display:flex;flex-direction:column;justify-content:space-evenly;padding:10px 14px 10px;min-height:0;position:relative;overflow:hidden;}
  .tcard.c1{border-color:var(--blue);} .tcard.c2{border-color:var(--green);} .tcard.c3{border-color:var(--cop);} .tcard.c4{border-color:var(--enji);}
  .thd{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .thd .chip{color:#fff;font-weight:900;font-size:16.5px;border-radius:9px;padding:5px 13px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 5px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4);}
  .c1 .chip{background:linear-gradient(180deg,#3B82F6,#2563EB);} .c2 .chip{background:linear-gradient(180deg,#22C55E,#16A34A);}
  .c3 .chip{background:linear-gradient(180deg,#9F67F0,#7C3AED);} .c4 .chip{background:linear-gradient(180deg,#C04358,#A4283C);}
  .thd .use{margin-left:auto;font-weight:800;font-size:13px;color:var(--weak);}
  .tpl{background:#fff;border:1.5px solid #D8DEE8;border-radius:10px;padding:10px 13px;font-size:17px;font-weight:800;line-height:1.5;color:var(--ink);box-shadow:0 2px 5px rgba(0,0,0,.06);}
  .tpl .ph{border-radius:6px;padding:0 6px;font-weight:900;}
  .c1 .tpl .ph{background:#DBEAFE;color:#1E40AF;} .c2 .tpl .ph{background:#D1FAE5;color:#065F46;}
  .c3 .tpl .ph{background:#EDE9FE;color:#5B21B6;} .c4 .tpl .ph{background:#FBE4E9;color:#8E2033;}
  .ex{display:flex;align-items:flex-start;gap:9px;font-size:14.5px;font-weight:700;color:#4B5563;line-height:1.4;}
  .ex img{flex:0 0 auto;width:22px;height:22px;object-fit:contain;margin-top:1px;}
  .ex span{flex:1;}
  .ex b{color:var(--blue-dark);}

  .coach{flex:0 0 auto;margin:11px 16px 12px;background:linear-gradient(180deg,#565C66,#4A4F58);border-radius:13px;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 9px rgba(0,0,0,.18);position:relative;}
  .coach .cl{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--cop-grad,linear-gradient(120deg,#7C3AED,#C026D3 60%,#EC4899));color:#fff;font-weight:900;font-size:15.5px;border-radius:9px;padding:8px 14px;box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .coach .cl img{width:20px;height:20px;object-fit:contain;background:#fff;border-radius:5px;padding:2px;}
  .coach .cx{flex:1;color:#fff;font-weight:800;font-size:15.5px;line-height:1.4;padding-right:108px;}
  .coach .cx b{color:#FCD34D;}
  .coach-chara{position:absolute;right:14px;bottom:-2px;height:102px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.50-2</div>
    <img class="vol-logo" src="${A}icons/copilot_m365.png" alt="">
    <div class="title-text">コピペで使える<span class="hl">“頼み方テンプレ”4選</span></div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>

  <div class="grid">
    <div class="tcard c1">
      <div class="thd"><span class="chip">① 作りたい</span><span class="use">新しく自動化を始めるとき</span></div>
      <div class="tpl">Power Automateで、<span class="ph">◯◯が起きたら</span><span class="ph">△△する</span>フローを作りたいです。<br>初心者なので、作る手順をわかりやすく教えてください。</div>
      <div class="ex"><img src="${A}icons/pa_outlook.png" alt=""><span>実例：「メールに添付が届いたら<b>OneDriveに保存</b>」<br>→ 手順①〜⑧のレシピが一発で返ってきた（Vol.49）</span></div>
    </div>

    <div class="tcard c2">
      <div class="thd"><span class="chip">② 変えたい</span><span class="use">できたフローを育てるとき</span></div>
      <div class="tpl">フローができました。<br>追加で<span class="ph">□□するように変えたい</span>です。どこをどう変更すればいいですか？</div>
      <div class="ex"><img src="${A}icons/pa_control.png" alt=""><span>実例：「<b>PDFの添付だけ</b>保存に変えたい」<br>→ 条件を1つ足す手順が返ってきた（詳しくは Vol.52）</span></div>
    </div>

    <div class="tcard c3">
      <div class="thd"><span class="chip">③ 知りたい</span><span class="use">画面や用語が分からないとき</span></div>
      <div class="tpl"><span class="ph">◇◇（用語・アクション名）</span>って何ですか？<br>何のためにあるのか、初心者向けにたとえで教えてください。</div>
      <div class="ex"><img src="${A}icons/copilot_m365.png" alt=""><span>実例：「<b>Apply to each</b>って何？」<br>→ “添付ファイルごとに繰り返す係”と平易に返ってくる</span></div>
    </div>

    <div class="tcard c4">
      <div class="thd"><span class="chip">④ 直したい</span><span class="use">エラーで止まったとき</span></div>
      <div class="tpl">保存しようとしたら「<span class="ph">エラー文をそのまま貼る</span>」と出ました。<br>意味と直し方を初心者向けに教えてください。</div>
      <div class="ex"><img src="${A}icons/icon_check_green.png" alt=""><span>実例：「'フォルダーのパス' は必須です」<br>→ <b>意味の翻訳＋直す場所</b>が返ってきた（詳しくは Vol.53）</span></div>
    </div>
  </div>

  <div class="coach">
    <div class="cl"><img src="${A}icons/copilot_m365.png" alt="">共通のコツ</div>
    <div class="cx">ぜんぶ<b>日本語でOK</b>。1回で伝わらなくても、<b>会話で追加注文</b>すればいい。新人さんに仕事を頼むときと同じで、<b>具体的に・レベル感を添えて</b>が近道。</div>
    <img class="coach-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
  <div class="src">出典：Microsoft 365 Copilot 実機</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
