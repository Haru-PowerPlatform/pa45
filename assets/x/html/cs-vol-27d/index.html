<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.27-4 トリガー早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;}
  .tbl{flex:1.42;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:2px solid var(--cs-line);
    box-shadow:0 6px 14px rgba(0,0,0,.12);background:#fff;}
  .cap{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--cs-bg);border-bottom:2px solid var(--cs-line);font-size:19px;font-weight:900;color:var(--navy);}
  .tr{flex:1;min-height:0;display:flex;align-items:center;border-bottom:1.5px solid #EDE9FE;}
  .tr:last-child{border-bottom:none;}
  .tr.h{flex:0 0 30px;background:#FAFAFA;}
  .tr.h .tc{font-size:14px;font-weight:800;color:#6B7280;}
  .tr.dim{background:#F9FAFB;}
  .tc{padding:3px 10px;font-size:15.5px;font-weight:700;color:#374151;line-height:1.36;}
  .tc.k{flex:0 0 200px;font-size:17px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px;line-height:1.25;}
  .tc.k img,.tc.k svg{flex:0 0 30px;width:30px;height:30px;}
  .tc.k small{display:block;font-size:13px;font-weight:700;color:#6B7280;}
  .tc.u{flex:1;min-width:0;color:#1B2A44;}
  .tc.u b{color:var(--cs-dark);}
  .tc.r{flex:0 0 150px;}
  .pill{display:inline-block;font-size:14px;font-weight:900;border-radius:999px;padding:3px 10px;white-space:nowrap;}
  .pill.n{background:#DBEAFE;color:#1E40AF;} .pill.s{background:#FEF3C7;color:#92400E;} .pill.x{background:#F3F4F6;color:#6B7280;}
  .right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .dlg{flex:0 0 auto;}
  .dlg .wb{display:flex;flex-direction:column;gap:7px;padding:9px 12px 11px;}
  .dlg .hd{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:#242424;}
  .dlg .hd i{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#16A34A;display:flex;align-items:center;justify-content:center;}
  .opt{display:flex;gap:10px;align-items:center;border:1.5px solid #E1DFDD;border-radius:8px;padding:6px 10px;}
  .opt.on{border:2.4px solid #0F6CBD;background:#EFF6FF;}
  .opt .ra{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:2px solid #8A8886;position:relative;}
  .opt.on .ra{border-color:#0F6CBD;} .opt.on .ra::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0F6CBD;}
  .opt .t{flex:1;min-width:0;font-size:16px;font-weight:800;color:#242424;line-height:1.3;}
  .opt .t small{display:block;font-size:14.5px;font-weight:700;color:#4B5563;font-family:"Noto Sans JP";}
  .opt svg{flex:0 0 64px;width:64px;height:40px;}
  .fact{flex:1;min-height:0;display:flex;align-items:center;gap:16px;background:#FFFBEB;border:2px solid #F59E0B;border-radius:12px;padding:8px 12px;}
  .fact .t{font-size:21px;font-weight:900;color:var(--navy);line-height:1.3;}
  .fact .t small{display:block;font-size:16.5px;font-weight:700;color:#4B5563;line-height:1.4;margin-top:2px;}
  .fact svg{flex:0 0 160px;width:160px;height:134px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const T=(x,y,s,t,c='#1B2A44',w=800,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${s}" font-weight="${w}" fill="${c}" font-family="Noto Sans JP">${t}</text>`;
const CK='<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none"/></svg>';
const CLOCK=`<svg viewBox="0 0 30 30"><circle cx="15" cy="16" r="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><path d="M15 9 V16 L20 19" stroke="#92400E" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M5 6 l4 -3 M25 6 l-4 -3" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const CHAT=`<svg viewBox="0 0 30 30"><path d="M4 6 h22 a2 2 0 0 1 2 2 v12 a2 2 0 0 1 -2 2 h-12 l-6 5 v-5 h-4 a2 2 0 0 1 -2 -2 v-12 a2 2 0 0 1 2 -2z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><circle cx="10" cy="14" r="1.8" fill="#7C3AED"/><circle cx="15" cy="14" r="1.8" fill="#7C3AED"/><circle cx="20" cy="14" r="1.8" fill="#7C3AED"/></svg>`;
const ME=`<svg viewBox="0 0 64 40"><circle cx="20" cy="13" r="8" fill="#93C5FD"/><path d="M6 38 a14 11 0 0 1 28 0" fill="#93C5FD"/>
  <rect x="40" y="12" width="20" height="16" rx="3" fill="#0F6CBD"/><path d="M44 12 v-4 a6 6 0 0 1 12 0 v4" stroke="#0F6CBD" stroke-width="2.4" fill="none"/></svg>`;
const OTH=`<svg viewBox="0 0 64 40"><circle cx="12" cy="13" r="6" fill="#C4B5FD"/><path d="M2 36 a10 9 0 0 1 20 0" fill="#C4B5FD"/>
  <circle cx="32" cy="13" r="6" fill="#A7F3D0"/><path d="M22 36 a10 9 0 0 1 20 0" fill="#A7F3D0"/>
  <circle cx="52" cy="13" r="6" fill="#FDE68A"/><path d="M42 36 a10 9 0 0 1 20 0" fill="#FDE68A"/></svg>`;
const PUB=`<svg viewBox="0 0 86 72"><rect x="4" y="10" width="44" height="54" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="11" y="20" width="30" height="5" rx="2.5" fill="#D1D5DB"/><rect x="11" y="31" width="24" height="5" rx="2.5" fill="#D1D5DB"/><rect x="11" y="42" width="28" height="5" rx="2.5" fill="#D1D5DB"/>
  <path d="M52 37 H64" stroke="#B45309" stroke-width="2.6"/><path d="M62 31 L70 37 L62 43z" fill="#B45309"/>
  <circle cx="74" cy="37" r="10" fill="#16A34A"/><path d="M69 37 l3.5 3.5 l7 -7.5" stroke="#fff" stroke-width="2.6" fill="none"/>
  ${T(26,8,9,'下書き','#6B7280',800)}${T(74,62,9,'発行','#15803D',900)}</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.27</div>
    <div class="part-pill">早見表 <b>(4/4)</b></div>
    <div class="title-text">どの出来事で動かすか<br><span class="q">トリガー早見表</span></div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/outlook.svg" alt=""><span class="pl">+</span><img src="${A}icons/ms/sharepoint.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">早見表</div>
    <div class="txt">別件が次々届くものは<b>New chat each run</b>、毎日の続きものは<b>Same session</b>。<br>
      チームに配るときは、<em>使う人それぞれの接続で動く</em>形で共有できる。</div>
  </div>

  <div class="body">
    <div class="tbl">
      <div class="cap"><img class="msi" src="${A}icons/cs_logo.png" alt="">トリガーと使いどころ（例）</div>
      <div class="tr h"><div class="tc k">きっかけ</div><div class="tc u">使いどころの例</div><div class="tc r">実行先の目安</div></div>
      <div class="tr"><div class="tc k"><img src="${A}icons/ms/outlook.svg" alt=""><span>メールが届いた<small>New email</small></span></div>
        <div class="tc u">見積依頼の<b>要点と返信案</b>を<br>Teams で自分に送る</div><div class="tc r"><span class="pill n">New chat each run</span></div></div>
      <div class="tr"><div class="tc k"><img src="${A}icons/ms/sharepoint.svg" alt=""><span>リストに1行<small>SharePoint 項目の作成</small></span></div>
        <div class="tc u">申請の<b>記入漏れ</b>を見つけて<br>申請した人に知らせる</div><div class="tc r"><span class="pill n">New chat each run</span></div></div>
      <div class="tr"><div class="tc k">${CLOCK}<span>決まった時刻<small>Recurrence</small></span></div>
        <div class="tc u">毎朝、<b>前日からの続き</b>を<br>まとめて一覧にする</div><div class="tc r"><span class="pill s">Same session</span></div></div>
      <div class="tr dim"><div class="tc k">${CHAT}<span>話しかけた<small>Chat with the agent</small></span></div>
        <div class="tc u">いつもの会話。<br>話しかけたときだけ動く</div><div class="tc r"><span class="pill x">トリガー不要</span></div></div>
    </div>
    <div class="right">
      <div class="dlg win seg">
        <div class="wh"><img class="msi" src="${A}icons/cs_logo.png" alt="">発行のあとに出る画面</div>
        <div class="wb">
          <div class="hd"><i>${CK}</i>Your agent is published</div>
          <div class="opt on"><span class="ra"></span><span class="t">Activate for myself<small>自分だけ。自分の接続で動く</small></span>${ME}</div>
          <div class="opt"><span class="ra"></span><span class="t">Share with others<small>共有した人が自分の接続で使う</small></span>${OTH}</div>
        </div>
      </div>
      <div class="fact">${PUB}<span class="t">発行するまで自動では動かない<small>トリガー・指示・ツールを変えたら<br>もう一度発行する</small></span></div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">決まりごと（公式）</div>
      <div class="grid">
        <div class="fc"><div class="ft">共有先が触れる所</div><div class="fd">Editable by user を<br>オンにした項目だけ</div></div>
        <div class="fc"><div class="ft">更新したら</div><div class="fd">使う人に変更の<br>受け入れを求める</div></div>
        <div class="fc"><div class="ft">使った分の請求</div><div class="fd">置いてある環境で<br>まとめて数える</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">作る・試す段階から<b>クレジット</b>を使う。<br>消費はモニターのページで見られる。</div>
    </div>
    <div class="src">出典：Microsoft Learn（エージェントにトリガーを追加する（プレビュー）／使用量ベースの請求の概要）／使いどころは例・画面は説明用の再現</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_smile_g.png" alt="">
`;
</script>
</body>
</html>
