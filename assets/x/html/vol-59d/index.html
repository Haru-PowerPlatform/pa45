<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.59-4 まとめメール便の作り方 Teamsリンク付き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F38;
    --teams:#5B5FC7; --teams-dark:#4347A8;
    --amber:#D97706; --red:#DC2626;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .logos{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .logos .ll{height:48px;width:48px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .logos .plus{color:#fff;font-weight:900;font-size:24px;text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1;}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4);}
  .concl .txt{font-weight:800;font-size:17px;color:var(--blue-dark);line-height:1.32;padding-right:96px;}
  .concl .txt b{color:var(--orange);}

  .cols{flex:1 1 auto;margin:11px 15px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .carrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;}
  .carrow svg{width:26px;height:26px;}
  .colcard{flex:1;background:#fff;border:1.5px solid #C9D2E0;border-radius:13px;box-shadow:0 5px 13px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;}
  .cnum{position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;border:2.5px solid #fff;}
  .ch{display:flex;align-items:center;gap:11px;padding:9px 32px 9px 12px;min-height:58px;background:#fff;border-bottom:1px solid #EDEFF2;position:relative;}
  .ch .sq{flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid #EAECEF;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .ch .sq img{width:29px;height:29px;object-fit:contain;}
  .ch .sq.real{border:none;background:none;box-shadow:none;}
  .ch .sq.real img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
  .ch .nm{flex:1;font-weight:900;font-size:14px;color:var(--ink);line-height:1.16;}
  .ch .nm small{display:block;font-weight:700;font-size:11px;color:var(--weak);margin-top:2px;}
  .ch .dots{position:absolute;right:11px;top:10px;color:#9AA3AF;font-size:19px;font-weight:900;line-height:1;}

  .cp{flex:1;font-family:'Segoe UI','Noto Sans JP',sans-serif;padding:0 11px 8px;display:flex;flex-direction:column;gap:0;}
  .tabs{display:flex;align-items:center;gap:12px;padding:0 2px;border-bottom:1px solid #E5E7EB;}
  .tabs span{font-size:11.5px;font-weight:700;color:#605E5C;padding:6px 1px;white-space:nowrap;}
  .tabs span.on{color:#2563EB;font-weight:800;box-shadow:inset 0 -2.5px 0 #2563EB;}
  .ptop{flex:0 0 224px;display:flex;flex-direction:column;gap:5px;overflow:hidden;background:#fff;padding:9px 2px 4px;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .l{font-size:12px;color:#605E5C;font-weight:800;line-height:1.2;}
  .fld .l .req{color:#D13438;margin-left:1px;}
  .fld .v{border:1px solid #D1D1D1;border-radius:6px;padding:4px 9px;font-size:13px;color:#242424;background:#fff;display:flex;align-items:center;gap:7px;font-weight:700;}
  .fld .v .cr{margin-left:auto;flex:0 0 auto;color:#605E5C;font-weight:900;font-size:11px;}
  .dyn{display:inline-flex;align-items:center;gap:5px;background:#EAF1FE;border:1.5px solid #BBD0EE;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:800;color:#1E40AF;}
  .dyn svg{width:12px;height:12px;flex:0 0 auto;}
  .keyfld .v{border-color:#F5C451;background:#FFFBEB;}

  /* action list (col2) */
  .actlist{display:flex;flex-direction:column;gap:7px;}
  .act{display:flex;align-items:center;gap:9px;border:1px solid #DCE3EC;border-radius:9px;padding:7px 9px;background:#FCFDFF;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .act .ai{flex:0 0 auto;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .act .ai img{width:100%;height:100%;object-fit:cover;border-radius:7px;}
  .act .ai.plain{background:#EEF2F8;}
  .act .ai.plain img{width:19px;height:19px;object-fit:contain;border-radius:0;}
  .act .an{font-size:13px;font-weight:900;color:#242424;line-height:1.2;}
  .act .an small{display:block;font-size:11px;font-weight:700;color:#8A8F98;margin-top:1px;}
  .filt{background:#F2FCF6;border:1px solid #A7DEBD;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:800;color:#0B5E37;display:flex;align-items:center;gap:6px;}
  .filt .fx{background:#DCFCE7;border-radius:5px;padding:1px 7px;font-weight:900;}

  /* code (col3) */
  .codebox{background:#1F2937;border-radius:9px;padding:9px 11px;font-family:'Courier New',monospace;font-size:12.5px;color:#E5E7EB;font-weight:700;line-height:1.5;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .codebox .tag{color:#7DD3FC;}
  .codebox .at{color:#FBBF24;}
  .codebox .dyn2{background:#1E40AF;color:#DBEAFE;border-radius:4px;padding:0 5px;font-weight:900;}
  .codebox .tx{color:#fff;}
  .htmlon{display:inline-flex;align-items:center;gap:5px;background:#ECFDF5;border:1px solid #86D8A5;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:900;color:#0B5E37;align-self:flex-start;}
  .htmlon svg{width:13px;height:13px;}

  .howsteps{flex:1;margin-top:7px;background:linear-gradient(180deg,#F3F8FF,#E9F1FE);border:1px solid #CFE0F6;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;}
  .howsteps .hh{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:900;color:#1E40AF;}
  .howsteps .hh::before{content:"";width:5px;height:14px;border-radius:2px;background:#2563EB;}
  .howsteps ol{list-style:none;display:flex;flex-direction:column;justify-content:space-evenly;flex:1;gap:4px;}
  .howsteps li{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:700;color:#33415B;line-height:1.26;}
  .howsteps li .sn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#2563EB;color:#fff;font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .howsteps li b{color:#1E40AF;}
  .howsteps li.key{color:#0B5E37;} .howsteps li.key .sn{background:#16A34A;} .howsteps li.key b{color:#0B5E37;}

  .pitfall{flex:0 0 auto;margin:9px 15px 11px;background:linear-gradient(180deg,#FFF7ED,#FFEFD9);border:2px solid #FDBA74;border-radius:13px;padding:9px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 6px rgba(0,0,0,.07);position:relative;}
  .pitfall .pl{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FB923C,#EA580C);color:#fff;font-weight:900;font-size:15px;border-radius:9px;padding:8px 13px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .pitfall .pl svg{width:17px;height:17px;}
  .pitfall .px{flex:1;font-weight:800;font-size:14px;color:#7C2D12;line-height:1.55;padding-right:90px;}
  .pitfall .px .ph{white-space:nowrap;}
  .pitfall .px b{color:var(--orange);}
  .pitfall .px code{font-family:'Courier New',monospace;background:#fff;border:1px solid #F0C89B;border-radius:5px;padding:1px 6px;color:#9A3412;font-weight:800;}
  .pit-chara{position:absolute;right:12px;bottom:-2px;height:100px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 zap:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>',
 code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
 check:'<path d="M20 6 9 17l-5-5"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.59-4</div>
    <div class="logos"><img class="ll" src="${A}icons/pa_logo.png" alt=""><span class="plus">＋</span><img class="ll" src="${A}icons/pa_teams_official.png" alt=""></div>
    <div class="title-text">作り方②｜<span class="hl">“まとめメール便”＝Teamsへ飛ぶリンク付きで作る</span></div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">やることは<b>①メンションを記録（Teamsリンクも保存）→②決まった時間に未対応を集める→③HTML一覧でメール</b>。<br>カギは<b>リンクを&lt;a&gt;タグで貼る</b>こと。押すとTeamsの投稿へ直行。全部 標準・無料。</div>
  </div>

  <div class="cols">
    <div class="col">
      <div class="cnum">1</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_sharepoint.png" alt=""></span><span class="nm">項目の作成（記録）<small>SharePoint ／ ①のフローに1つ足す</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="tabs"><span class="on">パラメーター</span><span>設定</span><span>コード ビュー</span><span>詳細</span></div>
          <div class="ptop">
            <div class="fld"><span class="l">リスト名 <span class="req">*</span></span><span class="v">未対応チャット<span class="cr">▾</span></span></div>
            <div class="fld"><span class="l">送信者 ／ 本文</span><span class="v"><span class="dyn">${svg('zap')}送信者</span><span class="dyn">${svg('zap')}本文</span></span></div>
            <div class="fld keyfld"><span class="l" style="color:#B45309;">リンク（Teamsへ）<span class="req">*</span></span><span class="v"><span class="dyn">${svg('zap')}メッセージへのリンク</span></span></div>
            <div class="fld"><span class="l">対応済</span><span class="v">いいえ<span class="cr">▾</span></span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>①のフローの最後に<b>「項目の作成」</b>を足す</span></li>
              <li class="key"><span class="sn">2</span><span><b>⚡メッセージへのリンク</b>を必ず保存（肝）</span></li>
              <li><span class="sn">3</span><span>対応済＝<b>いいえ</b>で新規登録</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">2</div>
      <div class="colcard">
        <div class="ch"><span class="sq real"><img src="${A}icons/pa_schedule.png" alt=""></span><span class="nm">繰り返し → 集めて一覧化<small>スケジュール ＋ SharePoint（別フロー）</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="tabs"><span class="on">パラメーター</span><span>設定</span><span>コード ビュー</span><span>詳細</span></div>
          <div class="ptop">
            <div class="actlist">
              <div class="act"><span class="ai real"><img src="${A}icons/pa_schedule.png" alt=""></span><span class="an">繰り返し<small>毎日 12:00 / 15:00 / 18:00</small></span></div>
              <div class="act"><span class="ai plain"><img src="${A}icons/pa_sharepoint.png" alt=""></span><span class="an">項目の取得<small>未対応だけ抽出</small></span></div>
            </div>
            <div class="filt"><span>フィルター：</span><span class="fx">対応済 eq いいえ</span></div>
            <div class="act"><span class="ai real"><img src="${A}icons/pa_dataoperation.png" alt=""></span><span class="an">HTML テーブルの作成<small>データ操作 ／ 一覧に整える</small></span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>「<b>繰り返し</b>」で1日3回起動</span></li>
              <li class="key"><span class="sn">2</span><span>「<b>項目の取得</b>」＋フィルターで<b>未対応だけ</b></span></li>
              <li><span class="sn">3</span><span>「<b>HTMLテーブルの作成</b>」で一覧に</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="carrow">${svg('arrow')}</div>

    <div class="col">
      <div class="cnum">3</div>
      <div class="colcard">
        <div class="ch"><span class="sq"><img src="${A}icons/pa_outlook.png" alt=""></span><span class="nm">メールの送信 (V2)<small>Office 365 Outlook ／ リンク付きで届ける</small></span><span class="dots">⋮</span></div>
        <div class="cp">
          <div class="tabs"><span class="on">パラメーター</span><span>設定</span><span>コード ビュー</span><span>詳細</span></div>
          <div class="ptop">
            <div class="fld"><span class="l">宛先 ／ 件名</span><span class="v">自分｜未対応の重要チャット <span class="dyn">${svg('zap')}件数</span></span></div>
            <div class="htmlon">${svg('check')}詳細オプション：本文を「HTML として」ON</div>
            <div class="fld"><span class="l">本文（各行のリンク）</span></div>
            <div class="codebox"><span class="tag">&lt;a</span> <span class="at">href</span>=<span class="tx">"</span><span class="dyn2">⚡リンク</span><span class="tx">"&gt;</span>開く<span class="tag">&lt;/a&gt;</span></div>
          </div>
          <div class="howsteps">
            <div class="hh">操作手順</div>
            <ol>
              <li><span class="sn">1</span><span>宛先＝<b>自分</b>／件名に<b>件数</b></span></li>
              <li class="key"><span class="sn">2</span><span>本文を<b>「HTMLとして」</b>にする</span></li>
              <li><span class="sn">3</span><span>リンクは<b>&lt;a&gt;タグ</b>で貼る（直貼りNG）</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="pitfall">
    <div class="pl">${svg('warn')}つまずき注意</div>
    <div class="px"><span class="ph">リンクは<b>「メッセージへのリンク」（WebUrl）</b>の動的コンテンツ</span> <span class="ph">（無ければ<b>「メッセージの詳細を取得する」</b>で取得）。</span> <span class="ph">メールは<b>HTML形式</b>で送信し、</span> <span class="ph"><b>URL直貼りでなく</b><code>&lt;a href&gt;</code>タグに。</span> <span class="ph">送信後は<b>「項目の更新」で対応済</b>にして二重送信を防止。</span> <span class="ph"><b>自分・ボットの投稿は記録から除外</b>。</span></div>
    <img class="pit-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="src">出典：Power Automate 実機（PA45 Demo）／Microsoft Learn　※アクション名は2026-07時点</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
