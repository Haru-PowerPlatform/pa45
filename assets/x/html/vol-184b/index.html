<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.184-2 承認が30日で時間切れになるまで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:9px;}
  .k4{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;border-radius:13px;padding:8px 9px 9px;background:#EEF4FF;border:2.5px solid #A9C6F5;position:relative;box-shadow:0 4px 10px rgba(20,40,90,.10);}
  .k4 .tm{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .k4 .tm .d{font-size:21px;font-weight:900;color:#fff;background:#1E3A8A;border-radius:999px;padding:3px 13px;white-space:nowrap;}
  .k4 .tm .e{font-size:15.5px;font-weight:900;color:#1E3A8A;}
  .k4 .hd{flex:0 0 auto;font-size:22px;font-weight:900;color:#1B2A44;line-height:1.25;}
  .k4 .sc{flex:0 0 150px;border-radius:10px;background:#DCE8F8;position:relative;overflow:hidden;}
  .k4 .sc svg{position:absolute;inset:0;width:100%;height:100%;}
  .k4 .sc .chara{position:absolute;right:2px;bottom:0;height:116px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));}
  .k4 .mk{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid #C7D6EE;border-radius:10px;overflow:hidden;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .k4 .mk .mh{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 9px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;color:#242424;}
  .k4 .mk .mh img{width:22px;height:22px;}
  .k4 .mk .mb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:4px 9px;}
  .k4 .mk .r{font-size:15.5px;font-weight:700;color:#242424;line-height:1.35;}
  .k4 .mk .r b{color:#B91C1C;}
  .k4 .mk .r .g{color:#107C10;font-weight:900;}
  .k4 .mk .r .pill{display:inline-block;font-size:15.5px;font-weight:900;border-radius:6px;padding:0 7px;color:#fff;background:#C50F1F;}
  .k4 .mk .r .pill.w{background:#B45309;}
  .k4 .cp{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.35;border-radius:9px;padding:6px 9px;color:#1E3A8A;background:#fff;border:1.5px solid #A9C6F5;}
  .k4 .cp b{color:#EA580C;}
  .k4.k3{background:#FFF7ED;border-color:#F6C56B;} .k4.k3 .sc{background:#FDEBCB;} .k4.k3 .tm .d{background:#B45309;}
  .k4.k4x{background:#FEF2F2;border-color:#F0AEAE;} .k4.k4x .sc{background:#FCE4E4;} .k4.k4x .tm .d{background:#B91C1C;}
  .arw{flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:#2563EB;}
  .arw svg{width:20px;height:20px;}
  .warnbar .wl{font-weight:900;font-size:16px;white-space:nowrap;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'};
/* コマ1：承認依頼メールが飛ぶ */
const sc1=`<svg viewBox="0 0 280 150" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="e1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5ECF6"/></linearGradient></defs>
  <g transform="translate(18 40) rotate(-8)"><rect x="0" y="0" width="112" height="72" rx="6" fill="url(#e1)" stroke="#94A3B8" stroke-width="2"/>
  <path d="M0 4l56 38 56-38" fill="none" stroke="#94A3B8" stroke-width="2"/><rect x="84" y="8" width="20" height="16" rx="2" fill="#2563EB"/></g>
  <path d="M136 70q22-20 44-6" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M176 58l8 7-10 4" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="136" font-size="15" font-weight="900" fill="#1E3A8A" text-anchor="middle" font-family="Noto Sans JP">承認の依頼</text></svg>`;
/* コマ2：休暇（スーツケースと飛行機・カレンダー） */
const sc2=`<svg viewBox="0 0 280 150" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient></defs>
  <path d="M30 34l40-8 6 6-34 12z" fill="#fff" stroke="#64748B" stroke-width="2"/><path d="M50 30l10-16 6 2-6 16" fill="#fff" stroke="#64748B" stroke-width="2"/>
  <path d="M8 46q30-4 52-14" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="34" y="66" width="66" height="70" rx="9" fill="url(#s2)" stroke="#9A3412" stroke-width="2"/><rect x="54" y="56" width="26" height="12" rx="4" fill="none" stroke="#9A3412" stroke-width="3"/>
  <path d="M48 66v70M86 66v70" stroke="#FDBA74" stroke-width="4"/>
  <g transform="translate(116 30)"><rect x="0" y="0" width="56" height="58" rx="6" fill="#fff" stroke="#64748B" stroke-width="2"/><rect x="0" y="0" width="56" height="15" rx="6" fill="#DC2626"/><rect x="0" y="9" width="56" height="6" fill="#DC2626"/>
  <text x="28" y="44" font-size="20" font-weight="900" fill="#1F2937" text-anchor="middle" font-family="Noto Sans JP">休</text></g></svg>`;
/* コマ3：砂時計が落ちきる */
const sc3=`<svg viewBox="0 0 280 150" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>
  <g transform="translate(26 14)"><rect x="0" y="0" width="58" height="9" rx="3" fill="#92400E"/><rect x="0" y="113" width="58" height="9" rx="3" fill="#92400E"/>
  <path d="M6 9h46c0 26-17 34-17 52s17 26 17 52H6c0-26 17-34 17-52S6 35 6 9z" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <path d="M9 113c0-20 10-27 20-31 10 4 20 11 20 31z" fill="url(#h3)"/></g>
  <g transform="translate(104 34)"><rect x="0" y="0" width="74" height="56" rx="7" fill="#fff" stroke="#B91C1C" stroke-width="2.5"/>
  <text x="37" y="25" font-size="15" font-weight="900" fill="#B91C1C" text-anchor="middle" font-family="Noto Sans JP">30日</text>
  <text x="37" y="45" font-size="13" font-weight="900" fill="#6B7280" text-anchor="middle" font-family="Noto Sans JP">経過</text></g></svg>`;
/* コマ4：止まったまま積まれる申請書 */
const sc4=`<svg viewBox="0 0 280 150" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <g><rect x="24" y="96" width="100" height="14" rx="2" fill="#fff" stroke="#9CA3AF" stroke-width="1.5" transform="rotate(-3 74 103)"/>
  <rect x="20" y="80" width="100" height="14" rx="2" fill="#fff" stroke="#9CA3AF" stroke-width="1.5" transform="rotate(4 70 87)"/>
  <rect x="26" y="64" width="100" height="14" rx="2" fill="#fff" stroke="#9CA3AF" stroke-width="1.5" transform="rotate(-2 76 71)"/>
  <rect x="22" y="48" width="100" height="14" rx="2" fill="#fff" stroke="#9CA3AF" stroke-width="1.5" transform="rotate(3 72 55)"/></g>
  <rect x="14" y="112" width="124" height="8" rx="2" fill="#8B5E34"/>
  <g transform="translate(118 16) rotate(12)"><rect x="0" y="0" width="64" height="30" rx="5" fill="none" stroke="#DC2626" stroke-width="3.5"/>
  <text x="32" y="21" font-size="15" font-weight="900" fill="#DC2626" text-anchor="middle" font-family="Noto Sans JP">停止中</text></g>
  <text x="72" y="140" font-size="14" font-weight="900" fill="#991B1B" text-anchor="middle" font-family="Noto Sans JP">発注が止まっていた</text></svg>`;
const arr=`<div class="arw">${svgw(P.arrow,3)}</div>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.184-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">承認の返事を待っている間に、<br><span class="hl">30日で時間切れになる</span>まで</div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">「開始して承認を待機」は、返事が来るまでフローを止めて待ちます。<br>その待ち時間も含めて、<b>1回の実行は開始から30日まで</b>です</div>
  </div>
  <div class="stage">
    <div class="k4">
      <div class="tm"><span class="d">11/2（月）</span><span class="e">1日目</span></div>
      <div class="hd">購買申請の承認を<br>部長に出す</div>
      <div class="sc">${sc1}<img class="chara" src="${A}chara/chara_smile.png" alt=""></div>
      <div class="mk"><div class="mh"><img src="${A}icons/pa_logo.png" alt="">開始して承認を待機</div><div class="mb">
        <div class="r">タイトル：備品の購入（12万円）</div><div class="r">割り当て先：佐藤部長</div><div class="r"><span class="pill w">待機中</span> 返事が来るまで停止</div></div></div>
      <div class="cp">申請者は山田。<br>待つ間も<b>フローは実行中</b></div>
    </div>${arr}
    <div class="k4">
      <div class="tm"><span class="d">11/6（金）</span><span class="e">5日目</span></div>
      <div class="hd">部長が<br>長期休暇に入る</div>
      <div class="sc">${sc2}</div>
      <div class="mk"><div class="mh"><img src="${A}icons/ms/outlook.svg" alt="">自動応答</div><div class="mb">
        <div class="r">11/6〜12/4 は不在です。</div><div class="r">急ぎの件は鈴木まで。</div><div class="r"><b>承認メールは未読のまま</b></div></div></div>
      <div class="cp">代わりの人に回る仕組みは<b>ない</b></div>
    </div>${arr}
    <div class="k4 k3">
      <div class="tm"><span class="d">12/2（水）</span><span class="e">31日目</span></div>
      <div class="hd">開始から30日。<br>実行が時間切れ</div>
      <div class="sc">${sc3}</div>
      <div class="mk"><div class="mh"><img src="${A}icons/pa_logo.png" alt="">28 日間の実行履歴</div><div class="mb">
        <div class="r">11月2日 09:12</div><div class="r">期間 30 日</div><div class="r"><span class="pill">失敗</span> 承認待ちのまま終了</div></div></div>
      <div class="cp">その後のメール送信や<br>台帳の更新は<b>動かない</b></div>
    </div>${arr}
    <div class="k4 k4x">
      <div class="tm"><span class="d">12/7（月）</span><span class="e">36日目</span></div>
      <div class="hd">誰も気づかず、<br>発注が止まっていた</div>
      <div class="sc">${sc4}<img class="chara" src="${A}chara/chara_trouble.png" alt=""></div>
      <div class="mk"><div class="mh"><img src="${A}icons/ms/teams.svg" alt="">山田 → 佐藤部長</div><div class="mb">
        <div class="r">先月の備品の件、</div><div class="r">承認はどうなりましたか。</div><div class="r"><b>申請からもう1か月以上</b></div></div></div>
      <div class="cp">承認自体は承認センターに<br><b>残る</b>が、待つフローはもういない</div>
    </div>
  </div>
  <div class="warnbar">
    <span class="na" style="width:30px;height:30px;color:#C2410C">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws"><span>承認の「既知の問題」ページには「28 日間待つことができます」とある</span><span>30日は実行の開始時刻から数える</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「自動化フロー、スケジュールされたフロー、インスタント フローの制限事項」「既知の問題（承認）」（2026-11-19 確認）／人名・日付は架空・画面は説明用の再現・実画面は未確認</div>
`;
</script>
</body>
</html>
