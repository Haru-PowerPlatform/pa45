<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.185-4 3つの席の早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  :root{--s1:#2563EB;--s1b:#EEF4FF;--s1l:#A9C6F5;--s1d:#1E3A8A;
        --s2:#D97706;--s2b:#FFF8EB;--s2l:#F5CF8E;--s2d:#92400E;
        --s3:#16A34A;--s3b:#ECFDF5;--s3l:#8FD6B2;--s3d:#065F46;}
  .s1{--c:var(--s1);--cb:var(--s1b);--cl:var(--s1l);--cd:var(--s1d);}
  .s2{--c:var(--s2);--cb:var(--s2b);--cl:var(--s2l);--cd:var(--s2d);}
  .s3{--c:var(--s3);--cb:var(--s3b);--cl:var(--s3l);--cd:var(--s3d);}
  .msi{flex:0 0 auto;object-fit:contain;}
  .repro{font-size:12.5px;font-weight:700;color:#8A8886;margin-left:auto;white-space:nowrap;}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--cl,#A9C6F5);border-radius:10px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.10);}
  .win .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:900;color:#242424;white-space:nowrap;}
  .win .wb{flex:1;min-height:0;display:flex;flex-direction:column;padding:7px 10px;}
  .tag{flex:0 0 auto;display:inline-block;font-size:14px;font-weight:900;color:#fff;background:var(--c,#2563EB);border-radius:6px;padding:1px 8px;white-space:nowrap;}
  .tag.gy{background:#6B7280;} .tag.gr{background:#16A34A;} .tag.rd{background:#DC2626;} .tag.am{background:#D97706;} .tag.bl{background:#2563EB;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:900;border-radius:6px;padding:4px 20px;border:1.5px solid #C8C6C4;color:#242424;background:#fff;}
  .btn.pri{background:#4F52B2;border-color:#4F52B2;color:#fff;}
  .lnk{color:#0F6CBD;text-decoration:underline;font-weight:900;}
  .next .sub{margin-left:auto;font-size:15.5px;font-weight:900;color:#1E40AF;}
  .wl{font-size:17px;font-weight:900;white-space:nowrap;}

  .stage{gap:10px;}
  .lf{flex:0 0 372px;display:flex;flex-direction:column;gap:5px;min-height:0;position:relative;}
  .lf .cap2{flex:0 0 auto;font-size:17px;font-weight:900;color:#1E3A8A;display:flex;align-items:center;gap:8px;}
  .flow{flex:1;min-height:0;display:flex;flex-direction:column;background:#F8FAFC;border:2.5px solid #A9C6F5;border-radius:12px;padding:7px 9px;}
  .a{flex:1;min-height:0;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #D1D5DB;border-left:6px solid #9CA3AF;border-radius:8px;padding:0 9px;font-size:16px;font-weight:900;color:#1F2937;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.07);}
  .a.s1,.a.s2,.a.s3{border-left-color:var(--c);background:var(--cb);}
  .a .st{margin-left:auto;font-size:14px;font-weight:900;color:#fff;background:var(--c);border-radius:6px;padding:0 7px;}
  .a .st.gy{background:#6B7280;}
  .j{flex:0 0 9px;align-self:center;width:3px;background:#94A3B8;}
  .tbx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .th,.tr{display:grid;grid-template-columns:138px 1fr 1.25fr 1.2fr;gap:0;}
  .th{flex:0 0 auto;background:#1E3A8A;color:#fff;border-radius:9px;font-size:16px;font-weight:900;}
  .th span{padding:5px 10px;}
  .tr{flex:1;min-height:0;background:#fff;border:2.5px solid var(--cl);border-radius:12px;overflow:hidden;box-shadow:0 3px 7px rgba(0,0,0,.08);}
  .tr > div{padding:5px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;border-left:1.5px dashed var(--cl);}
  .tr > div:first-child{border-left:none;background:var(--cb);align-items:center;text-align:center;}
  .tr .se{font-size:19px;font-weight:900;color:var(--cd);line-height:1.2;}
  .tr .se .n{display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff;font-size:18px;align-items:center;justify-content:center;margin-bottom:3px;}
  .tr .se small{display:block;font-size:14.5px;font-weight:700;color:#4B5563;}
  .tr .pr{font-size:17px;font-weight:900;color:#991B1B;line-height:1.32;}
  .tr .ad{font-size:17px;font-weight:900;color:#1B2A44;line-height:1.32;}
  .tr .ad small{display:block;font-size:15.5px;font-weight:700;color:#4B5563;line-height:1.36;}
  .tr .us{font-size:15.5px;font-weight:700;color:#1B2A44;line-height:1.5;}
  .tr .us .fd{display:inline-block;background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:6px;padding:0 7px;font-weight:900;color:#9A3412;margin:1px 2px 1px 0;white-space:nowrap;}
  .lf .chara{position:absolute;right:-6px;bottom:-4px;height:112px;z-index:4;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));}

</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12l5 5 9-10"/>',arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',down:'<path d="M12 4v15M6 13l6 6 6-6"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'};
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const IC=(n,w)=>`<img class="msi" src="${A}icons/${n}" alt="" style="width:${w||26}px;height:${w||26}px">`;
const APV=(w)=>`<svg class="msi" viewBox="0 0 28 28" style="width:${w||26}px;height:${w||26}px;flex:0 0 auto"><rect width="28" height="28" rx="6" fill="#486991"/><circle cx="14" cy="14" r="8" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M10 14.2l3 3 5.2-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CH=(e,h,st)=>`<img class="chara" src="${A}chara/chara_${e}.png" alt="" style="height:${h||112}px;${st||''}">`;
document.getElementById('slide').innerHTML=`

  <div class="titlebar">
    <div class="vol-pill">Vol.185-4</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">早見表：承認フローの3つの席と、<br><span class="hl">足す設定・使う欄</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">承認フローを作ったら、<b>3つの席に何が届くか</b>を1行ずつ確かめます。<br>休暇・経費・稟議の承認でも、見る順番は同じです</div>
  </div>
  <div class="stage">
    <div class="lf">
      <div class="cap2">${IC('pa_logo.png',26)}フローのどこに足すか<span class="repro">再現</span></div>
      <div class="flow">
        <div class="a">${IC('pa_sharepoint.png',26)}項目が作成されたとき<span class="st gy">土台</span></div><div class="j"></div>
        <div class="a s1">${IC('pa_outlook.png',26)}メールの送信 (V2)<span class="st">席1 受付</span></div><div class="j"></div>
        <div class="a s2">${APV(26)}開始して承認を待機<span class="st">席2</span></div><div class="j"></div>
        <div class="a s3">${IC('pa_sharepoint.png',26)}項目の更新<span class="st">席3</span></div><div class="j"></div>
        <div class="a s1">${IC('pa_outlook.png',26)}メールの送信 (V2)<span class="st" style="margin-left:2px">席1 結果</span></div>
      </div>
      ${CH('guts',112)}
    </div>
    <div class="tbx">
      <div class="th"><span>席</span><span>足す前に困ること</span><span>足す設定</span><span>使う欄・値</span></div>
      <div class="tr s1">
        <div><div class="se"><span class="n">1</span><br>申請する人</div></div>
        <div><div class="pr">出したあと、<br>いまどこか分からない</div></div>
        <div><div class="ad">承認の前に受付メール、<br>後に結果メール<small>「メールの送信 (V2)」を2か所</small></div></div>
        <div><div class="us"><span class="fd">宛先</span>申請者<br><span class="fd">件名</span>品名と状況<br><span class="fd">本文</span>承認者・結果・コメント</div></div>
      </div>
      <div class="tr s2">
        <div><div class="se"><span class="n">2</span><br>承認する人</div></div>
        <div><div class="pr">通知を開いても、<br>判断材料がない</div></div>
        <div><div class="ad">依頼に金額・理由・リンク<small>「開始して承認を待機」の欄</small></div></div>
        <div><div class="us"><span class="fd">タイトル</span><span class="fd">詳細</span><span class="fd">要求者</span><br><span class="fd">アイテム リンク</span><br><span class="fd">アイテム リンクの説明</span></div></div>
      </div>
      <div class="tr s3">
        <div><div class="se"><span class="n">3</span><br>あとで<br>調べる人</div></div>
        <div><div class="pr">誰がいつ承認したか、<br>申請の行に残っていない</div></div>
        <div><div class="ad">承認の結果を台帳に書く<small>「項目の更新」を承認のすぐ後に</small></div></div>
        <div><div class="us"><span class="fd">結果</span><span class="fd">完了日</span><br>応答承認者名・コメント<br>リストに列を4つ足す</div></div>
      </div>
    </div>
  </div>
  <div class="warnbar">
    <span class="na" style="width:28px;height:28px;color:#C2410C">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws"><span>承認の日時は UTC。日本時間に直す</span><span>30日を超える承認は別の作り</span><span>過去の承認は「承認」の「履歴」にも残る</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Power Automate の承認を始めましょう」「承認ワークフローを作成し、テストします」「承認要求を表示、承認、または拒否する」「標準承認」コネクタ／人名・品名・金額・日付は架空・画面は説明用の再現</div>

`;
</script>
</body>
</html>
