<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.158-2 入社記念日のフロー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>

  .shotcol{flex:0 0 640px;display:flex;flex-direction:column;gap:7px;min-height:0;}
  .shots{flex:1;min-height:0;display:flex;flex-direction:row;gap:8px;}
  .shot{min-height:0;min-width:0;background:#fff;border:2.5px solid #A9C6F5;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(15,60,55,.15);}
  .shot img{width:100%;height:100%;object-fit:contain;display:block;}
  .real{flex:0 0 auto;align-self:flex-start;font-size:14px;font-weight:900;color:#fff;background:#2563EB;border-radius:999px;padding:2px 12px;}
  .steps{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .st{flex:1;min-height:0;display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid #A9C6F5;border-radius:12px;padding:8px 12px;}
  .st .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;background:#2563EB;}
  .st .t{font-size:18.5px;font-weight:900;color:#1B2A44;line-height:1.36;}
  .st .t b{color:var(--orange,#EA580C);}
  .st .t small{display:block;font-size:15.5px;font-weight:700;color:#4B5563;line-height:1.38;margin-top:2px;}
  .st.hint{background:#FFFBEB;border-color:#F59E0B;}
  .st.hint .n{background:linear-gradient(180deg,#FBBF24,#D97706);padding:5px;}
  .warnbar .ws span b{color:#B91C1C;}
  /* フロー図（PA） */
  .flow{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;background:#F8FAFC;border:2.5px solid #A9C6F5;border-radius:12px;padding:10px 14px;}
  .act{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;background:#fff;border:1.5px solid #D1D5DB;border-left:6px solid var(--c,#2563EB);border-radius:9px;padding:4px 12px;box-shadow:0 2px 5px rgba(0,0,0,.07);}
  .act .ah{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:900;color:#1F2937;}
  .act .ah .k{font-size:13px;font-weight:900;color:#fff;background:var(--c,#2563EB);border-radius:5px;padding:1px 7px;}
  .act .pr{font-size:15px;font-weight:700;color:#374151;line-height:1.35;margin-top:2px;font-family:"Roboto Mono","Noto Sans JP",monospace;}
  .act .pr b{color:#B45309;background:#FEF3C7;border-radius:4px;padding:0 4px;}
  .act.br{border-left-color:#7C3AED;}
  .cn{flex:0 0 14px;align-self:center;width:3px;background:#94A3B8;}

</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12l5 5 9-10"/>',arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 4M12 17v.5"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.158-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方：月日だけで比べて、<br><span class="hl">周年は年の引き算</span></div>
    
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">Excel の日付は数字（シリアル値）で届きがち。<b>日時形式を ISO 8601</b> にしてから、月日 'MM-dd' 同士で比べます</div>
  </div>
  <div class="stage">
    <div class="shotcol">
      <span class="real">フローの中身（上から順に）</span>
      <div class="flow"><div class="act" style="--c:#0F766E"><div class="ah"><span class="k">トリガー</span>繰り返し</div><div class="pr">1日ごと・7:00・(UTC+09:00) 大阪、札幌、東京</div></div><div class="cn"></div><div class="act" style="--c:#107C41"><div class="ah"><span class="k">アクション</span>表内に存在する行を一覧表示</div><div class="pr">名簿.xlsx・日時形式 <b>ISO 8601</b></div></div><div class="cn"></div><div class="act" style="--c:#B45309"><div class="ah"><span class="k">アクション</span>アレイのフィルター処理</div><div class="pr">formatDateTime(<b>入社日</b>,'MM-dd') が今日の 'MM-dd'</div></div><div class="cn"></div><div class="act br" style="--c:#7C3AED"><div class="ah"><span class="k">Apply to each</span>見つかった人ごとに</div><div class="pr">0人なら何もしない</div></div><div class="cn"></div><div class="act" style="--c:#5B5FC7"><div class="ah"><span class="k">アクション</span>チャットまたはチャネルでメッセージを投稿する</div><div class="pr">「〇〇さん 入社<b>N周年</b>です」</div></div></div>
    </div>
    <div class="steps">
      <div class="st"><span class="n">1</span><div class="t">名簿をテーブルにする<small>列：氏名・入社日</small></div></div>
      <div class="st"><span class="n">2</span><div class="t">日時形式を ISO 8601 に<small>表内に存在する行を一覧表示 の詳細パラメーター</small></div></div>
      <div class="st"><span class="n">3</span><div class="t">月日だけで比べる<small>今日も日本時間で 'MM-dd' にする</small></div></div>
      <div class="st hint"><span class="n">${svgw(P.q,2.6)}</span><div class="t">周年は年の引き算<small>sub(今年, 入社した年)</small></div></div>
    </div>
  </div>
  <div class="warnbar">
    <span class="na" style="width:30px;height:30px;color:#C2410C">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws"><span>誕生日は個人情報なので入社日にした</span><span>退職者を名簿から外す運用を決めておく</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Excel Online (Business)」「Microsoft Teams」コネクタ・「繰り返し」トリガー／人名・日付は架空・画面は説明用の再現・実機の画面は未確認</div>
`;
</script>
</body>
</html>
