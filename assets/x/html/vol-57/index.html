<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.57-1 毎日ボタン1つで報連相</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F38; --green-bg:#ECFDF5;
    --amber:#D97706; --amber-dark:#92400E; --amber-bg:#FFFBEB;
    --red:#DC2626; --red-dark:#7F1D1D; --red-bg:#FEF2F2;
    --teams:#5B5FC7; --teams-dark:#4347A8;
    --purple:#7C3AED; --purple-dark:#5B21B6;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:86px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:14px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .logos{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .logos .ll{height:47px;width:47px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .logos .plus{color:#fff;font-weight:900;font-size:24px;text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1;}
  .title-text{color:#fff;font-weight:900;font-size:25px;line-height:1.16;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:15px;padding:12px 20px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:50px;height:50px;border-radius:13px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:11px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:21.5px;color:var(--blue-dark);line-height:1.4;padding-right:36px;}
  .concl .txt b{color:var(--orange);}
  .concl .txt .mg{color:var(--purple-dark);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:15px;padding:12px 13px 12px;box-shadow:0 4px 12px rgba(0,0,0,.11),inset 0 1px 0 rgba(255,255,255,.7);position:relative;}
  .col.c1{background:#F5F5FC;border:2.5px solid var(--teams);}
  .col.c2{background:#FFFBF2;border:2.5px solid var(--amber);}
  .col.c3{background:#F0FBF4;border:2.5px solid var(--green);}
  .cn{position:absolute;top:-19px;left:10px;right:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:900;font-size:23px;border-radius:12px;padding:9px 12px;box-shadow:0 3px 7px rgba(0,0,0,.28);white-space:nowrap;letter-spacing:-.5px;}
  .c1 .cn{background:var(--teams);} .c2 .cn{background:var(--amber);} .c3 .cn{background:var(--green);}
  .col .top{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px;min-height:0;margin-top:24px;}
  .cap{flex:0 0 auto;margin-top:10px;border-radius:10px;padding:10px 12px;font-size:15.5px;font-weight:800;line-height:1.44;display:flex;align-items:flex-start;gap:8px;}
  .cap .d{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:6px;}
  .c1 .cap{background:#EAEAF8;color:#3A3B6B;} .c1 .cap .d{background:var(--teams);}
  .c2 .cap{background:#FDF0D9;color:#7C4A12;} .c2 .cap .d{background:var(--amber);}
  .c3 .cap{background:#DFF5E8;color:#0B5E37;} .c3 .cap .d{background:var(--green);}
  .cap b{font-weight:900;}

  .arrowcol{flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--blue);}
  .arrowcol svg{width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));}

  /* Teams adaptive card (step1) */
  .tmini{font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .tmini .bar{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#4347A8;margin-bottom:8px;}
  .tmini .bar .ti{width:22px;height:22px;border-radius:6px;background:#5B5FC7;display:flex;align-items:center;justify-content:center;padding:3px;}
  .tmini .bar .ti img{width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1);}
  .botrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .botrow .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#7C3AED);display:flex;align-items:center;justify-content:center;padding:6px;}
  .botrow .av img{width:100%;height:100%;object-fit:contain;}
  .botrow .bn{font-weight:900;font-size:13.5px;color:#242424;}
  .botrow .bp{font-weight:800;font-size:10.5px;color:#5B5FC7;background:#EEF0FB;border:1px solid #D6D8F2;border-radius:5px;padding:1px 6px;}
  .acard{background:#fff;border:1.5px solid #E1E1EA;border-left:4px solid #5B5FC7;border-radius:9px;padding:11px 12px;box-shadow:0 5px 13px rgba(91,95,199,.20);}
  .acard .aq{font-weight:900;font-size:16.5px;color:#242424;line-height:1.3;}
  .acard .asub{font-weight:700;font-size:12px;color:#6B7280;margin-top:2px;margin-bottom:9px;}
  .acard .btn{display:flex;align-items:center;gap:8px;border-radius:7px;padding:7px 11px;font-weight:900;font-size:14.5px;margin-top:6px;box-shadow:0 2px 4px rgba(0,0,0,.10);}
  .acard .btn .dot{flex:0 0 auto;width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65);}
  .acard .b-g{background:#EAF7EF;border:1.5px solid #86D8A5;color:#0B5E37;} .acard .b-g .dot{background:#16A34A;}
  .acard .b-a{background:#FEF6E7;border:1.5px solid #F5C97A;color:#8A5A12;} .acard .b-a .dot{background:#F59E0B;}
  .acard .b-r{background:#FDECEC;border:1.5px solid #F1A9A9;color:#8A1C1C;} .acard .b-r .dot{background:#DC2626;}

  /* step2 tap buttons */
  .c2 .top{align-items:center;}
  .taphead{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:18px;border-radius:999px;padding:6px 18px;box-shadow:0 4px 9px rgba(234,88,12,.4);}
  .taphead svg{width:18px;height:18px;}
  .tapset{align-self:stretch;display:flex;flex-direction:column;gap:8px;position:relative;}
  .tapbtn{display:flex;align-items:center;gap:11px;border-radius:11px;padding:11px 14px;font-weight:900;font-size:19px;box-shadow:0 3px 7px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.6);}
  .tapbtn .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7);}
  .tapbtn small{font-weight:800;font-size:13px;opacity:.85;margin-left:auto;}
  .tapbtn.g{background:linear-gradient(180deg,#F1FBF5,#E3F6EB);border:2px solid #57C185;color:#0B5E37;} .tapbtn.g .dot{background:#16A34A;}
  .tapbtn.a{background:linear-gradient(180deg,#FFF8EC,#FDEFD3);border:2.5px solid #F59E0B;color:#8A5410;transform:scale(1.04);box-shadow:0 6px 14px rgba(245,158,11,.34),inset 0 1px 0 rgba(255,255,255,.7);} .tapbtn.a .dot{background:#F59E0B;}
  .tapbtn.r{background:linear-gradient(180deg,#FEF1F1,#FBDcdc);border:2px solid #E67878;color:#8A1C1C;} .tapbtn.r .dot{background:#DC2626;}
  .finger{position:absolute;right:6px;top:44%;font-size:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));transform:rotate(-12deg);}

  /* step3 record + notify */
  .c3 .top{gap:10px;}
  .logcard{align-self:stretch;background:#fff;border:1.5px solid #BFE3CD;border-radius:11px;overflow:hidden;box-shadow:0 3px 8px rgba(22,163,74,.14);}
  .logcard .lh{display:flex;align-items:center;gap:8px;background:#E9F7EF;padding:7px 11px;font-weight:900;font-size:13px;color:#0B5E37;border-bottom:1px solid #CDEBD9;}
  .logcard .lh img{width:17px;height:17px;object-fit:contain;}
  .lrow{display:flex;align-items:center;gap:8px;padding:6px 11px;font-size:13px;font-weight:800;color:#2B3A2F;border-bottom:1px solid #EAF3EE;}
  .lrow:last-child{border-bottom:none;}
  .lrow .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;}
  .lrow .nm{flex:1;}
  .lrow .tm{font-size:11.5px;color:#6B8375;font-weight:700;}
  .lrow.gg .dot{background:#16A34A;} .lrow.aa .dot{background:#F59E0B;} .lrow.rr .dot{background:#DC2626;}
  .notify{align-self:stretch;background:linear-gradient(180deg,#FFF8EC,#FDEED4);border:2px solid #F1B24E;border-radius:11px;padding:9px 12px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 3px 7px rgba(234,88,12,.16);}
  .notify .bell{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(234,88,12,.35);}
  .notify .bell svg{width:20px;height:20px;}
  .notify .nt{font-weight:900;font-size:14px;color:#7C4A12;line-height:1.34;}
  .notify .nt b{color:#B45309;}

  /* bottom uses */
  .uses{flex:0 0 auto;margin:11px 16px 12px;display:flex;align-items:stretch;gap:9px;}
  .ulabel{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:15px;border-radius:11px;padding:0 16px;text-align:center;line-height:1.25;box-shadow:0 3px 8px rgba(37,99,235,.3);}
  .uc{flex:1;background:#F8F9FA;border:2px solid #E1E5EC;border-radius:11px;padding:8px 13px;box-shadow:0 2px 6px rgba(0,0,0,.07);display:flex;align-items:center;gap:11px;}
  .uc .cmd{flex:0 0 auto;font-weight:900;font-size:15px;color:#fff;border-radius:7px;padding:5px 12px;white-space:nowrap;}
  .uc.u1 .cmd{background:linear-gradient(180deg,#22C55E,#16A34A);}
  .uc.u2 .cmd{background:linear-gradient(180deg,#FBBF24,#EA580C);}
  .uc.u3 .cmd{background:linear-gradient(180deg,#7A7EDE,#5B5FC7);}
  .uc .ut{font-size:14.5px;font-weight:800;color:#3A4656;line-height:1.3;}
  .uc .ut b{color:var(--blue-dark);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 tap:'<path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 11V7.5a2 2 0 0 1 4 0V13"/><path d="M17 11.5a2 2 0 0 1 4 0V16a6 6 0 0 1-6 6h-2.5a5 5 0 0 1-3.9-1.9l-3.3-4.1a2 2 0 0 1 3-2.6l1.2 1.2"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
 bolt:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.57-1</div>
    <div class="logos"><img class="ll" src="${A}icons/pa_logo.png" alt=""><span class="plus">＋</span><img class="ll" src="${A}icons/pa_teams_official.png" alt=""></div>
    <div class="title-text">報連相は“根性”でなく“仕組み”で！<span class="hl">毎日ボタン1つで、報連相が回る</span></div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">報連相が抜けるのは、やる気でなく<b>「思い出す手間」と「言い出しにくさ」</b>のせい。毎日Teamsにカードが届き、<br><b>🟢順調・🟡相談したい・🔴詰まってる</b>をワンタップ。記録が残り、<span class="mg">相談も言い出す前に押せる</span>。</div>
  </div>

  <div class="stage">
    <div class="col c1">
      <div class="cn">① 毎日カードが届く</div>
      <div class="top">
        <div class="tmini">
          <div class="bar"><span class="ti"><img src="${A}icons/pa_teams_official.png" alt=""></span>あなた ＜＞ フロー ボット</div>
          <div class="botrow"><span class="av"><img src="${A}icons/pa_logo.png" alt=""></span><span class="bn">Power Automate</span><span class="bp">フロー ボット</span></div>
          <div class="acard">
            <div class="aq">今日の状況は？</div>
            <div class="asub">毎日16:00 に自動で届く 報連相カード</div>
            <div class="btn b-g">🟢 順調です</div>
            <div class="btn b-a">🟡 ちょっと相談したい</div>
            <div class="btn b-r">🔴 詰まってる</div>
          </div>
        </div>
      </div>
      <div class="cap"><span class="d"></span><span>決まった時刻に<b>ボットからカードが届く</b>。自分から報告を思い出さなくていい。</span></div>
    </div>

    <div class="arrowcol">${svg('arrow')}</div>

    <div class="col c2">
      <div class="cn">② ボタンを1つ押す</div>
      <div class="top">
        <div class="taphead">${svg('tap')}選んでタップするだけ</div>
        <div class="tapset">
          <div class="tapbtn g"><span class="dot"></span>順調です<small>報告おわり</small></div>
          <div class="tapbtn a"><span class="dot"></span>相談したい<small>言い出せる</small></div>
          <div class="tapbtn r"><span class="dot"></span>詰まってる<small>SOS</small></div>
          <div class="finger">👆</div>
        </div>
      </div>
      <div class="cap"><span class="d"></span><span>白紙に文章を書かなくていい。<b>3つから選ぶだけで30秒で完了。</b>「相談」の重さがボタン1つに化ける。</span></div>
    </div>

    <div class="arrowcol">${svg('arrow')}</div>

    <div class="col c3">
      <div class="cn">③ 記録＋必要な人へ</div>
      <div class="top">
        <div class="logcard">
          <div class="lh"><img src="${A}icons/pa_sharepoint.png" alt="">報連相ログ（自動で1行追加）</div>
          <div class="lrow gg"><span class="dot"></span><span class="nm">山田さん</span><span class="tm">7/03 16:02</span></div>
          <div class="lrow rr"><span class="dot"></span><span class="nm">佐藤さん</span><span class="tm">7/04 16:01</span></div>
          <div class="lrow aa"><span class="dot"></span><span class="nm">あなた</span><span class="tm">7/04 16:03</span></div>
        </div>
        <div class="notify">
          <span class="bell">${svg('bell')}</span>
          <span class="nt">🟡🔴 のときは<b>上司にその場で一報</b>。「相談したい人がいます」と自動でお知らせ。</span>
        </div>
      </div>
      <div class="cap"><span class="d"></span><span>押した瞬間<b>SharePointに記録</b>。溜まって見える化。困りごとは<b>放置されず届く</b>。</span></div>
    </div>
  </div>

  <div class="uses">
    <div class="ulabel">報・連・相が<br>自動で回る</div>
    <div class="uc u1"><span class="cmd">報告</span><span class="ut">🟢日々の状況が<b>毎日ログに残る</b></span></div>
    <div class="uc u3"><span class="cmd">連絡</span><span class="ut">🟡🔴が<b>上司へ自動で共有</b>される</span></div>
    <div class="uc u2"><span class="cmd">相談</span><span class="ut">🟡ボタンで<b>言い出しやすくなる</b></span></div>
  </div>
  <div class="src">出典：Power Automate 実機（PA45 Demo）／Microsoft Learn　※作り方は2枚目</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
