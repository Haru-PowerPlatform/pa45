<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.46-2 標準↔プレミアム 早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --orange:#EA580C; --orange-dark:#9A3412; --amber:#D97706;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:86px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 22px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:24px;border-radius:999px;padding:6px 18px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:46px;width:46px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:29px;line-height:1.12;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:140px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:13px;bottom:-42px;height:138px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:8px 15px 0;background:var(--blue-bg);border:2px solid var(--blue);border-radius:11px;display:flex;align-items:center;gap:11px;padding:7px 15px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:700;font-size:15px;color:var(--blue-dark);line-height:1.3;padding-right:86px;}
  .concl .txt b{color:var(--orange-dark);}

  .tbl{flex:1 1 auto;margin:9px 15px 0;border-radius:13px;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 5px 13px rgba(0,0,0,.12);display:flex;flex-direction:column;min-height:0;}
  .trow{display:flex;align-items:stretch;flex:1;border-bottom:1px solid #ECEEF1;min-height:0;}
  .trow:last-child{border-bottom:none;}
  .thead{flex:0 0 auto;background:linear-gradient(180deg,#3A4150,#2B313D);}
  .thead .h{color:#fff;font-weight:900;font-size:16.5px;display:flex;align-items:center;padding:8px 16px;}
  .want{flex:1;display:flex;align-items:center;padding:6px 16px;font-weight:800;font-size:20px;color:var(--ink);line-height:1.24;}
  .judge{flex:0 0 176px;display:flex;align-items:center;justify-content:center;padding:6px;border-left:1px solid #ECEEF1;border-right:1px solid #ECEEF1;}
  .why{flex:0 0 312px;display:flex;align-items:center;padding:6px 15px;font-weight:700;font-size:16.5px;color:var(--weak);line-height:1.28;}
  .body:nth-child(odd){background:#fff;} .body:nth-child(even){background:#F7F9FC;}
  .tag{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16.5px;color:#fff;border-radius:8px;padding:8px 15px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4);}
  .tag svg{width:16px;height:16px;}
  .tag.std{background:linear-gradient(180deg,#2BD06A,#16A34A);}
  .tag.prm{background:linear-gradient(180deg,#FB923C,#EA580C);}

  .tip{flex:0 0 auto;margin:9px 15px 11px;background:linear-gradient(180deg,#FFF7ED,#FFEFD9);border:1.5px solid #FDBA74;border-radius:11px;padding:8px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 6px rgba(0,0,0,.07);position:relative;}
  .tip .pl{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:13px;border-radius:8px;padding:6px 11px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .tip .pl svg{width:15px;height:15px;}
  .tip .px{flex:1;font-weight:800;font-size:13.5px;color:#7C3A12;line-height:1.32;padding-right:96px;}
  .tip .px b{color:var(--orange);}
  .tip-chara{position:absolute;right:11px;bottom:-2px;height:92px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:9.5px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 check:'<path d="M20 6 9 17l-5-5"/>',
 yen:'<path d="M6 4l6 8 6-8M12 12v8M8 14.5h8M8 18h8"/>',
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const STD=`<span class="tag std">${svg('check')}標準・無料</span>`;
const PRM=`<span class="tag prm">${svg('yen')}プレミアム</span>`;

const rows=[
 {w:'社内メールの送受信・自動返信',t:STD,r:'Outlook＝標準コネクタ'},
 {w:'Teams通知・SharePoint/OneDrive操作',t:STD,r:'どれも標準コネクタ'},
 {w:'Forms回答・Excel集計・承認',t:STD,r:'業務の定番。全部無料'},
 {w:'条件分岐・くり返し・式・予定実行',t:STD,r:'機能そのものは無料'},
 {w:'外部サービスを直接呼ぶ（HTTP）',t:PRM,r:'API＝他システムとつなぐ窓口'},
 {w:'他社のクラウドサービス（例：Salesforce）',t:PRM,r:'SaaS＝ネット上の業務サービス'},
 {w:'社内サーバー（オンプレ）のDB・ファイル',t:PRM,r:'専用の橋渡し（ゲートウェイ）が要る'},
 {w:'RPAをクラウドフローから自動起動',t:PRM,r:'PADの手動実行は無料／自動起動が有料'}
];

const s=document.getElementById('slide');
let trows=rows.map(r=>`
  <div class="trow body">
    <div class="want">${r.w}</div>
    <div class="judge">${r.t}</div>
    <div class="why">${r.r}</div>
  </div>`).join('');

s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.46-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">やりたいこと別｜<span class="hl">無料？プレミアム？早見表</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">やりたいことから逆引き。<b>社内業務の多くは“標準”で無料</b>。外部・オンプレ・AIに手を出すときだけプレミアム。</div>
  </div>

  <div class="tbl">
    <div class="trow thead">
      <div class="h" style="flex:1;">やりたいこと</div>
      <div class="h" style="flex:0 0 168px;justify-content:center;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15);">判定</div>
      <div class="h" style="flex:0 0 320px;">ひとこと</div>
    </div>
    ${trows}
  </div>

  <div class="tip">
    <div class="pl">${svg('bulb')}判断のコツ</div>
    <div class="px">コネクタ一覧で名前の右に<b>「プレミアム」マーク</b>が付いていたら有料。<b>標準だけで社内業務の多くは作れる</b>。外部サービス・他社クラウド・社内サーバー・RPA・AIが要るときだけ Premium（約$15・人月）。</div>
    <img class="tip-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
  <div class="src">出典：Microsoft Learn</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
