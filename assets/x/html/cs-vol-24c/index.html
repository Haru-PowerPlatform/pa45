<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.24-3 実際の画面：スキル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;padding-bottom:0;}
  .shotcol{flex:0 0 930px;max-width:930px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .real{flex:0 0 auto;align-self:flex-start;font-size:15px;font-weight:900;color:#fff;background:var(--cs);border-radius:999px;padding:3px 14px;}
  .shots{flex:1;min-height:0;display:flex;gap:10px;}
  .colA{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .colB{flex:0 0 330px;gap:8px;min-width:0;display:flex;flex-direction:column;}
  .shot{flex:1;min-height:0;min-width:0;background:#fff;border:2.5px solid var(--cs-line);border-radius:12px;overflow:hidden;display:flex;
    align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(91,33,182,.15);position:relative;padding-top:26px;}
  .shot img{width:100%;height:100%;object-fit:contain;display:block;}
  .lab{position:absolute;left:7px;top:5px;font-size:14px;font-weight:900;color:#fff;background:#E11D48;border-radius:7px;padding:2px 9px;z-index:2;}
  .s1{flex:0 0 auto;} .s1 img{height:auto;}
  .s2{flex:1;}
  .s0{flex:1;}
  .steps{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .st{flex:1;min-height:0;display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--cs-line);border-radius:12px;padding:6px 11px;}
  .st .n{flex:0 0 auto;width:34px;height:34px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;
    background:linear-gradient(135deg,#7C3AED,#C026D3);}
  .st .t{font-size:18px;font-weight:900;color:var(--navy);line-height:1.3;}
  .st .t b{color:var(--cs);}
  .st .t small{display:block;font-size:14.5px;font-weight:700;color:#4B5563;line-height:1.36;margin-top:1px;}
  .st.hint{background:#FFFBEB;border-color:#F59E0B;}
  .st.hint .n{background:linear-gradient(180deg,#FBBF24,#D97706);}
  .nextbar{flex:0 0 auto;margin:10px 18px 22px;display:flex;align-items:center;gap:12px;background:var(--cs-bg);border:2px solid var(--cs-line);
    border-radius:12px;padding:8px 18px;font-size:19px;font-weight:900;color:var(--cs-dark);}
  .nextbar .msi{width:28px;height:28px;}
  .src2{position:absolute;left:20px;bottom:5px;font-size:11.5px;font-weight:500;color:#9CA3AF;}
  .memo{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;background:#fff;border:2.5px solid var(--cs-line);border-radius:12px;padding:9px 12px;}
  .memo .h{font-size:16.5px;font-weight:900;color:var(--navy);}
  .memo .r{flex:1;min-height:0;min-width:0;padding:6px 10px !important;display:flex;align-items:center;gap:8px;background:#F9FAFB;border-radius:8px;padding:3px 10px;font-size:15px;font-weight:800;color:#1B2A44;line-height:1.35;}
  .memo .r b{flex:0 0 auto;font-size:13.5px;color:#fff;background:var(--cs);border-radius:6px;padding:1px 8px;}
  .memo .r small{display:block;font-size:13px;font-weight:700;color:#4B5563;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.24</div>
    <div class="part-pill">実際の画面 <b>(3/4)</b></div>
    <div class="title-text">「スキル」の＋から<br><span class="q">最初から作成</span>を選ぶ</div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/agent.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_laptop_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">実機</div>
    <div class="txt">エージェントの<b>作成</b>タブで、右のパネルの<b>スキル</b>の＋を押す。<br>
      「最初から作成」で<em>名前・説明・指示</em>の3つを入れて「作成」。</div>
  </div>

  <div class="body">
    <div class="shotcol">
      <div class="real">実際の画面（2026年11月・Copilot Studio）</div>
      <div class="shots">
        <div class="shot" style="flex:0 0 300px"><span class="lab">① スキルの＋</span><img src="shot-menu.png" alt=""></div>
        <div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px">
          <div class="shot"><span class="lab">② 名前と説明</span><img src="shot-form.png" alt=""></div>
          <div class="shot"><span class="lab">③ 指示（最初からひな形が入る）</span><img src="shot-inst.png" alt=""></div>
        </div>
      </div>
    </div>
    <div class="steps">
      <div class="st"><span class="n">1</span><span class="t"><b>スキル</b>の＋<small>作成タブの右のパネル</small></span></div>
      <div class="st"><span class="n">2</span><span class="t"><b>最初から作成</b><small>ファイルならアップロード</small></span></div>
      <div class="st"><span class="n">3</span><span class="t"><b>名前</b>と<b>説明</b><small>いつ使うかまで書く</small></span></div>
      <div class="st"><span class="n">4</span><span class="t"><b>指示</b>のひな形を埋めて作成<small>名前は64字・説明は1024字まで</small></span></div>
      <div class="st hint"><span class="n">!</span><span class="t">Browse skills は共有用<small>共有されたスキルを探す</small></span></div>
    </div>
  </div>

  <div class="nextbar"><img class="msi" src="${A}icons/ms/agent.png" alt="">→ 指示・ナレッジ・ツールとの使い分けは4枚目へ</div>
  <div class="src2">出典：Microsoft Learn（スキルを作成する／スキルを管理する）／撮影は 2026年11月の Copilot Studio（PA45 Demo 環境）・入力だけしてキャンセル、スキルは作成していない</div>
`;
</script>
</body>
</html>
