<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.180-1 作った人が異動したあとのフロー（4コマ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<link rel="stylesheet" href="../vol-180/kit.css">
<style>
  .stage{gap:0;}
  .k4{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:13px;padding:8px 9px 8px;background:#EEF4FF;border:2.5px solid #A9C6F5;position:relative;}
  .k4.mid{background:#FFFBEB;border-color:#F5C56B;}
  .k4.bad{background:#FEF2F2;border-color:#F0AEAE;}
  .kh{flex:0 0 auto;display:flex;align-items:center;gap:9px;}
  .kh .tm{flex:0 0 auto;font-size:21px;font-weight:900;color:#fff;background:#1E3A8A;border-radius:10px;padding:3px 11px;line-height:1.25;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .k4.mid .tm{background:#B45309;} .k4.bad .tm{background:#B91C1C;}
  .kh .kt{font-size:21px;font-weight:900;color:#1E3A8A;line-height:1.2;}
  .k4.mid .kt{color:#92400E;} .k4.bad .kt{color:#991B1B;}
  .ks{flex:1;min-height:0;position:relative;}
  .ks svg{position:absolute;left:0;bottom:0;}
  .ks .chara{right:-2px;bottom:-2px;}
  .cp{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.36;border-radius:9px;padding:6px 9px;color:#1E3A8A;background:#fff;border:1.5px solid #A9C6F5;}
  .k4.mid .cp{color:#92400E;border-color:#F5C56B;} .k4.bad .cp{color:#991B1B;border-color:#F0AEAE;}
  .cp b{color:#EA580C;}
  .arw{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:#2563EB;}
  .arw svg{width:24px;height:24px;max-width:none;}
  .hr{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:700;color:#242424;border-bottom:1.2px dashed #E5E7EB;padding:2px 0;white-space:nowrap;}
  .hr:last-child{border-bottom:none;}
  .hr .d{flex:1;}
  .k4 .kv{padding:1.5px 0;}
  .lockov{position:absolute;inset:0;background:rgba(71,85,105,.16);display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="slide"></div>
<script src="../vol-180/kit.js"></script>
<script>
const clock='<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>';
const flowRows=`<div class="ac"><span class="sq sc">${svgw(clock,2.4)}</span>繰り返し</div>
  <div class="ac"><span class="sq">${MS('sharepoint.svg',22)}</span>複数の項目の取得</div>
  <div class="ac"><span class="sq">${MS('outlook.svg',22)}</span>メールの送信 (V2)</div>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.180-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">フローを作った人が異動したあと、<br><span class="hl">止まっても誰も直せない</span>状態を防ぐ</div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">所有者が1人だけのフローは、その人が異動・退職すると<b>部署に直せる人が残りません</b>。<br>フローの中の<b>接続</b>も、作った人のアカウントのまま動いています</div>
  </div>
  <div class="stage">
    <div class="k4">
      <div class="kh"><span class="tm">4月</span><span class="kt">佐藤さんが<br>フローを作る</span></div>
      <div class="fw"><div class="fwh">${PA(22)}請求リマインド<span class="on">オン</span></div><div class="fwb">${flowRows}</div></div>
      <div class="ks">${SV(196,150,`
        ${tagG(2,12,'佐藤','所有者','blue')}
        <path d="M104 96c14 4 18 14 22 22" stroke="#92400E" stroke-width="3" fill="none" stroke-dasharray="1 5" stroke-linecap="round"/>
        ${keyG(96,104,{s:.86,rot:-8})}
        <rect x="118" y="62" width="62" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="149" y="82" text-anchor="middle" font-size="16" font-weight="900" fill="#92400E">接続</text>
      `)}${CH('laptop',122)}</div>
      <div class="cp">所有者は佐藤さん<b>1人</b>。<br>接続も佐藤さんのアカウント</div>
    </div>
    <div class="arw">${svgw(P.arrow,3)}</div>
    <div class="k4 mid">
      <div class="kh"><span class="tm">10月</span><span class="kt">佐藤さんが<br>異動する</span></div>
      <div class="fw"><div class="fwh">${PA(22)}請求リマインド<span class="on">オン</span></div><div class="fwb">
        <div class="kv"><span class="k">所有者</span>佐藤 花子 <span class="pilltag gy">1人のまま</span></div>
        <div class="kv"><span class="k">接続</span>${MS('sharepoint.svg',20)}${MS('outlook.svg',20)} 佐藤 花子</div>
        <div class="kv"><span class="k">所属</span>営業部 → 経理部</div>
        <div class="kv"><span class="k">引き継ぎ</span><b>業務だけ引き継いだ</b></div>
      </div></div>
      <div class="ks">${SV(196,158,`
        ${tagG(0,6,'佐藤','経理部へ','blue')}
        <path d="M116 60h52" stroke="#B45309" stroke-width="7" stroke-linecap="round"/><path d="M158 46l16 14-16 14" stroke="#B45309" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <g filter="url(#fSh)"><path d="M112 104l12-12h56l12 12z" fill="#D9A566" stroke="#7C4A12" stroke-width="1.6" stroke-linejoin="round"/><rect x="114" y="104" width="76" height="50" rx="3" fill="url(#gBox)" stroke="#7C4A12" stroke-width="1.6"/><rect x="144" y="104" width="16" height="50" fill="#F3E3C3" opacity=".8"/><rect x="122" y="130" width="18" height="12" rx="2" fill="#fff" opacity=".85"/></g>
      `)}${CH('smile',122)}</div>
      <div class="cp">フローの所有者と接続は、<br>佐藤さんの<b>まま残ります</b></div>
    </div>
    <div class="arw">${svgw(P.arrow,3)}</div>
    <div class="k4 bad">
      <div class="kh"><span class="tm">11月</span><span class="kt">フローが<br>失敗しはじめる</span></div>
      <div class="fw"><div class="fwh">${PA(22)}実行履歴<span class="ng">失敗</span></div><div class="fwb">
        <div class="hr"><span class="d">10月29日 9:00</span><span class="pilltag ok">成功</span></div>
        <div class="hr"><span class="d">10月30日 9:00</span><span class="pilltag ok">成功</span></div>
        <div class="hr"><span class="d">11月2日 9:00</span><span class="pilltag ng">失敗</span></div>
        <div class="hr"><span class="d">11月3日 9:00</span><span class="pilltag ng">失敗</span></div>
      </div></div>
      <div class="ks">${SV(196,150,`
        <g opacity=".9">${tagG(0,10,'佐藤','権限が変更','gray',{badge:'x'})}</g>
        ${keyG(88,96,{broken:true,s:.9})}
        <path d="M150 74l8-16M166 80l14-10M134 76l-2-16" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
      `)}${CH('surprise',118)}</div>
      <div class="cp">接続のアカウントの権限が外れたり<br>無効になると、<b>失敗することがある</b></div>
    </div>
    <div class="arw">${svgw(P.arrow,3)}</div>
    <div class="k4 bad">
      <div class="kh"><span class="tm">同じ日</span><span class="kt">部署の誰も<br>編集できない</span></div>
      <div class="fw" style="position:relative"><div class="fwh">${PA(22)}請求リマインド<span class="ng">失敗</span></div><div class="fwb">
        <div class="kv"><span class="k">所有者</span>佐藤 花子 <span class="pilltag ng">1人だけ</span></div>
        <div class="kv"><span class="k">編集</span>所有者だけができる</div>
        <div class="kv"><span class="k">管理者</span>所有者を足せる（3枚目）</div>
        <div class="kv"><span class="k">接続</span>${MS('sharepoint.svg',20)}${MS('outlook.svg',20)} 佐藤 花子</div>
      </div></div>
      <div class="ks">${SV(210,158,`
        <g transform="translate(0,30) scale(.84)">${tagG(0,0,'鈴木','編集不可','gray',{badge:'lock'})}</g>
        <g transform="translate(94,30) scale(.84)">${tagG(0,0,'山田','編集不可','gray',{badge:'lock'})}</g>
      `)}${CH('cry',112)}</div>
      <div class="cp">残った人は所有者ではないので、<br><b>開いて直すことができません</b></div>
    </div>
  </div>
  <div class="next">
    <span class="na">${svgw(P.arrow,2.6)}</span>
    <span>止まる前にやっておく設定は<b>2枚目</b>、異動の前に確かめる5点は<b>3枚目</b>へ</span>
  </div>
  <div class="src">出典：Microsoft Learn「クラウド フローを共有する」「所有者が組織を離れたときに孤立したフローを管理する」／人名・日付・フロー名は架空、画面は説明用の再現（実画面は未確認）</div>
`;
</script>
</body>
</html>
