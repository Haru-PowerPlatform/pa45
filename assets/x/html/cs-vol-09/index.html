<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.9-1 頼むだけでExcelもPDFも作って渡してくる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .left{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .right{flex:1.32;min-height:0;display:flex;flex-direction:column;gap:8px;}

  .chat{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;}
  .trace{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;background:#1E293B;border-radius:10px;
    padding:9px 11px;box-shadow:0 4px 11px rgba(20,40,90,.2);}
  .trace .tl{font-size:13.5px;font-weight:900;color:#C4B5FD;}
  .trace .tr2{display:flex;gap:8px;align-items:flex-start;font-family:'Roboto Mono',monospace;font-size:13px;
    font-weight:700;color:#93C5FD;line-height:1.4;}
  .trace .tr2 .dt{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#A78BFA;margin-top:6px;}
  .trace .tr2.ok{color:#86EFAC;} .trace .tr2.ok .dt{background:#22C55E;}
  .trace .tr2.warn{color:#FCD34D;} .trace .tr2.warn .dt{background:#F59E0B;}
  .trace .ja{font-size:13px;font-weight:700;color:#CBD5E1;line-height:1.34;padding-left:15px;
    font-family:"Noto Sans JP",sans-serif;}

  .outs{flex:1;min-height:0;display:flex;gap:10px;}
  .out{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--cs-line);
    border-radius:11px;overflow:hidden;box-shadow:0 5px 12px rgba(59,42,102,.16);}
  .out .oh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;color:#fff;font-size:14.5px;font-weight:900;}
  .out.xl .oh{background:linear-gradient(90deg,#0F6B3D,#16A34A);}
  .out.pd .oh{background:linear-gradient(90deg,#9A2020,#DC2626);}
  .out .ob{flex:1;min-height:0;padding:7px 8px;display:flex;flex-direction:column;}

  /* Excel シート再現 */
  .xls{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid #D1D1D1;}
  .xls .row{flex:1;min-height:0;display:flex;border-bottom:1px solid #E1DFDD;}
  .xls .row:last-child{border-bottom:none;}
  .xls .row.hd{flex:0 0 auto;background:#217346;color:#fff;font-weight:900;}
  .xls .c{flex:1;display:flex;align-items:center;padding:2px 6px;font-size:12.5px;font-weight:700;
    border-right:1px solid #E1DFDD;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .xls .c:last-child{border-right:none;}
  .xls .c.n{flex:0 0 34px;justify-content:center;color:#5B21B6;}
  .xls .c.w{flex:1.9;}
  .xls .row.hd .c.n{color:#fff;}

  /* A4チラシ */
  .flyer{flex:1;min-height:0;border-radius:6px;overflow:hidden;position:relative;background:#fff;border:1px solid #D1D1D1;}
  .flyer svg{position:absolute;inset:0;width:100%;height:100%;}

  .askrow{display:flex;gap:8px;align-items:flex-start;}
  .askrow .av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#64748B;color:#fff;font-size:12.5px;
    font-weight:900;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";

/* Excel の中身（実機で出た「全14回」構成をそのまま）*/
const rows=[['1','はじめてのPower Automate','ボタンひとつで動かす'],
  ['2','メールの添付を自動保存','受け取ったらすぐ保存'],
  ['3','Teamsに毎朝おしらせ','時間になったら投稿'],
  ['4','承認をフローで回す','押すだけで次へ進む'],
  ['…','（中略）','']];

/* A4チラシ（生成物の再現） */
const flyer=`<svg viewBox="0 0 210 297" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/><stop offset=".55" stop-color="#C026D3"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
  <rect x="0" y="0" width="210" height="297" fill="#fff"/>
  <rect x="0" y="0" width="210" height="52" fill="url(#fg)"/>
  <text x="105" y="26" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">PA45</text>
  <text x="105" y="43" font-family="Noto Sans JP" font-size="9.5" font-weight="700" fill="#F3E8FF" text-anchor="middle">毎週45分のハンズオン</text>
  ${[0,1,2,3,4,5].map(i=>`<g><rect x="16" y="${68+i*30}" width="18" height="18" rx="4" fill="#EDE9FE"/>
    <text x="25" y="${81+i*30}" font-family="Noto Sans JP" font-size="9" font-weight="900" fill="#5B21B6" text-anchor="middle">${i+1}</text>
    <rect x="42" y="${70+i*30}" width="${[132,108,142,96,124,116][i]}" height="6" rx="3" fill="#D9D3E8"/>
    <rect x="42" y="${80+i*30}" width="${[96,124,84,132,102,90][i]}" height="5" rx="2.5" fill="#EAE6F2"/></g>`).join('')}
  <rect x="16" y="256" width="178" height="24" rx="6" fill="#EDE9FE"/>
  <text x="105" y="271" font-family="Noto Sans JP" font-size="9" font-weight="900" fill="#5B21B6" text-anchor="middle">お申し込みは connpass から</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.9</div>
    <div class="part-pill">前編 <b>(1/2)</b></div>
    <div class="title-text">頼むだけで、<br>ExcelもPDFも作って渡してくる<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_confident_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">言葉で頼むと、<b>裏でAIがコードを書いて実行</b>し、ファイルにして返します。<br>
      できあがりは<em>その場でダウンロードできる本物のファイル</em>です。</div>
  </div>

  <div class="body">
    <div class="left panel p-cs">
      <div class="dlabel"><span class="dot"></span>頼んだことと、裏で起きたこと</div>
      <div class="chat seg">
        <div class="askrow"><span class="av">山</span>
          <span class="bub me">全14回の一覧を、Excelの表にしてください（列＝回／テーマ／ひとこと説明）</span></div>
      </div>
      <div class="trace">
        <div class="tl">推論トレース（実機で出た文言）</div>
        <div class="tr2"><span class="dt"></span>Searching knowledge</div>
        <div class="tr2"><span class="dt"></span>Let me create an Excel file with the 14 sessions.</div>
        <div class="ja">「14回ぶんのExcelを作ります」＝自分でコードを書き始める</div>
        <div class="tr2 warn"><span class="dt"></span>The OTF font has postscript outlines which Reportlab doesn't support.</div>
        <div class="ja">PDFの日本語フォントで一度つまずく</div>
        <div class="tr2 ok"><span class="dt"></span>Matplotlib can use OTF fonts directly.</div>
        <div class="ja">別の道具に切り替えて、自分で直して完成させた</div>
      </div>
    </div>

    <div class="right">
      <div class="bloom" style="align-self:flex-start;font-size:17px;">
        <img src="${A}icons/cs_logo.png" alt="">できあがったもの（そのまま受け取れる）</div>
      <div class="outs">
        <div class="out xl">
          <div class="oh">PA45_一覧.xlsx</div>
          <div class="ob seg">
            <div class="xls">
              <div class="row hd"><span class="c n">回</span><span class="c w">テーマ</span><span class="c">ひとこと説明</span></div>
              ${rows.map(([a,b,c])=>`<div class="row"><span class="c n">${a}</span><span class="c w">${b}</span><span class="c">${c}</span></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="out pd">
          <div class="oh">PA45_案内チラシ.pdf</div>
          <div class="ob"><div class="flyer">${flyer}</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">裏側で起きていること</div>
      <div class="grid">
        <div class="fc"><div class="ft">① コードを書く</div><div class="fd">新UIのエージェントは、その場でPythonを書いて動かすしくみを持っている</div></div>
        <div class="fc"><div class="ft">② つまずいたら直す</div><div class="fd">フォントで落ちたら別の道具に切り替え、自分で復旧して続けた</div></div>
        <div class="fc"><div class="ft">③ ファイルで返す</div><div class="fd">Excelもチラシも、開いて使える形でそのまま渡してくる</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ ただし</div>
      <div class="txt">出てきた一覧は<b>「全14回」のまま</b>でした。AIの作り話ではありません。<br>
        なぜそうなったかは<b>後編</b>で。</div>
    </div>
    <div class="src">出典：PA45 Demo環境での実機（推論トレースは実際に出た文言）／画面は説明用の再現です</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_guts_g.png" alt="">
`;
</script>
</body>
</html>
