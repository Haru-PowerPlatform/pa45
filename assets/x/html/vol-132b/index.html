<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.132-2 取引先との会議の前に、メールと資料の要点を1画面で読む</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型C寄り：Copilot Chat の回答が主役（左に会議前の"探し回る"情景）*/
  .vol-logo.cpl{display:flex;align-items:center;justify-content:center;padding:6px;}
  .stage{gap:12px;}
  .lf{flex:0 0 396px;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .lf .col{flex:1;padding:8px 10px 9px;}
  .scn{flex:0 0 auto;width:372px;height:196px;border-radius:11px;background:#FCE4E4;position:relative;overflow:hidden;}
  .scn svg{position:absolute;left:8px;top:0;width:340px;height:196px;}
  .scn .chara{position:absolute;right:2px;bottom:0;height:112px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .cp{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #B9B4F3;border-radius:14px;overflow:hidden;
    box-shadow:0 6px 16px rgba(60,40,140,.16);position:relative;}
  .cph{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 12px;background:linear-gradient(90deg,#F4F1FF,#EEF4FF);border-bottom:1.5px solid #E2DDFB;
    font-size:16.5px;font-weight:900;color:var(--navy);}
  .cph svg.lg{width:28px;height:28px;flex:0 0 auto;}
  .cph .wiq{display:flex;align-items:center;gap:6px;font-size:14.5px;color:#4338CA;background:#fff;border:1.5px solid #C7D2FE;border-radius:999px;padding:2px 10px 2px 6px;}
  .tg{width:30px;height:17px;border-radius:999px;background:#4F46E5;position:relative;}
  .tg::after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;}
  .cpb{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:8px 12px 8px;}
  .ask{align-self:flex-end;max-width:92%;background:#EEF2FF;border:1.5px solid #C7D2FE;border-radius:12px 12px 3px 12px;padding:6px 11px;
    font-size:16.5px;font-weight:700;color:var(--navy);line-height:1.45;}
  .mt{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.8px solid #6366F1;border-radius:7px;padding:0 8px;font-weight:900;color:#3730A3;font-size:15.5px;}
  .mt svg{width:17px;height:17px;flex:0 0 auto;}
  .ans{flex:1;min-height:0;display:flex;gap:9px;}
  .ans .av{flex:0 0 auto;width:30px;height:30px;}
  .ans .av svg{width:30px;height:30px;}
  .sec{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .bx{flex:1;min-height:0;border-radius:10px;padding:5px 10px;display:flex;flex-direction:column;justify-content:space-evenly;}
  .bx.m{background:#F0F6FF;border:1.5px solid #C9DCF7;}
  .bx.f{background:#F1FBF5;border:1.5px solid #BFE7D3;}
  .bx.q{background:#FFF8EB;border:1.5px solid #F8D79A;flex:0.8;}
  .bx .hd{display:flex;align-items:center;gap:7px;font-size:16.5px;font-weight:900;}
  .bx.m .hd{color:#1E40AF;} .bx.f .hd{color:#065F46;} .bx.q .hd{color:#92400E;}
  .bx .hd img,.bx .hd svg{width:24px;height:24px;flex:0 0 auto;}
  .li{font-size:15.5px;font-weight:700;color:#1F2937;line-height:1.38;padding-left:15px;position:relative;}
  .li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:#64748B;}
  .li b{color:#B91C1C;}
  .rf{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:5px;background:#E0E7FF;color:#3730A3;
    font-family:'Roboto Mono',monospace;font-size:12.5px;font-weight:700;margin-left:3px;vertical-align:1px;padding:0 3px;}
  .fl{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:#fff;font-size:11px;font-weight:900;
    margin-right:5px;vertical-align:-4px;font-family:'Roboto Mono',monospace;}
  .fl.x{background:#107C41;} .fl.p{background:#C43E1C;}
  .refs{flex:0 0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14.5px;font-weight:900;color:#475569;
    border-top:1.5px dashed #DDD6FE;padding-top:5px;}
  .refs .rc{background:#F5F3FF;border:1.5px solid #DDD6FE;border-radius:999px;padding:1px 10px;color:#4C1D95;}
  .bang{margin-left:auto;background:linear-gradient(180deg,#34D399,#16A34A);color:#fff;font-size:15px;font-weight:900;border-radius:999px;
    padding:3px 12px;box-shadow:0 3px 7px rgba(0,0,0,.2);transform:rotate(3deg);z-index:3;}
  .ch-r{position:absolute;right:-6px;bottom:-4px;height:112px;z-index:6;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));}
  .refs{padding-right:104px;}
  .ib{flex:1;min-height:0;background:#fff;border:2px solid var(--red-line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
  .ibh{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:3px 9px;background:#F1F5F9;font-size:15px;font-weight:900;color:var(--navy);}
  .ibh img{width:24px;height:24px;}
  .ir{flex:1;display:flex;align-items:center;gap:6px;padding:0 9px;border-top:1px solid #EEF2F6;font-size:15.5px;}
  .ir b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1F2937;}
  .ir span{flex:0 0 auto;font-size:14px;font-weight:700;color:#6B7280;}
  .ir.dim{opacity:.55;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  q:'<circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.8M12 17.3v.2"/>'};
/* AIのきらめき（ロゴの模写ではなく汎用の図形）*/
const spark=(id)=>`<svg class="lg" viewBox="0 0 32 32"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2F7CF6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
  <path d="M16 2c1.4 7.2 6.8 12.6 14 14-7.2 1.4-12.6 6.8-14 14-1.4-7.2-6.8-12.6-14-14C9.2 14.6 14.6 9.2 16 2z" fill="url(#${id})"/>
  <path d="M26 2.5c.4 2 1.5 3.1 3.5 3.5-2 .4-3.1 1.5-3.5 3.5-.4-2-1.5-3.1-3.5-3.5 2-.4 3.1-1.5 3.5-3.5z" fill="#F59E0B"/></svg>`;

/* 左の情景：時計（あと30分）＋散らばるメール12通＋資料3つ */
const env=(x,y,r,s)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s||1})"><rect x="2" y="3" width="44" height="30" rx="3" fill="#000" opacity=".12"/>
  <rect width="44" height="30" rx="3" fill="url(#eg)" stroke="#C9CED8"/><path d="M1 2l22 15L43 2" fill="none" stroke="#B4BAC6" stroke-width="1.6"/>
  <rect x="33" y="4" width="8" height="9" rx="1" fill="#F87171"/></g>`;
const doc=(x,y,r,c,t)=>`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="2" y="3" width="34" height="42" rx="3" fill="#000" opacity=".13"/>
  <rect width="34" height="42" rx="3" fill="#fff" stroke="#CBD5E1"/><rect x="0" y="0" width="34" height="12" rx="3" fill="${c}"/>
  <text x="17" y="9.5" font-size="8.5" font-weight="900" fill="#fff" text-anchor="middle" font-family="Roboto Mono">${t}</text>
  <path d="M6 19h22M6 25h22M6 31h15" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round"/></g>`;
const scene=`<svg viewBox="0 0 372 214"><defs>
  <linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EBF1"/></linearGradient>
  <linearGradient id="ck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
  <rect x="0" y="176" width="372" height="38" fill="#F3C9C9"/>
  <!-- 時計 -->
  <circle cx="58" cy="62" r="44" fill="#000" opacity=".1"/><circle cx="55" cy="58" r="44" fill="url(#ck)" stroke="#DC2626" stroke-width="5"/>
  <path d="M55 58 L55 58 A34 34 0 0 1 89 58 Z" fill="#FECACA" opacity="0"/>
  <path d="M55 24 A34 34 0 0 1 55 92 L55 58 Z" fill="#FECACA"/>
  <g stroke="#475569" stroke-width="3" stroke-linecap="round"><path d="M55 18v6M55 92v6M15 58h6M89 58h6"/></g>
  <path d="M55 58V31" stroke="#1F2937" stroke-width="4.5" stroke-linecap="round"/><path d="M55 58l17 9" stroke="#1F2937" stroke-width="4" stroke-linecap="round"/>
  <circle cx="55" cy="58" r="4.5" fill="#DC2626"/>
  <rect x="14" y="110" width="84" height="26" rx="13" fill="#DC2626"/><text x="56" y="128.5" font-size="15" font-weight="900" fill="#fff" text-anchor="middle" font-family="Noto Sans JP">あと30分</text>
  <!-- メール12通 -->
  ${env(118,10,-12)}${env(170,6,8)}${env(222,18,-5)}${env(120,58,10)}${env(172,52,-8)}${env(150,100,4)}
  ${env(208,80,14)}${env(110,140,-6)}${env(160,150,9)}${env(205,128,-14)}${env(252,64,6,.9)}${env(240,108,-4,.9)}
  <rect x="128" y="182" width="112" height="24" rx="12" fill="#fff" stroke="#DC2626" stroke-width="2"/>
  <text x="184" y="199" font-size="14" font-weight="900" fill="#991B1B" text-anchor="middle" font-family="Noto Sans JP">関係メール 12通</text>
  <!-- 共有された資料 -->
  ${doc(16,150,-8,'#107C41','XLSX')}${doc(52,146,6,'#C43E1C','PPTX')}${doc(86,156,-3,'#2B579A','DOCX')}
  </svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.132-2</div>
    <div class="vol-logo cpl">${spark('t1')}</div>
    <div class="title-text">取引先との会議の前に、<span class="hl">メールと資料の要点を1画面で読む</span></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">Copilot Chat で<b>「/」から会議を選び</b>、準備の要点を頼むだけ。<br>その会議に関係するメールと共有ファイルの要点が、出典つきで返ってきます</div>
  </div>

  <div class="stage">
    <div class="lf">
      <div class="col bad">
        <div class="ph"><span class="mk">${svgw('<path d="M6 6l12 12M18 6L6 18"/>',3)}</span>受信トレイを遡って探す</div>
        <div class="scn">${scene}<img class="chara" src="${A}chara/chara_trouble.png" alt=""></div>
        <div class="ib"><div class="ibh"><img src="${A}icons/pa_outlook.png" alt="">受信トレイ</div>
          <div class="ir"><b>RE: RE: 11月分の件</b><span>佐藤</span></div>
          <div class="ir"><b>お見積書送付のご案内</b><span>営業部</span></div>
          <div class="ir"><b>【共有】出荷計画を更新しました</b><span>OneDrive</span></div></div>
        <div class="cap">件名がバラバラで、開くまで分からない</div>
      </div>
      <div class="metric"><span class="ml">会議前の読み返し</span><span class="mv">12通を開く</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">1画面</span></div>
    </div>

    <div class="cp">
      <div class="cph">${spark('t2')}Microsoft 365 Copilot Chat<span class="bang">✓ 要点がそろった</span><span class="wiq"><span class="tg"></span>Work IQ</span></div>
      <div class="cpb">
        <div class="ask"><span class="mt">${svgw(P.cal,2.2)}みどり精機 定例（10/14 14:00）</span><br>この会議の準備のために、関連するメールとファイルの要点をまとめて</div>
        <div class="ans">
          <div class="av">${spark('t3')}</div>
          <div class="sec">
            <div class="bx m"><div class="hd"><img src="${A}icons/pa_outlook.png" alt="">メールの要点</div>
              <div class="li">納期を<b>11/20 → 11/27</b>に延ばしたいと佐藤さんから相談<span class="rf">1</span></div>
              <div class="li">見積の単価は前回の 4,800円 のままで合意済み<span class="rf">2</span></div></div>
            <div class="bx f"><div class="hd"><img src="${A}icons/pa_onedrive.png" alt="">共有ファイルの要点</div>
              <div class="li"><span class="fl x">X</span>出荷計画.xlsx：11月第4週が<b>先方の倉庫の棚卸し</b>と重なる<span class="rf">3</span></div>
              <div class="li"><span class="fl p">P</span>提案資料_v3.pptx：前回から価格表のページが追加<span class="rf">4</span></div></div>
            <div class="bx q"><div class="hd">${svgw(P.q,2.4)}会議で確かめたいこと</div>
              <div class="li">27日納品でも棚卸しに間に合うか／分納にするか</div>
              <div class="li">価格表のページは会議の前に目を通しておく</div></div>
            <div class="refs">参照<span class="rc">✉ メール 5件</span><span class="rc">📄 ファイル 2件</span><span style="color:#6B7280">番号から元のメールへ</span></div>
          </div>
        </div>
      </div>
      <img class="ch-r" src="${A}chara/chara_point.png" alt="">
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>フローも設定もいりません。頼み方を1文コピーしておくだけです。<b>やり方は3枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft サポート「Microsoft Copilot で特定のファイルなどを参照する」／会社名・人名・内容は架空の例</div>
`;
</script>
</body>
</html>
