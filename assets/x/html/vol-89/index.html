<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.89-1 文字列の式チートシート10選</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:18.5px;color:var(--blue-dark);line-height:1.3;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:13px;min-height:0;}

  /* 左：チートシート2列グリッド */
  .sheet{flex:1.55;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;min-height:0;}
  .fx{display:flex;flex-direction:column;justify-content:center;gap:3px;background:#F8F9FA;border:1.5px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:7px 12px;min-height:0;}
  .fx .fn{font-family:'Roboto Mono',monospace;font-size:16.5px;font-weight:900;color:var(--blue-dark);}
  .fx .fn .lb{font-family:'Noto Sans JP';font-size:13px;color:var(--weak);font-weight:800;margin-left:7px;}
  .fx .ex{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;color:#475569;line-height:1.3;}
  .fx .rs{font-size:13.5px;font-weight:900;color:var(--green-dark);line-height:1.25;}
  .fx .rs::before{content:"→ ";color:var(--green);}
  .fx.v2{border-left-color:var(--violet);} .fx.v2 .fn{color:#5B21B6;}
  .fx.v3{border-left-color:var(--orange);} .fx.v3 .fn{color:#9A3412;}

  /* 右：どこに書く?モック＋メモ */
  .side{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0;}
  .editor{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;border:2px solid #C9B4EC;border-radius:13px;box-shadow:0 5px 13px rgba(124,58,237,.15);overflow:hidden;}
  .edh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 13px;background:linear-gradient(90deg,#5B21B6,#7C3AED);color:#fff;font-weight:900;font-size:16px;}
  .edh .fxb{width:30px;height:30px;background:#fff;color:#7C3AED;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-style:italic;font-size:16px;}
  .edb{flex:1;padding:11px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .tabrow{display:flex;gap:7px;}
  .tab{font-size:13.5px;font-weight:900;border-radius:8px 8px 0 0;padding:6px 14px;color:var(--weak);background:#F1F4F8;}
  .tab.on{color:#5B21B6;background:#F3EDFC;border-bottom:3px solid #7C3AED;}
  .fxinput{background:#1E293B;border-radius:9px;padding:11px 12px;font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;color:#93C5FD;line-height:1.5;}
  .fxinput .cur{display:inline-block;width:2px;height:16px;background:#fff;vertical-align:-2px;animation:none;}
  .okbtn{align-self:flex-end;background:linear-gradient(180deg,#8B5CF6,#7C3AED);color:#fff;font-size:14px;font-weight:900;border-radius:8px;padding:7px 18px;box-shadow:0 3px 6px rgba(124,58,237,.3);}
  .realrow{display:flex;flex-direction:column;gap:5px;background:#F8FAFC;border:1.5px solid #E2E8F1;border-radius:9px;padding:8px 10px;}
  .realrow .rl{font-size:12.5px;font-weight:900;color:var(--weak);}
  .realrow .rv{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:800;color:#243B58;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .realrow .dynp{display:inline-flex;align-items:center;gap:3px;background:#EAF2FF;border:1px solid #9DC1F5;border-radius:6px;padding:1px 7px;font-size:12.5px;color:#0B3A8F;font-family:'Noto Sans JP';font-weight:900;}
  .realrow .dynp::before{content:"⚡";font-size:11px;}
  .edcap{font-size:14px;font-weight:800;color:#5B21B6;background:#F5F0FD;border:1.5px solid #D6C7EF;border-radius:9px;padding:8px 10px;line-height:1.4;}
  .edcap b{color:#7C3AED;}
  .memo{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;background:#FFFBEB;border:2px solid #FCD34D;border-radius:12px;padding:10px 12px;}
  .memo .m{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;color:#92400E;line-height:1.3;}
  .memo .m .e{flex:0 0 auto;font-size:17px;}
  .memo .m code{font-family:'Roboto Mono',monospace;font-size:13px;background:#fff;border:1px solid #F6D08A;border-radius:5px;padding:1px 6px;color:#B45309;}

  .next{flex:0 0 auto;margin:9px 16px 13px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:25px;height:25px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const FX=[
 ['','split','分ける',"split('田中-営業部','-')","[田中, 営業部] に分割"],
 ['','replace','置きかえ',"replace('080-1234-5678','-','')","08012345678（ハイフン除去）"],
 ['','substring','切り出す',"substring('ABC123',3,3)","123（3文字目から3つ）"],
 ['','concat','つなげる',"concat('見積_','0801','.pdf')","見積_0801.pdf"],
 ['v2','trim','余白とり',"trim('　田中 太郎　')","田中 太郎（前後の空白を削除）"],
 ['v2','toUpper / toLower','大小文字',"toUpper('abc-123')","ABC-123"],
 ['v2','length','文字数',"length('パスワード123')","8（文字数チェックに）"],
 ['v2','indexOf','位置さがし',"indexOf('請求書_9月.pdf','_')","3（何文字目にあるか）"],
 ['v3','first + split','先頭だけ',"first(split('田中-営業部','-'))","田中（姓だけ取れる）"],
 ['v3','coalesce','空なら代打',"coalesce(null,'未入力')","未入力（空欄対策の定番）"],
];

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.89-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">文字いじりはこの10個で足りる｜<span class="hl">文字列の式チートシート【保存版】</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">「ハイフンを消したい」「姓だけ取りたい」——文字の加工は<b>この10個の式</b>でほぼ足ります。<b>コピペして値だけ差し替え</b>ればOK。</div>
  </div>

  <div class="stage">
    <div class="sheet">
      ${FX.map(([c,fn,lb,ex,rs])=>`<div class="fx ${c}"><div class="fn">${fn}<span class="lb">${lb}</span></div><div class="ex">${ex}</div><div class="rs">${rs}</div></div>`).join('')}
    </div>

    <div class="side">
      <div class="editor">
        <div class="edh"><span class="fxb">fx</span>どこに書く？（式エディタ）</div>
        <div class="edb">
          <div class="tabrow"><span class="tab">動的なコンテンツ</span><span class="tab on">式</span></div>
          <div class="fxinput">replace(<span style="color:#FCA5A5">'080-1234-5678'</span>,'-','')<span class="cur"></span></div>
          <div class="okbtn">OK</div>
          <div class="realrow"><span class="rl">実戦ではこう（'文字' を ⚡ に差し替え）</span><span class="rv">replace(<span class="dynp">電話番号</span>,'-','')</span></div>
          <div class="edcap">入力欄をクリック →<b>「式」タブ</b>に貼り付けて<b>OK</b>。'文字' の部分は<b>⚡動的コンテンツ</b>に差し替えて使います。</div>
        </div>
      </div>
      <div class="memo">
        <div class="m"><span class="e">0️⃣</span>substring の位置は <code>0始まり</code>（1文字目＝0）</div>
        <div class="m"><span class="e">🇯🇵</span>日本語もそのまま扱える（全角OK）</div>
        <div class="m"><span class="e">🈳</span>空欄で落ちるなら <code>coalesce</code> で保険</div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>組み合わせて<b>「ファイル名から日付」「氏名を姓と名に」</b>——実務レシピ3連発は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（Azure Logic Apps／Power Automate 式関数リファレンス）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
