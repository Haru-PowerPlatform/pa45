<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.13-2 オーディオの概要の作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  .stage{gap:8px;}
  .c3{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;border-radius:14px;padding:8px 10px 9px;background:var(--mc-bg);border:2.5px solid var(--mc-line);}
  .c3 .h{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px;line-height:1.2;color:var(--mc-dark);}
  .c3 .h .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--mc);}
  .c3 .cp{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.38;border-radius:9px;padding:6px 10px;color:var(--mc-dark);background:#fff;border:1.5px solid var(--mc-line);}
  .c3 .cp b{color:#EA580C;}
  .arrowc{flex:0 0 24px;display:flex;align-items:center;justify-content:center;color:var(--mc);}
  .arrowc svg{width:24px;height:24px;max-width:24px;}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--segline);border-radius:9px;overflow:hidden;box-shadow:0 3px 9px rgba(0,0,0,.10);}
  .win .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;color:#242424;}
  .win .wb{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 8px;gap:4px;}
  .cmd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 0 6px;border-bottom:1px solid #EDEBE9;}
  .cbtn{display:inline-flex;align-items:center;gap:6px;font-size:15.5px;font-weight:700;color:#242424;border:1.5px solid #C8C6C4;border-radius:6px;padding:3px 9px;background:#fff;}
  .cbtn.on{border-color:#0F766E;background:#E6F6F3;box-shadow:0 0 0 3px #99E2D5;}
  .cbtn .cr{font-size:13.5px;color:#605E5C;}
  .muted{font-size:15.5px;font-weight:700;color:#A19F9D;}
  .fr{flex:1;min-height:0;display:flex;align-items:center;gap:9px;padding:0 6px;border-radius:6px;font-size:15.5px;font-weight:600;color:#242424;}
  .fr .ck{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.6px solid #8A8886;display:flex;align-items:center;justify-content:center;}
  .fr.sel{background:#DDEFFD;}
  .fr.sel .ck{background:#0F6CBD;border-color:#0F6CBD;}
  .fr .ck svg{width:13px;height:13px;color:#fff;}
  .fr .fi{flex:0 0 auto;width:28px;height:28px;}
  .fr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fr.dim{color:#A19F9D;}
  .menu{flex:1;min-height:0;display:flex;flex-direction:column;border:1.5px solid #E1DFDD;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.16);margin:2px 4px 0;padding:4px;background:#fff;}
  .mi{flex:1;min-height:0;display:flex;align-items:center;gap:9px;padding:0 10px;font-size:16.5px;font-weight:600;color:#242424;border-radius:6px;}
  .mi .d{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#C8C6C4;}
  .mi.hit{background:#FFF7ED;box-shadow:inset 0 0 0 2.5px #EA580C;font-weight:800;color:#9A3412;}
  .mi.hit .d{background:#EA580C;}
  .mi .tap{margin-left:auto;font-family:"Noto Sans JP";font-size:14px;font-weight:900;color:#fff;background:#EA580C;border-radius:999px;padding:1px 9px;}
  .seg2{flex:0 0 auto;display:flex;border:1.5px solid #C8C6C4;border-radius:999px;overflow:hidden;}
  .seg2 span{flex:1;text-align:center;font-size:15.5px;font-weight:700;padding:4px 4px;color:#424242;white-space:nowrap;}
  .seg2 span.on{background:#0F766E;color:#fff;}
  .wave{flex:1;min-height:0;position:relative;}
  .wave svg{position:absolute;inset:0;width:100%;height:100%;}
  .ctl{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-start;}
  .ctl .c{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700;color:#424242;}
  .ctl .c i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F3F2F1;color:#242424;}
  .ctl .c i svg{width:20px;height:20px;}
  .ctl .c.pp i{background:#0F766E;color:#fff;}
  .pb2{flex:0 0 auto;display:flex;gap:6px;}
  .pb2 span{flex:1;text-align:center;font-size:15px;font-weight:700;color:#242424;border:1.5px solid #C8C6C4;border-radius:6px;padding:3px 2px;white-space:nowrap;}
  .mob{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin:8px 16px 0;background:#fff;border:2px solid var(--mc-line);border-radius:12px;padding:6px 14px;}
  .mob .ph{flex:0 0 auto;width:30px;height:46px;border-radius:7px;background:#111827;position:relative;}
  .mob .ph::after{content:"";position:absolute;inset:4px 3px;border-radius:4px;background:#99E2D5;}
  .mob .ml{flex:0 0 auto;font-size:17px;font-weight:900;color:var(--mc-dark);}
  .mob .st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mob .st span{font-size:16px;font-weight:900;color:#1B2A44;background:#EFFAF8;border:1.5px solid #A7E3D8;border-radius:8px;padding:3px 10px;}
  .mob .st .a{background:none;border:none;padding:0;color:var(--mc);}
  .mob .st .o{background:#FFF7ED;border-color:#FDBA74;color:#9A3412;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',ok:'<path d="M5 12l5 5 9-10"/>',
  rw:'<path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/>',ff:'<path d="M13 6l6 6-6 6M5 6l6 6-6 6"/>',pause:'<path d="M9 6v12M15 6v12"/>',
  sp:'<circle cx="12" cy="13" r="8"/><path d="M12 13l4-4M12 3v2"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const PDF=`<svg class="fi" viewBox="0 0 28 28"><path d="M6 2h12l6 6v18H6z" fill="#fff" stroke="#C8C6C4" stroke-width="1.4"/><path d="M18 2v6h6" fill="#F3F2F1" stroke="#C8C6C4" stroke-width="1.4"/><rect x="2" y="13" width="18" height="10" rx="2" fill="#D13438"/><text x="11" y="21" text-anchor="middle" font-size="7.5" font-weight="900" fill="#fff" font-family="Segoe UI,Arial">PDF</text></svg>`;
const MP4=`<svg class="fi" viewBox="0 0 28 28"><path d="M6 2h12l6 6v18H6z" fill="#fff" stroke="#C8C6C4" stroke-width="1.4"/><path d="M18 2v6h6" fill="#F3F2F1" stroke="#C8C6C4" stroke-width="1.4"/><rect x="2" y="13" width="18" height="10" rx="2" fill="#5B5FC7"/><path d="M8 15.5v5l5-2.5z" fill="#fff"/></svg>`;
const XLS=`<svg class="fi" viewBox="0 0 28 28"><path d="M6 2h12l6 6v18H6z" fill="#fff" stroke="#E1DFDD" stroke-width="1.4"/><rect x="2" y="13" width="18" height="10" rx="2" fill="#B9C9BE"/><text x="11" y="21" text-anchor="middle" font-size="7.5" font-weight="900" fill="#fff" font-family="Segoe UI,Arial">XLS</text></svg>`;
const WAVE=`<svg viewBox="0 0 340 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${
  [10,22,34,18,40,28,46,30,20,38,26,44,16,34,24,40,14,30,36,22,42,18,28,12].map((h,i)=>`<rect x="${8+i*13.6}" y="${30-h/2}" width="7" height="${h}" rx="3" fill="${i<10?'#0F766E':'#99E2D5'}"/>`).join('')}</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.13-2</div><div class="lic-pill paid">M365 Copilot ライセンスが要る</div></div>
    <div class="title-text">資料の音声は、OneDrive の<br><span class="hl">［Copilot］メニューから作る</span></div>
    <div class="title-apps">${MS('onedrive.svg',44)}<span class="pl">+</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${MS('onedrive.svg',34)}</div>
    <div class="txt">Web の OneDrive でファイルを選び、<b>［Copilot］∨ → オーディオの概要の作成</b>。<br>数分で音声ができ、<b>1人の語り</b>と<b>2人の対話</b>を切り替えて聞けます</div>
  </div>
  <div class="stage">
    <div class="c3">
      <div class="h"><span class="n">1</span>ファイルを選ぶ</div>
      <div class="win seg"><div class="wh">${MS('onedrive.svg',22)}OneDrive<span class="repro">画面は説明用の再現</span></div>
        <div class="wb">
          <div class="cmd"><span class="cbtn">${CPI(18)}Copilot<span class="cr">∨</span></span><span class="muted">1 個選択</span></div>
          <div class="fr sel"><span class="ck">${svgw(P.ok,3.4)}</span>${PDF}<span class="nm">Q3_Market_Report.pdf</span></div>
          <div class="fr"><span class="ck"></span>${MS('word.svg',28)}<span class="nm">Policy_Update_2026.docx</span></div>
          <div class="fr"><span class="ck"></span>${MP4}<span class="nm">Weekly_Sync_Recording.mp4</span></div>
          <div class="fr dim"><span class="ck"></span>${XLS}<span class="nm">Budget_Detail.xlsx</span></div>
        </div></div>
      <div class="cp">対象は<b>Word・PDF・Teams 会議の記録</b>。<br>英語で<b>200語以上</b>あるファイル</div>
    </div>
    <div class="arrowc">${svgw(P.arrow,3)}</div>
    <div class="c3">
      <div class="h"><span class="n">2</span>［Copilot］∨ を開く</div>
      <div class="win seg"><div class="wh">${MS('onedrive.svg',22)}OneDrive<span class="repro">画面は説明用の再現</span></div>
        <div class="wb">
          <div class="cmd"><span class="cbtn on">${CPI(18)}Copilot<span class="cr">∨</span></span><span class="muted">Q3_Market_Report.pdf</span></div>
          <div class="menu">
            <div class="mi"><span class="d"></span>要約してください</div>
            <div class="mi"><span class="d"></span>FAQ を作成する</div>
            <div class="mi hit"><span class="d"></span>オーディオの概要の作成<span class="tap">ここ</span></div>
            <div class="mi"><span class="d"></span>バージョンの比較</div>
            <div class="mi"><span class="d"></span>質問する</div>
          </div>
        </div></div>
      <div class="cp">撮影時（2026年10月）のメニュー。<br><b>オーディオの概要の作成</b>を選ぶと、数分で完成</div>
    </div>
    <div class="arrowc">${svgw(P.arrow,3)}</div>
    <div class="c3">
      <div class="h"><span class="n">3</span>スタイルを選んで聞く</div>
      <div class="win seg"><div class="wh">${PDF.replace('class="fi"','class="fi" style="width:22px;height:22px"')}Q3_Market_Report.pdf<span class="repro">画面は説明用の再現</span></div>
        <div class="wb" style="gap:6px">
          <div class="seg2"><span class="on">要約スタイル</span><span>ポッドキャスト スタイル</span></div>
          <div class="wave">${WAVE}</div>
          <div class="ctl">
            <div class="c"><i>${svgw(P.rw,2.6)}</i>巻き戻し</div>
            <div class="c pp"><i>${svgw(P.pause,3)}</i>一時停止</div>
            <div class="c"><i>${svgw(P.ff,2.6)}</i>早送り</div>
            <div class="c"><i>${svgw(P.sp,2.4)}</i>再生速度</div>
          </div>
          <div class="pb2"><span>トランスクリプトの表示</span><span>OneDrive に保存</span></div>
        </div></div>
      <div class="cp"><b>要約スタイル</b>＝1人の語り（既定）、<br><b>ポッドキャスト スタイル</b>＝2人の対話</div>
    </div>
  </div>
  <div class="mob">
    <span class="ph"></span><span class="ml">スマホでは</span>
    <div class="st"><span>OneDrive アプリ</span><span class="a">${svgw(P.arrow,3).replace('class="ic"','class="ic" style="width:20px;height:20px"')}</span><span>ファイルの（…）</span><span class="a">${svgw(P.arrow,3).replace('class="ic"','class="ic" style="width:20px;height:20px"')}</span><span class="o">オーディオの概要を作成</span><span>聞きながらほかのアプリも使える</span></div>
  </div>
  <div class="warnbar">
    <span class="wl">⚠ 使う前に確認</span>
    <div class="ws"><span>英語のファイルだけ（ほかの言語はエラー）</span><span>職場・学校のアカウント＋M365 Copilot ライセンス</span><span>1日の利用上限がかかる場合あり</span></div>
  </div>
  <div class="src">出典：Microsoft サポート「OneDrive で Copilot でオーディオの概要を生成する」「Get started with Copilot in OneDrive」／メニューは2026年10月の実画面で確認・画面は説明用の再現</div>
`;
</script>
</body>
</html>
