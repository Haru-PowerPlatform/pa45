<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.122-1 請求書を置くだけで、取引先・金額・期限が台帳に入る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:10px;}
  /* 型C：主役＝請求書PDF → 読み取り結果 → 台帳 */
  .inv-wrap{flex:0 0 404px;display:flex;flex-direction:column;gap:7px;min-height:0;}
  .inv{flex:1;min-height:0;position:relative;background:#fff;border:2px solid #CBD5E1;border-radius:6px;
    box-shadow:0 8px 18px rgba(20,40,90,.20);padding:12px 16px 10px;display:flex;flex-direction:column;gap:6px;justify-content:space-between;}
  .inv .pdf{position:absolute;top:-2px;left:-2px;background:#DC2626;color:#fff;font-size:12.5px;font-weight:900;
    border-radius:6px 0 8px 0;padding:2px 9px;font-family:'Roboto Mono',monospace;}
  .inv .ttl{text-align:center;font-size:24px;font-weight:900;letter-spacing:.5em;color:#1F2937;
    border-bottom:3px double #1F2937;padding-bottom:3px;margin:0 70px;}
  .inv .row2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .inv .to{align-self:flex-start;white-space:nowrap;font-size:17px;font-weight:900;color:#1F2937;border-bottom:1.5px solid #1F2937;padding-bottom:1px;}
  .inv .meta{display:flex;flex-direction:column;gap:9px;padding-top:4px;font-size:14px;font-weight:700;color:#334155;text-align:right;}
  .inv .from{margin-top:6px;font-size:14px;font-weight:700;color:#334155;text-align:right;line-height:1.35;}
  .inv .tot{line-height:1.5;font-size:15px;font-weight:900;color:#1F2937;}
  .inv .tot .yen{font-size:26px;font-weight:900;font-family:'Roboto Mono',monospace;}
  .inv .bank{font-size:13.5px;font-weight:700;color:#64748B;line-height:1.4;border-top:1px dashed #CBD5E1;padding-top:4px;}
  .inv table{width:100%;border-collapse:collapse;font-size:15px;font-weight:700;color:#334155;}
  .inv th{background:#EEF2F7;font-size:13.5px;padding:3px 6px;border:1px solid #CBD5E1;}
  .inv td{padding:4px 6px;border:1px solid #E2E8F0;}
  .inv td.n{text-align:right;font-family:'Roboto Mono',monospace;}
  .hl{position:relative;display:inline-block;border-radius:4px;padding:0 4px;outline:3px solid var(--c);
    background:color-mix(in srgb,var(--c) 14%,transparent);}
  .hl .bn{position:absolute;top:-11px;left:-11px;width:21px;height:21px;border-radius:50%;background:var(--c);color:#fff;
    font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP';
    box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .c1{--c:#2563EB;} .c2{--c:#7C3AED;} .c3{--c:#0891B2;} .c4{--c:#EA580C;} .c5{--c:#16A34A;}
  .drop{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:#EFF6FF;border:2px dashed #7AA7F0;border-radius:10px;
    padding:6px 10px;font-size:15.5px;font-weight:900;color:var(--blue-dark);line-height:1.25;}
  .drop img{width:28px;height:28px;flex:0 0 auto;}

  /* 中央の矢印（AIが読む）*/
  .mid{flex:0 0 110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;}
  .mid .ai{width:70px;height:70px;border-radius:50%;background:linear-gradient(180deg,#A78BFA,#6D28D9);padding:15px;
    box-shadow:0 5px 12px rgba(91,33,182,.35);}
  .mid .lb{font-size:16px;font-weight:900;color:#5B21B6;text-align:center;line-height:1.3;}
  .mid .ar{width:78px;height:30px;}

  .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .res{flex:0 0 auto;background:#F7F3FF;border:2.5px solid #C9B4F4;border-radius:12px;padding:7px 10px 8px;display:flex;flex-direction:column;gap:5px;}
  .res .rh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:#5B21B6;}
  .res .rh .bd{margin-left:auto;font-size:13px;background:#6D28D9;color:#fff;border-radius:999px;padding:2px 10px;}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .fx{display:flex;align-items:center;gap:7px;background:#fff;border:1.8px solid #DDD3F7;border-left:6px solid var(--c);border-radius:7px;padding:4px 8px;}
  .fx .k{font-size:13.5px;font-weight:900;color:var(--c);white-space:nowrap;}
  .fx .v{flex:1;font-size:16px;font-weight:900;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Roboto Mono','Noto Sans JP',monospace;}
  .fx.w{grid-column:1 / 3;}
  .fx .cf{font-size:12.5px;font-weight:900;color:#15803D;background:#DCFCE7;border-radius:5px;padding:1px 6px;font-family:'Roboto Mono',monospace;}

  .led{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid var(--green-line);border-radius:12px;overflow:hidden;
    box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .led .lh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(90deg,#036C70,#0E8A8F);color:#fff;
    font-size:15.5px;font-weight:900;}
  .led .lh img{width:26px;height:26px;background:#fff;border-radius:6px;padding:2px;}
  .led .lh .cnt{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px;}
  .lt{flex:1;min-height:0;display:flex;flex-direction:column;}
  .lr{flex:1;display:grid;grid-template-columns:1.45fr 1.25fr .95fr .95fr 1fr;align-items:center;border-bottom:1.3px solid #E5E7EB;
    font-size:14.5px;font-weight:700;color:#334155;}
  .lr > span{padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lr.h{flex:0 0 27px;background:#F1F5F9;font-size:13.5px;font-weight:900;color:#475569;}
  .lr .n{text-align:right;font-family:'Roboto Mono',monospace;}
  .lr.new{background:#DCFCE7;outline:3px solid #16A34A;outline-offset:-3px;font-weight:900;color:#065F46;position:relative;}
  .lr.new .tag{position:absolute;right:6px;top:-13px;background:#16A34A;color:#fff;font-size:12.5px;font-weight:900;border-radius:999px;padding:1px 9px;}
  .bot{flex:0 0 auto;display:flex;gap:8px;align-items:stretch;}
  .bot .metric{flex:0 0 auto;}
  .bot .uses{flex:1;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:5px 9px;}
  .chara-r{position:absolute;right:18px;bottom:66px;height:116px;z-index:6;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const AIW=`<svg viewBox="0 0 24 24" fill="#fff" style="width:100%;height:100%" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2.2l1.9 5.1 5.1 1.9-5.1 1.9L12 16.2l-1.9-5.1L5 9.2l5.1-1.9z"/>
  <path d="M18.6 14.6l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg>`;
const ARR=`<svg class="ar" viewBox="0 0 78 30" xmlns="http://www.w3.org/2000/svg"><path d="M4 15 H 62" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M56 5 L 72 15 L 56 25" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.122-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">請求書を置くだけで、<span class="hl" style="outline:none;background:none;padding:0;color:#FFE08A">取引先・金額・期限が台帳に入る</span></div>
    <img class="title-chara" src="${A}chara/chara_surprise.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">AIが請求書を読んで<b>取引先・番号・請求日・期限・合計</b>を抜き出し、台帳に1行足します。<br>人がやるのは、読み取り結果の確認だけ</div>
  </div>

  <div class="stage">
    <div class="inv-wrap">
      <div class="drop"><img src="${A}icons/pa_sharepoint.png" alt="">届いた請求書PDFを「請求書」フォルダーに置く</div>
      <div class="inv">
        <span class="pdf">PDF</span>
        <div class="ttl">請求書</div>
        <div class="to">株式会社みどり製作所 御中</div>
        <div class="row2">
          <div class="tot">ご請求金額<br><span class="hl c5"><span class="bn">5</span><span class="yen">¥187,000</span></span></div>
          <div class="meta">
            <span>請求番号 <span class="hl c2"><span class="bn">2</span>INV-2026-0918</span></span>
            <span>請求日 <span class="hl c3"><span class="bn">3</span>2026年9月18日</span></span>
          </div>
        </div>
        <div class="from"><span class="hl c1"><span class="bn">1</span>山田商事株式会社</span>　大阪市北区○○1-2</div>
        <table>
          <tr><th>品目</th><th>数量</th><th>金額</th></tr>
          <tr><td>保守点検作業</td><td class="n">1式</td><td class="n">120,000</td></tr>
          <tr><td>交換フィルター</td><td class="n">4個</td><td class="n">24,000</td></tr>
          <tr><td>出張費</td><td class="n">1式</td><td class="n">26,000</td></tr>
          <tr><td>消費税（10%）</td><td></td><td class="n">17,000</td></tr>
        </table>
        <div class="bank">振込先：○○銀行 本店 普通 1234567<br>お振込手数料は貴社にてご負担ください</div>
        <div style="font-size:15px;font-weight:900;color:#334155;">お支払期限 <span class="hl c4"><span class="bn">4</span>2026年10月31日</span></div>
      </div>
    </div>

    <div class="mid">
      <div class="ai">${AIW}</div>
      <div class="lb">AIが<br>読み取る</div>
      ${ARR}
      <img src="${A}chara/chara_guts.png" alt="" style="height:114px;margin-top:14px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));">
    </div>

    <div class="right">
      <div class="res">
        <div class="rh">読み取り結果<span class="bd">入力ゼロ</span></div>
        <div class="fg">
          <div class="fx c1"><span class="k">① 取引先</span><span class="v">山田商事株式会社</span></div>
          <div class="fx c2"><span class="k">② 番号</span><span class="v">INV-2026-0918</span></div>
          <div class="fx c3"><span class="k">③ 請求日</span><span class="v">2026-09-18</span></div>
          <div class="fx c4"><span class="k">④ 期限</span><span class="v">2026-10-31</span></div>
          <div class="fx c5 w"><span class="k">⑤ 合計</span><span class="v">187000（数値で届く）</span><span class="cf">信頼度 0.97</span></div>
        </div>
      </div>
      <div class="led">
        <div class="lh"><img src="${A}icons/pa_sharepoint.png" alt="">請求書台帳<span class="cnt">1行 自動で追加</span></div>
        <div class="lt">
          <div class="lr h"><span>取引先</span><span>請求番号</span><span>請求日</span><span>支払期限</span><span class="n">金額</span></div>
          <div class="lr"><span>佐藤電機株式会社</span><span>S-24117</span><span>09/10</span><span>10/31</span><span class="n">52,800</span></div>
          <div class="lr"><span>鈴木運輸株式会社</span><span>2609-031</span><span>09/15</span><span>10/15</span><span class="n">96,250</span></div>
          <div class="lr new"><span class="tag">⚡ いま追加</span><span>山田商事株式会社</span><span>INV-2026-0918</span><span>09/18</span><span>10/31</span><span class="n">187,000</span></div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">手で打つ項目</span><span class="mv">5つ</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">0</span></div>
        <div class="uses"><span class="ul">使いどころ</span><span class="u">経理の支払管理</span><span class="u">購買</span><span class="u">顧問先の請求</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>転記の手間と打ち間違いがなくなります。<b>作り方は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「請求書処理の事前構築済み AI モデル」「Power Automate で請求書処理の構築済みモデルを使用する」／社名・住所は架空</div>
`;
</script>
</body>
</html>
