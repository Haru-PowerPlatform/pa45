<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.51-1 AIが作ったフローは“味見”してから動かす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --orange:#EA580C; --amber:#D97706; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:29px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:144px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .tatoe{margin:10px 16px 0;background:linear-gradient(180deg,#FFFBEB,#FEF3C7);border:2px solid #FAD77A;border-radius:12px;display:flex;align-items:center;gap:12px;padding:10px 16px;flex:0 0 auto;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .tatoe .ti{flex:0 0 auto;width:30px;height:30px;color:var(--amber);}
  .tatoe .tt{font-weight:800;font-size:17.5px;color:#7A4A12;line-height:1.38;}
  .tatoe .tt b{color:var(--orange);}

  .checks{flex:1 1 auto;margin:12px 16px 0;display:flex;gap:12px;min-height:0;}
  .ck{flex:1;background:#F8F9FA;border-radius:14px;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.75);display:flex;flex-direction:column;justify-content:space-evenly;padding:13px 15px;min-height:0;position:relative;border:2px solid var(--blue);}
  .ck.k2{border-color:var(--orange);} .ck.k3{border-color:var(--green);}
  .ckn{position:absolute;top:-12px;left:14px;display:flex;align-items:center;gap:7px;color:#fff;font-weight:900;font-size:15px;border-radius:999px;padding:5px 14px;box-shadow:0 2px 5px rgba(0,0,0,.25);}
  .ck .ckn{background:linear-gradient(180deg,#3B82F6,#2563EB);} .ck.k2 .ckn{background:linear-gradient(180deg,#FB923C,#EA580C);} .ck.k3 .ckn{background:linear-gradient(180deg,#22C55E,#16A34A);}
  .ckh{display:flex;align-items:center;gap:10px;margin:8px 0 8px;}
  .ckh img{width:38px;height:38px;object-fit:contain;}
  .ckh .t{font-weight:900;font-size:19px;color:var(--ink);line-height:1.22;}
  .ckh .t b{color:var(--blue-dark);}
  .ck.k2 .ckh .t b{color:var(--orange);} .ck.k3 .ckh .t b{color:var(--green-dark);}
  .ckb{font-size:16px;font-weight:700;color:#40506A;line-height:1.5;}
  .ckb b{color:var(--ink);}
  .mock{background:#fff;border:1.5px solid #D8DEE8;border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-family:'Segoe UI','Noto Sans JP',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.07);}
  .mock .mt{font-size:12px;font-weight:900;color:#8A93A3;display:flex;align-items:center;gap:6px;}
  .mock .mt::before{content:"";width:4px;height:13px;border-radius:2px;background:#B4BECD;}
  .mfld{display:flex;flex-direction:column;gap:2px;}
  .mfld .l{font-size:13px;color:#605E5C;font-weight:800;}
  .mfld .l .req{color:#D13438;}
  .mfld .v{border:1px solid #D1D1D1;border-radius:6px;padding:6px 10px;font-size:14px;color:#242424;background:#fff;display:flex;align-items:center;font-weight:700;}
  .mfld .v .cr{margin-left:auto;color:#605E5C;font-weight:900;font-size:10px;}
  .mfld .v.ph{color:#A19F9D;font-weight:600;}
  .mfld .v.err{border:1.5px solid #D13438;background:#FDF3F4;}
  .mfld .al{font-size:12px;font-weight:800;color:#D13438;}
  .mdyn{display:inline-flex;align-items:center;gap:6px;background:#EAF1FE;border:1.5px solid #BBD0EE;border-radius:6px;padding:5px 10px;font-size:13.5px;font-weight:800;color:#1E40AF;align-self:flex-start;}
  .ckq{background:#fff;border:1.5px solid #D8DEE8;border-radius:10px;padding:8px 11px;font-size:14.5px;font-weight:800;color:#334155;line-height:1.4;box-shadow:0 2px 5px rgba(0,0,0,.06);}
  .ckq .lb{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:#64748B;border-radius:5px;padding:1px 8px;margin-bottom:4px;}
  .ckq b{color:var(--blue-dark);}
  .ck.k2 .ckq b{color:var(--orange);} .ck.k3 .ckq b{color:var(--green-dark);}

  .checker{flex:0 0 auto;margin:12px 16px 12px;background:linear-gradient(180deg,#565C66,#4A4F58);border-radius:13px;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 9px rgba(0,0,0,.18);position:relative;}
  .checker .hl2{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:15.5px;border-radius:9px;padding:8px 14px;box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .checker .hl2 svg{width:18px;height:18px;}
  .checker .cx{flex:1;color:#fff;font-weight:800;font-size:15.5px;line-height:1.42;padding-right:108px;}
  .checker .cx b{color:#FCD34D;}
  .checker .cx code{font-family:'Noto Sans JP',sans-serif;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 8px;color:#FCA5A5;font-weight:800;}
  .checker-chara{position:absolute;right:14px;bottom:-2px;height:102px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 pot:'<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-6z"/><path d="M2 10h20M8 6c0-1.5 1-2 1-3M13 6c0-1.5 1-2 1-3"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.51-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">AIと作ったフローは<span class="hl">“味見”してから動かす！検品3点</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="tatoe">
    <span class="ti">${svg('pot')}</span>
    <span class="tt">たとえるなら…AIは<b>料理を作ってくれる相棒</b>。でも<b>味見してお客さんに出すのは自分</b>。見るのは次の3点だけでいい。</span>
  </div>

  <div class="checks">
    <div class="ck">
      <div class="ckn">検品①</div>
      <div class="ckh"><img src="${A}icons/pa_outlook.png" alt=""><span class="t">トリガーの<b>設定</b>は入っているか</span></div>
      <div class="ckb">レシピの肝だった<b>詳細設定</b>が入っているか。<br>ここが抜けると、動くのに中身が取れない。</div>
      <div class="mock">
        <div class="mt">詳細パラメーター（2/9 を表示しています）</div>
        <div class="mfld"><span class="l">添付ファイルを含める</span><span class="v">はい<span class="cr">▾</span></span></div>
        <div class="mfld"><span class="l">添付ファイル付きのみ</span><span class="v">はい<span class="cr">▾</span></span></div>
      </div>
      <div class="ckq"><span class="lb">見る場所</span>トリガーを開く→<b>詳細パラメーター</b>の欄</div>
    </div>

    <div class="ck k2">
      <div class="ckn">検品②</div>
      <div class="ckh"><img src="${A}icons/pa_onedrive.png" alt=""><span class="t"><b>保存先・宛先</b>が空欄でないか</span></div>
      <div class="ckb">AIは<b>あなたのフォルダー構成や宛先を知らない</b>。<br>「どこに保存」「誰に送る」は人が決める欄。</div>
      <div class="mock">
        <div class="mt">ファイルの作成（OneDrive for Business）</div>
        <div class="mfld"><span class="l">フォルダーのパス <span class="req">*</span></span><span class="v ph err">フォルダーの一意のパス。</span><span class="al">'フォルダーのパス' は必須です。</span></div>
      </div>
      <div class="ckq"><span class="lb">見る場所</span><b>フォルダーのパス</b>／メール送信の<b>宛先</b></div>
    </div>

    <div class="ck k3">
      <div class="ckn">検品③</div>
      <div class="ckh"><img src="${A}icons/pa_dataoperation.png" alt=""><span class="t"><b>⚡動的コンテンツ</b>は正しい欄に</span></div>
      <div class="ckb">名前の欄に<b>「名前」</b>、中身の欄に<b>「コンテンツ」</b>。<br>固定の文字のままだと、全部同じ名前で上書き。</div>
      <div class="mock">
        <div class="mt">正しい配線の例</div>
        <div class="mfld"><span class="l">ファイル名</span><span class="mdyn">⚡ 名前</span></div>
        <div class="mfld"><span class="l">ファイル コンテンツ</span><span class="mdyn">⚡ コンテンツのバイト数</span></div>
      </div>
      <div class="ckq"><span class="lb">見る場所</span>各アクションの入力欄の<b>青いトークン⚡</b></div>
    </div>
  </div>

  <div class="checker">
    <div class="hl2">${svg('warn')}心強い味方</div>
    <div class="cx">実は<b>保存ボタンが最初の検品係</b>。必須が空欄だと<code>'フォルダーのパス' は必須です。</code>のように<b>フロー チェッカー</b>が赤字で教えてくれる。エラーが出たら直せばいいだけ→直し方は<b>2枚目</b>！</div>
    <img class="checker-chara" src="${A}chara/chara_confident.png" alt="">
  </div>
  <div class="src">出典：Power Automate 実機（PA45 Demo）</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
