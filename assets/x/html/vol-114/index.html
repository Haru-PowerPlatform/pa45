<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.114-1 関数は覚えない。やりたいことから引く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:11px;}
  .left{flex:0 0 330px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .right{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}

  .badbox{flex:0 0 auto;background:var(--red-bg);border:2.5px solid var(--red-line);border-radius:13px;padding:8px 10px 9px;
    display:flex;flex-direction:column;gap:6px;}
  .badbox .ph2{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:900;color:var(--red-dark);line-height:1.16;}
  .badbox .ph2 .mk{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#EF6A6A,#DC2626);
    color:#fff;display:flex;align-items:center;justify-content:center;}
  .badbox .ph2 .mk svg{width:19px;height:19px;}
  .flist{background:#fff;border:2px solid var(--red-line);border-radius:9px;padding:6px 8px;display:flex;
    flex-direction:column;gap:3px;position:relative;overflow:hidden;}
  .flist .fr{display:flex;align-items:center;gap:7px;font-family:'Roboto Mono',monospace;font-size:14.5px;font-weight:700;
    color:#7F1D1D;}
  .flist .fr span{background:#FFECEC;border-radius:4px;padding:1px 6px;}
  .flist .fade{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff);}
  .badbox .cap2{font-size:15.5px;font-weight:900;color:var(--red-dark);background:#FBD9D9;border-radius:9px;padding:6px 10px;
    line-height:1.3;}

  .sc{flex:1;min-height:0;border-radius:12px;overflow:hidden;position:relative;background:#EDF3FA;}
  .sc svg{position:absolute;inset:0;width:100%;height:100%;}
  .sc .chara{position:absolute;right:2px;bottom:0;height:106px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .gh{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;color:var(--green-dark);}
  .gh .mk{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#34D399,#16A34A);
    color:#fff;display:flex;align-items:center;justify-content:center;}
  .gh .mk svg{width:22px;height:22px;}
  .cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .rc{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:5px;background:#fff;
    border:2.5px solid var(--green-line);border-left:6px solid #16A34A;border-radius:11px;padding:8px 12px;
    box-shadow:0 3px 8px rgba(20,40,90,.11);}
  .rc .want{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;color:var(--navy);line-height:1.2;}
  .rc .want .q{flex:0 0 auto;background:#16A34A;color:#fff;border-radius:6px;padding:1px 8px;font-size:14px;}
  .rc .ar2{font-size:15px;font-weight:900;color:#94A3B8;}
  .rc .code2{font-family:'Roboto Mono',monospace;font-size:16.5px;font-weight:700;color:var(--green-dark);
    background:#EAF9F1;border:1.6px solid #BFE7D3;border-radius:7px;padding:5px 9px;line-height:1.26;word-break:break-all;}
  .rc .ex{display:flex;align-items:center;gap:7px;}
  .rc .ei,.rc .eo{font-family:'Roboto Mono',monospace;font-size:14.5px;font-weight:700;border-radius:6px;padding:3px 8px;
    line-height:1.22;}
  .rc .ei{background:#EEF2F7;color:#475569;}
  .rc .eo{background:#FFF7ED;color:#9A3412;border:1.5px solid #FDBA74;}
  .rc .ea{font-size:15px;font-weight:900;color:#94A3B8;}
  .rc .when{font-size:14px;font-weight:900;color:#64748B;line-height:1.26;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', ck:'<path d="M4 12.5l5 5L20 6.5"/>'};

/* 情景：関数名の海から引くのではなく、やりたいことから引く */
const sc=`<svg viewBox="0 0 330 193" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="g1" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="330" height="193" fill="#EDF3FA"/>
  <text x="14" y="24" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#1E40AF">引き方を裏返すだけ</text>
  <g filter="url(#g1)"><rect x="14" y="32" width="150" height="40" rx="9" fill="#fff" stroke="#2563EB" stroke-width="2.4"/>
    <text x="89" y="57" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#1E40AF" text-anchor="middle">やりたいこと</text></g>
  <path d="M89 76 v14" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M83 84 l6 8 l6 -8" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#g1)"><rect x="14" y="96" width="150" height="40" rx="9" fill="#EAF9F1" stroke="#16A34A" stroke-width="2.4"/>
    <text x="89" y="121" font-family="Roboto Mono" font-size="15" font-weight="700" fill="#0B5136" text-anchor="middle">書き方</text></g>
  <g filter="url(#g1)"><rect x="14" y="146" width="200" height="40" rx="9" fill="#fff" stroke="#B9C7DC" stroke-width="2"/>
    <text x="26" y="163" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#475569">入力欄の</text>
    <rect x="86" y="152" width="46" height="18" rx="5" fill="#2563EB"/>
    <text x="109" y="165" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">式</text>
    <text x="140" y="163" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#475569">タブで</text>
    <text x="26" y="180" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#475569">打つと候補が出ます</text></g>
</svg>`;

const rc=(want,code,inp,out,when)=>`<div class="rc"><span class="want"><span class="q">やりたい</span>${want}</span>
  <span class="code2">${code}</span>
  <span class="ex"><span class="ei">${inp}</span><span class="ea">→</span><span class="eo">${out}</span></span>
  <span class="when">${when}</span></div>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.114-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">関数は覚えない。<span class="hl">やりたいことから引く</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">名前から覚えようとすると続きません。<b>やりたいこと → 書き方</b>の順に引ければ足ります</div>
  </div>

  <div class="stage">
    <div class="left">
      <div class="badbox">
        <div class="ph2"><span class="mk">${svgw(P.x,3.2)}</span>名前から覚える</div>
        <div class="flist">
          <div class="fr"><span>addDays</span><span>addHours</span></div>
          <div class="fr"><span>coalesce</span><span>concat</span></div>
          <div class="fr"><span>dayOfWeek</span><span>empty</span></div>
          <div class="fr"><span>equals</span><span>formatDateTime</span></div>
          <div class="fr"><span>join</span><span>replace</span></div>
          <div class="fr"><span>split</span><span>substring</span></div>
          <div class="fade"></div>
        </div>
        <div class="cap2">数が多くて、どれから手を付けるか決まらない</div>
      </div>
      <div class="sc">${sc}<img class="chara" src="${A}chara/chara_think.png" alt=""></div>
    </div>

    <div class="right">
      <div class="gh"><span class="mk">${svgw(P.ck,3.4)}</span>やりたいことから引く</div>
      <div class="cards">
        ${rc('空欄なら代わりを入れる',"coalesce(担当者,'未設定')",'(空)','未設定','担当が抜けた行で表が崩れるのを防ぐ')}
        ${rc('日付を読める形にする',"formatDateTime(日付,'yyyy/MM/dd')",'2026-10-08T05:00:00Z','2026/10/08','メール本文や件名に日付を入れるとき')}
        ${rc('1行を1件ずつに分ける',"split(宛先,';')",'a@ex.com;b@ex.com','2件の配列','1セルの複数宛先を1人ずつ処理するとき')}
        ${rc('3日後を出す','addDays(日付,3)','10/08','10/11','期限やリマインドの日付を作るとき')}
      </div>
      <div class="uses"><span class="ul">この先</span>
        <span class="u">2枚目＝そのまま貼れる10個</span><span class="u">3枚目＝つまずく3つ</span></div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>10個だけ手元に置いておけば足ります。<b>早見表は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「ワークフロー式関数」</div>
`;
</script>
</body>
</html>
