<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.85-1 全員の空き時間から会議候補が出る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --ol:#0F6CBD;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.34;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;align-items:stretch;gap:13px;min-height:0;}

  /* 左：全員の予定グリッド */
  .grid-wrap{flex:1.32;display:flex;flex-direction:column;min-height:0;}
  .gw-cap{flex:0 0 auto;font-weight:900;font-size:16px;color:var(--gray);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .gw-cap .lg{margin-left:auto;display:flex;gap:12px;font-size:12.5px;font-weight:900;}
  .gw-cap .busy{color:#B91C1C;} .gw-cap .free{color:#15803D;}
  .gw-cap .sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px;}
  .grid{flex:1;display:grid;grid-template-columns:96px repeat(6,1fr);grid-auto-rows:1fr;gap:5px;min-height:0;}
  .gc{display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:900;font-size:14px;min-height:0;}
  .gc.hd{background:#EEF2F7;color:#475569;font-size:14.5px;}
  .gc.name{background:#F1F5FB;color:#243B58;justify-content:flex-start;padding-left:11px;font-size:15.5px;gap:7px;}
  .gc.name .av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .gc.busy{background:#FEE2E2;color:#B91C1C;border:1px solid #F5B5B5;font-size:12.5px;}
  .gc.free{background:#F0FDF4;color:#86C7A2;border:1px dashed #B7E4C8;}
  .gc.hit{background:#DCFCE7;color:#15803D;border:2px solid #16A34A;box-shadow:0 0 0 2px rgba(22,163,74,.15);}
  .col-hi{grid-row:1 / span 5;border-radius:10px;}
  .hitcol-label{background:#16A34A;color:#fff;font-weight:900;font-size:13px;border-radius:7px;display:flex;align-items:center;justify-content:center;}

  /* 右：候補提示 */
  .cand{flex:.9;display:flex;flex-direction:column;min-height:0;gap:9px;}
  .cand-h{flex:0 0 auto;font-weight:900;font-size:16px;color:var(--weak);}
  .clist{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .cc{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid #E2E8F1;border-radius:13px;padding:11px 15px;box-shadow:0 3px 8px rgba(0,0,0,.08);min-height:0;}
  .cc.best{border-color:#16A34A;background:#F1FBF5;}
  .cc .mark{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;}
  .cc.best .mark{background:#DCFCE7;color:#15803D;} .cc .mark.tri{background:#FEF3C7;color:#B45309;font-size:22px;}
  .cc .ci{min-width:0;}
  .cc .ct{font-size:20px;font-weight:900;color:#243B58;line-height:1.15;}
  .cc .cs{font-size:13.5px;font-weight:800;color:var(--weak);margin-top:3px;}
  .cc .cs b{color:#15803D;}
  .cc.warnc .cs b{color:#B45309;}

  .next{flex:0 0 auto;margin:9px 16px 14px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
// 予定：B=busy(予定名), F=free  ／ 列: 9 10 11 13 14 15
const rows=[
  ['田',"#3B82F6",['朝会','','商談','','A社MTG','']],
  ['佐',"#10B981",['','','資料作成','','','外出']],
  ['鈴',"#F59E0B",['開発','','','来客','','']],
];
const room=['','','予約済','','会議室B',''];

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.85-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">予定表を1つずつ開くのは卒業｜<span class="hl">全員の“空き”から会議候補が出る</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">参加者の予定を<b>1人ずつ確認しない</b>。全員の予定を重ねて、<b>みんなが空いている時間</b>と<b>空き会議室</b>を自動で提案します。</div>
  </div>

  <div class="stage">
    <div class="grid-wrap">
      <div class="gw-cap">👥 参加者の予定を重ねる<span class="lg"><span class="busy"><span class="sw" style="background:#FEE2E2;border:1px solid #F5B5B5"></span>予定あり</span><span class="free"><span class="sw" style="background:#F0FDF4;border:1px dashed #B7E4C8"></span>空き</span></span></div>
      <div class="grid">
        <div class="gc hd"></div>
        <div class="gc hd">9:00</div><div class="gc hd" style="background:#DCFCE7;color:#15803D;border:2px solid #16A34A">10:00</div><div class="gc hd">11:00</div><div class="gc hd">13:00</div><div class="gc hd">14:00</div><div class="gc hd">15:00</div>
        ${rows.map(([ini,col,cells])=>`
          <div class="gc name"><span class="av" style="background:${col}">${ini}</span>${ini}さん</div>
          ${cells.map((c,i)=> c? `<div class="gc busy">${c}</div>` : (i===1?`<div class="gc hit">空き</div>`:`<div class="gc free">空き</div>`)).join('')}
        `).join('')}
        <div class="gc name"><span class="av" style="background:#64748B">室</span>会議室A</div>
        ${room.map((c,i)=> c? `<div class="gc busy">${c}</div>` : (i===1?`<div class="gc hit">空き</div>`:`<div class="gc free">空き</div>`)).join('')}
      </div>
    </div>

    <div class="cand">
      <div class="cand-h">⚡ 会議の時間を検索 → 候補</div>
      <div class="clist">
        <div class="cc best"><span class="mark">◎</span><div class="ci"><div class="ct">火 10:00〜10:30</div><div class="cs"><b>全員＋会議室A が空き</b></div></div></div>
        <div class="cc best"><span class="mark">◎</span><div class="ci"><div class="ct">水 13:30〜14:00</div><div class="cs"><b>全員が空き</b>（別室あり）</div></div></div>
        <div class="cc warnc"><span class="mark tri">△</span><div class="ci"><div class="ct">木 11:00〜11:30</div><div class="cs"><b>会議室が埋まりオンラインなら可</b></div></div></div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>候補を出して<b>その場で予約</b>するまでの<b>作り方</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（Office 365 Outlook「会議の時間を検索 (V2)」「会議室を取得する (V2)」「イベントの作成 (V4)」）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
