<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.23-1 2回目からは説明いらず</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  /* F型：紙芝居4コマ */
  .body{gap:10px;}
  .koma{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;padding:9px 11px 10px;background:#fff;
    border:2px solid var(--cs-line);box-shadow:0 6px 14px rgba(0,0,0,.12);position:relative;}
  .koma.k4{background:var(--green-bg);border-color:var(--green-line);}
  .kh{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .kn{flex:0 0 32px;height:32px;border-radius:50%;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7C3AED,#C026D3);}
  .k4 .kn{background:linear-gradient(135deg,#22C55E,#15803D);}
  .kt{font-size:20px;font-weight:900;color:var(--navy);line-height:1.2;}
  .kt small{display:block;font-size:13.5px;font-weight:700;color:var(--weak);}
  .scene{flex:1;min-height:0;}
  .scene svg{width:100%;height:100%;display:block;}
  .kcap{flex:0 0 auto;font-size:15px;font-weight:700;color:#374151;line-height:1.42;border-top:1.5px dashed #C9B4F4;padding-top:6px;}
  .k4 .kcap{border-color:var(--green-line);}
  .kcap b{color:var(--cs-dark);}
  .arrow{position:absolute;top:46%;right:-18px;z-index:20;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--cs);
    color:var(--cs);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const T=(x,y,s,t,c='#1B2A44',w=800,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${s}" font-weight="${w}" fill="${c}" font-family="Noto Sans JP">${t}</text>`;
const D=`<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-opacity=".2"/></filter></defs>`;
const ub=(y,lines,w=230)=>`<g transform="translate(${290-w-6},${y})" filter="url(#sh)"><rect width="${w}" height="${16+lines.length*22}" rx="10" fill="#E8EBFA"/>
  ${lines.map((l,i)=>T(12,26+i*22,14.5,l,'#1B2A44',700,'start')).join('')}</g>`;
const ab=(y,lines,w=250)=>`<g transform="translate(6,${y})" filter="url(#sh)"><rect width="${w}" height="${16+lines.length*22}" rx="10" fill="#fff" stroke="#E1DFDD"/>
  <image href="${A}icons/cs_logo.png" x="-2" y="-12" width="22" height="22"/>${lines.map((l,i)=>T(12,26+i*22,14,l,'#1B2A44',700,'start')).join('')}</g>`;
const day=(t,c)=>`<rect x="6" y="4" width="92" height="26" rx="13" fill="${c}"/>${T(52,22,13.5,t,'#fff',900)}`;
/* ① 最初に一度だけ言う */
const S1=`<svg viewBox="0 0 296 300" preserveAspectRatio="xMidYMid meet">${D}${day('月曜','#7C3AED')}
  ${ub(44,['関西エリアの担当です。','数字はいつも表で見せて'])}
  ${ab(124,['承知しました。関西の担当で、','数字は表でお見せします。'])}
  ${ub(196,['あと、金額は税抜で'],190)}
  ${ab(250,['覚えておきます。'],170)}
</svg>`;
/* ② AIがメモする */
const S2=`<svg viewBox="0 0 296 300" preserveAspectRatio="xMidYMid meet">${D}
  <g transform="translate(110,6)"><image href="${A}icons/cs_logo.png" width="72" height="72"/></g>
  <path d="M146 84 v18" stroke="#7C3AED" stroke-width="3" stroke-dasharray="4 3"/>
  <g transform="translate(26,106) rotate(-2)" filter="url(#sh)"><rect width="244" height="176" rx="6" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/>
  <rect x="96" y="-8" width="52" height="18" rx="3" fill="#FDE68A" opacity=".9"/>
  ${T(16,34,15,'高橋さんについて','#713F12',900,'start')}
  ${[['役割','関西エリアの担当'],['好み','数字は表で見せる'],['訂正','金額は税抜で']].map(([k,v],i)=>`
   <rect x="14" y="${50+i*40}" width="52" height="26" rx="6" fill="#fff" stroke="#EAB308"/>${T(40,68+i*40,13,k,'#92400E',900)}
   ${T(76,68+i*40,15,v,'#1B2A44',800,'start')}`).join('')}</g>
</svg>`;
/* ③ 翌週は前置きなし */
const S3=`<svg viewBox="0 0 296 300" preserveAspectRatio="xMidYMid meet">${D}${day('翌週の火曜','#D97706')}
  ${ub(44,['今月の数字は？'],150)}
  <g transform="translate(6,100)" filter="url(#sh)"><rect width="284" height="190" rx="10" fill="#fff" stroke="#E1DFDD"/>
  <image href="${A}icons/cs_logo.png" x="-2" y="-12" width="22" height="22"/>${T(12,28,14,'関西エリアの今月です（税抜）','#1B2A44',800,'start')}
  <rect x="12" y="42" width="260" height="28" fill="#F5F3FF"/>${T(24,61,13.5,'支店','#5B21B6',900,'start')}${T(262,61,13.5,'売上','#5B21B6',900,'end')}
  ${[['大阪','1,240万円'],['京都','680万円'],['神戸','910万円']].map(([a,b],i)=>`<rect x="12" y="${70+i*30}" width="260" height="30" fill="${i%2?'#FAFAFA':'#fff'}" stroke="#EEE"/>
   ${T(24,90+i*30,14,a,'#1B2A44',700,'start')}${T(262,90+i*30,14,b,'#1B2A44',800,'end')}`).join('')}
  ${T(142,178,12.5,'「関西」も「表で」も言っていない','#B45309',900)}</g>
</svg>`;
/* ④ 自分で見て消せる */
const S4=`<svg viewBox="0 0 296 300" preserveAspectRatio="xMidYMid meet">${D}
  ${ub(6,['私の記憶を見せて'],170)}
  <g transform="translate(6,62)" filter="url(#sh)"><rect width="284" height="150" rx="10" fill="#fff" stroke="#E1DFDD"/>
  ${[['関西エリアの担当',false],['数字は表で見せる',false],['金額は税抜で',true]].map(([t,del],i)=>`
   <g transform="translate(12,${14+i*44})"><rect width="260" height="36" rx="8" fill="${del?'#FEF2F2':'#F9FAFB'}" stroke="${del?'#FCA5A5':'#E5E7EB'}"/>
   ${T(12,24,14.5,t,del?'#9CA3AF':'#1B2A44',800,'start')}${del?`<path d="M10 18 H150" stroke="#9CA3AF" stroke-width="1.6"/>`:''}
   <g transform="translate(226,7)"><rect x="3" y="5" width="16" height="17" rx="2" fill="none" stroke="${del?'#DC2626':'#9CA3AF'}" stroke-width="2"/><path d="M0 5 h22 M8 1 h6" stroke="${del?'#DC2626':'#9CA3AF'}" stroke-width="2"/></g></g>`).join('')}</g>
  <g transform="translate(6,226)"><rect width="284" height="64" rx="10" fill="#fff" stroke="#16A34A" stroke-width="2"/>
  <circle cx="34" cy="32" r="18" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/><path d="M34 20 v12 l8 6" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round"/>
  ${T(62,28,14.5,'28日使われないと消える','#065F46',900,'start')}${T(62,49,12.5,'見えるのは本人だけ','#374151',800,'start')}</g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.23</div>
    <div class="part-pill">前編 <b>(1/4)</b></div>
    <div class="title-text">2回目からは前置きなし。<br><span class="q">AIが"あなたの前提"</span>を覚える</div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/teams.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">エージェントの<b>Memory</b> をオンにすると、<b>人ごとに</b>役割・好み・訂正を覚えて次の会話に持ち越す。<br>
      「関西担当です」「表で見せて」を<em>毎回言わなくてよくなる</em>。</div>
  </div>

  <div class="body">
    <div class="koma"><div class="kh"><span class="kn">1</span><span class="kt">一度だけ言う<small>担当と、見せ方の好み</small></span></div>
      <div class="scene">${S1}</div><div class="kcap">いつもの前置きと直してほしい点を<br><b>最初の1回だけ</b>伝える。</div><div class="arrow">▶</div></div>
    <div class="koma"><div class="kh"><span class="kn">2</span><span class="kt">AIがメモする<small>短いメモで残す</small></span></div>
      <div class="scene">${S2}</div><div class="kcap">会話を丸ごとではなく<br><b>要点だけ</b>を覚える。</div><div class="arrow">▶</div></div>
    <div class="koma"><div class="kh"><span class="kn">3</span><span class="kt">次の会話で効く<small>新しいチャットでも</small></span></div>
      <div class="scene">${S3}</div><div class="kcap">聞くだけで、<br><b>関西の数字が表で</b>出てくる。</div><div class="arrow">▶</div></div>
    <div class="koma k4"><div class="kh"><span class="kn">4</span><span class="kt">見て、消せる<small>覚えた中身は本人のもの</small></span></div>
      <div class="scene">${S4}</div><div class="kcap">違っていたら<b>1件ずつ消せる</b>。<br>全部消すこともできる。</div></div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">覚えてくれること（一例）</div>
      <div class="grid">
        <div class="fc"><div class="ft">あなたのこと</div><div class="fd">役割・得意分野・<br>見せ方の好み</div></div>
        <div class="fc"><div class="ft">訂正</div><div class="fd">「税抜で」など<br>直した理由ごと</div></div>
        <div class="fc"><div class="ft">進めている仕事</div><div class="fd">目的・条件・<br>どこまで進んだか</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">覚えるのは<b>人ごと</b>。作った人にも<br>ほかの人にも中身は見えない。</div>
    </div>
    <div class="src">出典：Microsoft Learn（エージェントのメモリの概要／エージェントが記憶する内容）／画面・人名・数字は説明用の再現</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_confident_g.png" alt="">
`;
</script>
</body>
</html>
