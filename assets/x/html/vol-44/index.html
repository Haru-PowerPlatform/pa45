<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.44-1 スマホのボタン1発で現場を記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --spo:#0F6CBD; --spo-dark:#0A4F8A;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 22px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:24px;border-radius:999px;padding:6px 18px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.18;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:13px;bottom:-42px;height:140px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:8px 15px 0;background:var(--blue-bg);border:2px solid var(--blue);border-radius:11px;display:flex;align-items:center;gap:11px;padding:8px 15px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:700;font-size:15.5px;color:var(--blue-dark);line-height:1.34;padding-right:88px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 15px 0;display:flex;align-items:stretch;gap:0;min-height:0;}

  /* 左：スマホ */
  .pzone{flex:0 0 286px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .phone{width:212px;height:100%;max-height:404px;background:linear-gradient(160deg,#2B2F36,#15171B);border-radius:30px;padding:9px;box-shadow:0 12px 26px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.18);position:relative;}
  .phone::before{content:"";position:absolute;top:15px;left:50%;transform:translateX(-50%);width:64px;height:6px;border-radius:4px;background:#000;opacity:.55;z-index:3;}
  .scr{width:100%;height:100%;background:#EEF2F8;border-radius:23px;overflow:hidden;display:flex;flex-direction:column;}
  .pa-top{background:linear-gradient(135deg,#1D4ED8,#3B82F6);padding:20px 12px 11px;display:flex;align-items:center;gap:8px;}
  .pa-top img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;}
  .pa-top span{color:#fff;font-weight:900;font-size:13px;}
  .pa-tab{display:flex;gap:14px;padding:8px 13px 7px;background:#fff;border-bottom:1px solid #E7EBF1;}
  .pa-tab span{font-size:11px;font-weight:800;color:#9AA3B0;}
  .pa-tab span.on{color:#2563EB;border-bottom:2.5px solid #2563EB;padding-bottom:6px;margin-bottom:-9px;}
  .pa-body{flex:1;padding:13px 13px;display:flex;flex-direction:column;gap:10px;background:#EEF2F8;}
  .bcard{background:#fff;border-radius:13px;padding:13px 12px;box-shadow:0 3px 9px rgba(0,0,0,.10);display:flex;align-items:center;gap:10px;border:1px solid #E7EBF1;}
  .bcard .bi{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 2px 5px rgba(37,99,235,.4);}
  .bcard .bt{font-weight:900;font-size:13.5px;color:var(--ink);line-height:1.2;}
  .bcard .bt small{display:block;font-weight:700;font-size:9.5px;color:var(--weak);margin-top:2px;}
  .tapbtn{margin-top:2px;background:linear-gradient(180deg,#22C55E,#16A34A);color:#fff;border-radius:12px;padding:13px;text-align:center;font-weight:900;font-size:15px;box-shadow:0 5px 13px rgba(22,163,74,.45),inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;gap:8px;position:relative;}
  .tapbtn svg{width:19px;height:19px;}
  .taphand{position:absolute;right:-6px;bottom:-16px;width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
  .pcap{text-align:center;font-weight:900;font-size:14px;color:var(--blue-dark);margin-top:9px;}

  /* 中：矢印＋自動取得 */
  .mzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;position:relative;}
  .mzhd{font-weight:900;font-size:16px;color:var(--ink);text-align:center;margin-bottom:11px;line-height:1.3;}
  .mzhd b{color:var(--green-dark);}
  .chips{display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px;}
  .chip2{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#F1FCF5,#E2F6EA);border:1.5px solid #9FE3BB;border-radius:11px;padding:9px 13px;box-shadow:0 2px 6px rgba(0,0,0,.07);}
  .chip2 .ci{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#22C55E,#16A34A);color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 2px 4px rgba(22,163,74,.4);}
  .chip2 .cx{font-weight:800;font-size:14.5px;color:#0B5A36;line-height:1.25;}
  .chip2 .cx small{display:block;font-weight:700;font-size:11px;color:#3C7A57;margin-top:1px;}
  .autobadge{margin-top:11px;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:12.5px;border-radius:999px;padding:7px 15px;box-shadow:0 3px 7px rgba(234,88,12,.4);}
  .autobadge svg{width:15px;height:15px;}
  .mzmascot{position:absolute;right:-2px;bottom:-6px;height:104px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));z-index:30;}

  /* 右：記録先 */
  .rzone{flex:0 0 330px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .rzhd{font-weight:900;font-size:15px;color:var(--ink);text-align:center;margin-bottom:10px;}
  .spo{width:100%;background:#fff;border:1px solid #E1E6EF;border-radius:11px;box-shadow:0 6px 15px rgba(0,0,0,.13);overflow:hidden;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .spo-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(90deg,#0A4F8A,#1277CE);}
  .spo-h img{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:4px;padding:1px;}
  .spo-h span{font-weight:800;font-size:12.5px;color:#fff;}
  .spo-th,.spo-tr{display:flex;font-size:11.5px;}
  .spo-th{background:#F3F7FC;font-weight:800;color:#3A4A63;border-bottom:1px solid #E1E6EF;}
  .spo-tr{border-bottom:1px solid #F0F3F8;font-weight:700;color:#242424;}
  .spo-tr:last-child{border-bottom:none;}
  .spo-c{padding:8px 9px;}
  .k1{flex:0 0 86px;} .k2{flex:0 0 96px;} .k3{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spo-tr .k2{color:#0A66C2;font-weight:800;}
  .rnote{margin-top:10px;font-weight:800;font-size:12.5px;color:var(--weak);text-align:center;line-height:1.4;}
  .rnote b{color:var(--green-dark);}

  .next{flex:0 0 auto;margin:9px 15px 12px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2px solid var(--blue);border-radius:11px;padding:10px 16px;display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:22px;height:22px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:9.5px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 zap:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 pin:'<path d="M12 22s8-5.7 8-12a8 8 0 1 0-16 0c0 6.3 8 12 8 12z"/><circle cx="12" cy="10" r="3"/>',
 note:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
 hand:'<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 11V6.5a1.5 1.5 0 0 1 3 0V13c0 3.5-2 7-6 7s-5-2.5-6.5-4.5L4 12.5a1.5 1.5 0 0 1 2.5-1.7L9 13"/>',
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.44-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">PCの前にいなくてOK｜<span class="hl">スマホのボタン1発で“現場”を記録</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">自動化＝PCの前、という思い込みを外そう。スマホの<b>ボタンを押すだけ</b>で「時刻・場所・写真・ひとこと」を記録。いわば<b>自分専用の“記録リモコン”</b>。</div>
  </div>

  <div class="stage">
    <div class="pzone">
      <div class="phone">
        <div class="scr">
          <div class="pa-top"><img src="${A}icons/pa_logo.png" alt="">Power Automate</div>
          <div class="pa-tab"><span class="on">ボタン</span><span>アクティビティ</span></div>
          <div class="pa-body">
            <div class="bcard"><span class="bi">${svg('cam')}</span><span class="bt">現場を記録<small>インスタント フロー</small></span></div>
            <div class="tapbtn">${svg('zap')}このフローを実行
              <svg class="taphand" viewBox="0 0 24 24" fill="#FFD54A" stroke="#7A4A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICON.hand}</svg>
            </div>
          </div>
        </div>
      </div>
      <div class="pcap">押すだけ。1秒。</div>
    </div>

    <div class="mzone">
      <div class="mzhd">押した瞬間に<br><b>これ全部が自動でくっつく</b></div>
      <div class="chips">
        <div class="chip2"><span class="ci">${svg('clock')}</span><span class="cx">時刻<small>タイムスタンプ（自動）</small></span></div>
        <div class="chip2"><span class="ci">${svg('pin')}</span><span class="cx">場所<small>住所・緯度経度（自動）</small></span></div>
        <div class="chip2"><span class="ci">${svg('cam')}</span><span class="cx">写真<small>その場で撮影 or 選択</small></span></div>
        <div class="chip2"><span class="ci">${svg('note')}</span><span class="cx">ひとこと<small>テキストを入力</small></span></div>
      </div>
      <div class="autobadge">${svg('zap')}手入力なし・転記なし</div>
      <img class="mzmascot" src="${A}chara/chara_guts.png" alt="">
    </div>

    <div class="rzone">
      <div class="rzhd">→ そのまま1行に記録される</div>
      <div class="spo">
        <div class="spo-h"><img src="${A}icons/pa_sharepoint.png" alt="">現場記録ログ（SharePoint）</div>
        <div class="spo-th"><span class="spo-c k1">日時</span><span class="spo-c k2">場所</span><span class="spo-c k3">メモ／写真</span></div>
        <div class="spo-tr"><span class="spo-c k1">6/26 10:12</span><span class="spo-c k2">広島市</span><span class="spo-c k3">棚A 補充済 📷</span></div>
        <div class="spo-tr"><span class="spo-c k1">6/26 11:48</span><span class="spo-c k2">福山市</span><span class="spo-c k3">在庫薄め 📷</span></div>
        <div class="spo-tr"><span class="spo-c k1">6/26 14:03</span><span class="spo-c k2">東広島市</span><span class="spo-c k3">異常なし 📷</span></div>
      </div>
      <div class="rnote">あとで清書しなくていい。<b>その場で完結</b>。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>具体的な<b>作り方</b>は <b>2枚目</b>で、3ステップ＋つまずきまで解説！</div>
  <div class="src">出典：Microsoft Learn</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
