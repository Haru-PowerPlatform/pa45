<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.77-1 毎朝のリマインド、祝日はお休みする</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46; --green-bg:#ECFDF5;
    --red:#DC2626; --red-dark:#991B1B; --red-bg:#FEF2F2; --orange:#EA580C;
    --ol:#0F6CBD;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.34;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;align-items:stretch;gap:13px;min-height:0;}
  .panel{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:14px;padding:12px 13px;box-shadow:0 5px 13px rgba(0,0,0,.12);}
  .panel.bad{background:var(--red-bg);border:2.5px solid #F3A6A6;}
  .panel.good{background:var(--green-bg);border:2.5px solid #7EDCAD;}
  .phd{font-weight:900;font-size:25px;line-height:1.15;display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .panel.bad .phd{color:var(--red-dark);} .panel.good .phd{color:var(--green-dark);}
  .phd .tag{flex:0 0 auto;font-size:14px;color:#fff;border-radius:7px;padding:3px 9px;}
  .panel.bad .tag{background:var(--red);} .panel.good .tag{background:var(--green);}

  .cal{margin-top:10px;background:#fff;border:1px solid #E1E6EE;border-radius:11px;padding:9px 10px 10px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.07);}
  .caltop{font-size:14px;font-weight:900;color:var(--weak);margin-bottom:6px;}
  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .day{border:1px solid #E7ECF3;border-radius:8px;padding:6px 3px 7px;text-align:center;background:#F8FAFC;}
  .day .d{font-size:13px;font-weight:900;color:#334155;}
  .day .st{margin-top:5px;font-size:12.5px;font-weight:900;border-radius:6px;padding:3px 2px;line-height:1.15;}
  .fire{background:#FEE2E2;color:#B91C1C;}
  .send{background:#DCFCE7;color:#15803D;}
  .rest-g{background:#D1FAE5;color:#065F46;}
  .day.hol{border-color:#F1A9A9;}
  .day.hol .d{color:#B91C1C;}
  .day.hol.g .d{color:#B45309;}

  .remwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0;}
  .remcard{width:100%;background:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 3px 8px rgba(0,0,0,.09);}
  .panel.bad .remcard{border:1.5px solid #F0B4B4;}
  .panel.good .remcard{border:1.5px solid #A2E3C4;}
  .remcard .rt{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:900;color:#334155;padding-bottom:7px;border-bottom:1px dashed #E5E7EB;margin-bottom:8px;}
  .remcard .rt img{width:22px;height:22px;object-fit:contain;}
  .remcard .rt .tm{margin-left:auto;font-size:12.5px;color:var(--weak);font-weight:800;}
  .remcard .rb{font-size:17px;font-weight:900;line-height:1.35;display:flex;align-items:center;gap:8px;}
  .panel.bad .remcard .rb{color:#B91C1C;}
  .panel.good .remcard .rb{color:#15803D;}
  .remcard .rb.skip{color:#94A3B8;}
  .remcard .rb.skip .k{text-decoration:line-through;text-decoration-color:#CBD5E1;}
  .note{margin-top:auto;font-size:16.5px;font-weight:800;line-height:1.4;padding:9px 11px;border-radius:10px;}
  .panel.bad .note{background:#fff;border:1.5px solid #F3B4B4;color:var(--red-dark);}
  .panel.good .note{background:#fff;border:1.5px solid #9FE3C2;color:var(--green-dark);}
  .note b{color:var(--orange);}

  .engine{flex:0 0 268px;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#F8FAFF,#EEF3FB);border:2px solid #C2CEE0;border-radius:14px;padding:12px 12px 10px;box-shadow:0 5px 13px rgba(0,0,0,.12);}
  .eh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;color:var(--blue-dark);flex:0 0 auto;}
  .eh img{width:30px;height:30px;object-fit:contain;}
  .escene{flex:0 0 auto;margin:8px 0 4px;display:flex;justify-content:center;}
  .esteps{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;}
  .est{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid #D8E1EE;border-radius:10px;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .est .en{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .est .etx{font-size:15px;font-weight:800;color:#243B58;line-height:1.3;}
  .est .etx b{color:var(--blue-dark);}
  .est.y{border-color:#F3B4B4;background:#FFF5F5;} .est.y .en{background:var(--red);}
  .est.n{border-color:#9FE3C2;background:#F2FDF7;} .est.n .en{background:var(--green);}

  .next{flex:0 0 auto;margin:10px 16px 16px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:12px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// 祝日カレンダーをチェックする高品質SVG（今日=11をルーペで確認）
const svgCalCheck=`<svg viewBox="0 0 168 118" width="168" height="118">
  <defs><linearGradient id="ct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EF4444"/><stop offset="1" stop-color="#DC2626"/></linearGradient></defs>
  <rect x="20" y="14" width="112" height="96" rx="10" fill="#fff" stroke="#D6DEEA" stroke-width="2" filter="drop-shadow(0 4px 7px rgba(0,0,0,.14))"/>
  <rect x="20" y="14" width="112" height="26" rx="10" fill="url(#ct)"/><rect x="20" y="30" width="112" height="10" fill="#DC2626"/>
  <rect x="40" y="8" width="9" height="16" rx="4" fill="#9AA6B6"/><rect x="103" y="8" width="9" height="16" rx="4" fill="#9AA6B6"/>
  <text x="76" y="33" text-anchor="middle" fill="#fff" font-family="Noto Sans JP,Segoe UI" font-weight="900" font-size="13">日本の休日</text>
  <g font-family="Segoe UI,Arial" font-weight="800" font-size="11" fill="#64748B" text-anchor="middle">
    <text x="34" y="58">8</text><text x="58" y="58" fill="#B91C1C">11</text><text x="82" y="58">12</text><text x="106" y="58">13</text>
    <text x="34" y="82">14</text><text x="58" y="82">15</text><text x="82" y="82">18</text><text x="106" y="82">19</text>
  </g>
  <rect x="47" y="46" width="23" height="16" rx="4" fill="#FEE2E2" stroke="#F1A9A9"/>
  <text x="58" y="94" text-anchor="middle" font-size="8.5" font-weight="900" fill="#B91C1C" font-family="Noto Sans JP">山の日</text>
  <g><circle cx="112" cy="90" r="19" fill="rgba(255,255,255,.35)" stroke="#2563EB" stroke-width="4"/><line x1="126" y1="104" x2="140" y2="116" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><text x="112" y="95" text-anchor="middle" font-size="15" font-weight="900" fill="#B91C1C" font-family="Segoe UI">11</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.77-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">毎朝のリマインド、<span class="hl">祝日はちゃんとお休みする</span></div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">毎朝動くフローに、<b>「今日は祝日?」を自分で確かめさせる</b>だけ。日本の祝日カレンダーを見て、休みの日は動かないようにできます。</div>
  </div>

  <div class="stage">
    <div class="panel bad">
      <div class="phd"><span class="tag">Before</span>祝日にも飛んでしまう</div>
      <div class="cal">
        <div class="caltop">8月 第2週</div>
        <div class="week">
          <div class="day"><div class="d">8/8 金</div><div class="st fire">通知</div></div>
          <div class="day hol"><div class="d">8/11 月</div><div class="st fire">通知</div></div>
          <div class="day"><div class="d">8/12 火</div><div class="st fire">通知</div></div>
          <div class="day"><div class="d">8/13 水</div><div class="st fire">通知</div></div>
          <div class="day"><div class="d">8/14 木</div><div class="st fire">通知</div></div>
        </div>
      </div>
      <div class="remwrap"><div class="remcard">
        <div class="rt"><img src="${A}icons/pa_teams.png" alt="">毎朝リマインド Bot<span class="tm">8/11(月·祝) 9:00</span></div>
        <div class="rb">🔔 本日の日報を提出してください</div>
      </div></div>
      <div class="note">祝日（山の日）にもリマインドが飛ぶ。<br><b>「また休みなのに来た」</b>で、だんだん読まれなくなる。</div>
    </div>

    <div class="engine">
      <div class="eh"><img src="${A}icons/pa_schedule.png" alt="">毎朝チェックする</div>
      <div class="escene">${svgCalCheck}</div>
      <div class="esteps">
        <div class="est"><span class="en">1</span><span class="etx">今日の日付で<b>日本の祝日カレンダー</b>を見る</span></div>
        <div class="est y"><span class="en">祝</span><span class="etx">予定が<b>ある</b>＝祝日<br>→ そのまま<b>止まる</b></span></div>
        <div class="est n"><span class="en">平</span><span class="etx">予定が<b>ない</b>＝平日<br>→ いつもの通知が<b>動く</b></span></div>
      </div>
    </div>

    <div class="panel good">
      <div class="phd"><span class="tag">After</span>祝日はスキップ</div>
      <div class="cal">
        <div class="caltop">8月 第2週</div>
        <div class="week">
          <div class="day"><div class="d">8/8 金</div><div class="st send">送信</div></div>
          <div class="day hol g"><div class="d">8/11 月</div><div class="st rest-g">お休み</div></div>
          <div class="day"><div class="d">8/12 火</div><div class="st send">送信</div></div>
          <div class="day"><div class="d">8/13 水</div><div class="st send">送信</div></div>
          <div class="day"><div class="d">8/14 木</div><div class="st send">送信</div></div>
        </div>
      </div>
      <div class="remwrap"><div class="remcard">
        <div class="rt"><img src="${A}icons/pa_teams.png" alt="">毎朝リマインド Bot<span class="tm">8/11(月·祝)</span></div>
        <div class="rb skip">🔕 <span class="k">本日の日報を提出</span> → 送信スキップ</div>
      </div></div>
      <div class="note">山の日は<b>自動でスキップ</b>。平日だけ届くから、<br>リマインドがちゃんと読まれるようになる。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>使うのは<b>標準アクション2個</b>だけ。祝日を判定する<b>作り方</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（Office 365 Outlook「イベントの予定表ビューを取得する (V3)」）／画面は再現・日付は例</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
