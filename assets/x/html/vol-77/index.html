<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.77-1 動くたびに履歴が汚れるのを止める（トリガー条件）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:26.5px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.36;padding-right:100px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;align-items:stretch;min-height:0;}

  .pz{flex:1;display:flex;flex-direction:column;min-height:0;}
  .pzhd{font-weight:900;font-size:25px;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
  .pzhd .b{flex:0 0 auto;width:33px;height:33px;border-radius:50%;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;}
  .pzhd.ng .b{background:var(--red);} .pzhd.ok .b{background:var(--green);}
  .panel{flex:1;border-radius:14px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:9px;min-height:0;position:relative;overflow:hidden;}
  .panel.ng{background:linear-gradient(180deg,#FFF5F5,#FEECEC);border:2.5px solid #F4B4B4;}
  .panel.ok{background:linear-gradient(180deg,#F1FCF6,#E4F8EE);border:2.5px solid #9BE0BE;}

  /* 実行履歴モック */
  .run{flex:1;background:#fff;border:1px solid #E1E1ED;border-radius:11px;box-shadow:0 5px 13px rgba(0,0,0,.14);overflow:hidden;font-family:'Segoe UI','Noto Sans JP',sans-serif;display:flex;flex-direction:column;min-height:0;}
  .run-h{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#F3F6FB;border-bottom:1px solid #E3E9F1;}
  .run-h img{width:22px;height:22px;object-fit:contain;}
  .run-h span{font-weight:800;font-size:15px;color:#243B58;}
  .run-h .cnt{margin-left:auto;font-weight:900;font-size:15px;border-radius:999px;padding:2px 11px;}
  .run-h .cnt.bad{background:#FEE2E2;color:var(--red-dark);}
  .run-h .cnt.good{background:#DCFCE7;color:#166534;}
  .rrow{flex:1;display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid #F1F4F8;min-height:0;font-size:16px;font-weight:700;color:#242424;}
  .rrow:last-child{border-bottom:none;}
  .rrow .mk{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;}
  .rrow.s .mk{background:var(--green);}
  .rrow.waste{color:var(--weak);}
  .rrow.waste .mk{background:#B6BCC6;}
  .rrow .tag{margin-left:auto;font-size:12.5px;font-weight:800;border-radius:6px;padding:2px 9px;}
  .rrow.waste .tag{background:#EEF1F5;color:#8A93A0;}
  .rrow.s .tag{background:#DCFCE7;color:#166534;}
  .rrow .tm{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:13px;color:var(--weak);}

  .stamp{align-self:stretch;font-weight:900;font-size:16.5px;border-radius:12px;padding:9px 13px;text-align:center;line-height:1.35;}
  .stamp.bad{background:#FEE2E2;color:var(--red-dark);border:1.5px solid #FCA5A5;}
  .stamp.good{background:#DCFCE7;color:#166534;border:1.5px solid #86EFAC;}

  /* 中央 */
  .mzone{flex:0 0 300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;position:relative;}
  .mzbig{font-weight:900;font-size:24px;color:var(--ink);text-align:center;line-height:1.3;}
  .mzbig b{color:var(--green-dark);}
  .setbox{width:100%;background:#fff;border:2.5px solid var(--blue);border-radius:14px;box-shadow:0 6px 14px rgba(37,99,235,.22);overflow:hidden;margin:12px 0 10px;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .setbox .sh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;color:var(--blue-dark);background:#EEF4FF;padding:8px 11px;border-bottom:1px solid #C7DBF7;}
  .setbox .sh img{width:18px;height:18px;object-fit:contain;}
  .setbox .sl{font-size:12.5px;font-weight:800;color:#64748B;padding:8px 11px 3px;}
  .setbox .sv{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;color:#0B3A8F;padding:0 11px 11px;word-break:break-all;line-height:1.45;}
  .bigarrow{width:56px;height:56px;color:var(--blue);}
  .mzmascot{position:absolute;right:-14px;bottom:-8px;height:118px;z-index:30;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));}

  .next{flex:0 0 auto;margin:10px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:12px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.77-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">フローが動きすぎて履歴が汚れる｜<span class="hl">“条件に合う時だけ”起動させる</span></div>
    <img class="title-chara" src="${A}chara/chara_trouble.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">トリガーに<b>条件を1行</b>足すと、合わない時は<b>そもそも起動しません</b>。中で条件分岐して弾くのと違い、<b>ムダな実行が履歴に残りません</b>。</div>
  </div>

  <div class="stage">
    <div class="pz">
      <div class="pzhd ng"><span class="b">✕</span>条件なし ＝ 毎回起動する</div>
      <div class="panel ng">
        <div class="run">
          <div class="run-h"><img src="${A}icons/pa_logo.png" alt=""><span>実行履歴</span><span class="cnt bad">98件</span></div>
          <div class="rrow waste"><span class="mk">✓</span>回答（社内・通常）<span class="tag">中で弾いた</span></div>
          <div class="rrow waste"><span class="mk">✓</span>回答（社内・通常）<span class="tag">中で弾いた</span></div>
          <div class="rrow s"><span class="mk">✓</span>回答（<b style="color:#EA580C">至急</b>）<span class="tag">通知した</span></div>
          <div class="rrow waste"><span class="mk">✓</span>回答（社内・通常）<span class="tag">中で弾いた</span></div>
          <div class="rrow waste"><span class="mk">✓</span>回答（社内・通常）<span class="tag">中で弾いた</span></div>
        </div>
        <div class="stamp bad">「成功」だらけでも、ほとんどが空振り。ムダな実行が積み上がる</div>
      </div>
    </div>

    <div class="mzone">
      <div class="mzbig">設定に<br><b>条件を1行</b></div>
      <div class="setbox">
        <div class="sh"><img src="${A}icons/pa_logo.png" alt="">トリガーの条件</div>
        <div class="sl">条件を追加</div>
        <div class="sv">@contains(triggerBody()?['区分'],'至急')</div>
      </div>
      <span class="bigarrow">${svg('arrow')}</span>
      <img class="mzmascot" src="${A}chara/chara_guts.png" alt="">
    </div>

    <div class="pz">
      <div class="pzhd ok"><span class="b">✓</span>条件あり ＝ 必要な時だけ</div>
      <div class="panel ok">
        <div class="run">
          <div class="run-h"><img src="${A}icons/pa_logo.png" alt=""><span>実行履歴</span><span class="cnt good">6件</span></div>
          <div class="rrow s"><span class="mk">✓</span>回答（至急）<span class="tm">09:14</span></div>
          <div class="rrow s"><span class="mk">✓</span>回答（至急）<span class="tm">11:02</span></div>
          <div class="rrow s"><span class="mk">✓</span>回答（至急）<span class="tm">14:37</span></div>
          <div class="rrow s"><span class="mk">✓</span>回答（至急）<span class="tm">16:20</span></div>
          <div class="rrow s"><span class="mk">✓</span>回答（至急）<span class="tm">17:45</span></div>
        </div>
        <div class="stamp good">起動そのものが減る。探すときも、本当に動いた分だけ並ぶ</div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>一致・含む・数値・はい/いいえ…<b>列の種類ごとの書き方</b>は <b>2枚目</b>にまとめました！</div>
  <div class="src">出典：Microsoft Learn（トリガー）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
