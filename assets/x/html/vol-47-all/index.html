<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vol.47 まとめプレビュー（全2枚スクロール）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box;}
  body{background:#eef1f5;font-family:"Noto Sans JP",sans-serif;padding:18px 0 40px;}
  .head{color:#1f2937;text-align:center;font-weight:900;font-size:17px;margin-bottom:16px;padding:0 14px;}
  .head span{color:#2563EB;}
  .stack{display:flex;flex-direction:column;align-items:center;gap:26px;}
  .label{color:#475569;font-weight:700;font-size:14px;margin:0 0 7px 2px;align-self:flex-start;}
  .label b{color:#B45309;}
  .item{width:min(96vw,1280px);}
  .shot{display:block;width:100%;height:auto;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.22);background:#fff;}
</style>
</head>
<body>
  <div class="head">Vol.47「重複チェックしたのに同じ人がまた登録される問題（W≠w）」<span> 全2枚（スクロールで確認）</span></div>
  <div class="stack">
    <div class="item">
      <div class="label">1枚目｜<b>あるある＋原因</b>（メール重複がすり抜ける）</div>
      <img class="shot" src="../vol-47/vol47.png" alt="Vol.47-1">
    </div>
    <div class="item">
      <div class="label">2枚目｜<b>解決3手</b>（toLowerで揃える）</div>
      <img class="shot" src="../vol-47b/vol47b.png" alt="Vol.47-2">
    </div>
  </div>
</body>
</html>
