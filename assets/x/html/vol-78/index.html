<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.78-1 そのフロー、追加のお金がいる？いらない？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C; --amber:#9A3412;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:26.5px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:11px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:42px;height:42px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:20px;color:var(--blue-dark);line-height:1.36;padding-right:100px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;gap:16px;min-height:0;}

  /* 左：判定（SVG分岐図解） */
  .flowz{flex:0 0 486px;display:flex;flex-direction:column;min-height:0;}
  .hd{font-weight:900;font-size:23px;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
  .hd .b{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .flow{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .qbox{background:#fff;border:3px solid var(--blue);border-radius:14px;padding:13px 16px;box-shadow:0 5px 13px rgba(37,99,235,.18);text-align:center;flex:0 0 auto;}
  .qbox .qq{font-weight:900;font-size:22px;color:var(--blue-dark);line-height:1.32;}
  .qbox .qq .diamond{color:var(--orange);}
  .split{flex:1;display:flex;gap:13px;min-height:0;}
  .road{flex:1;border-radius:15px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;position:relative;overflow:hidden;}
  .road.free{background:linear-gradient(180deg,#F1FCF6,#DEF5E8);border:3px solid #6EE7A8;}
  .road.pay{background:linear-gradient(180deg,#FFF7ED,#FFE7CE);border:3px solid #FDBA74;}
  .road .rimg{width:100%;height:112px;flex:0 0 auto;}
  .road .rans{font-weight:900;font-size:19px;line-height:1.2;}
  .road.free .rans{color:var(--green-dark);}
  .road.pay .rans{color:var(--amber);}
  .road .rdesc{font-size:15.5px;font-weight:800;line-height:1.4;}
  .road.free .rdesc{color:#166534;}
  .road.pay .rdesc{color:#7C2D12;}
  .road .rbadge{margin-top:auto;font-weight:900;font-size:16px;border-radius:999px;padding:5px 15px;}
  .road.free .rbadge{background:#16A34A;color:#fff;}
  .road.pay .rbadge{background:#EA580C;color:#fff;}

  .miss{flex:0 0 auto;background:#FFFBF5;border:2px solid #FDBA74;border-radius:12px;padding:9px 13px;display:flex;align-items:center;gap:11px;}
  .miss .mi{flex:0 0 auto;font-size:26px;}
  .miss .mtx{font-size:15px;font-weight:800;color:#7C2D12;line-height:1.42;}
  .miss .mtx b{color:#9A3412;}

  /* 右：実例カード */
  .exz{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .ex{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .card{flex:1;background:#fff;border:1px solid #D7DEE8;border-radius:13px;box-shadow:0 5px 14px rgba(0,0,0,.14);overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .card-h{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:10px 14px;font-weight:900;font-size:18px;color:#fff;}
  .card.free .card-h{background:linear-gradient(90deg,#0B7A4B,#16A34A);}
  .card.prem .card-h{background:linear-gradient(90deg,#9A3412,#EA580C);}
  .card-h .tag{margin-left:auto;font-size:14.5px;font-weight:900;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 13px;}
  .cbody{flex:1;padding:11px 14px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:0;}
  .cn{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:#243B58;flex-wrap:wrap;}
  .cn img{width:30px;height:30px;object-fit:contain;flex:0 0 auto;}
  .cn .em{font-size:26px;flex:0 0 auto;}
  .cn .op{color:#B6C0CC;font-weight:900;}
  .cn .plus{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;white-space:nowrap;}
  .card.free .cn .plus{color:var(--green-dark);}
  .card.prem .cn .plus{color:#9A3412;}
  .exmascot{position:absolute;right:-6px;bottom:-6px;height:120px;z-index:30;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));}

  .next{flex:0 0 auto;margin:11px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:12px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:5px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgArrow='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const svgBulb='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>';

/* 貯金箱＝無料で貯まる */
const piggy=`<svg class="ic" viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#16A34A"/></linearGradient>
    <radialGradient id="coinG" cx="38%" cy="30%"><stop offset="0" stop-color="#FEF08A"/><stop offset="1" stop-color="#EAB308"/></radialGradient>
  </defs>
  <ellipse cx="60" cy="98" rx="40" ry="7" fill="#000" opacity=".08"/>
  <!-- 落ちるコイン -->
  <circle cx="60" cy="20" r="12" fill="url(#coinG)" stroke="#CA8A04" stroke-width="2"/>
  <text x="60" y="26" font-size="15" font-weight="900" fill="#92400E" text-anchor="middle">¥</text>
  <!-- 貯金箱本体 -->
  <ellipse cx="60" cy="66" rx="42" ry="32" fill="url(#pig)" stroke="#0B7A4B" stroke-width="2.5"/>
  <rect x="52" y="34" width="16" height="5" rx="2.5" fill="#0B7A4B"/>
  <circle cx="78" cy="58" r="4" fill="#0B7A4B"/>
  <path d="M92 60 q10 -4 12 6 q-6 2 -12 -2z" fill="url(#pig)" stroke="#0B7A4B" stroke-width="2"/>
  <rect x="34" y="92" width="9" height="12" rx="3" fill="#0B7A4B"/>
  <rect x="77" y="92" width="9" height="12" rx="3" fill="#0B7A4B"/>
  <circle cx="46" cy="60" r="5" fill="#fff"/><circle cx="47" cy="61" r="2.4" fill="#0B3A26"/>
  <text x="60" y="74" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">¥0</text>
</svg>`;

/* 財布から飛び出すコイン＝支払い */
const wallet=`<svg class="ic" viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <radialGradient id="coinO" cx="38%" cy="30%"><stop offset="0" stop-color="#FEF08A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
  </defs>
  <ellipse cx="60" cy="100" rx="40" ry="7" fill="#000" opacity=".08"/>
  <!-- 飛び出すコイン3枚 -->
  <circle cx="34" cy="26" r="11" fill="url(#coinO)" stroke="#B45309" stroke-width="2"/><text x="34" y="31" font-size="13" font-weight="900" fill="#7C2D12" text-anchor="middle">¥</text>
  <circle cx="62" cy="16" r="12" fill="url(#coinO)" stroke="#B45309" stroke-width="2"/><text x="62" y="22" font-size="14" font-weight="900" fill="#7C2D12" text-anchor="middle">¥</text>
  <circle cx="88" cy="28" r="10" fill="url(#coinO)" stroke="#B45309" stroke-width="2"/><text x="88" y="33" font-size="12" font-weight="900" fill="#7C2D12" text-anchor="middle">¥</text>
  <!-- 財布 -->
  <rect x="24" y="52" width="72" height="48" rx="10" fill="url(#wal)" stroke="#9A3412" stroke-width="2.5"/>
  <rect x="24" y="52" width="72" height="15" rx="8" fill="#C2410C" opacity=".5"/>
  <rect x="70" y="70" width="30" height="20" rx="6" fill="#FDBA74" stroke="#9A3412" stroke-width="2"/>
  <circle cx="82" cy="80" r="4" fill="#9A3412"/>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.78-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">そのフロー、追加のお金がいる？｜<span class="hl">見分け方は“1つのこと”だけ</span></div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgBulb}</div>
    <div class="txt">Microsoft 365があれば<b>標準コネクタは追加費用なし</b>。<b>プレミアムを1つでも</b>使うと、そのフロー全体が有料（Premium）扱いになります。</div>
  </div>

  <div class="stage">
    <div class="flowz">
      <div class="hd"><span class="b">?</span>判定は、この分かれ道だけ</div>
      <div class="flow">
        <div class="qbox">
          <div class="qq">使うコネクタに <span class="diamond">◆プレミアム</span> が1つでもある？</div>
        </div>
        <div class="split">
          <div class="road free">
            <div class="rimg">${piggy}</div>
            <div class="rans">いいえ＝標準だけ</div>
            <div class="rdesc">M365の範囲。<br>追加費用なしで動く。</div>
            <div class="rbadge">✓ 追加費用なし</div>
          </div>
          <div class="road pay">
            <div class="rimg">${wallet}</div>
            <div class="rans">はい＝1つでも</div>
            <div class="rdesc">作る人・動かす人の<br>両方にPremium。</div>
            <div class="rbadge">＄ Premium が必要</div>
          </div>
        </div>
        <div class="miss">
          <span class="mi">🙅</span>
          <span class="mtx">よくある勘違い：「作るだけ」ならM365でもOK。でも<b>動かす（実行する）にはPremiumが要る</b>。作れた＝無料、ではありません。</span>
        </div>
      </div>
    </div>

    <div class="exz">
      <div class="hd"><span class="b">例</span>身近なフローで見ると</div>
      <div class="ex">
        <div class="card free">
          <div class="card-h">この組み合わせなら 追加費用なし<span class="tag">✓ 標準だけ</span></div>
          <div class="cbody">
            <div class="cn"><img src="${A}icons/pa_forms.png" alt="">Forms<span class="op">＋</span><img src="${A}icons/pa_sharepoint.png" alt="">SharePoint<span class="op">＋</span><img src="${A}icons/pa_teams.png" alt="">Teams<span class="plus">全部 標準</span></div>
            <div class="cn"><img src="${A}icons/pa_outlook.png" alt="">Outlook<span class="op">＋</span><img src="${A}icons/pa_excel.png" alt="">Excel<span class="op">＋</span><img src="${A}icons/pa_schedule.png" alt="">スケジュール<span class="plus">全部 標準</span></div>
          </div>
        </div>
        <div class="card prem">
          <div class="card-h">これが1つでも混じると Premium<span class="tag">＄ 有料</span></div>
          <div class="cbody">
            <div class="cn"><span class="em">🌐</span>HTTP<span class="op">／</span><span class="em">🗄️</span>SQL Server<span class="op">／</span><span class="em">⚙️</span>Dataverse<span class="plus" style="padding-right:118px">◆プレミアム</span></div>
            <div class="cn" style="padding-right:118px"><span class="em">🔧</span>カスタムコネクタ<span class="op">／</span><span class="em">🤖</span>AI Builder<span class="plus">◆プレミアム</span></div>
          </div>
        </div>
      </div>
      <img class="exmascot" src="${A}chara/chara_point.png" alt="">
    </div>
  </div>

  <div class="next"><span class="na">${svgArrow}</span>標準／プレミアムの<b>コネクタ早見表</b>と<b>ライセンスの数字</b>は <b>2枚目</b>にまとめました！</div>
  <div class="src">出典：Microsoft Learn（Power Automate ライセンスの種類・2026-07更新）／アイコンは一部イメージ</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
