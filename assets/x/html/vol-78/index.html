<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.78-1 戻し忘れのチェックアウトを本人にお知らせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --spo:#0F6CBD; --spo-dark:#0A4F8A; --teams:#5B5FC7;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.34;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .cols{flex:1 1 auto;margin:12px 16px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;min-height:0;}
  .col{position:relative;display:flex;flex-direction:column;min-height:0;gap:9px;}
  .ch{font-weight:900;font-size:21px;color:var(--ink);display:flex;align-items:center;gap:9px;line-height:1.15;letter-spacing:-.01em;flex:0 0 auto;}
  .ch .n{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .col.c3 .ch .n{background:var(--teams);}
  .scene{flex:1;background:#fff;border:1px solid #D7DEE8;border-radius:13px;box-shadow:0 5px 13px rgba(0,0,0,.13);overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .sh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 11px;background:#F3F6FB;border-bottom:1px solid #E3E9F1;}
  .sh img{width:22px;height:22px;object-fit:contain;}
  .sh span{font-weight:800;font-size:14.5px;color:#243B58;}
  .sh.tm{background:#EEF0FB;border-color:#DBDEF6;} .sh.tm span{color:#3A3E8C;}
  .sb{flex:1;padding:10px;display:flex;flex-direction:column;min-height:0;}
  .cap{flex:0 0 auto;font-size:15.5px;font-weight:800;color:var(--gray);line-height:1.4;background:#F8F9FA;border-left:4px solid var(--blue);border-radius:0 9px 9px 0;padding:8px 11px;}
  .cap b{color:var(--blue-dark);}
  .col.c3 .cap{border-left-color:var(--teams);} .col.c3 .cap b{color:#3A3E8C;}
  .carrow{position:absolute;top:52%;right:-12px;width:22px;height:22px;color:var(--blue);z-index:6;}

  /* ①ライブラリの行 */
  .frow{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;font-size:14px;font-weight:800;color:#243B58;border:1px solid #EDF1F6;margin-bottom:6px;}
  .frow:last-child{margin-bottom:0;}
  .frow .xi{flex:0 0 auto;width:22px;height:26px;}
  .frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .who{font-size:12px;font-weight:800;color:#94A3B8;}
  .frow.lock{background:#FFF5F5;border:1.6px solid #F3B4B4;}
  .frow.lock .who{color:#B91C1C;}
  .scanbar{margin-top:auto;font-size:14px;font-weight:900;color:var(--spo-dark);background:#EAF4FD;border:1.5px dashed #8CC1EC;border-radius:8px;padding:7px 9px;text-align:center;}
  .lockpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;background:#FEE2E2;color:#B91C1C;font-size:11.5px;font-weight:900;border-radius:6px;padding:2px 7px;}

  /* ②本人特定 */
  .found{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
  .idcard{width:100%;background:#FFF8F7;border:2px solid #F3B4AE;border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 3px 8px rgba(196,36,28,.1);}
  .idcard .who2{min-width:0;}
  .idcard .lb{font-size:12.5px;font-weight:800;color:var(--weak);}
  .idcard .nm{font-size:19px;font-weight:900;color:#B91C1C;line-height:1.15;}
  .idcard .em{font-size:12.5px;font-weight:700;color:#94A3B8;font-family:'Roboto Mono',monospace;}
  .idnote{font-size:14px;font-weight:800;color:#7C2D12;background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:7px 9px;line-height:1.35;text-align:center;}

  /* ③Teams DM */
  .dm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;}
  .msg{display:flex;gap:9px;align-items:flex-start;}
  .msg.reply{flex-direction:row-reverse;}
  .msg.reply .av{background:linear-gradient(135deg,#F59E0B,#D97706);}
  .msg.reply .bub{border-radius:12px 4px 12px 12px;background:#F3F0FF;border-color:#D9CEF6;}
  .msg.reply .bt{color:#4C1D95;}
  .msg .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .bub{background:#fff;border:1px solid #E1E4F2;border-radius:4px 12px 12px 12px;padding:9px 11px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .bub .bn{font-size:13px;font-weight:900;color:#3A3E8C;margin-bottom:3px;}
  .bub .bt{font-size:14.5px;font-weight:700;color:#293241;line-height:1.4;}
  .bub .bt b{color:#B91C1C;}
  .bub .file{margin-top:7px;display:flex;align-items:center;gap:7px;background:#F3F6FB;border:1px solid #E3E9F1;border-radius:7px;padding:5px 8px;font-size:12.5px;font-weight:800;color:#243B58;}

  .next{flex:0 0 auto;margin:10px 16px 15px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
// Excelファイル小アイコン
const xls=`<svg viewBox="0 0 22 26" width="22" height="26"><rect x="1" y="1" width="20" height="24" rx="3" fill="#fff" stroke="#B7C3D2"/><path d="M15 1l6 6h-6z" fill="#DDE6EF"/><rect x="1" y="14" width="15" height="11" rx="2" fill="#217346"/><text x="8.5" y="22.5" text-anchor="middle" fill="#fff" font-weight="900" font-size="7.5" font-family="Segoe UI">X</text></svg>`;
// 大きめ 鍵つきExcel（②用）
const lockFile=`<svg viewBox="0 0 92 84" width="92" height="84">
  <defs><linearGradient id="xg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8C57"/><stop offset="1" stop-color="#1C6A41"/></linearGradient></defs>
  <rect x="14" y="6" width="52" height="66" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1.6" filter="drop-shadow(0 4px 6px rgba(0,0,0,.15))"/>
  <path d="M52 6l14 14h-14z" fill="#DDE6EF"/>
  <rect x="14" y="46" width="52" height="26" rx="6" fill="url(#xg)"/><rect x="14" y="46" width="52" height="8" fill="url(#xg)"/>
  <text x="40" y="64" text-anchor="middle" fill="#fff" font-weight="900" font-size="15" font-family="Segoe UI">X</text>
  <rect x="20" y="16" width="30" height="4" rx="1.5" fill="#C6D2DF"/><rect x="20" y="25" width="30" height="4" rx="1.5" fill="#C6D2DF"/><rect x="20" y="34" width="20" height="4" rx="1.5" fill="#C6D2DF"/>
  <g filter="drop-shadow(0 3px 4px rgba(0,0,0,.25))">
    <circle cx="68" cy="60" r="19" fill="#DC2626"/>
    <rect x="60" y="58" width="16" height="13" rx="2.5" fill="#fff"/>
    <path d="M63 58v-3a5 5 0 0 1 10 0v3" fill="none" stroke="#fff" stroke-width="2.6"/>
    <circle cx="68" cy="64" r="2" fill="#DC2626"/>
  </g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.78-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">戻し忘れの“チェックアウト”を、<span class="hl">握っている本人に自動でお知らせ</span></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">「誰かが編集中で開けない」ファイル。<b>チェックアウトしたのは誰か</b>をフローが調べて、<b>その本人にそっとリマインド</b>できます。</div>
  </div>

  <div class="cols">
    <div class="col">
      <span class="carrow">${svg('arrow')}</span>
      <div class="ch"><span class="n">1</span>ライブラリを見回る</div>
      <div class="scene">
        <div class="sh"><img src="${A}icons/pa_sharepoint.png" alt=""><span>営業部 ドキュメント</span></div>
        <div class="sb">
          <div class="frow"><span class="xi">${xls}</span><span class="fn">商品カタログ.xlsx</span><span class="who">空き</span></div>
          <div class="frow lock"><span class="xi">${xls}</span><span class="fn">見積テンプレ.xlsx</span><span class="lockpill">🔒 編集中</span></div>
          <div class="frow"><span class="xi">${xls}</span><span class="fn">売上集計.xlsx</span><span class="who">空き</span></div>
          <div class="frow"><span class="xi">${xls}</span><span class="fn">単価表_2026.xlsx</span><span class="who">空き</span></div>
          <div class="frow"><span class="xi">${xls}</span><span class="fn">提案書ひな型.xlsx</span><span class="who">空き</span></div>
          <div class="scanbar">🔄 毎朝、ぜんぶ自動で見回り</div>
        </div>
      </div>
      <div class="cap">チェックアウトされたまま<b>戻ってこない</b>ファイルを、定期的に見つけます。</div>
    </div>

    <div class="col">
      <span class="carrow">${svg('arrow')}</span>
      <div class="ch"><span class="n">2</span>握っている本人が分かる</div>
      <div class="scene">
        <div class="sh"><img src="${A}icons/pa_sharepoint.png" alt=""><span>ファイルのプロパティ</span></div>
        <div class="sb"><div class="found">
          <div>${lockFile}</div>
          <div class="idcard">
            <div class="who2"><div class="lb">チェックアウト ユーザー</div><div class="nm">佐藤 花子</div><div class="em">sato@example.co.jp</div></div>
          </div>
          <div class="idnote">「チェックアウト ユーザー」に<b>本人の名前とメール</b>が入っています。</div>
        </div></div>
      </div>
      <div class="cap"><b>誰が握っているか</b>が、ファイルの情報に記録されています。</div>
    </div>

    <div class="col c3">
      <div class="ch"><span class="n">3</span>本人にそっとお知らせ</div>
      <div class="scene">
        <div class="sh tm"><img src="${A}icons/pa_teams.png" alt=""><span>チャット</span></div>
        <div class="sb"><div class="dm">
          <div class="msg">
            <span class="av">Bot</span>
            <div class="bub">
              <div class="bn">ファイル番人 Bot</div>
              <div class="bt">おつかれさまです。下のファイルを<b>3日チェックアウト中</b>です。編集が終わっていれば<b>チェックイン</b>をお願いします🙏</div>
              <div class="file"><span style="width:22px;height:26px;display:inline-flex;flex:0 0 auto">${xls}</span>見積テンプレ.xlsx</div>
            </div>
          </div>
          <div class="msg reply">
            <span class="av">佐</span>
            <div class="bub"><div class="bn">佐藤 花子</div><div class="bt">あっ、すみません！今すぐチェックインします🙇</div></div>
          </div>
        </div></div>
      </div>
      <div class="cap">本人だけに届くから、<b>角が立たず</b>にそっと促せます。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>使うのは<b>標準アクションだけ</b>。見回りから通知までの<b>作り方</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（SharePoint「ファイルのプロパティの取得」「チェックアウトを破棄」）／画面は再現・氏名は架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
