<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.12-2 開く・アイコンを選ぶ・聞く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  .stage{gap:6px;}
  .c3{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;border-radius:14px;padding:8px 10px 9px;background:var(--mc-bg);border:2.5px solid var(--mc-line);}
  .c3 .h{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px;line-height:1.2;color:var(--mc-dark);white-space:nowrap;}
  .c3 .h .n{flex:0 0 auto;width:36px;height:36px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(180deg,#14B8A6,#0F766E);box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .c3 .cp{flex:0 0 auto;font-size:16px;font-weight:900;line-height:1.35;border-radius:9px;padding:6px 10px;color:var(--mc-dark);background:#fff;border:1.5px solid var(--mc-line);}
  .c3 .cp b{color:#EA580C;}
  .arrowc{flex:0 0 24px;display:flex;align-items:center;justify-content:center;color:var(--mc);}
  .arrowc svg{width:24px;height:24px;}
  .sc{flex:0 0 108px;border-radius:11px;position:relative;overflow:hidden;background:#D9F2ED;}
  .sc > svg{position:absolute;inset:0;width:100%;height:100%;}
  .sc .chara{position:absolute;right:4px;bottom:-6px;height:112px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));}
  /* 列2の情景：ツール バーの拡大 */
  .sc.tb{display:flex;align-items:center;gap:10px;padding:0 12px;font-family:"Segoe UI","Noto Sans JP",sans-serif;}
  .sc.tb .url{flex:1;min-width:0;height:44px;border-radius:22px 0 0 22px;margin-left:-30px;background:#fff;border:1.5px solid #C8CCD2;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-size:17px;font-weight:500;color:#6B7280;white-space:nowrap;overflow:hidden;}
  .sc.tb .big{flex:0 0 auto;width:74px;height:74px;border-radius:18px;background:#fff;border:3.5px solid #EA580C;box-shadow:0 0 0 7px rgba(234,88,12,.2),0 4px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;position:relative;}
  .sc.tb .big .cur{position:absolute;right:-3px;bottom:-4px;width:32px;height:32px;}
  .sc.tb .av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:#2563EB;color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-left:8px;}
  .sc.tb .dots{flex:0 0 auto;font-size:26px;font-weight:900;color:#6B7280;letter-spacing:1px;}
  /* モック共通 */
  .mk{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid #AEB8C6;border-radius:10px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.12);font-family:"Segoe UI","Noto Sans JP",sans-serif;color:#242424;}
  .mk .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;}
  .mk .wh .shd{width:19px;height:19px;flex:0 0 auto;}
  .rw{flex:1;min-height:0;display:flex;align-items:center;gap:9px;padding:0 10px;border-bottom:1.2px dashed #E5E7EB;font-size:16.5px;font-weight:700;color:#1B2A44;}
  .rw:last-child{border-bottom:none;}
  .rw .ib{flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:center;}
  .rw .ib svg{width:26px;height:26px;}
  .rw .st{margin-left:auto;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#16A34A;color:#fff;display:flex;align-items:center;justify-content:center;padding:5px;}
  .rw.ng{background:#FEF2F2;color:#991B1B;}
  .rw.ng .st{background:#DC2626;}
  /* 列2：ミニ Edge */
  .me{flex:1;min-height:0;display:flex;}
  .me .pg{flex:1;min-width:0;padding:8px 9px;display:flex;flex-direction:column;gap:6px;border-right:2px solid #C9CED6;}
  .me .pg .hd{flex:0 0 13px;background:#1E3A8A;border-radius:3px;}
  .me .pg .ln{flex:1;min-height:0;background:repeating-linear-gradient(180deg,#D5DAE1 0,#D5DAE1 6px,transparent 6px,transparent 16px);}
  .me .pn{flex:0 0 178px;display:flex;flex-direction:column;background:#F0FDFA;position:relative;}
  .me .pn .ph{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 8px;background:#fff;border-bottom:1px solid #E1DFDD;font-size:16px;font-weight:700;}
  .me .pn .ph .shd{width:19px;height:19px;}
  .me .pn .bd{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Noto Sans JP",sans-serif;font-size:17px;font-weight:900;color:var(--mc-dark);line-height:1.3;}
  .me .slide{position:absolute;left:-23px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:#EA580C;color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 2px 5px rgba(0,0,0,.3);}
  .acc{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#ECFDF5;border-top:1.5px solid #A7E3C4;font-size:15.5px;font-weight:700;color:#065F46;line-height:1.25;}
  .acc .av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#2563EB;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .acc .shd{width:22px;height:22px;flex:0 0 auto;margin-left:auto;}
  /* 列3：やり取り */
  .pb{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px 9px;background:#F7F8FA;}
  .ask{align-self:flex-end;max-width:96%;background:#DDF3EF;border:1.5px solid #8FD9CC;border-radius:12px 12px 3px 12px;padding:4px 11px;font-size:16.5px;font-weight:700;color:#1B2A44;line-height:1.3;}
  .ans{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;background:#fff;border:1.5px solid #E1DFDD;border-radius:12px 12px 12px 3px;padding:3px 10px;}
  .ans.s{flex:0 0 auto;padding:5px 10px;}
  .ans div{font-size:16px;font-weight:700;color:#1B2A44;line-height:1.3;display:flex;gap:7px;align-items:center;}
  .ans div i{flex:0 0 auto;font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--mc);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .ans b{color:#B91C1C;}
  .warnbar{margin-top:8px;padding:7px 14px;}
  .warnbar .ws{flex-wrap:nowrap;}
  .warnbar .ws span{white-space:nowrap;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12l5 5 9-10"/>',arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',back:'<path d="M20 12H5M11 6l-6 6 6 6"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const SHD=`<svg class="shd" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.600-1.700-8-6-8-11V5z" fill="#16A34A"/><path d="M8 12l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const GLOBE=`<svg viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>`;
const PDF=`<svg viewBox="0 0 24 24"><path d="M5 2h10l5 5v15H5z" fill="#fff" stroke="#94A3B8" stroke-width="1.6" stroke-linejoin="round"/><rect x="2" y="10" width="15" height="8" rx="2" fill="#DC2626"/><text x="9.500" y="16.300" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="6.500" font-weight="900" fill="#fff">PDF</text></svg>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.12-2</div><div class="lic-pill free">無料の Copilot Chat でできる</div></div>
    <div class="title-text">開く・アイコンを選ぶ・聞く。<br><span class="hl">3つの操作</span>で横に答えが返る</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">先に、<b>職場アカウントで Edge にサインイン</b>しておきます。<br>あとは読みたいページを開いたまま、<b>右上のアイコン</b>から横のチャットに聞くだけです</div>
  </div>
  <div class="stage">
    <div class="c3">
      <div class="h"><span class="n">1</span>ページか PDF を Edge で開く</div>
      <div class="sc">
        <svg viewBox="0 0 364 108" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient><filter id="s1" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#134E4A" flood-opacity=".25"/></filter></defs>
          <rect width="364" height="108" fill="#D9F2ED"/>
          <g filter="url(#s1)"><rect x="12" y="12" width="150" height="86" rx="7" fill="#fff" stroke="#AEB8C6" stroke-width="1.5"/><path d="M12 19a7 7 0 0 1 7-7h136a7 7 0 0 1 7 7v9H12z" fill="#DCE1E8"/><rect x="18" y="16" width="52" height="12" rx="4" fill="#fff"/><rect x="18" y="33" width="138" height="10" rx="5" fill="#F1F3F4"/></g>
          <rect x="20" y="50" width="134" height="9" fill="#1E3A8A"/><path d="M20 67h134M20 75h134M20 83h134M20 91h90" stroke="#C5CCD6" stroke-width="3.500" stroke-linecap="round"/>
          <text x="186" y="62" text-anchor="middle" font-family="Noto Sans JP,sans-serif" font-size="16" font-weight="900" fill="#134E4A">か</text>
          <g filter="url(#s1)"><path d="M206 10h42l18 18v72h-60z" fill="url(#g1)" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round"/><path d="M248 10v18h18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round"/></g>
          <rect x="198" y="38" width="46" height="21" rx="4" fill="#DC2626"/><text x="221" y="54" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="15" font-weight="900" fill="#fff">PDF</text>
          <path d="M214 70h44M214 79h44M214 88h28" stroke="#C5CCD6" stroke-width="3.500" stroke-linecap="round"/>
        </svg>
        <img class="chara" src="${A}chara/chara_laptop.png" alt="">
      </div>
      <div class="mk">
        <div class="wh">ページの中身を使えるもの</div>
        <div class="rw"><span class="ib">${GLOBE}</span>公開されている Web サイト<span class="st">${svgw(P.ok,3.4)}</span></div>
        <div class="rw"><span class="ib">${MS('sharepoint.svg',26)}</span>SharePoint などの社内サイト<span class="st">${svgw(P.ok,3.4)}</span></div>
        <div class="rw"><span class="ib">${PDF}</span>Edge で開いた PDF<span class="st">${svgw(P.ok,3.4)}</span></div>
        <div class="rw ng"><span class="ib">${MS('word.svg',26)}</span>Word などの Office 文書<span class="st">${svgw(P.x,3.4)}</span></div>
      </div>
      <div class="cp">対象は、<b>いま表示しているタブ</b>の中身です</div>
    </div>
    <div class="arrowc">${svgw(P.arrow,3)}</div>
    <div class="c3">
      <div class="h"><span class="n">2</span>右上の Copilot アイコンを選ぶ</div>
      <div class="sc tb">
        <div class="url">…/shoene-hojo/koubo</div>
        <div class="big">${CPI(50)}<svg class="cur" viewBox="0 0 24 24"><path d="M5 2l14 11-6.500 1 3.800 7-3 1.500-3.700-7.200L5 20z" fill="#fff" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div class="av">山</div><span class="dots">…</span>
      </div>
      <div class="mk">
        <div class="me">
          <div class="pg"><div class="hd"></div><div class="ln"></div></div>
          <div class="pn"><span class="slide">${svgw(P.back,3.2)}</span><div class="ph">${CPI(20)}Copilot${SHD}</div><div class="bd">ページの横に<br>チャットが開く</div></div>
        </div>
        <div class="acc"><span class="av">山</span>職場アカウントでサインイン中は、<br>エンタープライズ データ保護の対象${SHD}</div>
      </div>
      <div class="cp">全画面ではなく、<b>横に開いたチャット</b>で聞く</div>
    </div>
    <div class="arrowc">${svgw(P.arrow,3)}</div>
    <div class="c3">
      <div class="h"><span class="n">3</span>聞きたいことを入力する</div>
      <div class="sc">
        <svg viewBox="0 0 364 108" preserveAspectRatio="xMidYMid slice"><defs><filter id="s3" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#134E4A" flood-opacity=".25"/></filter></defs>
          <rect width="364" height="108" fill="#D9F2ED"/>
          <g filter="url(#s3)"><rect x="12" y="10" width="92" height="90" rx="6" fill="#fff" stroke="#AEB8C6" stroke-width="1.5"/></g>
          <rect x="20" y="18" width="76" height="8" fill="#1E3A8A"/><path d="M20 35h76M20 43h76M20 51h76M20 59h76M20 67h76M20 75h76M20 83h76M20 91h50" stroke="#C5CCD6" stroke-width="3" stroke-linecap="round"/>
          <path d="M112 55h30" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/><path d="M134 44l12 11-12 11" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <g filter="url(#s3)"><path d="M162 12h96a8 8 0 0 1 8 8v60a8 8 0 0 1-8 8h-70l-14 12v-12h-12a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8z" fill="#fff" stroke="#0F766E" stroke-width="2.500" stroke-linejoin="round"/></g>
          <g font-family="Segoe UI,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle"><circle cx="176" cy="30" r="9" fill="#0F766E"/><text x="176" y="34.500">1</text><circle cx="176" cy="51" r="9" fill="#0F766E"/><text x="176" y="55.500">2</text><circle cx="176" cy="72" r="9" fill="#0F766E"/><text x="176" y="76.500">3</text></g>
          <path d="M192 30h62M192 51h62M192 72h44" stroke="#7DD3C4" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <img class="chara" src="${A}chara/chara_guts.png" alt="">
      </div>
      <div class="mk">
        <div class="wh">${CPI(20)}Copilot${SHD}<span class="repro">画面は説明用の再現</span></div>
        <div class="pb">
          <div class="ask">このページの要点を3つにまとめて</div>
          <div class="ans"><div><i>1</i>対象は県内の<b>中小企業</b></div><div><i>2</i>費用の<b>1/2</b>・上限<b>200万円</b></div><div><i>3</i>締切は<b>12月18日（金）</b></div></div>
          <div class="ask">申請に必要な書類は？</div>
        </div>
      </div>
      <div class="cp">続けて聞くと、<b>同じページ</b>をもとに答えます</div>
    </div>
  </div>
  <div class="warnbar">
    <span class="wl">使う前に確認</span>
    <div class="ws"><span>答えがページと合わないとき：Edge の設定で、Copilot にブラウザー コンテンツの使用を許可</span><span>数字と日付は原文で確かめる</span></div>
  </div>
  <div class="src">出典：Microsoft Learn「Copilot in Edge Web ページの概要作成の動作」「Copilot Chat の管理」／画面と文面は説明用の再現（実画面は未確認）・団体名と人名は架空</div>
`;
</script>
</body>
</html>
