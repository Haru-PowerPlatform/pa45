<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.80-1 上長のメアドを二度と手入力しない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --ent:#0F6CBD; --user:#8657C6;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.34;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;gap:15px;min-height:0;}

  /* 左：組織図（主役SVG） */
  .orgwrap{flex:1.18;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#FBFDFF,#F1F6FC);border:2px solid #CFDBEA;border-radius:14px;box-shadow:0 5px 13px rgba(0,0,0,.1);overflow:hidden;}
  .owh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 13px;background:linear-gradient(180deg,#EAF2FB,#DCEAF7);border-bottom:1px solid #C9DAEC;font-weight:900;font-size:16px;color:#0A4F8A;}
  .owh .bd{margin-left:auto;font-size:12px;font-weight:900;color:#fff;background:var(--ent);border-radius:6px;padding:3px 9px;}
  .owb{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px;}
  .owb svg{width:100%;height:100%;}
  .owfoot{flex:0 0 auto;margin:0 12px 11px;background:#F5F0FD;border:1.5px solid #D6C7EF;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:800;color:#5B21B6;line-height:1.4;}
  .owfoot b{color:#6D28D9;}

  /* 右：仕組み3カード */
  .side{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .mcard{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #D6DEEA;border-radius:12px;padding:10px 13px;box-shadow:0 3px 8px rgba(0,0,0,.08);min-height:0;position:relative;}
  .mcard.act{border-color:#B79AE0;background:linear-gradient(180deg,#FaF7Fe,#F1EAFB);}
  .mcard .tag{position:absolute;top:-9px;left:13px;font-size:11.5px;font-weight:900;color:#fff;border-radius:6px;padding:2px 8px;}
  .mcard.inp .tag{background:var(--blue);} .mcard.act .tag{background:var(--user);} .mcard.out .tag{background:var(--green);}
  .mcard .ико{flex:0 0 auto;}
  .avatar{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .av-suzuki{background:linear-gradient(135deg,#38BDF8,#0284C7);}
  .av-sato{background:linear-gradient(135deg,#34D399,#059669);}
  .mcard .picon{flex:0 0 auto;width:48px;height:48px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;}
  .mcard .picon img{width:42px;height:42px;object-fit:contain;}
  .mcard .tx{min-width:0;}
  .mcard .tt{font-weight:900;font-size:17.5px;color:var(--ink);line-height:1.2;}
  .mcard .ss{font-size:13px;font-weight:800;color:var(--weak);line-height:1.3;margin-top:2px;}
  .mcard .em{font-family:'Roboto Mono',monospace;font-size:12.5px;color:#0B3A8F;background:#EFF6FF;border-radius:5px;padding:1px 6px;display:inline-block;margin-top:3px;}
  .mcard.out .em{color:#065F46;background:#ECFDF5;}
  .mconn{flex:0 0 auto;height:12px;display:flex;align-items:center;justify-content:center;}
  .mconn svg{width:22px;height:12px;color:var(--blue);}

  .next{flex:0 0 auto;margin:9px 16px 15px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// 組織図SVG（鈴木→佐藤→山田／申請者=鈴木、取得される上司=佐藤）
const org=`<svg viewBox="0 0 470 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="nd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F6FC"/></linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECFDF5"/><stop offset="1" stop-color="#D6F7E6"/></linearGradient>
    <linearGradient id="ap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF6FF"/><stop offset="1" stop-color="#D3EAFE"/></linearGradient>
  </defs>
  <!-- 接続線 -->
  <path d="M235 92 V128" stroke="#B7C6DA" stroke-width="3"/>
  <path d="M235 216 V252" stroke="#B7C6DA" stroke-width="3"/>
  <!-- 山田 部長 -->
  <g>
    <rect x="120" y="30" width="230" height="62" rx="14" fill="url(#nd)" stroke="#CBD7E6" stroke-width="2"/>
    <circle cx="152" cy="61" r="20" fill="#94A3B8"/><text x="152" y="68" text-anchor="middle" fill="#fff" font-weight="900" font-size="17" font-family="Noto Sans JP">山</text>
    <text x="182" y="55" fill="#243B58" font-weight="900" font-size="18" font-family="Noto Sans JP">山田 太郎</text>
    <text x="182" y="76" fill="#6B7280" font-weight="800" font-size="13" font-family="Noto Sans JP">部長</text>
  </g>
  <!-- 佐藤 課長（取得される上司・ハイライト） -->
  <g>
    <rect x="112" y="128" width="246" height="88" rx="16" fill="url(#hi)" stroke="#34D399" stroke-width="3" filter="drop-shadow(0 5px 9px rgba(6,95,70,.16))"/>
    <circle cx="150" cy="172" r="24" fill="url(#nd)" stroke="#059669" stroke-width="0"/><circle cx="150" cy="172" r="24" fill="#10B981"/><text x="150" y="180" text-anchor="middle" fill="#fff" font-weight="900" font-size="20" font-family="Noto Sans JP">佐</text>
    <text x="186" y="162" fill="#065F46" font-weight="900" font-size="20" font-family="Noto Sans JP">佐藤 花子</text>
    <text x="186" y="184" fill="#047857" font-weight="800" font-size="13.5" font-family="Noto Sans JP">課長 ＝ 直属の上司</text>
    <g transform="translate(300,138)"><rect x="0" y="0" width="52" height="21" rx="10" fill="#059669"/><text x="26" y="15" text-anchor="middle" fill="#fff" font-weight="900" font-size="12" font-family="Noto Sans JP">これ！</text></g>
  </g>
  <!-- 鈴木 申請者 -->
  <g>
    <rect x="112" y="252" width="246" height="88" rx="16" fill="url(#ap)" stroke="#2563EB" stroke-width="3" filter="drop-shadow(0 5px 9px rgba(30,58,138,.14))"/>
    <circle cx="150" cy="296" r="24" fill="#0EA5E9"/><text x="150" y="304" text-anchor="middle" fill="#fff" font-weight="900" font-size="20" font-family="Noto Sans JP">鈴</text>
    <text x="186" y="286" fill="#0B3A8F" font-weight="900" font-size="20" font-family="Noto Sans JP">鈴木 一郎</text>
    <text x="186" y="308" fill="#1E40AF" font-weight="800" font-size="13.5" font-family="Noto Sans JP">担当 ＝ 申請者（あなた）</text>
  </g>
  <!-- 取得の矢印（鈴木→佐藤） -->
  <g>
    <path d="M392 300 C440 292 440 180 366 172" fill="none" stroke="#8657C6" stroke-width="3.4" stroke-dasharray="2 6" stroke-linecap="round" marker-end=""/>
    <path d="M372 164 l-8 8 10 4z" fill="#8657C6"/>
    <g transform="translate(384,214)"><rect x="0" y="0" width="86" height="52" rx="11" fill="#fff" stroke="#C9B4EC" stroke-width="2"/><text x="43" y="20" text-anchor="middle" fill="#6D28D9" font-weight="900" font-size="12" font-family="Noto Sans JP">⚡上司の取得</text><text x="43" y="38" text-anchor="middle" fill="#6D28D9" font-weight="900" font-size="12" font-family="Noto Sans JP">(V2)</text></g>
  </g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.80-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">上長のメアドを二度と手入力しない｜<span class="hl">宛先は“組織図”が知っている</span></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">申請フォームの<b>「上長のメールアドレス」欄</b>、もう手入力は不要。申請者のメールから<b>直属の上司を自動で取得</b>できます。</div>
  </div>

  <div class="stage">
    <div class="orgwrap">
      <div class="owh">🏢 会社の組織図（Entra ID に登録済み）<span class="bd">自動で参照</span></div>
      <div class="owb">${org}</div>
      <div class="owfoot">💡 取得した<b>佐藤さん</b>にもう一度使えば、その上司＝<b>山田部長</b>。“<b>二段階承認</b>”もこれだけで作れます。</div>
    </div>

    <div class="side">
      <div class="mcard inp">
        <span class="tag">入力</span>
        <span class="avatar av-suzuki">鈴</span>
        <div class="tx"><div class="tt">申請者のメール</div><span class="em">suzuki@example.co.jp</span></div>
      </div>
      <div class="mconn">${svg('down')}</div>
      <div class="mcard act">
        <span class="tag">アクション</span>
        <span class="picon"><img src="${A}icons/pa_logo.png" alt=""></span>
        <div class="tx"><div class="tt">上司の取得 (V2)</div><div class="ss">組織図から<b>直属の上司</b>を返す・標準</div></div>
      </div>
      <div class="mconn">${svg('down')}</div>
      <div class="mcard out">
        <span class="tag">出力</span>
        <span class="avatar av-sato">佐</span>
        <div class="tx"><div class="tt">上司のメール＝承認の宛先へ</div><span class="em">sato@example.co.jp</span></div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>異動しても<b>常に最新の上司</b>に届く。二段階承認の作り方も <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（Office 365 ユーザー「上司の取得 (V2)」）／画面は再現・氏名は架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
