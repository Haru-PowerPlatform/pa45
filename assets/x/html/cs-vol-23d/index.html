<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.23-4 メモリの早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;}
  .tbl{flex:1.3;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:2px solid var(--cs-line);
    box-shadow:0 6px 14px rgba(0,0,0,.12);background:#fff;}
  .cap{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--cs-bg);border-bottom:2px solid var(--cs-line);font-size:19px;font-weight:900;color:var(--navy);}
  .tr{flex:1;min-height:0;display:flex;align-items:center;border-bottom:1.5px solid #EDE9FE;}
  .tr:last-child{border-bottom:none;}
  .tc{padding:3px 12px;font-size:16px;font-weight:700;color:#374151;line-height:1.36;}
  .tc.k{flex:0 0 175px;font-size:17px;font-weight:900;color:var(--cs-dark);display:flex;align-items:center;gap:8px;}
  .tc.k svg{flex:0 0 30px;width:30px;height:30px;}
  .tc.v{flex:0 0 160px;font-size:18px;font-weight:900;color:var(--navy);background:#F9FAFB;align-self:stretch;display:flex;align-items:center;}
  .tc.w{flex:1;min-width:0;}
  .tc.w b{color:var(--cs);}
  .right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .chat{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;background:#FAFAFA;border:2.5px solid var(--cs);border-radius:12px;padding:8px 12px;}
  .chat .hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:#1B2A44;}
  .chat .hd img{width:24px;height:24px;}
  .chat .hd .tm{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:#5B5FC7;background:#E8EBFA;border-radius:6px;padding:1px 7px;}
  .uq{align-self:flex-end;background:#E8EBFA;border-radius:10px 10px 3px 10px;padding:4px 12px;font-size:15.5px;font-weight:700;}
  .a{background:#fff;border:1px solid #E1DFDD;border-radius:10px 10px 10px 3px;padding:6px 12px;font-size:15px;font-weight:600;line-height:1.45;}
  .a ul{margin:2px 0 0 20px;}
  .a .lk{color:#0F6CBD;font-weight:800;}
  .fact{flex:0 0 auto;display:flex;align-items:center;gap:11px;background:#FFFBEB;border:2px solid #F59E0B;border-radius:12px;padding:6px 12px;}
  .fact svg{flex:0 0 60px;width:60px;height:48px;}
  .fact .t{font-size:16.5px;font-weight:900;color:var(--navy);line-height:1.3;}
  .fact .t small{display:block;font-size:14px;font-weight:700;color:#4B5563;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ic={
 cal:`<svg viewBox="0 0 30 30"><rect x="3" y="6" width="24" height="21" rx="3" fill="#fff" stroke="#7C3AED" stroke-width="2"/><rect x="3" y="6" width="24" height="6" rx="3" fill="#7C3AED"/><text x="15" y="24" text-anchor="middle" font-size="10" font-weight="900" fill="#5B21B6" font-family="Noto Sans JP">28</text></svg>`,
 eye:`<svg viewBox="0 0 30 30"><path d="M2 15 q13 -14 26 0 q-13 14 -26 0z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><circle cx="15" cy="15" r="5" fill="#7C3AED"/></svg>`,
 del:`<svg viewBox="0 0 30 30"><rect x="8" y="9" width="14" height="17" rx="2" fill="none" stroke="#DC2626" stroke-width="2.4"/><path d="M5 9 h20 M12 5 h6" stroke="#DC2626" stroke-width="2.4"/></svg>`,
 off:`<svg viewBox="0 0 30 30"><rect x="3" y="9" width="24" height="13" rx="6.5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.6"/><circle cx="10" cy="15.5" r="4.5" fill="#6B7280"/></svg>`,
 move:`<svg viewBox="0 0 30 30"><rect x="2" y="9" width="11" height="12" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><rect x="17" y="9" width="11" height="12" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><path d="M6 27 L24 3" stroke="#DC2626" stroke-width="2.6"/></svg>`,
 coin:`<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="15" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#B45309" font-family="Segoe UI">C</text></svg>`};
const F=`<svg viewBox="0 0 60 48"><rect x="4" y="6" width="52" height="38" rx="5" fill="#fff" stroke="#D97706" stroke-width="2"/>${[0,1,2,3].map(i=>`<rect x="${10+i*11}" y="16" width="8" height="8" rx="1.5" fill="${i<3?'#FDE68A':'#DC2626'}"/>`).join('')}${[0,1,2,3].map(i=>`<rect x="${10+i*11}" y="29" width="8" height="8" rx="1.5" fill="#FDE68A"/>`).join('')}</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.23</div>
    <div class="part-pill">早見表 <b>(4/4)</b></div>
    <div class="title-text">覚えた中身は<span class="q">本人だけのもの</span>。<br>使わなければ28日で消える</div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/teams.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">早見表</div>
    <div class="txt">メモリは<b>使う人・エージェント・環境ごと</b>に分けて保存される。<br>
      作った人も管理者も、<em>ふだんは中身を見られない</em>。</div>
  </div>

  <div class="body">
    <div class="tbl">
      <div class="cap"><img class="msi" src="${A}icons/cs_logo.png" alt="">Memory の決まりごと（公式）</div>
      <div class="tr"><div class="tc k">${ic.cal}消えるまで</div><div class="tc v">28日</div><div class="tc w">最後に<b>使われてから</b>数える。延長なし</div></div>
      <div class="tr"><div class="tc k">${ic.eye}見られる人</div><div class="tc v">本人だけ</div><div class="tc w">作った人にもほかの人にも<b>見えない</b></div></div>
      <div class="tr"><div class="tc k">${ic.del}消し方</div><div class="tc v">本人がいつでも</div><div class="tc w">チャットで頼むか、<b>メモリのポータル</b>で</div></div>
      <div class="tr"><div class="tc k">${ic.off}オフにすると</div><div class="tc v">使わなくなる</div><div class="tc w">保存済みのメモは<b>すぐには消えない</b></div></div>
      <div class="tr"><div class="tc k">${ic.move}ほかのAIへ</div><div class="tc v">移せない</div><div class="tc w">書き出しも<b>別のAIへの移動</b>もできない</div></div>
      <div class="tr"><div class="tc k">${ic.coin}料金</div><div class="tc v">使った分</div><div class="tc w">動かすと<b>クレジット</b>を使う</div></div>
    </div>
    <div class="right">
      <div class="chat">
        <div class="hd"><img src="${A}icons/cs_logo.png" alt="">営業の数字アシスタント<span class="tm"><img src="${A}icons/ms/teams.svg" alt="" style="width:15px;height:15px">Teams</span></div>
        <div class="uq">私の記憶を見せて</div>
        <div class="a">覚えていることは次の3つです。
          <ul><li>関西エリアの担当</li><li>数字は表で見せる</li><li>金額は税抜で</li></ul>
          消したいものがあれば「○○は忘れて」と伝えてください。<br><span class="lk">メモリのポータルを開く</span></div>
        <div class="uq">税抜の件は忘れて</div>
        <div class="a">「金額は税抜で」を忘れました。</div>
      </div>
      <div class="fact">${F}<span class="t">使っていれば消えない<small>ポータルで見ただけでは期限は延びない</small></span></div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">向いているエージェント</div>
      <div class="grid">
        <div class="fc"><div class="ft">毎日同じ人が使う</div><div class="fd">担当・好みを<br>前提にできる</div></div>
        <div class="fc"><div class="ft">何日も続く仕事</div><div class="fd">見積・案件の<br>進み具合を持ち越す</div></div>
        <div class="fc"><div class="ft">直しが多い</div><div class="fd">一度直したことを<br>次から守ってくれる</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">表示は <b>preview</b>。地域によっては<br>まだプレビューの扱い。</div>
    </div>
    <div class="src">出典：Microsoft Learn（エージェントのメモリの概要／メモリとプライバシーの管理）／チャット画面は説明用の再現</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_guts_g.png" alt="">
`;
</script>
</body>
</html>
