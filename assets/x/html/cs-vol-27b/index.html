<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.27-2 作る順番の4コマ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:12px;}
  .koma{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;padding:9px 12px 10px;position:relative;
    background:#fff;border:2.5px solid #1B2A44;box-shadow:4px 5px 0 rgba(27,42,68,.18);}
  .koma.last{border-color:#16A34A;background:#F7FFFA;}
  .kh{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .kn{flex:0 0 34px;height:34px;border-radius:50%;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7C3AED,#C026D3);box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .koma.last .kn{background:linear-gradient(135deg,#22C55E,#15803D);}
  .kt{font-weight:900;font-size:21px;color:var(--navy);line-height:1.2;}
  .scene{flex:1;min-height:0;}
  .scene svg{width:100%;height:100%;display:block;}
  .cap{flex:0 0 auto;font-weight:700;font-size:15.5px;color:#374151;line-height:1.45;border-top:1.5px dashed #C9B4F4;padding-top:6px;margin-top:4px;}
  .cap b{color:var(--cs-dark);}
  .arrow{position:absolute;right:-19px;top:46%;z-index:4;width:26px;height:26px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const T=(x,y,s,t,c='#1B2A44',w=800,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${s}" font-weight="${w}" fill="${c}" font-family="Segoe UI, Noto Sans JP">${t}</text>`;
const D=`<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".2"/></filter>
 <linearGradient id="ev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EDF3"/></linearGradient>
 <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16A34A"/></marker></defs>`;
const VB='viewBox="0 0 276 262" preserveAspectRatio="xMidYMid meet"';
/* ① 道具と指示 */
const S1=`<svg ${VB}>${D}
  <g filter="url(#sh)"><rect x="2" y="4" width="272" height="120" rx="9" fill="#fff" stroke="#D1D1D1"/></g>
  ${T(14,26,14,'指示','#242424',900,'start')}
  <rect x="12" y="34" width="252" height="82" rx="6" fill="#F9FAFB" stroke="#E1DFDD"/>
  ${T(22,56,13.5,'見積依頼のメールが届いたら、','#1B2A44',700,'start')}
  ${T(22,78,13.5,'差出人・要件・期限・返信案を','#1B2A44',700,'start')}
  ${T(22,100,13.5,'Teams で私に送る。','#5B21B6',900,'start')}
  <g filter="url(#sh)"><rect x="2" y="136" width="272" height="122" rx="9" fill="#fff" stroke="#D1D1D1"/></g>
  ${T(14,158,14,'ツール','#242424',900,'start')}
  <rect x="12" y="168" width="252" height="38" rx="7" fill="#F5F3FF" stroke="#C9B4F4"/>
  <image href="${A}icons/ms/teams.svg" x="20" y="174" width="26" height="26"/>${T(54,193,13.5,'Teams にメッセージを送る','#1B2A44',800,'start')}
  <rect x="12" y="212" width="252" height="38" rx="7" fill="#F5F3FF" stroke="#C9B4F4"/>
  <image href="${A}icons/ms/outlook.svg" x="20" y="218" width="26" height="26"/>${T(54,237,13.5,'メールの中身を読む','#1B2A44',800,'start')}
</svg>`;
/* ② トリガーを選ぶ */
const S2=`<svg ${VB}>${D}
  <g filter="url(#sh)"><rect x="2" y="4" width="272" height="196" rx="9" fill="#fff" stroke="#D1D1D1"/></g>
  <rect x="2" y="4" width="272" height="36" rx="9" fill="#F3F2F1"/><rect x="2" y="30" width="272" height="10" fill="#F3F2F1"/>
  <image href="${A}icons/cs_logo.png" x="12" y="10" width="24" height="24"/>${T(44,28,15,'Triggers','#242424',900,'start')}
  <rect x="12" y="50" width="252" height="40" rx="7" fill="#fff" stroke="#E1DFDD"/>
  <circle cx="32" cy="70" r="11" fill="#EDE9FE"/>${T(32,75,13,'💬','#5B21B6',700)}${T(50,75,14,'Chat with the agent','#6B7280',700,'start')}
  <rect x="12" y="98" width="252" height="44" rx="7" fill="#EFF6FF" stroke="#0F6CBD" stroke-width="2.4"/>
  <image href="${A}icons/ms/outlook.svg" x="20" y="106" width="28" height="28"/>${T(56,126,15,'New email','#0F6CBD',900,'start')}
  <circle cx="244" cy="120" r="10" fill="#16A34A"/><path d="M239 120 l4 4 l7 -8" stroke="#fff" stroke-width="2.4" fill="none"/>
  <rect x="12" y="150" width="252" height="40" rx="7" fill="#fff" stroke="#E1DFDD"/>
  <circle cx="32" cy="170" r="11" fill="#FEF3C7"/>${T(32,175,13,'⏰','#92400E',700)}${T(50,175,14,'Recurrence','#6B7280',700,'start')}
  <g transform="translate(14,210)"><rect width="248" height="46" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
   <circle cx="24" cy="23" r="12" fill="#16A34A"/><path d="M18 23 l4 4 l8 -9" stroke="#fff" stroke-width="2.6" fill="none"/>
   ${T(46,20,13,'Office 365 Outlook','#065F46',900,'start')}${T(46,38,13,'緑のチェック＝接続OK','#065F46',700,'start')}</g>
</svg>`;
/* ③ 試す */
const S3=`<svg ${VB}>${D}
  <g filter="url(#sh)"><rect x="2" y="4" width="272" height="88" rx="9" fill="#fff" stroke="#D1D1D1"/></g>
  <g transform="translate(14,18)"><rect width="40" height="40" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
   <path d="M15 8 h10 M17 8 v10 l-8 15 a2 2 0 0 0 2 3 h18 a2 2 0 0 0 2 -3 l-8 -15 v-10" fill="#fff" stroke="#5B21B6" stroke-width="2.2" stroke-linejoin="round"/>
   <path d="M12 29 h16 l3 5 h-22z" fill="#A78BFA"/></g>
  <rect x="66" y="22" width="196" height="34" rx="8" fill="#7C3AED"/>${T(164,45,15,'Start listening','#fff',900)}
  ${T(66,80,12.5,'エージェントが出来事を待つ','#6B7280',700,'start')}
  <g transform="translate(30,108)" filter="url(#sh)"><rect width="70" height="48" rx="4" fill="url(#ev)" stroke="#C7CDD6" stroke-width="1.4"/>
   <path d="M0 0 L35 26 L70 0" fill="none" stroke="#AEB6C2" stroke-width="2"/><rect x="52" y="6" width="11" height="12" rx="1" fill="#F87171"/></g>
  ${T(65,176,12.5,'自分宛てに','#1B2A44',800)}${T(65,194,12.5,'テストメール','#1B2A44',800)}
  <path d="M112 132 H150" stroke="#16A34A" stroke-width="3" marker-end="url(#ag)"/>
  <g transform="translate(158,104)" filter="url(#sh)"><rect width="112" height="96" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
   <image href="${A}icons/cs_logo.png" x="8" y="8" width="24" height="24"/>${T(38,25,12.5,'反応を確認','#5B21B6',900,'start')}
   <rect x="8" y="40" width="96" height="10" rx="5" fill="#C4B5FD"/><rect x="8" y="58" width="80" height="10" rx="5" fill="#DDD6FE"/><rect x="8" y="76" width="88" height="10" rx="5" fill="#DDD6FE"/></g>
  <g transform="translate(14,212)"><rect width="248" height="44" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
   ${T(124,20,12.5,'前に届いたメールでも試せる','#92400E',900)}${T(124,37,12,'Test with previous trigger events','#92400E',700)}</g>
</svg>`;
/* ④ 発行して有効化 */
const S4=`<svg ${VB}>${D}
  <g filter="url(#sh)"><rect x="2" y="4" width="272" height="150" rx="10" fill="#fff" stroke="#D1D1D1"/></g>
  <circle cx="26" cy="30" r="12" fill="#16A34A"/><path d="M20 30 l4 4 l8 -9" stroke="#fff" stroke-width="2.6" fill="none"/>
  ${T(46,35,14.5,'Your agent is published','#242424',900,'start')}
  <rect x="14" y="52" width="248" height="42" rx="8" fill="#EFF6FF" stroke="#0F6CBD" stroke-width="2.4"/>
  <circle cx="34" cy="73" r="8" fill="#fff" stroke="#0F6CBD" stroke-width="2"/><circle cx="34" cy="73" r="4" fill="#0F6CBD"/>
  ${T(50,70,14,'Activate for myself','#0F6CBD',900,'start')}${T(50,87,11.5,'自分の接続で動かす','#0F6CBD',700,'start')}
  <rect x="14" y="102" width="248" height="42" rx="8" fill="#fff" stroke="#E1DFDD"/>
  <circle cx="34" cy="123" r="8" fill="#fff" stroke="#9CA3AF" stroke-width="2"/>
  ${T(50,120,14,'Share with others','#4B5563',800,'start')}${T(50,137,11.5,'使う人がそれぞれの接続で','#6B7280',700,'start')}
  <path d="M138 160 V178" stroke="#16A34A" stroke-width="3" marker-end="url(#ag)"/>
  <g transform="translate(14,186)" filter="url(#sh)"><rect width="248" height="70" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
   ${T(14,24,13.5,'Agent management','#065F46',900,'start')}
   <image href="${A}icons/cs_logo.png" x="14" y="34" width="26" height="26"/>${T(48,53,13.5,'見積受付エージェント','#1B2A44',800,'start')}
   <rect x="196" y="36" width="42" height="22" rx="11" fill="#16A34A"/><circle cx="227" cy="47" r="8" fill="#fff"/>
   ${T(217,24,12,'オン','#16A34A',900)}</g>
</svg>`;
const AR=`<svg class="arrow" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#fff" stroke="#7C3AED" stroke-width="2"/><path d="M9 7 L17 13 L9 19" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.27</div>
    <div class="part-pill">作る順番 <b>(2/4)</b></div>
    <div class="title-text"><span class="q">トリガーは最後</span>に付ける<br>4コマで見る作る順番</div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/outlook.svg" alt=""><span class="pl">+</span><img src="${A}icons/ms/teams.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_laptop_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">順番</div>
    <div class="txt"><b>指示とツール → トリガー → テスト → 発行と有効化</b>。<br>
      先に「何をするか」を決めておくと、<em>トリガーは届いた中身を渡すだけ</em>で済む。</div>
  </div>

  <div class="body">
    <div class="koma"><div class="kh"><span class="kn">1</span><span class="kt">指示とツールを<br>先に用意する</span></div>
      <div class="scene">${S1}</div>
      <div class="cap"><b>どう扱うか</b>を指示に書き、<br>送り先の Teams をツールに。</div>${AR}</div>
    <div class="koma"><div class="kh"><span class="kn">2</span><span class="kt">トリガーで<br>New email を選ぶ</span></div>
      <div class="scene">${S2}</div>
      <div class="cap">接続に<b>緑のチェック</b>が出れば<br>準備完了。宛先でも絞れる。</div>${AR}</div>
    <div class="koma"><div class="kh"><span class="kn">3</span><span class="kt">自分宛てに<br>送って試す</span></div>
      <div class="scene">${S3}</div>
      <div class="cap">フラスコのボタンで待ち受け、<br><b>反応を見て</b>指示を直す。</div>${AR}</div>
    <div class="koma last"><div class="kh"><span class="kn">4</span><span class="kt">発行して<br>有効化する</span></div>
      <div class="scene">${S4}</div>
      <div class="cap"><b>発行するまで</b>自動では動かない。<br>有効化で自分の代わりに動く。</div></div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">4コマの裏側（公式）</div>
      <div class="grid">
        <div class="fc"><div class="ft">指示を足せる</div><div class="fd">トリガーごとに<br>追加の指示を書ける</div></div>
        <div class="fc"><div class="ft">試し方は2つ</div><div class="fd">待ち受ける／<br>前の出来事で試す</div></div>
        <div class="fc"><div class="ft">変えたら再発行</div><div class="fd">指示・ツール・トリガー<br>どれを変えても</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">画面の表記は<b>英語版 Learn</b> に合わせた。<br>日本語の画面では訳が変わることがある。</div>
    </div>
    <div class="src">出典：Microsoft Learn（エージェントにトリガーを追加する（Microsoft Copilot）（プレビュー））／画面と名前は説明用の再現</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_guts_g.png" alt="">
`;
</script>
</body>
</html>
