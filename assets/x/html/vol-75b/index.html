<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.75-2 よく出るエラー8個の意味と直し方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C; --purple:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.36;padding-right:100px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;gap:14px;min-height:0;}

  .lz{flex:1;display:flex;flex-direction:column;min-height:0;}
  .rz{flex:0 0 322px;display:flex;flex-direction:column;min-height:0;}
  .hd{font-weight:900;font-size:23px;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
  .hd .b{flex:0 0 auto;width:31px;height:31px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;}

  .tbl{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:7px 11px;min-height:0;}
  .ec{background:#F8F9FA;border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:3px;min-height:0;justify-content:center;position:relative;border-left:5px solid var(--blue);}
  .ec .code{font-family:'Roboto Mono',monospace;font-weight:700;font-size:16.5px;line-height:1.15;}
  .ec .mean{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.25;}
  .ec .fix{font-size:14px;font-weight:700;color:var(--gray);line-height:1.35;}
  .ec .fix b{color:var(--green-dark);}
  .ec.auth{border-left-color:var(--red);} .ec.auth .code{color:var(--red-dark);}
  .ec.api{border-left-color:var(--orange);} .ec.api .code{color:#9A3412;}
  .ec.exp{border-left-color:var(--purple);} .ec.exp .code{color:#5B21B6;}
  .ec.tmp{border-left-color:var(--green);} .ec.tmp .code{color:var(--green-dark);}

  .conn{flex:1;background:#fff;border:1px solid #D7DEE8;border-radius:12px;box-shadow:0 6px 15px rgba(0,0,0,.14);overflow:hidden;font-family:'Segoe UI','Noto Sans JP',sans-serif;display:flex;flex-direction:column;min-height:0;}
  .conn-h{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 12px;background:#F3F6FB;border-bottom:1px solid #E3E9F1;}
  .conn-h img{width:20px;height:20px;object-fit:contain;}
  .conn-h span{font-weight:800;font-size:14.5px;color:#243B58;}
  .crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #F0F3F8;}
  .crow:last-child{border-bottom:none;}
  .crow img{width:26px;height:26px;object-fit:contain;flex:0 0 auto;}
  .crow .cn{flex:1;min-width:0;}
  .crow .cnm{display:block;font-weight:800;font-size:14.5px;color:#243B58;line-height:1.2;}
  .crow .cst{display:block;font-size:12.5px;font-weight:700;color:var(--green-dark);margin-top:2px;}
  .crow.bad{background:#FFF5F5;}
  .crow.bad .cst{color:var(--red-dark);}
  .crow .fixlink{flex:0 0 auto;font-size:13px;font-weight:900;color:#fff;background:var(--blue);border-radius:7px;padding:6px 11px;box-shadow:0 2px 5px rgba(37,99,235,.35);}
  .cnote{margin:9px 11px 0;font-size:14px;font-weight:800;color:#1E40AF;background:#EFF6FF;border:1px dashed #93C5FD;border-radius:9px;padding:8px 10px;line-height:1.45;}
  .rmascot{position:absolute;right:6px;bottom:2px;height:92px;z-index:30;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));}

  .warn{flex:0 0 auto;margin:10px 16px 18px;background:#FFF7ED;border:2px solid #FDBA74;border-radius:12px;padding:9px 16px;display:flex;align-items:center;gap:14px;}
  .warn .wt{flex:0 0 auto;font-weight:900;font-size:16px;color:#9A3412;}
  .warn .wl{display:flex;gap:20px;flex-wrap:wrap;font-size:14.5px;font-weight:800;color:#7C2D12;line-height:1.35;}
  .warn code{font-family:'Roboto Mono',monospace;background:#fff;border:1px solid #FDBA74;border-radius:5px;padding:1px 6px;}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgBulb='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>';

const ERR=[
 ['auth','Unauthorized (401)','認証が切れている','接続を<b>修正して入り直す</b>→再送信'],
 ['auth','Forbidden (403)','権限が足りない／DLPで止められた','対象への権限と<b>データポリシー</b>を確認'],
 ['api','BadRequest (400)','送った中身が受け付けられない','履歴の<b>「入力」</b>で型・必須・文字数を確認'],
 ['api','NotFound (404)','対象が見つからない','<b>リスト名やIDが変わっていないか</b>確認'],
 ['exp','InvalidTemplate','式の書き方が壊れている','カッコと引用符、<b>Get_item</b>（空白は_）'],
 ['exp','ExpressionEvaluationFailed','動いてみたら値が想定と違った','<b>coalesce()</b>やempty()で空の時の逃げ道を'],
 ['tmp','ActionTimedOut','時間内に終わらなかった','設定で<b>タイムアウトを延ばす</b>（例 PT5M）'],
 ['tmp','500 / 502','向こう側の一時的な不調','<b>そのまま再送信</b>でたいてい通る']
];

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.75-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">エラーの名前で、原因はほぼ分かる｜<span class="hl">よく出る8個の早見表</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgBulb}</div>
    <div class="txt">英語のメッセージを全部読まなくて大丈夫。<b>先頭の名前と番号</b>を見れば、どこを直せばいいかが決まります。</div>
  </div>

  <div class="stage">
    <div class="lz">
      <div class="hd"><span class="b">1</span>この名前が出たら、ここを直す</div>
      <div class="tbl">
        ${ERR.map(([c,code,mean,fix])=>`
          <div class="ec ${c}">
            <div class="code">${code}</div>
            <div class="mean">${mean}</div>
            <div class="fix">${fix}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="rz">
      <div class="hd"><span class="b">2</span>401・403の直し方</div>
      <div class="conn">
        <div class="conn-h"><img src="${A}icons/pa_logo.png" alt=""><span>接続</span></div>
        <div class="crow bad">
          <img src="${A}icons/pa_sharepoint.png" alt="">
          <span class="cn"><span class="cnm">SharePoint</span><span class="cst">⚠ 接続されていません</span></span>
          <span class="fixlink">接続の修正</span>
        </div>
        <div class="crow">
          <img src="${A}icons/pa_outlook.png" alt="">
          <span class="cn"><span class="cnm">Office 365 Outlook</span><span class="cst">✓ 接続済み</span></span>
        </div>
        <div class="crow">
          <img src="${A}icons/pa_excel.png" alt="">
          <span class="cn"><span class="cnm">Excel Online (Business)</span><span class="cst">✓ 接続済み</span></span>
        </div>
        <div class="cnote">パスワードを変えた・久しぶりに動かした、で切れます。<b>入り直して再送信</b>すれば、たいていそのまま通ります。</div>
        <img class="rmascot" src="${A}chara/chara_guts.png" alt="">
      </div>
    </div>
  </div>

  <div class="warn">
    <span class="wt">⚠ 使う前に確認</span>
    <span class="wl">
      <span>式でアクションを指すときは <code>outputs('Get_item')</code>（<b>空白はアンダースコア</b>）</span>
      <span>フロー実行の上限は <b>30日</b></span>
    </span>
  </div>
  <div class="src">出典：Microsoft Learn（クラウド フロー エラー コード リファレンス／クラウド フローのトラブルシューティング）／画面は再現</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
