<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips HTMLテンプレ（Layout B＝横フロー主役）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== Layout B：横並び大ステップが主役・下に3カード（月水金ローテの「水」） ===== */
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-bg2:#DBEAFE; --blue-dark:#1E40AF;
    --enji:#A4283C; --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --orange:#EA580C; --orange-bg:#FFF7ED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --faint:#9CA3AF;
    --card:#F8F9FA; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}

  /* タイトルバー（Aと共通＝ブランド固定） */
  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:18px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;}
  .title-text{color:#fff;font-weight:900;font-size:35px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:160px;}
  .title-chara{position:absolute;right:12px;bottom:-56px;height:154px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  /* 結論バー（共通） */
  .concl{margin:8px 18px 0;background:var(--green-bg);border:2px solid var(--green);border-radius:12px;display:flex;align-items:center;gap:14px;padding:9px 20px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{background:linear-gradient(180deg,#2BD06A,#16A34A);color:#fff;font-weight:900;font-size:22px;border-radius:9px;padding:8px 18px;white-space:nowrap;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:700;font-size:21px;color:var(--green-dark);line-height:1.35;}

  /* ★ Layout B 主役：横並び大ステップ */
  .hero{flex:0 0 auto;margin:8px 18px 0;}
  .hero .label{font-weight:900;font-size:18px;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:9px;}
  .hero .label::before{content:"";width:7px;height:22px;border-radius:4px;background:linear-gradient(180deg,#4A85FF,#2563EB);display:inline-block;}
  .hflow{display:flex;align-items:stretch;gap:10px;}
  .hstep{flex:1;background:linear-gradient(180deg,#FFFFFF,#EEF1F6);border:2px solid #C2C9D2;border-radius:16px;padding:11px 10px 11px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.95);position:relative;}
  .hstep .num{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#4A85FF,#2563EB);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .hstep .hicon{width:54px;height:54px;border-radius:14px;background:var(--blue-bg);box-shadow:inset 0 0 0 1px rgba(37,99,235,.18),0 2px 4px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;margin:4px 0 7px;font-size:28px;overflow:hidden;}
  .hstep .hicon img{width:38px;height:38px;object-fit:contain;}
  .hstep .hname{font-weight:900;font-size:18.5px;color:var(--ink);line-height:1.2;}
  .hstep .hsub{font-weight:600;font-size:12.5px;color:var(--weak);margin-top:4px;line-height:1.3;}
  .harrow{display:flex;align-items:center;color:var(--blue);font-weight:900;font-size:34px;}

  /* 下段3カード */
  .brow{flex:1 1 auto;display:flex;gap:14px;padding:10px 18px 0;min-height:0;}
  .bcard{flex:1;background:var(--card);border-radius:12px;padding:12px 15px;display:flex;flex-direction:column;min-height:0;box-shadow:0 6px 15px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.75);}
  .bcard.blue{border:2px solid var(--blue);} .bcard.orange{border:2px solid var(--orange);} .bcard.green{border:2px solid var(--green);}
  .bhead{align-self:stretch;text-align:center;color:#fff;font-weight:900;font-size:21px;border-radius:9px;padding:8px 12px;margin-bottom:11px;box-shadow:0 4px 7px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 4px rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.22);}
  .b-blue{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 48%),linear-gradient(180deg,#4A85FF,#2563EB);}
  .b-orange{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 48%),linear-gradient(180deg,#FB8534,#EA580C);}
  .b-green{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 48%),linear-gradient(180deg,#2BD06A,#16A34A);}
  .blist{display:flex;flex-direction:column;justify-content:space-evenly;flex:1;gap:6px;}
  .blist li{list-style:none;display:flex;gap:10px;align-items:center;font-weight:700;font-size:20px;color:var(--gray);line-height:1.45;}
  .blist li .ck{flex:0 0 auto;width:27px;height:27px;}
  .blist li.dot::before{content:"▸";color:var(--orange);font-weight:900;flex:0 0 auto;font-size:21px;}
  .bcard.green .blist li.dot::before{color:var(--green);}
  /* 項目数が少ない箱は字を大きくして空白を埋める（各箱で字サイズ可変） */
  .bcard.green .blist li{font-size:22px;}
  /* 右下キャラと重ならないよう、メリット本文だけ右に余白 */
  .bcard.green .blist{padding-right:96px;}
  .botchara{position:absolute;right:6px;bottom:0;height:118px;z-index:50;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45));}
  /* ★ 全パターン共通：最下段「つまずき注意＋設定方法」帯（濃いグレー・横一行） */
  .pitfall{flex:0 0 auto;margin:9px 0 0;background:linear-gradient(180deg,#5C636D,#4E545E);color:#fff;padding:11px 140px 11px 20px;display:flex;align-items:center;gap:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
  .pitfall .pleft{flex:0 0 auto;display:flex;flex-direction:column;gap:9px;align-items:flex-start;max-width:225px;}
  .pitfall .ptag{background:linear-gradient(180deg,#F59E0B,#D97706);color:#fff;font-weight:900;font-size:16px;border-radius:8px;padding:6px 13px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3);}
  /* ポップな吹き出し（UIスクショへ右向きに指す） */
  .pitfall .pspeech{position:relative;background:linear-gradient(180deg,#FFFFFF,#FFF4D6);color:#1F2937;font-weight:900;font-size:19px;line-height:1.35;border:2.5px solid #F59E0B;border-radius:16px;padding:10px 15px;box-shadow:0 4px 8px rgba(0,0,0,.32);}
  .pitfall .pspeech .hl{color:#D97706;}
  .pitfall .pspeech::after{content:"";position:absolute;right:-15px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-left-color:#F59E0B;}
  .pitfall .pspeech::before{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-left-color:#FFF4D6;z-index:1;}
  /* ★ アクション設定UIをHTMLで忠実再現（スクショの代わり・くっきり） */
  .pui{position:relative;flex:0 0 470px;}
  .pui img{width:100%;display:block;border-radius:8px;background:#fff;padding:7px 8px;box-shadow:0 3px 7px rgba(0,0,0,.35);}
  .uimock-cond{background:#fff;border-radius:8px;padding:8px 12px 9px;box-shadow:0 3px 7px rgba(0,0,0,.35);font-family:'Segoe UI','Noto Sans JP',sans-serif;color:#323130;}
  .uimock-cond .ql{font-size:12.5px;font-weight:600;color:#323130;}
  .uimock-cond .ql .rq{color:#D13438;}
  .uimock-cond .qs{font-size:11px;color:#605E5C;margin:1px 0 6px;}
  .uimock-cond .andbox{display:inline-flex;align-items:center;gap:16px;border:1px solid #D1D1D1;border-radius:4px;padding:3px 8px;font-size:12px;color:#323130;margin-bottom:7px;}
  .uimock-cond .cv{color:#8A8886;font-size:9px;}
  .uimock-cond .condrow{display:flex;align-items:center;gap:7px;}
  .uimock-cond .fld{position:relative;border:1px solid #D1D1D1;border-radius:4px;padding:5px 9px;font-size:12px;background:#fff;}
  .uimock-cond .fld.val{flex:1;min-width:0;color:#A19F9D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .uimock-cond .fld.op{flex:0 0 auto;display:flex;align-items:center;gap:14px;color:#323130;}
  .uimock-cond .dots{color:#605E5C;font-weight:700;flex:0 0 auto;font-size:14px;}
  .uimock-cond .fbadge{position:absolute;top:-10px;left:-9px;width:21px;height:21px;border-radius:50%;background:linear-gradient(180deg,#F59E0B,#D97706);color:#fff;font-weight:900;font-size:12.5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4);font-family:'Noto Sans JP',sans-serif;}
  .uimock-cond .addrow{margin-top:7px;display:inline-flex;align-items:center;gap:7px;border:1px solid #D1D1D1;border-radius:4px;padding:4px 9px;font-size:12px;color:#323130;}
  /* 凡例（どこに何を入れるか） */
  .plegend{flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px;}
  .plegend .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18.5px;color:#fff;line-height:1.25;}
  .plegend .lg .ln{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#F59E0B,#D97706);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .plegend .lg .lv{color:#FCD34D;font-weight:900;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
/* ★ config差し替え式（Layout A とフィールド共通：vol/title/titleChara/conclusion/leftHead/left/steps/useHead/use/meritHead/merit/memoChara） */
const A = "../../pptx/_assets/";
const SLIDE = {
  vol: "Vol.34",
  title: "見落としゼロ！共有フォルダに資料が届いたら<br>自動でメール通知",
  titleChara: A+"chara/chara_laptop.png",
  conclusion: "共有フォルダにファイルが追加されたら、担当者へ自動でメール。<br>「あの資料もう入ってた？」と確認しに行く手間がなくなります。",
  flowLabel: "作り方はこの3ステップ",
  steps: [
    { name:"ファイルが作成されたとき", sub:"トリガー：SharePoint（フォルダ監視）", img:A+"icons/pa_sharepoint.png" },
    { name:"条件", sub:"コントロール（対象フォルダか判定）", img:A+"icons/pa_control.png" },
    { name:"メールの送信 (V2)", sub:"Office 365 Outlook（担当者に通知）", img:A+"icons/pa_outlook.png" },
  ],
  leftHead: "こんな時に効く！",
  left: [
    "フォルダ更新に気づくのが遅い",
    "「アップしました」連絡が漏れる",
    "何度も見に行くのが手間",
  ],
  useHead: "実務でこう使う",
  use: [
    "提出物が届いたら担当へ共有",
    "資料更新をメンバーに連絡",
    "納品ファイルの受領通知",
  ],
  meritHead: "メリット",
  merit: [
    "確認の手間がゼロに",
    "共有漏れ・遅れが減る",
  ],
  // ★つまずき注意＋設定方法（最下段・実UI画像＋番号バッジ＋凡例）
  pitfall: {
    title: "「条件」はこう入れる",
    speech: '実際の画面では<br><span class="hl">こう入れる！</span>',
    mock: "condition",
    legend: [
      { n:1, label:"左の枠", val:"フォルダーのパス" },
      { n:2, label:"演算子", val:"次の値を含む" },
      { n:3, label:"右の枠", val:"/共有/見積書" },
    ],
  },
  memoChara: A+"chara/chara_guts.png",
};

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const checkIcon=A+"icons/icon_check_blue.png";
function render(d){
  const s=document.getElementById("slide");
  // タイトル
  const tb=el("div","titlebar");
  tb.appendChild(el("div","vol-pill",d.vol));
  tb.appendChild(el("div","title-text",d.title));
  if(d.titleChara){const c=el("img","title-chara");c.src=d.titleChara;tb.appendChild(c);}
  s.appendChild(tb);
  // 結論
  const cc=el("div","concl");cc.appendChild(el("div","chip","結論"));cc.appendChild(el("div","txt",d.conclusion));s.appendChild(cc);
  // 横フロー
  const hero=el("div","hero");
  hero.appendChild(el("div","label",d.flowLabel||"作り方はこの3ステップ"));
  const hf=el("div","hflow");
  d.steps.forEach((st,i)=>{
    const c=el("div","hstep");
    c.appendChild(el("div","num",String(i+1)));
    const ic=el("div","hicon");
    if(st.img){const im=el("img");im.src=st.img;ic.appendChild(im);}else{ic.textContent=st.emoji||"●";}
    c.appendChild(ic);
    c.appendChild(el("div","hname",st.name));
    if(st.sub)c.appendChild(el("div","hsub",st.sub));
    hf.appendChild(c);
    if(i<d.steps.length-1)hf.appendChild(el("div","harrow","▶"));
  });
  hero.appendChild(hf);s.appendChild(hero);
  // 下段3カード
  const br=el("div","brow");
  const mk=(cls,head,headcls,items,dot)=>{
    const card=el("div","bcard "+cls);
    card.appendChild(el("div","bhead "+headcls,head));
    const ul=el("ul","blist");
    items.forEach(t=>{
      const li=el("li",dot?"dot":"");
      if(!dot){const ck=el("img","ck");ck.src=checkIcon;li.appendChild(ck);}
      li.appendChild(el("span","",t));ul.appendChild(li);
    });
    card.appendChild(ul);return card;
  };
  br.appendChild(mk("blue",d.leftHead,"b-blue",d.left,false));
  br.appendChild(mk("orange",d.useHead,"b-orange",d.use,true));
  br.appendChild(mk("green",d.meritHead,"b-green",d.merit,true));
  s.appendChild(br);
  // つまずき注意＋設定方法（最下段・横一行）
  if(d.pitfall){
    const pf=el("div","pitfall");
    const pl=el("div","pleft");
    pl.appendChild(el("div","ptag","⚠ つまずき注意"));
    pl.appendChild(el("div","pspeech",d.pitfall.speech||d.pitfall.title));
    pf.appendChild(pl);
    // 設定UI（HTML忠実再現 or 画像）
    const pu=el("div","pui");
    if(d.pitfall.mock==="condition"){
      pu.innerHTML=`<div class="uimock-cond">
        <div class="ql">Condition expression <span class="rq">*</span></div>
        <div class="qs">比較する値を指定し、使用する演算子を選択します。</div>
        <div class="andbox">かつ <span class="cv">▼</span></div>
        <div class="condrow">
          <div class="fld val"><span class="fbadge">1</span>値を選択します</div>
          <div class="fld op"><span class="fbadge">2</span>等しい <span class="cv">▼</span></div>
          <div class="fld val"><span class="fbadge">3</span>値を選択します</div>
          <span class="dots">⋯</span>
        </div>
        <div class="addrow">＋ 行を追加する <span class="cv">▼</span></div>
      </div>`;
    } else if(d.pitfall.img){ const im=el("img");im.src=d.pitfall.img;pu.appendChild(im); }
    pf.appendChild(pu);
    // 凡例
    const lg=el("div","plegend");
    (d.pitfall.legend||[]).forEach(L=>{const r=el("div","lg");r.appendChild(el("span","ln",String(L.n)));r.appendChild(el("span","",L.label+"＝"));r.appendChild(el("span","lv",L.val));lg.appendChild(r);});
    pf.appendChild(lg);
    s.appendChild(pf);
  }
  if(d.memoChara){const mc=el("img","botchara");mc.src=d.memoChara;s.appendChild(mc);}
}
render(SLIDE);
</script>
</body>
</html>
