<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.47-1 メール重複チェックがすり抜ける問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --red:#DC2626; --red-dark:#7F1D1D;
    --green:#16A34A; --green-dark:#064E3B;
    --orange:#EA580C; --amber:#D97706; --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 22px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:24px;border-radius:999px;padding:6px 18px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:26px;line-height:1.16;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:13px;bottom:-42px;height:140px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:8px 15px 0;background:var(--blue-bg);border:2px solid var(--blue);border-radius:11px;display:flex;align-items:center;gap:11px;padding:8px 15px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:700;font-size:17px;color:var(--blue-dark);line-height:1.34;padding-right:88px;}
  .concl .txt b{color:var(--red-dark);}

  .body{flex:1 1 auto;margin:9px 15px 0;display:flex;gap:13px;min-height:0;}

  /* 左：W≠w 比較ビジュアル */
  .left{flex:0 0 486px;display:flex;flex-direction:column;}
  .panelttl{display:flex;align-items:center;gap:7px;font-weight:900;font-size:17px;color:var(--ink);margin-bottom:8px;}
  .panelttl .pi{width:23px;height:23px;color:var(--red);}
  .cmp{flex:1;display:flex;flex-direction:column;gap:8px;}
  .mailrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #D7DEE9;border-radius:11px;padding:9px 13px;box-shadow:0 4px 10px rgba(0,0,0,.09);}
  .mailrow .av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .mailrow .av svg{width:25px;height:25px;}
  .mailrow .mm{flex:1;min-width:0;}
  .mailrow .lab{font-size:13px;font-weight:800;color:var(--weak);margin-bottom:3px;}
  .mailrow .adr{font-family:'Consolas','Courier New',monospace;font-size:19px;font-weight:800;color:#1F2937;letter-spacing:.2px;}
  .mailrow .adr .up{color:#DC2626;background:#FEE2E2;border-radius:4px;padding:0 2px;}
  .mailrow .adr .lo{color:#2563EB;background:#DBEAFE;border-radius:4px;padding:0 2px;}

  .verdict{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#FFF5F5,#FCE8E8);border:2px solid #F1A8A8;border-radius:12px;padding:6px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  .verdict .neq{font-family:'Consolas',monospace;font-weight:900;font-size:42px;color:#B91C1C;line-height:1;}
  .verdict .neq small{font-size:22px;color:#9CA3AF;}
  .verdict .vt{font-weight:900;font-size:17px;color:#8A2020;line-height:1.3;}
  .verdict .vt b{color:#DC2626;}

  .flt{background:#fff;border:1.5px solid #D7DEE9;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.09);}
  .flt .fh{display:flex;align-items:center;gap:8px;padding:7px 11px;background:linear-gradient(180deg,#F6F8FC,#ECF1F8);border-bottom:1px solid #E1E7F0;}
  .flt .fh .fi{flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:linear-gradient(180deg,#60A5FA,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;}
  .flt .fh .fi svg{width:15px;height:15px;}
  .flt .fh .ft{font-weight:900;font-size:14.5px;color:var(--ink);} .flt .fh .ft small{font-weight:700;color:var(--weak);font-size:11.5px;}
  .flt .cond{display:flex;align-items:stretch;gap:6px;padding:9px 11px;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .flt .cell{flex:1;border:1px solid #D1D1D1;border-radius:5px;background:#fff;padding:7px 8px;font-size:13.5px;color:#242424;font-weight:700;display:flex;align-items:center;}
  .flt .op{flex:0 0 auto;background:#EEF2FF;border-color:#C7D2FE;color:#3730A3;font-weight:800;}
  .flt .res{display:flex;align-items:center;gap:8px;padding:7px 11px;background:#FEF2F2;border-top:1px solid #F3D2D2;}
  .flt .res svg{flex:0 0 auto;width:19px;height:19px;color:var(--red);}
  .flt .res span{font-weight:800;font-size:14px;color:#8A2020;}
  .flt .res b{color:var(--red);}

  /* 右：原因 */
  .right{flex:1;display:flex;flex-direction:column;}
  .causes{flex:1;display:flex;flex-direction:column;gap:9px;}
  .cause{flex:1;background:linear-gradient(180deg,#FFF8F1,#FDEEDD);border:1.5px solid #F6C99A;border-radius:11px;padding:9px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .cause .cn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#FB923C,#EA580C);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .cause .cx{font-weight:800;font-size:19.5px;color:#7C3A12;line-height:1.34;}
  .cause .cx b{color:var(--red);}
  .cause .cx code{font-family:'Consolas',monospace;background:#fff;border:1px solid #E6CBA8;border-radius:4px;padding:0 5px;color:#92400E;}

  .next{flex:0 0 auto;margin:9px 15px 12px;background:linear-gradient(180deg,#EAF7EE,#D7F0E0);border:2px solid var(--green);border-radius:11px;padding:11px 16px;display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;color:var(--green-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:24px;height:24px;color:var(--green);}
  .next b{color:var(--green-dark);}
  .next code{font-family:'Consolas',monospace;background:#fff;border:1px solid #A7D9BA;border-radius:5px;padding:1px 6px;color:#0B5E37;font-size:17px;}
  .src{position:absolute;left:16px;bottom:3px;font-size:9.5px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 filter:'<polygon points="22 4 2 4 10 12.5 10 19 14 21 14 12.5 22 4"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const svgF=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.47-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">重複チェックしたのに<br><span class="hl">同じ人がまた登録される</span>問題</div>
    <img class="title-chara" src="${A}chara/chara_trouble.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">メール（メールID）で重複判定したのに、<b>同じ人がもう一度登録されてしまう</b>…。犯人は大文字・小文字。フローは <b>W と w を別物</b>として扱うんです。</div>
  </div>

  <div class="body">
    <div class="left">
      <div class="panelttl"><span class="pi">${svg('warn')}</span>同じ人なのに「別人」と判定される</div>
      <div class="cmp">
        <div class="mailrow">
          <div class="av" style="background:linear-gradient(180deg,#94A3B8,#64748B)">${svg('user')}</div>
          <div class="mm">
            <div class="lab">登録済みリストのメール</div>
            <div class="adr"><span class="up">W</span>atanabe.taro@example.co.jp</div>
          </div>
        </div>
        <div class="mailrow">
          <div class="av" style="background:linear-gradient(180deg,#60A5FA,#2563EB)">${svg('user')}</div>
          <div class="mm">
            <div class="lab">新しい申請のメール</div>
            <div class="adr"><span class="lo">w</span>atanabe.taro@example.co.jp</div>
          </div>
        </div>
        <div class="verdict">
          <div class="neq">W <small>≠</small> w</div>
          <div class="vt">先頭の1文字が違うだけで<br><b>「別のメール」</b>と判定される</div>
        </div>
        <div class="flt">
          <div class="fh"><span class="fi">${svgF('filter')}</span><span class="ft">配列のフィルター<small>　既に同じメールがある？</small></span></div>
          <div class="cond">
            <span class="cell">メール</span>
            <span class="cell op">次の値に等しい</span>
            <span class="cell">新しいメール</span>
          </div>
          <div class="res">${svg('x')}<span>一致 <b>0件</b> ＝「いない」と判定 → そのまま<b>二重登録</b></span></div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="panelttl"><span class="pi" style="color:var(--orange)">${svg('warn')}</span>なぜすり抜ける？ 4つの理由</div>
      <div class="causes">
        <div class="cause"><span class="cn">1</span><span class="cx">メールアドレスは本来<b>大文字小文字を区別しない</b>＝同じ人</span></div>
        <div class="cause"><span class="cn">2</span><span class="cx">でもフローの「等しい」は<b>区別する</b>（<code>W</code>≠<code>w</code>）</span></div>
        <div class="cause"><span class="cn">3</span><span class="cx">だから配列のフィルターが<b>重複を見逃す</b></span></div>
        <div class="cause"><span class="cn">4</span><span class="cx">手入力・コピペ・自動補完で<b>ケースは普通にバラつく</b></span></div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>直し方はカンタン。比較の前に<code>toLower()</code>で揃えるだけ → <b>2枚目で解説！</b></div>
  <div class="src">出典：Microsoft Learn（式関数 toLower / 配列のフィルター）</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
