<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.90-1 フィルタークエリ早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --spo:#0F6CBD; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:18.5px;color:var(--blue-dark);line-height:1.3;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:13px;min-height:0;}

  /* 左：クエリ8連 */
  .qs{flex:1.5;display:flex;flex-direction:column;gap:7px;min-height:0;}
  .q{flex:1;display:flex;align-items:center;gap:12px;background:#F8F9FA;border:1.5px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:7px 13px;min-height:0;}
  .q .lbl{flex:0 0 190px;font-size:16.5px;font-weight:900;color:var(--ink);line-height:1.2;}
  .q .val{flex:1;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:#0B3A8F;line-height:1.3;word-break:break-all;}
  .q.d{border-left-color:var(--orange);} .q.d .val{color:#9A3412;}
  .q.s{border-left-color:var(--violet);} .q.s .val{color:#5B21B6;}
  .q.o{border-left-color:var(--green);} .q.o .val{color:var(--green-dark);}

  /* 右：設定モック＋効果 */
  .side{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0;}
  .mock{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;border:2px solid #9EC3EE;border-radius:13px;box-shadow:0 5px 13px rgba(15,108,189,.14);overflow:hidden;}
  .mh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 13px;background:linear-gradient(180deg,#EAF2FB,#DCEAF7);border-bottom:1px solid #C9DAEC;}
  .mh img{width:24px;height:24px;object-fit:contain;}
  .mh span{font-weight:900;font-size:16px;color:#0A4F8A;}
  .mb{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:0;justify-content:center;}
  .fld{background:#fff;border:1.5px solid #D7DEE9;border-radius:8px;overflow:hidden;}
  .fld .fl{font-size:12.5px;font-weight:800;color:#64748B;background:#F8FAFC;padding:3px 9px;border-bottom:1px solid #EBEFF5;}
  .fld .fi{font-size:15px;font-weight:800;color:#243B58;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .fld .fi .cr{color:#8A93A2;font-size:12px;}
  .fld.hot{border:2.5px solid var(--spo);}
  .fld.hot .fi{font-family:'Roboto Mono',monospace;font-size:14px;color:#0B3A8F;line-height:1.35;word-break:break-all;}
  /* 効果 */
  .effect{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#ECFDF5;border:2px solid #7EDCAD;border-radius:12px;padding:10px 13px;}
  .effect .from{font-size:26px;font-weight:900;color:var(--red);}
  .effect .to{font-size:34px;font-weight:900;color:var(--green);}
  .effect .ar{width:26px;height:22px;color:var(--green);}
  .effect .cap{font-size:14px;font-weight:900;color:var(--green-dark);line-height:1.3;margin-left:auto;text-align:right;}
  .ops{flex:0 0 auto;background:#F8F9FA;border:1.5px solid var(--line);border-radius:11px;padding:8px 11px;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;}
  .ops .oh{flex:0 0 auto;font-weight:900;font-size:13.5px;color:var(--ink);}
  .op{display:flex;align-items:baseline;gap:4px;font-size:13px;font-weight:800;color:var(--gray);}
  .op code{font-family:'Roboto Mono',monospace;font-size:13.5px;font-weight:700;color:var(--blue-dark);background:#EFF6FF;border-radius:5px;padding:1px 6px;}

  .next{flex:0 0 auto;margin:9px 16px 13px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:25px;height:25px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const Q=[
 ['','完了以外を取る',"Status ne '完了'"],
 ['','2つとも満たす',"Status eq '未完了' and Priority eq '高'"],
 ['','どちらかを満たす',"Status eq '申請中' or Status eq '差戻し'"],
 ['s','「見積」で始まる',"startswith(Title,'見積')"],
 ['s','「見積」を含む',"substringof('見積',Title)"],
 ['d','今日以降のもの',"Due_x0020_Date ge '@{utcNow()}'"],
 ['d','7日以内のもの',"Due_x0020_Date le '@{addDays(utcNow(),7)}'"],
 ['o','期限が近い順に並べ替え',"$orderby → Due_x0020_Date asc"]
];

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.90-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">SharePointは“絞ってから”取る｜<span class="hl">フィルタークエリ早見表【保存版】</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">「複数の項目の取得」は<b>既定100件</b>しか返しません。ループで選り分けるより<b>フィルタークエリで先に絞る</b>——この8個をコピペでOK。</div>
  </div>

  <div class="stage">
    <div class="qs">
      ${Q.map(([c,l,v])=>`<div class="q ${c}"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}
    </div>

    <div class="side">
      <div class="mock">
        <div class="mh"><img src="${A}icons/pa_sharepoint.png" alt=""><span>複数の項目の取得 － 詳細設定</span></div>
        <div class="mb">
          <div class="fld"><div class="fl">サイトのアドレス／リスト名</div><div class="fi">営業部サイト ／ 案件管理<span class="cr">▾</span></div></div>
          <div class="fld hot"><div class="fl">フィルター クエリ ← ここに貼る</div><div class="fi">Status eq '未完了' and Due_x0020_Date le '@{addDays(utcNow(),7)}'</div></div>
          <div class="fld"><div class="fl">上位カウント</div><div class="fi">100</div></div>
        </div>
      </div>
      <div class="effect"><span class="from">100件</span><span class="ar">${svg('arrow')}</span><span class="to">12件</span><span class="cap">必要な分だけ返る＝<br>速い・実行回数も節約</span></div>
      <div class="ops"><span class="oh">演算子：</span><span class="op"><code>eq</code>＝</span><span class="op"><code>ne</code>≠</span><span class="op"><code>gt</code>＞</span><span class="op"><code>ge</code>≧</span><span class="op"><code>lt</code>＜</span><span class="op"><code>le</code>≦</span><span class="op"><code>and</code> / <code>or</code></span></div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>列名の<b>「内部名」の調べ方</b>と<b>5000件の壁</b>の越え方は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（アイテムの取得とファイルの取得アクションの詳細な分析）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
