<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.125-1 安否確認を一斉に送り、未回答の人だけ自動で追いかける</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型D：会話スレッド（社員のスマホ ← 一斉通知 → 総務チャネルに進み具合）*/
  .stage{gap:10px;}
  .left{flex:0 0 340px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .old{flex:0 0 150px;position:relative;border-radius:12px;overflow:hidden;border:2.5px solid var(--red-line);background:var(--red-bg);}
  .old svg{position:absolute;inset:0;width:100%;height:100%;}
  .old .tg{position:absolute;left:8px;top:6px;z-index:3;font-size:16px;font-weight:900;color:#fff;background:#DC2626;border-radius:7px;padding:2px 9px;}
  .old .ch{position:absolute;right:2px;bottom:-2px;height:118px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}

  /* スマホ */
  .phone{flex:1;min-height:0;align-self:center;width:300px;background:#111827;border-radius:26px;padding:9px 9px 12px;display:flex;flex-direction:column;
    box-shadow:0 8px 18px rgba(0,0,0,.28);}
  .scr{flex:1;min-height:0;background:#F5F5FB;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;}
  .scr .top{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#5B5FC7;color:#fff;font-size:15px;font-weight:900;}
  .scr .top img{width:22px;height:22px;background:#fff;border-radius:5px;padding:2px;}
  .scr .top .tm{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:13.5px;}
  .pm{flex:1;min-height:0;margin:7px;background:#fff;border:1.5px solid #D9DAF3;border-left:6px solid #DC2626;border-radius:9px;padding:7px 10px;
    display:flex;flex-direction:column;gap:5px;}
  .pm .nm{font-size:13.5px;font-weight:900;color:#64748B;}
  .pm .t{font-size:17px;font-weight:900;color:#B91C1C;line-height:1.3;}
  .pm .k{font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.38;}
  .pm .btn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;background:#5B5FC7;color:#fff;border-radius:8px;padding:7px;
    font-size:16px;font-weight:900;}
  .pm .btn img{width:22px;height:22px;background:#fff;border-radius:4px;padding:1px;}
  .pm .opts{display:flex;gap:5px;}
  .pm .opts span{flex:1;text-align:center;font-size:14px;font-weight:900;border-radius:6px;padding:3px 0;border:1.5px solid #CBD5E1;color:#334155;background:#F8FAFC;}

  /* 中央エンジン */
  .eng{flex:0 0 164px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;}
  .eng .lg{width:64px;height:64px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 10px rgba(30,58,138,.25);}
  .eng .st{width:100%;display:flex;flex-direction:column;gap:5px;}
  .eng .st span{display:flex;align-items:center;gap:5px;background:#EFF6FF;border:1.8px solid #A9C6F5;border-radius:8px;padding:4px 6px;
    font-size:15px;font-weight:900;color:var(--blue-dark);line-height:1.25;}
  .eng .st b{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:13.5px;display:flex;align-items:center;justify-content:center;}

  /* 右：総務チャネルのスレッド */
  .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .thread{flex:1;min-height:0;background:#fff;border:2.5px solid #C5C7F0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .thread .th{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 11px;background:#5B5FC7;color:#fff;font-size:16px;font-weight:900;}
  .thread .th img{width:24px;height:24px;background:#fff;border-radius:5px;padding:2px;}
  .tb{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px 10px;background:#F5F5FB;}
  .msg{flex:1;min-height:0;}
  .msg .bub{display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .msg .tx{white-space:nowrap;}
  .bar{position:relative;height:16px;background:#E5E7EB;border-radius:999px;overflow:hidden;}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#34D399,#059669);}
  .tx .n{font-family:'Roboto Mono',monospace;font-weight:700;}
  .tx .who{display:inline-block;font-size:14px;font-weight:900;color:#B91C1C;background:#FEE2E2;border-radius:5px;padding:0 6px;margin-left:3px;}
  .tx .ok{color:#047857;font-weight:900;}
  .msg.done .bub{background:#ECFDF5;border:1.8px solid #6EE7B7;}
  .bot{flex:0 0 auto;display:flex;gap:8px;}
  .bot .uses{flex:1;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:4px 9px;}
  .chara-r{position:absolute;right:20px;bottom:116px;height:116px;z-index:6;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};

/* これまで：連絡網を上から電話 */
const PH=(x,y)=>`<g transform="translate(${x},${y})" filter="url(#of)"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.6"/>
  <path d="M-9 -3 q9 -9 18 0" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="-8" y="2" width="16" height="6" rx="2" fill="#CBD5E1"/></g>`;
const sOld=`<svg viewBox="0 0 335 145" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="of" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#5B1A1A" flood-opacity=".25"/></filter></defs>
  <rect width="347" height="145" fill="#FDE8E8"/>
  <path d="M74 50 L 38 88 M74 50 L 110 88 M38 88 L 20 126 M38 88 L 58 126 M110 88 L 92 126 M110 88 L 130 126" stroke="#F87171" stroke-width="2.6" stroke-dasharray="5 4"/>
  ${[[74,50],[38,88],[110,88],[20,126],[58,126],[92,126],[130,126]].map(([x,y])=>PH(x,y)).join('')}
  <g filter="url(#of)"><rect x="152" y="52" width="104" height="26" rx="13" fill="#fff" stroke="#DC2626" stroke-width="2"/>
  <text x="204" y="70" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#B91C1C" text-anchor="middle">つながらない…</text></g>
  <g filter="url(#of)"><rect x="158" y="92" width="92" height="26" rx="13" fill="#DC2626"/>
  <text x="204" y="110" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">42人で3時間</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.125-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">安否確認を一斉に送り、<span class="hl">未回答の人だけ自動で追いかける</span></div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">ボタン1つで全員のTeamsに安否確認が届き、回答は名簿に自動で入ります。<br><b>まだ答えていない人にだけ</b>30分ごとに再通知し、総務には進み具合が届きます</div>
  </div>

  <div class="stage">
    <div class="left">
      <div class="old"><span class="tg">これまで：連絡網を上から電話</span>${sOld}<img class="ch" src="${A}chara/chara_trouble.png" alt=""></div>
      <div class="phone"><div class="scr">
        <div class="top"><img src="${A}icons/pa_teams.png" alt="">Teams<span class="tm">07:02</span></div>
        <div class="pm">
          <span class="nm">フロー ボット → 全社員 42人</span>
          <span class="t">【安否確認】地震発生</span>
          <span class="k">いまの状況を回答してください。<br>1分で終わります。</span>
          <span class="nm">フォームの選択肢</span>
          <div class="opts"><span>無事</span><span>けが</span><span>出社不可</span></div>
          <div class="btn">📝 回答フォームを開く</div>
        </div>
      </div></div>
    </div>

    <div class="eng">
      <img class="lg" src="${A}icons/pa_logo.png" alt="">
      <div class="st">
        <span><b>1</b>全員に送る</span>
        <span><b>2</b>回答を名簿へ</span>
        <span><b>3</b>未回答だけ再通知</span>
      </div>
    </div>

    <div class="right">
      <div class="thread">
        <div class="th"><img src="${A}icons/pa_teams.png" alt="">総務部 ＞ 安否確認チャネル</div>
        <div class="tb">
          <div class="msg bot"><span class="av">PA</span><div class="bub">
            <span class="nm">フロー ボット　07:30</span>
            <span class="tx">回答 <span class="n">29 / 42</span>人。未回答の13人に再通知しました</span>
            <div class="bar"><i style="width:69%"></i></div></div></div>
          <div class="msg bot"><span class="av">PA</span><div class="bub">
            <span class="nm">フロー ボット　08:00</span>
            <span class="tx">回答 <span class="n">38 / 42</span>人。<span class="who">けが 1人：鈴木一郎</span></span>
            <div class="bar"><i style="width:90%"></i></div></div></div>
          <div class="msg"><span class="av">佐</span><div class="bub">
            <span class="nm">佐藤花子（総務）</span>
            <span class="tx">鈴木さんには私から電話します</span></div></div>
          <div class="msg bot done"><span class="av">PA</span><div class="bub">
            <span class="nm">フロー ボット　08:30</span>
            <span class="tx"><span class="ok">✓ 全員の回答がそろいました</span>（<span class="n">42 / 42</span>人）</span>
            <div class="bar"><i style="width:100%"></i></div></div></div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">全員の確認まで</span><span class="mv">3時間</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">90分</span></div>
        <div class="uses"><span class="ul">使いどころ</span><span class="u">総務・防災</span><span class="u">台風の出社判断</span><span class="u">店舗・営業所</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>電話は、本当に助けが要る人にだけかければよくなります。<b>作り方は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「Microsoft Forms コネクタ」「Microsoft Teams コネクタ」「SharePoint コネクタ」／人名・人数・時刻は架空の例</div>
`;
</script>
</body>
</html>
