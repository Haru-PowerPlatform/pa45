<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.111-2 送信アクションの使い分け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:5px;padding:7px 9px;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:5px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.2;}
  .fld .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .chk{display:flex;align-items:center;gap:8px;background:#F7F9FC;border:1.5px solid #E2EAF5;border-radius:7px;
    padding:5px 9px;font-size:15.5px;font-weight:900;color:var(--navy);}
  .chk .bx{width:20px;height:20px;border-radius:4px;border:2.5px solid #94A3B8;flex:0 0 auto;background:#fff;position:relative;}
  .chk.on{background:#FFF1F1;border-color:#F0AEAE;color:var(--red-dark);}
  .chk.on .bx{background:var(--red);border-color:var(--red);}
  .chk.on .bx::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;
    border-width:0 2.6px 2.6px 0;transform:rotate(45deg);}
  .cond{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #B9C7DC;border-radius:8px;padding:6px 8px;}
  .cond .cv{flex:1;font-size:15px;font-weight:900;color:var(--navy);background:#EEF2F7;border-radius:5px;padding:3px 7px;
    text-align:center;line-height:1.2;}
  .cond .op{flex:0 0 auto;font-size:14px;font-weight:900;color:#fff;background:#64748B;border-radius:5px;padding:3px 7px;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.24;}
  .dm{display:flex;gap:8px;align-items:flex-start;background:#F3EEFF;border:2px solid #D8C9FA;border-radius:9px;padding:6px 9px;}
  .dm .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#8B5CF6,#6D28D9);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
  .dm .tb{flex:1;}
  .dm .tn{font-size:13px;font-weight:900;color:var(--weak);}
  .dm .tt{font-size:15px;font-weight:900;color:var(--navy);line-height:1.3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};

/* ① 名前ではなくメールアドレスで渡す（388x100） */
const s1=`<svg viewBox="0 0 388 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="u1" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#u1)"><rect x="12" y="14" width="170" height="32" rx="8" fill="#FFECEC" stroke="#DC2626" stroke-width="2.2"/>
    <text x="80" y="35" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#991B1B" text-anchor="middle">山田 太郎</text>
    <g transform="translate(150,22)"><circle cx="9" cy="9" r="9" fill="#DC2626"/>
      <path d="M5 5 l8 8 M13 5 l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g>
  <text x="196" y="35" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#991B1B">同姓同名で迷う</text>
  <g filter="url(#u1)"><rect x="12" y="56" width="228" height="32" rx="8" fill="#EAF9F1" stroke="#16A34A" stroke-width="2.4"/>
    <text x="112" y="77" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#0B5136" text-anchor="middle">yamada@example.com</text>
    <g transform="translate(212,64)"><circle cx="9" cy="9" r="9" fill="#16A34A"/>
      <path d="M5 9.5 l3 3 L13.5 6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="254" y="77" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#0B5136">確実に届く</text>
</svg>`;

/* ② 失敗のときだけ自分に届く（388x100） */
const s2=`<svg viewBox="0 0 388 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="u2" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#u2)"><rect x="12" y="10" width="150" height="34" rx="9" fill="#fff" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="32" cy="27" r="10" fill="#CBD5E1"/><path d="M27 27.5 l3.5 3.5 L38 23" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="33" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#64748B" text-anchor="middle">成功のとき</text></g>
  <path d="M170 27 H 200" stroke="#94A3B8" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="290" y="33" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#64748B" text-anchor="middle">通知しない（静か）</text>
  <g filter="url(#u2)"><rect x="12" y="56" width="150" height="34" rx="9" fill="#FFECEC" stroke="#DC2626" stroke-width="2.4"/>
    <circle cx="32" cy="73" r="10" fill="#DC2626"/><path d="M32 67 v7 M32 79 v.01" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="104" y="79" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#991B1B" text-anchor="middle">失敗のとき</text></g>
  <path d="M170 73 H 200" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#u2)"><rect x="206" y="54" width="170" height="38" rx="10" fill="#fff" stroke="#7C3AED" stroke-width="2.4"/>
    <circle cx="226" cy="73" r="11" fill="#6D28D9"/><text x="226" y="78" font-family="Noto Sans JP" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">Bot</text>
    <rect x="244" y="64" width="120" height="7" rx="3.5" fill="#DDD3F7"/>
    <rect x="244" y="76" width="86" height="7" rx="3.5" fill="#DDD3F7"/></g>
</svg>`;

/* ③ 24時間で宛先が上長に切り替わる（388x100） */
const s3=`<svg viewBox="0 0 388 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="u3" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B5136" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#DCF3E7"/>
  <path d="M22 52 H 366" stroke="#7FBFA0" stroke-width="3.4" stroke-linecap="round"/>
  <g stroke="#4F9C78" stroke-width="2.6" stroke-linecap="round"><path d="M56 46 v12"/><path d="M300 46 v12"/></g>
  <text x="56" y="34" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#0B5136" text-anchor="middle">承認を依頼</text>
  <text x="300" y="34" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#9A3412" text-anchor="middle">24時間 経過</text>
  <g filter="url(#u3)"><rect x="14" y="64" width="126" height="28" rx="14" fill="#EAF1FE" stroke="#2563EB" stroke-width="2.2"/>
    <text x="77" y="83" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#1E40AF" text-anchor="middle">宛先＝担当者</text></g>
  <path d="M150 78 H 176" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 72 l8 6 l-8 6" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#u3)"><rect x="186" y="64" width="126" height="28" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="249" y="83" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#9A3412" text-anchor="middle">宛先＝上長</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.111-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">使い分けは<span class="hl">3つ</span>（宛先の渡し方 → 失敗だけ通報 → 放置で引き上げ）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">フローは1本のまま。<b>受信者に入れるもの</b>と<b>実行条件</b>を替えるだけで役割が変わります</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>宛先の渡し方</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_teams.png" alt="">メッセージを投稿する</div>
        <div class="cardb">
          <div class="fld"><span class="fl">投稿者</span><span class="fi">フロー ボット</span></div>
          <div class="fld"><span class="fl">受信者</span>
            <span class="fi hot"><span class="dyn">台帳の担当者</span></span></div>
          <div class="note">名前ではなくメールアドレスで指定します</div>
        </div>
      </div></div>
      <div class="cap">担当が変わっても、<b>台帳を直すだけ</b>でフローは触りません</div>
    </div>

    <div class="col info">
      <div class="ch2"><span class="n">2</span>失敗だけ通報</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh">実行条件の構成</div>
        <div class="cardb">
          <div class="chk"><span class="bx"></span>成功しました</div>
          <div class="chk on"><span class="bx"></span>失敗しました</div>
          <div class="dm"><span class="av">Bot</span><span class="tb">
            <span class="tn">Power Automate</span>
            <span class="tt">「請求書の自動保存」が失敗しました</span></span></div>
        </div>
      </div></div>
      <div class="cap">止まった時だけ自分にDM。<b>翌週まで気づかない</b>事故が減ります</div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>放置で引き上げ</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_condition.png" alt="">条件</div>
        <div class="cardb">
          <div class="cond"><span class="cv">経過時間</span><span class="op">以上</span><span class="cv">24時間</span></div>
          <div class="fld"><span class="fl">はい のときの受信者</span>
            <span class="fi hot"><span class="dyn">上長のメールアドレス</span></span></div>
          <div class="fld"><span class="fl">メッセージ</span><span class="fi">24時間 未処理の申請があります</span></div>
          <div class="note">承認の期限は先に決めておきます</div>
        </div>
      </div></div>
      <div class="cap">言いにくい催促を、<b>フローが肩代わり</b>してくれます</div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>差出人はフロー ボット（人からの連絡には見えない）</span>
      <span>宛先はテナント内のユーザー</span><span>ゲストや退職者には届かない</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Microsoft Teams コネクタ」「実行条件の構成」（人名・フロー名は架空）</div>
`;
</script>
</body>
</html>
