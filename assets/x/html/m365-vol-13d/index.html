<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.13-4 向く資料・向かない資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  .stage{gap:12px;}
  .left{flex:0 0 352px;display:flex;flex-direction:column;gap:7px;}
  .phone{flex:1;min-height:0;display:flex;flex-direction:column;background:#111827;border-radius:26px;padding:10px 9px 12px;box-shadow:0 6px 16px rgba(0,0,0,.28);}
  .phone .notch{flex:0 0 auto;align-self:center;width:90px;height:6px;border-radius:3px;background:#374151;margin-bottom:6px;}
  .scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:16px;padding:8px 9px;}
  .scr .hd{flex:0 0 auto;display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:700;color:#242424;}
  .scr .hd .repro{font-size:12.5px;}
  .seg2{flex:0 0 auto;display:flex;border:1.5px solid #C8C6C4;border-radius:999px;overflow:hidden;}
  .seg2 span{flex:1;text-align:center;font-size:15.5px;font-weight:700;padding:3px 2px;color:#424242;white-space:nowrap;}
  .seg2 span.on{background:#0F766E;color:#fff;}
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .bar .pp{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#0F766E;color:#fff;display:flex;align-items:center;justify-content:center;}
  .bar .pp svg{width:18px;height:18px;}
  .bar .tk{flex:1;height:7px;border-radius:4px;background:#E2E8F0;position:relative;}
  .bar .tk::after{content:"";position:absolute;left:0;top:0;bottom:0;width:42%;border-radius:4px;background:#0F766E;}
  .tbtn{flex:0 0 auto;font-size:15.5px;font-weight:800;text-align:center;color:#9A3412;background:#FFF7ED;border:2px solid #EA580C;border-radius:7px;padding:3px;}
  .trs{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:6px 8px;font-family:"Segoe UI","Noto Sans JP";}
  .trs p{font-size:15.5px;font-weight:600;color:#1B2A44;line-height:1.32;}
  .trs p b{color:#0F766E;}
  .trs p .hl{background:#FDE68A;}
  .left .cap{font-size:15.5px;}
  .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .tb .th{flex:0 0 auto;display:flex;gap:9px;font-size:16px;font-weight:900;color:#fff;background:var(--mc);border-radius:8px;padding:5px 12px;}
  .tb .th span:nth-child(1){flex:0 0 36px;} .tb .th span:nth-child(2){flex:1.05;} .tb .th span:nth-child(3){flex:1;}
  .trow{gap:9px;padding:3px 9px;}
  .trow .mi{flex:0 0 36px;height:36px;}
  .trow .mi svg{width:36px;height:36px;}
  .trow .k{font-size:17.5px;}
  .trow .v{font-size:16px;}
  .trow .v b{font-weight:900;}
  .trow.ok .v{background:#DCFCE7;color:#065F46;}
  .trow.hot .v b{color:#B91C1C;}
  .trow.gray{background:#F8FAFC;border-color:#E2E8F0;}
  .trow.gray .v{background:#F1F5F9;color:#475569;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={pause:'<path d="M9 6v12M15 6v12"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
/* 行ごとのミニ図解（36x36） */
const DOC=(c,inner)=>`<svg viewBox="0 0 36 36"><path d="M7 3h15l7 7v23H7z" fill="#fff" stroke="#94A3B8" stroke-width="1.6"/><path d="M22 3v7h7" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/>${inner}</svg>`;
const I={
  rep:DOC('',`<rect x="11" y="14" width="14" height="2.6" rx="1.3" fill="#0F766E"/><rect x="11" y="19" width="14" height="2.6" rx="1.3" fill="#94A3B8"/><rect x="11" y="24" width="10" height="2.6" rx="1.3" fill="#94A3B8"/>`),
  rec:`<svg viewBox="0 0 36 36"><rect x="2" y="7" width="32" height="22" rx="4" fill="#5B5FC7"/><path d="M14 12v12l10-6z" fill="#fff"/></svg>`,
  pol:DOC('',`<text x="17" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#0F766E">§</text><rect x="11" y="12" width="13" height="2.4" rx="1.2" fill="#94A3B8"/>`),
  num:`<svg viewBox="0 0 36 36"><rect x="2" y="4" width="32" height="28" rx="3" fill="#fff" stroke="#94A3B8" stroke-width="1.6"/><path d="M2 12h32M2 20h32M13 4v28M24 4v28" stroke="#CBD5E1" stroke-width="1.4"/><rect x="24" y="20" width="10" height="8" fill="#FECACA"/><text x="29" y="27.5" text-anchor="middle" font-size="8" font-weight="900" fill="#B91C1C">%</text></svg>`,
  ja:`<svg viewBox="0 0 36 36"><rect x="3" y="3" width="30" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="18" y="25" text-anchor="middle" font-size="18" font-weight="900" fill="#B91C1C">あ</text><path d="M6 30L30 6" stroke="#DC2626" stroke-width="2.6"/></svg>`,
  memo:`<svg viewBox="0 0 36 36"><rect x="7" y="9" width="22" height="18" rx="2" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.6"/><rect x="11" y="15" width="12" height="2.4" rx="1.2" fill="#CA8A04"/><rect x="11" y="20" width="8" height="2.4" rx="1.2" fill="#CA8A04"/></svg>`,
  lock:`<svg viewBox="0 0 36 36"><path d="M11 16v-4a7 7 0 0 1 14 0v4" fill="none" stroke="#64748B" stroke-width="3"/><rect x="7" y="16" width="22" height="16" rx="3" fill="#94A3B8"/><circle cx="18" cy="23" r="2.6" fill="#fff"/><rect x="17" y="24" width="2" height="4" fill="#fff"/></svg>`
};
const R=(cls,ic,k,v)=>`<div class="trow ${cls}"><span class="mi">${ic}</span><span class="k">${k}</span><span class="v">${v}</span></div>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.13-4</div><div class="lic-pill paid">M365 Copilot ライセンスが要る</div></div>
    <div class="title-text">オーディオの概要：<br><span class="hl">向く資料・向かない資料</span>の早見表</div>
    <div class="title-apps">${MS('onedrive.svg',44)}<span class="pl">+</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">文章が中心の英文資料は、聞いて全体をつかむ。<b>表や数字の多い資料</b>は原本で確かめる。<br><b>日本語の資料は対象外</b>（英語のファイルだけ・2026年11月時点の公式の記載）</div>
  </div>
  <div class="stage">
    <div class="left">
      <div class="phone seg"><div class="notch"></div><div class="scr">
        <div class="hd">${MS('onedrive.svg',22)}OneDrive<span class="repro">説明用の再現</span></div>
        <div class="seg2"><span class="on">要約スタイル</span><span>ポッドキャスト スタイル</span></div>
        <div class="bar"><span class="pp">${svgw(P.pause,3)}</span><span class="tk"></span></div>
        <div class="tbtn">トランスクリプトの表示</div>
        <div class="trs">
          <p><b>Host:</b> This report reviews third-quarter results across three regions.</p>
          <p><b>Host:</b> Sales grew in Asia, while <span class="hl">Europe fell slightly</span>.</p>
          <p><b>Host:</b> It closes with two risks for next quarter.</p>
          <p><b>Host:</b> The first is rising shipping costs in the second half.</p>
        </div>
      </div></div>
      <div class="cap">聞き逃した所は<b>トランスクリプト</b>で文字に戻る</div>
    </div>
    <div class="tb">
      <div class="th"><span></span><span>資料</span><span>オーディオの概要で聞く？</span></div>
      ${R('ok',I.rep,'英文の報告書・提案書<br>（文章が中心）','<b>向く</b>：全体の流れを先に耳で')}
      ${R('ok',I.rec,'英語の Teams 会議の記録','<b>向く</b>：出られなかった会議を移動中に')}
      ${R('ok',I.pol,'英語の規程・ポリシーの改定','<b>向く</b>：全体を聞き、該当の条は原本で')}
      ${R('hot',I.num,'表・数字が多い資料<br>（決算・見積・予算）','<b>原本で確かめる</b>：数字は聞き流さない')}
      ${R('hot',I.ja,'日本語の資料','<b>対象外</b>：英語以外はエラーになる')}
      ${R('gray',I.memo,'200語未満の短いメモ','作れない：<b>200語以上</b>が条件')}
      ${R('gray',I.lock,'暗号化されたファイル<br>（秘密度ラベル）','<b>「OneDrive に保存」</b>が表示されない')}
    </div>
  </div>
  <div class="warnbar">
    <span class="wl">⚠ 使う前に確認</span>
    <div class="ws"><span>AIの生成なので、不正確な所や音声の乱れがありうる</span><span>1日の利用上限がかかる場合あり</span><span>保存すると Recordings フォルダーに mp3</span></div>
  </div>
  <div class="src">出典：Microsoft サポート「OneDrive で Copilot でオーディオの概要を生成する」「Get started with Copilot in OneDrive」／英文は架空の例・画面は説明用の再現</div>
`;
</script>
</body>
</html>
