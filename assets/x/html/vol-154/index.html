<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.154-1 Planner で完了にしたら、報告まで終わる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型D：会話スレッド（左 Planner ボード｜中央 Power Automate｜右 Teams スレッド／下 作業記録）*/
  .stage{flex-direction:column;gap:8px;}
  .top{flex:1;min-height:0;display:flex;gap:8px;}
  /* 左：Planner ボード */
  .pl{flex:0 0 470px;min-height:0;display:flex;flex-direction:column;background:#F3F8F2;border:2.5px solid #9BCB98;border-radius:13px;overflow:hidden;
    box-shadow:0 4px 10px rgba(20,80,30,.12);position:relative;}
  .pl .th{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:linear-gradient(90deg,#2E7D32,#43A047);color:#fff;font-size:16px;font-weight:900;}
  .pl .th .pi{width:28px;height:28px;flex:0 0 auto;}
  .pl .th .tab{margin-left:auto;font-size:13.5px;background:rgba(255,255,255,.22);border-radius:6px;padding:1px 8px;}
  .board{flex:1;min-height:0;display:flex;gap:9px;padding:8px 10px 8px;}
  .bk{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;background:#E9EEF3;border-radius:10px;padding:7px;}
  .bk.dn{background:#E3F2E1;}
  .bk .bh{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#334155;}
  .bk .bh .cn{font-size:13.5px;color:#64748B;background:#fff;border-radius:999px;padding:0 7px;}
  .tk{background:#fff;border-radius:8px;padding:7px 9px;box-shadow:0 2px 4px rgba(20,40,60,.14);display:flex;flex-direction:column;gap:4px;border-left:5px solid #94A3B8;}
  .tk .tt{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:900;color:var(--navy);line-height:1.25;}
  .tk .rc{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2.5px solid #94A3B8;}
  .tk .mt{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;color:#64748B;}
  .tk .av{flex:0 0 auto;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .tk .lb{border-radius:4px;padding:0 6px;color:#fff;font-size:13px;}
  .tk.hot{border-left-color:#16A34A;box-shadow:0 0 0 3px #86EFAC,0 4px 10px rgba(22,101,52,.3);padding:9px 10px;}
  .tk.hot .tt{font-size:18px;color:#166534;}
  .tk.hot .tt s{text-decoration-thickness:2px;text-decoration-color:#16A34A;}
  .tk.hot .ck{flex:0 0 auto;width:34px;height:34px;}
  .tk.hot .dt{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;font-weight:900;color:#fff;background:#16A34A;border-radius:999px;padding:1px 10px;align-self:flex-start;}
  .tk.old{opacity:.8;}
  .tk.old .tt{color:#64748B;}
  .mv{position:absolute;left:186px;top:118px;width:82px;height:60px;z-index:3;pointer-events:none;}
  .pl .chara{position:absolute;left:8px;bottom:-4px;height:118px;z-index:4;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));}
  .pl .say{position:absolute;left:118px;bottom:12px;z-index:4;background:#fff;border:2px solid #16A34A;border-radius:10px;padding:4px 10px;font-size:15.5px;font-weight:900;color:#166534;}
  .pl .say::before{content:"";position:absolute;left:-10px;bottom:10px;border:6px solid transparent;border-right-color:#16A34A;border-left:none;width:0;height:0;}
  /* 中央：エンジン */
  .eng{flex:0 0 118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;}
  .eng .lg{width:74px;height:74px;background:#fff;border-radius:18px;padding:9px;box-shadow:0 4px 10px rgba(30,58,138,.28);}
  .eng .pill{font-size:14.5px;font-weight:900;color:#fff;background:#2563EB;border-radius:999px;padding:3px 11px;white-space:nowrap;}
  .eng .lb{font-size:16px;font-weight:900;color:var(--blue-dark);text-align:center;line-height:1.35;}
  .eng .ar{width:108px;height:30px;}
  /* 右：Teams スレッド */
  .thread{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#F5F5FB;border:2.5px solid #C5C7F0;border-radius:13px;overflow:hidden;
    box-shadow:0 4px 10px rgba(40,40,120,.12);}
  .thread .th{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#5B5FC7;color:#fff;font-size:16px;font-weight:900;}
  .thread .th img{width:26px;height:26px;background:#fff;border-radius:6px;padding:2px;}
  .thread .tb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:5px;padding:7px 10px;}
  .msg .bub{background:#fff;border:1.5px solid #E1E2F5;}
  .msg .nm .tm{font-family:'Roboto Mono',monospace;font-weight:700;margin-left:6px;}
  .msg .tx{font-size:16px;}
  .reply{margin-left:40px;}
  .msg.bot .av{background:linear-gradient(180deg,#3B82F6,#1D4ED8);font-size:12px;}
  .msg.bot .bub{background:#F0F6FF;border:2px solid #93C5FD;border-left:6px solid #2563EB;}
  .done{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;color:#166534;margin-bottom:1px;}
  .done .ck2{width:24px;height:24px;flex:0 0 auto;}
  .kv{display:flex;align-items:baseline;gap:8px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.4;}
  .kv .k{flex:0 0 72px;font-size:13.5px;color:#64748B;}
  .kv .v.big{font-size:18px;color:#1E3A8A;}
  .kv .v.tm2{font-family:'Roboto Mono','Noto Sans JP',monospace;color:#B45309;}
  .rx{display:inline-flex;align-items:center;gap:4px;margin-left:auto;background:#fff;border:1.5px solid #C5C7F0;border-radius:999px;padding:0 9px;font-size:15px;font-weight:900;color:#4F52B2;}
  .rx .em{font-size:16px;font-family:"Segoe UI Emoji","Noto Color Emoji",sans-serif;}
  /* 下段：作業記録 */
  .bot{flex:0 0 auto;display:flex;gap:10px;align-items:stretch;height:132px;}
  .log{flex:0 0 640px;display:flex;flex-direction:column;background:#fff;border:2.5px solid #99DCD3;border-radius:11px;overflow:hidden;box-shadow:0 3px 8px rgba(20,40,90,.10);}
  .log .lh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;background:linear-gradient(90deg,#03787C,#0B9A8F);color:#fff;font-size:15.5px;font-weight:900;}
  .log .lh img{width:22px;height:22px;background:#fff;border-radius:5px;padding:2px;}
  .log .lr{flex:1;display:grid;grid-template-columns:150px 1fr 150px 128px;align-items:center;font-size:15.5px;font-weight:700;color:#334155;border-bottom:1.2px solid #EEF2F6;padding:0 10px;white-space:nowrap;}
  .log .lr.h{flex:0 0 26px;font-size:13.5px;font-weight:900;color:#475569;background:#F1F5F9;}
  .log .lr .d{font-family:'Roboto Mono',monospace;font-weight:700;}
  .log .lr.nw{background:#DCFCE7;color:#065F46;font-weight:900;box-shadow:inset 5px 0 0 #16A34A;position:relative;}
  .log .lr.nw .nwb{justify-self:end;font-size:13.5px;font-weight:900;color:#fff;background:#16A34A;border-radius:999px;padding:1px 9px;}
  .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .rt .metric{flex:1;}
  .metric .ml{font-size:16px;line-height:1.25;text-align:center;}
  .metric .mi{flex:0 0 auto;width:52px;height:52px;}
  .metric .mv2{font-size:27px;font-weight:900;color:#92400E;line-height:1.1;text-align:center;}
  .metric .mv2.to{color:var(--green-dark);}
  .rt .uses{background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:5px 9px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
/* Planner のタイル（公式PNGが手元に無いので、緑のタイルにボードの3列を描く） */
const PLI=(w)=>`<svg class="pi" width="${w}" height="${w}" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="pg${w}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CC15F"/><stop offset="1" stop-color="#1B6E2A"/></linearGradient></defs>
  <rect x="1" y="1" width="26" height="26" rx="6" fill="#fff"/><rect x="3" y="3" width="22" height="22" rx="5" fill="url(#pg${w})"/>
  <rect x="6.5" y="7" width="4" height="13" rx="1.5" fill="#fff"/><rect x="12" y="7" width="4" height="9" rx="1.5" fill="#E8F5E9"/><rect x="17.5" y="7" width="4" height="15" rx="1.5" fill="#C8E6C9"/></svg>`;
const CK=`<svg class="ck" width="34" height="34" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
  <circle cx="17" cy="17" r="16" fill="#16A34A" opacity=".18"/><circle cx="17" cy="17" r="12.5" fill="#16A34A"/>
  <path d="M11 17.5l4.2 4.2 8-8.4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CK2=`<svg class="ck2" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="11" fill="#16A34A"/>
  <path d="M7 12.5l3.2 3.2 6.6-6.8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* 進行中 → 完了 へ移る矢印（カーソル付き） */
const MV=`<svg class="mv" width="82" height="60" viewBox="0 0 82 60" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 40 C 26 6, 52 6, 70 26" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>
  <path d="M60 24 l12 4 l-2 -12" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ARR=`<svg class="ar" width="108" height="30" viewBox="0 0 108 30" xmlns="http://www.w3.org/2000/svg"><path d="M6 15 H 88" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M84 5 L 100 15 L 84 25" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* 数字の見せ場：書いて送る（下書き＋ペン）→ チェック1回 */
const MB=`<svg class="mi" width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="7" width="38" height="32" rx="6" fill="#fff" stroke="#B45309" stroke-width="2.4"/><path d="M12 39 l-4 9 l12 -9" fill="#fff" stroke="#B45309" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="10" y="15" width="24" height="3.6" rx="1.8" fill="#D97706"/><rect x="10" y="22" width="18" height="3.6" rx="1.8" fill="#FBBF24"/><rect x="10" y="29" width="12" height="3.6" rx="1.8" fill="#FBBF24"/>
  <g transform="rotate(40 40 28)"><rect x="36" y="10" width="8" height="28" rx="2" fill="#F59E0B"/><path d="M36 38 l4 8 l4 -8z" fill="#78350F"/><rect x="36" y="8" width="8" height="5" rx="1.5" fill="#DC2626"/></g></svg>`;
const MA=`<svg class="mi" width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg"><circle cx="26" cy="26" r="24" fill="#16A34A" opacity=".18"/><circle cx="26" cy="26" r="18" fill="#16A34A"/>
  <path d="M17 26.5l6.2 6.2 11.6-12" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.154-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">Planner でタスクを完了にすると、<br><span class="hl">依頼した人への報告と作業記録</span>まで終わる</div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">いつもの完了チェックを入れるだけで、Teams に<b>完了の報告</b>が投稿され、作業記録にも<b>1行</b>残ります。<br>終わりました報告を書く手間も、送り忘れもなくなります</div>
  </div>

  <div class="stage">
    <div class="top">
      <div class="pl">
        <div class="th">${PLI(28)}Planner ＞ A社 見積もり対応<span class="tab">ボード</span></div>
        <div class="board">
          <div class="bk">
            <div class="bh">進行中<span class="cn">2</span></div>
            <div class="tk"><div class="tt"><span class="rc"></span>現地調査の日程調整</div>
              <div class="mt"><span class="av" style="background:#0EA5E9">田</span>田中 美咲<span class="lb" style="background:#F59E0B">10/22</span></div></div>
            <div class="tk"><div class="tt"><span class="rc"></span>仕様書の確認</div>
              <div class="mt"><span class="av" style="background:#8B5CF6">山</span>山田 太郎<span class="lb" style="background:#64748B">10/24</span></div></div>
          </div>
          <div class="bk dn">
            <div class="bh">完了<span class="cn">2</span></div>
            <div class="tk hot"><div class="tt">${CK}<s>見積書を送付</s></div>
              <div class="mt"><span class="av" style="background:#EA580C">鈴</span>鈴木 一郎</div>
              <span class="dt">完了 10/20 14:32</span></div>
            <div class="tk old"><div class="tt"><span class="rc" style="background:#94A3B8"></span><s>見積もりの依頼受付</s></div>
              <div class="mt"><span class="av" style="background:#EA580C">鈴</span>鈴木 一郎</div></div>
          </div>
        </div>
        ${MV}
        <img class="chara" src="${A}chara/chara_point.png" alt="">
        <div class="say">丸をクリックして完了にする</div>
      </div>

      <div class="eng">
        <img class="lg" src="${A}icons/pa_logo.png" alt="">
        <div class="pill">数分以内に</div>
        <div class="lb">完了を<br>見つけて<br>報告する</div>
        ${ARR}
      </div>

      <div class="thread">
        <div class="th"><img src="${A}icons/pa_teams.png" alt="">営業1課 ＞ 案件の報告</div>
        <div class="tb">
          <div class="msg bot"><span class="av">PA</span><div class="bub">
            <div class="nm">フロー ボット<span class="tm">14:36</span></div>
            <div class="done">${CK2}タスクが完了しました</div>
            <div class="kv"><span class="k">タスク</span><span class="v big">見積書を送付</span></div>
            <div class="kv"><span class="k">プラン</span><span class="v">A社 見積もり対応</span></div>
            <div class="kv"><span class="k">完了日時</span><span class="v tm2">10/20 14:32</span><span class="rx"><span class="em">&#x1F44D;</span>1</span></div>
          </div></div>
          <div class="msg reply"><span class="av" style="background:#DB2777">佐</span><div class="bub">
            <div class="nm">佐藤 花子（依頼した人）<span class="tm">14:40</span></div>
            <div class="tx">確認しました。ありがとうございます</div></div></div>
          <div class="msg reply"><span class="av" style="background:#EA580C">鈴</span><div class="bub">
            <div class="nm">鈴木 一郎<span class="tm">14:42</span></div>
            <div class="tx">PDFで担当の方に送っています</div></div></div>
        </div>
      </div>
    </div>

    <div class="bot">
      <div class="log">
        <div class="lh"><img src="${A}icons/ms/lists.svg" alt="">作業記録（SharePoint リスト）</div>
        <div class="lr h"><span>完了日時</span><span>タスク</span><span>プラン</span><span></span></div>
        <div class="lr"><span class="d">10/17 11:05</span><span>見積もりの依頼受付</span><span>A社 見積もり</span><span></span></div>
        <div class="lr nw"><span class="d">10/20 14:32</span><span>見積書を送付</span><span>A社 見積もり</span><span class="nwb">⚡ 自動で1行</span></div>
      </div>
      <div class="rt">
        <div class="metric"><span class="ml">完了の<br>報告</span>${MB}<span class="mv2">書いて送る</span><span class="ar">${svgw(P.arrow,3)}</span>${MA}<span class="mv2 to">チェック1回</span></div>
        <div class="uses"><span class="ul">誰に刺さる</span><span class="u">営業</span><span class="u">制作</span><span class="u">情シス</span><span class="u">上司への報告</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>Planner ＋ Teams ＋ SharePoint の3つで作れます。<b>作り方は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「Planner コネクタ」「Microsoft Teams コネクタ」「SharePoint コネクタ」／人名・案件名は架空の例</div>
`;
</script>
</body>
</html>
