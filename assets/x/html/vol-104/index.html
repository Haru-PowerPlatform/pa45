<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.104-1 返事のない承認を、放置しない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#065F46;
    --red:#DC2626; --red-bg:#FEF2F2; --red-dark:#991B1B;
    --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  /* タイムライン */
  .tl{flex:0 0 auto;margin:10px 16px 0;height:172px;position:relative;border-radius:13px;overflow:hidden;background:linear-gradient(180deg,#F7FAFF,#EDF3FC);border:2.5px solid #D3E0F2;}
  .tl svg{position:absolute;inset:0;width:100%;height:100%;}
  .tl .chara{position:absolute;right:8px;bottom:0;height:120px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .stage{flex:1 1 auto;margin:9px 16px 0;display:flex;align-items:stretch;gap:11px;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;border-radius:13px;padding:8px 10px 9px;}
  .col.c1{background:#F8FAFC;border:2.5px solid #DCE3EE;}
  .col.c2{background:#FFFCF2;border:2.5px solid #F0C868;}
  .col.c3{background:var(--green-bg);border:2.5px solid #7FCEA9;}
  .ch2{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:18.5px;line-height:1.2;color:#1B2A44;}
  .col.c2 .ch2{color:#8A5A00;}
  .col.c3 .ch2{color:var(--green-dark);}
  .ch2 .tag{flex:0 0 auto;font-size:14px;font-weight:900;color:#fff;border-radius:999px;padding:3px 11px;background:#64748B;}
  .col.c2 .ch2 .tag{background:#D97706;}
  .col.c3 .ch2 .tag{background:var(--green);}

  /* Teamsカード */
  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #C9D6EA;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .col.c2 .card{border-color:#F0C868;}
  .col.c3 .card{border-color:#7FCEA9;}
  .ch{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#F3F6FC;border-bottom:1.5px solid #E2EAF5;}
  .ch img{width:26px;height:26px;object-fit:contain;flex:0 0 auto;}
  .ch .nm{font-weight:900;font-size:14.5px;color:#1B2A44;}
  .ch .tm{margin-left:auto;font-size:13.5px;font-weight:800;color:var(--weak);}
  .cb{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;}
  .ttl{font-size:16px;font-weight:900;color:#1B2A44;line-height:1.25;}
  .ln{font-size:14.5px;font-weight:800;color:#475569;line-height:1.3;}
  .to{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#EAF2FF;border:1.5px solid #9DC1F5;border-radius:7px;padding:3px 9px;font-size:14px;font-weight:900;color:#0B3A8F;}
  .btns{margin-top:auto;display:flex;gap:7px;}
  .btns span{flex:1;text-align:center;font-size:14.5px;font-weight:900;border-radius:7px;padding:6px 3px;}
  .btns .p{background:linear-gradient(180deg,#4B7BF5,#2563EB);color:#fff;}
  .btns .s{background:#fff;border:2px solid #C9D6EA;color:#33507F;}
  .cap{flex:0 0 auto;font-size:15px;font-weight:900;line-height:1.32;border-radius:9px;padding:7px 10px;color:#334155;background:#E7EEF7;}
  .col.c2 .cap{color:#8A5A00;background:#FDF0D5;}
  .col.c3 .cap{color:var(--green-dark);background:#CFEFE0;}
  .cap b{color:var(--orange);}

  .next{flex:0 0 auto;margin:9px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>'};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* タイムライン：申請 →（3日待つ）→ 期限 → リマインド →（2日）→ 次の承認者 */
const tlSvg=`<svg viewBox="0 0 1180 168" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ts" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#1B2A44" flood-opacity=".22"/></filter>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1052" y2="0">
      <stop offset="0" stop-color="#94A3B8"/><stop offset="0.42" stop-color="#D97706"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <marker id="mkt" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 z" fill="#16A34A"/></marker>
  </defs>

  <!-- 軸 -->
  <line x1="40" y1="96" x2="1052" y2="96" stroke="url(#tg)" stroke-width="9" stroke-linecap="round" marker-end="url(#mkt)"/>

  <!-- ① 申請 -->
  <g transform="translate(74,96)">
    <circle cx="0" cy="0" r="17" fill="#fff" stroke="#64748B" stroke-width="5"/>
    <text x="0" y="-34" font-family="Noto Sans JP" font-size="19" font-weight="900" fill="#334155" text-anchor="middle">承認を出す</text>
    <text x="0" y="42" font-family="Noto Sans JP" font-size="16" font-weight="900" fill="#64748B" text-anchor="middle">0日目</text>
  </g>

  <!-- 待ち区間 -->
  <g transform="translate(196,66)" filter="url(#ts)">
    <rect x="0" y="0" width="184" height="60" rx="12" fill="#fff" stroke="#B9C2D2" stroke-width="2.6" stroke-dasharray="9 6"/>
    <text x="92" y="26" font-family="Noto Sans JP" font-size="17" font-weight="900" fill="#475569" text-anchor="middle">返事がないまま</text>
    <text x="92" y="48" font-family="Noto Sans JP" font-size="17" font-weight="900" fill="#475569" text-anchor="middle">ただ待っている</text>
  </g>

  <!-- ② 期限 -->
  <g transform="translate(462,96)">
    <circle cx="0" cy="0" r="21" fill="#D97706" stroke="#fff" stroke-width="5"/>
    <text x="0" y="-38" font-family="Noto Sans JP" font-size="19" font-weight="900" fill="#8A5A00" text-anchor="middle">3日で期限</text>
    <text x="0" y="46" font-family="Noto Sans JP" font-size="16" font-weight="900" fill="#8A5A00" text-anchor="middle">タイムアウト</text>
  </g>

  <!-- ③ リマインド -->
  <g transform="translate(654,96)">
    <circle cx="0" cy="0" r="17" fill="#fff" stroke="#D97706" stroke-width="5"/>
    <text x="0" y="-34" font-family="Noto Sans JP" font-size="19" font-weight="900" fill="#8A5A00" text-anchor="middle">催促が飛ぶ</text>
    <text x="0" y="42" font-family="Noto Sans JP" font-size="16" font-weight="900" fill="#8A5A00" text-anchor="middle">本人にだけ</text>
  </g>

  <!-- 待ち区間2 -->
  <g transform="translate(742,66)" filter="url(#ts)">
    <rect x="0" y="0" width="150" height="60" rx="12" fill="#fff" stroke="#E9C48A" stroke-width="2.6" stroke-dasharray="9 6"/>
    <text x="75" y="26" font-family="Noto Sans JP" font-size="17" font-weight="900" fill="#8A5A00" text-anchor="middle">それでも</text>
    <text x="75" y="48" font-family="Noto Sans JP" font-size="17" font-weight="900" fill="#8A5A00" text-anchor="middle">動かない</text>
  </g>

  <!-- ④ 次の承認者 -->
  <g transform="translate(972,96)">
    <circle cx="0" cy="0" r="21" fill="#16A34A" stroke="#fff" stroke-width="5"/>
    <path d="M-9 1 l6 6 l12-13" stroke="#fff" stroke-width="4.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-38" font-family="Noto Sans JP" font-size="19" font-weight="900" fill="#0B5136" text-anchor="middle">次の人へ回る</text>
    <text x="0" y="46" font-family="Noto Sans JP" font-size="16" font-weight="900" fill="#0B5136" text-anchor="middle">止まらない</text>
  </g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.104-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">返事のない承認で<span class="hl">止まらない</span>ようにする</div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('clock')}</div>
    <div class="txt">承認は、押されるまでずっと待ちます。<b>期限を決めておく</b>と、その先を自動で進められます。</div>
  </div>

  <div class="tl">${tlSvg}<img class="chara" src="${A}chara/chara_point.png" alt=""></div>

  <div class="stage">
    <div class="col c1">
      <div class="ch2"><span class="tag">0日目</span>承認を出す</div>
      <div class="card">
        <div class="ch"><img src="${A}icons/pa_teams.png" alt=""><span class="nm">承認</span><span class="tm">月 9:00</span></div>
        <div class="cb">
          <div class="ttl">出張申請の承認</div>
          <div class="ln">申請者：佐藤／金額：38,000円</div>
          <span class="to">承認者：田中</span>
          <div class="btns"><span class="p">承認</span><span class="s">却下</span></div>
        </div>
      </div>
      <div class="cap">ここまでは、いつもの承認フローと同じです。</div>
    </div>

    <div class="col c2">
      <div class="ch2"><span class="tag">3日目</span>催促が飛ぶ</div>
      <div class="card">
        <div class="ch"><img src="${A}icons/pa_teams.png" alt=""><span class="nm">フローボット</span><span class="tm">木 9:00</span></div>
        <div class="cb">
          <div class="ttl">承認がまだ止まっています</div>
          <div class="ln">出張申請の承認／3日経過</div>
          <span class="to">宛先：田中さんだけ</span>
          <div class="btns"><span class="p">いま承認する</span></div>
        </div>
      </div>
      <div class="cap">全体には流さず、<b>止めている本人にだけ</b>届きます。</div>
    </div>

    <div class="col c3">
      <div class="ch2"><span class="tag">5日目</span>次の人へ</div>
      <div class="card">
        <div class="ch"><img src="${A}icons/pa_teams.png" alt=""><span class="nm">承認</span><span class="tm">土 9:00</span></div>
        <div class="cb">
          <div class="ttl">出張申請の承認（代理）</div>
          <div class="ln">田中さん不在のため回付</div>
          <span class="to">承認者：鈴木（代理）</span>
          <div class="btns"><span class="p">承認</span><span class="s">却下</span></div>
        </div>
      </div>
      <div class="cap">担当が休みでも、<b>申請が止まりません</b>。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>やることは<b>タイムアウトを1つ入れる</b>だけ。作り方は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（承認／フロー実行の最大は30日）／タイムアウト設定とエスカレーションの組み方はコミュニティの定番手法／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
