<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.97-2 日付と時刻の式チートシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:12px;min-height:0;}

  .sheet{flex:1.5;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:7px;min-height:0;}
  .fx{display:flex;flex-direction:column;justify-content:center;gap:2px;background:#F8F9FA;border:1.5px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:6px 11px;min-height:0;}
  .fx .fn{font-family:'Roboto Mono',monospace;font-size:17px;font-weight:900;color:var(--blue-dark);line-height:1.2;}
  .fx .fn .lb{font-family:'Noto Sans JP';font-size:14.5px;color:var(--weak);font-weight:800;margin-left:7px;}
  .fx .ex{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;color:#475569;line-height:1.3;word-break:break-all;}
  .fx .rs{font-size:14.5px;font-weight:900;color:var(--green-dark);line-height:1.25;}
  .fx .rs::before{content:"→ ";color:var(--green);}
  .fx.v2{border-left-color:var(--violet);} .fx.v2 .fn{color:#5B21B6;}
  .fx.v3{border-left-color:var(--orange);} .fx.v3 .fn{color:#9A3412;}

  .side{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;}

  /* 「タイム ゾーンの変換」アクション実画面モック */
  .act{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;border:2px solid #C7D6EE;border-radius:13px;box-shadow:0 5px 13px rgba(20,40,90,.14);overflow:hidden;}
  .ah{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 12px;background:linear-gradient(90deg,#0B5FB0,#1976D2);color:#fff;font-weight:900;font-size:15.5px;}
  .ah .sq{flex:0 0 auto;width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;}
  .ah .sq img{width:100%;height:100%;object-fit:contain;}
  .ab{flex:1;padding:7px 10px;display:flex;flex-direction:column;gap:3px;min-height:0;}
  .fld{display:flex;flex-direction:column;gap:1px;}
  .fld .k{font-size:14px;font-weight:900;color:var(--weak);}
  .fld .v{background:#F7F9FC;border:1.5px solid #D9E1EC;border-radius:7px;padding:5px 8px;font-size:15px;font-weight:800;color:#243B58;display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.28;}
  .fld .v.hot{background:#EAF2FF;border-color:#7FA9EE;box-shadow:0 0 0 2px #DCE9FD;}
  .fld .v code{font-family:'Roboto Mono',monospace;font-size:14px;color:#0B3A8F;}
  .dynp{display:inline-flex;align-items:center;gap:3px;background:#EAF2FF;border:1px solid #9DC1F5;border-radius:6px;padding:1px 7px;font-size:14px;color:#0B3A8F;font-weight:900;}
  .dynp::before{content:"⚡";font-size:13px;}
  .acap{flex:0 0 auto;margin-top:auto;font-size:14.5px;font-weight:800;color:var(--blue-dark);background:var(--blue-bg);border:1.5px solid #BFD6FB;border-radius:8px;padding:6px 9px;line-height:1.38;}
  .acap b{color:var(--orange);}

  .warn{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;background:#FFFBEB;border:2px solid #FCD34D;border-radius:12px;padding:7px 10px;}
  .warn .wt{font-size:14px;font-weight:900;color:#B45309;letter-spacing:.03em;}
  .warn .m{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;font-weight:900;color:#92400E;line-height:1.32;}
  .warn .m .e{flex:0 0 auto;font-size:18px;line-height:1.2;}
  .warn .m .t{flex:1;min-width:0;}
  .warn .m code{font-family:'Roboto Mono',monospace;font-size:13.5px;background:#fff;border:1px solid #F6D08A;border-radius:5px;padding:0 5px;color:#B45309;}

  .next{flex:0 0 auto;margin:9px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:25px;height:25px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const FX=[
 ['','utcNow()','いまの日時',"utcNow()","2026-08-16T00:30:00Z（UTC）"],
 ['','convertTimeZone','日本時間に直す',"convertTimeZone(utcNow(),'UTC',<br>'Tokyo Standard Time','yyyy/MM/dd HH:mm')","2026/08/16 09:30"],
 ['','formatDateTime','見た目を整える',"formatDateTime(⚡日時,'yyyy/MM/dd')","2026/08/16"],
 ['','formatDateTime','和文で出す',"formatDateTime(⚡日時,'M月d日 H時')","8月16日 9時"],
 ['v2','addDays','◯日あと',"addDays(utcNow(),7)","7日後（期限の計算に）"],
 ['v2','addDays（マイナス）','◯日まえ',"addDays(utcNow(),-30)","30日前（古い行の判定）"],
 ['v2','addHours / addMinutes','◯時間あと',"addHours(⚡日時,3)","3時間後（通知をずらす）"],
 ['v2','startOfDay','その日の0時',"startOfDay(utcNow())","その日の0時（1日分の絞り込みに）"],
 ['v3','dayOfWeek','曜日の番号',"dayOfWeek(utcNow())","0=日曜 〜 6=土曜"],
 ['v3','startOfMonth','今月の1日',"startOfMonth(utcNow())","今月1日の0時（月次集計の起点に）"],
];

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.97-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">日付と時刻は<span class="hl">この10個</span>で足りる｜<span class="hl">式チートシート【保存版】</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('cal')}</div>
    <div class="txt">「7日後」「30日前」「今日の0時」——日付まわりは<b>この10個</b>でほぼ足ります。<b>コピペして値だけ差し替え</b>ればOK。</div>
  </div>

  <div class="stage">
    <div class="sheet">
      ${FX.map(([c,fn,lb,ex,rs])=>`<div class="fx ${c}"><div class="fn">${fn}<span class="lb">${lb}</span></div><div class="ex">${ex}</div><div class="rs">${rs}</div></div>`).join('')}
    </div>

    <div class="side">
      <div class="act">
        <div class="ah"><span class="sq"><img src="${A}icons/pa_dataoperation.png" alt=""></span>組み込み「タイム ゾーンの変換」</div>
        <div class="ab">
          <div class="fld"><span class="k">基準時間</span><span class="v"><span class="dynp">開始時刻</span>（動的コンテンツ）</span></div>
          <div class="fld"><span class="k">変換元のタイム ゾーン</span><span class="v">(UTC) 協定世界時</span></div>
          <div class="fld"><span class="k">変換先のタイム ゾーン</span><span class="v hot">(UTC+09:00) 大阪、札幌、東京</span></div>
          <div class="fld"><span class="k">書式設定文字列</span><span class="v"><code>yyyy/MM/dd HH:mm</code></span></div>
          <div class="acap">検索ボックスに<b>「タイム ゾーンの変換」</b>と入れるだけ。<b>選ぶだけで同じ結果</b>になります。</div>
        </div>
      </div>

      <div class="warn">
        <div class="wt">使う前に確認</div>
        <div class="m"><span class="e">⚡</span><span class="t">動的コンテンツは <code>' '</code> で囲まない（囲むと文字そのものになる）</span></div>
        <div class="m"><span class="e">📏</span><span class="t">手で書く日時は <code>2026-08-16T00:30:00Z</code> の形（ISO 8601）でないと動かない</span></div>
        <div class="m"><span class="e">🔢</span><span class="t">台帳に入れる値は <code>yyyy-MM-dd</code> にすると並べ替えが効く</span></div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>取ってくる段階で絞るなら<b>フィルタークエリ早見表（Vol.90）</b>とセットでどうぞ！</div>
  <div class="src">出典：Microsoft Learn「タイム ゾーンを変換する」「フローで使用する日時の値をカスタマイズまたは形式設定する」「式関数リファレンス」／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
