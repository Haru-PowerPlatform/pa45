<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.8-1 社内の資料とWebをまとめた調査レポートを、確認の質問に答えるだけで受け取る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  /* 型D：会話スレッド（頼む → Researcher が確認の質問 → 答える → 出典つきレポート）*/
  .stage{gap:10px;}
  .col.bad{flex:0 0 318px;}
  .sc{flex:1;min-height:0;position:relative;border-radius:10px;overflow:hidden;background:#FCE4E4;}
  .sc svg{position:absolute;inset:0;width:100%;height:100%;}
  .sc .ch{position:absolute;right:2px;bottom:0;height:130px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
  .badlist{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;}
  .badlist div{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--red-line);border-radius:8px;padding:4px 9px;font-size:15.5px;font-weight:800;color:#7F1D1D;}
  .badlist i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#DC2626;color:#fff;font-style:normal;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .badline{flex:0 0 auto;background:#DC2626;color:#fff;border-radius:8px;padding:6px 10px;font-size:16px;font-weight:900;line-height:1.3;}

  .thr{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .thr .ph{color:var(--green-dark);} .thr .ph .mk{background:linear-gradient(180deg,#34D399,#16A34A);}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--green-line);border-radius:12px;overflow:hidden;box-shadow:0 5px 14px rgba(20,90,60,.16);}
  .win .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 11px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;}
  .win .wh .ag{background:var(--mc-grad);color:#fff;border-radius:999px;padding:1px 10px;font-size:14.5px;font-weight:900;}
  .wb{flex:1;min-height:0;display:flex;gap:10px;padding:8px 10px;}
  .talk{flex:0 0 372px;display:flex;flex-direction:column;gap:6px;}
  .msg{display:flex;gap:7px;align-items:flex-start;}
  .msg.me{flex-direction:row-reverse;}
  .msg .av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13.5px;font-weight:900;background:#64748B;overflow:hidden;}
  .msg.bot .av{background:#fff;border:1.5px solid #A7E3D8;}
  .msg .bub{flex:1;border-radius:10px;padding:5px 9px;font-family:"Noto Sans JP",sans-serif;}
  .msg.me .bub{background:#E8F4F2;border:1.5px solid #A7E3D8;border-radius:10px 3px 10px 10px;}
  .msg.bot .bub{background:#FFFBEB;border:2px solid #F59E0B;border-radius:3px 10px 10px 10px;}
  .msg .nm{font-size:13px;font-weight:900;color:var(--weak);}
  .msg.bot .nm{color:#B45309;}
  .msg .tx{font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.38;}
  .msg .opts{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;}
  .msg .opts span{font-size:14px;font-weight:900;color:#92400E;background:#fff;border:1.5px solid #FDBA74;border-radius:999px;padding:0 8px;}
  .wait{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;color:var(--mc-dark);background:#F0FDFA;border:1.5px dashed #7DD3C4;border-radius:8px;padding:4px 9px;}
  .wait svg{width:20px;height:20px;flex:0 0 auto;}
  .scope{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  .scope span{font-size:14px;font-weight:900;border-radius:999px;padding:1px 8px;background:#CCFBF1;color:#134E4A;}
  .scope span.w{background:#DBEAFE;color:#1E3A8A;} .scope .sl{background:none;color:#6B7280;padding:0 2px;}
  .scope2{font-size:14px;font-weight:800;color:#6B7280;}
  /* レポート */
  .rep{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;border:2px solid #16A34A;border-radius:10px;padding:7px 10px;background:#fff;font-family:"Noto Sans JP",sans-serif;position:relative;}
  .rep .rt{font-size:17px;font-weight:900;color:#1B2A44;}
  .rep .badge{position:absolute;right:8px;top:-12px;font-size:13.5px;font-weight:900;color:#fff;background:#16A34A;border-radius:999px;padding:1px 10px;}
  .rep h4{font-size:15px;font-weight:900;color:var(--mc-dark);border-left:4px solid var(--mc);padding-left:6px;}
  .ct{display:flex;flex-direction:column;border:1.5px solid #E5E7EB;border-radius:7px;overflow:hidden;}
  .ct div{display:flex;font-size:14.5px;font-weight:700;color:#1B2A44;border-bottom:1px solid #EEF0F2;}
  .ct div:last-child{border-bottom:none;}
  .ct div span{padding:2px 7px;} .ct div span:first-child{flex:0 0 96px;} .ct div span:nth-child(2){flex:0 0 76px;} .ct div span:last-child{flex:1;}
  .ct .h{background:#EFFAF8;color:var(--mc-dark);font-weight:900;font-size:13.5px;}
  .ct .best{background:#ECFDF5;}
  .bars{flex:1;min-height:0;position:relative;}
  .bars svg{position:absolute;inset:0;width:100%;height:100%;}
  .srcs{display:flex;gap:5px;flex-wrap:wrap;}
  .srcs span{display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:900;border-radius:999px;padding:1px 8px;}
  .srcs .w{background:#DBEAFE;color:#1E3A8A;} .srcs .s{background:#CCFBF1;color:#134E4A;}
  .bot{flex:0 0 auto;display:flex;gap:8px;align-items:stretch;}
  .bot .uses{flex:1;background:#fff;border:1.5px solid #CFEFE0;border-radius:10px;padding:4px 9px;}
  .metric .mv{font-size:23px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const sv=(p,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#242424'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  hour:'<path d="M7 3h10M7 21h10M8 3c0 5 8 6 8 9s-8 4-8 9M16 3c0 5-8 6-8 9s8 4 8 9"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;

/* Before：ブラウザのタブが20個、メモが散らばる */
const sBad=`<svg viewBox="0 0 294 249" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="bf" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7F1D1D" flood-opacity=".25"/></filter></defs>
  <rect width="294" height="249" fill="#FCE4E4"/><g transform="translate(0 14)">
  <g filter="url(#bf)"><rect x="10" y="14" width="274" height="118" rx="8" fill="#fff" stroke="#D6A1A1" stroke-width="1.5"/>
  <rect x="10" y="14" width="274" height="26" rx="8" fill="#F1F5F9"/>
  ${Array.from({length:14},(_,i)=>`<path d="M${14+i*19} 40 l3 -18 h12 l3 18" fill="${i===13?'#fff':'#E2E8F0'}" stroke="#94A3B8" stroke-width="1"/>`).join('')}
  ${[0,1,2,3].map(i=>`<rect x="24" y="${54+i*16}" width="${[200,170,220,140][i]}" height="7" rx="3.5" fill="#CBD5E1"/>`).join('')}</g>
  <rect x="190" y="0" width="100" height="22" rx="11" fill="#DC2626"/><text x="240" y="16" text-anchor="middle" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#fff">タブが20個</text>
  ${[[18,150,-6,'#FEF08A'],[64,160,5,'#BBF7D0'],[110,148,-3,'#FED7AA']].map(([x,y,r,c])=>`<g transform="translate(${x} ${y}) rotate(${r})" filter="url(#bf)"><rect width="46" height="46" fill="${c}"/>${[0,1,2].map(j=>`<rect x="6" y="${9+j*11}" width="${[32,26,30][j]}" height="4" rx="2" fill="#78716C" opacity=".55"/>`).join('')}</g>`).join('')}
</g>
</svg>`;
/* レポートの中の棒グラフ */
const bars=`<svg viewBox="0 0 320 84" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  ${[['A展',3.2,'#0F766E'],['B展',2.4,'#14B8A6'],['C展',4.1,'#22C55E']].map(([n,v,c],i)=>`<rect x="${40+i*95}" y="${62-v*10}" width="50" height="${v*10}" rx="4" fill="${c}"/>
  <text x="${65+i*95}" y="${57-v*10}" text-anchor="middle" font-family="Roboto Mono" font-size="12" font-weight="700" fill="#134E4A">${v}万</text>
  <text x="${65+i*95}" y="80" text-anchor="middle" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#374151">${n}</text>`).join('')}
  <line x1="20" y1="62" x2="300" y2="62" stroke="#CBD5E1" stroke-width="2"/></svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills">
      <div class="vol-pill"><small>M365 Copilot</small>Vol.8-1</div>
      <div class="lic-pill paid">M365 Copilot ライセンスが要る</div>
    </div>
    <div class="title-text">社内の資料とWebをまとめた調査レポートを、<br><span class="hl">確認の質問に答えるだけ</span>で受け取る</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/copilot.png" alt=""><span class="pl">＋</span><img class="msi" src="${A}icons/ms/word.svg" alt=""><img class="msi" src="${A}icons/ms/outlook.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">Copilot の エージェント にある<b>Researcher</b>は、社内のファイル・メール・会議・チャットと Web を調べて、<br>出典つきのレポートにまとめます。始める前に<b>確認の質問</b>をしてくることがあり、答えると的が絞られます</div>
  </div>

  <div class="stage">
    <div class="col bad">
      <div class="ph"><span class="mk">${svgw(P.x,3.2)}</span>自分で集めると</div>
      <div class="sc">${sBad}<img class="ch" src="${A}chara/chara_tired.png" alt=""></div>
      <div class="badlist">
        <div><i>1</i>社内の過去の報告書を探す</div>
        <div><i>2</i>各社の公式サイトを開いて比べる</div>
        <div><i>3</i>出典を控えながら表にする</div>
      </div>
      <div class="badline">✕ 比較表1枚に半日かかる</div>
    </div>

    <div class="thr">
      <div class="ph"><span class="mk">${svgw(P.ok,3.2)}</span>Researcher に頼むと</div>
      <div class="win seg">
        <div class="wh">${CPI(24)}Copilot<span class="ag">Researcher</span><span class="repro">画面は説明用の再現</span></div>
        <div class="wb">
          <div class="talk">
            <div class="msg me"><span class="av">私</span><div class="bub"><div class="tx">来年出る展示会の候補を3つ比べて。<br>社内の過去の出展報告と、<br>各展示会の公式情報を使ってください。</div></div></div>
            <div class="msg bot"><span class="av">${CPI(22)}</span><div class="bub"><div class="nm">確認の質問（例）</div><div class="tx">比べる観点はどれにしますか？</div>
              <div class="opts"><span>来場者数</span><span>出展費用</span><span>来場者の業種</span></div></div></div>
            <div class="msg me"><span class="av">私</span><div class="bub"><div class="tx">来場者数と費用。2027年の上半期で。</div></div></div>
            <div class="wait">${sv(P.hour,'#0F766E')}時間をかけて調べてから、まとめて返す</div>
            <div class="scope"><span class="sl">範囲</span><span>ファイル</span><span>メール</span><span>会議</span><span>チャット</span><span class="w">Web</span></div>
            <div class="scope2">見られるのは、自分に権限がある社内の情報だけ</div>
          </div>
          <div class="rep">
            <span class="badge">レポート</span>
            <div class="rt">2027年上半期 展示会の比較</div>
            <h4>来場者数と費用</h4>
            <div class="ct">
              <div class="h"><span>展示会</span><span>来場者</span><span>出展費用</span></div>
              <div><span>A展</span><span>3.2万人</span><span>小間 60万円</span></div>
              <div><span>B展</span><span>2.4万人</span><span>小間 45万円</span></div>
              <div class="best"><span>C展</span><span>4.1万人</span><span>小間 85万円</span></div>
            </div>
            <div class="bars">${bars}</div>
            <div class="srcs"><span class="s">社内 2025年 出展報告.docx</span><span class="w">Web 各展示会の公式サイト</span></div>
          </div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">開くもの</span><span class="mv">タブ20個</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">レポート1本</span></div>
        <div class="uses"><span class="ul">使いどころ</span><span class="u">企画</span><span class="u">マーケ</span><span class="u">営業企画</span><span class="u">稟議の下調べ</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>ふつうのチャットとの使い分けと、頼み方の3点。<b>早見表は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「What is Researcher Agent in Microsoft Copilot?」「Microsoft Copilot service description」／画面は説明用の再現、展示会・数字・回答はすべて架空の例</div>
`;
</script>
</body>
</html>
