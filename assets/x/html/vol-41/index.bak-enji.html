<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.41 Copilot Cowork従量課金時代の使い分け（図解）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --enji:#A4283C; --enji-dark:#6E1628;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
    --card:#F8F9FA; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:92px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:32px;line-height:1.16;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:160px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:150px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 18px 0;background:var(--blue-bg);border:2px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:9px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:700;font-size:18px;color:var(--blue-dark);line-height:1.3;padding-right:96px;}
  .concl .txt b{color:var(--enji);}

  .body{flex:1 1 auto;margin:11px 18px 0;display:flex;flex-direction:column;gap:11px;min-height:0;}

  /* 図解パネル */
  .panel{background:linear-gradient(180deg,#FBFCFE,#F2F5FA);border:2px solid #D5DEEC;border-radius:16px;box-shadow:0 5px 13px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.8);padding:11px 18px 14px;position:relative;}
  .ph{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .ph .pi{width:30px;height:30px;color:var(--orange);flex:0 0 auto;}
  .ph .pt{font-weight:900;font-size:20px;color:var(--ink);}
  .ph .pt em{font-style:normal;color:var(--blue);}

  /* フロー図 */
  .flow{flex:1 1 auto;display:flex;align-items:stretch;gap:4px;}
  .node{flex:1;border-radius:14px;padding:14px 14px;display:flex;flex-direction:row;align-items:center;text-align:left;gap:13px;box-shadow:0 4px 10px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);}
  .node.n-pa{background:linear-gradient(180deg,#EAF2FF,#D6E6FE);border:2px solid var(--blue);}
  .node.n-co{background:linear-gradient(180deg,#FBE9ED,#F6D8DF);border:2px solid var(--enji);}
  .node .circ{width:66px;height:66px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4);}
  .node .circ svg{width:38px;height:38px;}
  .n-pa .circ{background:linear-gradient(180deg,#3B82F6,#2563EB);}
  .n-co .circ{background:linear-gradient(180deg,#C13350,#A4283C);}
  .node .txt2{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .node .nt{font-weight:900;font-size:21px;line-height:1.16;}
  .n-pa .nt{color:var(--blue-dark);} .n-co .nt{color:var(--enji-dark);}
  .node .ns{font-weight:700;font-size:14.5px;color:var(--gray);line-height:1.3;}
  .node .tag{align-self:flex-start;font-weight:900;font-size:12px;color:#fff;border-radius:6px;padding:3px 11px;}
  .n-pa .tag{background:var(--blue);} .n-co .tag{background:var(--enji);}
  .arr{flex:0 0 auto;align-self:center;width:30px;height:30px;color:#94A3B8;}
  .flow-note{margin-top:10px;display:flex;align-items:center;gap:9px;background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:10px;padding:8px 13px;}
  .flow-note .ni{width:24px;height:24px;color:var(--orange);flex:0 0 auto;}
  .flow-note .nx{font-weight:800;font-size:15.5px;color:#7C2D12;line-height:1.3;}
  .flow-note .nx b{color:var(--enji);}

  /* コスト内訳 */
  .cost{flex:0 0 auto;}
  .cost .ph .pi{color:var(--enji);}
  .cgrid{display:flex;align-items:center;gap:9px;}
  .factor{flex:1;background:#fff;border:1.5px solid #E7C3CB;border-radius:11px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.07);}
  .factor .fi{width:30px;height:30px;color:var(--enji);}
  .factor .ft{font-weight:800;font-size:15px;color:var(--enji-dark);line-height:1.2;}
  .cplus{flex:0 0 auto;color:#C0A0A8;font-weight:900;font-size:18px;}
  .price{flex:0 0 auto;background:linear-gradient(180deg,#C13350,#A4283C);color:#fff;border-radius:11px;padding:9px 15px;text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);}
  .price .pa{font-weight:900;font-size:16px;line-height:1.15;}
  .price .pb{font-weight:800;font-size:12px;opacity:.92;}

  .band{flex:0 0 auto;margin:11px 18px 13px;background:linear-gradient(180deg,#565C66,#4A4F58);border-radius:13px;padding:11px 20px;display:flex;align-items:center;gap:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);position:relative;}
  .band .blab{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FB923C,#EA580C);color:#fff;font-weight:900;font-size:16px;border-radius:9px;padding:8px 13px;box-shadow:0 2px 5px rgba(0,0,0,.3);}
  .band .blab svg{width:18px;height:18px;}
  .band .btxt{flex:1;color:#F1F5F9;font-weight:800;font-size:18.5px;line-height:1.35;padding-right:118px;}
  .band .btxt b.bl{color:#93C5FD;} .band .btxt b.rd{color:#FCA5A5;}
  .band-chara{position:absolute;right:14px;bottom:-2px;height:116px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 collect:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
 ai:'<path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 14l.8 2.2 2.2.8-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/>',
 send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 cpu:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>',
 doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/>',
 tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2.1-.6-.6-2.1z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 yen:'<circle cx="12" cy="12" r="9"/><path d="M8.5 7.5 12 12l3.5-4.5M12 12v5M9.5 13.5h5M9.5 16h5"/>',
 idea:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'
};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const svgF=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none">${ICON[n]}</svg>`;
const arrow='<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 4l10 8-10 8z"/></svg>';

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.41</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">Copilot Coworkが<span class="hl">従量課金</span>に。<br>かしこい使い分けを図解！</div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgF('idea')}</div>
    <div class="txt">2026年6月、Copilot Coworkは「使った分だけ課金」へ。定型はPower Automate、<b>AIは“ここぞ”だけ</b>に絞るのがコスパ最強！</div>
  </div>

  <div class="body">
    <div class="panel">
      <div class="ph"><span class="pi">${svg('tool')}</span><span class="pt">いちばんお得な形 ＝ <em>合わせ技</em></span></div>
      <div class="flow">
        <div class="node n-pa">
          <div class="circ">${svg('collect')}</div>
          <div class="txt2">
            <div class="nt">材料を集める</div>
            <div class="ns">メール・ファイル・<br>データを自動で取り込む</div>
            <div class="tag">Power Automate</div>
          </div>
        </div>
        <span class="arr">${arrow}</span>
        <div class="node n-co">
          <div class="circ">${svgF('ai')}</div>
          <div class="txt2">
            <div class="nt">考える（1回だけ）</div>
            <div class="ns">読む・要約・分析・<br>判断はAIにまかせる</div>
            <div class="tag">Copilot Cowork</div>
          </div>
        </div>
        <span class="arr">${arrow}</span>
        <div class="node n-pa">
          <div class="circ">${svg('send')}</div>
          <div class="txt2">
            <div class="nt">結果を届ける</div>
            <div class="ns">通知・保存・一覧づくりを<br>自動で仕上げる</div>
            <div class="tag">Power Automate</div>
          </div>
        </div>
      </div>
      <div class="flow-note"><span class="ni">${svg('bulb')}</span><span class="nx">AIを呼ぶ回数＝課金回数。前後の“決まった作業（集める・届ける）”をPower Automateにまかせると、<b>請求が最小</b>に。</span></div>
    </div>

    <div class="panel cost">
      <div class="ph"><span class="pi">${svg('yen')}</span><span class="pt">Coworkが高い理由 ＝ <em style="color:var(--enji)">使った分だけ課金</em></span></div>
      <div class="cgrid">
        <div class="factor"><span class="fi">${svg('cpu')}</span><span class="ft">モデル使用</span></div>
        <div class="factor"><span class="fi">${svg('doc')}</span><span class="ft">文脈の取得</span></div>
        <div class="factor"><span class="fi">${svg('tool')}</span><span class="ft">ツール呼出</span></div>
        <div class="factor"><span class="fi">${svg('clock')}</span><span class="ft">実行時間</span></div>
        <span class="cplus">＝</span>
        <div class="price"><div class="pa">$0.01 ／ クレジット</div><div class="pb">軽い作業 $1〜3／重い作業 $7〜</div></div>
      </div>
    </div>
  </div>

  <div class="band">
    <div class="blab">${svg('bulb')}覚え方</div>
    <div class="btxt">毎回おなじ手順 → <b class="bl">Power Automate</b>　／　毎回ちがう判断 → <b class="rd">Copilot Cowork</b></div>
    <img class="band-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
