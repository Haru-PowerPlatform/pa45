<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.100-1 何百件のくり返しが、1ステップで終わる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#065F46;
    --red:#DC2626; --red-bg:#FEF2F2; --red-dark:#991B1B;
    --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:linear-gradient(180deg,#FFF6D8,#FFE08A);color:#8A5A00;font-weight:900;font-size:26px;border-radius:999px;padding:7px 18px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.9);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:11px;min-height:0;}

  .pane{flex:1;display:flex;flex-direction:column;gap:8px;border-radius:14px;padding:9px 11px 10px;min-height:0;}
  .pane.bad{background:var(--red-bg);border:2.5px solid #F2B8B8;}
  .pane.good{background:var(--green-bg);border:2.5px solid #A7E3C7;}
  .ph{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:25px;line-height:1.14;}
  .pane.bad .ph{color:var(--red-dark);}
  .pane.good .ph{color:var(--green-dark);}
  .ph .bdg{flex:0 0 auto;font-size:14px;font-weight:900;color:#fff;border-radius:999px;padding:3px 12px;}
  .pane.bad .ph .bdg{background:var(--red);}
  .pane.good .ph .bdg{background:var(--green);}

  .scene{flex:0 0 auto;height:150px;border-radius:11px;position:relative;overflow:hidden;}
  .pane.bad .scene{background:#FCE4E4;}
  .pane.good .scene{background:#DCF3E7;}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;}
  .scene .chara{position:absolute;right:5px;bottom:0;height:116px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #C7D6EE;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .pane.bad .card{border-color:#F0AEAE;}
  .pane.good .card{border-color:#7FCEA9;}
  .cardh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 11px;font-weight:900;font-size:16.5px;color:#1B2A44;background:#F2F7FD;border-bottom:1.5px solid #E2EAF5;}
  .pane.bad .cardh{background:#FDF1F1;border-bottom-color:#F3D3D3;color:var(--red-dark);}
  .pane.good .cardh{background:#EAF9F1;border-bottom-color:#BFE7D3;color:var(--green-dark);}
  .cardh .ci{width:28px;height:28px;flex:0 0 auto;}
  .cardb{flex:1;padding:8px 11px;display:flex;flex-direction:column;gap:6px;min-height:0;}
  .fl{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.3;}
  .fl .k{flex:0 0 58px;font-weight:900;color:var(--weak);}
  .fl .v{flex:1;min-width:0;font-weight:900;color:#243B58;}
  .fl .v.mono{font-family:'Roboto Mono',monospace;font-size:14px;color:#0B3A8F;}
  .cnt{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;border-radius:9px;padding:7px 10px;font-size:17px;}
  .pane.bad .cnt{background:#FDE0E0;color:var(--red-dark);}
  .pane.good .cnt{background:#D3F1E1;color:var(--green-dark);}
  .pcap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.33;border-radius:9px;padding:7px 10px;}
  .pane.bad .pcap{color:var(--red-dark);background:#FBD9D9;}
  .pane.good .pcap{color:var(--green-dark);background:#CFEFE0;}

  /* 中央：数字どーん */
  .mid{flex:.9;display:flex;flex-direction:column;gap:9px;min-height:0;background:linear-gradient(180deg,#FFFDF3,#FFF6DC);border:2.5px solid #F0C868;border-radius:14px;padding:10px 11px;box-shadow:0 5px 13px rgba(180,140,20,.18);}
  .midh{flex:0 0 auto;font-weight:900;font-size:18px;color:#8A5A00;line-height:1.2;text-align:center;}
  .big{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .big .lb{font-size:15px;font-weight:900;color:var(--red-dark);background:#FDE0E0;border-radius:999px;padding:2px 12px;}
  .big .lb.g{color:var(--green-dark);background:#D3F1E1;}
  .big .b1{font-family:'Roboto Mono',monospace;font-size:30px;font-weight:700;color:var(--red-dark);text-decoration:line-through;text-decoration-thickness:3px;}
  .big .ar{width:30px;height:30px;color:#B45309;}
  .big .b2{font-family:'Roboto Mono',monospace;font-size:50px;font-weight:700;color:var(--green-dark);line-height:1.18;}
  .big .b2s{font-size:19px;font-weight:900;color:var(--green-dark);}
  .note{flex:0 0 auto;font-size:13.5px;font-weight:900;color:#8A5A00;background:#FFF;border:1.5px solid #F0C868;border-radius:8px;padding:6px 8px;line-height:1.34;text-align:center;}
  .free{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:900;color:#0B5136;background:#D3F1E1;border:2px solid #7FCEA9;border-radius:9px;padding:7px 9px;line-height:1.28;}
  .free .fi{flex:0 0 auto;width:26px;height:26px;color:var(--green-dark);}

  .next{flex:0 0 auto;margin:9px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  loop:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  bolt:'<path d="M13 2L3 14h8l-1 8 10-12h-8z"/>',
  rocket:'<path d="M5 13c-1.5 1.5-2 5-2 5s3.5-.5 5-2"/><path d="M14.5 4.5C17 2 21 2 21 2s0 4-2.5 6.5L14 13l-3-3z"/><path d="M11 10L7 9l-2 2 3 1"/><path d="M14 13l1 4 2-2-1-3z"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/>'
};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* Before：200件を1件ずつ回す（砂時計＋ぐるぐる＋行が延々） */
const sceneBad=`<svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3D8D8"/></linearGradient>
    <filter id="bsd" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3B1414" flood-opacity=".22"/></filter>
  </defs>
  <!-- 行が縦に積む -->
  <g>
    ${Array.from({length:7},(_,i)=>`<rect x="10" y="${10+i*19}" width="104" height="13" rx="4" fill="#EFB4B4" opacity="${1-i*0.08}"/>`).join('')}
  </g>
  <text x="62" y="146" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#991B1B" text-anchor="middle">200件ぶん…</text>
  <!-- ぐるぐる矢印 -->
  <g transform="translate(124,44)">
    <path d="M4 26 A22 22 0 1 1 28 44" fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <path d="M23 37 L31 46 L20 50 z" fill="#DC2626"/>
  </g>
  <!-- 砂時計 -->
  <g transform="translate(180,26)" filter="url(#bsd)">
    <path d="M6 4 h44 v10 L34 34 L50 54 v10 H6 V54 L22 34 L6 14 z" fill="url(#hg)" stroke="#DC2626" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M14 10 h28 L30 28 z" fill="#EFB4B4"/>
    <path d="M20 58 h16 L28 44 z" fill="#EFB4B4"/>
  </g>
  <text x="208" y="106" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#991B1B" text-anchor="middle">待ち時間</text>
</svg>`;

/* After：束が一気に変換される */
const sceneGood=`<svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gsd" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B3B24" flood-opacity=".2"/></filter>
    <marker id="mkg2" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="10" refY="7.5" orient="auto"><path d="M0 0 L15 7.5 L0 15 z" fill="#16A34A"/></marker>
  </defs>
  <g>
    ${Array.from({length:7},(_,i)=>`<rect x="8" y="${10+i*19}" width="66" height="13" rx="4" fill="#A9DFC4"/>`).join('')}
  </g>
  <g transform="translate(88,60)">
    <rect x="0" y="-17" width="66" height="36" rx="9" fill="#fff" stroke="#16A34A" stroke-width="3" filter="url(#gsd)"/>
    <text x="33" y="7" font-family="Noto Sans JP" font-size="17" font-weight="900" fill="#0B5136" text-anchor="middle">選択</text>
  </g>
  <path d="M160 77 H 186" stroke="#16A34A" stroke-width="6" stroke-linecap="round" marker-end="url(#mkg2)"/>
  <g>
    ${Array.from({length:7},(_,i)=>`<rect x="206" y="${10+i*19}" width="56" height="13" rx="4" fill="#5FCB98"/>`).join('')}
  </g>
  <text x="120" y="146" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#0B5136" text-anchor="middle">まとめて1回で変換</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.100-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">何百件のくり返しが、<span class="hl">1ステップで終わる</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bolt')}</div>
    <div class="txt">Apply to each は<b>1件ずつ</b>まわします。でも<b>形を変えるだけ</b>の仕事なら、「選択」が<b>まとめて1回</b>で終わらせます。</div>
  </div>

  <div class="stage">
    <div class="pane bad">
      <div class="ph"><span class="bdg">before</span>1件ずつ、200回</div>
      <div class="scene">${sceneBad}<img class="chara" src="${A}chara/chara_tired.png" alt=""></div>
      <div class="card">
        <div class="cardh"><span class="ci">${svg('loop',2.2)}</span>Apply to each</div>
        <div class="cardb">
          <div class="fl"><span class="k">中身</span><span class="v">作成（氏名をつなげる）</span></div>
          <div class="fl"><span class="k">回数</span><span class="v">配列の件数だけ</span></div>
          <div class="cnt">200件 ＝ 200回まわる</div>
        </div>
      </div>
      <div class="pcap">件数が増えるほど遅くなり、アクションの実行回数も増えていきます。</div>
    </div>

    <div class="mid">
      <div class="midh">ある実測の例では</div>
      <div class="big">
        <div class="lb">Apply to each</div>
        <div class="b1">2分20秒</div>
        <div class="ar">${svg('down',3)}</div>
        <div class="lb g">選択（Select）</div>
        <div class="b2">0.1<span class="b2s">秒</span></div>
      </div>
      <div class="note">※個人ブログの実測例です。件数や中身で変わります</div>
      <div class="free"><span class="fi">${svg('gift',2.2)}</span>組み込みなので接続も追加料金も不要</div>
    </div>

    <div class="pane good">
      <div class="ph"><span class="bdg">after</span>まとめて、1回</div>
      <div class="scene">${sceneGood}<img class="chara" src="${A}chara/chara_guts.png" alt=""></div>
      <div class="card">
        <div class="cardh"><span class="ci">${svg('rocket',2.2)}</span>選択（Select）</div>
        <div class="cardb">
          <div class="fl"><span class="k">開始</span><span class="v">⚡ もとの配列</span></div>
          <div class="fl"><span class="k">マップ</span><span class="v mono">氏名 : item()?['name']</span></div>
          <div class="cnt">200件でも 1アクション</div>
        </div>
      </div>
      <div class="pcap">列を絞る・名前を変える・つなげる。表を作り替えるだけならこれで足ります。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>書き方と、<b>Apply to each と選択の使い分け</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn「Power Automate でデータ操作を使用する」／実測値（2分20秒→0.1秒）は個人ブログの計測例／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
