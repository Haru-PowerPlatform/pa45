<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.52-1 できたフローは“会話”で育てる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --cop-grad:linear-gradient(120deg,#7C3AED,#C026D3 55%,#EC4899);
    --orange:#EA580C; --amber:#D97706; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:28px;line-height:1.16;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:144px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .tatoe{margin:9px 16px 0;background:linear-gradient(180deg,#FFFBEB,#FEF3C7);border:1.5px solid #FAD77A;border-radius:11px;display:flex;align-items:center;gap:11px;padding:8px 15px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .tatoe .ti{flex:0 0 auto;width:26px;height:26px;color:var(--amber);}
  .tatoe .tt{font-weight:800;font-size:16.5px;color:#7A4A12;line-height:1.34;}
  .tatoe .tt b{color:var(--cop-dark);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:14px;min-height:0;}

  /* 左：会話スレッド */
  .lz{flex:1.18;display:flex;flex-direction:column;min-height:0;}
  .zhd{font-weight:900;font-size:17.5px;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:8px;}
  .zhd img{width:24px;height:24px;object-fit:contain;}
  .chatw{flex:1;background:#FBFAFE;border:1.5px solid #D8CBEF;border-radius:14px;box-shadow:0 5px 13px rgba(0,0,0,.12);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;min-height:0;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .bub{max-width:88%;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.06);}
  .bub .who{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;margin-bottom:3px;color:#5A6B85;}
  .bub .who img{width:16px;height:16px;object-fit:contain;}
  .bub.me{align-self:flex-end;background:#EDE9FE;border:1.5px solid #C4B5FD;color:#3B3172;border-bottom-right-radius:4px;}
  .bub.me b{color:var(--cop-dark);}
  .bub.ai{align-self:flex-start;background:#fff;border:1.5px solid #E4E1EC;color:#333;border-bottom-left-radius:4px;}
  .bub.ai b{color:var(--cop-dark);}
  .bub.ai .stepmini{margin-top:4px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#43307A;font-weight:800;}
  .bub.ai .stepmini span::before{content:"・";color:#9F67F0;}

  /* 右：フローの変化 */
  .rz{flex:1;display:flex;flex-direction:column;min-height:0;}
  .flowbox{flex:1;background:#F8FAFD;border:1.5px solid #C9D2E0;border-radius:14px;box-shadow:0 5px 13px rgba(0,0,0,.12);padding:11px 14px;display:flex;flex-direction:column;justify-content:space-evenly;gap:5px;min-height:0;}
  .acard{background:#fff;border:1.5px solid #D7DEE9;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;padding:7px 12px;}
  .acard img{flex:0 0 auto;width:27px;height:27px;object-fit:contain;}
  .acard .an{font-weight:900;font-size:14.5px;color:var(--ink);line-height:1.2;}
  .acard .an small{display:block;font-weight:700;font-size:11px;color:var(--weak);}
  .acard.new{border:2px solid var(--green);background:#F2FCF6;position:relative;}
  .acard.new .badge{position:absolute;right:-8px;top:-11px;background:linear-gradient(180deg,#22C55E,#16A34A);color:#fff;font-weight:900;font-size:11.5px;border-radius:999px;padding:3px 10px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .acard.sub{margin-left:34px;}
  .conn{align-self:center;display:flex;flex-direction:column;align-items:center;height:18px;}
  .conn .l{width:2px;flex:1;background:#B9C4D6;}
  .yeslab{margin-left:34px;font-size:12px;font-weight:900;color:var(--green-dark);display:flex;align-items:center;gap:5px;}
  .yeslab::before{content:"";width:10px;height:10px;border-radius:3px;background:#22C55E;}
  .resbadge{align-self:center;display:inline-flex;align-items:center;gap:7px;background:#ECFDF3;border:1.5px solid #86E0AC;border-radius:999px;padding:6px 14px;font-weight:900;font-size:13.5px;color:#0B5E37;}
  .resbadge img{width:16px;height:16px;}

  .next{flex:0 0 auto;margin:10px 16px 12px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:18px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:24px;height:24px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 seed:'<path d="M12 22V12"/><path d="M12 12C12 7 8 4 3 4c0 5 4 8 9 8z"/><path d="M12 10c0-4 3.5-6 8-6 0 4.5-3.5 7-8 7"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.52-1</div>
    <img class="vol-logo" src="${A}icons/copilot_m365.png" alt="">
    <div class="title-text">できたフローは<span class="hl">“会話”で育てる｜作り直し不要</span></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="tatoe">
    <span class="ti">${svg('seed')}</span>
    <span class="tt">たとえるなら…フローは<b>植物</b>。一度作ったら終わりじゃなく、<b>Copilotに追加注文するたびに育つ</b>。「PDFだけ保存したい」もひと言でOK。</span>
  </div>

  <div class="stage">
    <div class="lz">
      <div class="zhd"><img src="${A}icons/copilot_m365.png" alt="">実際の会話（続きから頼むだけ）</div>
      <div class="chatw">
        <div class="bub me"><span class="who"><img src="${A}chara/chara_smile.png" alt="">自分</span>フローができました。<br>追加で、<b>PDFの添付ファイルだけを保存</b>するように変えたいです。どこをどう変更すればいいですか？</div>
        <div class="bub ai"><span class="who"><img src="${A}icons/copilot_m365.png" alt="">Copilot</span>できましたか！👏<br>PDFだけ保存したい場合は、<b>「条件（Condition）」を1つ追加するだけ</b>です。
          <div class="stepmini"><span>条件：名前が「.pdf」で終わるか判定</span><span>ファイルの作成を「はいの場合」へ移動</span><span>見積書.pdf→保存／写真.jpg→保存しない</span></div>
        </div>
        <div class="bub me"><span class="who"><img src="${A}chara/chara_guts.png" alt="">自分</span>できた！ほかの改良もまた頼みます！</div>
      </div>
    </div>

    <div class="rz">
      <div class="zhd"><img src="${A}icons/pa_logo.png" alt="">フローの変化（条件が1つ増えただけ）</div>
      <div class="flowbox">
        <div class="acard"><img src="${A}icons/pa_outlook.png" alt=""><span class="an">新しいメールが届いたとき (V3)<small>Office 365 Outlook</small></span></div>
        <div class="conn"><span class="l"></span></div>
        <div class="acard"><img src="${A}icons/pa_control.png" alt=""><span class="an">Apply to each<small>添付ファイルごとに繰り返す</small></span></div>
        <div class="conn"><span class="l"></span></div>
        <div class="acard new"><img src="${A}icons/pa_condition.png" alt=""><span class="an">条件：名前が「.pdf」で終わる<small>コントロール ／ 条件</small></span><span class="badge">＋会話で追加</span></div>
        <div class="yeslab">はいの場合（True）</div>
        <div class="acard sub"><img src="${A}icons/pa_onedrive.png" alt=""><span class="an">ファイルの作成<small>OneDrive for Business</small></span></div>
        <div class="resbadge"><img src="${A}icons/icon_check_green.png" alt="">PDFだけ保存に進化。他の添付はスルー</div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>「特定の送信者だけ」「Excelだけ」も同じ頼み方でOK。<b>条件の実画面設定</b>は2枚目で！</div>
  <div class="src">出典：Microsoft 365 Copilot 実機</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
