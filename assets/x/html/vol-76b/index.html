<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.76-2 そのまま使えるフィルタークエリ集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.36;padding-right:100px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;gap:14px;min-height:0;}
  .lz{flex:1;display:flex;flex-direction:column;min-height:0;}
  .rz{flex:0 0 336px;display:flex;flex-direction:column;min-height:0;gap:9px;}
  .hd{font-weight:900;font-size:23px;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
  .hd .b{flex:0 0 auto;width:31px;height:31px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;}

  .qs{flex:1;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:6px;min-height:0;}
  .q{display:flex;align-items:center;gap:11px;background:#F8F9FA;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:9px;padding:7px 12px;min-height:0;}
  .q .lbl{flex:0 0 168px;font-size:17px;font-weight:900;color:var(--ink);line-height:1.2;}
  .q .val{flex:1;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:#0B3A8F;line-height:1.3;word-break:break-all;}
  .q.d{border-left-color:var(--orange);} .q.d .val{color:#9A3412;}
  .q.s{border-left-color:#7C3AED;} .q.s .val{color:#5B21B6;}
  .q.o{border-left-color:var(--green);} .q.o .val{color:var(--green-dark);}

  .ops{background:#F8F9FA;border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .ops .oh{font-weight:900;font-size:17px;color:var(--ink);margin-bottom:7px;}
  .opg{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;}
  .op{display:flex;align-items:baseline;gap:7px;font-size:15.5px;font-weight:800;color:var(--gray);}
  .op code{font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:var(--blue-dark);background:#EFF6FF;border-radius:5px;padding:1px 7px;flex:0 0 auto;}

  .wall{flex:1;background:linear-gradient(180deg,#FFF7ED,#FFEDD5);border:2.5px solid #FB923C;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;position:relative;min-height:0;}
  .wall .wh{font-weight:900;font-size:21px;color:#9A3412;line-height:1.25;}
  .wall .wt{font-size:16px;font-weight:800;color:#7C2D12;line-height:1.5;}
  .wall .wt b{color:#C2410C;}
  .wall .steps{display:flex;flex-direction:column;gap:5px;}
  .wall .stp{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;color:#7C2D12;background:#fff;border:1px solid #FDBA74;border-radius:8px;padding:6px 9px;}
  .wall .stp .n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:#EA580C;color:#fff;font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .wall .stp:last-child{padding-right:64px;}
  .wmascot{position:absolute;right:-6px;bottom:-6px;height:84px;z-index:30;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));}

  .warn{flex:0 0 auto;margin:10px 16px 18px;background:#EFF6FF;border:2px solid #93C5FD;border-radius:12px;padding:9px 16px;display:flex;align-items:center;gap:14px;}
  .warn .wt2{flex:0 0 auto;font-weight:900;font-size:17px;color:var(--blue-dark);}
  .warn .wl{display:flex;gap:18px;flex-wrap:wrap;font-size:16px;font-weight:800;color:#1E3A8A;line-height:1.35;}
  .warn code{font-family:'Roboto Mono',monospace;font-size:15px;background:#fff;border:1px solid #BFDBFE;border-radius:5px;padding:1px 6px;}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgBulb='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>';

const Q=[
 ['','完了以外を取る',"Status ne '完了'"],
 ['','2つとも満たす',"Status eq '未完了' and Priority eq '高'"],
 ['','どちらかを満たす',"Status eq '申請中' or Status eq '差戻し'"],
 ['s','「見積」で始まる',"startswith(Title,'見積')"],
 ['s','「見積」を含む',"substringof('見積',Title)"],
 ['d','今日以降のもの',"Due_x0020_Date ge '@{utcNow()}'"],
 ['d','7日以内のもの',"Due_x0020_Date le '@{addDays(utcNow(),7)}'"],
 ['o','並べ替え（期限が近い順）',"Due_x0020_Date asc"]
];

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.76-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">フィルター クエリ｜<span class="hl">そのまま使える8個と、5000件の壁</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgBulb}</div>
    <div class="txt">書き方は<b>「内部名 演算子 値」</b>だけ。文字列はシングルクォートで囲み、日付は<b>式をそのまま入れて</b>比較できます。</div>
  </div>

  <div class="stage">
    <div class="lz">
      <div class="hd"><span class="b">1</span>コピーして使う8個</div>
      <div class="qs">
        ${Q.map(([c,l,v])=>`<div class="q ${c}"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}
      </div>
    </div>

    <div class="rz">
      <div class="hd" style="margin-bottom:0"><span class="b">2</span>演算子と“壁”</div>
      <div class="ops">
        <div class="oh">使える演算子</div>
        <div class="opg">
          <div class="op"><code>eq</code>等しい</div>
          <div class="op"><code>ne</code>等しくない</div>
          <div class="op"><code>gt</code>より大きい</div>
          <div class="op"><code>ge</code>以上</div>
          <div class="op"><code>lt</code>より小さい</div>
          <div class="op"><code>le</code>以下</div>
          <div class="op" style="grid-column:1/3"><code>startswith / substringof</code>文字列</div>
        </div>
      </div>
      <div class="wall">
        <div class="wh">⚠ 5000件の壁</div>
        <div class="wt">既定<b>100件</b>／最大<b>5000件</b>。5000件超のリストは<b>最初の5000件に該当が無いと0件</b>で返ることも。</div>
        <div class="steps">
          <div class="stp"><span class="n">1</span><span><b>ページ分割</b>をオンにする</span></div>
          <div class="stp"><span class="n">2</span><span>絞り込む列に<b>インデックス</b></span></div>
        </div>
        <img class="wmascot" src="${A}chara/chara_guts.png" alt="">
      </div>
    </div>
  </div>

  <div class="warn">
    <span class="wt2">💡 覚えておくと早い</span>
    <span class="wl">
      <span>列名のスペースは <code>_x0020_</code></span>
      <span>並べ替えは <code>列名 asc / desc</code></span>
    </span>
  </div>
  <div class="src">出典：Microsoft Learn（アイテムの取得とファイルの取得アクションの詳細な分析）／列名・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
