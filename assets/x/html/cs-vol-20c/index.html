<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.20-3 作り方：指示と一覧リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;padding-bottom:0;}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .c1{flex:1.08;} .c2{flex:1;}
  .sh{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900;color:var(--navy);}
  .sh .n{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .sh small{font-size:14.5px;font-weight:700;color:#6B7280;}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;}
  .wh .tt{font-size:15px;}
  .ins{padding:8px 13px;font-size:16.5px;font-weight:600;line-height:1.5;color:#242424;display:flex;flex-direction:column;gap:5px;}
  .c1 .win{flex:0 0 auto;}
  .test{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:4px;background:#F5F3FF;border:2px dashed #A78BFA;border-radius:12px;padding:5px 12px;}
  .test .lb{font-size:14.5px;font-weight:900;color:#5B21B6;}
  .test .u{align-self:flex-end;background:#E8EBFA;border-radius:10px 10px 3px 10px;padding:4px 11px;font-size:16px;font-weight:600;}
  .test .b{align-self:flex-start;background:#fff;border:1px solid #E1DFDD;border-radius:10px 10px 10px 3px;padding:4px 11px;font-size:16px;font-weight:600;}
  .test .b mark{background:linear-gradient(transparent 55%,#FDE68A 55%);color:inherit;font-weight:800;}
  .ins .ln{display:flex;gap:8px;}
  .ins .ln i{flex:0 0 auto;font-style:normal;font-size:13px;font-weight:800;color:#fff;background:#7C3AED;border-radius:5px;padding:0 6px;height:20px;margin-top:3px;}
  .ins .ln.k i{background:#E11D48;}
  .ins mark{background:linear-gradient(transparent 55%,#FDE68A 55%);color:inherit;font-weight:800;}
  .spl{flex:1;min-height:0;display:flex;flex-direction:column;}
  .spl .lh{display:flex;align-items:center;gap:8px;padding:6px 11px;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;}
  .tbl{flex:1;min-height:0;display:flex;flex-direction:column;}
  .tr{flex:1;display:grid;grid-template-columns:1.35fr .8fr 1.3fr .8fr;align-items:center;border-bottom:1px solid #F3F2F1;font-size:15px;font-weight:600;padding:0 10px;}
  .tr.h{flex:0 0 30px;font-size:13.5px;font-weight:700;color:#616161;background:#FAFAFA;}
  .tr.hit{background:#FEF9C3;}
  .pub{font-size:12.5px;font-weight:800;border-radius:6px;padding:1px 7px;justify-self:start;}
  .p1{background:#DCFCE7;color:#166534;} .p2{background:#E0E7FF;color:#3730A3;}
  .tool{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#FFFBEB;border:2px solid #F59E0B;border-radius:12px;padding:7px 12px;}
  .tool svg{flex:0 0 64px;width:64px;height:48px;}
  .tool .t{font-size:16.5px;font-weight:900;color:#78350F;line-height:1.35;}
  .tool .t small{display:block;font-size:14.5px;font-weight:700;color:#92400E;}
  .nextbar{flex:0 0 auto;margin:10px 18px 22px;display:flex;align-items:center;gap:12px;background:var(--cs-bg);border:2px solid var(--cs-line);
    border-radius:12px;padding:8px 18px;font-size:19px;font-weight:900;color:var(--cs-dark);}
  .nextbar .msi{width:28px;height:28px;}
  .src2{position:absolute;left:20px;bottom:5px;font-size:11.5px;font-weight:500;color:#9CA3AF;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const TOOL=`<svg viewBox="0 0 64 48"><rect x="2" y="6" width="38" height="36" rx="4" fill="#fff" stroke="#0F6CBD" stroke-width="2"/>${[0,1,2].map(i=>`<rect x="7" y="${13+i*9}" width="28" height="5" fill="${i===2?'#BBF7D0':'#E5E7EB'}"/>`).join('')}
  <path d="M44 24 h14" stroke="#F59E0B" stroke-width="3"/><path d="M54 18 l7 6 l-7 6z" fill="#F59E0B"/><text x="51" y="44" text-anchor="middle" font-size="12" font-weight="900" fill="#F59E0B">⚡</text></svg>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.20</div>
    <div class="part-pill">作り方 <b>(3/4)</b></div>
    <div class="title-text">指示に<span class="q">聞くことと判定</span>、<br>ナレッジに<span class="q">エージェント一覧</span></div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/lists.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_laptop_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">作り方</div>
    <div class="txt">受付のエージェントは、<b>指示</b>と<b>SharePoint リストのナレッジ</b>だけで作れる。<br>
      専門チームへ回す相談は、ツールで<em>リストに記録</em>しておくと取りこぼさない。</div>
  </div>

  <div class="body">
    <div class="col c1">
      <div class="sh"><span class="n">1</span>「指示」に書く<small>作成タブの指示欄</small></div>
      <div class="win seg">
        <div class="wh"><img class="msi" src="${A}icons/cs_logo.png" alt="" style="width:20px;height:20px"><span class="tt">エージェント作成の相談窓口 ＞ 指示</span></div>
        <div class="ins">
          <div class="ln"><i>役割</i><span>社内でエージェントを作りたい人の相談に乗る。</span></div>
          <div class="ln"><i>聞く</i><span>だれが使うか・使う資料・書き込みの有無を<mark>1つずつ</mark>聞く。</span></div>
          <div class="ln k"><i>照合</i><span>ナレッジの<mark>エージェント一覧</mark>に似た用途があれば、名前と部署を紹介。</span></div>
          <div class="ln"><i>判定</i><span>部署内で資料を読むだけなら、作り方の動画のリンクを渡す。</span></div>
          <div class="ln"><i>判定</i><span>全社公開・書き込み・認証が要るなら、専門チームへの相談を勧める。</span></div>
        </div>
      </div>
      <div class="test seg">
        <span class="lb">右のテストで確かめる</span>
        <span class="u">経費の質問に答えるAIを作りたい</span>
        <span class="b"><mark>経費の質問窓口</mark>（経理部・全社公開）がすでにあります。</span>
        <span class="u">部署の20人で、規程のPDFだけです</span>
        <span class="b">それなら<mark>自分で作れます</mark>。作り方の動画はこちらです。</span>
      </div>
    </div>
    <div class="col c2">
      <div class="sh"><span class="n">2</span>ナレッジに一覧リスト<small>ナレッジの追加 → SharePoint</small></div>
      <div class="spl win seg">
        <div class="lh"><img class="msi" src="${A}icons/ms/lists.svg" alt="" style="width:22px;height:22px">社内エージェント一覧</div>
        <div class="tbl">
          <div class="tr h"><span>名前</span><span>部署</span><span>用途</span><span>公開</span></div>
          <div class="tr hit"><span>経費の質問窓口</span><span>経理部</span><span>経費規程に答える</span><span class="pub p1">全社</span></div>
          <div class="tr"><span>引き継ぎ係</span><span>経理部</span><span>手順書に答える</span><span class="pub p2">部署</span></div>
          <div class="tr"><span>PCトラブル受付</span><span>情シス</span><span>故障の受付</span><span class="pub p1">全社</span></div>
          <div class="tr"><span>入社手続き案内</span><span>人事部</span><span>入社の流れ</span><span class="pub p1">全社</span></div>
        </div>
      </div>
      <div class="tool">${TOOL}<span class="t">3　ツールで相談を記録<small>専門チームへ回す相談を「相談記録」リストへ</small></span></div>
    </div>
  </div>

  <div class="nextbar"><img class="msi" src="${A}icons/ms/agent.png" alt="">→ 一覧リストに入れておく列と、使う前の注意は4枚目へ</div>
  <div class="src2">出典：Microsoft Learn（SharePoint をナレッジとして追加する／ツールを追加する）／画面・データは説明用の再現</div>
`;
</script>
</body>
</html>
