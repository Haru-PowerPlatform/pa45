<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.14-2 未発行だと、こう見える</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:13px;}
  .left{flex:1.42;min-height:0;display:flex;flex-direction:column;gap:9px;}
  .left .dlg:first-child{flex:1.6;}
  .right{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}

  .dlg{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--segline);
    border-radius:10px;overflow:hidden;box-shadow:0 5px 12px rgba(0,0,0,.14);}
  .dlg .dh4{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:6px 11px;background:#F3F2F1;
    border-bottom:1px solid #E1DFDD;font-size:14px;font-weight:700;color:#242424;}
  .dlg .dh4 .rf{margin-left:auto;display:flex;align-items:center;gap:5px;border:1px solid #8A8886;border-radius:3px;
    padding:2px 10px;font-size:12.5px;font-weight:700;color:#242424;}
  .dlg .tabs3{flex:0 0 auto;display:flex;gap:0;padding:0 11px;background:#fff;border-bottom:1px solid #E1DFDD;}
  .dlg .tabs3 span{padding:5px 11px;font-size:13px;font-weight:700;color:#616161;}
  .dlg .tabs3 span.on{color:var(--cs);border-bottom:2.5px solid var(--cs);}
  .dlg .db4{flex:1;min-height:0;padding:6px 11px;display:flex;flex-direction:column;gap:4px;}
  .li2{display:flex;align-items:center;gap:9px;border:1px solid #E1DFDD;border-radius:6px;padding:4px 10px;
    font-size:14px;font-weight:700;color:#242424;}
  .li2 .ic2{flex:0 0 auto;width:20px;height:20px;border-radius:5px;background:#EDE9FE;}
  .li2 .nm6{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .li2 .np{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#A19F9D;}
  .li2 .add2{flex:0 0 auto;border:1px solid #8A8886;border-radius:3px;padding:2px 12px;font-size:12.5px;font-weight:700;}
  .li2.dis{color:#A19F9D;background:#FAF9F8;}
  .li2.dis .ic2{background:#EDEBE9;} .li2.dis .add2{color:#C8C6C4;border-color:#D6D4D2;}
  .li2.ok .add2{background:var(--cs);border-color:var(--cs);color:#fff;}
  .nonew{display:flex;align-items:center;gap:8px;background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:7px;
    padding:5px 10px;font-size:13.5px;font-weight:900;color:#9A3412;font-family:"Noto Sans JP",sans-serif;}

  .cant{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .ci2{flex:1;min-height:0;display:flex;align-items:center;gap:10px;background:#fff;border:1.8px solid var(--red-line);
    border-left:6px solid var(--red);border-radius:9px;padding:5px 12px;box-shadow:0 2px 5px rgba(20,40,90,.08);}
  .ci2 .xx{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;
    font-weight:900;display:flex;align-items:center;justify-content:center;}
  .ci2 .ct2{flex:1;font-size:16px;font-weight:900;color:var(--navy);line-height:1.22;}
  .fixed{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#EAF9F1;border:2px solid var(--green);
    border-radius:10px;padding:8px 12px;}
  .fixed .ok2{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:14px;
    font-weight:900;display:flex;align-items:center;justify-content:center;}
  .fixed .ft4{flex:1;font-size:16px;font-weight:900;color:var(--green-dark);line-height:1.26;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.14</div>
    <div class="part-pill">後編 <b>(2/2)</b></div>
    <div class="title-text">未発行だと、<br>画面ではこう見える<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">未発行のものは<b>薄く表示されて押せません</b>。<br>
      発行した直後も一覧に出ないことがあり、<em>Refresh で出てきます</em>。</div>
  </div>

  <div class="body">
    <div class="left">
      <div class="dlg seg">
        <div class="dh4">ツールの追加</div>
        <div class="tabs3"><span>Featured</span><span>MCP</span><span>Connectors</span>
          <span class="on">Workflows</span></div>
        <div class="db4">
          <div class="li2 dis"><span class="ic2"></span><span class="nm6">無題</span>
            <span class="np">(Not published)</span><span class="add2">Add</span></div>
          <div class="li2 dis"><span class="ic2"></span><span class="nm6">問い合わせを記録する</span>
            <span class="np">(Not published)</span><span class="add2">Add</span></div>
          <div class="li2 ok"><span class="ic2"></span><span class="nm6">問い合わせを記録する（発行済）</span>
            <span class="add2">Add</span></div>
          <div class="nonew">この画面に「新規作成」はありません</div>
        </div>
      </div>

      <div class="dlg seg">
        <div class="dh4">Add a connected agent
          <span class="rf">↻ Refresh</span></div>
        <div class="db4">
          <div class="li2 dis"><span class="ic2"></span><span class="nm6">経理AI</span>
            <span class="np">still drafts</span><span class="add2">Add</span></div>
          <div class="li2 ok"><span class="ic2"></span><span class="nm6">総務AI</span>
            <span class="add2">Add</span></div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="cant">
        <div class="ci2"><span class="xx">✕</span><span class="ct2">道具として選べない</span></div>
        <div class="ci2"><span class="xx">✕</span><span class="ct2">取り次ぎ先に出てこない</span></div>
        <div class="ci2"><span class="xx">✕</span><span class="ct2">チャネルを追加できない</span></div>
        <div class="ci2"><span class="xx">✕</span><span class="ct2">Monitorに数字が出ない</span></div>
      </div>
      <div class="fixed"><span class="ok2">✓</span>
        <span class="ft4">発行したのに出ないときは、<br>Refresh を押すと選べるようになる</span></div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">つまずいたら見るところ</div>
      <div class="grid">
        <div class="fc"><div class="ft">① 薄い＝未発行</div><div class="fd">押せない行には (Not published) や still drafts が付いている</div></div>
        <div class="fc"><div class="ft">② この画面では作れない</div><div class="fd">ツールの追加からフローは新規作成できない。先に作る</div></div>
        <div class="fc"><div class="ft">③ Refreshを押す</div><div class="fd">発行直後は一覧が古いまま。更新すると出てくる</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ Teamsの一覧</div>
      <div class="txt">Teams側の一覧では、名前ではなく<b>GUIDで表示される</b><br>
        ことがあります。見つからなくても慌てない。</div>
    </div>
    <div class="src">出典：PA45 Demo環境での実機（表示は実際に出た文言）／画面は説明用の再現です</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_laptop_g.png" alt="">
`;
</script>
</body>
</html>
