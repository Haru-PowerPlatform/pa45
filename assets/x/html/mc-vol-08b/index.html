<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.8-2 ふつうのチャットとResearcherの使い分けと、頼み方の早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  /* 型E：早見表（左に開く場所のモック／右に使い分けと頼み方）*/
  .stage{gap:12px;}
  .lft{flex:0 0 380px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .rgt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;min-height:0;}
  .hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-size:22px;font-weight:900;color:var(--mc-dark);}
  .hd .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;background:linear-gradient(180deg,#14B8A6,#0F766E);box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .app{flex:1;min-height:0;display:flex;background:#fff;border:2px solid var(--mc-line);border-radius:12px;overflow:hidden;box-shadow:0 5px 12px rgba(15,60,55,.14);}
  .nav{flex:0 0 128px;display:flex;flex-direction:column;gap:6px;padding:9px 8px;background:#F3F2F1;border-right:1px solid #E1DFDD;}
  .nav .it{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:800;color:#242424;padding:4px 6px;border-radius:7px;}
  .nav .it svg{width:20px;height:20px;flex:0 0 auto;}
  .nav .sec{font-size:13.5px;font-weight:900;color:#6B7280;margin-top:6px;padding-left:6px;}
  .nav .on{background:#FFFBEB;outline:2.5px solid #F59E0B;color:#92400E;font-weight:900;}
  .nav .ph{height:10px;border-radius:5px;background:#D6D3D1;margin:5px 6px;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding:9px 10px;}
  .main .tt{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;color:#1B2A44;}
  .ask{background:#E8F4F2;border:1.5px solid #A7E3D8;border-radius:10px 10px 3px 10px;padding:5px 9px;font-size:15px;font-weight:700;color:#1B2A44;line-height:1.38;font-family:"Noto Sans JP",sans-serif;}
  .ask .el{display:block;font-size:13px;font-weight:900;color:var(--mc);}
  .q{background:#FFFBEB;border:2px solid #F59E0B;border-radius:3px 10px 10px 10px;padding:5px 9px;font-size:15px;font-weight:700;color:#1B2A44;line-height:1.38;font-family:"Noto Sans JP",sans-serif;}
  .q .el{display:block;font-size:13px;font-weight:900;color:#B45309;}
  .mini{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:6px;border:2px solid #16A34A;border-radius:9px;padding:6px 8px;background:#fff;}
  .mini .ml{width:100%;font-size:13.5px;font-weight:900;color:#065F46;}
  .mini .mr{flex:1;min-width:70px;display:flex;flex-direction:column;gap:6px;}
  .mini .mr b{display:block;height:7px;border-radius:4px;background:#CBD5E1;}
  .mini .cite{font-size:13.5px;font-weight:900;color:#1E3A8A;background:#DBEAFE;border-radius:999px;padding:1px 8px;}
  .box{margin-top:auto;display:flex;align-items:center;border:1.5px solid #C7C7C7;border-radius:8px;padding:7px 9px;font-size:14.5px;color:#9CA3AF;font-weight:700;}
  .lcap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.35;border-radius:9px;padding:7px 11px;color:var(--mc-dark);background:#D5F3EE;}
  .lcap b{color:var(--orange);}
  .grp{flex:0 0 auto;font-size:14.5px;font-weight:900;color:#fff;background:var(--mc);border-radius:999px;padding:2px 12px;align-self:flex-start;}
  .grp.o{background:#C2410C;}
  .trow{gap:10px;padding:3px 6px 3px 10px;}
  .trow .ico{flex:0 0 auto;width:42px;height:42px;border-radius:10px;background:#CCFBF1;display:flex;align-items:center;justify-content:center;padding:5px;}
  .trow .ico svg{width:30px;height:30px;}
  .trow .k{flex:1.4;font-size:16.5px;line-height:1.28;}
  .trow .v{flex:0 0 232px;display:flex;align-items:center;gap:7px;font-size:16px;font-weight:900;}
  .trow .v.rs{background:#FFF7ED;color:#9A3412;border:1.5px solid #FDBA74;}
  .trow.tip .k{flex:0 0 190px;}
  .trow.tip .v{flex:1;font-weight:700;font-size:15.5px;background:#fff;border:1.5px solid #99E2D6;color:#134E4A;line-height:1.3;}
  .warnbar .ws span b{color:#B91C1C;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const sv=(p,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#242424'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/>',loop:'<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  scope:'<rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/>',qa:'<path d="M4 5h16v10H9l-5 4z"/><path d="M10 9a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.3"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const RS=`${CPI(22)}Researcher`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills">
      <div class="vol-pill"><small>M365 Copilot</small>Vol.8-2</div>
      <div class="lic-pill paid">M365 Copilot ライセンスが要る</div>
    </div>
    <div class="title-text">ふつうのチャットと<span class="hl">Researcherの<br>使い分け</span>と、頼み方の早見表</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">Researcher は時間をかけて調べるぶん、すぐ終わる用事には向きません。<br>迷ったら、<b>人に見せるレポートが要るか</b>で分けます</div>
  </div>

  <div class="stage">
    <div class="lft">
      <div class="hd"><span class="n">1</span>エージェント から開く</div>
      <div class="app seg">
        <div class="nav">
          <div class="it">${sv(P.chat)}チャット</div>
          <div class="sec">エージェント</div>
          <div class="it on">${CPI(20)}Researcher</div>
          <div class="ph" style="width:70%"></div><div class="ph" style="width:55%"></div><div class="ph" style="width:64%"></div>
        </div>
        <div class="main">
          <div class="tt">${CPI(24)}Researcher</div>
          <div class="ask"><span class="el">具体的に・範囲も書く</span>展示会の候補を<br>3つ比べて。<br>社内の出展報告と<br>公式情報で。</div>
          <div class="q"><span class="el">確認の質問が来たら答える</span>比べる観点は<br>どれにしますか？</div>
          <div class="mini"><span class="ml">返ってくるもの</span><div class="mr"><b style="width:70%"></b><b style="width:90%"></b><b style="width:60%"></b></div><svg viewBox="0 0 60 40" style="width:60px;height:40px"><rect x="6" y="18" width="12" height="18" rx="2" fill="#0F766E"/><rect x="24" y="24" width="12" height="12" rx="2" fill="#14B8A6"/><rect x="42" y="8" width="12" height="28" rx="2" fill="#22C55E"/></svg><span class="cite">出典つき・図つき</span></div>
          
        </div>
      </div>
      <div class="lcap">Copilot アプリのチャットで、<br><b>エージェント</b> の中の <b>Researcher</b> を選ぶ</div>
    </div>

    <div class="rgt">
      <div class="hd"><span class="n">2</span>どちらで頼むか</div>
      <span class="grp">公式の使い分け</span>
      <div class="tbl" style="flex:4">
        <div class="trow"><span class="ico">${sv(P.bolt,'#0F766E')}</span><span class="k">すぐ欲しい要約、短い返信、軽いアイデア出し</span><span class="v">${sv(P.chat,'#134E4A').replace('<svg','<svg style="width:22px;height:22px;flex:0 0 auto"')}ふつうのチャット</span></div>
        <div class="trow"><span class="ico">${sv(P.loop,'#0F766E')}</span><span class="k">やり取りは重ねるが、重い分析ではない</span><span class="v">${sv(P.chat,'#134E4A').replace('<svg','<svg style="width:22px;height:22px;flex:0 0 auto"')}ふつうのチャット</span></div>
        <div class="trow"><span class="ico" style="background:#FED7AA">${sv(P.layers,'#9A3412')}</span><span class="k">Web と社内の情報をまたいで考え、共有できるレポートにしたい</span><span class="v rs">${RS}</span></div>
        <div class="trow"><span class="ico" style="background:#FED7AA">${sv(P.doc,'#9A3412')}</span><span class="k">出典つき、見出し・箇条書き・図で、説明や判断に使いたい</span><span class="v rs">${RS}</span></div>
      </div>
      <span class="grp o">Researcher の頼み方</span>
      <div class="tbl" style="flex:3">
        <div class="trow tip"><span class="ico">${sv(P.target,'#0F766E')}</span><span class="k">具体的に書く</span><span class="v">何を・いくつ・何のために比べるかまで書く</span></div>
        <div class="trow tip"><span class="ico">${sv(P.scope,'#0F766E')}</span><span class="k">範囲を決める</span><span class="v">社内の資料か、Web か、両方か</span></div>
        <div class="trow tip"><span class="ico">${sv(P.qa,'#0F766E')}</span><span class="k">確認の質問に答える</span><span class="v">ここで観点や期間を絞ると、レポートの的が合う</span></div>
      </div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws">
      <span>使う人ごとに <b>M365 Copilot ライセンス</b></span>
      <span>見られるのは自分に権限がある社内の情報だけ</span>
      <span>共有する前に、出典を開いて数字を確かめる</span>
    </span>
  </div>
  <div class="src">出典：Microsoft Learn「What is Researcher Agent in Microsoft Copilot?」「Microsoft Copilot service description」／画面は説明用の再現、頼み方の文は架空の例</div>
`;
</script>
</body>
</html>
