<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.6-1 休み明けのTeamsチャット、見逃したことと自分あての依頼を先に拾う</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  /* 型A：Before/After（未読80件のチャネル → チャットの右に Copilot、見逃したことと自分あての依頼）*/
  .stage{gap:10px;}
  .col.bad{flex:0 0 392px;}
  .col.good{flex:1;min-width:0;}
  .sc{flex:0 0 132px;position:relative;border-radius:10px;overflow:hidden;background:#FCE4E4;}
  .sc svg{position:absolute;inset:0;width:100%;height:100%;}
  .sc .ch{position:absolute;right:4px;bottom:0;height:126px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
  .tm{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--red-line);border-radius:10px;overflow:hidden;}
  .tm .th{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#EBEBF7;border-bottom:1px solid #E1DFDD;font-size:15px;font-weight:700;color:#242424;}
  .tm .th .cnt{margin-left:auto;font-family:"Noto Sans JP",sans-serif;font-size:13.5px;font-weight:900;color:#fff;background:#DC2626;border-radius:999px;padding:1px 9px;}
  .po{flex:1;min-height:0;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #EFEDEB;}
  .po .av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;color:#fff;font-size:13.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .po .tx{flex:1;min-width:0;font-size:15px;font-weight:600;color:#424242;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .po .rp{flex:0 0 auto;font-size:13.5px;font-weight:800;color:#5B5FC7;}
  .po.more{justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:15px;font-weight:900;color:#991B1B;background:#FEF2F2;border-bottom:none;}
  .badline{flex:0 0 auto;background:#DC2626;color:#fff;border-radius:8px;padding:6px 10px;font-size:16px;font-weight:900;line-height:1.3;}

  .eng{flex:0 0 100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .eng .pill{font-size:14.5px;font-weight:900;color:#fff;background:var(--mc);border-radius:999px;padding:3px 10px;white-space:nowrap;}
  .eng .lb{font-size:15.5px;font-weight:900;color:var(--mc-dark);text-align:center;line-height:1.35;}
  .eng .ar{width:88px;height:28px;}

  .pane{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--green-line);border-radius:10px;overflow:hidden;box-shadow:0 3px 8px rgba(20,90,60,.12);}
  .pane .phd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 11px;background:#EBEBF7;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;color:#242424;}
  .pane .phd .op{display:flex;align-items:center;gap:5px;background:#fff;border-radius:6px;padding:2px 9px;font-size:14.5px;font-weight:800;box-shadow:0 0 0 3px #F59E0B;}
  .pane .pb{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 11px;}
  .ask{align-self:flex-end;max-width:90%;background:#E8EBFA;border:1.5px solid #C5CAF2;border-radius:12px 12px 3px 12px;padding:5px 11px;
    font-size:16px;font-weight:700;color:#1B2A44;line-height:1.4;font-family:"Noto Sans JP",sans-serif;}
  .ask .el{display:block;font-size:13px;font-weight:900;color:#5B5FC7;}
  .ans{flex:1;min-height:0;display:flex;flex-direction:column;background:#FAFAFA;border:1.5px solid #E1DFDD;border-radius:12px 12px 12px 3px;padding:5px 11px;font-family:"Noto Sans JP",sans-serif;}
  .li{flex:1;display:flex;align-items:center;gap:9px;border-bottom:1.2px dashed #E5E7EB;}
  .li:last-child{border-bottom:none;}
  .li .tg{flex:0 0 96px;text-align:center;font-size:14px;font-weight:900;border-radius:6px;padding:2px 0;color:#fff;background:var(--mc);}
  .li .tg.w{background:#D97706;} .li .tg.me{background:#DC2626;}
  .li .tx{flex:1;font-size:16px;font-weight:700;color:#1B2A44;line-height:1.3;}
  .li .tx b{color:#B91C1C;}
  .li .ref{flex:0 0 auto;font-size:12.5px;font-weight:900;color:#5B5FC7;border:1.5px solid #C5CAF2;border-radius:999px;padding:0 6px;}
  .bot{flex:0 0 auto;display:flex;gap:8px;align-items:stretch;}
  .bot .uses{flex:1;background:#fff;border:1.5px solid #CFEFE0;border-radius:10px;padding:4px 9px;}
  .metric .mv{font-size:23px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;

/* Before：チャットの吹き出しが大量に降り積もる＋カレンダーに3日の休み */
const bub=(x,y,w,c)=>`<g transform="translate(${x} ${y})" filter="url(#bf)"><rect width="${w}" height="22" rx="9" fill="${c}" stroke="#C5CAF2" stroke-width="1"/>
  <rect x="8" y="8" width="${w-22}" height="6" rx="3" fill="#C7CBE8"/></g>`;
const sBad=`<svg viewBox="0 0 368 132" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="bf" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#3730A3" flood-opacity=".22"/></filter></defs>
  <rect width="368" height="132" fill="#FCE4E4"/>
  ${[[96,8,70,'#fff'],[170,10,58,'#EEF0FB'],[120,34,80,'#EEF0FB'],[204,36,52,'#fff'],[90,60,62,'#fff'],[156,62,74,'#EEF0FB'],[106,86,88,'#EEF0FB'],[198,88,50,'#fff'],[92,110,60,'#fff'],[156,108,90,'#EEF0FB']].map(b=>bub(...b)).join('')}
  <g transform="translate(10 18)" filter="url(#bf)"><rect width="70" height="74" rx="7" fill="#fff" stroke="#C98585" stroke-width="1.5"/><rect width="70" height="18" rx="7" fill="#DC2626"/><rect y="11" width="70" height="7" fill="#DC2626"/>
  <text x="35" y="14" text-anchor="middle" font-family="Noto Sans JP" font-size="11" font-weight="900" fill="#fff">休み</text>
  ${[0,1,2].map(i=>`<path d="M${10+i*20} ${34} l12 22 M${22+i*20} 34 l-12 22" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>`).join('')}
  <text x="35" y="70" text-anchor="middle" font-family="Noto Sans JP" font-size="10.5" font-weight="900" fill="#991B1B">3日間</text></g>
  <rect x="10" y="100" width="76" height="24" rx="12" fill="#DC2626"/><text x="48" y="117" text-anchor="middle" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#fff">未読80件</text>
</svg>`;
const ARR=`<svg class="ar" viewBox="0 0 88 28" xmlns="http://www.w3.org/2000/svg"><path d="M4 14 H 70" stroke="#0F766E" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M64 4 L 80 14 L 64 24" fill="none" stroke="#0F766E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const av=(t,c)=>`<span class="av" style="background:${c}">${t}</span>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills">
      <div class="vol-pill"><small>M365 Copilot</small>Vol.6-1</div>
      <div class="lic-pill paid">M365 Copilot ライセンスが要る</div>
    </div>
    <div class="title-text">休み明けのTeamsチャット、<span class="hl">見逃したことと<br>自分あての依頼</span>を先に拾う</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/teams.svg" alt=""><span class="pl">＋</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip app"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:34px;height:34px"></div>
    <div class="txt">チャットの右上の<b>［Copilot を開く］</b>で、見逃したことの要約を頼む。<br>続けて<b>自分あての依頼</b>を聞けば、休み明けに最初に返す相手が先に分かります</div>
  </div>

  <div class="stage">
    <div class="col bad">
      <div class="ph"><span class="mk">${svgw(P.x,3.2)}</span>上から全部読むと</div>
      <div class="sc">${sBad}<img class="ch" src="${A}chara/chara_cry.png" alt=""></div>
      <div class="tm seg">
        <div class="th"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:24px;height:24px">新製品プロジェクト<span class="cnt">未読 80</span></div>
        <div class="po">${av('山','#2563EB')}<span class="tx">試作の日程、1日ずらせますか</span><span class="rp">返信 12</span></div>
        <div class="po">${av('佐','#DB2777')}<span class="tx">見積の最新版をアップしました</span><span class="rp">返信 4</span></div>
        <div class="po">${av('鈴','#059669')}<span class="tx">展示会のブース、どれにしますか</span><span class="rp">返信 21</span></div>
        <div class="po">${av('田','#7C3AED')}<span class="tx">お客様からの質問の件です</span><span class="rp">返信 9</span></div>
        <div class="po more">返信を合わせて、未読が80件</div>
      </div>
      <div class="badline">✕ 自分が返すべき1件が埋もれる</div>
    </div>

    <div class="eng">
      <img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:80px;height:80px;filter:drop-shadow(0 3px 4px rgba(19,78,74,.3))">
      <div class="pill">2文で聞く</div>
      <div class="lb">見逃したこと<br>↓<br>自分あて</div>
      ${ARR}
    </div>

    <div class="col good">
      <div class="ph"><span class="mk">${svgw(P.ok,3.2)}</span>Copilot に先に聞くと</div>
      <div class="pane seg">
        <div class="phd"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:24px;height:24px">チャット<span class="op">${CPI(20)}Copilot を開く</span><span class="repro">画面は説明用の再現</span></div>
        <div class="pb">
          <div class="ask"><span class="el">公式の例文</span>私が見逃したことを要約してください。</div>
          <div class="ans">
            <div class="li"><span class="tg">決まった</span><span class="tx">展示会のブースは <b>Bプラン</b> に決定</span><span class="ref">1</span></div>
            <div class="li"><span class="tg w">変わった</span><span class="tx">試作の日程は <b>11/6 → 11/7</b></span><span class="ref">2</span></div>
          </div>
          <div class="ask"><span class="el">続けて自分で入力</span>この中で、私あての依頼はありますか？</div>
          <div class="ans">
            <div class="li"><span class="tg me">あなたへ</span><span class="tx">見積の最新版の確認（佐藤さん・<b>今日中</b>）</span><span class="ref">3</span></div>
            <div class="li"><span class="tg me">あなたへ</span><span class="tx">お客様の質問への回答案（田中さん）</span><span class="ref">4</span></div>
          </div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">最初に読むもの</span><span class="mv">未読80件</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">4行</span></div>
        <div class="uses"><span class="ul">使いどころ</span><span class="u">休み明け</span><span class="u">出張帰り</span><span class="u">チャネルで回るチーム</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>チャット・チャネル・スレッドで開く場所が違います。<b>早見表は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft サポート「Teams のチャットとチャネルで Microsoft Copilot を使用する方法」／Microsoft Learn「Overview of AI in Microsoft Teams」／画面は説明用の再現、人名・投稿・回答は架空</div>
`;
</script>
</body>
</html>
