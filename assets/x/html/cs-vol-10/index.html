<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.10-1 読むのはタダ、動かすと課金</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:0;align-items:stretch;}
  .side{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;border-radius:14px;padding:11px 14px 13px;
    box-shadow:0 6px 14px rgba(0,0,0,.12);}
  .side.free{background:var(--green-bg);border:2px solid var(--green-line);}
  .side.paid{background:#FFF7ED;border:2px solid #FDBA74;}
  .side .hd2{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;line-height:1.16;}
  .side.free .hd2{color:var(--green-dark);} .side.paid .hd2{color:#9A3412;}
  .side .hd2 .mk3{flex:0 0 auto;width:36px;height:36px;border-radius:50%;color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:19px;font-weight:900;}
  .side.free .hd2 .mk3{background:linear-gradient(180deg,#34D399,#16A34A);}
  .side.paid .hd2 .mk3{background:linear-gradient(180deg,#FB923C,#EA580C);}
  .acts{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;}
  .act2{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3px;background:#fff;
    border:1.8px solid #DDE5F0;border-radius:10px;padding:7px 12px;box-shadow:0 2px 5px rgba(20,40,90,.08);}
  .side.free .act2{border-left:6px solid #16A34A;}
  .side.paid .act2{border-left:6px solid #EA580C;}
  .act2 .an4{font-size:18.5px;font-weight:900;color:var(--navy);line-height:1.2;}
  .act2 .ad{font-size:14.5px;font-weight:700;color:#475569;line-height:1.34;}
  .side .memo{flex:0 0 auto;border-radius:9px;padding:7px 11px;font-size:14px;font-weight:700;line-height:1.4;}
  .side.free .memo{background:#D6F5E3;color:var(--green-dark);}
  .side.paid .memo{background:#FFEDD5;color:#9A3412;}
  .side .memo b{color:#DC2626;}

  .wall{flex:0 0 128px;position:relative;display:flex;align-items:center;justify-content:center;margin:0 -2px;}
  .wall svg{position:absolute;inset:0;width:100%;height:100%;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";

/* 境目のレンガの壁＋コイン */
const wall=`<svg viewBox="0 0 128 470" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B45309"/><stop offset=".5" stop-color="#D97706"/><stop offset="1" stop-color="#B45309"/></linearGradient>
    <linearGradient id="co" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  </defs>
  <rect x="30" y="0" width="68" height="470" fill="url(#br)"/>
  ${Array.from({length:16},(_,i)=>`<g stroke="#8B4513" stroke-width="2" opacity=".55">
    <path d="M30 ${i*30} H 98"/><path d="M${i%2?64:48} ${i*30} v30"/></g>`).join('')}
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.10</div>
    <div class="part-pill">前編 <b>(1/2)</b></div>
    <div class="title-text">読むのはタダ、<br>動かすと課金<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_confident_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">課金の境目は<b>「答える」と「動く」の間</b>にあります。<br>
      調べて答えるところは条件しだいで無料、<em>ツールやフローを実行すると消費します</em>。</div>
  </div>

  <div class="body">
    <div class="side free">
      <div class="hd2"><span class="mk3">読</span>聞く・調べる・答える</div>
      <div class="acts">
        <div class="act2"><span class="an4">生成AIの回答</span>
          <span class="ad">ふつうに会話して、文章で返してもらう</span></div>
        <div class="act2"><span class="an4">ナレッジの検索</span>
          <span class="ad">追加した社内文書を読んで、根拠つきで答える</span></div>
        <div class="act2"><span class="an4">テナントの情報を根拠にする</span>
          <span class="ad">SharePointなど、組織の中の情報をもとに答える</span></div>
      </div>
      <div class="memo">Microsoft 365 Copilot ライセンスを持つ人が
        Copilot Chat／Teams／SharePoint で使う場合は、メーターに載りません（公式）</div>
    </div>

    <div class="wall">${wall}</div>

    <div class="side paid">
      <div class="hd2"><span class="mk3">動</span>実際に動かす</div>
      <div class="acts">
        <div class="act2"><span class="an4">ツールの実行</span>
          <span class="ad">メールを送る・台帳に書くなど、外に手を出す</span></div>
        <div class="act2"><span class="an4">フローの実行</span>
          <span class="ad">つないだ Power Automate のフローを呼び出す</span></div>
        <div class="act2"><span class="an4">自律トリガー</span>
          <span class="ad">人が話しかけなくても、条件で自分から動き出す</span></div>
      </div>
      <div class="memo">Computer use は<b>1ステップ5クレジット</b>、
        上位モデルを使うと<b>15クレジット</b></div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">先に決めておくと迷わないこと</div>
      <div class="grid">
        <div class="fc"><div class="ft">① 答えるだけか</div><div class="fd">案内やFAQなら、動かす部分が無いので費用が読みやすい</div></div>
        <div class="fc"><div class="ft">② 動かすのはどこか</div><div class="fd">送信・記録・呼び出しを、必要な場面だけに絞る</div></div>
        <div class="fc"><div class="ft">③ 残量を見る場所</div><div class="fd">管理センター ＞ ライセンス ＞ 容量 ＞ アドオン</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 足りないとどうなるか</div>
      <div class="txt">回答は<b>ふつうに返ってきます</b>。<br>
        でもツールだけ落ちて、記録が残りません。実機は<b>後編</b>で。</div>
    </div>
    <div class="src">出典：Microsoft Learn（Copilot Studio のライセンス／メッセージ）＋PA45 Demo環境での実機</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_think_g.png" alt="">
`;
</script>
</body>
</html>
