<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.123-2 日報まとめの作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:6px;padding:7px 9px;}
  .cardh{font-size:15px;}
  .col.ai{background:#F7F3FF;border:2.5px solid #C9B4F4;}
  .col.ai .ch2{color:#5B21B6;}
  .col.ai .ch2 .n{background:linear-gradient(180deg,#A78BFA,#6D28D9);}
  .col.ai .card{border-color:#C9B4F4;}
  .col.ai .cardh{background:#EDE4FF;border-bottom-color:#D8C9FA;color:#5B21B6;}
  .col.ai .cap{background:#E4D8FA;color:#5B21B6;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:4px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.3;}
  .fld .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .fld .fi.code{font-family:'Roboto Mono',monospace;font-size:15.5px;color:#1E40AF;word-break:break-all;}
  .rc{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;}
  .rc .fl{font-size:14px;font-weight:900;color:#475569;white-space:nowrap;}
  .rc .fi{background:#fff;border:2px solid #B9C7DC;border-radius:7px;padding:2px 9px;font-size:15.5px;font-weight:900;color:var(--navy);}
  .rc .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .rc3{display:grid;grid-template-columns:.7fr 1fr 1.25fr;gap:2px 6px;}
  .rc3 .fl{font-size:14px;font-weight:900;color:#475569;white-space:nowrap;}
  .rc3 .fi{background:#fff;border:2px solid #B9C7DC;border-radius:7px;padding:2px 9px;font-size:15.5px;font-weight:900;color:var(--navy);}
  .rc3 .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .sub{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900;color:#334155;border-top:1.5px solid #E5E7EB;padding-top:5px;}
  .sub img{width:24px;height:24px;object-fit:contain;flex:0 0 auto;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.3;}
  .pr{background:#fff;border:2px solid #C9B4F4;border-radius:8px;padding:6px 9px;font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.42;}
  .pr .k{display:block;font-size:14px;font-weight:900;color:#7C3AED;margin-bottom:1px;}
  .pr b{color:#B45309;} .pr i{font-style:normal;color:#B91C1C;font-weight:900;}
  .ml{display:flex;flex-direction:column;gap:5px;}
  .pv{display:flex;flex-direction:column;gap:0;background:#fff;border:1.8px dashed #9FD6BC;border-radius:8px;padding:3px 9px;font-size:15px;font-weight:900;line-height:1.35;}
  .pv .g{color:#B45309;} .pv .r{color:#B91C1C;}
  .out{display:flex;align-items:center;gap:8px;background:#F0FDF4;border:1.8px solid #86EFAC;border-radius:8px;padding:3px 9px;
    font-size:15px;font-weight:900;color:#065F46;line-height:1.3;}
  .out img{width:26px;height:26px;object-fit:contain;flex:0 0 auto;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SPARK='<path d="M0 -13l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/><path d="M8.5 4.5l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z"/>';
const SH=(id,c)=>`<filter id="${id}" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="${c||'#1B2A44'}" flood-opacity=".22"/></filter>`;

/* ① 5人×5日の日報 → 1つの文章 */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('m1f')}</defs>
  <rect width="388" height="100" fill="#EDF3FA"/>
  ${['月','火','水','木','金'].map((d,i)=>`<text x="${46+i*30}" y="16" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#475569" text-anchor="middle">${d}</text>`).join('')}
  ${[0,1,2,3,4].map(r=>[0,1,2,3,4].map(c=>`<rect x="${34+c*30}" y="${22+r*15}" width="24" height="11" rx="2.5" fill="#fff" stroke="${['#2563EB','#0891B2','#7C3AED','#16A34A','#EA580C'][r]}" stroke-width="1.8"/>`).join('')).join('')}
  ${['山','佐','鈴','田','高'].map((n,i)=>`<text x="18" y="${31+i*15}" font-family="Noto Sans JP" font-size="11" font-weight="900" fill="#475569" text-anchor="middle">${n}</text>`).join('')}
  <path d="M190 56 H 222" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M216 50 l8 6 l-8 6" fill="none" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#m1f)"><rect x="236" y="14" width="140" height="78" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2.4"/>
    ${[0,1,2,3,4].map(i=>`<rect x="248" y="${26+i*11}" width="${[108,92,116,84,100][i]}" height="4.5" rx="2.2" fill="#BFD3F2"/>`).join('')}
    <text x="306" y="87" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#1E40AF" text-anchor="middle">25件 → 1つの文章</text></g>
</svg>`;

/* ② AIが成果と注意点に分ける */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('m2f','#3B2A66')}<linearGradient id="m2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs>
  <rect width="388" height="100" fill="#F3EEFF"/>
  <g filter="url(#m2f)"><rect x="16" y="14" width="100" height="72" rx="6" fill="#fff" stroke="#B79CF0" stroke-width="2"/>
    ${[0,1,2,3,4,5].map(i=>`<rect x="26" y="${24+i*9.5}" width="${[80,64,76,58,72,50][i]}" height="4" rx="2" fill="#D9CCF6"/>`).join('')}</g>
  <path d="M124 50 H 148" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <g filter="url(#m2f)"><circle cx="176" cy="50" r="25" fill="url(#m2g)"/><g transform="translate(176,50)" fill="#fff">${SPARK}</g></g>
  <path d="M202 42 C 220 22, 232 20, 248 20" stroke="#D97706" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M202 58 C 220 78, 232 80, 248 80" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g filter="url(#m2f)"><rect x="252" y="4" width="128" height="34" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.4"/>
    <text x="316" y="27" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#B45309" text-anchor="middle">★ 成果 3つ</text></g>
  <g filter="url(#m2f)"><rect x="252" y="62" width="128" height="34" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="316" y="85" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#B91C1C" text-anchor="middle">⚠ 注意 2つ＋人数</text></g>
</svg>`;

/* ③ 上長の受信トレイに届く */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>${SH('m3f','#0B5136')}<linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EEF8"/></linearGradient></defs>
  <rect width="388" height="100" fill="#DCF3E7"/>
  <g filter="url(#m3f)"><rect x="22" y="20" width="96" height="62" rx="6" fill="url(#env)" stroke="#7FA6D6" stroke-width="2"/>
    <path d="M22 24 L70 58 L118 24" fill="none" stroke="#7FA6D6" stroke-width="2.4"/>
    <circle cx="112" cy="24" r="12" fill="#DC2626"/><text x="112" y="29" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text></g>
  <path d="M130 52 H 158" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M152 46 l8 6 l-8 6" fill="none" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#m3f)"><rect x="172" y="10" width="200" height="82" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    <text x="184" y="32" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#065F46">今週の日報まとめ</text>
    <text x="184" y="54" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#B45309">★ 成果</text>
    <rect x="232" y="46" width="124" height="5" rx="2.5" fill="#FDE68A"/>
    <text x="184" y="78" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#B91C1C">⚠ 注意</text>
    <rect x="232" y="70" width="96" height="5" rx="2.5" fill="#FECACA"/></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.123-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（金曜に集める → AIが読む → 上長に送る）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">1件ずつではなく、<b>1週間分を1つの文章に束ねて</b>AIに渡すのがコツ。<br>横に並べて読ませるから、何人が同じ話をしているかが分かります</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>金曜に1週間分を集める</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_schedule.png" alt="">繰り返し</div>
        <div class="cardb">
          <div class="rc3"><span class="fl">頻度</span><span class="fl">設定曜日</span><span class="fl">設定時刻（時間）</span>
            <span class="fi">週</span><span class="fi hot">金曜日</span><span class="fi hot">17</span></div>
          <div class="sub"><img src="${A}icons/pa_sharepoint.png" alt="">複数の項目の取得</div>
          <div class="fld"><span class="fl">フィルター クエリ（直近7日）</span><span class="fi code">Created ge '@{addDays(utcNow(),-7)}'</span></div>
          <div class="note">「選択」で氏名・日付・本文を1行に<br>→「結合」で1つの文章にする</div>
        </div>
      </div></div>
      <div class="cap">タイムゾーンは<b>大阪、札幌、東京</b>を選ぶ</div>
    </div>

    <div class="col ai">
      <div class="ch2"><span class="n">2</span>AIに読み分けさせる</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_logo.png" alt="">プロンプトの実行</div>
        <div class="cardb">
          <div class="pr"><span class="k">指示（プロンプトに1回だけ書く）</span>
            <b>今週の成果を3つ</b>、書いた人の名前つきで。<br>
            <i>気になることを2つ</i>、同じ話が<i>何人の日報に出たか</i>を添えて。箇条書きで。</div>
          <div class="fld"><span class="fl">入力（日報）</span><span class="fi hot"><span class="dyn">出力（結合）</span></span></div>
          <div class="note">プロンプト画面での試し実行は無料</div>
        </div>
      </div></div>
      <div class="cap">人数で、<b>1人の困りごとか全体の問題か</b>が分かる</div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>上長に送る</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_outlook.png" alt="">メールの送信 (V2)</div>
        <div class="cardb">
          <div class="ml">
            <div class="rc"><span class="fl">宛先</span><span class="fi">課長のアドレス</span>
              <span class="fl">件名</span><span class="fi">今週の日報まとめ</span>
              <span class="fl">本文</span><span class="fi hot"><span class="dyn">テキスト</span></span></div>
          </div>
          <div class="pv"><span class="g">★ A社の見積が通過（山田）</span><span class="r">⚠ B社の納期遅れ　3人が言及</span></div>
          <div class="out"><img src="${A}icons/pa_teams.png" alt="">Teamsのチャネルに投稿する形でもOK</div>
        </div>
      </div></div>
      <div class="cap">本文は、AIが返す<b>「テキスト」をそのまま</b></div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>AI Builderのクレジットを消費</span><span>2026/11/1以降はCopilotクレジットへ</span>
      <span>件数が多いときは部署ごとに分ける</span><span>人事評価には使わない</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Power Automate でプロンプトを使用する」「ライセンスとAI Builder クレジット」「繰り返しトリガー」／名称は架空</div>
`;
</script>
</body>
</html>
