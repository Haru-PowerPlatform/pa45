<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.98-2 どこで効く？と、1つだけある落とし穴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#065F46;
    --red:#DC2626; --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:12px;min-height:0;}

  .uses{flex:1.24;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;min-height:0;}
  .u{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid #DCE3EE;border-left:7px solid var(--blue);border-radius:11px;padding:8px 11px;min-height:0;box-shadow:0 3px 7px rgba(20,40,90,.07);}
  .u .uic{flex:0 0 auto;width:30px;height:30px;color:var(--blue);}
  .u .ub{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .u .ut{font-size:18.5px;font-weight:900;color:var(--blue-dark);line-height:1.22;}
  .u .ud{font-size:15.5px;font-weight:800;color:#5B6472;line-height:1.32;}
  .u .ue{margin-top:2px;align-self:flex-start;font-size:14px;font-weight:900;color:#475569;background:#F1F5FA;border:1.5px solid #DDE5EF;border-radius:7px;padding:2px 9px;line-height:1.3;}
  .u.v2 .ue{background:#F5F0FD;border-color:#DFD2F5;color:#5B21B6;}
  .u.v3 .ue{background:#EEF9F3;border-color:#C9E8D8;color:#0B5136;}
  .u.v2{border-left-color:var(--violet);} .u.v2 .ut{color:#5B21B6;} .u.v2 .uic{color:var(--violet);}
  .u.v3{border-left-color:var(--green);} .u.v3 .ut{color:var(--green-dark);} .u.v3 .uic{color:var(--green);}

  .side{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0;}

  .pit{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;border:2.5px solid #F0AEAE;border-radius:13px;box-shadow:0 5px 13px rgba(220,38,38,.14);overflow:hidden;}
  .pith{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 12px;background:linear-gradient(90deg,#B91C1C,#DC2626);color:#fff;font-weight:900;font-size:17px;}
  .pith .wic{flex:0 0 auto;width:24px;height:24px;color:#fff;}
  .pitb{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .pitscene{flex:1;min-height:0;position:relative;overflow:hidden;background:#FDF4F4;}
  .pitscene svg{position:absolute;inset:0;width:100%;height:100%;}
  .pitscene .chara{position:absolute;right:5px;bottom:0;height:114px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}
  .fixrow{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:#EDFBF3;border-top:2px solid #A7E3C7;padding:8px 11px;}
  .fixrow .fic{flex:0 0 auto;width:26px;height:26px;color:var(--green);}
  .fixrow .ft{flex:1;min-width:0;font-size:15.5px;font-weight:900;color:#0B5136;line-height:1.32;}
  .fixrow .ft b{color:var(--orange);}

  .warn{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;background:#FFFBEB;border:2.5px solid #FCD34D;border-radius:12px;padding:8px 11px;}
  .warn .wt{font-size:14px;font-weight:900;color:#B45309;letter-spacing:.03em;}
  .warn .m{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;font-weight:900;color:#92400E;line-height:1.3;}
  .warn .m .wi{flex:0 0 auto;width:20px;height:20px;color:#D97706;margin-top:1px;}
  .warn .m .t{flex:1;min-width:0;}
  .warn .m .t b{color:#B45309;}

  .next{flex:0 0 auto;margin:9px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
  split:'<path d="M12 3v6"/><path d="M12 9L5 15v6"/><path d="M12 9l7 6v6"/>',
  loop:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  beaker:'<path d="M9 3h6"/><path d="M10 3v6L4.6 18.9A2 2 0 0 0 6.3 22h11.4a2 2 0 0 0 1.7-3.1L14 9V3"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5z"/>',
  warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  bolt:'<path d="M13 2L3 14h8l-1 8 10-12h-8z"/>',
  plug:'<path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>',
  drag:'<path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20M12 2v20"/>'
};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const USE=[
 ['','split','条件の「はい」「いいえ」','片側を作って、もう片側に貼る','例：承認と却下で似たメール'],
 ['','loop','くり返しの中身ごと','Apply to each やスコープごと運べる','例：明細1行ごとの処理まるごと'],
 ['v2','send','別のフローへ持っていく','同じメール送信を作り直さない','例：見積の送付を請求にも'],
 ['v2','bell','似た通知を量産する','宛先だけ変えて、あとは貼るだけ','例：部署ごとのTeams通知'],
 ['v3','beaker','テスト用にもう1本','本番の並びを崩さず試せる','例：条件だけ変えて見くらべる'],
 ['v3','gift','人にわたす見本に','よく出来たブロックを渡す','例：新人に「ここから組んで」'],
];

/* 落とし穴の情景：上段＝直接はムリ／下段＝外に貼ってドラッグならOK */
const card=(x,y,c)=>`<g transform="translate(${x},${y})" filter="url(#psd)">
  <rect x="0" y="0" width="96" height="52" rx="9" fill="url(#pcard)" stroke="${c}" stroke-width="2.6"/>
  <circle cx="15" cy="14" r="6" fill="${c}"/>
  <line x1="27" y1="14" x2="82" y2="14" stroke="${c}" stroke-width="3.6" stroke-linecap="round" opacity=".55"/>
  <line x1="12" y1="31" x2="84" y2="31" stroke="#AFC0D8" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="42" x2="62" y2="42" stroke="#AFC0D8" stroke-width="4" stroke-linecap="round"/>
</g>`;
const caseBox=(x,y,label,fill,stroke,tc)=>`<g font-family="Noto Sans JP" font-size="15" font-weight="900" fill="${tc}">
  <rect x="${x}" y="${y}" width="86" height="38" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2.2"/>
  <text x="${x+43}" y="${y+25}" text-anchor="middle">${label}</text></g>`;

const pitScene=`<svg viewBox="0 0 430 208" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7EEF8"/></linearGradient>
    <filter id="psd" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#16233F" flood-opacity=".24"/></filter>
    <marker id="mkr" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#DC2626"/></marker>
    <marker id="mkg" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#16A34A"/></marker>
  </defs>

  <!-- ===== 上段：直接はムリ ===== -->
  ${card(12,16,'#94A3B8')}
  <path d="M116 42 H 196" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#mkr)"/>
  <g transform="translate(139,24)">
    <circle cx="17" cy="17" r="17" fill="#DC2626" filter="url(#psd)"/>
    <path d="M10.5 10.5 L23.5 23.5 M23.5 10.5 L10.5 23.5" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/>
  </g>
  ${caseBox(224,23,'ケース1','#FDF0F0','#E6BEBE','#7F1D1D')}
  <text x="334" y="48" font-family="Noto Sans JP" font-size="16" font-weight="900" fill="#991B1B">直接はムリ</text>

  <line x1="12" y1="82" x2="418" y2="82" stroke="#EAD3D3" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ===== 下段：外に貼ってからドラッグ ===== -->
  ${card(12,108,'#2563EB')}
  <text x="60" y="176" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#1E40AF" text-anchor="middle">外に貼る</text>

  <path d="M116 128 C 160 100, 190 100, 216 126" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#mkg)"/>
  <text x="166" y="96" font-family="Noto Sans JP" font-size="15.5" font-weight="900" fill="#0B5136" text-anchor="middle">ドラッグ</text>

  <rect x="206" y="102" width="212" height="82" rx="11" fill="#fff" stroke="#7FCEA9" stroke-width="2.6"/>
  <text x="218" y="122" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#0B5136">スイッチ</text>
  ${caseBox(218,130,'ケース1','#E6F7EE','#7FCEA9','#0B5136')}
  ${caseBox(316,130,'ケース2','#F6FAF8','#CBE5D8','#5C7A6C')}
  <g transform="translate(288,116)">
    <circle cx="14" cy="14" r="14" fill="#16A34A" filter="url(#psd)"/>
    <path d="M7.5 14.5 l4.5 4.5 L21 9" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.98-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">どこで効く？と、<span class="hl">1つだけある落とし穴</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('box')}</div>
    <div class="txt">運べるのは1個のアクションだけではありません。<b>条件やくり返しは、囲まれた中身ごと</b>まるごとコピーできます。</div>
  </div>

  <div class="stage">
    <div class="uses">
      ${USE.map(([c,ic,t,d,e])=>`<div class="u ${c}"><span class="uic">${svg(ic,2.2)}</span><span class="ub"><span class="ut">${t}</span><span class="ud">${d}</span><span class="ue">${e}</span></span></div>`).join('')}
    </div>

    <div class="side">
      <div class="pit">
        <div class="pith"><span class="wic">${svg('warn',2.4)}</span>落とし穴：スイッチの中には貼れない</div>
        <div class="pitb">
          <div class="pitscene">${pitScene}</div>
          <div class="fixrow"><span class="fic">${svg('drag',2.2)}</span><span class="ft">外に貼ってから<b>ドラッグで中へ</b>。設定は入ったままです。</span></div>
        </div>
      </div>

      <div class="warn">
        <div class="wt">使う前に確認</div>
        <div class="m"><span class="wi">${svg('ban',2.4)}</span><span class="t">運べるのは<b>アクション</b>。トリガーは対象外</span></div>
        <div class="m"><span class="wi">${svg('bolt',2.4)}</span><span class="t">別のフローに貼ると、前の手順を指していた⚡は<b>入れ直し</b></span></div>
        <div class="m"><span class="wi">${svg('plug',2.4)}</span><span class="t">接続（アカウント）は貼り先のものになる</span></div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>作り直す時間が丸ごと浮きます。<b>まずは「メールの送信」1個</b>から試すのがおすすめ！</div>
  <div class="src">出典：Microsoft Learn「クラウドフロー内のアクションに対して、移動、削除、追加のオプションを実行する」／スイッチの制限はJBS Tech Blog(2024)の検証／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
