<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.54-1 Copilotに頼めること・頼めないこと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --enji:#A4283C; --enji-dark:#6E1628;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --orange:#EA580C; --amber:#D97706; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:28px;line-height:1.16;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:144px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:9px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:18px;color:var(--blue-dark);line-height:1.36;padding-right:96px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;align-items:stretch;gap:14px;min-height:0;}
  .side{flex:1;display:flex;flex-direction:column;min-height:0;}
  .shd{font-weight:900;font-size:18.5px;margin-bottom:8px;display:flex;align-items:center;gap:9px;}
  .shd img{width:26px;height:26px;object-fit:contain;}
  .shd.ok{color:var(--green-dark);} .shd.ng{color:var(--enji-dark);}
  .panel{flex:1;border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;justify-content:space-evenly;gap:7px;min-height:0;box-shadow:0 5px 13px rgba(0,0,0,.12);}
  .panel.ok{background:linear-gradient(180deg,#F3FBF6,#E9F8EF);border:2.5px solid var(--green);}
  .panel.ng{background:linear-gradient(180deg,#FDF6F7,#FAEDEF);border:2.5px solid var(--enji);}
  .item{background:#fff;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 5px rgba(0,0,0,.07);}
  .panel.ok .item{border:1.5px solid #BFE3CC;} .panel.ng .item{border:1.5px solid #E3BDC5;}
  .item img{flex:0 0 auto;width:28px;height:28px;object-fit:contain;}
  .item .tx{font-size:16.5px;font-weight:800;line-height:1.32;color:#31414F;}
  .item .tx b{color:var(--green-dark);}
  .panel.ng .item .tx b{color:var(--enji);}
  .item .tx small{display:block;font-size:13px;font-weight:700;color:var(--weak);margin-top:2px;}

  .aikotoba{flex:0 0 auto;margin:11px 16px 12px;background:linear-gradient(180deg,#565C66,#4A4F58);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 9px rgba(0,0,0,.18);position:relative;}
  .aikotoba .al{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FBBF24,#EA580C);color:#fff;font-weight:900;font-size:15.5px;border-radius:9px;padding:8px 14px;box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .aikotoba .al svg{width:18px;height:18px;}
  .aikotoba .ax{flex:1;color:#fff;font-weight:800;font-size:16.5px;line-height:1.4;padding-right:108px;}
  .aikotoba .ax b{color:#FCD34D;}
  .aik-chara{position:absolute;right:14px;bottom:-2px;height:104px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
 hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34L4.8 18.45c-.72-.72-1.06-1.94-.34-2.66.72-.72 1.94-.72 2.66 0L8 16.6"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.54-1</div>
    <img class="vol-logo" src="${A}icons/copilot_m365.png" alt="">
    <div class="title-text">正直な線引き｜<span class="hl">Copilotに頼めること・人がやること</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">Copilotは万能ではない。でも<b>線引きさえ知っていれば</b>初心者の最強の相棒。<br>5回のシリーズで実際に試して分かった、<b>正直な役割分担</b>がこれです。</div>
  </div>

  <div class="stage">
    <div class="side">
      <div class="shd ok"><img src="${A}icons/icon_check_green.png" alt="">Copilotに頼めること（全部実証済み）</div>
      <div class="panel ok">
        <div class="item"><img src="${A}icons/copilot_m365.png" alt=""><span class="tx"><b>作り方のレシピ</b>を出す<small>手順①〜⑧＋つまずく設定まで先回り（Vol.49）</small></span></div>
        <div class="item"><img src="${A}icons/pa_condition.png" alt=""><span class="tx">できたフローの<b>改良案</b><small>「PDFだけ保存」→条件1つの手順が返る（Vol.52）</small></span></div>
        <div class="item"><img src="${A}icons/pa_logo.png" alt=""><span class="tx"><b>エラー文の翻訳</b>と直す場所<small>「保存先が未指定という意味です」（Vol.53）</small></span></div>
        <div class="item"><img src="${A}icons/icon_bulb.png" alt=""><span class="tx"><b>用語・画面のわからない</b>を解説<small>Apply to each＝繰り返す係、のような平易な言い換え</small></span></div>
      </div>
    </div>

    <div class="side">
      <div class="shd ng"><img src="${A}icons/icon_x_red.png" alt="">人がやること（ここは任せられない）</div>
      <div class="panel ng">
        <div class="item"><img src="${A}icons/pa_onedrive.png" alt=""><span class="tx"><b>保存先・宛先を決める</b><small>あなたのフォルダー構成や宛先をAIは知らない</small></span></div>
        <div class="item"><img src="${A}icons/pa_logo.png" alt=""><span class="tx"><b>実画面の操作と接続</b><small>クリック・サインイン・アクセス許可は自分の手で</small></span></div>
        <div class="item"><img src="${A}icons/icon_x_red.png" alt=""><span class="tx"><b>名前の読み替えと最終確認</b><small>回答は英語名のことがある。実画面の名前が正（Vol.49）</small></span></div>
        <div class="item"><img src="${A}icons/icon_check_blue.png" alt=""><span class="tx"><b>味見（検品）とテスト実行</b><small>回答は誤りを含みうる、と画面にも明記がある（Vol.51）</small></span></div>
      </div>
    </div>
  </div>

  <div class="aikotoba">
    <div class="al">${svg('hand')}合言葉</div>
    <div class="ax"><b>AIがレシピを書き、人が味見して出す。</b>この分担ができれば、フローを作れなかった人も今日から自動化を始められる。</div>
    <img class="aik-chara" src="${A}chara/chara_confident.png" alt="">
  </div>
  <div class="src">出典：Microsoft 365 Copilot 実機／Power Automate 実機（PA45 Demo）</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
