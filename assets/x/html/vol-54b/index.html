<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.54-2 “Copilotと一緒に作る”総まとめ早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#064E3B;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --cop-grad:linear-gradient(120deg,#7C3AED,#C026D3 55%,#EC4899);
    --orange:#EA580C; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:29px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:140px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .thead{margin:11px 16px 0;display:flex;gap:8px;padding:0 4px;flex:0 0 auto;}
  .thead span{font-size:13.5px;font-weight:900;color:#5A6B85;text-align:center;}
  .thead .c1{flex:0 0 96px;} .thead .c2{flex:1.15;} .thead .c3{flex:1.5;} .thead .c4{flex:1.15;}

  .rows{flex:1 1 auto;margin:6px 16px 0;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .row{flex:1;display:flex;gap:8px;align-items:stretch;min-height:0;}
  .cell{border-radius:11px;display:flex;align-items:center;padding:6px 12px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .volc{flex:0 0 96px;justify-content:center;flex-direction:column;gap:2px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:16px;border:none;box-shadow:0 2px 6px rgba(37,99,235,.35),inset 0 1px 0 rgba(255,255,255,.4);}
  .volc small{font-size:10.5px;font-weight:800;opacity:.9;}
  .goalc{flex:1.15;background:#F8F9FA;border:1.5px solid #D8DEE8;font-weight:900;font-size:15px;color:var(--ink);line-height:1.28;gap:9px;}
  .goalc img{flex:0 0 auto;width:24px;height:24px;object-fit:contain;}
  .askc{flex:1.5;background:#FBFAFE;border:1.5px solid #DDD3F0;font-weight:700;font-size:13.5px;color:#43307A;line-height:1.38;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .askc>span{flex:1;}
  .askc b{color:var(--cop-dark);}
  .notec{flex:1.15;background:#FFF9F1;border:1.5px solid #F4CE9A;font-weight:800;font-size:13px;color:#7C4A12;line-height:1.3;}
  .notec b{color:var(--orange);}

  .fin{flex:0 0 auto;margin:10px 16px 12px;background:var(--cop-grad);border-radius:13px;padding:2.5px;box-shadow:0 4px 11px rgba(124,58,237,.3);position:relative;}
  .fin .inner{background:#2B2340;border-radius:11px;padding:10px 18px;display:flex;align-items:center;gap:13px;}
  .fin .fl{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:5px;}
  .fin .fl img{width:100%;height:100%;object-fit:contain;}
  .fin .fx{flex:1;color:#fff;font-weight:800;font-size:16px;line-height:1.42;padding-right:104px;}
  .fin .fx b{color:#FCD34D;}
  .fin-chara{position:absolute;right:14px;bottom:-2px;height:102px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.54-2</div>
    <img class="vol-logo" src="${A}icons/copilot_m365.png" alt="">
    <div class="title-text">保存版｜<span class="hl">“Copilotと一緒に作る”早見表</span></div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>

  <div class="thead"><span class="c1">回</span><span class="c2">やりたいこと</span><span class="c3">Copilotへの頼み方</span><span class="c4">人がやる注意点</span></div>

  <div class="rows">
    <div class="row">
      <div class="cell volc">#49<small>はじめて</small></div>
      <div class="cell goalc"><img src="${A}icons/pa_onedrive.png" alt="">ゼロからフローを作る</div>
      <div class="cell askc"><span>「<b>◯◯が起きたら△△する</b>フローを作りたい。<br><b>初心者なので手順を</b>教えて」</span></div>
      <div class="cell notec">回答の<b>英語名は日本語画面に読み替え</b></div>
    </div>
    <div class="row">
      <div class="cell volc">#50<small>頼み方</small></div>
      <div class="cell goalc"><img src="${A}icons/copilot_m365.png" alt="">一発でレシピをもらう</div>
      <div class="cell askc"><span>曖昧NG。<b>いつ・どうしたい・レベル感</b>の3点セットで<br>（新人さんへの頼み方と同じ）</span></div>
      <div class="cell notec">曖昧だと<b>逆質問が返る</b>＝会話で詰めてもOK</div>
    </div>
    <div class="row">
      <div class="cell volc">#51<small>検品</small></div>
      <div class="cell goalc"><img src="${A}icons/pa_logo.png" alt="">動かす前の味見</div>
      <div class="cell askc"><span>検品は人の仕事。<br><b>①トリガー詳細設定 ②空欄 ③⚡動的コンテンツ</b>の3点を見る</span></div>
      <div class="cell notec">保存→<b>フロー チェッカーでエラー0</b>を確認</div>
    </div>
    <div class="row">
      <div class="cell volc">#52<small>改良</small></div>
      <div class="cell goalc"><img src="${A}icons/pa_condition.png" alt="">できたフローを育てる</div>
      <div class="cell askc"><span>続きの会話で「追加で<b>□□するように変えたい</b>。<br>どこをどう変更すればいい？」</span></div>
      <div class="cell notec">作り直し不要。<b>条件1つ</b>で済むことが多い</div>
    </div>
    <div class="row">
      <div class="cell volc">#53<small>エラー</small></div>
      <div class="cell goalc"><img src="${A}icons/icon_x_red.png" alt="">赤いエラーを直す</div>
      <div class="cell askc"><span>エラー文を<b>そのまま貼って</b><br>「<b>意味と直し方</b>を初心者向けに教えて」</span></div>
      <div class="cell notec">社内情報の<b>写り込みはひと目確認</b>してから</div>
    </div>
  </div>

  <div class="fin">
    <div class="inner">
      <span class="fl"><img src="${A}icons/copilot_m365.png" alt=""></span>
      <span class="fx">この5枚で「<b>作れないから諦める</b>」はもう無い。<b>AIがレシピ、人が味見</b>——今日、最初のフローをCopilotに聞いてみてください。</span>
    </div>
    <img class="fin-chara" src="${A}chara/chara_smile.png" alt="">
  </div>
  <div class="src">出典：Microsoft 365 Copilot 実機／Power Automate 実機（PA45 Demo）</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
