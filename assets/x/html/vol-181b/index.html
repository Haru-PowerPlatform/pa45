<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.181-2 直した通知メールの4か所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:22px;}
  .mailcol{flex:0 0 748px;min-width:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #A9C6F5;border-radius:12px;box-shadow:0 5px 14px rgba(20,40,90,.18);font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .wh{flex:0 0 38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;border-radius:10px 10px 0 0;font-size:15.5px;font-weight:700;color:#242424;}
  .repro{font-size:12.5px;font-weight:700;color:#8A8886;margin-left:auto;white-space:nowrap;}
  .zone{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:4px 62px 4px 16px;border-bottom:1px solid #EDEBE9;}
  .zone:last-child{border-bottom:none;border-radius:0 0 10px 10px;}
  .zone .bd{position:absolute;right:-14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#EF6A6A,#DC2626);color:#fff;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:4;font-family:"Noto Sans JP",sans-serif;}
  .zone .bd::after{content:"";position:absolute;left:40px;top:18px;width:24px;height:4px;background:#DC2626;}
  .hi{border:2.5px dashed #DC2626;border-radius:9px;background:#FFF7F7;padding:4px 10px;align-self:flex-start;max-width:100%;}
  .sj{font-size:27px;font-weight:900;color:#242424;line-height:1.25;}
  .sj b{color:#C2410C;}
  .from{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;color:#605E5C;}
  .from .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#C2410C;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .from .nm{color:#242424;font-weight:900;font-size:16.5px;}
  .from .dt{margin-left:auto;font-size:14px;color:#8A8886;}
  .l1{font-size:23px;font-weight:700;color:#242424;line-height:1.42;}
  .l1 b{color:#B91C1C;font-weight:900;}
  .btnrow{display:flex;align-items:center;gap:14px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#0F6CBD;color:#fff;font-size:22px;font-weight:900;border-radius:7px;padding:8px 20px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .btn svg{width:22px;height:22px;max-width:22px;}
  .sub{font-size:16.5px;font-weight:700;color:#605E5C;line-height:1.35;}
  .ft{font-size:17.5px;font-weight:700;color:#424242;line-height:1.45;}
  .ft b{color:#0F548C;}
  /* 右：赤ペン */
  .notes{flex:1;min-width:0;display:flex;flex-direction:column;}
  .nh{flex:0 0 38px;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;color:#991B1B;}
  .nh svg{flex:0 0 auto;}
  .nlist{flex:1;min-height:0;display:flex;flex-direction:column;}
  .nt{flex:1;min-height:0;display:flex;align-items:center;}
  .ntc{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:#FFFBFB;border:2.5px solid #F0AEAE;border-left:8px solid #DC2626;border-radius:11px;padding:6px 12px 7px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .ntc .t{font-size:20px;font-weight:900;color:#7F1D1D;line-height:1.25;}
  .ntc .o{display:flex;align-items:baseline;gap:7px;font-size:15.5px;font-weight:700;color:#374151;line-height:1.3;}
  .ntc .o .k{flex:0 0 auto;font-size:13.5px;font-weight:900;color:#fff;background:#DC2626;border-radius:5px;padding:0 6px;}
  .ntc .o s{text-decoration:underline wavy #DC2626;text-decoration-thickness:1.6px;text-underline-offset:3px;}
  .ntc .w{font-size:15.5px;font-weight:900;color:#065F46;line-height:1.3;}
  .next{margin-top:8px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  open:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'};
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const pen=`<svg width="30" height="30" viewBox="0 0 30 30"><g transform="translate(17 1) rotate(40)"><rect width="8" height="22" rx="2" fill="#DC2626"/><rect width="8" height="5" rx="2" fill="#7F1D1D"/><path d="M0 22 L4 30 L8 22z" fill="#FDE68A"/><path d="M2.6 27 L4 30 L5.4 27z" fill="#DC2626"/></g><path d="M3 26c4-3 6 2 10-1" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const nt=(t,o,w)=>`<div class="nt"><div class="ntc"><div class="t">${t}</div><div class="o"><span class="k">直す前</span><s>${o}</s></div><div class="w">${w}</div></div></div>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.181-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">直した通知メールの全体。<br><span class="hl">赤ペンを入れたのは4か所</span></div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt"><b>件名・1行目・押す場所・問い合わせ先</b>の4か所だけを書き直します。挨拶や注意書きは足しません</div>
  </div>
  <div class="stage">
    <div class="mailcol">
      <div class="wh">${MS('outlook.svg',26)}届いたメール（直した後）<span class="repro">画面は説明用の再現</span></div>
      <div class="zone">
        <div class="hi sj"><b>【11/27(金)まで・要回答】</b>備品の棚卸し</div>
        <div class="from"><span class="av">佐</span><span class="nm">佐藤 花子</span><span>宛先：山田 太郎</span><span class="dt">2026/11/20 (金) 9:00</span></div>
        <span class="bd">1</span>
      </div>
      <div class="zone">
        <div class="hi l1">山田さん、<b>会議室Aの備品10点</b>があるかどうかを、<br><b>11/27(金)まで</b>に回答してください。</div>
        <span class="bd">2</span>
      </div>
      <div class="zone">
        <div class="btnrow"><div class="hi" style="padding:6px 8px"><span class="btn">${svgw(P.open,2.6)}回答フォームを開く</span></div>
        <div class="sub">備品ごとに、あり・なしを選んで送信します。<br>リンクはこの1つだけです。</div></div>
        <span class="bd">3</span>
      </div>
      <div class="zone">
        <div class="hi ft">このメールは Power Automate から自動で送っています。<br>問い合わせ：<b>総務 佐藤（内線 1234）</b>　このメールに返信すると佐藤に届きます。</div>
        <span class="bd">4</span>
      </div>
    </div>
    <div class="notes">
      <div class="nh">${pen}直す前の文面と、直した理由</div>
      <div class="nlist">
        ${nt('件名の頭に、やることと期限','【自動送信】ワークフロー通知','一覧で見える範囲に用件を置く')}
        ${nt('1行目は、誰が何をするかを1つ','このメールは自動送信されています','宛名・対象・期限を1文にまとめる')}
        ${nt('押す場所は1つにする','マニュアル・ポータル・フォームの3リンク','次の操作を1つに絞る')}
        ${nt('差出人と問い合わせ先を書く','本メールには返信できません','聞く相手と返信の届き先を示す')}
      </div>
    </div>
  </div>
  <div class="next">
    <span class="na">${svgw(P.arrow,2.6)}</span>
    <span><b>この4か所をフローのどの欄に書くかは3枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「Office 365 Outlook」コネクタ（メールの送信 (V2)：件名・本文・返信先）／人名・日付・内線番号・文面は架空・画面は説明用の再現</div>
`;
</script>
</body>
</html>
