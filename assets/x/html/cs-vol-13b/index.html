<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.13-2 指示文に1行足したら、はじめて動いた</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:13px;}
  .panel{gap:8px;}
  .card2{flex:0 0 auto;background:#fff;border:1.5px solid var(--segline);border-radius:10px;overflow:hidden;
    box-shadow:0 4px 11px rgba(0,0,0,.13);}
  .card2 .c2h{display:flex;align-items:center;gap:8px;padding:6px 11px;background:#F3F2F1;
    border-bottom:1px solid #E1DFDD;font-size:13.5px;font-weight:700;color:#242424;}
  .card2 .c2b{padding:8px 11px;display:flex;flex-direction:column;gap:6px;}
  .chips4{display:flex;gap:7px;flex-wrap:wrap;}
  .chips4 span{display:flex;align-items:center;gap:6px;background:#F3F2F1;border:1px solid #E1DFDD;border-radius:999px;
    padding:3px 12px;font-size:13.5px;font-weight:700;color:#242424;}
  .chips4 span .dt2{width:8px;height:8px;border-radius:50%;background:var(--cs);}
  .instr{border:1px solid #8A8886;border-radius:2px;padding:7px 10px;font-size:13.5px;font-weight:700;
    color:#242424;line-height:1.5;}
  .instr .add{display:block;background:#FDE68A;color:#7A4E06;border-radius:3px;padding:2px 5px;margin-top:4px;}
  .zero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    background:#fff;border:2px dashed var(--red-line);border-radius:11px;}
  .zero .z1{font-size:44px;font-weight:900;color:var(--red);line-height:1.34;}
  .zero .z2{font-size:16.5px;font-weight:900;color:var(--red-dark);}
  .zero .z3{font-size:14px;font-weight:700;color:#7F1D1D;}
  .flow2{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .fs2{flex:1;min-height:0;display:flex;align-items:center;gap:9px;background:#fff;border:1.8px solid var(--green-line);
    border-left:6px solid var(--green);border-radius:9px;padding:5px 11px;box-shadow:0 2px 5px rgba(20,40,90,.08);}
  .fs2 .n7{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--green);color:#fff;font-size:13px;
    font-weight:900;display:flex;align-items:center;justify-content:center;}
  .fs2 .t7{flex:1;font-size:16px;font-weight:900;color:var(--navy);line-height:1.22;}
  .perm{flex:0 0 auto;background:#fff;border:2px solid var(--cs);border-radius:10px;overflow:hidden;
    box-shadow:0 4px 11px rgba(59,42,102,.18);}
  .perm .ph6{display:flex;align-items:center;gap:8px;padding:5px 11px;background:var(--cs-bg2);
    font-size:13.5px;font-weight:900;color:var(--cs-dark);}
  .perm .pb6{padding:7px 11px;display:flex;align-items:center;gap:9px;}
  .perm .pt6{flex:1;font-size:14px;font-weight:700;color:#242424;line-height:1.34;}
  .perm .bt3{border-radius:3px;padding:4px 14px;font-size:13.5px;font-weight:700;}
  .perm .bt3.y{background:var(--cs);color:#fff;} .perm .bt3.n{background:#fff;border:1px solid #8A8886;color:#242424;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.13</div>
    <div class="part-pill">後編 <b>(2/2)</b></div>
    <div class="title-text">指示文に1行足したら、<br>はじめて動いた<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">道具を<b>持たせること</b>と、<b>使うこと</b>は別です。<br>
      指示文に<em>「いつ使うか」を1行</em>書いて、はじめて呼ばれました。</div>
  </div>

  <div class="body">
    <div class="panel p-ng">
      <div class="dlabel"><span class="dot"></span>足しただけのとき</div>
      <div class="card2 seg">
        <div class="c2h">Tools</div>
        <div class="c2b"><div class="chips4">
          <span><span class="dt2"></span>メールの送信 (V2)</span>
          <span><span class="dt2"></span>問い合わせを記録する</span></div></div>
      </div>
      <div class="card2 seg">
        <div class="c2h">Instructions</div>
        <div class="c2b"><div class="instr">あなたは社内ヘルプデスクの案内係です。<br>
          社内FAQをもとに、ていねいに答えてください。</div></div>
      </div>
      <div class="zero">
        <span class="z1">0</span>
        <span class="z2">1通も送られない</span>
        <span class="z3">道具は並んでいるのに、一度も呼ばれなかった</span>
      </div>
    </div>

    <div class="panel p-ok">
      <div class="dlabel"><span class="dot"></span>1行足したあと</div>
      <div class="card2 seg">
        <div class="c2h">Instructions（追記）</div>
        <div class="c2b"><div class="instr">あなたは社内ヘルプデスクの案内係です。<br>
          社内FAQをもとに、ていねいに答えてください。
          <span class="add">解決しない質問を受けたら、「メールの送信 (V2)」で情シス担当に転送すること。</span></div></div>
      </div>
      <div class="flow2">
        <div class="fs2"><span class="n7">1</span><span class="t7">AIが件名と本文を自分で組み立てる</span></div>
        <div class="fs2"><span class="n7">2</span><span class="t7">送る直前に、人の許可を求めてくる</span></div>
        <div class="fs2"><span class="n7">3</span><span class="t7">許可すると、実際に着信する</span></div>
      </div>
      <div class="perm seg">
        <div class="ph6">Permission Required</div>
        <div class="pb6"><span class="pt6">「メールの送信 (V2)」を実行してもよろしいですか？</span>
          <span class="bt3 n">拒否</span><span class="bt3 y">許可</span></div>
      </div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">同じことが起きる場所</div>
      <div class="grid">
        <div class="fc"><div class="ft">① 持たせる ≠ 使う</div><div class="fd">Toolsに並べただけでは、呼ばれる保証はない</div></div>
        <div class="fc"><div class="ft">② きっかけを1行</div><div class="fd">「〜のときは〜を使う」と指示文に書くのが確実</div></div>
        <div class="fc"><div class="ft">③ ナレッジも同じ</div><div class="fd">入れただけで検索されないときは、説明と指示文を見る</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 許可のダイアログ</div>
      <div class="txt">外に手を出す道具は、実行前に<b>許可を求めてきます</b>。<br>
        デモのときは、ここで止まることを見込んでおきます。</div>
    </div>
    <div class="src">出典：PA45 Demo環境での実機（文言は実際に出たもの）／画面は説明用の再現です</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_guts_g.png" alt="">
`;
</script>
</body>
</html>
