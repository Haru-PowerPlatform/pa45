<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.14-1 返信をOutlookで下書き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>

  .stage{gap:10px;}
  .col.bad{flex:0 0 400px;}
  .col.good{flex:1;min-width:0;}
  .sc{flex:0 0 112px;width:376px;align-self:center;position:relative;border-radius:10px;overflow:hidden;background:#FCE4E4;}
  .sc svg{position:absolute;inset:0;width:100%;height:100%;}
  .sc .ch{position:absolute;right:2px;bottom:-4px;height:116px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
  .box{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--red-line);border-radius:10px;overflow:hidden;}
  .box .ih{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15px;font-weight:700;color:#424242;}
  .box .ih .cnt{margin-left:auto;font-size:13.5px;font-weight:900;color:#fff;background:#DC2626;border-radius:999px;padding:1px 9px;}
  .mr{flex:1;min-height:0;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #EFEDEB;}
  .mr .bar{flex:0 0 4px;align-self:stretch;margin:5px 0;border-radius:2px;background:#DC2626;}
  .mr .who{flex:0 0 88px;font-size:15px;font-weight:700;color:#242424;white-space:nowrap;overflow:hidden;}
  .mr .sb{flex:1;min-width:0;font-size:15px;font-weight:700;color:#991B1B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mr .dt{flex:0 0 auto;font-size:13.5px;font-weight:700;color:#616161;}
  .badline{flex:0 0 auto;background:#DC2626;color:#fff;border-radius:8px;padding:6px 10px;font-size:16px;font-weight:900;line-height:1.3;}
  .eng{flex:0 0 112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .eng .ai{width:80px;height:80px;border-radius:20px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;}
  .eng .pill{font-size:14.5px;font-weight:900;color:#fff;background:var(--mc);border-radius:999px;padding:3px 11px;white-space:nowrap;}
  .eng .lb{font-size:15.5px;font-weight:900;color:var(--mc-dark);text-align:center;line-height:1.35;}
  .eng .ar{width:90px;height:30px;color:var(--mc);}
  .pane{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid var(--green-line);border-radius:10px;overflow:hidden;box-shadow:0 3px 8px rgba(20,90,60,.12);}
  .pane .phd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 11px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:16px;font-weight:700;color:#242424;}
  .pane .pb{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:9px 12px;}
  .ask{align-self:flex-end;max-width:90%;background:#E8F4F2;border:1.5px solid #A7E3D8;border-radius:12px 12px 3px 12px;padding:7px 12px;font-size:16px;font-weight:700;color:#1B2A44;line-height:1.4;}
  .ask .pj{background:linear-gradient(transparent 55%,#FDE68A 55%);}
  .ans{flex:1;min-height:0;display:flex;flex-direction:column;background:#FAFAFA;border:1.5px solid #E1DFDD;border-radius:12px 12px 12px 3px;padding:7px 12px;}
  .ans .ah{font-size:15px;font-weight:900;color:var(--mc-dark);margin-bottom:3px;}
  .li{flex:1;display:flex;align-items:center;gap:9px;border-bottom:1.2px dashed #E5E7EB;}
  .li:last-child{border-bottom:none;}
  .li .tg{flex:0 0 96px;text-align:center;font-size:14px;font-weight:900;border-radius:6px;padding:2px 0;color:#fff;background:var(--mc);}
  .li .tg.w{background:#D97706;} .li .tg.t{background:#2563EB;} .li .tg.g{background:#16A34A;}
  .li .tx{flex:1;font-size:16.5px;font-weight:700;color:#1B2A44;line-height:1.3;}
  .li .tx b{color:#B91C1C;}
  .bot{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;}
  .bot .uses{background:#fff;border:1.5px solid #CFEFE0;border-radius:10px;padding:4px 9px;}
  .metric .mv{font-size:24px;}
  .repro{font-size:12.5px;font-weight:700;color:#8A8886;margin-left:auto;white-space:nowrap;}

</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12l5 5 9-10"/>',arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 4M12 17v.5"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.14-1</div><div class="lic-pill paid">M365 Copilot ライセンスが要る</div></div>
    
    <div class="title-text">届いたメールへの返信を、<br><span class="hl">伝えたいことを1行書くだけ</span>で下書きさせる</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/outlook.svg" alt=""><span class="pl">＋</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">返信を開くと本文に<b>「返信を手伝ってください (Alt + i)」</b>。<br>伝えたいことを1行書くと本文に下書きが入ります。送るのは読んでから</div>
  </div>
  <div class="stage">
    <div class="col bad">
      <div class="ph"><span class="mk">${svgw(P.x,3.2)}</span>1から書くと</div>
      <div class="sc"><svg viewBox="0 0 376 112" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7F1D1D" flood-opacity=".25"/></filter></defs><rect width="376" height="112" fill="#FCE4E4"/><g transform="translate(11 13) rotate(16 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(50 9) rotate(12 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(98 13) rotate(-14 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(137 4) rotate(12 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(172 12) rotate(-4 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(211 15) rotate(12 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(256 12) rotate(12 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(14 60) rotate(-9 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(51 60) rotate(-9 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(96 56) rotate(-18 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(138 62) rotate(-14 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(170 62) rotate(-16 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g><g transform="translate(212 62) rotate(-17 20 14)" filter="url(#sh)"><rect width="40" height="28" rx="3" fill="url(#pg)" stroke="#CBD5E1"/><path d="M1 2l19 14 19-14" fill="none" stroke="#94A3B8" stroke-width="1.6"/></g></svg><img class="ch" src="${A}chara/chara_tired.png" alt=""></div>
      <div class="box"><div class="ih">返信（下書き）<span class="cnt">白紙</span></div><div class="mr"><span class="bar"></span><span class="who">書き出し</span><span class="sb">お礼の言い回しに迷う</span><span class="dt">—</span></div><div class="mr"><span class="bar"></span><span class="who">敬語</span><span class="sb">「させていただく」が続く</span><span class="dt">—</span></div><div class="mr"><span class="bar"></span><span class="who">要点</span><span class="sb">次回の参加をどう書くか</span><span class="dt">—</span></div><div class="mr"><span class="bar"></span><span class="who">長さ</span><span class="sb">長くなって読まれない</span><span class="dt">—</span></div><div class="mr"><span class="bar"></span><span class="who">見直し</span><span class="sb">誤字を探して読み直す</span><span class="dt">—</span></div></div>
      <div class="badline">短いお礼の返信に、思ったより時間がかかる</div>
    </div>
    <div class="eng">
      <div class="ai">${MS('outlook.svg',52)}</div>
      <span class="pill">返信を手伝って</span>
      <div class="lb">伝えたいことを<br>1行</div>
      <span class="ar">${svgw(P.arrow,3)}</span>
    </div>
    <div class="col good">
      <div class="ph"><span class="mk">${svgw(P.ok,3.2)}</span>1行で頼むと</div>
      <div class="pane">
        <div class="phd">${MS('outlook.svg',24)}Outlook の返信<span class="repro">画面は説明用の再現</span></div>
        <div class="pb">
          <div class="ask"><span class="pj">バッジのお礼と、次回も参加したいこと</span>を丁寧に2〜3文で</div>
          <div class="ans"><div class="ah">本文に入った下書き</div><div class="li"><span class="tg t">お礼</span><span class="tx">受講バッジをお送りいただき、ありがとうございます。</span></div><div class="li"><span class="tg g">気持ち</span><span class="tx">今後の学びの励みになります。</span></div><div class="li"><span class="tg w">次回</span><span class="tx">次回もぜひ参加させていただきたく…</span></div></div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">書くもの</span><span class="mv">返信の全文</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">1行の指示</span></div>
        <div class="uses"><span class="ul">使いどころ</span><span class="u">お礼の返信</span><span class="u">日程の返事</span><span class="u">問い合わせの回答</span><span class="u">社外への挨拶</span></div>
      </div>
    </div>
  </div>
  <div class="next">
    <span class="na">${svgw(P.arrow,2.6)}</span>
    <span><b>実際の返信画面は2枚目へ</b></span>
  </div>
  <div class="src">出典：Outlook の Copilot（ボタンの文言は画面のまま）／人名は架空・画面は説明用の再現（2026年10月の実画面で確認）</div>
`;
</script>
</body>
</html>
