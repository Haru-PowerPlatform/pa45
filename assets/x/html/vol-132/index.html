<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.132-1 会議の前に要点を読んでおくと、その場で決まって持ち帰りが減る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型A：Before/After 2パネル。準備なしの会議 ↔ 要点を読んでから入った会議（同じ相談・変わるのは自分の返事だけ）*/
  .vol-logo.cpl{display:flex;align-items:center;justify-content:center;padding:6px;}
  .vol-logo.cpl svg,.eng .lg svg{width:100%;height:100%;}
  .stage{gap:10px;}
  .col{padding:8px 10px 9px;}
  .scn{flex:0 0 auto;width:100%;height:104px;border-radius:11px;position:relative;overflow:hidden;}
  .col.bad .scn{background:#FCE4E4;} .col.good .scn{background:#DCF3E7;}
  .scn svg{position:absolute;left:0;top:0;width:428px;height:104px;}
  .scn .chara{position:absolute;right:6px;bottom:-10px;height:114px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .mtg{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .col.bad .mtg{border:2.5px solid var(--red-line);} .col.good .mtg{border:2.5px solid var(--green-line);}
  .mh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#2D2C3C;color:#fff;font-size:15.5px;font-weight:900;}
  .mh img{width:24px;height:24px;background:#fff;border-radius:5px;padding:2px;}
  .mh .rec{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:'Roboto Mono',monospace;font-size:14px;color:#FCA5A5;}
  .mh .rec::before{content:"";width:9px;height:9px;border-radius:50%;background:#EF4444;}
  .mb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;padding:6px 10px;}
  .say{display:flex;gap:8px;align-items:flex-start;}
  .say .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;}
  .say.them .av{background:linear-gradient(180deg,#F59E0B,#D97706);}
  .say.me .av{background:linear-gradient(180deg,#3B82F6,#1D4ED8);}
  .say .bb{flex:1;border-radius:10px;padding:5px 10px;font-size:16px;font-weight:700;color:var(--navy);line-height:1.42;}
  .say.them .bb{background:#F4F6FA;}
  .say .nm{display:block;font-size:13.5px;font-weight:900;color:#6B7280;}
  .col.bad .say.me .bb{background:#FEE2E2;color:#991B1B;font-weight:900;}
  .col.good .say.me .bb{background:#DCFCE7;color:#065F46;font-weight:900;}
  .say .bb b{color:#B91C1C;}
  .res{flex:0 0 auto;display:flex;align-items:center;gap:8px;border-radius:10px;padding:5px 10px;font-size:17px;font-weight:900;}
  .col.bad .res{background:#fff;border:2px dashed #F87171;color:#991B1B;}
  .col.good .res{background:#fff;border:2px solid #34D399;color:#065F46;}
  .res .tag{flex:0 0 auto;border-radius:7px;padding:1px 9px;color:#fff;font-size:15px;}
  .col.bad .res .tag{background:#DC2626;} .col.good .res .tag{background:#16A34A;}
  .res .memo{display:flex;gap:5px;margin-left:auto;}
  .res .memo span{background:#FEF9C3;border:1.5px solid #FACC15;color:#854D0E;border-radius:4px;padding:0 6px;font-size:14px;transform:rotate(-2deg);}
  .res .memo span:nth-child(2){transform:rotate(3deg);}

  .mid{flex:0 0 190px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .eng{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;
    background:linear-gradient(180deg,#F5F3FF,#EEF2FF);border:2.5px solid #A5B4FC;border-radius:14px;padding:8px 8px;}
  .eng .tm{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;color:#fff;background:#4F46E5;border-radius:999px;padding:2px 12px;}
  .eng .lg{width:58px;height:58px;}
  .eng .t1{font-size:18.5px;font-weight:900;color:#312E81;line-height:1.3;}
  .eng .chip{font-size:15px;font-weight:900;color:#3730A3;background:#fff;border:1.8px solid #6366F1;border-radius:7px;padding:1px 8px;}
  .eng .gets{display:flex;flex-direction:column;gap:4px;width:100%;}
  .eng .gets span{font-size:15px;font-weight:900;color:#1E3A8A;background:#fff;border:1.5px solid #C7D2FE;border-radius:8px;padding:2px 6px;}
  .eng .arw{width:150px;height:22px;}
  .metric{flex-direction:column;gap:3px;padding:6px 8px;}
  .metric .row{display:flex;align-items:center;gap:6px;}
  .metric .mv{font-size:24px;}
  .metric .ar{width:22px;height:22px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', ok:'<path d="M5 12.5l4.5 4.5L19 7"/>'};
const spark=(id)=>`<svg viewBox="0 0 32 32"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2F7CF6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
  <path d="M16 2c1.4 7.2 6.8 12.6 14 14-7.2 1.4-12.6 6.8-14 14-1.4-7.2-6.8-12.6-14-14C9.2 14.6 14.6 9.2 16 2z" fill="url(#${id})"/>
  <path d="M26 2.5c.4 2 1.5 3.1 3.5 3.5-2 .4-3.1 1.5-3.5 3.5-.4-2-1.5-3.1-3.5-3.5 2-.4 3.1-1.5 3.5-3.5z" fill="#F59E0B"/></svg>`;

/* 情景（左）：会議机のメモ帳に「要確認」の付箋が増えていく＋？マーク */
const sBad=`<svg viewBox="0 0 428 104"><defs>
  <linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C08457"/><stop offset="1" stop-color="#9A6440"/></linearGradient>
  <linearGradient id="pd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#EEF1F5"/></linearGradient></defs>
  <rect x="0" y="78" width="428" height="26" fill="url(#dk)"/>
  <rect x="18" y="20" width="106" height="70" rx="4" fill="#000" opacity=".12"/>
  <rect x="14" y="16" width="106" height="70" rx="4" fill="url(#pd)" stroke="#CBD5E1"/>
  <path d="M26 32h80M26 46h80M26 60h52" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  ${[['要確認',134,14,-6],['持ち帰り',200,22,5],['要確認',266,12,-3]].map(([t,x,y,r])=>`<g transform="rotate(${r} ${x+30} ${y+24})">
    <rect x="${x+2}" y="${y+3}" width="60" height="46" fill="#000" opacity=".12"/><rect x="${x}" y="${y}" width="60" height="46" fill="#FDE68A"/>
    <rect x="${x}" y="${y}" width="60" height="9" fill="#FACC15"/>
    <text x="${x+31}" y="${y+32}" font-size="13" font-weight="900" fill="#92400E" text-anchor="middle" font-family="Noto Sans JP">${t}</text></g>`).join('')}
  <text x="332" y="40" font-size="30" font-weight="900" fill="#DC2626" font-family="Noto Sans JP">?</text>
  <text x="336" y="72" font-size="20" font-weight="900" fill="#F87171" font-family="Noto Sans JP">?</text>
  </svg>`;
/* 情景（右）：合意の書類に「決定」スタンプ＋握手のかわりに✓ */
const sGood=`<svg viewBox="0 0 428 104"><defs>
  <linearGradient id="dk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C08457"/><stop offset="1" stop-color="#9A6440"/></linearGradient>
  <linearGradient id="pd2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
  <rect x="0" y="78" width="428" height="26" fill="url(#dk2)"/>
  <rect x="34" y="12" width="150" height="80" rx="4" fill="#000" opacity=".12"/>
  <rect x="30" y="8" width="150" height="80" rx="4" fill="url(#pd2)" stroke="#CBD5E1"/>
  <text x="44" y="30" font-size="13.5" font-weight="900" fill="#1F2937" font-family="Noto Sans JP">決まったこと</text>
  <path d="M44 44h70M44 58h90M44 72h56" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <g transform="rotate(-12 150 54)"><circle cx="150" cy="54" r="27" fill="none" stroke="#DC2626" stroke-width="4"/>
  <circle cx="150" cy="54" r="21" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="150" y="61" font-size="18" font-weight="900" fill="#DC2626" text-anchor="middle" font-family="Noto Sans JP">決定</text></g>
  <circle cx="238" cy="46" r="24" fill="#16A34A"/><path d="M226 46l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270" y="40" font-size="15" font-weight="900" fill="#065F46" font-family="Noto Sans JP">その場で</text>
  <text x="270" y="60" font-size="15" font-weight="900" fill="#065F46" font-family="Noto Sans JP">決まった</text>
  </svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.132-1</div>
    <div class="vol-logo cpl">${spark('t1')}</div>
    <div class="title-text">会議の前に要点を読んでおくと、<span class="hl">その場で決まって持ち帰りが減る</span></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">会議の30分前に、関係するメールと資料の要点を Copilot にまとめさせておくと、<br><b>相手の相談に先回り</b>して答えられます。「確認して後ほど」が減ります</div>
  </div>

  <div class="stage">
    <div class="col bad">
      <div class="ph"><span class="mk">${svgw(P.x,3)}</span>準備なしで会議に入る</div>
      <div class="scn">${sBad}<img class="chara" src="${A}chara/chara_trouble.png" alt=""></div>
      <div class="mtg">
        <div class="mh"><img src="${A}icons/pa_teams.png" alt="">みどり精機 定例<span class="rec">14:03</span></div>
        <div class="mb">
          <div class="say them"><span class="av">佐藤</span><div class="bb"><span class="nm">佐藤（みどり精機）</span>先日メールした納期の件、いかがでしょう？</div></div>
          <div class="say me"><span class="av">私</span><div class="bb">すみません、メールを見返して<br>後ほどご連絡します…</div></div>
        </div>
      </div>
      <div class="res"><span class="tag">持ち帰り</span>次の会議へ<span class="memo"><span>納期</span><span>単価</span><span>資料</span></span></div>
    </div>

    <div class="mid">
      <div class="eng">
        <span class="tm">13:30</span>
        <div class="lg">${spark('t2')}</div>
        <div class="t1">会議の30分前に<br>Copilot で<br>要点を読む</div>
        <span class="chip">/ みどり精機 定例</span>
        <div class="gets"><span>✉ メールの要点</span><span>📄 資料の要点</span><span>? 決めること</span></div>
      </div>
      <div class="metric"><span class="ml">会議の持ち帰り</span><div class="row"><span class="mv">3件</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">0件</span></div></div>
    </div>

    <div class="col good">
      <div class="ph"><span class="mk">${svgw(P.ok,3)}</span>要点を読んでから入る</div>
      <div class="scn">${sGood}<img class="chara" src="${A}chara/chara_guts.png" alt=""></div>
      <div class="mtg">
        <div class="mh"><img src="${A}icons/pa_teams.png" alt="">みどり精機 定例<span class="rec">14:03</span></div>
        <div class="mb">
          <div class="say me"><span class="av">私</span><div class="bb">納期の件、<b>27日</b>だと御社の棚卸しと<br>重なりますよね。分けて納めませんか？</div></div>
          <div class="say them"><span class="av">佐藤</span><div class="bb"><span class="nm">佐藤（みどり精機）</span>そこまで見ていただけて助かります！</div></div>
        </div>
      </div>
      <div class="res"><span class="tag">その場で決定</span>11/20 と 11/27 の2回に分けて納品</div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>30分前に読むのは、Copilot がまとめた1画面だけ。<b>どう出るかは2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft サポート「Microsoft Copilot で特定のファイルなどを参照する」／会社名・人名・内容は架空の例</div>
`;
</script>
</body>
</html>
