<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.25-4 資料そのものの注意</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:14px;}
  .tbl{flex:1.35;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:2px solid var(--cs-line);
    box-shadow:0 6px 14px rgba(0,0,0,.12);background:#fff;}
  .cap{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--cs-bg);border-bottom:2px solid var(--cs-line);font-size:19px;font-weight:900;color:var(--navy);}
  .tr{flex:1;min-height:0;display:flex;align-items:center;border-bottom:1.5px solid #EDE9FE;}
  .tr:last-child{border-bottom:none;}
  .tr.h{flex:0 0 30px;background:#FAFAFA;}
  .tr.sk{background:#F5F3FF;}
  .tc{padding:3px 11px;font-size:15.5px;font-weight:700;color:#374151;line-height:1.36;}
  .tc.k{flex:0 0 215px;font-size:18px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .tc.k svg,.tc.k img{flex:0 0 30px;width:30px;height:30px;}
  .tc.r{flex:0 0 190px;}
  .tc.r b{color:var(--cs-dark);}
  .tc.w{flex:1;min-width:0;}
  .tc.ex{flex:0 0 0;display:none;}
  .tr.h .tc{font-size:13.5px;font-weight:800;color:#6B7280;}
  .right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .file{flex:1;min-height:0;display:flex;flex-direction:column;background:#1E1B2E;border-radius:12px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.2);}
  .file .fh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#2D2A45;color:#E9E5FF;font-size:15px;font-weight:800;
    font-family:"Segoe UI","Noto Sans JP",sans-serif;}
  .file .fh .z{margin-left:auto;font-size:12.5px;color:#C4B5FD;}
  .file pre{flex:1;min-height:0;margin:0;padding:8px 14px;font-family:Consolas,"Noto Sans JP",monospace;font-size:14px;line-height:1.42;color:#E5E7EB;white-space:pre-wrap;}
  .file .y{color:#FDE68A;} .file .g{color:#86EFAC;} .file .c{color:#C4B5FD;font-weight:700;}
  .fact{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#FFFBEB;border:2px solid #F59E0B;border-radius:12px;padding:6px 12px;}
  .fact .t{font-size:16px;font-weight:900;color:var(--navy);line-height:1.3;}
  .fact .t small{display:block;font-size:13.5px;font-weight:700;color:#4B5563;}
  .fact svg{flex:0 0 46px;width:46px;height:46px;}
  .mock{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2px solid #E1DFDD;border-radius:12px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.12);}
  .mock .mh{flex:0 0 auto;padding:6px 12px;background:#F5F3FF;border-bottom:1.5px solid #E1DFDD;font-size:15px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .mock .mh img{width:22px;height:22px;}
  .fr{flex:1;min-height:0;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid #F1F1F1;font-size:15.5px;font-weight:800;color:#1B2A44;}
  .fr:last-child{border-bottom:none;}
  .fr img{width:24px;height:24px;flex:0 0 24px;}
  .fr .nm{flex:1;min-width:0;}
  .fr .nm small{display:block;font-size:13px;font-weight:700;color:#B91C1C;}
  .fr .ok{flex:0 0 auto;font-size:13px;font-weight:800;color:#15803D;border:1.5px solid #86EFAC;border-radius:11px;padding:1px 9px;background:#F0FDF4;}
  .fr.bad{background:#FFF7F7;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ic={
 up:`<svg viewBox="0 0 32 32"><rect x="4" y="18" width="24" height="10" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><path d="M16 22 V5 M9 11 l7-7 7 7" fill="none" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 sz:`<svg viewBox="0 0 46 46"><rect x="8" y="4" width="30" height="38" rx="4" fill="#fff" stroke="#D97706" stroke-width="2"/><text x="23" y="29" text-anchor="middle" font-size="12" font-weight="900" fill="#92400E" font-family="Segoe UI">7MB</text></svg>`,
 img:`<svg viewBox="0 0 46 46"><rect x="5" y="8" width="36" height="30" rx="4" fill="#fff" stroke="#D97706" stroke-width="2"/><path d="M12 30 l8-9 6 6 4-4 6 7z" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/><path d="M30 14 l-12 12" stroke="#DC2626" stroke-width="3"/></svg>`};

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.25</div>
    <div class="part-pill">早見表 <b>(4/4)</b></div>
    <div class="title-text">資料を入れる前に知っておく<br><span class="q">更新・サイズ・読めない資料</span></div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/sharepoint.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">早見表</div>
    <div class="txt">説明を整えても、<b>資料が古い・読めない</b>と答えは良くならない。<br>
      入れ方で<em>更新のされ方</em>が変わるので、更新の多い資料は入れ方を選ぶ。</div>
  </div>

  <div class="body">
    <div class="tbl">
      <div class="cap"><img class="msi" src="${A}icons/cs_logo.png" alt="">入れ方ごとの更新のされ方</div>
      <div class="tr h"><div class="tc k">入れ方</div><div class="tc r">元の資料を直したら</div><div class="tc w">向いている資料</div></div>
      <div class="tr"><div class="tc k">${ic.up}アップロード</div><div class="tc r"><b>古いまま</b><br>自分で差し替える</div><div class="tc w">めったに変わらない規程・マニュアル</div></div>
      <div class="tr"><div class="tc k"><img src="${A}icons/ms/sharepoint.svg" alt="">SharePoint を<br>アップロード</div><div class="tc r"><b>4〜6時間ごと</b>に同期<br>手動では起こせない</div><div class="tc w">月に数回だけ直す手順書</div></div>
      <div class="tr sk"><div class="tc k"><img src="${A}icons/ms/sharepoint.svg" alt="">SharePoint を<br>そのままつなぐ</div><div class="tc r">直した内容を<b>使う</b><br>（検索の準備待ちあり）</div><div class="tc w">よく直す資料・<br>見る人を分けたい資料</div></div>
    </div>
    <div class="right">
      <div class="mock">
        <div class="mh"><img src="${A}icons/cs_logo.png" alt="">ナレッジ（「準備完了」でも答えに使われない例）</div>
        <div class="fr bad"><img src="${A}icons/ms/word.svg" alt=""><span class="nm">人事評価_社外秘.docx<small>秘密度ラベル付き</small></span><span class="ok">準備完了</span></div>
        <div class="fr bad"><img src="${A}icons/ms/excel.svg" alt=""><span class="nm">給与テーブル.xlsx<small>パスワード付き</small></span><span class="ok">準備完了</span></div>
        <div class="fr"><img src="${A}icons/ms/word.svg" alt=""><span class="nm">経理手順書_v3.docx<small style="color:#15803D">ラベルなし → 答えに使える</small></span><span class="ok">準備完了</span></div>
      </div>
      <div class="fact">${ic.sz}<span class="t">M365 Copilot のライセンスがないと 7MB まで<small>SharePoint の大きいファイルは読まれない</small></span></div>
      <div class="fact">${ic.img}<span class="t">資料の中のリンク先は読まない<small>画像は PDF に入ったものだけ</small></span></div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">入れたあとに続けること</div>
      <div class="grid">
        <div class="fc"><div class="ft">古い版を外す</div><div class="fd">定期的に見直して<br>古い資料は消す</div></div>
        <div class="fc"><div class="ft">ページはモダンだけ</div><div class="fd">SharePoint の<br>クラシックページは対象外</div></div>
        <div class="fc"><div class="ft">アップロードの上限</div><div class="fd">1ファイル 512MB<br>500ファイルまで</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">「準備完了」は<b>読み込めた</b>という意味。<br>答えに使えるかはテストで確かめる。</div>
    </div>
    <div class="src">出典：Microsoft Learn（ナレッジ ソースの概要／ファイルのアップロード／SharePoint のナレッジ）／ファイル名は架空</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_guts_g.png" alt="">
`;
</script>
</body>
</html>
