<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.130-1 支払期限を過ぎた取引先だけを拾い、督促メールの下書きを作る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  /* 型C：主役モック（入金台帳 → 下書きフォルダーに督促メールが並ぶ）*/
  .stage{gap:10px;}
  .led{flex:0 0 560px;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #9FD6BC;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 14px rgba(6,95,70,.12);}
  .led .lh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 11px;background:linear-gradient(90deg,#036C70,#0E8A8F);color:#fff;font-size:16px;font-weight:900;}
  .led .lh img{width:26px;height:26px;background:#fff;border-radius:6px;padding:2px;}
  .led .lh .c{margin-left:auto;font-size:14px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;}
  .lr{flex:1;display:grid;grid-template-columns:1.5fr 1fr .85fr .9fr;align-items:center;border-bottom:1.3px solid #EEF2F6;font-size:15.5px;font-weight:700;color:#334155;position:relative;}
  .lr > span{padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lr .n{text-align:right;font-family:'Roboto Mono',monospace;}
  .lr .d{font-family:'Roboto Mono',monospace;}
  .lr.h{flex:0 0 30px;background:#F1F5F9;font-size:14px;font-weight:900;color:#475569;}
  .st{justify-self:start;margin-left:9px;font-size:14px;font-weight:900;border-radius:6px;padding:1px 8px;}
  .st.ok{background:#DCFCE7;color:#065F46;} .st.ng{background:#DC2626;color:#fff;} .st.wt{background:#F1F5F9;color:#64748B;}
  .lr.over{background:#FEF2F2;outline:2.5px solid #F87171;outline-offset:-3px;font-weight:900;color:#991B1B;}
  .filt{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 11px;background:#FFF7ED;border-top:2px dashed #FDBA74;font-size:15.5px;font-weight:900;color:#9A3412;}
  .filt img{width:24px;height:24px;}

  .mid{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .mid .lg{width:60px;height:60px;background:#fff;border-radius:15px;padding:8px;box-shadow:0 4px 10px rgba(30,58,138,.25);}
  .mid .lb{font-size:16px;font-weight:900;color:var(--blue-dark);text-align:center;line-height:1.3;}
  .mid .ar{width:78px;height:30px;}

  .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .ol{flex:1;min-height:0;background:#fff;border:2.5px solid #9DB8E0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .ol .oh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 11px;background:linear-gradient(90deg,#0F6CBD,#2B88D8);color:#fff;font-size:15.5px;font-weight:900;}
  .ol .oh img{width:24px;height:24px;background:#fff;border-radius:5px;padding:2px;}
  .ol .oh .c{margin-left:auto;font-size:14px;background:#DC2626;border-radius:999px;padding:1px 9px;}
  .ob{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px 9px;background:#F8FAFC;}
  .dr{flex:0 0 auto;background:#fff;border:1.8px solid #D5DEEA;border-left:6px solid #0F6CBD;border-radius:8px;padding:5px 9px;display:flex;flex-direction:column;gap:2px;}
  .dr .tg{align-self:flex-start;font-size:13.5px;font-weight:900;color:#B91C1C;background:#FEE2E2;border-radius:5px;padding:0 7px;}
  .dr .to{font-size:14px;font-weight:900;color:#64748B;}
  .dr .sj{font-size:16px;font-weight:900;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr .bd{font-size:15.5px;font-weight:700;color:#334155;line-height:1.4;}
  .dr .bd b{color:#B91C1C;}
  .dr.big{flex:1;min-height:0;}
  .dr.sm .bd{display:none;}
  .bot{flex:0 0 auto;display:flex;gap:8px;}
  .bot .uses{flex:1;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:4px 9px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const ARR=`<svg class="ar" viewBox="0 0 78 30" xmlns="http://www.w3.org/2000/svg"><path d="M4 15 H 62" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M56 5 L 72 15 L 56 25" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const R=(c,n,d,st,cls)=>`<div class="lr${cls?' '+cls:''}"><span>${c}</span><span class="n">${n}</span><span class="d">${d}</span><span class="st ${st[0]}">${st[1]}</span></div>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.130-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">支払期限を過ぎた取引先だけを拾い、<span class="hl">督促メールの下書きを作る</span></div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">毎朝、入金台帳から<b>「期限を過ぎて未入金」</b>の行だけを拾い、督促メールを下書きに作ります。<br>送るのは、担当が中身を確かめてから</div>
  </div>

  <div class="stage">
    <div class="led">
      <div class="lh"><img src="${A}icons/pa_sharepoint.png" alt="">入金台帳（10月分）<span class="c">今日 10/13</span></div>
      <div class="lr h"><span>取引先</span><span class="n">請求額</span><span>支払期限</span><span>状態</span></div>
      ${R('山田商事株式会社','187,000','09/30',['ok','入金済み'])}
      ${R('鈴木運輸株式会社','96,250','09/30',['ng','未入金'],'over')}
      ${R('みどり製作所','52,800','10/10',['ok','入金済み'])}
      ${R('高橋工業株式会社','330,000','10/10',['ng','未入金'],'over')}
      ${R('田中電機','74,800','10/31',['wt','期限前'])}
      ${R('青葉設備','128,700','10/31',['wt','期限前'])}
      <div class="filt"><img src="${A}icons/pa_condition.png" alt="">期限 &lt; 今日　かつ　状態 ＝ 未入金　→ 2件</div>
    </div>

    <div class="mid">
      <img class="lg" src="${A}icons/pa_logo.png" alt="">
      <div class="lb">毎朝<br>9時</div>
      ${ARR}
      <img src="${A}chara/chara_guts.png" alt="" style="height:112px;margin-top:6px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));">
    </div>

    <div class="right">
      <div class="ol">
        <div class="oh"><img src="${A}icons/pa_outlook.png" alt="">Outlook ＞ 下書き<span class="c">新しく2件</span></div>
        <div class="ob">
          <div class="dr big">
            <span class="tg">期限を13日過ぎ</span>
            <span class="to">宛先：鈴木運輸株式会社 経理ご担当者様</span>
            <span class="sj">【ご確認のお願い】9月分ご請求（96,250円）のお支払いについて</span>
            <span class="bd">いつもお世話になっております。<br>9/30がお支払期限の<b>ご請求 96,250円</b>について、<br>本日時点で入金の確認ができておりません。<br>お手数ですが、ご確認をお願いいたします。<br>行き違いの際はご容赦ください。</span>
          </div>
          <div class="dr sm">
            <span class="tg">期限を3日過ぎ</span>
            <span class="to">宛先：高橋工業株式会社 経理ご担当者様</span>
            <span class="sj">【ご確認のお願い】ご請求（330,000円）のお支払いについて</span>
          </div>
        </div>
      </div>
      <div class="bot">
        <div class="metric"><span class="ml">督促を書くまで</span><span class="mv">月末</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">翌朝</span></div>
        <div class="uses"><span class="ul">使いどころ</span><span class="u">経理の入金管理</span><span class="u">営業事務</span><span class="u">家賃・会費</span></div>
      </div>
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>未入金の相手を目で探して、督促文を1通ずつ打つ作業がなくなります。<b>作り方は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「SharePoint コネクタ」「Office 365 Outlook コネクタ」「繰り返しトリガー」／社名・金額は架空</div>
`;
</script>
</body>
</html>
