<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.2-2 会議のCopilotを開く場所と、会議の後も聞くための条件の早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  /* 型E：早見表（左に開く場所のモック／右に場面ごとの一覧）*/
  .stage{gap:12px;}
  .lft{flex:0 0 400px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .rgt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0;}
  .hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-size:22px;font-weight:900;color:var(--mc-dark);}
  .hd .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;background:linear-gradient(180deg,#14B8A6,#0F766E);box-shadow:0 2px 4px rgba(0,0,0,.22);}
  /* 会議の画面（右に Copilot の欄）*/
  .mt{flex:1;min-height:0;display:flex;flex-direction:column;background:#1F1F1F;border-radius:12px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.25);}
  .mt .bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#292929;color:#fff;font-size:15px;font-weight:700;}
  .mt .bar .cp{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;color:#242424;border-radius:6px;padding:3px 10px;font-size:15.5px;font-weight:800;
    box-shadow:0 0 0 3px #F59E0B;}
  .mt .bar .cp i{width:24px;height:24px;border-radius:0;background:url(../../pptx/_assets/icons/ms/copilot.png) center/contain no-repeat;display:inline-block;}
  .mt .bd{flex:1;min-height:0;display:flex;gap:6px;padding:7px;}
  .mt .vid{flex:0 0 108px;display:flex;flex-direction:column;gap:6px;}
  .mt .vid div{flex:1;border-radius:7px;background:#3A3A3A;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;}
  .side{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:8px;overflow:hidden;}
  .side .sh{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;}
  .side .sh i{width:26px;height:26px;border-radius:0;background:url(../../pptx/_assets/icons/ms/copilot.png) center/contain no-repeat;display:inline-block;}
  .side .sb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:9px 10px;}
  .side .lk{align-self:flex-start;font-size:15.5px;font-weight:700;color:#5B5FC7;border:2px dashed #F59E0B;border-radius:7px;padding:3px 9px;}
  .side .in{display:flex;align-items:center;gap:6px;border:1.5px solid #C7C7C7;border-radius:8px;padding:7px 9px;}
  .side .in .cur{width:2px;height:18px;background:#5B5FC7;}
  .side .in .snd{margin-left:auto;width:22px;height:22px;color:#5B5FC7;}
  .side .ex{align-self:flex-end;max-width:94%;background:#E8EBFA;border:1.5px solid #C5CAF2;border-radius:10px 10px 3px 10px;padding:5px 9px;font-size:14.5px;font-weight:700;color:#1B2A44;line-height:1.35;}
  .side .ex .el{display:block;font-size:12.5px;font-weight:900;color:#5B5FC7;}
  .side .pop{font-size:15px;font-weight:700;color:#424242;background:#F3F2F1;border-radius:7px;padding:5px 9px;line-height:1.35;border:2px dashed #F59E0B;}
  .lcap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.35;border-radius:9px;padding:7px 11px;color:var(--mc-dark);background:#D5F3EE;}
  .lcap b{color:var(--orange);}
  /* 早見表 */
  .trow{gap:10px;padding:4px 10px;}
  .trow .ico{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#CCFBF1;color:var(--mc-dark);display:flex;align-items:center;justify-content:center;padding:7px;}
  .trow.hot .ico{background:#FED7AA;color:#9A3412;}
  .trow .k{flex:0 0 238px;font-size:17px;}
  .trow .k small{display:block;font-size:13.5px;font-weight:800;color:var(--weak);}
  .trow .v{flex:1;font-size:15.5px;font-weight:800;line-height:1.32;}
  .trow .v b{color:#B91C1C;}
  .trow .v .ui{background:#fff;border:1.5px solid #99E2D6;border-radius:5px;padding:0 5px;color:#134E4A;white-space:nowrap;}
  .trow.hot .v .ui{border-color:#FDBA74;color:#9A3412;}
  .warnbar .ws span b{color:#B91C1C;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  send:'<path d="M4 12l16-8-6 16-3-7z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  hand:'<path d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-3.5a1.5 1.5 0 0 1 2.6-1.5L8 13"/>',
  win:'<rect x="3" y="5" width="12" height="12" rx="2"/><rect x="11" y="9" width="10" height="11" rx="2"/>',
  after:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills">
      <div class="vol-pill"><small>M365 Copilot</small>Vol.2-2</div>
      <div class="lic-pill paid">M365 Copilot ライセンスが要る</div>
    </div>
    <div class="title-text">会議の Copilot を開く場所と、<span class="hl">会議の後も<br>聞くための条件</span>の早見表</div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/teams.svg" alt=""><span class="pl">＋</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip app"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:34px;height:34px"></div>
    <div class="txt">会議が終わってからも聞きたいなら、会議中に<b>文字起こしをオン</b>にしておく。<br>主催者の会議オプションで Copilot が［オフ］だと、ライセンスがあっても使えません</div>
  </div>

  <div class="stage">
    <div class="lft">
      <div class="hd"><span class="n">1</span>会議の画面で開く</div>
      <div class="mt seg">
        <div class="bar"><img class="msi" src="${A}icons/ms/teams.svg" alt="" style="width:26px;height:26px">会議コントロール<span class="cp"><i></i>Copilot</span></div>
        <div class="bd">
          <div class="vid"><div style="background:#C2410C">佐</div><div style="background:#0E7490">山</div><div style="background:#6D28D9">鈴</div></div>
          <div class="side">
            <div class="sh"><i></i>Copilot</div>
            <div class="sb">
              <div class="ex"><span class="el">聞ける例（公式の例文）</span>会議を進めるために<br>どのような質問をすれば<br>よいでしょうか?</div>
              <div class="pop">何を聞くか迷ったら、<br>候補から選べる</div>
              <span class="lk">プロンプトを表示</span>
              <div class="in"><span class="cur"></span><span class="snd">${svgw(P.send,2.2)}</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="lcap">会議コントロールの［Copilot］で<br>自分だけのチャットが右に開く</div>
    </div>

    <div class="rgt">
      <div class="hd"><span class="n">2</span>場面ごとの開き方と条件</div>
      <div class="tbl">
        <div class="trow"><span class="ico">${svgw(P.clock,2.2)}</span><span class="k">5分以上遅れて入った<small>Copilot が有効な会議</small></span><span class="v">届いた通知の <span class="ui">Copilot を開く</span><br>要約が会議ウィンドウの右に出る</span></div>
        <div class="trow"><span class="ico">${svgw(P.hand,2)}</span><span class="k">会議中に自分で聞く</span><span class="v">会議コントロールの <span class="ui">Copilot</span><br><span class="ui">プロンプトを表示</span> か、自分で入力</span></div>
        <div class="trow"><span class="ico">${svgw(P.win,2.2)}</span><span class="k">ほかの作業と並べたい<small>デスクトップ版</small></span><span class="v"><span class="ui">ウィンドウでプライベート Copilot を開く</span></span></div>
        <div class="trow hot"><span class="ico">${svgw(P.after,2.2)}</span><span class="k">会議が終わってから聞く</span><span class="v">会議チャットか <span class="ui">要約</span> タブから。<br><b>会議中に文字起こしをオン</b>にしたときだけ</span></div>
        <div class="trow"><span class="ico" style="background:#fff;border:1.5px solid #D8EFEA;gap:2px;padding:4px;width:62px"><img class="msi" src="${A}icons/ms/word.svg" alt="" style="width:26px;height:26px"><img class="msi" src="${A}icons/ms/excel.svg" alt="" style="width:26px;height:26px"></span><span class="k">長い回答・表を残したい</span><span class="v">1,300文字を超える回答は <img class="msi" src="${A}icons/ms/word.svg" alt="" style="width:24px;height:24px"> Word で、<br>表の回答は <img class="msi" src="${A}icons/ms/excel.svg" alt="" style="width:24px;height:24px"> Excel で開ける</span></div>
        <div class="trow hot"><span class="ico">${svgw(P.gear,2.2)}</span><span class="k">主催者が会議ごとに決める</span><span class="v">会議オプションの Copilot：<br><span class="ui">会議中および会議後</span> <span class="ui">会議中のみ</span> <span class="ui">オフ</span></span></div>
      </div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws">
      <span>使う人ごとに <b>M365 Copilot ライセンス</b></span>
      <span>社外の組織が主催する会議では使えない</span>
      <span>［会議中のみ］は、文字起こししていない分が会議後に消える</span>
    </span>
  </div>
  <div class="src">出典：Microsoft サポート「Teams で Microsoft Copilot を使用して会議に追いつく」／Microsoft Learn「Teams の会議やイベントで Microsoft Copilot を管理する」／画面は説明用の再現</div>
`;
</script>
</body>
</html>
