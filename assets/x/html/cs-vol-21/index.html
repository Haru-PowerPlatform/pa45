<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.21-1 本番のAIを直接直さない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{gap:0;}
  .panel{position:relative;}
  .pL{flex:1;} .pR{flex:1.3;}
  .ph{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .ph .tag{flex:0 0 auto;font-size:15px;font-weight:900;color:#fff;border-radius:8px;padding:3px 11px;}
  .p-ng .tag{background:var(--red);} .p-cs .tag{background:var(--cs);}
  .ph .h{font-size:25px;font-weight:900;color:var(--navy);line-height:1.2;}
  .scene{flex:1;min-height:0;position:relative;}
  .scene svg{width:100%;height:100%;display:block;}
  .cap{flex:0 0 auto;font-size:15.5px;font-weight:700;color:#374151;line-height:1.42;border-top:1.5px dashed #CBD5E1;padding-top:6px;}
  .p-ng .cap b{color:var(--red-dark);} .p-cs .cap b{color:var(--cs-dark);}
  .vs{flex:0 0 64px;display:flex;align-items:center;justify-content:center;z-index:5;}
  .vs .b{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;font-weight:900;font-size:16px;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;box-shadow:0 4px 10px rgba(124,58,237,.45);border:3px solid #fff;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
/* 左：使っている最中の本番を直接いじる */
const SL=`<svg viewBox="0 0 440 270" preserveAspectRatio="xMidYMid meet">
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".22"/></filter>
  <linearGradient id="rm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEE2E2"/><stop offset="1" stop-color="#FECACA"/></linearGradient></defs>
  <!-- 本番の部屋 -->
  <rect x="10" y="6" width="420" height="200" rx="16" fill="url(#rm)" stroke="#F87171" stroke-width="2.5"/>
  <rect x="24" y="16" width="70" height="26" rx="13" fill="#DC2626"/><text x="59" y="34" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Noto Sans JP">本番</text>
  <!-- AI（工事中） -->
  <g transform="translate(160,50)" filter="url(#sh)">
    <rect width="120" height="86" rx="16" fill="#fff" stroke="#7C3AED" stroke-width="2.5"/>
    <image href="${A}icons/cs_logo.png" x="38" y="10" width="44" height="44"/>
    <text x="60" y="74" text-anchor="middle" font-size="13" font-weight="900" fill="#1B2A44" font-family="Noto Sans JP">経費の質問窓口</text>
  </g>
  <!-- 工事中のテープ -->
  <g transform="rotate(-8 220 150)"><rect x="140" y="138" width="160" height="22" fill="#FACC15"/>
  ${[0,1,2,3,4,5,6,7].map(i=>`<path d="M${146+i*20} 138 l12 0 l-10 22 l-12 0z" fill="#1F2937"/>`).join('')}</g>
  <!-- 利用者 -->
  ${[[40,'？'],[360,'え？']].map(([x,t])=>`<g transform="translate(${x},96)"><circle cx="20" cy="14" r="12" fill="#94A3B8"/><path d="M2 58 q18 -36 36 0z" fill="#64748B"/>
    <rect x="-6" y="-28" width="52" height="24" rx="10" fill="#fff" stroke="#F87171" stroke-width="1.8"/><text x="20" y="-11" text-anchor="middle" font-size="13" font-weight="900" fill="#B91C1C" font-family="Noto Sans JP">${t}</text></g>`).join('')}
  <text x="220" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#991B1B" font-family="Noto Sans JP">使っている最中に指示文を書き換える</text>
  <!-- 壊れた回答 -->
  <g transform="translate(30,216)" filter="url(#sh)"><rect width="380" height="44" rx="10" fill="#fff" stroke="#F87171" stroke-width="2"/>
  <text x="14" y="28" font-size="14.5" font-weight="800" fill="#991B1B" font-family="Noto Sans JP">⚠ 昨日まで答えていた質問に答えなくなった</text></g>
</svg>`;
/* 右：開発→テスト→本番 */
function room(x,lab,col,bg,sub){return `<g transform="translate(${x},20)">
  <rect width="160" height="170" rx="16" fill="${bg}" stroke="${col}" stroke-width="2.5"/>
  <rect x="12" y="10" width="86" height="26" rx="13" fill="${col}"/><text x="55" y="28" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Noto Sans JP">${lab}</text>
  <g filter="url(#sh2)"><rect x="34" y="50" width="92" height="74" rx="14" fill="#fff" stroke="#7C3AED" stroke-width="2"/>
  <image href="${A}icons/cs_logo.png" x="60" y="58" width="40" height="40"/>
  <text x="80" y="115" text-anchor="middle" font-size="11.5" font-weight="900" fill="#1B2A44" font-family="Noto Sans JP">経費の質問窓口</text></g>
  <text x="80" y="152" text-anchor="middle" font-size="13.5" font-weight="800" fill="#374151" font-family="Noto Sans JP">${sub}</text></g>`;}
const SR=`<svg viewBox="0 0 580 270" preserveAspectRatio="xMidYMid meet">
  <defs><filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".2"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7C3AED"/></marker></defs>
  ${room(4,'開発','#7C3AED','#F5F3FF','ここで直す')}
  ${room(210,'テスト','#D97706','#FFFBEB','少人数で確かめる')}
  ${room(416,'本番','#16A34A','#ECFDF5','みんなが使う')}
  <g stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#ar)"><path d="M166 105 H206"/><path d="M372 105 H412"/></g>
  <!-- パイプライン -->
  <rect x="60" y="206" width="460" height="40" rx="20" fill="url(#pp)" stroke="#5B21B6" stroke-width="2"/>
  <defs><linearGradient id="pp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <text x="290" y="232" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Noto Sans JP">🚀 パイプラインで、同じ中身をそのまま運ぶ</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.21</div>
    <div class="part-pill">前編 <b>(1/4)</b></div>
    <div class="title-text">本番のAIは直接直さない。<br><span class="q">開発→テスト→本番</span>へ運ぶ</div>
    <div class="ibadge"><img src="${A}icons/cs_logo.png" alt=""><span class="pl">+</span><img src="${A}icons/ms/teams.svg" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_point_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">直すのは<b>開発環境</b>、確かめるのは<b>テスト環境</b>。よければ<b>パイプライン</b>で本番へ運ぶ。<br>
      ServiceNow も全社向けのエージェントを<em>開発・テスト・本番</em>に分けて回している。</div>
  </div>

  <div class="body">
    <div class="panel p-ng pL">
      <div class="ph"><span class="tag">いま</span><span class="h">本番で直接直す</span></div>
      <div class="scene">${SL}</div>
      <div class="cap">直した瞬間から全員に効く。<br><b>壊れたら、全員がその場で困る</b>。</div>
    </div>
    <div class="vs"><div class="b">分けて<br>運ぶ</div></div>
    <div class="panel p-cs pR">
      <div class="ph"><span class="tag">これから</span><span class="h">直す場所と使う場所を分ける</span></div>
      <div class="scene">${SR}</div>
      <div class="cap">本番に届くのは<b>テストを通った版だけ</b>。<br>運ぶたびに履歴が残り、前の版も取っておける。</div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">3つの環境の役目</div>
      <div class="grid">
        <div class="fc"><div class="ft">開発</div><div class="fd">作る人が自由に直す。<br>壊れても困らない</div></div>
        <div class="fc"><div class="ft">テスト</div><div class="fd">数人で本番と同じように<br>使って確かめる</div></div>
        <div class="fc"><div class="ft">本番</div><div class="fd">みんなが使う。<br>ここでは直さない</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 使う前に確認</div>
      <div class="txt">運ぶ先の環境は<b>マネージド環境</b>にしておく。<br>環境の分け方はコパスタ Vol.11 で。</div>
    </div>
    <div class="src">出典：Microsoft 顧客事例（ServiceNow・2026-11-16）／Microsoft Learn（Power Platform のパイプライン）／画面は説明用の再現</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_confident_g.png" alt="">
`;
</script>
</body>
</html>
