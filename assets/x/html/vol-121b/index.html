<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.121-2 返信メールからタスクを作る作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:5px;padding:7px 9px;}
  .col.ai{background:#F7F3FF;border:2.5px solid #C9B4F4;}
  .col.ai .ch2{color:#5B21B6;}
  .col.ai .ch2 .n{background:linear-gradient(180deg,#A78BFA,#6D28D9);}
  .col.ai .card{border-color:#C9B4F4;}
  .col.ai .cardh{background:#EDE4FF;border-bottom-color:#D8C9FA;color:#5B21B6;}
  .col.ai .cap{background:#E4D8FA;color:#5B21B6;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:5px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.24;}
  .fld .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .fld .fi.exp{border-color:var(--blue);background:#F4F8FF;font-family:'Roboto Mono',monospace;font-size:14px;
    color:var(--blue-dark);word-break:break-all;}
  .fld .fi img{width:22px;height:22px;object-fit:contain;flex:0 0 auto;}
  .prm{display:flex;flex-direction:column;gap:3px;background:#fff;border:2px solid #C9B4F4;border-radius:8px;padding:6px 9px;}
  .prm .pl{font-size:13.5px;font-weight:900;color:#7C3AED;}
  .prm .pt{font-size:15px;font-weight:700;color:#3B2A66;line-height:1.38;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.24;}
  .filt{display:flex;flex-direction:column;gap:4px;background:#F7F9FC;border:1.5px solid #E2EAF5;border-radius:8px;padding:6px 8px;}
  .ft{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:var(--navy);}
  .ft .fk3{flex:0 0 62px;font-size:13.5px;color:#64748B;}
  .ft .fv3{flex:1;background:#fff;border:1.4px solid #C7D6EE;border-radius:5px;padding:2px 8px;}
  .jsonb{background:#1E293B;border-radius:8px;padding:6px 9px;font-family:'Roboto Mono',monospace;font-size:13.5px;
    font-weight:700;color:#93C5FD;line-height:1.44;}
  .jsonb .g{color:#86EFAC;} .jsonb .y{color:#FDE68A;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SPARK='<path d="M0 -13l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/><path d="M8.5 4.5l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z"/>';

/* ① 全部ではなく、絞ってから起動する */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="m1f" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  ${[0,1,2,3,4].map(i=>`<g filter="url(#m1f)"><rect x="12" y="${8+i*18}" width="96" height="14" rx="4"
    fill="${i===1||i===3?'#EAF1FE':'#fff'}" stroke="${i===1||i===3?'#2563EB':'#DDE5F0'}" stroke-width="${i===1||i===3?'2':'1.4'}"/>
    <rect x="19" y="${12+i*18}" width="${[62,70,54,66,58][i]}" height="5" rx="2.5" fill="${i===1||i===3?'#9EC0F5':'#E2EAF5'}"/></g>`).join('')}
  <text x="60" y="98" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#1E40AF" text-anchor="middle">届いたメール</text>
  <path d="M118 50 H 144" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
  <g filter="url(#m1f)"><path d="M154 30 h84 l-30 26 v22 l-24 -12 v-10 z" fill="#EAF1FE" stroke="#2563EB" stroke-width="2.4" stroke-linejoin="round"/></g>
  <text x="196" y="98" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#1E40AF" text-anchor="middle">相手・件名で絞る</text>
  <path d="M248 50 H 274" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M268 44 l8 6 l-8 6" fill="none" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#m1f)"><rect x="282" y="26" width="94" height="48" rx="9" fill="#fff" stroke="#2563EB" stroke-width="2.6"/>
    <text x="329" y="46" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#1E40AF" text-anchor="middle">この2通だけ</text>
    <text x="329" y="64" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#1E40AF" text-anchor="middle">フローが動く</text></g>
</svg>`;

/* ② 本文 → 3項目のJSON */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="m2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <filter id="m2f" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B2A66" flood-opacity=".24"/></filter>
  </defs>
  <rect x="0" y="0" width="388" height="100" fill="#F3EEFF"/>
  <g filter="url(#m2f)"><rect x="12" y="14" width="104" height="72" rx="8" fill="#fff" stroke="#B79CF0" stroke-width="2.2"/>
    ${[0,1,2,3,4].map(i=>`<rect x="22" y="${26+i*11}" width="${[84,68,80,60,74][i]}" height="5" rx="2.5" fill="#DDD3F7"/>`).join('')}
    <rect x="22" y="48" width="52" height="7" rx="3" fill="#FDE68A"/></g>
  <path d="M124 50 H 148" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <g filter="url(#m2f)"><circle cx="180" cy="50" r="24" fill="url(#m2g)"/>
    <g transform="translate(180,50) scale(0.95)" fill="#fff">${SPARK}</g></g>
  <path d="M212 50 H 236" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M230 44 l8 6 l-8 6" fill="none" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  ${[['担当','#7C3AED',10],['作業','#7C3AED',38],['期日','#EA580C',66]].map(([t,c,y])=>
    `<g filter="url(#m2f)"><rect x="244" y="${y}" width="132" height="24" rx="7" fill="#fff" stroke="${c}" stroke-width="2.2"/>
      <text x="310" y="${+y+17}" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="${c}" text-anchor="middle">${t}</text></g>`).join('')}
</svg>`;

/* ③ Plannerに立つ */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="m3f" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B5136" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#DCF3E7"/>
  ${[['担当',10],['作業',38],['期日',66]].map(([t,y])=>
    `<g filter="url(#m3f)"><rect x="12" y="${y}" width="106" height="24" rx="7" fill="#fff" stroke="#7FCEA9" stroke-width="1.8"/>
      <text x="65" y="${+y+17}" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#0B5136" text-anchor="middle">${t}</text></g>`).join('')}
  <path d="M126 22 C 146 22, 152 40, 160 48" stroke="#16A34A" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M126 50 H 162" stroke="#16A34A" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M126 78 C 146 78, 152 60, 160 52" stroke="#16A34A" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <g filter="url(#m3f)"><rect x="170" y="14" width="206" height="72" rx="9" fill="#fff" stroke="#16A34A" stroke-width="2.6"/>
    <rect x="170" y="14" width="206" height="18" rx="9" fill="#0B6A4F"/><rect x="170" y="24" width="206" height="8" fill="#0B6A4F"/>
    <text x="273" y="27" font-family="Noto Sans JP" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">Planner のタスク</text>
    <rect x="182" y="40" width="126" height="7" rx="3.5" fill="#BFE7D3"/>
    <rect x="182" y="54" width="98" height="7" rx="3.5" fill="#D6EFE1"/>
    <rect x="182" y="68" width="62" height="10" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
    <text x="213" y="76" font-family="Roboto Mono" font-size="8" font-weight="700" fill="#9A3412" text-anchor="middle">9/05</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.121-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（絞って起動 → 抜き出す → タスクにする）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">全部のメールで動かさないのがコツ。<b>相手と件名で絞ってから</b>起動します</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>絞って起動する</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_outlook.png" alt="">新しいメールが届いたとき</div>
        <div class="cardb">
          <div class="filt">
            <div class="ft"><span class="fk3">差出人</span><span class="fv3">sato@example.com</span></div>
            <div class="ft"><span class="fk3">件名に含む</span><span class="fv3">見積</span></div>
            <div class="ft"><span class="fk3">フォルダー</span><span class="fv3">受信トレイ</span></div>
          </div>
          <div class="note">全部のメールで動かすと、余計なタスクが増えます</div>
        </div>
      </div></div>
      <div class="cap">お客さまごとにフローを分けても構いません</div>
    </div>

    <div class="col ai">
      <div class="ch2"><span class="n">2</span>用件を抜き出す</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_logo.png" alt="">プロンプトの実行</div>
        <div class="cardb">
          <div class="prm"><span class="pl">指示</span>
            <span class="pt">メール本文から依頼を抜き出し、担当・作業・期日の3つで返す。「今週中」などは受信日から日付に直す。</span></div>
          <div class="jsonb">{ "<span class="g">担当</span>": "自分",<br>
            &nbsp;&nbsp;"<span class="g">作業</span>": "見積書を送る",<br>
            &nbsp;&nbsp;"<span class="y">期日</span>": "2026-09-05" }</div>
        </div>
      </div></div>
      <div class="cap">出力を<b>決まった形</b>で返させると、次のアクションに渡しやすい</div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>タスクにする</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_logo.png" alt="">タスクを作成する</div>
        <div class="cardb">
          <div class="fld"><span class="fl">タイトル</span>
            <span class="fi hot"><span class="dyn">作業</span></span></div>
          <div class="fld"><span class="fl">期限の時刻</span>
            <span class="fi hot"><span class="dyn">期日</span></span></div>
          <div class="note">期日は人がひと目で確認（AIの読み違い対策）</div>
        </div>
      </div></div>
      <div class="cap">依頼が複数あるときは、<b>作業の数だけタスクが立ちます</b></div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>抽出はクレジット消費（プレミアム）</span><span>期日は人がひと目で確認</span>
      <span>Plannerコネクタは基本プランのみ</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Power Automate でプロンプトを使用する」「Office 365 Outlook／Plannerコネクタ」／宛先は架空</div>
`;
</script>
</body>
</html>
