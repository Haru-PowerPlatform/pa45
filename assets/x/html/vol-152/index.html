<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.152-1 研修後のアンケートを、4つの状態がそろった行だけに1回送る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{flex-direction:column;gap:8px;}
  .strip{flex:1;min-height:0;display:flex;gap:14px;}
  .koma{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:7px 9px 8px;position:relative;
    background:#F8FAFC;border:2.5px solid #DCE3EE;}
  .koma + .koma::before{content:"";position:absolute;left:-15px;top:50%;width:16px;height:30px;transform:translateY(-50%);
    background:#64748B;clip-path:polygon(0 0,100% 50%,0 100%);z-index:4;}
  .koma.k3{background:var(--green-bg);border-color:var(--green-line);box-shadow:0 0 0 3px #BBF7D0;}
  .kh{flex:0 0 auto;display:flex;align-items:center;gap:7px;}
  .kh .no{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#64748B;color:#fff;font-size:17px;font-weight:900;
    display:flex;align-items:center;justify-content:center;}
  .k3 .kh .no{background:var(--green);}
  .kh .tm{font-family:'Roboto Mono','Noto Sans JP',monospace;font-size:15.5px;font-weight:700;color:#fff;background:#1B2A44;
    border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .kt{flex:0 0 auto;font-size:22px;font-weight:900;color:var(--navy);line-height:1.15;white-space:nowrap;}
  .k3 .kt{color:var(--green-dark);}

  /* リスト1行のモック */
  .mk{flex:0 0 auto;background:#fff;border:2px solid #D5DEEA;border-radius:9px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 3px 8px rgba(20,40,90,.10);}
  .mk .mh{display:flex;align-items:center;gap:7px;padding:4px 8px;background:linear-gradient(90deg,#03787C,#0B9A8F);color:#fff;font-size:15px;font-weight:900;}
  .mk .mh img{width:22px;height:22px;background:#fff;border-radius:5px;padding:2px;}
  .mk .it{display:flex;align-items:baseline;justify-content:space-between;padding:4px 8px 3px;border-bottom:1.5px solid #E2E8F0;}
  .mk .it .nm{font-size:16px;font-weight:900;color:var(--navy);}
  .mk .it .dt{font-family:'Roboto Mono','Noto Sans JP',monospace;font-size:15px;font-weight:700;color:#475569;}
  .ln{display:grid;grid-template-columns:62px 1fr 108px;align-items:center;gap:5px;padding:4px 6px 4px 8px;border-bottom:1.2px solid #EEF2F6;}
  .ln:last-child{border-bottom:none;}
  .ln.chg{background:#FEF9C3;box-shadow:inset 4px 0 0 #EAB308;}
  .ln .lb{font-size:14px;font-weight:900;color:#64748B;white-space:nowrap;}
  .ln .vl{display:flex;align-items:center;gap:4px;font-size:15.5px;font-weight:900;color:var(--navy);white-space:nowrap;}
  .ln .vl.emp{color:#94A3B8;}
  .ln .vl.lk{color:#2563EB;text-decoration:underline;}
  .ln .vl svg{width:18px;height:18px;flex:0 0 auto;}
  .pill{white-space:nowrap;border-radius:999px;padding:0 9px;font-size:15.5px;font-weight:900;}
  .pill.plan{background:#E0E7FF;color:#3730A3;} .pill.done{background:#DCFCE7;color:#166534;} .pill.stop{background:#F1F5F9;color:#475569;}
  .bx{width:20px;height:20px;border-radius:4px;border:2.2px solid #94A3B8;background:#fff;display:inline-flex;align-items:center;justify-content:center;}
  .bx.on{background:#2563EB;border-color:#2563EB;color:#fff;}
  .bx svg{width:14px;height:14px;}
  /* 状態チップ（判定） */
  .cp{display:flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 3px;font-size:15.5px;font-weight:900;white-space:nowrap;}
  .cp .ck{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
  .cp .ck svg{width:16px;height:16px;}
  .cp.y{background:#DCFCE7;color:#166534;} .cp.y .ck{background:#16A34A;}
  .cp.n{background:#FEE2E2;color:#991B1B;} .cp.n .ck{background:#DC2626;}

  /* 判定 */
  .vd{flex:1;min-height:0;position:relative;border-radius:10px;overflow:hidden;background:#fff;border:2px solid #E2E8F0;}
  .vd svg.sc{position:absolute;inset:0;width:100%;height:100%;}
  .vd .vt{position:absolute;left:10px;top:8px;font-size:25px;font-weight:900;line-height:1;z-index:2;}
  .vd.no .vt{color:#991B1B;} .vd.go{border-color:#16A34A;background:#F0FDF4;} .vd.go .vt{color:#15803D;}
  .vd .vs{position:absolute;left:10px;top:40px;font-size:15px;font-weight:900;color:#475569;z-index:2;line-height:1.3;}
  .vd .ch{position:absolute;right:-4px;bottom:-6px;height:112px;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
  .kc{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.3;border-radius:8px;padding:4px 8px;background:#E7EEF7;color:#334155;}
  .k3 .kc{background:#CFEFE0;color:var(--green-dark);}
  .kc b{color:var(--orange);}

  /* 下段 */
  .bot{flex:0 0 auto;display:flex;gap:10px;align-items:stretch;height:78px;}
  .bx2{display:flex;align-items:center;gap:10px;background:#F8FAFC;border:2px solid #E2E8F0;border-radius:11px;padding:5px 10px;position:relative;}
  .bx2 .bh{font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.3;white-space:nowrap;}
  .bx2 .bh b{color:var(--orange);}
  .cx{background:#F8FAFC;}
  .cxrow{white-space:nowrap;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #CBD5E1;border-radius:8px;padding:3px 8px;}
  .cxrow .nm{font-size:15.5px;font-weight:900;color:#64748B;text-decoration:line-through;white-space:nowrap;}
  .acc{flex:1;background:#FFF7ED;border-color:#FDBA74;}
  .acc .bh{color:#9A3412;}
  .ac{display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;}
  .ac svg{width:64px;height:42px;}
  .ac span{font-size:14px;font-weight:900;color:#9A3412;white-space:nowrap;}
  .uses{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;background:#F8FAFC;border:2px solid #E2E8F0;border-radius:11px;padding:5px 10px;}
  .uses .ur{display:flex;flex-direction:column;gap:3px;}
  .uses{gap:2px;flex:0 0 auto;}
  .acc{min-width:0;gap:8px;}
  .bot{position:relative;}
  .bot .chara{position:absolute;right:2px;bottom:-4px;height:116px;z-index:6;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',ng:'<path d="M6 6l12 12M18 6L6 18"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'};
const OK=svgw(P.ok,3.4), NG=svgw(P.ng,3.4);
const SH=(id,c)=>`<filter id="${id}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="${c||'#1B2A44'}" flood-opacity=".25"/></filter>`;

/* チップと行 */
const chip=(ok,t)=>`<span class="cp ${ok?'y':'n'}"><span class="ck">${ok?OK:NG}</span>${t}</span>`;
const box=on=>`<span class="bx ${on?'on':''}">${on?svgw(P.ok,3.6):''}</span>`;
const row=(c)=>`
  <div class="mk">
    <div class="mh"><img src="${A}icons/ms/lists.svg" alt="">講座アンケート送付</div>
    <div class="it"><span class="nm">業務改善 入門講座</span><span class="dt">10/19 14:00</span></div>
    <div class="ln ${c.chg==0?'chg':''}"><span class="lb">状態</span><span class="vl"><span class="pill ${c.st=='開催予定'?'plan':'done'}">${c.st}</span></span>${chip(c.st=='開催済み','開催済み')}</div>
    <div class="ln ${c.chg==1?'chg':''}"><span class="lb">URL</span>${c.url?`<span class="vl lk">${svgw(P.link,2.4)}リンク</span>`:'<span class="vl emp">（空欄）</span>'}${chip(c.url,'URLあり')}</div>
    <div class="ln ${c.chg==2?'chg':''}"><span class="lb">送信OK</span><span class="vl">${box(c.ok)}</span>${chip(c.ok,'送信OK')}</div>
    <div class="ln ${c.chg==3?'chg':''}"><span class="lb">送信済み</span><span class="vl">${c.sent?'はい':'いいえ'}</span>${chip(!c.sent,'未送信')}</div>
  </div>`;

/* 判定の絵：止まっている封筒 */
const ENV=(x,y,s,id)=>`<g transform="translate(${x} ${y}) scale(${s})" filter="url(#${id})">
  <rect x="0" y="0" width="78" height="52" rx="5" fill="url(#eg)" stroke="#CBD5E1" stroke-width="1.4"/>
  <path d="M2 3 L39 30 L76 3" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M2 50 L30 26 M76 50 L48 26" stroke="#CBD5E1" stroke-width="1.4"/></g>`;
const DEFS=id=>`<defs>${SH(id)}<linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient>
  <linearGradient id="eg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCFCE7"/></linearGradient></defs>`;
const stopScene=(id,extra)=>`<svg class="sc" viewBox="0 0 280 63" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${DEFS(id)}
  ${ENV(166,6,0.95,id)}
  <circle cx="236" cy="44" r="15" fill="#DC2626" stroke="#fff" stroke-width="3"/><path d="M229 37 l14 14 M243 37 l-14 14" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  ${extra||''}</svg>`;
/* ③ 送る：封筒が飛ぶ */
const goScene=`<svg class="sc" viewBox="0 0 280 63" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${DEFS('g3')}
  <path d="M120 50 C 140 50, 150 34, 168 30" stroke="#16A34A" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <g transform="rotate(-10 205 30)" filter="url(#g3)"><rect x="172" y="8" width="66" height="44" rx="5" fill="url(#eg2)" stroke="#16A34A" stroke-width="2"/>
    <path d="M174 11 L205 34 L236 11" fill="none" stroke="#16A34A" stroke-width="2"/></g>
  ${[[246,14],[252,32],[244,50]].map(p=>`<path d="M${p[0]} ${p[1]} h18" stroke="#86EFAC" stroke-width="3" stroke-linecap="round"/>`).join('')}
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.152-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">研修後のアンケートを、<br><span class="hl">4つの状態がそろった行だけ</span>に1回送る</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">送る日を日付で決めず、リストの<b>状態</b>で決めます。毎朝10時に同じフローが同じ行を見て、<br><b>開催済み・URLあり・送信OK・未送信</b>の4つがそろった朝だけ送り、すぐ送信済みにします</div>
  </div>

  <div class="stage">
    <div class="strip">
      <div class="koma k1">
        <div class="kh"><span class="no">1</span><span class="tm">10/19 10:00</span><span class="kt">講座の前</span></div>
        ${row({st:'開催予定',url:false,ok:false,sent:false,chg:-1})}
        <div class="vd no"><span class="vt">送らない</span><span class="vs">まだ開催前</span>${stopScene('s1')}</div>
        <div class="kc">午後の講座。状態は<b>開催予定</b>のまま</div>
      </div>
      <div class="koma k2">
        <div class="kh"><span class="no">2</span><span class="tm">10/20 10:00</span><span class="kt">講座の翌朝</span></div>
        ${row({st:'開催済み',url:true,ok:false,sent:false,chg:1})}
        <div class="vd no"><span class="vt">送らない</span><span class="vs">チェック待ち</span>${stopScene('s2')}</div>
        <div class="kc">URLは入った。<b>送信OK</b>がまだ</div>
      </div>
      <div class="koma k3">
        <div class="kh"><span class="no">3</span><span class="tm">10/21 10:00</span><span class="kt">OKの翌朝</span></div>
        ${row({st:'開催済み',url:true,ok:true,sent:false,chg:2})}
        <div class="vd go"><span class="vt">送る</span><span class="vs">4つそろった</span>${goScene}</div>
        <div class="kc">送ったら<b>同じ実行で</b>送信済みに</div>
      </div>
      <div class="koma k4">
        <div class="kh"><span class="no">4</span><span class="tm">10/22 10:00</span><span class="kt">次の朝も</span></div>
        ${row({st:'開催済み',url:true,ok:true,sent:true,chg:3})}
        <div class="vd no"><span class="vt">もう送らない</span><span class="vs">送信済み＝はい</span>${stopScene('s4')}</div>
        <div class="kc">再実行しても<b>二重に送らない</b></div>
      </div>
    </div>
    <div class="bot">
      <div class="bx2 cx">
        <span class="bh">中止の回は<br><b>最初から対象外</b></span>
        <span class="cxrow"><span class="nm">安全研修</span><span class="pill stop">中止</span>${chip(false,'開催済み')}</span>
      </div>
      <div class="bx2 acc">
        <span class="bh">日付で決めると<br>起きる3つ</span>
        <span class="ac"><svg viewBox="0 0 64 42"><rect x="6" y="6" width="40" height="32" rx="4" fill="#fff" stroke="#94A3B8" stroke-width="2"/><rect x="6" y="6" width="40" height="9" rx="3" fill="#94A3B8"/><text x="26" y="33" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#475569" text-anchor="middle">中止</text><circle cx="52" cy="28" r="10" fill="#DC2626"/><path d="M47 23l10 10M57 23l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span>中止の回に送る</span></span>
        <span class="ac"><svg viewBox="0 0 64 42"><rect x="6" y="8" width="40" height="28" rx="4" fill="#fff" stroke="#94A3B8" stroke-width="2"/><rect x="12" y="15" width="28" height="5" rx="2.5" fill="#CBD5E1"/><rect x="12" y="25" width="18" height="5" rx="2.5" fill="#FDE68A" stroke="#EAB308" stroke-dasharray="3 2"/><circle cx="52" cy="28" r="10" fill="#DC2626"/><path d="M47 23l10 10M57 23l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span>URLが空のまま送る</span></span>
        <span class="ac"><svg viewBox="0 0 64 42"><rect x="4" y="12" width="32" height="22" rx="3" fill="#fff" stroke="#94A3B8" stroke-width="2"/><rect x="12" y="6" width="32" height="22" rx="3" fill="#fff" stroke="#94A3B8" stroke-width="2"/><path d="M12 7 l16 11 l16 -11" fill="none" stroke="#94A3B8" stroke-width="2"/><circle cx="52" cy="28" r="10" fill="#DC2626"/><path d="M47 23l10 10M57 23l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span>再実行で二重に送る</span></span>
      </div>
      <div class="uses" style="padding-right:118px">
        <span class="ul">誰に刺さる</span>
        <div class="ur"><span class="u">研修・講座の事務局</span><span class="u">点検・申請の台帳</span></div>
      </div>
      <img class="chara" src="${A}chara/chara_smile.png" alt="">
    </div>
  </div>

  <div class="next">
    <span class="na">${svgw(P.arrow,3)}</span>
    <span>SharePoint リスト ＋ 繰り返し ＋ 複数の項目の取得 で作れます。<b>作り方は2枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「SharePoint コネクタ」「繰り返しトリガー」／講座名・日付は架空の例</div>
`;
</script>
</body>
</html>
