<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.95-1 絵文字リアクションで出欠が集まる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46; --green-bg:#F0FDF4;
    --red:#DC2626; --orange:#EA580C; --ol:#0F6CBD; --teams:#5059C9;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:156px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.32;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:11px 16px 0;display:flex;align-items:stretch;gap:12px;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:14px;padding:10px 11px 11px;position:relative;}
  .col.c1{background:#F5F6FF;border:1.5px solid #D7DAF3;}
  .col.c2{background:#F2FBF5;border:1.5px solid #CFEBD8;}
  .col.c3{flex:1.12;background:#F3F6FF;border:2px solid #C7D6F5;}
  .ch{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;color:#243B58;line-height:1.12;margin-bottom:7px;}
  .ch .no{flex:0 0 auto;width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .c1 .no{background:linear-gradient(180deg,#818CF8,#5059C9);}
  .c2 .no{background:linear-gradient(180deg,#4ADE80,#16A34A);}
  .c3 .no{background:linear-gradient(180deg,#60A5FA,#2563EB);}

  .scene{flex:0 0 auto;height:104px;border-radius:11px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.05);position:relative;overflow:hidden;margin-bottom:9px;}
  .scene svg{display:block;width:100%;height:100%;}
  .scene .mini{position:absolute;right:6px;bottom:-4px;height:92px;z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));}

  .body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;gap:8px;}
  .cap{flex:0 0 auto;margin-top:auto;font-weight:800;font-size:15.5px;line-height:1.34;color:#334155;background:rgba(255,255,255,.72);border-radius:9px;padding:8px 11px;}
  .cap b{color:var(--orange);}
  .c3 .cap{background:#FFF7ED;border:1.5px solid #FCD9A8;color:#7C3A0B;}
  .c3 .cap .k{color:#C2410C;}

  /* Teamsメッセージ＋リアクション */
  .tcard{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #E1E4EA;border-radius:12px;box-shadow:0 4px 12px rgba(30,40,90,.12);overflow:hidden;}
  .tc-bar{flex:0 0 auto;height:5px;background:var(--teams);}
  .tc-in{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:9px 11px 10px;gap:7px;}
  .tc-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .tc-hd .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#F59E0B,#EA580C);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .tc-hd .who{font-weight:900;font-size:13px;color:#242424;line-height:1.1;}
  .tc-hd .who span{font-weight:700;color:#8A8F98;font-size:11px;}
  .tc-ttl{flex:0 0 auto;font-weight:900;font-size:15.5px;color:#242424;}
  .tc-leg{flex:0 0 auto;display:flex;gap:6px;}
  .tc-leg .lg{flex:1;text-align:center;background:#F7F8FA;border:1px solid #E4E7EC;border-radius:7px;padding:4px 2px;font-size:12px;font-weight:800;color:#475569;}
  .tc-leg .lg .em{font-size:15px;}
  .rxns{flex:0 0 auto;display:flex;gap:7px;margin-top:auto;}
  .rx{display:flex;align-items:center;gap:5px;background:#EEF0FF;border:1.5px solid #C7CBEC;border-radius:999px;padding:3px 11px;font-weight:900;font-size:14px;color:#3B3F9E;}
  .rx .em{font-size:16px;}
  .rx.hot{background:#E7ECFF;border-color:#5059C9;box-shadow:0 0 0 2px #DDE3FF;}
  .tc-tap{flex:0 0 auto;text-align:center;font-size:12px;font-weight:900;color:var(--teams);}

  /* 台帳 */
  .ledger{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #D9EAE0;border-radius:11px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.07);position:relative;}
  .lg-hd{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#ECFBF1;border-bottom:1px solid #D9EAE0;font-weight:900;font-size:12.5px;color:#15803D;}
  .lg-hd img{width:22px;height:22px;object-fit:contain;}
  .lg-hd .filt{margin-left:auto;font-size:10.5px;font-weight:900;color:#0B3A8F;background:#EAF2FF;border:1px solid #A9C8F2;border-radius:6px;padding:2px 7px;}
  .ltab{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
  .ltab .lr{flex:1;display:grid;grid-template-columns:1fr 1.15fr;gap:0;align-items:center;border-bottom:1px solid #EEF2F0;min-height:0;}
  .ltab .lr:last-child{border-bottom:none;}
  .ltab .lr.hd{flex:0 0 auto;background:#F4F7F5;color:#5B6270;font-weight:900;font-size:11px;}
  .ltab .lr .cell{padding:6px 8px;font-size:12.5px;font-weight:800;color:#334155;line-height:1.18;}
  .ltab .lr.pick{background:#DCFCE7;}
  .ltab .lr.pick .cell{color:#14532D;}
  .ltab .lr.no .cell{color:#B42318;}

  /* 集計カード（hero） */
  .rcard{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #E1E4EA;border-radius:12px;box-shadow:0 4px 12px rgba(30,40,90,.12);overflow:hidden;}
  .rc-bar{flex:0 0 auto;height:5px;background:var(--teams);}
  .rc-in{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:9px 11px 10px;gap:7px;}
  .rc-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .rc-hd .bot{width:30px;height:30px;border-radius:7px;object-fit:contain;background:#fff;}
  .rc-hd .who{font-weight:900;font-size:13px;color:#242424;line-height:1.1;}
  .rc-hd .who span{font-weight:700;color:#8A8F98;font-size:11px;}
  .rc-ttl{flex:0 0 auto;font-weight:900;font-size:15px;color:#1E40AF;}
  .tally{flex:0 0 auto;display:flex;gap:7px;}
  .tal{flex:1;background:#F7F8FA;border:1px solid #E4E7EC;border-radius:9px;padding:6px 3px;text-align:center;}
  .tal .em{font-size:17px;display:block;line-height:1.1;}
  .tal .n{font-weight:900;font-size:20px;color:#1E40AF;line-height:1.1;}
  .tal .lb{font-size:10.5px;font-weight:800;color:#6B7280;}
  .tal.go{background:#EAF7EF;border-color:#BBE9C9;} .tal.go .n{color:#15803D;}
  .rc-line{flex:0 0 auto;background:#FFF7ED;border:1px solid #FCD9A8;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:800;color:#7C2D12;line-height:1.28;}
  .rc-line .lb{font-size:11px;font-weight:900;color:#B45309;display:block;margin-bottom:1px;}
  .rc-foot{flex:0 0 auto;margin-top:1px;font-size:12.5px;font-weight:900;color:var(--teams);text-align:center;}

  .foot{flex:0 0 auto;margin:9px 16px 0;display:flex;align-items:center;gap:10px;}
  .foot .fl{flex:0 0 auto;font-weight:900;font-size:14.5px;color:var(--weak);}
  .foot .tags{flex:1;display:flex;gap:8px;}
  .foot .tag{flex:1;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 4px;font-weight:900;font-size:15px;color:#334155;box-shadow:0 1px 3px rgba(0,0,0,.05);}

  .next{flex:0 0 auto;margin:9px 16px 12px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:10px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:9.5px;color:#AEB6C2;font-weight:700;z-index:3;padding-right:16px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// ① 情景：メッセージ吹き出しに🍕リアクションを付ける
const scene1=`<svg viewBox="0 0 300 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="16" width="150" height="52" rx="13" fill="#EEF0FF" stroke="#5059C9" stroke-width="2.5"/>
  <path d="M54 66 l0 18 l15 -16 z" fill="#EEF0FF" stroke="#5059C9" stroke-width="2.5"/>
  <rect x="44" y="30" width="94" height="8" rx="4" fill="#C7CBEC"/>
  <rect x="44" y="46" width="66" height="8" rx="4" fill="#C7CBEC"/>
  <!-- リアクションピル -->
  <g><rect x="150" y="60" width="52" height="24" rx="12" fill="#fff" stroke="#5059C9" stroke-width="2.5"/><text x="164" y="77" font-size="15">🍕</text><text x="182" y="77" font-family="Noto Sans JP" font-weight="900" font-size="13" fill="#3B3F9E">+1</text></g>
  <!-- 絵文字ピッカー -->
  <rect x="196" y="18" width="92" height="26" rx="13" fill="#fff" stroke="#E1E4EA" stroke-width="2"/>
  <text x="206" y="37" font-size="16">🍕</text><text x="228" y="37" font-size="16">🍺</text><text x="250" y="37" font-size="16">🤔</text><circle cx="214" cy="31" r="15" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <!-- 指 -->
  <g transform="translate(198,44)"><path d="M8 40 L8 16 a6 6 0 0 1 12 0 L20 30 l6 2 6 3 a6 6 0 0 1 3 6 L47 58 L14 58 a10 10 0 0 1 -8 -6 Z" fill="#FFD9B3" stroke="#E0A878" stroke-width="2"/></g>
</svg>`;
// ② 情景：人 → 台帳へ
const scene2=`<svg viewBox="0 0 300 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(28,26)"><circle cx="20" cy="14" r="12" fill="#34D399"/><path d="M2 54 a18 20 0 0 1 36 0 Z" fill="#34D399"/></g>
  <g transform="translate(70,30)"><circle cx="16" cy="12" r="10" fill="#93C5FD"/><path d="M2 46 a15 16 0 0 1 30 0 Z" fill="#93C5FD"/></g>
  <path d="M118 55 l26 0 M136 49 l8 6 l-8 6" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="18" width="118" height="72" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.5"/>
  <rect x="158" y="18" width="118" height="16" rx="8" fill="#16A34A"/>
  <text x="217" y="30" text-anchor="middle" font-family="Noto Sans JP" font-weight="900" font-size="10" fill="#fff">出欠台帳</text>
  <line x1="158" y1="52" x2="276" y2="52" stroke="#CDE9D6" stroke-width="2"/>
  <line x1="158" y1="70" x2="276" y2="70" stroke="#CDE9D6" stroke-width="2"/>
  <rect x="160" y="36" width="114" height="16" fill="#DCFCE7"/>
  <line x1="216" y1="34" x2="216" y2="90" stroke="#CDE9D6" stroke-width="2"/>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.95-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">🍕でリアクションするだけで、<span class="hl">懇親会の出欠が集まる</span></div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">出欠のとりまとめ、リアクションを数えて名簿に書き写し…地味に手間ですよね。Teamsの投稿に<b>🍕を付けるだけ</b>で、<b>自動で台帳→締切に幹事へ一覧</b>。</div>
  </div>

  <div class="stage">
    <div class="col c1">
      <div class="ch"><span class="no">1</span>絵文字リアクションで答える</div>
      <div class="scene">${scene1}<img class="mini" src="${A}chara/chara_point.png" alt=""></div>
      <div class="body">
        <div class="tcard">
          <div class="tc-bar"></div>
          <div class="tc-in">
            <div class="tc-hd"><div class="av">幹</div><div class="who">幹事さん<br><span>総務チャネル</span></div></div>
            <div class="tc-ttl">🎉 歓送迎会、リアクションで出欠を！</div>
            <div class="tc-leg">
              <div class="lg"><span class="em">🍕</span> 参加</div>
              <div class="lg"><span class="em">🍺</span> 不参加</div>
              <div class="lg"><span class="em">🤔</span> 未定</div>
            </div>
            <div class="rxns">
              <div class="rx hot"><span class="em">🍕</span>3</div>
              <div class="rx"><span class="em">🍺</span>1</div>
              <div class="rx"><span class="em">🤔</span>1</div>
            </div>
            <div class="tc-tap">投稿に絵文字を付けるだけ 👆（ボタンもフォームも無し）</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col c2">
      <div class="ch"><span class="no">2</span>押した人が台帳に載る</div>
      <div class="scene">${scene2}<img class="mini" src="${A}chara/chara_think.png" alt=""></div>
      <div class="body">
        <div class="ledger">
          <div class="lg-hd"><img src="${A}icons/pa_sharepoint.png">出欠台帳<span class="filt">自動で1行</span></div>
          <div class="ltab">
            <div class="lr hd"><div class="cell">名前</div><div class="cell">リアクション</div></div>
            <div class="lr pick"><div class="cell">佐藤</div><div class="cell">🍕 参加</div></div>
            <div class="lr pick"><div class="cell">田中</div><div class="cell">🍕 参加</div></div>
            <div class="lr no"><div class="cell">鈴木</div><div class="cell">🍺 不参加</div></div>
          </div>
        </div>
        <div class="cap">誰が何で反応したか、<b>その瞬間に記録</b>。</div>
      </div>
    </div>

    <div class="col c3">
      <div class="ch"><span class="no">3</span>締切に自動集計→幹事へ</div>
      <div class="body">
        <div class="rcard">
          <div class="rc-bar"></div>
          <div class="rc-in">
            <div class="rc-hd"><img class="bot" src="${A}icons/pa_teams.png"><div class="who">Power Automate<br><span>フローボット・締切17:00</span></div></div>
            <div class="rc-ttl">📊 出欠がまとまりました</div>
            <div class="tally">
              <div class="tal go"><span class="em">🍕</span><span class="n">12</span><span class="lb">参加</span></div>
              <div class="tal"><span class="em">🍺</span><span class="n">3</span><span class="lb">不参加</span></div>
              <div class="tal"><span class="em">🤔</span><span class="n">2</span><span class="lb">未定</span></div>
            </div>
            <div class="rc-line"><span class="lb">幹事さんへ</span>参加者リストと人数を自動でお届け</div>
            <div class="rc-foot">数えて名簿に書き写す作業、まるごとゼロ 👍</div>
          </div>
        </div>
        <div class="cap">幹事は<span class="k">お店の予約に集中</span>できる。</div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="fl">こんな募集に効く▶</div>
    <div class="tags"><div class="tag">懇親会</div><div class="tag">歓送迎会</div><div class="tag">研修ランチ</div><div class="tag">勉強会</div></div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>2025年8月の<b>新トリガー</b>で本物のリアクションを集計｜<b>作り方</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn／Teams コネクタ「チャットでメッセージに応答があったとき」（2025-08 追加）／SharePoint「項目の作成・複数の項目の取得」／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
