<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.106-1 空欄が1つあるだけで止まる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#065F46;
    --red:#DC2626; --red-bg:#FEF2F2; --red-dark:#991B1B;
    --orange:#EA580C; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:158px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-44px;height:146px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:8px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19px;color:var(--blue-dark);line-height:1.3;padding-right:158px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:10px 16px 0;display:flex;align-items:stretch;gap:11px;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;border-radius:14px;padding:8px 10px 9px;position:relative;}
  .col.c1{background:#F8FAFC;border:2.5px solid #DCE3EE;}
  .col.c2{background:var(--red-bg);border:2.5px solid #F2B8B8;flex:1.12;}
  .col.c3{background:var(--green-bg);border:2.5px solid #7FCEA9;}
  .ch2{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;line-height:1.16;color:#1B2A44;}
  .col.c2 .ch2{color:var(--red-dark);}
  .col.c3 .ch2{color:var(--green-dark);}
  .ch2 .n{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .col.c2 .ch2 .n{background:linear-gradient(180deg,#EF6A6A,#DC2626);}
  .col.c3 .ch2 .n{background:linear-gradient(180deg,#34D399,#16A34A);}

  .scene{flex:0 0 auto;height:120px;border-radius:11px;position:relative;overflow:hidden;background:#EDF3FA;}
  .col.c2 .scene{background:#FCE4E4;}
  .col.c3 .scene{background:#DCF3E7;}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;}
  .scene .chara{position:absolute;right:4px;bottom:0;height:114px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}

  .body{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;}
  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #C7D6EE;border-radius:11px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);}
  .col.c2 .card{border-color:#F0AEAE;}
  .col.c3 .card{border-color:#7FCEA9;}
  .cardh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 10px;font-weight:900;font-size:15.5px;color:#1B2A44;background:#F2F7FD;border-bottom:1.5px solid #E2EAF5;}
  .col.c2 .cardh{background:linear-gradient(90deg,#B91C1C,#DC2626);color:#fff;border-bottom:none;}
  .col.c3 .cardh{background:#EAF9F1;border-bottom-color:#BFE7D3;color:var(--green-dark);}
  .cardh img{width:26px;height:26px;object-fit:contain;flex:0 0 auto;}
  .cardh .ci{width:26px;height:26px;flex:0 0 auto;}
  .cardb{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-height:0;}

  /* リスト風 */
  .lrow{display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:900;color:#243B58;border-radius:6px;padding:5px 8px;background:#F7F9FC;}
  .lrow.hd{background:#E9EFF7;color:var(--weak);font-size:13.8px;}
  .lrow.bad{background:#FDE0E0;color:var(--red-dark);}
  .lrow .c1{flex:1.2;} .lrow .c2{flex:1;} .lrow .c3{flex:.8;text-align:right;}
  .empty{display:inline-block;min-width:44px;border-bottom:2.5px dashed var(--red);}

  /* エラーメッセージ */
  .errmsg{background:#1E293B;border-radius:9px;padding:9px 11px;font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;color:#FCA5A5;line-height:1.4;word-break:break-all;}
  .errwhere{display:flex;align-items:center;gap:8px;background:#FFF1F1;border:2px solid #F0AEAE;border-radius:8px;padding:6px 9px;font-size:14.5px;font-weight:900;color:var(--red-dark);}
  .errwhere .ci{flex:0 0 auto;width:22px;height:22px;color:var(--red);}

  /* コード */
  .code{background:#1E293B;border-radius:8px;padding:8px 10px;font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;color:#93C5FD;line-height:1.42;word-break:break-all;}
  .code .g{color:#86EFAC;} .code .r{color:#FCA5A5;}

  .cap{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.32;border-radius:9px;padding:7px 10px;color:#334155;background:#E7EEF7;}
  .col.c2 .cap{color:var(--red-dark);background:#FBD9D9;}
  .col.c3 .cap{color:var(--green-dark);background:#CFEFE0;}
  .cap b{color:var(--orange);}

  .next{flex:0 0 auto;margin:9px 16px 18px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:9px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',brace:'<path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/>'};
const svg=(n,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ① 1件だけ空欄 */
const sc1=`<svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="q1" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  ${Array.from({length:5},(_,i)=>`<g transform="translate(12,${8+i*22})" filter="url(#q1)"><rect x="0" y="0" width="180" height="16" rx="5" fill="#fff" stroke="${i===2?'#DC2626':'#C7D6EE'}" stroke-width="${i===2?'2.6':'1.8'}"/><rect x="8" y="5" width="46" height="6" rx="3" fill="#C3D6F2"/><rect x="62" y="5" width="46" height="6" rx="3" fill="${i===2?'none':'#C3D6F2'}" ${i===2?'stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"':''}/><rect x="118" y="5" width="52" height="6" rx="3" fill="#C3D6F2"/></g>`).join('')}
  <g transform="translate(204,42)"><circle cx="22" cy="22" r="22" fill="#DC2626"/><path d="M22 11v14M22 30h.01" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/></g>
  <text x="226" y="106" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#991B1B" text-anchor="middle">1件だけ空欄</text>
</svg>`;

/* ② 型が合わずに止まる */
const sc2=`<svg viewBox="0 0 320 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="mq" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#DC2626"/></marker></defs>
  <rect x="10" y="34" width="78" height="46" rx="9" fill="#fff" stroke="#94A3B8" stroke-width="2.6"/>
  <text x="49" y="62" font-family="Roboto Mono" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">null</text>
  <path d="M96 57 H 124" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" marker-end="url(#mq)"/>
  <g transform="translate(136,26)">
    <rect x="0" y="0" width="86" height="62" rx="10" fill="#FFF1F1" stroke="#DC2626" stroke-width="2.8"/>
    <text x="43" y="26" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#991B1B" text-anchor="middle">スキーマ</text>
    <text x="43" y="48" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#991B1B" text-anchor="middle">string</text>
  </g>
  <g transform="translate(238,36)"><circle cx="21" cy="21" r="21" fill="#DC2626"/><path d="M13 13 l16 16 M29 13 l-16 16" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/></g>
  <text x="160" y="110" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#991B1B" text-anchor="middle">型が合わない → 止まる</text>
</svg>`;

/* ③ null も受け入れる */
const sc3=`<svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="mq2" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#16A34A"/></marker></defs>
  <rect x="8" y="34" width="72" height="46" rx="9" fill="#fff" stroke="#94A3B8" stroke-width="2.6"/>
  <text x="44" y="62" font-family="Roboto Mono" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">null</text>
  <path d="M88 57 H 114" stroke="#16A34A" stroke-width="4.5" stroke-linecap="round" marker-end="url(#mq2)"/>
  <g transform="translate(126,22)">
    <rect x="0" y="0" width="106" height="70" rx="10" fill="#EAF9F1" stroke="#16A34A" stroke-width="2.8"/>
    <text x="53" y="26" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#0B5136" text-anchor="middle">スキーマ</text>
    <text x="53" y="50" font-family="Roboto Mono" font-size="13.5" font-weight="700" fill="#0B5136" text-anchor="middle">string / null</text>
  </g>
  <g transform="translate(244,38)"><circle cx="19" cy="19" r="19" fill="#16A34A"/><path d="M11 19.5 l5 5 L28 12" stroke="#fff" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="150" y="110" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#0B5136" text-anchor="middle">空欄でも通る</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.106-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">空欄が<span class="hl">1つあるだけ</span>で止まるフローを、止まらなくする</div>
    <img class="title-chara" src="${A}chara/chara_confident.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('brace')}</div>
    <div class="txt">昨日まで動いていたのに、今日は失敗。<b>担当者が1件だけ空欄</b>——それだけでフローは止まります。</div>
  </div>

  <div class="stage">
    <div class="col c1">
      <div class="ch2"><span class="n">1</span>きっかけ</div>
      <div class="scene">${sc1}<img class="chara" src="${A}chara/chara_think.png" alt=""></div>
      <div class="body">
        <div class="card">
          <div class="cardh"><img src="${A}icons/pa_sharepoint.png" alt="">申請一覧</div>
          <div class="cardb">
            <div class="lrow hd"><span class="c1">件名</span><span class="c2">担当者</span><span class="c3">金額</span></div>
            <div class="lrow"><span class="c1">備品購入</span><span class="c2">佐藤</span><span class="c3">12,000</span></div>
            <div class="lrow bad"><span class="c1">出張精算</span><span class="c2"><span class="empty"></span></span><span class="c3">38,000</span></div>
            <div class="lrow"><span class="c1">研修費</span><span class="c2">鈴木</span><span class="c3">8,400</span></div>
          </div>
        </div>
      </div>
      <div class="cap">任意の項目を<b>誰かが入れ忘れた</b>だけ。よくあることです。</div>
    </div>

    <div class="col c2">
      <div class="ch2"><span class="n">2</span>止まる</div>
      <div class="scene">${sc2}<img class="chara" src="${A}chara/chara_trouble.png" alt=""></div>
      <div class="body">
        <div class="card">
          <div class="cardh"><span class="ci">${svg('warn',2.4)}</span>JSON の解析 で失敗</div>
          <div class="cardb">
            <div class="errmsg">Invalid type.<br>Expected String but got Null.</div>
            <div class="errwhere"><span class="ci">${svg('warn',2.4)}</span>担当者のところで型が合わない</div>
            <div class="lrow">SharePointの任意の列が空</div>
            <div class="lrow">Formsの任意の設問が未回答</div>
          </div>
        </div>
      </div>
      <div class="cap">「サンプルから生成」したスキーマが、<b>必ず文字が来る前提</b>になっています。</div>
    </div>

    <div class="col c3">
      <div class="ch2"><span class="n">3</span>止まらなくする</div>
      <div class="scene">${sc3}<img class="chara" src="${A}chara/chara_guts.png" alt=""></div>
      <div class="body">
        <div class="card">
          <div class="cardh"><span class="ci">${svg('brace',2.4)}</span>スキーマを1か所直す</div>
          <div class="cardb">
            <div class="code"><span class="r">"type": "string"</span><br>&nbsp;&nbsp;&nbsp;&nbsp;↓<br><span class="g">"type": ["string","null"]</span></div>
            <div class="lrow">① 型に null を足す</div>
            <div class="lrow">② required から外す</div>
          </div>
        </div>
      </div>
      <div class="cap">空でも来てよい、と<b>教えてあげる</b>だけで通ります。</div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>直す場所の探し方と、<b>もう1つの手</b>は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn「Power Automate でデータ操作を使用する」（JSON の解析）／null エラーの対処はコミュニティの定番手法／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
