<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.122-2 請求書を台帳に入れる作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:6px;padding:7px 9px;}
  .cardh{font-size:15px;}
  .col.ai{background:#F7F3FF;border:2.5px solid #C9B4F4;}
  .col.ai .ch2{color:#5B21B6;}
  .col.ai .ch2 .n{background:linear-gradient(180deg,#A78BFA,#6D28D9);}
  .col.ai .card{border-color:#C9B4F4;}
  .col.ai .cardh{background:#EDE4FF;border-bottom-color:#D8C9FA;color:#5B21B6;}
  .col.ai .cap{background:#E4D8FA;color:#5B21B6;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:5px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.24;}
  .fld .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.28;}
  .outs{display:flex;flex-wrap:wrap;gap:5px;}
  .br{display:flex;gap:6px;flex:1;min-height:0;}
  .br .bx{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;border-radius:8px;padding:6px 8px;
    font-size:15px;font-weight:900;line-height:1.3;}
  .br .bx.y{background:#ECFDF5;border:1.8px solid #7FCEA9;color:#065F46;}
  .br .bx.n{background:#FFF7ED;border:1.8px solid #FDBA74;color:#9A3412;}
  .br .bx .bl{font-size:13.5px;}
  .br .bx .ac{display:flex;align-items:center;gap:5px;}
  .br .bx img{width:24px;height:24px;object-fit:contain;flex:0 0 auto;}
  .cond{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#F7F9FC;border:1.5px solid #E2EAF5;
    border-radius:8px;padding:6px 8px;font-size:14.5px;font-weight:900;color:var(--navy);}
  .cond .op{background:#fff;border:1.4px solid #C7D6EE;border-radius:5px;padding:1px 7px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SPARK='<path d="M0 -13l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/><path d="M8.5 4.5l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z"/>';
const PDF=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M0 0 h34 l12 12 v58 h-46 z" fill="#fff" stroke="#94A3B8" stroke-width="2"/>
  <path d="M34 0 v12 h12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="8" y="12" width="20" height="4" rx="2" fill="#CBD5E1"/><rect x="8" y="20" width="28" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="-5" y="32" width="32" height="15" rx="3" fill="#DC2626"/>
  <text x="11" y="43.5" font-family="Roboto Mono" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
  <rect x="8" y="54" width="28" height="4" rx="2" fill="#CBD5E1"/><rect x="8" y="62" width="20" height="4" rx="2" fill="#CBD5E1"/></g>`;

/* ① フォルダーに置くと起動 */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="m1f" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter>
  <linearGradient id="fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#m1f)">${PDF(28,14,1)}</g>
  <path d="M84 36 C 108 16, 132 22, 146 42" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M136 40 l10 4 l2 -11" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#m1f)"><path d="M154 36 h30 l8 8 h52 v46 h-90 z" fill="url(#fd)"/><rect x="154" y="48" width="90" height="42" rx="4" fill="#FBBF24"/>
  <text x="199" y="75" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#78350F" text-anchor="middle">請求書</text></g>
  <path d="M252 62 H 276" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M270 56 l8 6 l-8 6" fill="none" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#m1f)"><rect x="286" y="34" width="92" height="56" rx="9" fill="#fff" stroke="#2563EB" stroke-width="2.6"/>
    <text x="332" y="58" font-family="Noto Sans JP" font-size="16" font-weight="900" fill="#1E40AF" text-anchor="middle">⚡ 起動</text>
    <text x="332" y="79" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#64748B" text-anchor="middle">置いた瞬間に</text></g>
</svg>`;

/* ② AIが項目を拾う */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="m2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <filter id="m2f" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B2A66" flood-opacity=".24"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#F3EEFF"/>
  <g filter="url(#m2f)"><rect x="14" y="8" width="92" height="84" rx="4" fill="#fff" stroke="#B79CF0" stroke-width="2"/>
    <rect x="36" y="15" width="48" height="7" rx="2" fill="#94A3B8"/>
    <rect x="21" y="30" width="44" height="13" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.4"/>
    <rect x="70" y="30" width="30" height="7" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="70" y="41" width="30" height="7" rx="3" fill="#CFFAFE" stroke="#0891B2" stroke-width="2"/>
    <rect x="60" y="52" width="40" height="7" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    ${[0,1].map(i=>`<rect x="22" y="${65+i*8}" width="76" height="4" rx="2" fill="#E2E8F0"/>`).join('')}
    <rect x="21" y="81" width="42" height="7" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/></g>
  <path d="M114 50 H 138" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <g filter="url(#m2f)"><circle cx="168" cy="50" r="24" fill="url(#m2g)"/><g transform="translate(168,50) scale(0.95)" fill="#fff">${SPARK}</g></g>
  <path d="M198 50 H 222" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M216 44 l8 6 l-8 6" fill="none" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  ${[['取引先','#2563EB',6],['番号・日付・期限','#7C3AED',36],['合計（数値）','#16A34A',66]].map(([t,c,y])=>
    `<g filter="url(#m2f)"><rect x="232" y="${y}" width="146" height="27" rx="7" fill="#fff" stroke="${c}" stroke-width="2.2"/>
      <text x="305" y="${+y+19}" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="${c}" text-anchor="middle">${t}</text></g>`).join('')}
</svg>`;

/* ③ 自信ありは台帳へ／自信なしは人へ */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="m3f" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B5136" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#DCF3E7"/>
  <g filter="url(#m3f)"><path d="M72 14 l52 36 l-52 36 l-52 -36 z" fill="#fff" stroke="#0B6A4F" stroke-width="2.4"/>
    <text x="72" y="46" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#0B5136" text-anchor="middle">信頼度</text>
    <text x="72" y="63" font-family="Roboto Mono" font-size="13" font-weight="700" fill="#0B5136" text-anchor="middle">0.65以上?</text></g>
  <path d="M126 44 C 150 22, 172 22, 194 23" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M126 56 C 150 78, 172 78, 194 77" stroke="#EA580C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g filter="url(#m3f)"><rect x="198" y="6" width="180" height="34" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    <text x="288" y="29" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#065F46" text-anchor="middle">はい → 台帳に1行</text></g>
  <g filter="url(#m3f)"><rect x="198" y="60" width="180" height="34" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="288" y="83" font-family="Noto Sans JP" font-size="15" font-weight="900" fill="#9A3412" text-anchor="middle">いいえ → 人が確認</text></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.122-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（置いて起動 → AIが読む → 台帳に入れる）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">学習させなくても使える<b>請求書専用のAI</b>を呼ぶだけ。<br>読み取りに自信がないときだけ、人に回します</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>置いたら起動する</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_sharepoint.png" alt="">ファイルが作成されたとき (プロパティのみ)</div>
        <div class="cardb">
          <div class="fld"><span class="fl">ライブラリ名</span><span class="fi">請求書</span></div>
          <div class="fld"><span class="fl">続けて「ファイル コンテンツの取得」</span>
            <span class="fi hot">ファイル識別子 ＝ <span class="dyn">識別子</span></span></div>
          <div class="note">メール添付で届く会社は、<br>添付をこのフォルダーに保存する形でもOK</div>
        </div>
      </div></div>
      <div class="cap">置くのは<b>人でもフローでも</b>かまいません</div>
    </div>

    <div class="col ai">
      <div class="ch2"><span class="n">2</span>AIが請求書を読む</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_logo.png" alt="">請求書から情報を抽出する</div>
        <div class="cardb">
          <div class="fld"><span class="fl">請求書ファイル</span><span class="fi hot"><span class="dyn">ファイル コンテンツ</span></span></div>
          <div class="fld"><span class="fl">受け取れる値（一部）</span>
            <span class="outs"><span class="dyn">ベンダー名</span><span class="dyn">請求書 ID</span><span class="dyn">請求日 (日付)</span>
            <span class="dyn">期限 (日付)</span><span class="dyn">請求書の合計 (数値)</span></span></div>
          <div class="note">ページ欄で範囲（例：1）を指定すると、<br>余計なページを読まない</div>
        </div>
      </div></div>
      <div class="cap">日本語の請求書に対応。<b>学習させる手間なし</b></div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>台帳に入れる</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_condition.png" alt="">条件</div>
        <div class="cardb">
          <div class="cond"><span class="dyn">請求書合計の信頼度</span><span class="op">次の値以上</span><span class="op">0.65</span></div>
          <div class="br">
            <div class="bx y"><span class="bl">はい</span><span class="ac"><img src="${A}icons/pa_sharepoint.png" alt="">項目の作成</span><span>台帳に1行足す</span></div>
            <div class="bx n"><span class="bl">いいえ</span><span class="ac"><img src="${A}icons/pa_teams.png" alt="">担当者に投稿</span><span>PDFを見て確認</span></div>
          </div>
        </div>
      </div></div>
      <div class="cap">金額は<b>「(数値)」のほう</b>を入れると、そのまま集計できる</div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>AI Builderのクレジットを消費</span><span>2026/11/1以降はCopilotクレジットへ移行</span>
      <span>PDF・画像は20MBまで</span><span>0.65は公式の例。社内で調整</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「請求書処理の事前構築済み AI モデル」「Power Automate で請求書処理の構築済みモデルを使用する」「ライセンスとAI Builder クレジット」／名称は架空</div>
`;
</script>
</body>
</html>
