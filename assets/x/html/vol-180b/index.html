<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.180-2 異動の前にやっておく3つの設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<link rel="stylesheet" href="../vol-180/kit.css">
<style>
  .stage{gap:0;}
  .c3{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:8px 10px 9px;background:#EEF4FF;border:2.5px solid #A9C6F5;}
  .c3.g{background:#ECFDF5;border-color:#7FCEA9;}
  .c3.y{background:#FFFBEB;border-color:#F5C56B;}
  .c3 .h{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px;line-height:1.2;color:#1E3A8A;white-space:nowrap;}
  .c3.g .h{color:#065F46;} .c3.y .h{color:#92400E;}
  .c3 .h .n{flex:0 0 auto;width:36px;height:36px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(180deg,#3B82F6,#2563EB);box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .c3.g .h .n{background:linear-gradient(180deg,#34D399,#16A34A);} .c3.y .h .n{background:linear-gradient(180deg,#FBBF24,#D97706);}
  .sc{flex:0 0 auto;height:126px;border-radius:11px;position:relative;background:#DCE9FC;display:flex;align-items:flex-end;justify-content:center;}
  .c3.g .sc{background:#D3F1E2;} .c3.y .sc{background:#FCEFC7;}
  .sc .chara{right:6px;bottom:0;}
  .fw{flex:1;min-height:0;}
  .fwb{flex:1;min-height:0;justify-content:space-between;padding:7px 9px;}
  .path{display:flex;align-items:center;gap:5px;font-size:15.5px;font-weight:900;color:#0F6CBD;white-space:nowrap;}
  .path i{font-style:normal;color:#8A8886;}
  .inp{display:flex;align-items:center;gap:6px;border:1.4px solid #D1D1D1;border-bottom:2.4px solid #0F6CBD;border-radius:5px;padding:3px 8px;font-size:15.5px;font-weight:700;color:#A19F9D;white-space:nowrap;}
  .inp .tk{color:#242424;background:#EBF3FC;border-radius:999px;padding:0 9px;font-weight:900;}
  .row{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;color:#242424;white-space:nowrap;}
  .row .av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;background:#2563EB;}
  .row .av.g{background:#16A34A;} .row .av.v{background:#7C3AED;border-radius:8px;}
  .row .r{margin-left:auto;}
  .rad{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:2px solid #8A8886;background:#fff;}
  .rad.on{border-color:#0F6CBD;box-shadow:inset 0 0 0 3.5px #fff;background:#0F6CBD;}
  .row.sel{background:#EBF3FC;border-radius:7px;padding:3px 6px;margin:0 -6px;}
  .row.old{color:#8A8886;}
  .memo{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#FFFEF5,#FDF3C7);border:1.8px solid #E5C76B;border-radius:8px;padding:8px 11px 8px 11px;box-shadow:0 3px 8px rgba(120,80,0,.18);position:relative;}
  .memo .mt{font-size:15.5px;font-weight:900;color:#92400E;border-bottom:2px solid #E5C76B;padding-bottom:2px;}
  .memo .ml{display:flex;gap:8px;font-size:15.5px;font-weight:700;color:#3F2D06;line-height:1.3;border-bottom:1.2px dashed #E5C76B;padding:2px 0;white-space:nowrap;}
  .memo .ml:last-child{border-bottom:none;}
  .memo .ml .k{flex:0 0 76px;font-weight:900;color:#92400E;}
  .cp{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.36;border-radius:9px;padding:6px 10px;color:#1E3A8A;background:#fff;border:1.5px solid #A9C6F5;}
  .c3.g .cp{color:#065F46;border-color:#7FCEA9;} .c3.y .cp{color:#92400E;border-color:#F5C56B;}
  .cp b{color:#EA580C;}
  .arw{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:#2563EB;}
  .arw svg{width:24px;height:24px;max-width:none;}
</style>
</head>
<body>
<div id="slide"></div>
<script src="../vol-180/kit.js"></script>
<script>
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.180-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">異動の前にやっておく設定は3つ：<br><span class="hl">所有者・接続・引き継ぎメモ</span></div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">フローの ⋮ →「共有」で所有者をもう1人足し、<b>接続を残る人のアカウントに選び直して</b>おきます</div>
  </div>
  <div class="stage">
    <div class="c3">
      <div class="h"><span class="n">1</span>所有者をもう1人足す</div>
      <div class="sc">${SV(360,126,`
        <g transform="translate(6,2) scale(.9)">${tagG(0,0,'佐藤','作成者','blue')}</g>
        <path d="M118 66h26M131 53v26" stroke="#16A34A" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(152,2) scale(.9)">${tagG(0,0,'鈴木','所有者','green',{badge:'ok'})}</g>
        <g transform="translate(256,2) scale(.9)">${tagG(0,0,'営業部','グループ','violet',{grp:true,badge:'ok'})}</g>
      `)}</div>
      <div class="fw"><div class="fwh">${PA(22)}共有<span class="repro">画面は説明用の再現</span></div><div class="fwb">
        <div class="path">マイ フロー<i>›</i>請求リマインド<i>›</i>⋮<i>›</i>共有</div>
        <div class="inp"><span class="tk">鈴木 一郎</span>名前、メール、グループ名</div>
        <div class="row"><span class="av">佐</span>佐藤 花子<span class="pilltag gy r">作成者</span></div>
        <div class="row"><span class="av g">鈴</span>鈴木 一郎<span class="pilltag ok r">所有者に追加</span></div>
        <div class="row"><span class="av v">営</span>営業部（グループ）<span class="pilltag ok r">所有者に追加</span></div>
      </div></div>
      <div class="cp">足した人も、<b>編集・実行履歴の表示・<br>開始と停止・所有者の追加</b>ができます</div>
    </div>
    <div class="arw">${svgw(P.arrow,3)}</div>
    <div class="c3 g">
      <div class="h"><span class="n">2</span>接続を残る人に選び直す</div>
      <div class="sc">${SV(360,126,`
        <g transform="translate(4,2) scale(.9)">${tagG(0,0,'佐藤','異動する','gray')}</g>
        ${keyG(70,78,{gray:true,s:.62,rot:-10})}
        <path d="M128 54h74" stroke="#16A34A" stroke-width="7" stroke-linecap="round"/><path d="M192 40l16 14-16 14" stroke="#16A34A" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="166" y="34" text-anchor="middle" font-size="15.5" font-weight="900" fill="#065F46">選び直す</text>
        <g transform="translate(222,2) scale(.9)">${tagG(0,0,'鈴木','残る人','green')}</g>
        ${keyG(286,72,{s:.66,rot:-10})}
      `)}</div>
      <div class="fw"><div class="fwh">${PA(22)}接続<span class="repro">画面は説明用の再現</span></div><div class="fwb">
        <div class="path">編集<i>›</i>ステップの …<i>›</i>接続を選ぶ</div>
        <div class="row" style="font-weight:900">${MS('sharepoint.svg',24)}複数の項目の取得</div>
        <div class="row old"><span class="rad"></span>sato@example.com<span class="pilltag gy r">作った人</span></div>
        <div class="row sel"><span class="rad on"></span>suzuki@example.com<span class="pilltag ok r">残る人</span></div>
        <div class="row"><span class="btn">＋ 新しい接続の追加</span><span class="btn pri">サインイン</span></div>
      </div></div>
      <div class="cp">所有者を足しても、接続は<b>作った人の<br>アカウントのまま</b>。ステップごとに確かめます</div>
    </div>
    <div class="arw">${svgw(P.arrow,3)}</div>
    <div class="c3 y">
      <div class="h"><span class="n">3</span>引き継ぎメモを残す</div>
      <div class="sc" style="justify-content:flex-start">${SV(250,126,`
        <g filter="url(#fSh)"><rect x="22" y="14" width="96" height="108" rx="8" fill="#B07A3E" stroke="#7C4A12" stroke-width="1.6"/><rect x="30" y="24" width="80" height="94" rx="3" fill="url(#gPaper)" stroke="#D6B656" stroke-width="1.2"/><rect x="50" y="6" width="40" height="20" rx="5" fill="url(#gSteel)" stroke="#475569" stroke-width="1.4"/><circle cx="70" cy="14" r="3.5" fill="#475569"/></g>
        <g stroke="#16A34A" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M37 44l4 4 7-8M37 64l4 4 7-8M37 84l4 4 7-8M37 104l4 4 7-8"/></g>
        <g stroke="#9A7B2C" stroke-width="4" stroke-linecap="round"><path d="M56 45h46M56 65h38M56 85h46M56 105h30"/></g>
        <g transform="translate(128,24) rotate(32 20 50)" filter="url(#fSh)"><rect x="12" y="0" width="16" height="76" rx="3" fill="url(#gBlue)" stroke="#1E3A8A" stroke-width="1.4"/><rect x="12" y="8" width="16" height="6" fill="#fff" opacity=".6"/><path d="M12 76h16l-8 18z" fill="#F3E3C3" stroke="#7C4A12" stroke-width="1.2"/><path d="M17.5 88h5l-2.5 6z" fill="#1F2937"/></g>
        <g transform="translate(178,48)" filter="url(#fSh)"><rect x="0" y="0" width="64" height="66" rx="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/><path d="M12 18h40M12 32h40M12 46h26" stroke="#A16207" stroke-width="4" stroke-linecap="round"/></g>
      `)}${CH('guts',118)}</div>
      <div class="memo">
        <div class="mt">引き継ぎメモ（例）</div>
        <div class="ml"><span class="k">フロー</span>請求リマインド（毎朝 9:00）</div>
        <div class="ml"><span class="k">所有者</span>佐藤・鈴木・営業部グループ</div>
        <div class="ml"><span class="k">接続</span>SharePoint／Outlook＝鈴木</div>
        <div class="ml"><span class="k">止まったら</span>鈴木 → 情報システム</div>
      </div>
      <div class="cp">所有者が誰もいなくなったときは、<b>管理者</b>が<br>管理センターの「共有」から足せます</div>
    </div>
  </div>
  <div class="warnbar">
    <span class="na" style="width:30px;height:30px;color:#C2410C">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws"><span>共有には Power Automate のライセンス（無料ライセンスを除く）などが必要</span><span>別の所有者が作った接続の資格情報は<b>変更できない</b></span></span>
  </div>
  <div class="src">出典：Microsoft Learn「クラウド フローを共有する」「Power Automate での接続の管理」「所有者が組織を離れたときに孤立したフローを管理する」／人名・アドレスは架空、画面は説明用の再現（実画面は未確認）</div>
`;
</script>
</body>
</html>
