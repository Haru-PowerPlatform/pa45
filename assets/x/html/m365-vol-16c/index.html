<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.16-3 ファイルの比較を押す場所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  .stage{gap:8px;}
  .c3{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;border-radius:14px;padding:8px 10px 9px;background:var(--mc-bg);border:2.5px solid var(--mc-line);}
  .c3 .h{flex:0 0 auto;display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px;line-height:1.2;color:var(--mc-dark);}
  .c3 .h .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--mc);}
  .scn{flex:0 0 100px;position:relative;border-radius:10px;overflow:hidden;background:#DDF4EF;}
  .scn svg{position:absolute;inset:0;width:100%;height:100%;}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--segline);border-radius:9px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.10);}
  .win .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;color:#242424;}
  .win .wb{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;padding:7px 9px;}
  .rw{flex:1;min-height:0;display:flex;align-items:center;gap:8px;border-bottom:1.2px dashed #E5E7EB;font-size:15.5px;font-weight:700;color:#1B2A44;line-height:1.3;}
  .rw:last-child{border-bottom:none;}
  .rw .tg{flex:0 0 auto;min-width:62px;text-align:center;font-size:14px;font-weight:900;border-radius:6px;padding:2px 6px;color:#fff;background:var(--mc);}
  .rw .tg.w{background:#D97706;} .rw .tg.g{background:#16A34A;} .rw .tg.t{background:#2563EB;} .rw .tg.n{background:#6B7280;}
  .rw b{color:#B91C1C;}
  .fr{flex:1;min-height:0;display:flex;align-items:center;gap:7px;border-radius:6px;padding:0 6px;font-size:15.5px;font-weight:700;color:#1B2A44;}
  .fr.on{background:#E6F4F1;}
  .fr .bx{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid #8A8886;}
  .fr.on .bx{background:#0F766E;border-color:#0F766E;color:#fff;padding:1px;}
  .fr .pdf{flex:0 0 auto;width:20px;height:24px;}
  .fr.dim{color:#9CA3AF;}
  .btn{display:inline-block;border:1.5px solid #8A8886;border-radius:5px;padding:0 7px;font-size:14.5px;font-weight:900;color:#242424;background:#fff;white-space:nowrap;}
  .btn.p{background:var(--mc);border-color:var(--mc);color:#fff;}
  .pr{flex:1;min-height:0;border:1.5px solid var(--mc-line);background:#FAFFFE;border-radius:8px;padding:6px 9px;font-size:15.5px;font-weight:700;color:#1B2A44;line-height:1.45;}
  .pr .lb{display:block;font-size:13.5px;font-weight:900;color:#0F766E;}
  .pr b{color:#B91C1C;}
  .c3 .cp{flex:0 0 auto;font-size:15.5px;font-weight:900;line-height:1.35;border-radius:9px;padding:6px 10px;color:var(--mc-dark);background:#fff;border:1.5px solid var(--mc-line);}
  .c3 .cp b{color:#EA580C;}
  .arrowc{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--mc);}
  .arrowc svg{width:22px;height:22px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',ok:'<path d="M5 12l5 5 9-10"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const PDF='<svg class="pdf" viewBox="0 0 22 26"><path d="M2 1h12l6 6v18H2z" fill="#fff" stroke="#B91C1C" stroke-width="1.6"/><path d="M14 1v6h6" fill="none" stroke="#B91C1C" stroke-width="1.6"/><rect x="0" y="13" width="16" height="8" rx="2" fill="#DC2626"/></svg>';
const VB='0 0 360 100';
const DOCG=(x,c,on)=>`<g filter="url(#a1)"><path d="M${x} 14h34l12 12v58h-46z" fill="#fff" stroke="${c}" stroke-width="2"/><path d="M${x+34} 14v12h12" fill="none" stroke="${c}" stroke-width="2"/><rect x="${x+8}" y="40" width="28" height="5" rx="2" fill="${c}" opacity=".45"/><rect x="${x+8}" y="52" width="28" height="5" rx="2" fill="${c}" opacity=".45"/></g>${on?`<circle cx="${x+44}" cy="80" r="11" fill="#0F766E"/><path d="M${x+38} 80l4 4 7-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>`:''}`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.16-3</div><div class="lic-pill paid">M365 Copilot ライセンスが要る</div></div>
    <div class="title-text">押す場所は3つ：<br><span class="hl">選ぶ・[ファイルの比較]・続けて聞く</span></div>
    <div class="title-apps">${MS('onedrive.svg',44)}<span class="pl">+</span><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_laptop.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${MS('onedrive.svg',34)}</div>
    <div class="txt">OneDrive の Web サイトで<b>ファイルを最大5つ選び</b>、Copilot から<b>[ファイルの比較]</b>。<br>パネルが開いたら、比べたい項目を具体的に書いて質問を続けます</div>
  </div>
  <div class="stage">
    <div class="c3">
      <div class="h"><span class="n">1</span>比べる見積書を選ぶ</div>
      <div class="scn"><svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><filter id="a1" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter></defs><rect width="360" height="100" fill="#DDF4EF"/>
        ${DOCG(14,'#2563EB',1)}${DOCG(80,'#D97706',1)}${DOCG(146,'#7C3AED',1)}
        <g opacity=".5"><path d="M218 14h34l12 12v58h-46z" fill="#fff" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/><path d="M284 14h34l12 12v58h-46z" fill="#fff" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/></g>
        <text x="274" y="58" font-size="15" font-weight="900" fill="#0F766E" text-anchor="middle" font-family="Noto Sans JP">あと2つ</text>
      </svg></div>
      <div class="win seg"><div class="wh">${MS('onedrive.svg',22)}OneDrive（Web）<span class="repro">画面は説明用の再現</span></div><div class="wb">
        <div class="fr on"><span class="bx">${svgw(P.ok,3)}</span>${PDF}見積_ひかり電機.pdf</div>
        <div class="fr on"><span class="bx">${svgw(P.ok,3)}</span>${PDF}見積_みなと商会.pdf</div>
        <div class="fr on"><span class="bx">${svgw(P.ok,3)}</span>${PDF}見積_さくら商事.pdf</div>
        <div class="fr dim"><span class="bx"></span>${MS('word.svg',22)}仕様書_PC入替.docx</div>
      </div></div>
      <div class="cp">一度に比べられるのは<b>5ファイルまで</b>。<br>画像と動画は対象外</div>
    </div>
    <div class="arrowc">${svgw(P.arrow,3)}</div>
    <div class="c3">
      <div class="h"><span class="n">2</span>Copilot で[ファイルの比較]</div>
      <div class="scn"><svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><filter id="a2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter></defs><rect width="360" height="100" fill="#DDF4EF"/>
        <g filter="url(#a2)"><rect x="16" y="10" width="328" height="82" rx="8" fill="#fff" stroke="#CBD5E1"/></g>
        <rect x="16" y="10" width="328" height="22" rx="8" fill="#F3F2F1"/>
        <rect x="26" y="14" width="84" height="15" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="68" y="26" font-size="12" font-weight="900" fill="#134E4A" text-anchor="middle" font-family="Segoe UI">Copilot ∨</text>
        <text x="330" y="26" font-size="14" font-weight="900" fill="#616161" text-anchor="end" font-family="Segoe UI">…</text>
        <rect x="26" y="40" width="170" height="6" rx="3" fill="#E2E8F0"/><rect x="26" y="54" width="150" height="6" rx="3" fill="#E2E8F0"/><rect x="26" y="68" width="160" height="6" rx="3" fill="#E2E8F0"/>
        <circle cx="318" cy="72" r="15" fill="#fff" stroke="#0F766E" stroke-width="2.4"/><image href="${A}icons/ms/copilot.png" x="307" y="61" width="22" height="22"/>
        <path d="M296 72h-60" stroke="#EA580C" stroke-width="2.4" stroke-dasharray="4 3"/><text x="262" y="64" font-size="12" font-weight="900" fill="#EA580C" text-anchor="middle" font-family="Noto Sans JP">右下</text>
        <path d="M114 22h24" stroke="#EA580C" stroke-width="2.4" stroke-dasharray="4 3"/><text x="170" y="26" font-size="12" font-weight="900" fill="#EA580C" text-anchor="middle" font-family="Noto Sans JP">コマンド バー</text>
      </svg></div>
      <div class="win seg"><div class="wh">${CPI(22)}入口はどれでも同じ<span class="repro">画面は説明用の再現</span></div><div class="wb">
        <div class="rw"><span class="tg">右下</span><span>Copilot ボタン →<br><b>これらのファイルの比較</b></span></div>
        <div class="rw"><span class="tg t">上</span><span>コマンド バーの Copilot →<br><b>ファイルの比較</b></span></div>
        <div class="rw"><span class="tg n">［…］</span><span>その他のアクション →<br>Copilot → <b>ファイルの比較</b></span></div>
        <div class="rw"><span class="tg w">PC</span><span>エクスプローラーで右クリック →<br>OneDrive → <b>ファイルの比較</b></span></div>
      </div></div>
      <div class="cp">右に<b>Copilot のパネル</b>が開いて、<br>違いの要点が出る</div>
    </div>
    <div class="arrowc">${svgw(P.arrow,3)}</div>
    <div class="c3">
      <div class="h"><span class="n">3</span>比べる項目を書いて続ける</div>
      <div class="scn"><svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><filter id="a3" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter></defs><rect width="360" height="100" fill="#DDF4EF"/>
        <g filter="url(#a3)"><rect x="14" y="12" width="150" height="76" rx="8" fill="#fff" stroke="#0F766E" stroke-width="2"/></g>
        <rect x="14" y="12" width="150" height="18" rx="8" fill="#CCFBF1"/><path d="M64 12v76M114 12v76M14 48h150M14 68h150" stroke="#CDE7E1" stroke-width="1.6"/>
        <rect x="66" y="32" width="46" height="14" rx="2" fill="#DCFCE7"/><rect x="66" y="50" width="46" height="16" rx="2" fill="#FEE2E2"/><rect x="116" y="50" width="46" height="16" rx="2" fill="#DCFCE7"/>
        <path d="M176 50h30" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/><path d="M200 40l12 10-12 10z" fill="#0F766E"/>
        <g filter="url(#a3)"><rect x="222" y="18" width="124" height="30" rx="12" fill="#E8F4F2" stroke="#A7E3D8" stroke-width="2"/></g><text x="284" y="38" font-size="13" font-weight="900" fill="#134E4A" text-anchor="middle" font-family="Noto Sans JP">納期の短い順に</text>
        <g filter="url(#a3)"><rect x="222" y="56" width="124" height="30" rx="12" fill="#E8F4F2" stroke="#A7E3D8" stroke-width="2"/></g><text x="284" y="76" font-size="13" font-weight="900" fill="#134E4A" text-anchor="middle" font-family="Noto Sans JP">保守の範囲は？</text>
      </svg></div>
      <div class="win seg"><div class="wh">${CPI(22)}続けて質問する<span class="repro">頼み方は一例</span></div><div class="wb">
        <div class="pr"><span class="lb">項目と形を指定する</span>金額・納期・<b>設置費</b>・<b>保守期間</b>を、<br>会社ごとの表にして</div>
        <div class="pr"><span class="lb">書いていない点を拾う</span><b>見積書に記載がない費用</b>が<br>あれば、会社ごとに挙げて</div>
      </div></div>
      <div class="cp">公式のヒントは、<b>できるだけ詳しく</b><br>質問すること</div>
    </div>
  </div>
  <div class="warnbar">
    <span class="wl">⚠ 使う前に確認</span>
    <div class="ws"><span>職場のアカウントは Copilot ライセンスが必要</span><span>150 MB 未満のファイルが対象</span><span>OneDrive の Web とエクスプローラーから使う</span></div>
  </div>
  <div class="src">出典：Microsoft サポート「Copilot in OneDrive を使用してファイルを比較する」「Copilot in OneDrive についてよく寄せられる質問」／画面は説明用の再現（公式ページで確認・実画面は未確認）</div>
`;
</script>
</body>
</html>
