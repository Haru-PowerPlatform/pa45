<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.115-2 効果ログの作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:5px;padding:7px 9px;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:5px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.2;}
  .fld .fi.exp{border-color:var(--blue);background:#F4F8FF;font-family:'Roboto Mono',monospace;font-size:14px;
    color:var(--blue-dark);word-break:break-all;line-height:1.34;}
  .cols4{display:flex;flex-direction:column;gap:4px;}
  .c4r{display:flex;align-items:center;gap:8px;background:#fff;border:1.8px solid #C7D6EE;border-radius:7px;padding:4px 9px;}
  .c4r .ck{flex:0 0 96px;font-size:14.5px;font-weight:900;color:#64748B;}
  .c4r .cvv{flex:1;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.2;}
  .est{display:flex;flex-direction:column;gap:4px;}
  .er{display:flex;align-items:center;gap:8px;background:#fff;border:1.8px solid #DDE5F0;border-radius:7px;padding:4px 9px;}
  .er .en2{flex:1;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.2;}
  .er .ev{flex:0 0 auto;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:var(--blue-dark);
    background:#EAF1FE;border-radius:6px;padding:2px 9px;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.24;}
  .two{display:flex;flex-direction:column;gap:5px;}
  .tw{display:flex;align-items:center;gap:8px;border-radius:8px;padding:5px 9px;font-size:15.5px;font-weight:900;line-height:1.22;}
  .tw.a{background:#EAF9F1;border:2px solid #7FCEA9;color:var(--green-dark);}
  .tw.b{background:#FFF7ED;border:2px solid #FDBA74;color:#9A3412;}
  .tw .no2{flex:0 0 auto;border-radius:5px;padding:2px 8px;font-size:13px;color:#fff;}
  .tw.a .no2{background:#16A34A;} .tw.b .no2{background:#EA580C;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';

/* ① 4列だけのリスト */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="p1" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#p1)"><rect x="12" y="14" width="364" height="72" rx="9" fill="#fff" stroke="#C7D6EE" stroke-width="2"/>
    <rect x="12" y="14" width="364" height="22" rx="9" fill="#EAF1FE"/><rect x="12" y="26" width="364" height="10" fill="#EAF1FE"/>
    ${['実行日時','フロー名','削減時間','件数'].map((t,i)=>`<text x="${34+i*92}" y="30" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#1E40AF" text-anchor="middle">${t}</text>`).join('')}
    ${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${18+c*92}" y="${46+r*15}" width="${[62,74,44,26][c]}" height="7" rx="3.5" fill="${c===2?'#BFE7D3':'#C3D6F2'}"/>`).join('')).join('')}
  </g>
  <text x="194" y="98" font-family="Noto Sans JP" font-size="13.5" font-weight="900" fill="#1E40AF" text-anchor="middle">記録するのは4列だけ</text>
</svg>`;

/* ② 見積りで決める */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="p2" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#p2)"><rect x="12" y="16" width="150" height="34" rx="8" fill="#FFECEC" stroke="#DC2626" stroke-width="2.2"/>
    <text x="87" y="38" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#991B1B" text-anchor="middle">毎回ストップウォッチ</text></g>
  <g filter="url(#p2)"><rect x="12" y="56" width="150" height="34" rx="8" fill="#EAF9F1" stroke="#16A34A" stroke-width="2.4"/>
    <text x="87" y="78" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#0B5136" text-anchor="middle">見積りで固定する</text></g>
  <path d="M170 33 H 196" stroke="#DC2626" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M170 73 H 196" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
  <text x="292" y="39" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#991B1B" text-anchor="middle">続かない</text>
  <text x="292" y="79" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#0B5136" text-anchor="middle">一度決めたら変えない</text>
</svg>`;

/* ③ 合計 → グラフ */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="p3" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B5136" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#DCF3E7"/>
  <g filter="url(#p3)"><rect x="12" y="16" width="150" height="68" rx="9" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    ${[0,1,2].map(i=>`<rect x="24" y="${28+i*14}" width="${[100,84,112][i]}" height="7" rx="3.5" fill="#BFE7D3"/>`).join('')}
    <rect x="24" y="70" width="126" height="8" rx="4" fill="#16A34A"/></g>
  <text x="87" y="98" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#0B5136" text-anchor="middle">まずは合計だけ</text>
  <path d="M170 50 H 198" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M192 44 l8 6 l-8 6" fill="none" stroke="#16A34A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#p3)"><rect x="206" y="16" width="170" height="68" rx="9" fill="#fff" stroke="#EAB308" stroke-width="2.4"/>
    ${[0,1,2,3,4].map(i=>`<rect x="${222+i*30}" y="${72-[16,26,36,48,58][i]}" width="20" height="${[16,26,36,48,58][i]}" rx="3" fill="${i===4?'#EAB308':'#FDE68A'}"/>`).join('')}
    <path d="M216 72 H 366" stroke="#CBD5E1" stroke-width="1.8"/></g>
  <text x="291" y="98" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#92400E" text-anchor="middle">見栄えが要るならPower BI</text>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.115-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（1行足す → 分数を決める → 見せる）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">肝心なのは<b>削減時間を先に決めておく</b>こと。計測は大変なので、見積りで構いません</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>末尾に1行足す</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_sharepoint.png" alt="">項目の作成</div>
        <div class="cardb">
          <div class="cols4">
            <div class="c4r"><span class="ck">実行日時</span><span class="cvv">utcNow()</span></div>
            <div class="c4r"><span class="ck">フロー名</span><span class="cvv">請求書の自動保存</span></div>
            <div class="c4r"><span class="ck">削減時間</span><span class="cvv">8（分）</span></div>
            <div class="c4r"><span class="ck">件数</span><span class="cvv">1</span></div>
          </div>
          <div class="note">9時間ずれて見えるときは convertTimeZone でJSTに直します</div>
        </div>
      </div></div>
      <div class="cap">SharePointリスト（例：効果ログ）に<b>1行つくるだけ</b></div>
    </div>

    <div class="col info">
      <div class="ch2"><span class="n">2</span>分数を決める</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh">手作業なら何分かかるか（見積り）</div>
        <div class="cardb">
          <div class="est">
            <div class="er"><span class="en2">経費の申請 1件</span><span class="ev">15 分</span></div>
            <div class="er"><span class="en2">日報の集約</span><span class="ev">10 分</span></div>
            <div class="er"><span class="en2">請求書の保存</span><span class="ev">8 分</span></div>
            <div class="er"><span class="en2">承認の連絡</span><span class="ev">5 分</span></div>
          </div>
          <div class="note">一度決めたら変えないのがコツです</div>
        </div>
      </div></div>
      <div class="cap">動くのは<b>回数のほう</b>。分数は固定値で置いておく</div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>溜まった行を見せる</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh">見せ方は2段階</div>
        <div class="cardb">
          <div class="two">
            <div class="tw a"><span class="no2">まず</span>リストのビューで合計を出すだけ</div>
            <div class="tw b"><span class="no2">次に</span>そのリストをPower BIにつないでグラフに</div>
            <div class="tw a"><span class="no2">共有</span>業務ごとの合計で、月に1回まとめて出す</div>
          </div>
          <div class="note">見積りであることを添えて共有します</div>
        </div>
      </div></div>
      <div class="cap">合計だけでも伝わります。<b>最初から凝らない</b></div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>実測ではなく見積りだと添える</span><span>個人の評価には使わない</span>
      <span>業務ごとの合計で見せる</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「SharePoint コネクタ（項目の作成）」「日付と時刻の変換」／フロー名・数値は架空の例</div>
`;
</script>
</body>
</html>
