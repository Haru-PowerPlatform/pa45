<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.53-1 赤いエラーはCopilotに貼るだけ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-bg:#ECFDF5; --green-dark:#064E3B;
    --cop:#7C3AED; --cop-dark:#5B21B6;
    --cop-grad:linear-gradient(120deg,#7C3AED,#C026D3 55%,#EC4899);
    --orange:#EA580C; --amber:#D97706; --ink:#1F2937; --gray:#374151; --weak:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:88px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:15px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:48px;width:48px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:29px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:144px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .tatoe{margin:9px 16px 0;background:linear-gradient(180deg,#FFFBEB,#FEF3C7);border:1.5px solid #FAD77A;border-radius:11px;display:flex;align-items:center;gap:11px;padding:9px 15px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .tatoe .ti{flex:0 0 auto;width:27px;height:27px;color:var(--amber);}
  .tatoe .tt{font-weight:800;font-size:16.5px;color:#7A4A12;line-height:1.34;}
  .tatoe .tt b{color:var(--cop-dark);}

  .story{flex:1 1 auto;margin:12px 16px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .koma{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .khd{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;color:var(--ink);margin-bottom:8px;}
  .khd .kn{flex:0 0 auto;color:#fff;font-weight:900;font-size:14px;border-radius:999px;padding:4px 13px;box-shadow:0 2px 4px rgba(0,0,0,.22);}
  .koma.k1 .kn{background:linear-gradient(180deg,#C04358,#A4283C);} .koma.k2 .kn{background:var(--cop-grad);} .koma.k3 .kn{background:linear-gradient(180deg,#22C55E,#16A34A);}
  .kbody{flex:1;border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;min-height:0;box-shadow:0 5px 13px rgba(0,0,0,.12);}
  .koma.k1 .kbody{background:linear-gradient(180deg,#FDF6F7,#FAEDEF);border:2px solid #C97A89;}
  .koma.k2 .kbody{background:#FBFAFE;border:2px solid #C9B4EC;}
  .koma.k3 .kbody{background:linear-gradient(180deg,#F3FBF6,#E9F8EF);border:2px solid #7BCE9C;}
  .sarrow{flex:0 0 40px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;}
  .sarrow svg{width:34px;height:34px;}

  .errbn{background:#FDF3F4;border:1.5px solid #E8B4B9;border-radius:8px;padding:9px 12px;font-size:14px;font-weight:800;color:#8E2033;line-height:1.45;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .fcmini{background:#fff;border:1.5px solid #E5D5D8;border-radius:9px;padding:8px 11px;font-family:'Segoe UI','Noto Sans JP',sans-serif;display:flex;flex-direction:column;gap:3px;}
  .fcmini .t1{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:#242424;}
  .fcmini .t1 .cnt{margin-left:auto;font-size:11.5px;color:#8E2033;background:#FBE4E9;border-radius:999px;padding:1px 9px;font-weight:900;}
  .fcmini .t2{font-size:13px;font-weight:800;color:#D13438;}
  .errbn .et{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:#B4232F;margin-bottom:3px;}
  .errbn .et svg{width:14px;height:14px;}
  .kdesc{font-size:15.5px;font-weight:800;color:#5A3A42;line-height:1.45;}
  .kdesc b{color:#A4283C;}
  .koma.k2 .kdesc{color:#43307A;} .koma.k2 .kdesc b{color:var(--cop-dark);}
  .koma.k3 .kdesc{color:#274435;} .koma.k3 .kdesc b{color:var(--green-dark);}

  .bub{border-radius:11px;padding:9px 12px;font-size:14.5px;line-height:1.45;font-weight:700;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.06);font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .bub .who{display:flex;align-items:center;gap:6px;font-weight:900;font-size:11.5px;margin-bottom:3px;color:#5A6B85;}
  .bub .who img{width:15px;height:15px;object-fit:contain;}
  .bub.me{border:1.5px solid #C4B5FD;background:#EDE9FE;color:#3B3172;}
  .bub.me code{font-family:'Segoe UI','Noto Sans JP',sans-serif;background:#fff;border:1px solid #DDD3F0;border-radius:5px;padding:0 5px;font-size:12px;color:#8E2033;font-weight:800;}
  .bub.ai{border:1.5px solid #E4E1EC;color:#333;}
  .bub.ai b{color:var(--cop-dark);}

  .fixrow{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1.5px solid #BFE3CC;border-radius:9px;padding:8px 11px;font-size:14.5px;font-weight:800;color:#1F3D2D;font-family:'Segoe UI','Noto Sans JP',sans-serif;line-height:1.45;}
  .fixrow img{flex:0 0 auto;width:22px;height:22px;object-fit:contain;margin-top:2px;}
  .fixrow span{flex:1;}
  .fixrow b{color:var(--green-dark);}
  .donebadge{align-self:center;display:inline-flex;align-items:center;gap:8px;background:#DFF5E8;border:2px solid #6EE7A0;border-radius:999px;padding:7px 15px;font-weight:900;font-size:14.5px;color:#0B5E37;}
  .donebadge img{width:17px;height:17px;}

  .next{flex:0 0 auto;margin:11px 16px 12px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:18px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:24px;height:24px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 warn:'<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>'
};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.53-1</div>
    <img class="vol-logo" src="${A}icons/copilot_m365.png" alt="">
    <div class="title-text">赤いエラーで固まらない！<span class="hl">Copilotに“そのまま貼る”だけ</span></div>
    <img class="title-chara" src="${A}chara/chara_surprise.png" alt="">
  </div>

  <div class="tatoe">
    <span class="ti">${svg('globe')}</span>
    <span class="tt">たとえるなら…エラー文は<b>外国語の手紙</b>。読めなくていい、<b>通訳（Copilot）にそのまま渡せば</b>意味と返事の書き方まで教えてくれる。</span>
  </div>

  <div class="story">
    <div class="koma k1">
      <div class="khd"><span class="kn">1コマ目</span>エラーが出た</div>
      <div class="kbody">
        <div class="errbn"><span class="et">${svg('warn')}Power Automate の画面上部</span>'ファイルの作成' のパラメーターが無効です。エラー: 'フォルダーのパス' は必須です。</div>
        <div class="fcmini"><span class="t1">フロー チェッカー<span class="cnt">エラー (1)・警告 (0)</span></span><span class="t2">'フォルダーのパス' は必須です。</span></div>
        <div class="kdesc">保存を押したら赤い帯。<br><b>意味が分からず手が止まる</b>…。<br>ここで閉じてしまう人が一番多い。</div>
      </div>
    </div>

    <div class="sarrow">${svg('arrow')}</div>

    <div class="koma k2">
      <div class="khd"><span class="kn">2コマ目</span>そのまま貼る</div>
      <div class="kbody">
        <div class="bub me"><span class="who"><img src="${A}chara/chara_trouble.png" alt="">自分</span>保存しようとしたら<code>「'フォルダーのパス' は必須です。」</code>と出ました。<br><b>意味と直し方</b>を初心者向けに教えてください。</div>
        <div class="fcmini"><span class="t1">使うキーは2つだけ</span><span class="t2" style="color:#5B21B6;">Ctrl＋C（コピー）→ Ctrl＋V（貼り付け）</span></div>
        <div class="kdesc"><b>コピー→貼り付け→送信</b>。<br>エラー文を自分で解読しなくていい。<br>「いつ出たか」を添えると精度が上がる。</div>
      </div>
    </div>

    <div class="sarrow">${svg('arrow')}</div>

    <div class="koma k3">
      <div class="khd"><span class="kn">3コマ目</span>翻訳と直し方が届く</div>
      <div class="kbody">
        <div class="bub ai"><span class="who"><img src="${A}icons/copilot_m365.png" alt="">Copilot</span>よくあるエラーなので安心してください。<br>意味は「<b>どこのフォルダーに保存するの？<br>が未指定</b>」です。</div>
        <div class="fixrow"><img src="${A}icons/pa_onedrive.png" alt=""><span>直し方：📁から保存先を選ぶ<span style="white-space:nowrap">（例 <b>/メール添付</b>）</span>→保存。<br>直らなければ<b>入れ直すと直ることが多い</b>、<br>まで教えてくれる</span></div>
        <div class="donebadge"><img src="${A}icons/icon_check_green.png" alt="">1分で解決。エラーは怖くない</div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>コピペで使える<b>エラー質問テンプレ</b>と、回答の読みどころは<b>2枚目</b>で！</div>
  <div class="src">出典：Microsoft 365 Copilot 実機／Power Automate 実機（PA45 Demo）</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
