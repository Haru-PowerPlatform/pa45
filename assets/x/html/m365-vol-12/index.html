<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>M365 Copilot Vol.12-1 Edge の横の Copilot に開いたまま聞く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/mc-base.css">
<style>
  .stage{gap:10px;}
  /* Edge のウィンドウ（説明用の再現。ロゴは描かない） */
  .edge{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border:2px solid #AEB8C6;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,.2);font-family:"Segoe UI","Noto Sans JP",sans-serif;color:#242424;}
  .etabs{flex:0 0 34px;display:flex;align-items:flex-end;gap:4px;padding:0 10px;background:#DCE1E8;}
  .etab{height:28px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:8px 8px 0 0;font-size:15.5px;font-weight:700;color:#5F6368;white-space:nowrap;}
  .etab.on{background:#fff;color:#242424;}
  .etab .fv{width:14px;height:14px;border-radius:3px;background:#1E3A8A;flex:0 0 auto;}
  .etabs .wn{margin-left:auto;align-self:center;font-size:15.5px;font-weight:700;color:#5F6368;}
  .ebar{flex:0 0 42px;display:flex;align-items:center;gap:9px;padding:0 10px;background:#fff;border-bottom:1px solid #D9D9D9;}
  .ebar .nv{flex:0 0 auto;width:18px;height:18px;color:#5F6368;}
  .eurl{flex:1;min-width:0;height:29px;border-radius:15px;background:#F1F3F4;display:flex;align-items:center;gap:7px;padding:0 13px;font-size:15.5px;font-weight:500;color:#424242;white-space:nowrap;overflow:hidden;}
  .eurl svg{flex:0 0 auto;width:14px;height:14px;color:#5F6368;}
  .tagc{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-family:"Noto Sans JP",sans-serif;font-size:15.5px;font-weight:900;color:#fff;background:#EA580C;border-radius:999px;padding:2px 6px 2px 12px;white-space:nowrap;}
  .tagc svg{width:18px;height:18px;}
  .ecp{flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:2.5px solid #EA580C;background:#FFF7ED;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(234,88,12,.18);}
  .eav{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#2563EB;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .ebody{flex:1;min-height:0;display:flex;}
  /* 左：長いWebページ */
  .epage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;border-right:2px solid #C9CED6;background:#fff;}
  .epage .sh{flex:0 0 auto;background:#1E3A8A;color:#fff;font-size:15.5px;font-weight:700;padding:3px 14px;}
  .epage .pt{flex:0 0 auto;font-size:19px;font-weight:900;color:#111827;line-height:1.25;padding:7px 26px 0 14px;font-family:"Noto Sans JP",sans-serif;}
  .epage .meta{flex:0 0 auto;font-size:15.5px;color:#6B7280;padding:1px 26px 3px 14px;border-bottom:2px solid #1E3A8A;margin:0 26px 0 14px;padding-left:0;}
  .epage .sec{flex:0 0 auto;padding:5px 26px 0 14px;}
  .epage .sec h4{font-size:15.5px;font-weight:900;color:#1E3A8A;border-left:4px solid #1E3A8A;padding-left:7px;line-height:1.2;}
  .epage .sec p{font-size:15.5px;font-weight:500;color:#374151;line-height:1.42;margin-top:2px;}
  .epage .skel{flex:1;min-height:0;margin:7px 26px 0 14px;
    background:repeating-linear-gradient(180deg,#D5DAE1 0,#D5DAE1 7px,transparent 7px,transparent 19px);}
  .epage .fade{position:absolute;left:0;right:14px;bottom:0;height:46px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 85%);}
  .epage .more{position:absolute;left:50%;transform:translateX(-58%);bottom:5px;font-family:"Noto Sans JP",sans-serif;font-size:15.5px;font-weight:900;color:#fff;background:#6B7280;border-radius:999px;padding:1px 14px;white-space:nowrap;}
  .epage .sb{position:absolute;right:3px;top:4px;bottom:4px;width:9px;border-radius:5px;background:#ECEEF1;}
  .epage .sb i{position:absolute;left:1px;right:1px;top:3px;height:34px;border-radius:4px;background:#9AA3AF;}
  /* 右：サイド ペインの Copilot */
  .epane{flex:0 0 418px;display:flex;flex-direction:column;background:#F7F8FA;}
  .epane .ph2{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#fff;border-bottom:1px solid #E1DFDD;font-size:16.5px;font-weight:700;}
  .epane .ph2 .shd{width:20px;height:20px;flex:0 0 auto;}
  .epane .pbd{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:8px 10px;}
  .ask{align-self:flex-end;max-width:94%;background:#DDF3EF;border:1.5px solid #8FD9CC;border-radius:13px 13px 3px 13px;padding:6px 12px;font-size:17px;font-weight:700;color:#1B2A44;line-height:1.35;}
  .ans{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1.5px solid #E1DFDD;border-radius:13px 13px 13px 3px;padding:6px 11px 4px;box-shadow:0 2px 6px rgba(0,0,0,.07);}
  .ans .ah{flex:0 0 auto;display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:900;color:var(--mc-dark);}
  .ans .li{flex:1;min-height:0;display:flex;align-items:center;gap:9px;border-bottom:1.2px dashed #E5E7EB;}
  .ans .li:last-child{border-bottom:none;}
  .ans .li .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--mc);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .ans .li .k{flex:0 0 auto;font-size:15.5px;font-weight:900;color:#fff;background:#2563EB;border-radius:6px;padding:1px 8px;}
  .ans .li .k.y{background:#D97706;} .ans .li .k.r{background:#DC2626;}
  .ans .li .t{flex:1;font-size:17px;font-weight:700;color:#1B2A44;line-height:1.25;}
  .ans .li .t b{color:#B91C1C;font-weight:900;}
  .inp{flex:0 0 32px;display:flex;align-items:center;justify-content:flex-end;background:#fff;border:1.5px solid #C8CCD2;border-radius:16px;padding:0 6px;}
  .inp span{width:24px;height:24px;border-radius:50%;background:var(--mc);color:#fff;display:flex;align-items:center;justify-content:center;padding:5px;}
  /* 右列：ミニ図解カード */
  .side{flex:0 0 306px;display:flex;flex-direction:column;gap:8px;}
  .mc{flex:1;min-height:0;display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--mc-line);border-radius:12px;padding:5px 10px;box-shadow:0 3px 8px rgba(15,60,55,.12);}
  .mc svg{flex:0 0 auto;width:118px;height:93px;}
  .mc .t{font-size:19px;font-weight:900;color:var(--navy);line-height:1.25;}
  .mc .t small{display:block;font-size:15.5px;font-weight:700;color:#4B5563;line-height:1.3;margin-top:2px;}
  .bot2{flex:0 0 auto;display:flex;gap:10px;align-items:stretch;margin:8px 16px 0;}
  .bot2 .metric{flex:0 0 auto;margin:0;padding:5px 14px;}
  .bot2 .metric .mv{font-size:23px;}
  .bot2 .uses{flex:1;background:#fff;border:1.5px solid var(--mc-line);border-radius:10px;padding:4px 10px;}
  .next{margin-top:8px;padding:7px 18px;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  re:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'};
const CPI=(w)=>`<img class="msi" src="${A}icons/ms/copilot.png" alt="" style="width:${w||24}px;height:${w||24}px">`;
const SHD=`<svg class="shd" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.600-1.700-8-6-8-11V5z" fill="#16A34A"/><path d="M8 12l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="pills"><div class="vol-pill"><small>M365 Copilot</small>Vol.12-1</div><div class="lic-pill free">無料の Copilot Chat でできる</div></div>
    <div class="title-text">長いページは、Edge の横の Copilot に<br><span class="hl">開いたまま要点を聞く</span></div>
    <div class="title-apps"><img class="msi" src="${A}icons/ms/copilot.png" alt=""></div>
    <img class="title-chara" src="${A}chara/chara_surprise.png" alt="">
  </div>
  <div class="concl">
    <div class="chip app">${CPI(34)}</div>
    <div class="txt">Edge 右上の <b>Copilot アイコン</b>を選ぶと、ページの横にチャットが開きます。<br>表示中の Web ページや PDF を、<b>コピーも貼り付けもせず</b>に要約・質問できます</div>
  </div>
  <div class="stage">
    <div class="edge">
      <div class="etabs"><div class="etab on"><span class="fv"></span>省エネ設備導入補助金 公募要領</div><div class="etab">＋</div><span class="wn">Microsoft Edge</span></div>
      <div class="ebar">
        <span class="nv">${svgw(P.back,2.2)}</span><span class="nv">${svgw(P.re,2.2)}</span>
        <div class="eurl">${svgw(P.lock,2.2)}www.pref.example.jp/sangyo/shoene-hojo/koubo</div>
        <span class="tagc">ここから開く${svgw(P.arrow,3)}</span>
        <span class="ecp">${CPI(24)}</span>
        <span class="eav">山</span>
      </div>
      <div class="ebody">
        <div class="epage">
          <div class="sh">県 産業振興課｜事業者向けのお知らせ</div>
          <div class="pt">令和8年度 省エネ設備導入補助金 公募要領</div>
          <div class="meta">更新日：2026年11月2日</div>
          <div class="sec"><h4>1　事業の目的</h4><p>県内の中小企業者等が行う省エネルギー設備への<br>更新を支援し、エネルギーコストの低減を図る。</p></div>
          <div class="sec"><h4>2　補助対象者</h4><p>県内に事業所を有する中小企業者であって、<br>次の各号のいずれにも該当する者とする。</p></div>
          <div class="sec"><h4>3　補助対象経費</h4></div>
          <div class="skel"></div>
          <div class="fade"></div>
          <span class="more">この先も 第4〜第12 まで続く</span>
          <div class="sb"><i></i></div>
        </div>
        <div class="epane">
          <div class="ph2">${CPI(22)}Copilot${SHD}<span class="repro">画面は説明用の再現</span></div>
          <div class="pbd">
            <div class="ask">このページの要点を3つにまとめて</div>
            <div class="ans">
              <div class="ah">${CPI(20)}このページの要点は次の3つです</div>
              <div class="li"><span class="n">1</span><span class="k">対象</span><span class="t">県内に事業所がある<b>中小企業</b></span></div>
              <div class="li"><span class="n">2</span><span class="k y">補助</span><span class="t">費用の <b>1/2</b>・上限 <b>200万円</b></span></div>
              <div class="li"><span class="n">3</span><span class="k r">締切</span><span class="t"><b>12月18日（金）17時</b> 必着</span></div>
            </div>
            <div class="inp"><span>${svgw(P.up,3)}</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="mc">
        <svg viewBox="0 0 96 76"><defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE9C8"/><stop offset="1" stop-color="#F5C98A"/></linearGradient></defs>
          <ellipse cx="46" cy="70" rx="30" ry="4" fill="#000" opacity=".1"/>
          <rect x="20" y="10" width="52" height="58" rx="6" fill="url(#cb)" stroke="#C98B3A" stroke-width="2"/>
          <rect x="26" y="18" width="40" height="44" rx="2" fill="#fff" stroke="#E5E7EB"/>
          <rect x="35" y="5" width="22" height="11" rx="4" fill="#9CA3AF" stroke="#6B7280" stroke-width="1.5"/>
          <path d="M31 28h30M31 36h30M31 44h22M31 52h26" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
          <circle cx="74" cy="54" r="15" fill="#fff" stroke="#DC2626" stroke-width="4"/><path d="M64 64l20-20" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/></svg>
        <div class="t">コピーしない<small>範囲を選んで貼る<br>作業がいらない</small></div>
      </div>
      <div class="mc">
        <svg viewBox="0 0 96 76">
          <rect x="4" y="16" width="88" height="54" rx="6" fill="#fff" stroke="#AEB8C6" stroke-width="2"/>
          <path d="M4 30h88" stroke="#AEB8C6" stroke-width="2"/>
          <path d="M8 30v-9a5 5 0 0 1 5-5h26a5 5 0 0 1 5 5v9z" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
          <path d="M48 30v-7a4 4 0 0 1 4-4h22a4 4 0 0 1 4 4v7z" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
          <path d="M22 50h50M30 43l-8 7 8 7M64 43l8 7-8 7" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="47" cy="50" r="13" fill="#fff" stroke="#DC2626" stroke-width="4"/><path d="M38 59l18-18" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/></svg>
        <div class="t">タブを移らない<small>読んでいる画面の<br>横で答えが出る</small></div>
      </div>
      <div class="mc">
        <svg viewBox="0 0 96 76"><defs><linearGradient id="pf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient></defs>
          <ellipse cx="34" cy="71" rx="24" ry="3.500" fill="#000" opacity=".1"/>
          <path d="M12 6h30l14 14v48H12z" fill="url(#pf)" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round"/>
          <path d="M42 6v14h14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round"/>
          <rect x="6" y="30" width="38" height="18" rx="4" fill="#DC2626"/><text x="25" y="44" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="900" fill="#fff">PDF</text>
          <path d="M20 56h28M20 62h20" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
          <path d="M62 26h26a5 5 0 0 1 5 5v18a5 5 0 0 1-5 5H74l-8 8v-8h-4a5 5 0 0 1-5-5V31a5 5 0 0 1 5-5z" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.200" stroke-linejoin="round"/>
          <path d="M64 35h20M64 42h20M64 49h12" stroke="#0F766E" stroke-width="2.600" stroke-linecap="round"/></svg>
        <div class="t">PDF も同じ操作<small>Edge で開いた<br>約款や要領に聞く</small></div>
      </div>
    </div>
  </div>
  <div class="bot2">
    <div class="metric"><span class="ml">聞くまでの操作</span><span class="mv">コピーして貼る</span><span class="ar">${svgw(P.arrow,3)}</span><span class="mv to">開いたまま聞く</span></div>
    <div class="uses"><span class="ul">使いどころ</span><span class="u">官公庁のお知らせ</span><span class="u">取引先の製品ページ</span><span class="u">PDF の約款</span><span class="u">社内サイトの長い記事</span></div>
  </div>
  <div class="next">
    <span class="na">${svgw(P.arrow,2.6)}</span>
    <span><b>開き方は2枚目、聞き方5つは3枚目、使えない場面は4枚目へ</b></span>
  </div>
  <div class="src">出典：Microsoft Learn「Microsoft Copilot とは?」「Copilot in Edge Web ページの概要作成の動作」／画面と文面は説明用の再現（実画面は未確認）・団体名と人名は架空</div>
`;
</script>
</body>
</html>
