<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .left{flex:1.25;min-width:0;}
  .right{flex:1;min-width:0;}
  /* 時系列 */
  .tl{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding-left:4px;}
  .tl::before{content:"";position:absolute;left:112px;top:10px;bottom:10px;width:4px;background:var(--cs-line);border-radius:2px;}
  .row{flex:1;min-height:0;display:flex;align-items:center;gap:14px;position:relative;}
  .row .d{flex:0 0 94px;text-align:right;font-family:'Roboto Mono',"Noto Sans JP",monospace;font-size:18px;font-weight:700;color:var(--cs-dark);}
  .row .pt{flex:0 0 22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--cs);z-index:2;}
  .row .tx{flex:1;min-width:0;background:#fff;border:1.5px solid #E5E7EB;border-radius:10px;padding:6px 12px;
    font-size:17px;font-weight:700;color:var(--ink);line-height:1.35;box-shadow:0 2px 5px rgba(0,0,0,.06);}
  .row .tx b{color:var(--cs-dark);}
  .row .tx .s{display:block;font-size:14.5px;font-weight:700;color:var(--weak);}
  .row.done .pt{background:var(--cs);}
  .row.money .tx{border-color:#FCA5A5;background:#FEF2F2;} .row.money .pt{border-color:var(--red);}
  .row.money .tx b{color:var(--red-dark);}
  .today{position:absolute;left:0;right:0;height:0;border-top:2.5px dashed var(--green);z-index:3;}
  .today span{position:absolute;left:0;top:-13px;background:var(--green);color:#fff;font-size:14px;font-weight:900;
    border-radius:999px;padding:2px 10px;}
  /* 管理センターのモック */
  .adm{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--segline);border-radius:10px;
    overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.14);}
  .adm .top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 12px;background:#0F6CBD;color:#fff;font-size:15.5px;font-weight:600;}
  .adm .bc{flex:0 0 auto;padding:7px 12px 2px;font-size:15px;font-weight:600;color:#616161;}
  .adm .bc b{color:#242424;}
  .adm .srch{margin:6px 12px;display:flex;align-items:center;gap:8px;border:1.5px solid #8A8886;border-radius:4px;padding:5px 10px;
    font-size:15.5px;color:#242424;font-weight:600;}
  .adm .hit{margin:2px 12px;padding:6px 10px;background:#EFF6FC;border-left:4px solid #0F6CBD;font-size:16px;font-weight:700;color:#0F6CBD;}
  .adm .opts{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;padding:4px 16px 8px;}
  .opt{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#242424;}
  .opt .rd{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid #616161;position:relative;}
  .opt.on .rd{border-color:#0F6CBD;} .opt.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0F6CBD;}
  .opt .jp{font-family:"Noto Sans JP",sans-serif;font-size:14px;font-weight:700;color:var(--weak);}
  .opt.on .jp{color:var(--green);}
  .adm .save{align-self:flex-start;margin:0 16px 10px;background:#0F6CBD;color:#fff;font-size:15px;font-weight:700;border-radius:4px;padding:5px 18px;}
  .facts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin-top:9px;}
  .fact{display:flex;align-items:center;gap:9px;background:var(--cs-bg);border:1.5px solid var(--cs-line);border-radius:9px;
    padding:6px 11px;font-size:15.5px;font-weight:700;color:var(--ink);}
  .fact .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--cs);color:#fff;font-size:14px;font-weight:900;
    display:flex;align-items:center;justify-content:center;}
  .fact b{color:var(--cs-dark);}
</style>
</head>
