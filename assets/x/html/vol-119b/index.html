<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.119-2 資料に聞けるようにする作り方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .scene{height:100px;}
  .cardb{gap:5px;padding:7px 9px;}
  .col.ai{background:#F7F3FF;border:2.5px solid #C9B4F4;}
  .col.ai .ch2{color:#5B21B6;}
  .col.ai .ch2 .n{background:linear-gradient(180deg,#A78BFA,#6D28D9);}
  .col.ai .card{border-color:#C9B4F4;}
  .col.ai .cardh{background:#EDE4FF;border-bottom-color:#D8C9FA;color:#5B21B6;}
  .col.ai .cap{background:#E4D8FA;color:#5B21B6;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld .fl{font-size:14px;font-weight:900;color:#475569;}
  .fld .fi{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #B9C7DC;border-radius:7px;
    padding:5px 9px;font-size:15.5px;font-weight:900;color:var(--navy);line-height:1.24;}
  .fld .fi.hot{border-color:var(--orange);background:#FFF7ED;}
  .fld .fi img{width:22px;height:22px;object-fit:contain;flex:0 0 auto;}
  .prm{display:flex;flex-direction:column;gap:3px;background:#fff;border:2px solid #C9B4F4;border-radius:8px;padding:6px 9px;}
  .prm .pl{font-size:13.5px;font-weight:900;color:#7C3AED;}
  .prm .pt{font-size:15px;font-weight:700;color:#3B2A66;line-height:1.38;}
  .note{display:flex;align-items:center;gap:7px;background:#FFF7ED;border:1.6px solid #FDBA74;border-radius:8px;
    padding:4px 8px;font-size:14.5px;font-weight:900;color:#9A3412;line-height:1.24;}
  .ansc{display:flex;flex-direction:column;gap:5px;background:#fff;border:2px solid var(--green-line);border-radius:8px;padding:6px 9px;}
  .ansc .al2{font-size:13.5px;font-weight:900;color:var(--green-dark);}
  .ansc .av4{font-size:15.5px;font-weight:700;color:#334155;line-height:1.4;}
  .ansc .cit{font-size:14px;font-weight:700;color:var(--green-dark);background:#EAF9F1;border-radius:6px;padding:4px 8px;
    border-left:4px solid #16A34A;line-height:1.34;}
  .dest{display:flex;gap:6px;}
  .dest span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#F7F9FC;
    border:1.6px solid #DDE5F0;border-radius:7px;padding:4px 0;font-size:15px;font-weight:900;color:var(--navy);}
  .dest span img{width:20px;height:20px;object-fit:contain;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const VB='0 0 388 100';
const SPARK='<path d="M0 -13l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/><path d="M8.5 4.5l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z"/>';

/* ① ファイル → 本文テキスト */
const s1=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="x1" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A44" flood-opacity=".2"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#EDF3FA"/>
  <g filter="url(#x1)"><rect x="14" y="16" width="72" height="70" rx="7" fill="#fff" stroke="#C7D6EE" stroke-width="2"/>
    <path d="M62 16 h6 l18 18 v0 h-24 z" fill="#DCE6F5"/>
    <text x="50" y="60" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#1E40AF" text-anchor="middle">PDF</text></g>
  <path d="M96 51 H 124" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M118 45 l8 6 l-8 6" fill="none" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#x1)"><rect x="132" y="12" width="112" height="76" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2.4"/>
    ${[0,1,2,3,4,5].map(i=>`<rect x="144" y="${24+i*11}" width="${[86,72,88,64,80,70][i]}" height="5" rx="2.5" fill="#C3D6F2"/>`).join('')}
  </g>
  <text x="188" y="98" font-family="Noto Sans JP" font-size="12.5" font-weight="900" fill="#1E40AF" text-anchor="middle">本文テキスト</text>
  <text x="316" y="44" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#1E40AF" text-anchor="middle">読み込むのは</text>
  <text x="316" y="64" font-family="Noto Sans JP" font-size="14.5" font-weight="900" fill="#1E40AF" text-anchor="middle">この1アクション</text>
</svg>`;

/* ② 本文＋質問 → 回答＋根拠 */
const s2=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="x2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <filter id="x2" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B2A66" flood-opacity=".24"/></filter>
  </defs>
  <rect x="0" y="0" width="388" height="100" fill="#F3EEFF"/>
  <g filter="url(#x2)"><rect x="12" y="12" width="104" height="32" rx="7" fill="#fff" stroke="#B79CF0" stroke-width="2"/>
    <text x="64" y="33" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#5B21B6" text-anchor="middle">資料の本文</text></g>
  <g filter="url(#x2)"><rect x="12" y="56" width="104" height="32" rx="7" fill="#fff" stroke="#B79CF0" stroke-width="2"/>
    <text x="64" y="77" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#5B21B6" text-anchor="middle">質問</text></g>
  <path d="M124 28 C 142 28, 148 44, 156 48" stroke="#7C3AED" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M124 72 C 142 72, 148 56, 156 52" stroke="#7C3AED" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g filter="url(#x2)"><circle cx="186" cy="50" r="24" fill="url(#x2g)"/>
    <g transform="translate(186,50) scale(0.95)" fill="#fff">${SPARK}</g></g>
  <path d="M218 50 H 240" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M234 44 l8 6 l-8 6" fill="none" stroke="#7C3AED" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#x2)"><rect x="248" y="12" width="128" height="34" rx="7" fill="#fff" stroke="#7C3AED" stroke-width="2.4"/>
    <text x="312" y="34" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#5B21B6" text-anchor="middle">回答</text></g>
  <g filter="url(#x2)"><rect x="248" y="54" width="128" height="34" rx="7" fill="#fff" stroke="#7C3AED" stroke-width="2.4"/>
    <text x="312" y="76" font-family="Noto Sans JP" font-size="14" font-weight="900" fill="#5B21B6" text-anchor="middle">根拠（ページ）</text></g>
</svg>`;

/* ③ 返す先はTeamsでもメールでも */
const s3=`<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="x3" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B5136" flood-opacity=".22"/></filter></defs>
  <rect x="0" y="0" width="388" height="100" fill="#DCF3E7"/>
  <g filter="url(#x3)"><rect x="12" y="26" width="120" height="48" rx="9" fill="#fff" stroke="#16A34A" stroke-width="2.4"/>
    <rect x="24" y="38" width="86" height="6" rx="3" fill="#BFE7D3"/>
    <rect x="24" y="50" width="66" height="6" rx="3" fill="#BFE7D3"/>
    <rect x="24" y="60" width="78" height="5" rx="2.5" fill="#D6EFE1"/></g>
  <text x="72" y="18" font-family="Noto Sans JP" font-size="13" font-weight="900" fill="#0B5136" text-anchor="middle">回答＋根拠</text>
  <path d="M140 40 C 158 34, 166 28, 178 26" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M140 60 C 158 66, 166 72, 178 74" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g filter="url(#x3)"><rect x="184" y="8" width="192" height="38" rx="9" fill="#fff" stroke="#5B5FC7" stroke-width="2.4"/>
    <rect x="184" y="8" width="192" height="14" rx="9" fill="#5B5FC7"/><rect x="184" y="16" width="192" height="6" fill="#5B5FC7"/>
    <text x="280" y="19" font-family="Noto Sans JP" font-size="10.5" font-weight="900" fill="#fff" text-anchor="middle">Teams で返す</text>
    <rect x="196" y="30" width="120" height="6" rx="3" fill="#D6D8F2"/></g>
  <g filter="url(#x3)"><rect x="184" y="56" width="192" height="38" rx="9" fill="#fff" stroke="#0B6BCB" stroke-width="2.4"/>
    <rect x="184" y="56" width="192" height="14" rx="9" fill="#0B6BCB"/><rect x="184" y="64" width="192" height="6" fill="#0B6BCB"/>
    <text x="280" y="67" font-family="Noto Sans JP" font-size="10.5" font-weight="900" fill="#fff" text-anchor="middle">メールで返す</text>
    <rect x="196" y="78" width="140" height="6" rx="3" fill="#CFE0F5"/></g>
</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.119-2</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">作り方は<span class="hl">3ステップ</span>（読み込む → 聞く → 返す）</div>
    <img class="title-chara" src="${A}chara/chara_point.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">コツは<b>「資料をもとに答える・根拠も出す」と指示に書く</b>こと。<br>これが無いと一般論が返ります</div>
  </div>

  <div class="stage">
    <div class="col neutral">
      <div class="ch2"><span class="n">1</span>資料を読み込む</div>
      <div class="scene">${s1}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_sharepoint.png" alt="">ファイルのコンテンツの取得</div>
        <div class="cardb">
          <div class="fld"><span class="fl">サイトのアドレス</span><span class="fi">社内ポータル</span></div>
          <div class="fld"><span class="fl">ファイル識別子</span>
            <span class="fi"><img src="${A}icons/pa_sharepoint.png" alt="">経費精算規程_2026年度.pdf</span></div>
          <div class="note">出てくるのは、資料の本文テキストです</div>
        </div>
      </div></div>
      <div class="cap">置き場所はSharePointでもOneDriveでも構いません</div>
    </div>

    <div class="col ai">
      <div class="ch2"><span class="n">2</span>本文と質問を渡す</div>
      <div class="scene">${s2}</div>
      <div class="body"><div class="card">
        <div class="cardh"><img src="${A}icons/pa_logo.png" alt="">プロンプトの実行</div>
        <div class="cardb">
          <div class="prm"><span class="pl">指示</span>
            <span class="pt">渡した資料の中だけを根拠に答える。根拠にした条文とページも書く。資料に無ければ「規程には含まれていません」と答える。</span></div>
          <div class="fld"><span class="fl">入力</span>
            <span class="fi hot"><span class="dyn">資料の本文</span>＋<span class="dyn">質問</span></span></div>
        </div>
      </div></div>
      <div class="cap">「無ければ無いと言う」まで書くと、<b>作り話が減ります</b></div>
    </div>

    <div class="col good">
      <div class="ch2"><span class="n">3</span>答えを返す</div>
      <div class="scene">${s3}</div>
      <div class="body"><div class="card">
        <div class="cardh">返すのは2つセット</div>
        <div class="cardb">
          <div class="ansc"><span class="al2">回答</span>
            <span class="av4">日帰りの交通費は実費、上限15,000円です。</span>
            <span class="cit">根拠：第4条／経費精算規程_2026年度.pdf p.12</span></div>
          <div class="dest">
            <span><img src="${A}icons/pa_teams.png" alt="">Teams</span>
            <span><img src="${A}icons/pa_outlook.png" alt="">メール</span></div>
        </div>
      </div></div>
      <div class="cap">根拠つきで返すので、<b>そのまま人に転送できます</b></div>
    </div>
  </div>

  <div class="warnbar">
    <span class="na">${svgw(P.warn,2.4)}</span>
    <span class="ws"><span>長い資料はまとめて渡せないことがある（章ごとに分ける）</span>
      <span>M365 CopilotかAI Builderかは環境で異なる</span><span>機密資料の扱いは社内ルールに沿って</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Power Automate でプロンプトを使用する」「プロンプトのFAQ」「SharePointコネクタ」</div>
`;
</script>
</body>
</html>
