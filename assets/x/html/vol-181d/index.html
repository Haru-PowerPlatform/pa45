<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.181-4 通知の件名のひな形6つ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:14px;}
  .left{flex:0 0 430px;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .anat{flex:0 0 auto;background:#F8FAFC;border:2.5px solid #A9C6F5;border-radius:12px;padding:8px 10px 6px;}
  .anat .lb{font-size:17px;font-weight:900;color:#1E3A8A;margin-bottom:4px;}
  .anat svg{display:block;width:100%;height:auto;}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:2.5px solid #A9C6F5;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(20,40,90,.13);font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .win .wh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;font-size:15.5px;font-weight:700;color:#242424;}
  .repro{font-size:12.5px;font-weight:700;color:#8A8886;margin-left:auto;white-space:nowrap;}
  .mr{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:2px 10px 2px 9px;border-bottom:1px solid #EDEBE9;border-left:5px solid #0F6CBD;}
  .mr:last-child{border-bottom:none;}
  .mr .f{font-size:14px;font-weight:700;color:#605E5C;display:flex;}
  .mr .f span:last-child{margin-left:auto;color:#8A8886;}
  .mr .s{font-size:16px;font-weight:900;color:#242424;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mr .s b{color:#C2410C;}
  .mr.done{border-left-color:#C8C6C4;} .mr.done .s{color:#605E5C;font-weight:700;} .mr.done .s b{color:#15803D;}
  .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .tb .th{flex:0 0 auto;display:flex;gap:9px;font-size:15.5px;font-weight:900;color:#fff;background:#2563EB;border-radius:8px;padding:5px 12px;}
  .tb .th span:first-child{flex:0 0 196px;} .tb .th span:last-child{flex:1;}
  .trow{gap:10px;padding:4px 9px;}
  .trow .k{flex:0 0 196px;display:flex;align-items:center;gap:8px;font-size:18px;}
  .trow .k svg{flex:0 0 auto;width:40px;height:40px;}
  .trow .v{font-family:'Noto Sans JP',sans-serif;font-size:17px;font-weight:900;color:#1F2937;background:#fff;border:1.5px solid #DCE3EE;padding:5px 9px;line-height:1.3;word-break:normal;}
  .trow .v b{color:#C2410C;}
  .trow .v small{display:block;font-size:13.5px;font-weight:700;color:#6B7280;margin-top:1px;}
  .trow.hot .v{background:#FFF7ED;color:#1F2937;}
  .trow.gr .v b{color:#15803D;}
  .warnbar{margin-top:7px;padding:6px 14px;}
  .warnbar .wl{flex:0 0 auto;font-size:16px;font-weight:900;white-space:nowrap;}
  .warnbar .ws span b{color:#B91C1C;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'};
const MS=(n,w)=>`<img class="msi" src="${A}icons/ms/${n}" alt="" style="width:${w||24}px;height:${w||24}px">`;
const F=`font-family="Noto Sans JP" font-weight="900"`;
// ミニ図解（種類ごと）
const I={
 ans:`<svg viewBox="0 0 40 40"><rect x="6" y="4" width="24" height="31" rx="3" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><path d="M11 13h14M11 19h14M11 25h8" stroke="#93C5FD" stroke-width="2.4" stroke-linecap="round"/><g transform="translate(22 18) rotate(38)"><rect width="6" height="17" rx="1.5" fill="#EA580C"/><path d="M0 17l3 6 3-6z" fill="#FDE68A"/></g></svg>`,
 apv:`<svg viewBox="0 0 40 40"><rect x="5" y="6" width="30" height="28" rx="4" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><circle cx="20" cy="20" r="9" fill="none" stroke="#DC2626" stroke-width="2.6"/><text x="20" y="25" text-anchor="middle" font-size="12" fill="#DC2626" ${F}>印</text></svg>`,
 pre:`<svg viewBox="0 0 40 40"><rect x="5" y="8" width="30" height="27" rx="3" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><rect x="5" y="8" width="30" height="8" rx="3" fill="#2563EB"/><path d="M12 5v6M28 5v6" stroke="#1E40AF" stroke-width="2.6" stroke-linecap="round"/><rect x="21" y="21" width="9" height="9" rx="2" fill="#F59E0B"/></svg>`,
 over:`<svg viewBox="0 0 40 40"><circle cx="20" cy="21" r="14" fill="#fff" stroke="#DC2626" stroke-width="2.6"/><path d="M20 12v9l6 4" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" fill="none"/><circle cx="32" cy="9" r="6" fill="#DC2626"/><text x="32" y="13" text-anchor="middle" font-size="10" fill="#fff" ${F}>!</text></svg>`,
 done:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#16A34A"/><path d="M12 20l6 6 11-12" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 err:`<svg viewBox="0 0 40 40"><rect x="4" y="9" width="32" height="22" rx="4" fill="#fff" stroke="#6B7280" stroke-width="2.2"/><circle cx="12" cy="20" r="4" fill="#2563EB"/><circle cx="28" cy="20" r="4" fill="#9CA3AF"/><path d="M16 20h3M22 20h2" stroke="#DC2626" stroke-width="2.6"/><path d="M18 15l5 10" stroke="#DC2626" stroke-width="2.6" stroke-linecap="round"/></svg>`};
const tr=(cls,ic,k,v,n)=>`<div class="trow ${cls}"><span class="k">${I[ic]}${k}</span><span class="v">${v}<small>${n}</small></span></div>`;
const anat=`<svg viewBox="0 0 406 96">
  <rect x="2" y="4" width="402" height="38" rx="7" fill="#fff" stroke="#C8C6C4" stroke-width="1.6"/>
  <rect x="8" y="9" width="156" height="28" rx="5" fill="#FDBA74"/><text x="86" y="29" text-anchor="middle" font-size="16" fill="#7C2D12" ${F}>【11/27(金)まで</text>
  <rect x="166" y="9" width="78" height="28" rx="5" fill="#FCA5A5"/><text x="205" y="29" text-anchor="middle" font-size="16" fill="#7F1D1D" ${F}>・要回答】</text>
  <rect x="248" y="9" width="150" height="28" rx="5" fill="#BFDBFE"/><text x="323" y="29" text-anchor="middle" font-size="16" fill="#1E3A8A" ${F}>備品の棚卸し</text>
  <path d="M86 44v10M205 44v10M323 44v10" stroke="#64748B" stroke-width="2"/>
  <rect x="26" y="56" width="120" height="32" rx="16" fill="#EA580C"/><text x="86" y="78" text-anchor="middle" font-size="16" fill="#fff" ${F}>① 期限</text>
  <rect x="152" y="56" width="106" height="32" rx="16" fill="#DC2626"/><text x="205" y="78" text-anchor="middle" font-size="16" fill="#fff" ${F}>② 状態</text>
  <rect x="264" y="56" width="118" height="32" rx="16" fill="#2563EB"/><text x="323" y="78" text-anchor="middle" font-size="16" fill="#fff" ${F}>③ 対象</text></svg>`;
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.181-4</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">通知メールの件名、<br><span class="hl">種類別のひな形6つ</span>（保存用）</div>
    <img class="title-chara" src="${A}chara/chara_smile.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">件名は<b>【期限・状態】＋対象</b>の順にそろえます。同じフローの通知が何通あっても、一覧で区別できます</div>
  </div>
  <div class="stage">
    <div class="left">
      <div class="anat"><div class="lb">件名の組み立て</div>${anat}</div>
      <div class="win"><div class="wh">${MS('outlook.svg',26)}受信トレイ（ひな形を使った例）<span class="repro">画面は説明用の再現</span></div>
        <div class="mr"><div class="f"><span>佐藤 花子</span><span>11/20 9:00</span></div><div class="s"><b>【11/27(金)まで・要回答】</b>備品の棚卸し</div></div>
        <div class="mr"><div class="f"><span>佐藤 花子</span><span>11/26 9:00</span></div><div class="s"><b>【明日まで・未回答】</b>備品の棚卸し</div></div>
        <div class="mr done"><div class="f"><span>佐藤 花子</span><span>11/26 14:12</span></div><div class="s"><b>【完了・対応不要】</b>備品の棚卸し</div></div>
      </div>
    </div>
    <div class="tb">
      <div class="th"><span>通知の種類</span><span>件名のひな形（例）</span></div>
      ${tr('','ans','回答依頼','<b>【11/27(金)まで・要回答】</b>備品の棚卸し','期限と、やることを先頭に')}
      ${tr('','apv','承認待ち','<b>【承認待ち・11/27(金)まで】</b>出張申請（鈴木 一郎）','誰の申請かを末尾に')}
      ${tr('hot','pre','期限前','<b>【明日まで・未回答】</b>備品の棚卸し','未回答の人にだけ送る')}
      ${tr('hot','over','期限超過','<b>【期限超過・11/27(金)締切】</b>備品の棚卸し','締切日を残して、過ぎたことを示す')}
      ${tr('gr','done','完了のお知らせ','<b>【完了・対応不要】</b>備品の棚卸し 回答受付','開かなくてよいことを先頭に')}
      ${tr('','err','エラー','<b>【要確認・フロー停止】</b>棚卸し集計 11/20 9:00','止まったフロー名と時刻を')}
    </div>
  </div>
  <div class="warnbar">
    <span class="na" style="width:30px;height:30px;color:#C2410C">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws"><span>日付は formatDateTime(期限,'M/d') で出せます。<b>曜日は手入力か、実機で式を確かめてから</b></span><span>【】の言葉は、チーム内で1つに決めておく</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「Office 365 Outlook」コネクタ（Send an email (V2)：Subject）・「式関数のリファレンス」formatDateTime／件名・人名・日付は架空（2026-11-27＝金曜）・画面は説明用の再現</div>
`;
</script>
</body>
</html>
