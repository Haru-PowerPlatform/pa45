<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条件UI（HTML再現）出来栄えプレビュー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EEF1F5;font-family:'Noto Sans JP',sans-serif;color:#1F2937;
       display:flex;flex-direction:column;align-items:center;gap:26px;padding:40px 16px;}
  h1{font-size:18px;font-weight:900;margin:0;color:#374151;}
  .note{font-size:13px;color:#6B7280;margin:-14px 0 0;}
  .stage{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start;justify-content:center;}
  .panel{background:#fff;border-radius:10px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .cap{font-size:12px;color:#9CA3AF;font-weight:700;margin:0 0 10px;}

  /* ===== 条件UI 再現（新デザイナー風） ===== */
  .uimock-cond{background:#fff;border-radius:8px;padding:8px 12px 9px;
    box-shadow:0 3px 7px rgba(0,0,0,.18);
    font-family:'Segoe UI','Noto Sans JP',sans-serif;color:#323130;width:520px;}
  .uimock-cond .ql{font-size:13px;font-weight:600;color:#323130;}
  .uimock-cond .ql .rq{color:#D13438;}
  .uimock-cond .qs{font-size:11.5px;color:#605E5C;margin:2px 0 8px;}
  .uimock-cond .andbox{display:inline-flex;align-items:center;gap:18px;border:1px solid #D1D1D1;border-radius:4px;padding:4px 9px;font-size:12.5px;color:#323130;margin-bottom:8px;}
  .uimock-cond .cv{color:#8A8886;font-size:10px;}
  .uimock-cond .condrow{display:flex;align-items:center;gap:8px;}
  .uimock-cond .fld{position:relative;border:1px solid #D1D1D1;border-radius:4px;padding:6px 10px;font-size:12.5px;background:#fff;}
  .uimock-cond .fld.val{flex:1;min-width:0;color:#A19F9D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .uimock-cond .fld.op{flex:0 0 auto;display:flex;align-items:center;gap:16px;color:#323130;}
  .uimock-cond .dots{color:#605E5C;font-weight:700;flex:0 0 auto;font-size:14px;}
  .uimock-cond .fbadge{position:absolute;top:-11px;left:-9px;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(180deg,#F59E0B,#D97706);color:#fff;font-weight:900;font-size:13px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4);
    font-family:'Noto Sans JP',sans-serif;}
  .uimock-cond .addrow{margin-top:8px;display:inline-flex;align-items:center;gap:7px;border:1px solid #D1D1D1;border-radius:4px;padding:5px 10px;font-size:12.5px;color:#323130;}

  /* 2倍サイズ版（拡大してもくっきり確認用） */
  .x2{transform:scale(1.7);transform-origin:top left;}
  .x2wrap{width:884px;height:200px;overflow:hidden;}
</style>
</head>
<body>
  <h1>条件アクション設定UI ─ HTML再現の出来栄え</h1>
  <p class="note">左＝実寸（スライドで使うサイズ感）／右＝1.7倍に拡大（くっきり＝画像でない証拠）</p>

  <div class="stage">
    <div class="panel">
      <p class="cap">実寸</p>
      <div class="uimock-cond">
        <div class="ql">Condition expression <span class="rq">*</span></div>
        <div class="qs">比較する値を指定し、使用する演算子を選択します。</div>
        <div class="andbox">かつ <span class="cv">▼</span></div>
        <div class="condrow">
          <div class="fld val"><span class="fbadge">1</span>値を選択します</div>
          <div class="fld op"><span class="fbadge">2</span>等しい <span class="cv">▼</span></div>
          <div class="fld val"><span class="fbadge">3</span>値を選択します</div>
          <span class="dots">⋯</span>
        </div>
        <div class="addrow">＋ 行を追加する <span class="cv">▼</span></div>
      </div>
    </div>

    <div class="panel">
      <p class="cap">1.7倍に拡大</p>
      <div class="x2wrap">
        <div class="x2">
          <div class="uimock-cond">
            <div class="ql">Condition expression <span class="rq">*</span></div>
            <div class="qs">比較する値を指定し、使用する演算子を選択します。</div>
            <div class="andbox">かつ <span class="cv">▼</span></div>
            <div class="condrow">
              <div class="fld val"><span class="fbadge">1</span>値を選択します</div>
              <div class="fld op"><span class="fbadge">2</span>等しい <span class="cv">▼</span></div>
              <div class="fld val"><span class="fbadge">3</span>値を選択します</div>
              <span class="dots">⋯</span>
            </div>
            <div class="addrow">＋ 行を追加する <span class="cv">▼</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
