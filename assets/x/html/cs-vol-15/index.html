<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>コパスタ Vol.15-1 失敗は、だまって起きる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/cs-base.css">
<style>
  .body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;}
  .cat{min-height:0;display:flex;gap:11px;border-radius:12px;padding:9px 12px;background:#fff;
    border:2px solid var(--red-line);box-shadow:0 4px 11px rgba(0,0,0,.12);}
  .cat .ctxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .cat .ch4{display:flex;align-items:center;gap:8px;}
  .cat .no8{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font-size:14px;
    font-weight:900;display:flex;align-items:center;justify-content:center;}
  .cat .hd5{flex:1;font-size:18px;font-weight:900;color:var(--red-dark);line-height:1.2;}
  .cat .cd{font-size:14.5px;font-weight:700;color:#475569;line-height:1.36;}
  .cat .cd b{color:var(--red-dark);}
  .cat .mock{flex:0 0 176px;border-radius:8px;overflow:hidden;background:#F8F9FA;border:1px solid #E1DFDD;
    display:flex;flex-direction:column;justify-content:center;gap:4px;padding:7px 9px;
    font-family:"Segoe UI","Noto Sans JP",sans-serif;}
  .mock .mr{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#242424;}
  .mock .mr .b1{flex:0 0 auto;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:900;color:#fff;}
  .mock .mr .b1.ok{background:#16A34A;} .mock .mr .b1.ng{background:#DC2626;} .mock .mr .b1.gy{background:#A19F9D;}
  .mock .code4{font-family:'Roboto Mono',monospace;font-size:11.5px;font-weight:700;color:#FCA5A5;background:#1E293B;
    border-radius:5px;padding:4px 6px;line-height:1.34;word-break:break-all;}
  .mock .bub2{background:#F3F2F1;border:1px solid #E1DFDD;border-radius:9px 9px 9px 2px;padding:5px 8px;
    font-size:12px;font-weight:700;color:#242424;line-height:1.36;}
  .mock .zero2{text-align:center;font-family:'Roboto Mono',monospace;font-size:22px;font-weight:700;color:#DC2626;}
  .mock .lb{text-align:center;font-size:11.5px;font-weight:900;color:#616161;}
  .mock .bars{display:flex;align-items:flex-end;gap:4px;height:36px;}
  .mock .bars i{flex:1;background:#EDEBE9;border-radius:2px;height:3px;}
  .mock .rng{display:flex;align-items:center;gap:5px;border:1px solid #C8C6C4;border-radius:3px;padding:2px 6px;
    font-size:11px;font-weight:700;color:#616161;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">コパスタ Vol.15</div>
    <div class="part-pill">前編 <b>(1/2)</b></div>
    <div class="title-text">Copilot Studio の失敗は、<br>会話に出てこない<span class="q">。</span></div>
    <img class="title-chara" src="${A}chara/chara_think_g.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">結論</div>
    <div class="txt">エラーは<b>会話の外側</b>で起きます。<br>
      見た目は成功しているので、<em>気づかずに通り過ぎます</em>。</div>
  </div>

  <div class="body">
    <div class="cat">
      <div class="ctxt">
        <div class="ch4"><span class="no8">1</span><span class="hd5">回答は成功、道具だけ落ちる</span></div>
        <div class="cd">クレジット不足だと <b>HTTP 403</b> でツールだけ失敗。会話はふつうに返るので、記録が抜けたことに気づかない</div>
      </div>
      <div class="mock">
        <div class="mr"><span class="b1 ok">✓</span>回答</div>
        <div class="mr"><span class="b1 ng">✕</span>ツール</div>
        <div class="code4">InsufficientMcsCredits</div>
      </div>
    </div>

    <div class="cat">
      <div class="ctxt">
        <div class="ch4"><span class="no8">2</span><span class="hd5">取り次ぎ失敗が、言い訳に化ける</span></div>
        <div class="cd">専門AIへの委任が落ちても、受付AIが<b>それらしい文章を作って返す</b>。原因が見えず、調べようがない</div>
      </div>
      <div class="mock">
        <div class="bub2">ただいまPA45の案内係が混み合っており…</div>
        <div class="lb">← これはAIの創作</div>
      </div>
    </div>

    <div class="cat">
      <div class="ctxt">
        <div class="ch4"><span class="no8">3</span><span class="hd5">正しく断ると、0%になる</span></div>
        <div class="cd">「今日の天気は？」に設計どおり断っても、General quality では <b>0% / Fail</b>。2回とも同じで再現性あり</div>
      </div>
      <div class="mock">
        <div class="zero2">0%</div>
        <div class="mr"><span class="b1 ng">Fail</span>今日の天気は？</div>
        <div class="lb">断るのが正解でも減点</div>
      </div>
    </div>

    <div class="cat">
      <div class="ctxt">
        <div class="ch4"><span class="no8">4</span><span class="hd5">Monitorが全部0に見える</span></div>
        <div class="cd">壊れているのではなく、<b>期間が合っていない</b>だけのことがある。Time range をまず疑う</div>
      </div>
      <div class="mock">
        <div class="rng">Time range：8/5 - 8/11</div>
        <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="lb">会話 0 ／ クレジット 0</div>
      </div>
    </div>
  </div>

  <div class="darkband">
    <div class="nf">
      <div class="label">共通しているのは1つ</div>
      <div class="grid">
        <div class="fc"><div class="ft">① 会話は止まらない</div><div class="fd">失敗しても、AIは何かしら返してくる</div></div>
        <div class="fc"><div class="ft">② 結果を見に行く</div><div class="fd">台帳・送信箱・実行履歴など、外側を自分で確かめる</div></div>
        <div class="fc"><div class="ft">③ 数字を疑う</div><div class="fd">0点・0件が出たら、まず条件のほうを見る</div></div>
      </div>
    </div>
    <div class="note">
      <div class="label">⚠ 同じ0%でも</div>
      <div class="txt"><b>Error と Fail は別もの</b>です。<br>
        見分け方は<b>後編</b>で。</div>
    </div>
    <div class="src">出典：PA45 Demo環境での実機（文言は実際に出たもの）／画面は説明用の再現です</div>
  </div>
  <img class="band-chara" src="${A}chara/chara_point_g.png" alt="">
`;
</script>
</body>
</html>
