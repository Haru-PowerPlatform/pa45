<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.72-1 名刺を撮るだけで連絡先台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB;--blue-dark:#1E40AF;--green:#16A34A;--green-dark:#0B5E37;
    --ink:#1F2937;--gray:#374151;--weak:#6B7280;--orange:#EA580C;--red:#DC2626;
    --purple:#7C3AED;--purple-dark:#5B21B6;--sp:#0B7C66;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}

  .titlebar{height:86px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:14px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:25px;border-radius:999px;padding:7px 19px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .logos{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .logos .ll{height:47px;width:47px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;}
  .logos .ll svg{width:100%;height:100%;}
  .logos .plus{color:#fff;font-weight:900;font-size:23px;text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1;}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-42px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:9px 16px 0;background:#EFF6FF;border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:9px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 3px 6px rgba(0,0,0,.26);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.4;padding-right:96px;}
  .concl .txt b{color:var(--red);}
  .concl .txt .g{color:var(--green-dark);}
  .concl .txt .p{color:var(--purple-dark);}

  .stage{flex:1 1 auto;margin:12px 15px 0;display:flex;align-items:stretch;gap:0;min-height:0;}
  .col{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .carrow{flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;font-size:26px;font-weight:900;}
  .colcard{flex:1;background:#F8FAFC;border:1.5px solid #C9D2E0;border-radius:14px;box-shadow:0 5px 13px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;}
  .cnum{position:absolute;top:-11px;left:-9px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:6;border:2.5px solid #fff;}
  .chd{flex:0 0 auto;text-align:center;font-weight:900;font-size:17px;color:#fff;padding:9px 8px;line-height:1.2;}
  .c1 .chd{background:linear-gradient(180deg,#12937A,#0B6B58);}
  .c2 .chd{background:linear-gradient(180deg,#8B5CF6,#6D28D9);}
  .c3 .chd{background:linear-gradient(180deg,#22A366,#15803D);}
  .cbd{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;font-family:'Segoe UI','Noto Sans JP',sans-serif;justify-content:flex-start;}

  .scene{flex:0 0 auto;height:150px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;border:1.5px solid;position:relative;overflow:hidden;}
  .c1 .scene{background:linear-gradient(180deg,#E6F5F1,#CFEDE5);border-color:#9BD8CB;}
  .c2 .scene{background:linear-gradient(180deg,#F1EBFE,#E0D2FB);border-color:#C4B0F2;}
  .c3 .scene{background:linear-gradient(180deg,#EAF7EF,#D4F1DE);border-color:#A6E1BC;}
  .scene svg{height:100%;width:auto;}
  .sc-chara{position:relative;z-index:2;height:118px;width:auto;flex:0 0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));}

  .ccap{flex:0 0 auto;margin-top:auto;text-align:center;font-size:14.5px;font-weight:800;line-height:1.3;padding:0 2px;}
  .c1 .ccap{color:#0B5E4C;} .c2 .ccap{color:#5B21B6;} .c3 .ccap{color:#15803D;}
  .ccap b{color:#111;}

  /* ① スマホで名刺撮影mock */
  .phone{flex:1 1 auto;display:flex;align-items:center;justify-content:center;}
  .phone .dev{width:150px;height:100%;max-height:186px;background:#111827;border-radius:20px;padding:7px 7px 9px;box-shadow:0 6px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;}
  .phone .scr{flex:1;background:#0B1220;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;}
  .phone .vf{flex:1;position:relative;background:linear-gradient(160deg,#1F2937,#0B1220);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .phone .bc{width:112px;height:66px;background:#fff;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.5);padding:8px 9px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .phone .bc .co{font-size:8px;font-weight:900;color:#2563EB;}
  .phone .bc .nm{font-size:11px;font-weight:900;color:#1F2937;}
  .phone .bc .ti{font-size:7px;font-weight:700;color:#6B7280;}
  .phone .bc .ct{margin-top:2px;height:2px;width:80%;background:#C7CDD6;border-radius:1px;}
  .phone .corner{position:absolute;width:15px;height:15px;border:2.5px solid #38E0C0;}
  .phone .corner.tl{top:16px;left:14px;border-right:none;border-bottom:none;}
  .phone .corner.tr{top:16px;right:14px;border-left:none;border-bottom:none;}
  .phone .corner.bl{bottom:46px;left:14px;border-right:none;border-top:none;}
  .phone .corner.br{bottom:46px;right:14px;border-left:none;border-top:none;}
  .phone .shutter{flex:0 0 auto;height:36px;display:flex;align-items:center;justify-content:center;background:#0B1220;}
  .phone .shutter .sb{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #0B1220,0 0 0 5px #fff;}

  /* ② AI抽出mock */
  .extract{flex:1 1 auto;display:flex;gap:8px;align-items:stretch;}
  .extract .bcp{flex:0 0 92px;background:#fff;border:1.5px solid #C4B0F2;border-radius:8px;position:relative;padding:9px 8px;box-shadow:0 3px 7px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:4px;}
  .extract .bcp .co{font-size:8.5px;font-weight:900;color:#6D28D9;}
  .extract .bcp .nm{font-size:11px;font-weight:900;color:#2A1B48;}
  .extract .bcp .rl{height:2.5px;background:#D8D2E8;border-radius:2px;}
  .extract .bcp .hlbox{position:absolute;left:5px;right:5px;height:13px;border:1.6px solid #7C3AED;border-radius:3px;background:rgba(124,58,237,.10);}
  .extract .bcp .hl1{top:16px;} .extract .bcp .hl2{top:34px;} .extract .bcp .hl3{bottom:10px;}
  .extract .bcp .scan{position:absolute;left:0;right:0;height:12px;top:40px;background:linear-gradient(180deg,rgba(56,224,192,0),rgba(124,58,237,.35),rgba(56,224,192,0));}
  .extract .out{flex:1;background:#fff;border:1.5px solid #C4B0F2;border-radius:9px;box-shadow:0 3px 7px rgba(0,0,0,.1);display:flex;flex-direction:column;overflow:hidden;}
  .extract .out .oh{flex:0 0 auto;background:#F1EBFE;color:#5B21B6;font-size:11.5px;font-weight:900;padding:5px 9px;border-bottom:1.5px solid #DCCDF7;display:flex;align-items:center;gap:6px;}
  .extract .out .orow{flex:1;display:flex;align-items:center;padding:3px 9px;border-bottom:1px solid #F1EDFA;gap:6px;}
  .extract .out .orow:last-child{border-bottom:none;}
  .extract .out .orow .k{flex:0 0 42px;font-size:10px;font-weight:800;color:#7C6BA8;}
  .extract .out .orow .val{flex:1;font-size:12px;font-weight:900;color:#2A1B48;text-align:right;}

  /* ③ 連絡先台帳mock */
  .ledger{flex:1 1 auto;background:#fff;border:1.5px solid #BDE6CD;border-radius:11px;overflow:hidden;box-shadow:0 3px 7px rgba(0,0,0,.1);display:flex;flex-direction:column;}
  .ledger .lh{flex:0 0 auto;display:flex;background:#EAF7EF;border-bottom:1.5px solid #CDEBD8;}
  .ledger .lh span{padding:6px 8px;font-size:11px;font-weight:900;color:#15803D;}
  .ledger .lh .n{flex:1;} .ledger .lh .c{flex:0 0 92px;border-left:1px solid #CDEBD8;}
  .lrow{flex:1;display:flex;border-bottom:1px solid #EDF6F0;align-items:center;font-size:11.5px;font-weight:700;color:#2C3B33;}
  .lrow:last-child{border-bottom:none;}
  .lrow .n{flex:1;padding:4px 8px;display:flex;align-items:center;gap:6px;}
  .lrow .n .av{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:#CDEBD8;color:#15803D;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .lrow .n .who b{display:block;font-weight:900;color:#243;font-size:11.5px;}
  .lrow .n .who small{font-size:9.5px;color:#6B7280;font-weight:700;}
  .lrow .c{flex:0 0 92px;padding:4px 8px;font-size:10px;color:#5B6270;border-left:1px solid #EDF6F0;align-self:stretch;display:flex;align-items:center;word-break:break-all;}
  .lrow.new{background:#EAF9F0;position:relative;}
  .lrow.new .who b{color:#0B5E37;}
  .lrow.new .newtag{position:absolute;right:4px;top:-9px;background:#16A34A;color:#fff;font-size:9px;font-weight:900;border-radius:6px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.25);}

  .uses{flex:0 0 auto;margin:11px 15px 12px;display:flex;align-items:stretch;gap:9px;}
  .ulabel{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:15px;border-radius:11px;padding:0 15px;text-align:center;line-height:1.25;box-shadow:0 3px 8px rgba(37,99,235,.32);}
  .uc{flex:1;background:#F8F9FA;border:2px solid #D7E0EC;border-radius:11px;padding:9px 12px;box-shadow:0 2px 6px rgba(0,0,0,.07);display:flex;align-items:center;gap:10px;}
  .uc .em{font-size:24px;flex:0 0 auto;}
  .uc .ut{font-size:16px;font-weight:800;color:#33405a;line-height:1.28;}
  .uc .ut b{color:var(--blue-dark);}
  .src{position:absolute;left:16px;bottom:3px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";

// AI Builder アイコン（紫グラデ＋白スパークル）
const AIBLD=`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="abg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#abg)"/>
  <path d="M16 6 L18.4 13.6 L26 16 L18.4 18.4 L16 26 L13.6 18.4 L6 16 L13.6 13.6 Z" fill="#fff"/>
  <path d="M24.5 6 L25.6 9.4 L29 10.5 L25.6 11.6 L24.5 15 L23.4 11.6 L20 10.5 L23.4 9.4 Z" fill="#fff" opacity=".9"/>
</svg>`;

// 情景①：名刺の山＋スマホでスキャン
const scene1=`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="72" cy="142" rx="52" ry="7" fill="rgba(11,94,76,.10)"/>
  <!-- 名刺の山（重なり） -->
  <g transform="rotate(-8 52 96)"><rect x="16" y="86" width="72" height="42" rx="4" fill="#EAF0F5" stroke="#B7C2CE" stroke-width="1.6"/></g>
  <g transform="rotate(-3 52 92)"><rect x="18" y="80" width="72" height="42" rx="4" fill="#F3F6FA" stroke="#B7C2CE" stroke-width="1.6"/></g>
  <g transform="rotate(3 54 84)"><rect x="20" y="70" width="72" height="44" rx="4" fill="#fff" stroke="#9FB0C0" stroke-width="1.8"/>
    <rect x="26" y="77" width="26" height="5" rx="2" fill="#2563EB"/>
    <rect x="26" y="87" width="34" height="4" rx="2" fill="#334155"/>
    <rect x="26" y="95" width="24" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="26" y="102" width="30" height="3" rx="1.5" fill="#94A3B8"/></g>
  <!-- キラッ -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity=".85"><line x1="30" y1="30" x2="30" y2="18"/><line x1="18" y1="40" x2="8" y2="34"/><line x1="44" y1="24" x2="50" y2="15"/></g>
  <!-- スマホでスキャン -->
  <g transform="rotate(7 112 74)"><rect x="90" y="26" width="50" height="96" rx="12" fill="#111827" stroke="#0B1220" stroke-width="2"/>
    <rect x="95" y="34" width="40" height="80" rx="5" fill="#0B1220"/>
    <rect x="100" y="52" width="30" height="20" rx="2" fill="#fff" opacity=".92"/>
    <rect x="103" y="56" width="14" height="3" rx="1.5" fill="#2563EB"/><rect x="103" y="62" width="20" height="2.4" rx="1.2" fill="#94A3B8"/>
    <g stroke="#38E0C0" stroke-width="2.4" fill="none"><path d="M99 51 h6 M99 51 v6"/><path d="M131 51 h-6 M131 51 v6"/><path d="M99 73 h6 M99 73 v-6"/><path d="M131 73 h-6 M131 73 v-6"/></g>
    <circle cx="115" cy="106" r="6" fill="#fff"/><circle cx="115" cy="106" r="4.2" fill="none" stroke="#111827" stroke-width="1.4"/>
  </g>
</svg>`;

// 情景②：AIが名刺を読み取る（名刺＋走査＋AIバッジ）
const scene2=`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(124,58,237,0)"/><stop offset=".5" stop-color="rgba(124,58,237,.5)"/><stop offset="1" stop-color="rgba(124,58,237,0)"/></linearGradient></defs>
  <ellipse cx="70" cy="142" rx="50" ry="7" fill="rgba(91,33,182,.12)"/>
  <!-- 名刺 -->
  <rect x="20" y="40" width="112" height="72" rx="6" fill="#fff" stroke="#B7A6E0" stroke-width="2"/>
  <rect x="30" y="50" width="34" height="7" rx="2" fill="#6D28D9"/>
  <rect x="30" y="64" width="52" height="7" rx="2" fill="#334155"/>
  <rect x="30" y="78" width="30" height="4" rx="2" fill="#9A8FC0"/>
  <!-- 抽出ハイライト -->
  <rect x="27" y="47" width="42" height="14" rx="3" fill="rgba(124,58,237,.10)" stroke="#7C3AED" stroke-width="1.8"/>
  <rect x="27" y="61" width="60" height="14" rx="3" fill="rgba(124,58,237,.10)" stroke="#7C3AED" stroke-width="1.8"/>
  <rect x="86" y="86" width="40" height="13" rx="3" fill="rgba(124,58,237,.14)" stroke="#7C3AED" stroke-width="1.8"/>
  <rect x="92" y="90" width="28" height="4" rx="2" fill="#6D28D9"/>
  <!-- 走査線 -->
  <rect x="20" y="66" width="112" height="14" fill="url(#scanG)"/>
  <!-- AIバッジ -->
  <g transform="translate(104 22)"><circle cx="16" cy="16" r="16" fill="#7C3AED" stroke="#fff" stroke-width="2"/>
    <path d="M16 7 L17.6 13 L23 15 L17.6 17 L16 23 L14.4 17 L9 15 L14.4 13 Z" fill="#fff"/></g>
</svg>`;

// 情景③：連絡先台帳に自動追加（人物リスト＋✓＋キラッ）
const scene3=`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="74" cy="142" rx="52" ry="7" fill="rgba(21,128,61,.10)"/>
  <rect x="24" y="22" width="102" height="100" rx="8" fill="#fff" stroke="#7FC79C" stroke-width="2.4"/>
  <!-- 既存2件 -->
  <g><circle cx="42" cy="44" r="9" fill="#DFF3E7"/><path d="M42 40 a3 3 0 1 1 0 6 a3 3 0 1 1 0 -6 M36 52 a6 5 0 0 1 12 0 z" fill="#7FBF98"/>
     <rect x="58" y="39" width="40" height="5" rx="2.5" fill="#9DBBA9"/><rect x="58" y="48" width="56" height="4" rx="2" fill="#C7DBCE"/></g>
  <g><circle cx="42" cy="72" r="9" fill="#DFF3E7"/><path d="M42 68 a3 3 0 1 1 0 6 a3 3 0 1 1 0 -6 M36 80 a6 5 0 0 1 12 0 z" fill="#7FBF98"/>
     <rect x="58" y="67" width="34" height="5" rx="2.5" fill="#9DBBA9"/><rect x="58" y="76" width="50" height="4" rx="2" fill="#C7DBCE"/></g>
  <!-- 新規（緑ハイライト） -->
  <rect x="25" y="94" width="100" height="27" fill="#C9EFD7"/>
  <circle cx="42" cy="107" r="9" fill="#16A34A"/><path d="M42 103 a3 3 0 1 1 0 6 a3 3 0 1 1 0 -6 M36 115 a6 5 0 0 1 12 0 z" fill="#fff"/>
  <rect x="58" y="102" width="38" height="5" rx="2.5" fill="#2E9E63"/><rect x="58" y="111" width="52" height="4" rx="2" fill="#7FD3A0"/>
  <!-- チェック -->
  <g transform="translate(104 90)"><circle cx="14" cy="14" r="13" fill="#16A34A" stroke="#fff" stroke-width="2"/><path d="M8 14.5 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- キラッ -->
  <g stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" opacity=".85"><line x1="32" y1="16" x2="32" y2="6"/><line x1="22" y1="22" x2="14" y2="17"/><line x1="44" y1="16" x2="49" y2="8"/></g>
</svg>`;

const s=document.getElementById('slide');
s.innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.72-1</div>
    <div class="logos"><img class="ll" src="${A}icons/pa_logo.png" alt=""><span class="plus">＋</span><span class="ll">${AIBLD}</span></div>
    <div class="title-text">名刺は撮るだけ、<span class="hl">連絡先台帳に“勝手に”たまる</span></div>
    <img class="title-chara" src="${A}chara/chara_surprise.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">📇</div>
    <div class="txt">もらった名刺の山、結局そのまま<b>引き出しに眠りがち</b>ですよね。<br>スマホで撮るだけで、<span class="p">AIが会社名・氏名・電話・メールを読み取り</span>、連絡先台帳に<span class="g">自動で追加</span>します。</div>
  </div>

  <div class="stage">
    <div class="col c1">
      <div class="cnum">1</div>
      <div class="colcard">
        <div class="chd">名刺をスマホで撮る</div>
        <div class="cbd">
          <div class="scene">${scene1}<img class="sc-chara" src="${A}chara/chara_smile.png" alt=""></div>
          <div class="phone">
            <div class="dev"><div class="scr">
              <div class="vf">
                <div class="bc"><span class="co">〇〇商事株式会社</span><span class="nm">営業部　鈴木 一郎</span><span class="ti">主任</span><span class="ct"></span></div>
                <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
              </div>
              <div class="shutter"><div class="sb"></div></div>
            </div></div>
          </div>
          <div class="ccap">名刺管理ソフト不要／もらった名刺を<b>1枚パシャッ</b></div>
        </div>
      </div>
    </div>
