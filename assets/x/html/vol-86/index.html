<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>X技術Tips Vol.86-1 テストでメールを飛ばさずに試せる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-bg:#EFF6FF; --blue-dark:#1E40AF;
    --green:#16A34A; --green-dark:#065F46;
    --red:#DC2626; --red-dark:#991B1B; --orange:#EA580C; --ol:#0F6CBD; --violet:#7C3AED;
    --ink:#1F2937; --gray:#374151; --weak:#6B7280; --line:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#52555c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Noto Sans JP",sans-serif;}
  #slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--gray);}
  .ic{display:block;width:100%;height:100%;}

  .titlebar{height:90px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(0,0,0,.06) 100%),linear-gradient(135deg,#1D4ED8 0%,#2563EB 52%,#3B82F6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.92),inset 0 2px 1px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 14px rgba(30,58,138,.36);display:flex;align-items:center;gap:16px;padding:0 24px;position:relative;flex:0 0 auto;z-index:5;}
  .vol-pill{background:#fff;color:var(--blue);font-weight:900;font-size:26px;border-radius:999px;padding:7px 20px;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .vol-logo{height:50px;width:50px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);}
  .title-text{color:#fff;font-weight:900;font-size:27px;line-height:1.14;text-shadow:0 1px 2px rgba(0,0,0,.18);padding-right:150px;}
  .title-text .hl{color:#FFE08A;}
  .title-chara{position:absolute;right:14px;bottom:-40px;height:142px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}

  .concl{margin:10px 16px 0;background:var(--blue-bg);border:2.5px solid var(--blue);border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 18px;flex:0 0 auto;box-shadow:0 4px 11px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .concl .chip{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);}
  .concl .txt{font-weight:800;font-size:19.5px;color:var(--blue-dark);line-height:1.34;padding-right:150px;}
  .concl .txt b{color:var(--orange);}

  .stage{flex:1 1 auto;margin:12px 16px 0;display:flex;align-items:stretch;gap:14px;min-height:0;}

  /* 左：静的な結果の設定 */
  .setting{flex:1.05;display:flex;flex-direction:column;min-height:0;background:#fff;border:2px solid #D3DCEA;border-radius:14px;box-shadow:0 5px 13px rgba(0,0,0,.12);overflow:hidden;}
  .sth{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#FBFCFE,#EEF2F8);border-bottom:1px solid #E2E8F1;}
  .sth .sq{width:38px;height:38px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;}
  .sth .sq img{width:34px;height:34px;}
  .sth .nm{font-weight:900;font-size:18px;color:var(--ink);}
  .sth .beaker{margin-left:auto;font-size:14px;font-weight:900;color:#fff;background:var(--violet);border-radius:8px;padding:5px 11px;}
  .stb{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .toggle{display:flex;align-items:center;gap:13px;background:#F5F0FF;border:2px solid #C9B4EC;border-radius:12px;padding:12px 15px;}
  .toggle .tl{font-size:18px;font-weight:900;color:#5B21B6;}
  .toggle .sw{margin-left:auto;width:60px;height:32px;border-radius:999px;background:var(--violet);position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.2);}
  .toggle .sw::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle .on{font-size:14px;font-weight:900;color:var(--violet);}
  .fake{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0;}
  .fakerow{display:flex;align-items:center;gap:11px;background:#F8FAFC;border:1.5px solid #E2E8F1;border-radius:11px;padding:11px 14px;}
  .fakerow .k{font-size:15px;font-weight:800;color:var(--weak);flex:0 0 120px;}
  .fakerow .v{font-size:17px;font-weight:900;color:#243B58;}
  .fakerow .v.ok{color:var(--green-dark);}
  .fakerow.big{flex:1;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;background:#ECFDF5;border:2px solid #7EDCAD;}
  .fakerow.big .head{font-size:15px;font-weight:900;color:var(--green-dark);}
  .fakerow.big .body{font-size:20px;font-weight:900;color:#15803D;line-height:1.3;}
  .fakerow.big .body .s{font-size:15px;color:#065F46;}

  /* 右：受信箱の比較 */
  .cmp{flex:.92;display:flex;flex-direction:column;min-height:0;gap:11px;}
  .box{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:13px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1);}
  .box.bad{border:2.5px solid #F3A6A6;}
  .box.good{border:2.5px solid #7EDCAD;}
  .bxh{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 12px;font-weight:900;font-size:15.5px;}
  .box.bad .bxh{background:#FEECEC;color:var(--red-dark);}
  .box.good .bxh{background:#ECFDF5;color:var(--green-dark);}
  .bxh .tag{margin-left:auto;font-size:12px;font-weight:900;color:#fff;border-radius:6px;padding:2px 8px;}
  .box.bad .tag{background:var(--red);} .box.good .tag{background:var(--green);}
  .bxb{flex:1;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-height:0;background:#fff;justify-content:center;}
  .mrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#7A1F1F;background:#FEF2F2;border:1px solid #F5C0C0;border-radius:7px;padding:5px 9px;}
  .mrow .dot{width:8px;height:8px;border-radius:50%;background:var(--red);}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--green-dark);}
  .empty .big{font-size:40px;}
  .empty .t{font-size:19px;font-weight:900;}
  .empty .s{font-size:14px;font-weight:800;color:#059669;}

  .next{flex:0 0 auto;margin:9px 16px 14px;background:linear-gradient(180deg,#EAF2FF,#DCEAFE);border:2.5px solid var(--blue);border-radius:13px;padding:11px 18px;display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;color:var(--blue-dark);box-shadow:0 3px 9px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.7);}
  .next .na{flex:0 0 auto;width:26px;height:26px;color:var(--blue);}
  .next b{color:var(--orange);}
  .src{position:absolute;left:16px;bottom:4px;font-size:10px;color:#AEB6C2;font-weight:700;z-index:3;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>'};
const svg=(n)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.86-1</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">テストのたび本物のメールが飛ぶ問題｜<span class="hl">“静的な結果”で飛ばさず試す</span></div>
    <img class="title-chara" src="${A}chara/chara_think.png" alt="">
  </div>

  <div class="concl">
    <div class="chip">${svg('bulb')}</div>
    <div class="txt">アクションの<b>「静的な結果」</b>をオンにすると、そのアクションは<b>実行されず“偽の成功”を返します</b>。メールを飛ばさずフローを最後まで試せます。</div>
  </div>

  <div class="stage">
    <div class="setting">
      <div class="sth"><span class="sq"><img src="${A}icons/pa_outlook.png" alt=""></span><span class="nm">メールの送信 (V2)</span><span class="beaker">🧪 テスト</span></div>
      <div class="stb">
        <div class="toggle"><span class="tl">静的な結果</span><span class="on">オン</span><span class="sw"></span></div>
        <div class="fake">
          <div class="fakerow"><span class="k">状態</span><span class="v ok">成功（Succeeded）</span></div>
          <div class="fakerow"><span class="k">実際の送信</span><span class="v">しない（スキップ）</span></div>
          <div class="fakerow big"><span class="head">このアクションは…</span><span class="body">偽の結果を返すだけ<br><span class="s">→ 後続のステップは“成功した前提”で普通に動く</span></span></div>
        </div>
      </div>
    </div>

    <div class="cmp">
      <div class="box bad">
        <div class="bxh">静的な結果 オフ（ふつうにテスト）<span class="tag">✕ 本物が飛ぶ</span></div>
        <div class="bxb">
          <div class="mrow"><span class="dot"></span>【テスト】お知らせ … 取引先へ誤送信</div>
          <div class="mrow"><span class="dot"></span>【テスト】お知らせ … 100人に一斉送信</div>
          <div class="mrow"><span class="dot"></span>【テスト】お知らせ … また届いた</div>
        </div>
      </div>
      <div class="box good">
        <div class="bxh">静的な結果 オン<span class="tag">✓ 飛ばない</span></div>
        <div class="bxb"><div class="empty"><span class="big">📭</span><span class="t">受信箱は 0 通</span><span class="s">でもフローは最後まで検証できる</span></div></div>
      </div>
    </div>
  </div>

  <div class="next"><span class="na">${svg('arrow')}</span>新デザイナーの<b>ビーカー(テスト)</b>から設定する<b>手順</b>と注意は <b>2枚目</b>へ！</div>
  <div class="src">出典：Microsoft Learn（フローのテスト／アクションの静的な結果 プレビュー）／画面は再現・データは架空</div>
`;
</script>
<script>
(function(){function fit(){var s=document.getElementById('slide');if(!s)return;if(window.innerWidth<1240){s.style.zoom=Math.min(window.innerWidth/1280,window.innerHeight/720);}else{s.style.zoom=1;}}window.addEventListener('resize',fit);fit();})();
</script>
</body>
</html>
