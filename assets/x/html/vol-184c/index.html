<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Vol.184-3 止まってから気づく→先に手を打つ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/tips-base.css">
<style>
  .stage{gap:10px;}
  .col.bad{flex:0 0 400px;}
  .col.good{flex:1;}
  .scene{height:112px;}
  .tl{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;}
  .ev{flex:1;min-height:0;display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid #F0AEAE;border-radius:9px;padding:3px 10px;}
  .ev .d{flex:0 0 auto;min-width:70px;text-align:center;font-size:15.5px;font-weight:900;color:#fff;background:#B91C1C;border-radius:6px;padding:2px 6px;}
  .ev .t{font-size:16px;font-weight:700;color:#1B2A44;line-height:1.3;}
  .ev .t b{color:#B91C1C;}
  .fx{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;}
  .fc{min-width:0;min-height:0;display:flex;flex-direction:column;gap:5px;background:#fff;border:2px solid #7FCEA9;border-radius:11px;padding:7px 9px;box-shadow:0 3px 8px rgba(6,95,70,.10);}
  .fc .h{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;color:#065F46;line-height:1.2;}
  .fc .h .n{flex:0 0 auto;width:30px;height:30px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(180deg,#34D399,#16A34A);}
  .fc .bd{flex:1;min-height:0;display:flex;gap:8px;align-items:stretch;}
  .fc .pic{flex:0 0 112px;border-radius:8px;background:#DCF3E7;position:relative;overflow:hidden;}
  .fc .pic svg{position:absolute;inset:0;width:100%;height:100%;}
  .fc .mk{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:3px;font-family:'Segoe UI','Noto Sans JP',sans-serif;}
  .fc .mk .row{font-size:15.5px;font-weight:700;color:#242424;line-height:1.3;}
  .fc .mk .v{display:inline-block;font-family:'Roboto Mono',monospace;font-size:15.5px;font-weight:700;color:#1E40AF;background:#EAF1FE;border:1.5px solid #C7D6EE;border-radius:6px;padding:0 6px;}
  .fc .mk .sm{font-size:15.5px;font-weight:700;color:#4B5563;line-height:1.3;}
  .fc .mk .sm b{color:#B45309;}
  .metric{margin:0;}
  .bot2{flex:0 0 auto;display:flex;gap:10px;align-items:stretch;margin:8px 16px 0;}
  .bot2 .uses{flex:1;background:#fff;border:1.5px solid #A9C6F5;border-radius:10px;padding:4px 10px;}
  .warnbar{margin-top:8px;}
  .warnbar .wl{font-weight:900;font-size:16px;white-space:nowrap;}
</style>
</head>
<body>
<div id="slide"></div>
<script>
const A="../../pptx/_assets/";
const svgw=(p,sw)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.4}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12l5 5 9-10"/>',arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'};
const V=(inner)=>`<svg viewBox="0 0 112 90" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
/* Before 情景：止まったフローと山積みの「?」 */
const scBad=`<svg viewBox="0 0 370 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(14 20)"><rect x="0" y="0" width="120" height="86" rx="8" fill="#fff" stroke="#B91C1C" stroke-width="2"/>
  <rect x="0" y="0" width="120" height="18" rx="8" fill="#B91C1C"/><rect x="0" y="10" width="120" height="8" fill="#B91C1C"/>
  <rect x="10" y="28" width="100" height="14" rx="3" fill="#FDE2E2"/><rect x="10" y="48" width="100" height="14" rx="3" fill="#FDE2E2"/><rect x="10" y="68" width="60" height="10" rx="3" fill="#E5E7EB"/>
  <circle cx="22" cy="35" r="5" fill="#DC2626"/><circle cx="22" cy="55" r="5" fill="#DC2626"/></g>
  <rect x="150" y="48" width="70" height="34" rx="17" fill="#9CA3AF" stroke="#6B7280" stroke-width="2"/><circle cx="167" cy="65" r="13" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <text x="200" y="71" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" font-family="Noto Sans JP">オフ</text>
  <g font-family="Noto Sans JP" font-weight="900" fill="#DC2626"><text x="160" y="34" font-size="24">?</text><text x="196" y="28" font-size="18">?</text><text x="232" y="40" font-size="22">?</text></g></svg>`;
/* After 情景：通知が自分に届く */
const scGood=`<svg viewBox="0 0 690 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F6EE"/></linearGradient></defs>
  <g transform="translate(20 22)"><rect x="0" y="0" width="150" height="84" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2"/>
  <rect x="0" y="0" width="150" height="18" rx="8" fill="#16A34A"/><rect x="0" y="10" width="150" height="8" fill="#16A34A"/>
  <rect x="12" y="28" width="126" height="14" rx="3" fill="#DCF3E7"/><rect x="12" y="48" width="126" height="14" rx="3" fill="#FDE2E2"/>
  <circle cx="24" cy="35" r="5" fill="#16A34A"/><circle cx="24" cy="55" r="5" fill="#DC2626"/><rect x="12" y="68" width="80" height="10" rx="3" fill="#E5E7EB"/></g>
  <path d="M180 64h120" stroke="#16A34A" stroke-width="3.5" stroke-dasharray="8 6"/><path d="M294 56l10 8-10 8" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(318 30)"><rect x="0" y="0" width="118" height="72" rx="7" fill="url(#gm)" stroke="#16A34A" stroke-width="2"/>
  <path d="M0 4l59 36 59-36" fill="none" stroke="#16A34A" stroke-width="2"/>
  <circle cx="110" cy="6" r="13" fill="#DC2626"/><text x="110" y="11.5" font-size="15" font-weight="900" fill="#fff" text-anchor="middle" font-family="Noto Sans JP">!</text></g>
  <text x="377" y="122" font-size="15" font-weight="900" fill="#065F46" text-anchor="middle" font-family="Noto Sans JP">失敗したその日に届く</text></svg>`;
const f1=V(`<rect x="10" y="12" width="92" height="66" rx="7" fill="#fff" stroke="#16A34A" stroke-width="2"/>
  <rect x="10" y="12" width="92" height="14" rx="7" fill="#0F6CBD"/><rect x="10" y="20" width="92" height="6" fill="#0F6CBD"/>
  <circle cx="56" cy="52" r="18" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/><path d="M56 42v10l8 5" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>`);
const f2=V(`<rect x="8" y="10" width="44" height="22" rx="5" fill="#fff" stroke="#6B7280" stroke-width="2"/><rect x="60" y="10" width="44" height="22" rx="5" fill="#FDE2E2" stroke="#DC2626" stroke-width="2"/>
  <circle cx="82" cy="21" r="6" fill="#DC2626"/>
  <path d="M82 32v14M82 46h-26" stroke="#16A34A" stroke-width="3" fill="none"/><path d="M56 46v10" stroke="#16A34A" stroke-width="3"/>
  <rect x="24" y="58" width="64" height="24" rx="5" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <path d="M34 64l22 12 22-12" fill="none" stroke="#16A34A" stroke-width="2"/>`);
const f3=V(`<rect x="10" y="14" width="92" height="62" rx="7" fill="#fff" stroke="#16A34A" stroke-width="2"/>
  <rect x="10" y="14" width="92" height="14" rx="7" fill="#DC2626"/><rect x="10" y="22" width="92" height="6" fill="#DC2626"/>
  <rect x="20" y="36" width="72" height="7" rx="3" fill="#CBD5E1"/><rect x="20" y="48" width="56" height="7" rx="3" fill="#E2E8F0"/>
  <rect x="20" y="61" width="40" height="11" rx="4" fill="#16A34A"/>
  <circle cx="92" cy="16" r="11" fill="#F59E0B"/><path d="M92 10v7M92 20v1" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`);
const f4=V(`<g fill="#fff" stroke="#16A34A" stroke-width="2"><rect x="8" y="22" width="40" height="48" rx="5"/><rect x="64" y="22" width="40" height="48" rx="5"/></g>
  <rect x="8" y="22" width="40" height="11" rx="5" fill="#0F6CBD"/><rect x="64" y="22" width="40" height="11" rx="5" fill="#7C3AED"/>
  <path d="M50 46h12" stroke="#16A34A" stroke-width="3"/><path d="M58 41l5 5-5 5" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="56" font-size="12" font-weight="900" fill="#1E3A8A" text-anchor="middle" font-family="Noto Sans JP">送る</text>
  <text x="84" y="56" font-size="12" font-weight="900" fill="#5B21B6" text-anchor="middle" font-family="Noto Sans JP">受ける</text>`);
document.getElementById('slide').innerHTML=`
  <div class="titlebar">
    <div class="vol-pill">Vol.184-3</div>
    <img class="vol-logo" src="${A}icons/pa_logo.png" alt="">
    <div class="title-text">止まってから気づくのをやめて、<br><span class="hl">止まる前に知らせが届く</span>形にする</div>
    <img class="title-chara" src="${A}chara/chara_guts.png" alt="">
  </div>
  <div class="concl">
    <div class="chip">${svgw(P.bulb,2.2)}</div>
    <div class="txt">承認には<b>自分で期限</b>を入れ、失敗したら<b>自分にメール</b>が来るようにしておく。<br>Microsoft からの修復のヒントのメールも、オフにしないで受け取ります</div>
  </div>
  <div class="stage">
    <div class="col bad">
      <div class="ph"><span class="mk">${svgw(P.x,3)}</span>止まってから気づく</div>
      <div class="scene">${scBad}<img class="chara" src="${A}chara/chara_cry.png" alt=""></div>
      <div class="tl">
        <div class="ev"><span class="d">11/17</span><span class="t">接続が切れて<b>失敗</b>。誰も見ていない</span></div>
        <div class="ev"><span class="d">12/1</span><span class="t">失敗続きで<b>フローが自動でオフ</b></span></div>
        <div class="ev"><span class="d">12/15</span><span class="t">集計が来ないと言われて<b>初めて開く</b></span></div>
        <div class="ev"><span class="d">12/15</span><span class="t">11/17 の履歴は<b>もう画面に出ない</b></span></div>
      </div>
    </div>
    <div class="col good">
      <div class="ph"><span class="mk">${svgw(P.ok,3)}</span>先に手を打っておく</div>
      <div class="scene">${scGood}<img class="chara" src="${A}chara/chara_smile.png" alt=""></div>
      <div class="fx">
        <div class="fc"><div class="h"><span class="n">1</span>承認に自分で期限を入れる</div><div class="bd"><div class="pic">${f1}</div><div class="mk">
          <div class="row">承認アクションの設定</div><div class="row">タイムアウト <span class="v">P14D</span></div><div class="sm"><b>30日より前</b>に<br>催促・代理へ回す</div></div></div></div>
        <div class="fc"><div class="h"><span class="n">2</span>失敗したら自分にメール</div><div class="bd"><div class="pic">${f2}</div><div class="mk">
          <div class="row">メールの送信 (V2)</div><div class="sm">前の手順が<b>失敗・タイムアウト</b><br>のときだけ動かす</div></div></div></div>
        <div class="fc"><div class="h"><span class="n">3</span>修復のヒントのメールを残す</div><div class="bd"><div class="pic">${f3}</div><div class="mk">
          <div class="row">失敗すると所有者に届く</div><div class="sm">フローごとに<b>オフにできる</b>。<br>受け取る設定のままに</div></div></div></div>
        <div class="fc"><div class="h"><span class="n">4</span>30日を超えそうなら2本に</div><div class="bd"><div class="pic">${f4}</div><div class="mk">
          <div class="row">承認を Dataverse に保存</div><div class="sm">送るフローと<br>返事を受けるフロー</div></div></div></div>
      </div>
    </div>
  </div>
  <div class="warnbar">
    <span class="na" style="width:30px;height:30px;color:#C2410C">${svgw(P.warn,2.4)}</span>
    <span class="wl">使う前に確認</span>
    <span class="ws"><span>期限は P14D（14日）のような ISO 8601 の書き方</span><span>Dataverse を使う形はライセンスと環境を確認</span></span>
  </div>
  <div class="src">出典：Microsoft Learn「クラウド フローのエラー コード リファレンス」「クラウド フローのトラブルシューティング」「堅牢なエラー処理を採用する」「承認ワークフローを作成し、テストします」（2026-11-19 確認）／日付は架空・画面は説明用の再現・実画面は未確認</div>
`;
</script>
</body>
</html>
